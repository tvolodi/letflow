# REQ-136: GitHub Actions CI running the backend gate.
#
# Design note (kept inline -- this is infra config, not an Elixir module or
# a data model, so a separate lib/letflow/design/ doc would just restate
# this file; see CODE-DESIGNER's handoff for the full reasoning).
#
# 1. Postgres image match (acceptance criterion 3).
#    docker-compose.yml:3            image: postgres:16
#    this file, `services.postgres.image` below:   postgres:16
#    Kept byte-for-byte identical on purpose: the backend gate's `mix test`
#    step runs real Ecto migrations, and a version drift between dev/CI
#    Postgres is exactly the kind of thing this CI is meant to catch, not
#    introduce.
#
# 2. Why `mix letflow.check` and nothing else.
#    `mix letflow.check` is the existing alias (mix.exs) that already runs
#    the full local gate: toolchain-pin check, requirements-registration
#    check, deferral-staleness check, handoff lint, `format --check-formatted`,
#    `compile --warnings-as-errors`, and the test suite (which itself runs
#    `ecto.create --quiet` + `ecto.migrate --quiet` before `test`, via this
#    project's own `test` alias). REQ-136 is scoped to wiring this existing
#    command into CI-as-a-service, not to changing what the gate checks --
#    if the gate is ever found to be missing a step, that is a change to
#    REQ-013's alias and is filed as its own requirement/finding, not folded
#    in here. Hence exactly one `run: mix letflow.check` step below, and
#    nothing hand-rolled alongside it.
#
# 3. Job-key structure for REQ-138 (future frontend job).
#    This job is declared as `jobs.backend`, not as an implicit single
#    top-level job or under a generic/unnamed key. REQ-138 (frontend gate,
#    `npm run check`, blocked on REQ-115) is scoped to add `jobs.frontend`
#    as a sibling of `jobs.backend` under the same `on: [push, pull_request]`
#    triggers -- a pure append, touching none of this job's keys (`steps`,
#    `services`, `runs-on`, etc.). Nothing about this file needs to be
#    restructured for that to happen.
#
# Toolchain versions: read from .tool-versions (elixir 1.20.3-otp-29,
# erlang 29.0.5, rust 1.97.1) via setup-beam's version-file input (Elixir/OTP)
# and a shell step feeding dtolnay/rust-toolchain@stable (Rust, REQ-165 --
# there is no version-file: input on that action, so the pinned value is read
# out of .tool-versions by a preceding step and threaded in via
# $GITHUB_OUTPUT) rather than hardcoded here, so CI and local
# `mix letflow.check_toolchain` can never silently drift apart -- the same
# file backs both.
#
# WASMEX_BUILD: true on "Run backend gate" (REQ-165): without it, `wasmex`'s
# own rustler_precompiled dependency could satisfy `mix compile` by fetching
# a precompiled NIF for ubuntu-latest and never touch the pinned Rust
# toolchain at all, silently defeating the point of pinning it -- see
# lib/letflow/design/req165-wasmex-process-boundary.md §0.
#
# actions/checkout uses fetch-depth: 0 (full history) because
# `mix letflow.lint_handoffs` (one of `letflow.check`'s own steps) shells
# out to `git merge-base --is-ancestor` and `git show` against repo history;
# a shallow clone would make those git calls fail.
#
# Postgres service port is published as 5462:5432 to match
# config/db_port.exs's un-overridden default (5462) -- config/test.exs
# resolves `LETFLOW_DB_PORT` from the environment first, then an untracked
# `.env`, then that same 5462 default; CI sets neither, so the service's
# published port must be the one the default actually falls through to.
#
# services.postgres.command / TEST_MAX_CONNECTIONS=200 (ISS-0515, third rework,
# 2026-09-06): PR #1033 failed CI three times in a row with the IDENTICAL
# signature -- a `DBConnection.ConnectionError` client timing out at exactly
# 15000ms inside `:prim_inet.recv0/3` (a raw TCP-level socket-receive, i.e. a
# stalled connection ESTABLISHMENT to Postgres, not a queue wait for an
# already-open pool slot) -- from executor_test.exs's ISS-0426 self-check's
# nested `mix test --only lua_wallclock_race` subprocess. The prior two
# reworks (see docs/migration/decisions/0009-test-parallel-pool-sizing.md's
# ISS-0515 addendum) each reslicing the SAME 100-connection server-side budget
# differently -- capping that subprocess's own pool (1, then 4) and bumping
# `TEST_NONPOOL_CONNECTION_RESERVE` (3 -> 5) to match -- and each hit the exact
# same failure signature regardless of the slice chosen. An identical failure
# under two different internal budget splits is evidence the real constraint
# is server-side scarcity (Postgres's own `max_connections=100` ceiling
# genuinely near-exhausted by the outer partitions' own legitimate concurrent
# usage at that moment in a real CI run), not a mis-sized internal reserve --
# a third reslice of an already-thin budget was judged unlikely to fix a
# genuine scarcity problem, so this rework enlarges the budget itself instead.
#
# GitHub Actions' `services.<id>.command` key (and its sibling `entrypoint`)
# lets a service container's default `CMD` be overridden directly in the
# workflow YAML -- added to the runner in April 2026, Linux runners only
# (ubuntu-latest, which this job already uses, qualifies); see GitHub's
# "About service containers" docs. The official `postgres` image's own
# `docker-entrypoint.sh` treats a `command:` starting with `postgres` as the
# server process's own argv, so trailing `-c key=value` flags are real
# `postgresql.conf` overrides, not container/docker-run flags (that's what
# `options:` below is already for -- `options` and `command` are unrelated
# keys). `max_connections=200` doubles the prior ceiling; the "Run backend
# gate" step below sets `TEST_MAX_CONNECTIONS=200` to match, so
# `scripts/test_parallel.sh`'s own budget arithmetic (see decision doc)
# recomputes against the real, raised ceiling instead of silently leaving the
# extra headroom unused. The prior reworks' pool-size/reserve tuning
# (TEST_POOL_SIZE=4 for the nested subprocess, TEST_NONPOOL_CONNECTION_RESERVE
# default=5) is left in place unchanged -- it was never wrong, just
# insufficient alone against a genuinely near-exhausted 100-connection
# ceiling; kept as an additional, still-reasonable margin now sitting inside a
# much larger budget.

name: CI

on:
  push:
  pull_request:

jobs:
  # This job's `name:` string is a required-status-check `context` on main's branch
  # protection (docs/migration/decisions/0018-branch-protection-posture.md). Do not
  # rename it without updating that record's `contexts` list and re-running its
  # Step 1/2 -- a silent rename makes GitHub report the required check as
  # perpetually missing, which behaves as a permanent block on main, not a
  # silent pass-through.
  backend:
    name: Backend gate (mix letflow.check)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: letflow
          POSTGRES_PASSWORD: letflow
          POSTGRES_DB: letflow_dev
        ports:
          - 5462:5432
        options: >-
          --health-cmd "pg_isready -U letflow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        command: >-
          postgres -c max_connections=200

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Elixir/OTP (from .tool-versions)
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Read pinned Rust version from .tool-versions
        id: rust_pin
        run: |
          version=$(grep -E '^rust ' .tool-versions | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust (pinned via .tool-versions)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust_pin.outputs.version }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run backend gate
        run: mix letflow.check
        env:
          WASMEX_BUILD: true
          # Matches services.postgres's `command: postgres -c max_connections=200`
          # above (ISS-0515, third rework) -- keeps scripts/test_parallel.sh's own
          # connection-budget arithmetic (TEST_MAX_CONNECTIONS, default 100) in
          # sync with the real, raised server-side ceiling instead of computing
          # against a ceiling that no longer reflects what's actually running.
          TEST_MAX_CONNECTIONS: "200"

  frontend:
    # This job's `name:` string is a required-status-check `context` on main's branch
    # protection (docs/migration/decisions/0018-branch-protection-posture.md). Do not
    # rename it without updating that record's `contexts` list and re-running its
    # Step 1/2 -- a silent rename makes GitHub report the required check as
    # perpetually missing, which behaves as a permanent block on main, not a
    # silent pass-through.
    #
    # REQ-138: frontend gate job, appended alongside `backend` per that
    # job's own design-note item 3 -- a pure sibling addition under the
    # same `on:` triggers, touching none of `backend`'s keys.
    #
    # Node version: pinned to 22 (LTS) via actions/setup-node's
    # `node-version` input, matching web/package.json's
    # `@types/node: ^22.0.0` -- there is no committed .nvmrc/.node-version
    # file in web/ to read from instead, and 22 is the version the type
    # definitions already target.
    #
    # `npm ci` (not `npm install`) for a reproducible install from
    # web/package-lock.json, matching the lockfile-driven cache key below.
    #
    # `npm run check` is REQ-115's existing script (type-check + lint +
    # test + guards) -- this job invokes it unchanged, same "wire the
    # existing gate into CI, don't invent a new one" boundary REQ-136's
    # backend job holds for `mix letflow.check`. `check`'s own composition
    # already excludes tests/e2e/** and tests/guards' Playwright-driven
    # specs (see web/package.json's `test` script), so no browser/server
    # setup is needed here.
    name: Frontend gate (npm run check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend gate
        run: npm run check
