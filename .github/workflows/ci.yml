# REQ-136: GitHub Actions CI running the backend gate.
#
# Design note (kept inline -- this is infra config, not an Elixir module or
# a data model, so a separate lib/letflow/design/ doc would just restate
# this file; see CODE-DESIGNER's handoff for the full reasoning).
#
# 1. Postgres image match (acceptance criterion 3).
#    docker-compose.yml:3            image: postgres:16
#    this file, `services.postgres.image` below:   postgres:16
#    Kept byte-for-byte identical on purpose: the backend gate's `mix test`
#    step runs real Ecto migrations, and a version drift between dev/CI
#    Postgres is exactly the kind of thing this CI is meant to catch, not
#    introduce.
#
# 2. Why `mix letflow.check` and nothing else.
#    `mix letflow.check` is the existing alias (mix.exs) that already runs
#    the full local gate: toolchain-pin check, requirements-registration
#    check, deferral-staleness check, handoff lint, `format --check-formatted`,
#    `compile --warnings-as-errors`, and the test suite (which itself runs
#    `ecto.create --quiet` + `ecto.migrate --quiet` before `test`, via this
#    project's own `test` alias). REQ-136 is scoped to wiring this existing
#    command into CI-as-a-service, not to changing what the gate checks --
#    if the gate is ever found to be missing a step, that is a change to
#    REQ-013's alias and is filed as its own requirement/finding, not folded
#    in here. Hence exactly one `run: mix letflow.check` step below, and
#    nothing hand-rolled alongside it.
#
# 3. Job-key structure for REQ-138 (future frontend job).
#    This job is declared as `jobs.backend`, not as an implicit single
#    top-level job or under a generic/unnamed key. REQ-138 (frontend gate,
#    `npm run check`, blocked on REQ-115) is scoped to add `jobs.frontend`
#    as a sibling of `jobs.backend` under the same `on: [push, pull_request]`
#    triggers -- a pure append, touching none of this job's keys (`steps`,
#    `services`, `runs-on`, etc.). Nothing about this file needs to be
#    restructured for that to happen.
#
# Toolchain versions: read from .tool-versions (elixir 1.20.3-otp-29,
# erlang 29.0.5, rust 1.97.1) via setup-beam's version-file input (Elixir/OTP)
# and a shell step feeding dtolnay/rust-toolchain@stable (Rust, REQ-165 --
# there is no version-file: input on that action, so the pinned value is read
# out of .tool-versions by a preceding step and threaded in via
# $GITHUB_OUTPUT) rather than hardcoded here, so CI and local
# `mix letflow.check_toolchain` can never silently drift apart -- the same
# file backs both.
#
# WASMEX_BUILD: true on "Run backend gate" (REQ-165): without it, `wasmex`'s
# own rustler_precompiled dependency could satisfy `mix compile` by fetching
# a precompiled NIF for ubuntu-latest and never touch the pinned Rust
# toolchain at all, silently defeating the point of pinning it -- see
# lib/letflow/design/req165-wasmex-process-boundary.md §0.
#
# actions/checkout uses fetch-depth: 0 (full history) because
# `mix letflow.lint_handoffs` (one of `letflow.check`'s own steps) shells
# out to `git merge-base --is-ancestor` and `git show` against repo history;
# a shallow clone would make those git calls fail.
#
# Postgres service port is published as 5462:5432 to match
# config/db_port.exs's un-overridden default (5462) -- config/test.exs
# resolves `LETFLOW_DB_PORT` from the environment first, then an untracked
# `.env`, then that same 5462 default; CI sets neither, so the service's
# published port must be the one the default actually falls through to.
#
# services.postgres.command / TEST_MAX_CONNECTIONS=200 -- TRIED AND REVERTED.
# ISS-0515's third rework (2026-09-06) added `command: postgres -c
# max_connections=200` here plus `TEST_MAX_CONNECTIONS=200` on the "Run
# backend gate" step below, on the theory that PR #1033's repeated identical
# `DBConnection.ConnectionError` (from executor_test.exs's ISS-0426 self-check
# nested subprocess) was caused by genuine server-side connection scarcity
# (Postgres's own `max_connections=100` near-exhausted by the outer
# partitions), and that GitHub Actions' `services.<id>.command` key
# (confirmed genuinely supported per GitHub's own docs) could double that
# ceiling directly.
#
# THIS DID NOT WORK IN PRACTICE. PR #1033's very next (fourth) CI run failed
# with the EXACT SAME failure signature, and that run's own Postgres
# container logs showed both `FATAL: sorry, too many clients already`
# (repeated many times) and, in the container's own initdb bootstrap log,
# `selecting default max_connections ... 100` -- i.e. the server never
# actually applied the override and started at the untouched default of 100.
# The `command:` key being genuinely documented and syntactically correct did
# not mean it took effect in this actual runner/image invocation; the exact
# cause (a YAML subtlety, a runner-version gap, or a precedence issue with an
# implicit default CMD/entrypoint) was not conclusively identified, and ORCH
# decided not to sink further time into debugging the `services.command`
# mechanism itself after four consecutive identical failures.
#
# The `command:` key and `TEST_MAX_CONNECTIONS=200` env below have been
# REMOVED (reverted to the pre-third-rework state) rather than left as a
# no-op, since live CI evidence shows the override never took effect anyway
# and leaving disproven config in place would misleadingly suggest it does
# something. The fourth rework's actual fix instead makes the nested
# subprocess skip its `tenant_template` pre-build entirely, since it never
# needed real DB access for that purpose in the first place -- see
# docs/migration/decisions/0009-test-parallel-pool-sizing.md's fourth
# addendum for the full evidence and reasoning.

name: CI

# ISS-0591 (duplicate CI runs) + ISS-0592 (no path filter):
# see lib/letflow/design/iss0591-iss0592-ci-dedup-path-filter.md for the full
# reasoning. Do not "simplify" any of the following without re-reading that
# design in full -- several of these choices (job-level `if: ${{ !cancelled() }}`
# instead of `always()`, step-level rather than job-level path-filter `if:`,
# fail-open `!= 'false'` step conditions) were deliberately chosen over an
# obvious-looking alternative that was tried and rejected during that design's
# review, specifically because the obvious alternative silently breaks
# 0018's required-status-check contexts.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Not a required status check. Computes whether backend-relevant /
  # frontend-relevant paths changed so `backend`/`frontend` below can skip
  # their expensive steps on a docs-only change -- see the design doc §3.
  # Hand-rolled git diff rather than a third-party paths-filter action, so
  # every edge case (zero-SHA new branch, non-push/PR triggers, force-push,
  # the script's own failure) is auditable directly in this file.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.fallback.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend || steps.fallback.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed paths
        id: filter
        continue-on-error: true
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          else
            BASE_SHA=""
            HEAD_SHA=""
          fi

          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            echo "No usable base SHA for event '${{ github.event_name }}' (base='$BASE_SHA') -- assuming everything changed."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "$BASE_SHA" || true
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base SHA $BASE_SHA not reachable even after a targeted fetch (likely a force-push rewrite) -- assuming everything changed."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files ($BASE_SHA..$HEAD_SHA):"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(lib/|priv/repo/migrations/|test/|mix\.exs|mix\.lock|\.tool-versions|config/|\.github/workflows/ci\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE '^(web/|\.github/workflows/ci\.yml)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail-safe defaults if path detection did not complete cleanly
        id: fallback
        if: steps.filter.outcome != 'success'
        run: |
          echo "Path-detection step outcome was '${{ steps.filter.outcome }}', not 'success' -- defaulting to running both gates in full rather than risking a silent skip."
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"

      # REQ-367: publish this job's already-computed backend/frontend outputs
      # as a build artifact so .github/workflows/cd.yml (a separate,
      # workflow_run-triggered workflow) can gate its QA deploy on the same
      # signal without a second git diff/regex computation -- a workflow_run
      # trigger runs as a distinct workflow run and cannot read this job's
      # `outputs:` via `needs:` (that only works within one workflow run).
      # Pure downstream consumer of the values the filter/fallback steps
      # above already produced -- does not touch their diff/regex logic.
      - name: Write path-filter outputs for cd.yml
        run: |
          echo "backend=${{ steps.filter.outputs.backend || steps.fallback.outputs.backend }}" >> path-filter-outputs.txt
          echo "frontend=${{ steps.filter.outputs.frontend || steps.fallback.outputs.frontend }}" >> path-filter-outputs.txt
          cat path-filter-outputs.txt

      - name: Upload path-filter outputs
        uses: actions/upload-artifact@v4
        with:
          name: path-filter-outputs
          path: path-filter-outputs.txt
          retention-days: 1

  # This job's `name:` string is a required-status-check `context` on main's branch
  # protection (docs/migration/decisions/0018-branch-protection-posture.md). Do not
  # rename it without updating that record's `contexts` list and re-running its
  # Step 1/2 -- a silent rename makes GitHub report the required check as
  # perpetually missing, which behaves as a permanent block on main, not a
  # silent pass-through.
  backend:
    name: Backend gate (mix letflow.check)
    runs-on: ubuntu-latest
    needs: changes
    # NOT `always()` -- see design doc §4. `!cancelled()` keeps this required
    # job running when `changes` merely *fails* (so the gate still runs, fail
    # open), while still letting a genuinely cancelled/superseded run (this
    # workflow's own `cancel-in-progress`) actually stop instead of running to
    # completion immune to cancellation.
    if: ${{ !cancelled() }}

    # ISS-0779: `--health-cmd "pg_isready -U letflow"` (no `-d`) was NOT a check that
    # the target database exists -- it was not even a check that the specific
    # database it happened to probe (defaults to the `-U` value when `-d` is
    # omitted, i.e. a database literally named "letflow", which nothing here ever
    # creates -- POSTGRES_DB only creates "letflow_dev") exists either. `pg_isready`
    # (and the `PQping`/`PQpingParams` libpq call it wraps) treats ANY response from
    # the postmaster -- including a `FATAL: database "letflow" does not exist` or
    # `FATAL: role "letflow" does not exist` reply -- as proof the SERVER is up, and
    # reports "accepting connections" regardless. This is exactly what live CI
    # evidence for this issue showed: the Postgres service container's own log
    # recorded repeated `FATAL: database "letflow" does not exist` replies (from
    # this health-cmd's own probes, well before `POSTGRES_DB`'s entrypoint-driven
    # `CREATE DATABASE letflow_dev` step had even run) while the health check itself
    # was reporting healthy on the very first attempt -- so GitHub Actions started
    # the job's `mix ecto.create` step immediately, racing ahead of the container
    # entrypoint's own user/database bootstrap. Confirmed via the Postgres docs/
    # `pg_isready` behavior (an "invalid database"/"invalid authorization" FATAL is
    # explicitly one of the responses `PQpingParams` maps to `PQPING_OK`, not
    # `PQPING_REJECT`) that simply adding `-d letflow_dev` here would NOT have fixed
    # this: `pg_isready` would still report "accepting" the instant the postmaster
    # answers at all, FATAL-database-doesn't-exist reply included -- so a same-shape
    # `pg_isready -U letflow -d letflow_dev` health-cmd is not a real fix, only a
    # cosmetic one.
    #
    # Fix: replace the health-cmd with a real, authenticated `psql` query against
    # `letflow_dev` -- the database `POSTGRES_DB` actually creates. Unlike
    # `pg_isready`, a `psql ... -c 'SELECT 1'` genuinely fails (nonzero exit) when
    # the target database doesn't exist yet or the `letflow` role/password isn't
    # provisioned yet, because it has to complete real authentication and query
    # execution, not just get *a* response from the postmaster. This forces Docker's
    # health-check polling to keep the service "starting" (not "healthy") until the
    # entrypoint's full bootstrap (role + password + `CREATE DATABASE letflow_dev`)
    # has actually finished, which is the one guarantee `pg_isready` could never give
    # here regardless of which `-d` value it was passed.
    #
    # AC3 (docs/issues/ISS-0779.yaml): neither `mix ecto.create` nor
    # `scripts/test_parallel.sh` has any retry/wait logic for this exact condition
    # today, so this is not a duplicate of existing retry logic. Ecto's own
    # `storage_up` (deps/ecto_sql/lib/ecto/adapters/postgres.ex, `run_query/2`) opens
    # exactly one `Postgrex.start_link/1` with `backoff_type: :stop` (no reconnect
    # loop) and returns whatever that single attempt yields; `test_parallel.sh`'s
    # Step 1.7 calls `mix ecto.create`/`mix ecto.migrate` per partition with no
    # surrounding wait loop at all. This fix does not add a retry loop next to those
    # -- it moves the *only* real guard against this race to the one place that can
    # enforce it before any of those steps run at all: the service container's own
    # health gate, which GitHub Actions already blocks every later job step on.
    # `--health-retries` raised from 10 to 30 (interval unchanged at 2s, so ~60s+
    # budget instead of ~20s) since a real authenticated query naturally needs a
    # little longer to first succeed than a bare TCP/protocol probe did.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: letflow
          POSTGRES_PASSWORD: letflow
          POSTGRES_DB: letflow_dev
        ports:
          - 5462:5432
        options: >-
          --health-cmd "PGPASSWORD=letflow psql -U letflow -d letflow_dev -h 127.0.0.1 -c 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Elixir/OTP (from .tool-versions)
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Read pinned Rust version from .tool-versions
        id: rust_pin
        run: |
          version=$(grep -E '^rust ' .tool-versions | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust (pinned via .tool-versions)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust_pin.outputs.version }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        if: needs.changes.outputs.backend != 'false'
        run: mix deps.get

      - name: Run backend gate
        if: needs.changes.outputs.backend != 'false'
        run: mix letflow.check
        env:
          WASMEX_BUILD: true

  frontend:
    # This job's `name:` string is a required-status-check `context` on main's branch
    # protection (docs/migration/decisions/0018-branch-protection-posture.md). Do not
    # rename it without updating that record's `contexts` list and re-running its
    # Step 1/2 -- a silent rename makes GitHub report the required check as
    # perpetually missing, which behaves as a permanent block on main, not a
    # silent pass-through.
    #
    # REQ-138: frontend gate job, appended alongside `backend` per that
    # job's own design-note item 3 -- a pure sibling addition under the
    # same `on:` triggers, touching none of `backend`'s keys.
    #
    # Node version: pinned to 22 (LTS) via actions/setup-node's
    # `node-version` input, matching web/package.json's
    # `@types/node: ^22.0.0` -- there is no committed .nvmrc/.node-version
    # file in web/ to read from instead, and 22 is the version the type
    # definitions already target.
    #
    # `npm ci` (not `npm install`) for a reproducible install from
    # web/package-lock.json, matching the lockfile-driven cache key below.
    #
    # `npm run check` is REQ-115's existing script (type-check + lint +
    # test + guards) -- this job invokes it unchanged, same "wire the
    # existing gate into CI, don't invent a new one" boundary REQ-136's
    # backend job holds for `mix letflow.check`. `check`'s own composition
    # already excludes tests/e2e/** and tests/guards' Playwright-driven
    # specs (see web/package.json's `test` script), so no browser/server
    # setup is needed here.
    name: Frontend gate (npm run check)
    runs-on: ubuntu-latest
    needs: changes
    # See the matching note on `backend` above -- NOT `always()`.
    if: ${{ !cancelled() }}
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.frontend != 'false'
        run: npm ci

      - name: Run frontend gate
        if: needs.changes.outputs.frontend != 'false'
        run: npm run check
