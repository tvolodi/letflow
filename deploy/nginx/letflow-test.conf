# nginx vhost — letflow-test.ai-dala.com
# Install: sudo cp this file /etc/nginx/sites-available/letflow-test.conf
#          sudo ln -s /etc/nginx/sites-available/letflow-test.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# HTTP → HTTPS redirect is handled at Cloudflare edge (always_use_https rule).
# This vhost handles only HTTPS traffic arriving from Cloudflare.
#
# JSON API only — no WebSocket upgrade headers or caching rules needed.

server {
    listen 443 ssl;
    server_name letflow-test.ai-dala.com;

    # Cloudflare origin certificate — shared wildcard for *.ai-dala.com
    ssl_certificate     /etc/ssl/cloudflare/ai-dala.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ai-dala.key;

    # REQ-439 -- restore the visitor address as $remote_addr (ngx_http_realip_module)
    # BEFORE the proxy_set_header X-Real-IP line below, so Letflow's
    # Letflow.Plugs.ClientIp sees the real client in X-Real-IP.
    # Source: Cloudflare official lists https://www.cloudflare.com/ips-v4 and
    # https://www.cloudflare.com/ips-v6 (fetched 2026-10-04); header name per
    # https://developers.cloudflare.com/fundamentals/reference/http-headers/
    # (CF-Connecting-IP). Cloudflare changes these lists occasionally: REFRESH this
    # block from the URLs above periodically. A request from a source outside these
    # ranges keeps $remote_addr = the TCP peer and any CF-Connecting-IP it sends is
    # ignored. QA's vhost lives outside this repository: apply the same directives
    # there as an infrastructure action. Letflow's LETFLOW_TRUSTED_PROXIES must then
    # list the address nginx connects FROM (the Docker bridge gateway, not
    # 127.0.0.1, when proxying to the published container port); no real value is
    # committed.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    location / {
        proxy_pass         http://127.0.0.1:3113;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
