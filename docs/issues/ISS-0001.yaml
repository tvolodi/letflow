id: ISS-0001
title: Stale route/middleware counts in REQ-010 and 0001-web-framework.md skeleton
discovered_by: ELIXIR-DEV
discovered_in_run: WF02-REQ010
discovered_at: 2026-08-14T21:16:52Z
severity: MINOR
description: >
  PROVENANCE (historical, not current decision authority):
  docs/requirements.yaml REQ-010's description and acceptance_criteria[2] state R-Co's
  src/api/routes/ has 22 route modules. docs/migration/decisions/0001-web-framework.md's
  pre-existing Question section also states 22, and its own code-block listing is
  separately inconsistent with that prose too (it enumerates 23 names, not 22, before
  ever being compared to disk). The actual verified count (ls src/api/routes/, checked
  twice during lib/letflow/design/0001-web-framework-decision.md's research) is 24
  distinct .zig modules — the name missing from every stale source is
  promotion_review.zig. So the stated "22" undercounts ground truth by two, not one:
  one gap is the skeleton's own prose vs. its own code block (22 vs. 23), a second gap
  is the code block vs. the real directory (23 vs. 24, closed by promotion_review).

  Separately, REQ-010's description field says the middleware chain has 6 modules
  (auth, rate_limit, quota_enforcement, tenant_status, trace, validate) and omits
  content_type.zig. The actual verified count (ls src/api/middleware/) is 7 modules,
  which already matches REQ-010's own acceptance_criteria[1] and
  0001-web-framework.md's Question section — only the description field is stale/
  internally inconsistent on this point.

  Neither count was corrected in place as part of REQ-010 — out of that requirement's
  declared file scope, which is limited to the Decision/Reasoning sections of
  0001-web-framework.md (see lib/letflow/design/0001-web-framework-decision.md's
  "What NOT to do" section). The Decision/Reasoning sections written for REQ-010 use
  the correct ground-truth counts (24 routes, 7 middleware modules) and note this
  discrepancy inline rather than silently using the stale figures.

  Recommended fix: update docs/requirements.yaml REQ-010's description and
  acceptance_criteria[2] to cite 24 routes / 7 middleware modules (and fix the
  description's middleware list to include content_type), and fix
  0001-web-framework.md's Question section (prose 22 -> 24, add promotion_review to
  the listed route modules).
affected_files:
  - docs/requirements.yaml
  - docs/migration/decisions/0001-web-framework.md
github_issue: https://github.com/tvolodi/letflow/issues/1
status: resolved
resolved_at: 2026-08-15T19:03:12Z
resolution: >
  PROVENANCE (historical, not current decision authority):
  Fixed as recommended: docs/requirements.yaml REQ-010's description now says 24
  routes / 7 middleware modules (content_type added to the description's middleware
  list). docs/migration/decisions/0001-web-framework.md's Question section prose and
  code-block listing both corrected to 24, with promotion_review.zig added to the
  enumerated route modules. The file's "Note on the route count" paragraph updated to
  record that the fix has been applied in place rather than describing the staleness
  as still-current. Applied directly by ORCH (small, mechanical, no design ambiguity)
  ahead of starting S1 work.
