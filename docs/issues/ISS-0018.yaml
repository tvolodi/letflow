id: ISS-0018
title: "security-invariants.md INV-4's verification greps use --include=*.ex, which structurally cannot match config/*.exs -- the invariant's own primary target is invisible to its own check"
discovered_by: SECURITY-REVIEWER
discovered_in_run: WF02-REQ023-20260816
discovered_at: 2026-08-16T17:03:47Z
severity: MINOR
description: >
  INV-4 ("Secrets by reference only") documents its verification as, at
  docs/agents/instructions/security-invariants.md lines 114-115:

      grep -rn "System.get_env" config/ lib/ --include=*.ex
      grep -rniE "(password|secret|client_secret|token)\s*=\s*\"[^\"]{8,}" lib/ config/ --include=*.ex

  Both commands name `config/` as a search root, but `--include=*.ex` matches
  only `.ex` files. Every file in `config/` is a `.exs` file. So the glob and
  the search root contradict each other: the checks cannot inspect a single
  file in `config/`, which is precisely where this invariant's own cited
  Reference points (`config/dev.exs`'s bearer token, and
  `config/runtime.exs`'s `DATABASE_URL`).

  This is a gate that cannot see its own primary target.

  The bug is internal to the file and demonstrable by comparison rather than
  argument: INV-7's own verification grep, in the SAME document at line 181,
  gets it right --

      grep -rn "Repo.query" lib/ priv/repo/migrations/ --include=*.ex --include=*.exs

  -- passing both globs so it can reach `.exs` migration files. INV-4 simply
  omits the second `--include`. ORCH confirmed both line numbers and both
  flag sets directly.

  Why it matters despite being one missing flag: core-directives.md's
  Humanless Operation section states that "because there is no human
  backstop, every gate in this pipeline must actually gate," and that
  validators must re-derive their verdict rather than trust a producer. A
  documented "How to verify" command that silently returns zero hits on the
  directory it names is worse than no command at all -- it produces a
  confident clean result while having examined nothing, and an agent
  following the instruction literally (which this project explicitly designs
  for: "weak-model tolerance is a design constraint") would report INV-4 as
  verified on the strength of an empty result set. That is the exact
  failure shape core-directives.md's "Never Satisfy a Gate by Editing What
  It Measures" section exists to prevent, arrived at by accident rather than
  intent.

  It did not cause a false PASS in this run: SECURITY-REVIEWER noticed the
  mismatch while running the check, compensated with supplementary `.exs`
  passes over `config/` and `lib/`, and reported INV-4 PASS on the strength
  of those instead. So REQ-023's own gate verdict is sound. The defect is in
  the instruction, not in this run's application of it.

  Suggested fix: change both INV-4 greps to
  `--include=*.ex --include=*.exs`, matching INV-7's shape. While there,
  audit the rest of the file for the same mismatch (line 211's INV-8 grep
  targets `lib/letflow/` with `--include=*.ex`, which is correct for that
  invariant since it concerns compiled application code, but it is worth an
  explicit confirmation rather than an assumption).

  Related observation recorded so the record shows it was assessed rather
  than missed, not as a defect to fix: `config/test.exs` carries a literal
  7-character local Postgres password. It falls below INV-4's `{8,}`
  heuristic threshold, `config/` is untouched by this run's diff, and it is
  a throwaway container credential for a local test database -- no action
  recommended.

  Discovered by SECURITY-REVIEWER while executing WF-02 Step 2c for REQ-023.
  Unrelated to REQ-023's acceptance criteria and blocking none of them, so
  per docs/agents/protocols/ISSUE_QUEUE.md filed and forwarded rather than
  fixed in this run.
  UPDATE 2026-08-16T20:32:46Z (SECURITY-REVIEWER, run WF02-REQ027-20260816, Step 2c) --
  THE FIX DESCRIBED ABOVE IS NECESSARY BUT NOT SUFFICIENT.

  A second reviewer, compensating for this issue as instructed, found that
  even after the --include=*.exs correction the INV-4 grep would STILL have
  a blind spot. The pattern is anchored on '=' assignment:

      (password|secret|client_secret|token)\s*=\s*"[^"]{8,}"

  Elixir config does not generally use '=' for this. config/*.exs sets values
  in keyword form -- `password: "..."`, `secret_key_base: "..."` -- which the
  pattern cannot match no matter which --include flags it carries. So the
  repaired check would run against the right files and still see nothing.

  Whoever fixes this should therefore correct BOTH the file-glob and the
  pattern, e.g. by accepting either separator ((=|:)\s*) so the keyword form
  is covered. Fixing only the --include, as this record originally proposed,
  would produce a check that looks repaired and remains blind -- arguably
  worse than the current obviously-broken state, because the next reviewer
  would have no reason to compensate.

  Separately noted and deliberately NOT actioned: the {8,} length floor
  hides `password: "letflow"` in config/test.exs (7 characters). That is the
  throwaway local docker credential already assessed in this record's
  original text; it is called out again only because it is a concrete
  demonstration that the floor is doing real filtering, not because the
  credential itself needs changing.

affected_files:
  - docs/agents/instructions/security-invariants.md
github_issue: https://github.com/tvolodi/letflow/issues/74
status: resolved
resolved_by: ORCH
resolved_in_run: WF03-ISS0018-20260817
resolved_at: 2026-08-17T07:36:18Z
resolution: >
  Fixed both defects the record's own history identified, not just the
  originally-filed one: added --include=*.exs to both INV-4 greps
  (matching INV-7's already-correct shape), AND fixed the second
  reviewer's later finding that the secret-pattern regex was anchored on
  '=' while Elixir config uses keyword form (`password: "..."`) --
  changed `\s*=\s*` to `\s*(=|:)\s*`.

  Verified both fixes actually work against the real repo rather than
  trusting the edit: ran the corrected System.get_env grep, confirmed it
  now finds real hits under config/ (config/dev.exs, config/runtime.exs,
  config/test.exs) that the broken version structurally could not see.
  Ran the corrected secret-heuristic grep against the real repo: zero
  hits, which is the CORRECT result today (dev.exs/test.exs's
  password: "letflow" is 7 chars, below the {8,} threshold, the same
  throwaway credential already assessed in this record). Proved the
  regex isn't just coincidentally clean by testing it standalone: a
  synthetic `password: "supersecretvalue123"` (>=8 chars, keyword form)
  matches; a synthetic `password: "letflow"` (7 chars) correctly does
  not.

  Per the issue's own suggested audit, explicitly confirmed (not
  assumed) that INV-8's grep is correctly .ex-only (scoped to
  lib/letflow/ compiled code, where .exs files don't exist) -- no change
  needed there. Grepped the whole file for every --include= occurrence
  to check for other instances of the same file-glob/search-root
  mismatch class -- none found; all four grep-based checks are now
  internally consistent.

  No lib/, priv/, or test/ file touched -- security-invariants.md
  verification-procedure correction only.
