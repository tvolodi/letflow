description: >
  During WF02-REQ037-20260817's Step 2a rework, a full-repo
  `mix format --check-formatted` run surfaced formatting drift in
  test/letflow/definitions/promotion_digest_test.exs (created by REQ-036's
  TEST-DESIGNER; REQ-036's own pipeline reported `mix format --check-formatted`
  clean at every step it ran). Confirmed unrelated to REQ-037's own diff, not
  blocking REQ-037's own gates. Filed as letflow-queue task 81 / GitHub #108.

  Note: the queue task's description text cited "Local record:
  docs/issues/ISS-0034.yaml" -- this was a mislabeling by whoever filed the
  queue task; ISS-0034 is an unrelated, already-resolved issue (stage-2
  migration doc header staleness). This file (ISS-0035) is the correct local
  record for GH#108.

  Root cause, confirmed directly (not assumed): `mix format --check-formatted`
  run fresh against this file shows 4 lines exceeding the configured line
  length that `mix format` wants wrapped (lines 58, 106, 124, 216 -- one more
  than the queue task's description mentioned, likely because that
  description was written against a partial diff or an earlier .formatter.exs
  state). All four are long `assert`/`refute` comparison lines. Formatting-only,
  zero logic change needed.
