resolution: >
  Ran `mix format` repo-wide rather than scoping to just the one named file,
  because a fresh `mix format --check-formatted` (run to confirm the fix)
  surfaced a second, previously-undetected drift in
  test/letflow/definitions/store_test.exs (REQ-030's own TOCTOU regression
  test file, merged earlier the same session) -- identical bug class
  (long assert/refute lines needing a wrap), same zero-risk mechanical fix.
  Included it in this same run rather than filing a separate issue: both are
  the same root cause (long single-line assertions exceeding the configured
  line length) and the same trivial fix, so splitting them would only have
  added bookkeeping overhead with no safety benefit. Confirmed via git diff
  that both files' changes are whitespace/line-break only, zero
  assertion/logic changes. `mix format --check-formatted` now clean
  repo-wide (exit 0). Full suite re-run post-fix: no change in pass count,
  0 failures. Independent REVIEWER sign-off obtained before merge per
  core-directives.md's producer/validator principle, even though ORCH
  applied the fix directly under ORCHESTRATOR.md's sizing exception
  (mechanical, zero design ambiguity).
