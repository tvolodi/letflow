id: ISS-0036
title: "test/letflow/definitions/promotion_review_migration_test.exs's valid_review_attrs/1 has an unused default argument, tripping --warnings-as-errors at the whole-directory level"
discovered_by: TEST-DESIGNER
discovered_in_run: WF02-REQ034-20260817
discovered_at: "2026-08-17T20:55:32Z"
severity: MINOR
description: >
  `mix test --warnings-as-errors test/letflow/definitions/promotion_review_migration_test.exs`
  emits:

      warning: default values for the optional arguments in valid_review_attrs/1 are never used
      test/letflow/definitions/promotion_review_migration_test.exs:125:8

  `valid_review_attrs(overrides \\ %{})` (line 125) declares a default
  value for `overrides`, but every call site in the file
  (test/letflow/definitions/promotion_review_migration_test.exs:354,
  364, 387, 395, 407, 420, 429, 434) passes an explicit map -- the
  zero-arity call the default exists for never actually happens, so the
  compiler correctly flags the default as dead.

  This does not fail plain `mix test` (warnings aren't errors by
  default) and did not block WF02-REQ034-20260817's own Step 3/4/5 --
  discovered incidentally while TEST-DESIGNER ran
  `mix test --warnings-as-errors` scoped to the new
  export_import_test.exs file, then widened the check to confirm no
  regression across the whole test/letflow/definitions/ directory
  (271 tests, 0 failures) and noticed this pre-existing warning was
  present with or without the new file.

  Suggested fix (small, its own change): either drop the default
  (`defp valid_review_attrs(overrides)`) since no call site relies on
  it, or add a zero-arg call site if a default-attrs case is actually
  meant to be exercised.
affected_files:
  - test/letflow/definitions/promotion_review_migration_test.exs
github_issue: https://github.com/tvolodi/letflow/issues/113
status: resolved
resolved_in_run: ADHOC-20260817-002
resolved_at: "2026-08-17T21:14:13Z"
