id: ISS-0037
title: "Future S4 SVC-03 422 renderer must not turn Violation.reason into a service-existence oracle (INV-5 tension)"
discovered_by: SECURITY-REVIEWER
discovered_in_run: WF02-REQ031-20260817
discovered_at: "2026-08-17T21:09:16Z"
severity: MINOR
description: >
  Found during REQ-031's SECURITY-REVIEWER gate (Step 2c) on
  lib/letflow/definitions/service_scope_validator.ex.

  REQ-031's AC3 requires the not-registered case to be
  "distinguishable... not just a different string" from the
  owned-by-another-tenant case -- satisfied via two distinct closed-set
  atoms on Violation.reason: :service_not_registered (the referenced
  service_id does not exist anywhere) vs.
  :service_not_available_to_tenant (it exists, scoped to a different
  tenant). This is correct and required for REQ-031 itself.

  The tension: docs/agents/instructions/security-invariants.md's INV-5
  ("Not-found/forbidden indistinguishability") will require, once S4
  builds an HTTP layer, that a cross-tenant probe against a resource
  that exists but belongs to another tenant return a response
  indistinguishable from probing a resource that never existed. If a
  future S4 handler renders activate/2's
  {:error, {:service_scope_violation, %Violation{reason: ...}}} into an
  HTTP 422 body by naively exposing reason (or message, which also
  differs) verbatim, an external caller could use a process-definition
  activation call as an oracle to learn whether an arbitrary
  service_id/plugin_handler string is registered anywhere in the system
  at all.

  Not a defect in REQ-031 itself -- no HTTP layer exists yet (S4 not
  started), AC3 explicitly requires the distinction at the validate/3
  API level, and INV-5 is correctly NOT-APPLICABLE to this diff. Filed
  so the tension is not lost by the time S4 builds the renderer: that
  future requirement must either (a) collapse both violation reasons
  into one generic response body for external callers while keeping the
  distinct internal reason for logging, or (b) make an explicit,
  reviewed decision that this oracle is acceptable -- not silently
  render reason/message as-is.

  Renumbering note: originally filed by the discovering run
  (WF02-REQ031-20260817, still in progress on a separate host at the
  time of this filing) as its own local ISS-0036.yaml. That number
  collided with this checkout's own concurrently-merged ISS-0036.yaml
  (an unrelated finding from WF02-REQ034-20260817, already on main by
  the time this task was claimed) -- the same class of cross-host
  numbering collision documented for ISS-0034/ISS-0035. Filed here as
  ISS-0037 instead, ported verbatim from the queue task's registered
  description and the already-created GitHub issue (#112) rather than
  re-authored. The discovering run's own local ISS-0036.yaml (not yet
  merged as of this writing) is now redundant with this file and should
  be dropped, not merged, when that run reaches its own Step Final.
affected_files:
  - lib/letflow/definitions/service_scope_validator.ex
github_issue: https://github.com/tvolodi/letflow/issues/112
status: resolved
resolved_at: "2026-08-20T15:00:00Z"
resolution: >
  This was filed 2026-08-17, before S4 had any requirements to carry the
  obligation. S4 was expanded into 21 requirements (REQ-065..REQ-085) on
  2026-08-19; confirmed by grep that none of them referenced this issue or
  the underlying tension, even though REQ-082 -- the requirement that owns
  handleActivate, the HTTP endpoint that would render
  service_scope_validator.ex's Violation into a response -- was already
  drafted by then. The gap this issue predicted (the tension being lost by
  the time S4 built the renderer) was real and had already happened at the
  requirements-drafting stage, not yet at implementation.

  Fixed: docs/requirements.yaml REQ-082 gained an explicit paragraph
  ("HANDLEACTIVATE AND THE SERVICE-EXISTENCE ORACLE") naming this issue and
  choosing option (a) of the two named here -- collapse both
  Violation.reason values (:service_not_registered,
  :service_not_available_to_tenant) into one generic external 422 detail
  string via REQ-066's Letflow.Api.Error, keeping the distinct internal
  reason for logging only. Chosen because it is the only option consistent
  with the identical INV-5 discipline already written into every other S4
  requirement touching cross-tenant responses -- not left for
  re-litigation when REQ-082 is eventually implemented. Three new
  acceptance criteria added to REQ-082 testing the collapse, the absence of
  the distinguishing text in the response body, and that internal
  logging/telemetry still retains the distinct reason.

  REQ-082 itself is still status: pending (S4 has not started
  implementation -- REQ-065 gates the whole stage). This resolution is
  requirements-level only: the obligation is now durably attached to the
  requirement that will implement it, which is what this issue asked for
  ("filed so the tension is not lost by the time S4 builds the renderer").
  docs/status/requirement_status.yaml carries a `revised` event for
  REQ-082 recording this. Closing GH#112.
