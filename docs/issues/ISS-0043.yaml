description: >
  Found during REQ-043's REVIEWER gate (Step 2d) on lib/letflow/engine/task.ex.

  Letflow.Engine.Task declares assignee_type as a plain field(:assignee_type,
  :string) (lib/letflow/engine/task.ex:66), nullable, holding one of exactly
  three semantic values per EE-03 -- "USER" | "GROUP" | "ROLE" (R-Co's own
  005_instances.sql column comment, cited in
  lib/letflow/design/req043-instance-engine-schema.md section 4.1). The
  design explicitly considered and declined an Ecto.Enum here ("open
  free-text per EE-03 section 1a's own column comment; no closed-set
  validation named by any acceptance criterion") -- a reasoned, in-scope
  choice, not an oversight. Not a REQ-043 defect and not blocking REQ-043's
  own REVIEWER PASS.

  This is a type-safety gap worth tracking: a caller-supplied typo ("Usre",
  lowercase "user", "Team" instead of "GROUP") is a class of invalid state
  that today only a runtime query miss or a future test would catch. An
  Ecto.Enum (values: [:user, :group, :role], stored uppercase to match this
  table's own established uppercase-status convention, INV-EE43-4) would
  make the invalid string unrepresentable at the changeset layer instead --
  the same pattern already used for tasks.status and tokens.status in this
  same schema.

  Filed for whichever future requirement first builds a write path through
  Letflow.Engine.Task.insert_changeset/2 (REQ-045/051) -- the natural point
  to add the Ecto.Enum, since it requires no new migration (DB column stays
  plain :string; only the schema-layer type/cast validation change).

  Discovered by REVIEWER during WF02-REQ043-20260818.
