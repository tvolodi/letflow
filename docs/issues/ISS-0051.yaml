id: ISS-0051
title: "test/letflow/engine_test.exs's AC6 describe+test name pair exceeded ExUnit's 255-char SystemLimitError threshold, blocking the entire suite's compilation (same class as ISS-0030/0033/0040/0049)"
discovered_by: ELIXIR-DEV
discovered_in_run: WF02-REQ047-20260818 (Step 2a implementation)
discovered_at: "2026-08-18T21:53:46Z"
severity: MAJOR
tags:
  - test-hygiene
  - compilation-blocker
description: >
  While implementing REQ-047, `mix test test/letflow/engine_test.exs` failed
  to compile with `** (SystemLimitError) the computed name of a test ...
  must be shorter than 255 characters, got: "test AC6 -- moduledoc names the
  process-vs-row open question, cites the stage doc, leaves later engine
  subsystems to their own decision names the question as this stage's
  largest open design question and cites stage-3-instance-engine.md's second
  Early finding"` at test/letflow/engine_test.exs:718.

  Confirmed pre-existing (not introduced by REQ-047's own diff) via `git
  stash` -- the failure reproduces identically on the pre-change tree. This
  is the fourth occurrence of the exact failure class documented in
  docs/anti-patterns.md's "TEST-DESIGNER writing narratively-detailed
  describe/test names" entry (ISS-0030, ISS-0033, ISS-0040, ISS-0049 all
  the same root cause in different files) -- narratively-detailed
  describe/test name pairs exceeding ExUnit's combined 255-char ceiling,
  which fails the *whole file's* compilation rather than one test.

  Not caused by REQ-050/051's work directly as far as this run investigated
  -- ISS-0050 (filed during REQ-045's Step 5) explicitly notes
  test/letflow/engine_test.exs "passed in full" at that point, so this
  describe/test pair was introduced sometime between REQ-045's merge and
  REQ-047's Step 2a, most likely by REQ-050 or REQ-051's own TEST-DESIGNER
  output (both landed gateway/hop-limit test coverage in this same file per
  handoffs/registry.json's WF02-REQ051 note) -- not confirmed which commit,
  not investigated further since this run's own scope is REQ-047.

  Fixed inline by this run (blocking Step 4's full-suite mix test, per
  core-directives.md's Unblock-Everything): shortened both the describe and
  test strings to well under 200 combined chars, no behavioral change,
  verified via `mix test test/letflow/engine_test.exs` -> 24 tests, 0
  failures (all passing, same assertions, same coverage).
affected_files:
  - test/letflow/engine_test.exs
status: resolved
fixed_by: WF02-REQ047-20260818
github_issue: https://github.com/tvolodi/letflow/issues/192
reconciliation_note: >
  A concurrent host (WF03-ISS0050-20260818, ISSUE-FIXER, discovered_at
  21:37:12Z -- earlier than this run's own 21:53:46Z discovery, but merged to
  main SECOND) independently found and fixed the exact same describe/test pair
  and also filed it as its own docs/issues/ISS-0051.yaml. That run's Step Final
  rebase (commit c9894b2, PR #193) silently overwrote this file with its own
  content on the add/add path collision -- git did not flag it as a conflict.
  Discovered by ORCH post-merge (2026-08-18T22:05:58Z) via independent re-read
  of main's actual file content, same discipline as docs/anti-patterns.md's
  ISS-0036 incident. Reconciled: this record restored as canonical ISS-0051
  (chronologically first-merged to main keeps the number, per the
  ISS-0043/44/45 precedent in docs/anti-patterns.md); the other run's own
  record moved to docs/issues/ISS-0052.yaml with a matching cross-reference.
  No content lost. Both fixes targeted the same lines with different but
  equally-valid shortened strings; only one survived on disk (verified: the
  version now on main matches WF03-ISS0050-20260818's specific wording, "AC6
  -- moduledoc names the process-vs-row open question" / "cites stage doc as
  source of the open design question") -- functionally equivalent outcome
  either way (24/24 and 8/8 relevant test files passing on main post-merge),
  so no further code change needed, this is a bookkeeping-only reconciliation.
  GitHub issue #192 (still open) closed by ORCH as part of this reconciliation,
  cross-referencing ISS-0052.
