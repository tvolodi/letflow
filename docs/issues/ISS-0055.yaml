  rename, a clarifying phrase) would tip it over and re-break full-suite
  compilation the same way the prior five incidents did.
  Not fixed by this run -- out of REQ-047's own scope (pre-existing, not
  touched by this branch's diff), filed per Unblock-Everything's "notice but
  don't fix, file and forward" rule for non-blocking incidental findings.
