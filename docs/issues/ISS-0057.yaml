id: ISS-0057
title: "complete_task/3 never creates a tasks row for the next HUMAN_TASK when the same token continues directly from one HUMAN_TASK to another"
discovered_by: TEST-DESIGNER
discovered_in_run: WF02-REQ048-20260818 (Step 3, writing test/letflow/engine_complete_task_test.exs)
discovered_at: "2026-08-18T23:15:43Z"
severity: BLOCKER
tags:
  - correctness
  - req-048
  - task-activation
description: >
  REQ-048 AC1 ("complete_task on a PENDING task ... activates the next node") is
  violated by the shipped implementation for the ordinary, common case of two
  directly-chained HUMAN_TASK nodes (START -> task_a(HUMAN_TASK) -> task_b(HUMAN_TASK)
  -> END, single unconditioned edges throughout -- no PARALLEL_GATEWAY, no gateway of
  any kind). Reproduced deterministically by
  test/letflow/engine_complete_task_test.exs's "AC1 -- completing a PENDING task at an
  ordinary unconditioned-edge HUMAN_TASK" test (currently failing, `mix test
  test/letflow/engine_complete_task_test.exs`: `assert length(tasks) == 2` gets `1`).

  Root cause: `Letflow.Engine.Transition.advance_token/3` (transition.ex, used by the
  new `{:complete_task, token_id}` dispatch) moves a token to its next node by updating
  its `node_id` field in place -- the token's own `token_id` never changes. When that
  next node is itself a `:HUMAN_TASK`, `dispatch_human_task/3` appends this *same*
  `Token.t()` (same `token_id`, new `node_id`) to `pending_task_nodes`.

  `Letflow.Engine.complete_task/3`'s own `load_pending_task_tokens/3` (engine.ex)
  builds its "previous" pending-task set from every currently-`PENDING` `tasks` row --
  by the design doc's own explicit statement (`lib/letflow/design/req048-task-completion.md`
  §6.4), this deliberately *includes* the completing task's own token, on the stated
  assumption that "nothing ... removes an entry from pending_task_nodes ... the
  completing task's token therefore remains in final_instance_state.pending_task_nodes
  ... unchanged." That assumption is false whenever the token actually moves onward to
  another HUMAN_TASK within the same call: `TaskActivation.newly_pending_tokens/2`
  diffs `previous`/`new` pending-task lists **by `token_id` equality only** (unchanged
  from REQ-047, per that function's own doc), so the continuing token's *new* pending
  entry (at task_b, correct `node_id`) is filtered out as "already accounted for"
  purely because its `token_id` matches the stale "previous" entry -- even though that
  stale entry actually names a different (now-completed) task/node. Net effect: no
  `tasks` row is ever inserted for task_b. `instance_projections.current_nodes` and the
  live `tokens` row both correctly show the instance now waiting at task_b, but no
  `PENDING` task exists for it -- nothing can ever complete it via `complete_task/3`
  (task_b's own `token_id` never resolves to any `tasks` row via `find_token_for_task/2`
  either, since no such row exists). This appears to strand every instance that has two
  or more sequential HUMAN_TASK nodes with no intervening PARALLEL_GATEWAY split -- a
  very common real-world graph shape, not an edge case.

  Not the same finding as ISS-0056 (REVIEWER's already-filed MINOR finding about
  no-fallback/all-conditions-false HUMAN_TASK edges) -- that finding is about condition
  evaluation; this one is about task-row materialization and reproduces even with a
  single, ordinary, unconditioned edge.

  Candidate fix directions (not evaluated in depth -- ELIXIR-DEV/CODE-DESIGNER's call):
  build the "previous" pending-task set for `newly_pending_tokens/2` from
  `(token_id, node_id)` pairs instead of `token_id` alone (so a token's stale
  "previous" position no longer masks its genuinely-new position), or special-case
  excluding only the *actually-completing* task's own token from "previous" by task id
  rather than including every currently-PENDING token unconditionally.
affected_files:
  - lib/letflow/engine.ex
  - lib/letflow/engine/task_activation.ex
  - lib/letflow/design/req048-task-completion.md
status: resolved
resolved_by: ELIXIR-DEV
resolved_in_run: WF02-REQ048-20260818 (rework iteration 1 of 3)
resolution: >
  Fixed the root cause, not a workaround: `TaskActivation.newly_pending_tokens/2`
  (lib/letflow/engine/task_activation.ex) now diffs `previous_pending_task_nodes`
  against `new_pending_task_nodes` by the `{token_id, node_id}` pair instead of by
  `token_id` alone -- the first candidate fix direction this issue itself named. A
  token continuing directly from one HUMAN_TASK to another keeps the same `token_id`
  (`Transition.advance_token/3` updates `node_id` in place), so a stale
  `{token_id, old_node_id}` "previous" entry no longer masks the token's genuinely-new
  `{token_id, new_node_id}` pending position -- while a token whose position is
  genuinely unchanged across the hop-chain (the same `{token_id, node_id}` pair in
  both sets) is still correctly excluded, so no duplicate `tasks` row is ever
  attempted.

  `Letflow.Engine.load_pending_task_tokens/3` (lib/letflow/engine.ex) was updated to
  populate the real `node_id` of each currently-PENDING task's `Token.t()` (previously
  left `nil`/"unused" per the design doc's original §6.4 text) -- this field is now
  load-bearing for the pair diff above.

  `append_multi/6`'s own call site (`create/2`'s `persist/8`) is unaffected: its
  `previous_pending_task_nodes` argument is always `[]`, so the diff key change (pair
  vs. token_id-alone) makes no observable difference there -- confirmed by the full
  suite still passing with no regressions.

  Verification: `mix compile --warnings-as-errors` clean;
  `MIX_TEST_PARTITION=2 mix test test/letflow/engine_complete_task_test.exs` --
  8 tests, 0 failures (including the specific reproducing AC1 test,
  `assert length(tasks) == 2` now passes); full suite
  (`MIX_TEST_PARTITION=2 mix test`) -- 5 properties, 881 tests, 1 failure, and that one
  failure is the pre-existing, unrelated `test/letflow/identity_migration_test.exs`
  intermittent failure (ISS-0048), reproduced identically against the base commit with
  this fix removed, confirming it is not a regression.
