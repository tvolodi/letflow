id: ISS-0059
title: "Flaky slug collision in migrations_test.exs's insert_tenant! (:auto sandbox, real commits)"
discovered_by: TEST-RUNNER
discovered_in_run: WF02-REQ058-20260818
discovered_at: 2026-08-19T00:23:58Z
severity: MINOR
description: >
  test/letflow/definitions/migrations_test.exs's "REQ-027's two definition
  migrations replayed into a provisioned tenant schema uq_definition_version is a
  total UNIQUE index over exactly (name, version)" test intermittently fails with
  Ecto.InvalidChangesetError: tenants_slug_index has already been taken, on a slug
  like "req027-202" generated by insert_tenant!/0's
  "req027-#{System.unique_integer([:positive, :monotonic])}". Observed twice in
  three consecutive full `mix test` runs on this host (fails, passes, fails again
  with the same collision pattern but a different slug number), always in the
  same test module. This module deliberately uses Ecto.Adapters.SQL.Sandbox.mode
  :auto (real commits, not sandboxed-and-rolled-back) with an on_exit cleanup, per
  its own moduledoc comment. System.unique_integer/1 is only unique within a
  single BEAM VM run -- if a prior `mix test` invocation's on_exit cleanup didn't
  run (crash, forced kill, CI timeout) it can leave rows behind whose slug number
  is later replayed by a fresh VM's counter restarting from a low value, causing
  a collision against leftover data rather than against anything in the same run.
  Not related to REQ-058 (lua_script_execution_audit) -- this branch does not
  touch migrations_test.exs or insert_tenant!/0. Filed as a pre-existing flake
  discovered incidentally while running the full suite for WF02-REQ058-20260818's
  TEST-RUNNER step; forwarding per ISSUE_QUEUE.md rather than fixing in this run.
  Likely fix: generate the slug from something collision-proof across VM restarts
  (e.g. Ecto.UUID.generate/0 suffix) instead of a monotonic integer, or make
  on_exit robust to a crash by also cleaning stale req027-* tenants at test-module
  setup.
affected_files:
  - test/letflow/definitions/migrations_test.exs
github_issue: "https://github.com/tvolodi/letflow/issues/206"
status: open
