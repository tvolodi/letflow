id: ISS-0063
title: "merge_output_variables/5 always passes nil for VariableMerge.merge/3's variable_validations argument, so REQ-049's own schema-rejection ExecutionError branch can never fire via complete_task/3"
discovered_by: ELIXIR-DEV
