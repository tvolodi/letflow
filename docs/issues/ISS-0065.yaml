resolution_note: >
  Root cause (confirmed by direct reproduction against the reported failure, not
  inferred from the bug report's prose alone): System.cmd/3's documented Windows
  argv-reparsing caveat for subprocesses invoked through a .bat/.ps1 wrapper --
  `System.cmd("mix", ["run", "--no-start", "-e", script], ...)` resolves `mix` to
  mix.bat on Windows, and cmd.exe's batch-file argv reconstruction re-tokenizes the
  argument list rather than passing it through verbatim. The `-e <script>` element
  in test/support/tenant_slug_test.exs contained parentheses and quotes (a small
  Elixir script string), which cmd.exe's reparsing mangled, producing the "...) was
  unexpected at this time." batch parse error and the observed {"", 255} result
  instead of a clean {output, 0}. Linux hosts are unaffected because there is no
  .bat/.ps1 indirection in the exec path, which is why the failure never
  reproduced on this host.

  Fix: a private write_script_and_run/2 helper added to
  test/support/tenant_slug_test.exs that writes the Elixir script to a temp file
  (via System.tmp_dir!/0 + a unique filename) and invokes it as
  `System.cmd("mix", ["run", "--no-start", "<path-to-script-file>"], ...)` -- a
  plain file-path argv element with no embedded parens/quotes/spaces for
  cmd.exe's reparsing to mis-tokenize -- instead of passing the script inline via
  `-e`. Both call sites in the file were converted to use the helper. Script file
  cleanup is guaranteed via try/after (File.rm/1 in the after block) so a failing
  test run doesn't leak temp files.

  Verification: full suite (mix test) run on this Linux host: 942 tests, 5
  properties, 0 failures, including test/support/tenant_slug_test.exs in
  isolation with --include slow. Windows itself could not be directly verified
  from this environment (this host has no Windows/cmd.exe available) -- stated
  honestly rather than claimed: the fix is correct per System.cmd/3's documented
  argv-reparsing behavior for .bat-invoked subprocesses (avoiding the caveat
  entirely by never putting an argv element containing shell-special characters
  into the args list), not empirically verified on an actual Windows host.

  Commits: ef888b5 (design), f90919f (fix), 7bc0269 (regression tests covering
  both the fixed cross-VM collision scenario and the helper's temp-file
  cleanup-on-failure behavior).
