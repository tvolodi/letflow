resolution_note: >
  Fixed in two parts, design in
  lib/letflow/design/iss0069-unused-default-warnings-fix.md.

  Part 1 (full sweep, commit e95746e / squashed into 7094c30 on this
  branch): rather than fixing the 3 files named in affected_files
  incrementally, TEST-DESIGN-VALIDATOR directed a full repo-wide sweep
  instead. Found and fixed 9 total `defp` functions with unused
  `\\ default` arguments across 9 test files (not just the 3 originally
  named) -- mechanical, behavior-preserving removal of the default value
  where no caller relied on it. Confirmed zero "default values" warnings
  remain; 1029 tests passing at that point.

  Part 2 (gate closure, two rounds):
  round 1 attempted a blanket `test --warnings-as-errors` step in the
  `letflow.check` alias, then reverted it after ELIXIR-DEV proved it could
  never exit 0 -- docs/issues/ISS-0044.yaml (already resolved) had
  independently diagnosed two other warning classes (ExUnit.Case.register_test/4
  deprecation from stream_data 0.6.0's property macro; a deliberate
  Code.require_file/1 module-redefinition workaround in
  test/letflow/event_store/registry_test.exs) as permanently deferred, both
  surfacing only under `mix test` and both out of this issue's scope.
  round 2 (this run, commit 7094c30) replaced the blanket flag with a
  targeted custom Mix task, lib/mix/tasks/letflow.check.test.ex, that runs
  `mix test` and fails only on real test failures or output containing the
  specific "default values for the optional arguments" substring --
  ignoring the two known-deferred classes. Regression test at
  test/mix/tasks/letflow_check_test_test.exs proves fail-then-pass
  (synthetic default-arg warning fails the task; removing it passes).
  Full suite verified by TEST-RUNNER: 5 properties, 1032 tests, 0
  failures; `mix letflow.check` exits 0 clean. GitHub issue 231 closed.
