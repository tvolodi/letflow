description: >
  get_next_task (agent_id hetzner-orch) claimed queue task 127 / GH issue #255
  ("Derived idempotency-key suffixes in sub_process.ex have no shared
  constant/helper (type-safety)"). The task body cites
  "Local record: docs/issues/ISS-0068.yaml", but that file's actual on-disk
  content is a different, already-resolved finding (the mix format
  toolchain-drift issue) -- ISS-0068 was reused/reassigned by a concurrent
  host after GH#255 was filed, the same ISS-number collision class documented
  in docs/anti-patterns.md ("Two branches picking the same module name...").

  More importantly, the finding's target file, lib/letflow/engine/sub_process.ex,
  does not exist on main at all (confirmed via `find lib -iname "*sub_process*"`
  and `git log --all -- '**/sub_process.ex'`). It exists only on
  feature/WF02-REQ062-20260819 (REQ-062, "Sub-process invocation runtime
  half"), which hit max_rework and was escalated
  (handoffs/escalations.yaml, run WF02-REQ062-20260819, 2026-08-19T05:58:07Z)
  rather than merged. The finding itself ("Discovered by REVIEWER during
  WF02-REQ062-20260819 rework-cycle review") was filed as an incidental issue
  during that same rework cycle, before the parent requirement escalated
  instead of landing.

  This mirrors GH#228 (ISS-0067, same "sub_process.ex" root, referenced in
  handoffs/orchestrator.log:863 as similarly unclaimable) -- a second issue
  from the same rework cycle with the same structural problem: a WF-03 run
  cannot diagnose/fix/regression-test code that isn't on main, and Step 00's
  git setup would branch from main where the target file is absent.

  Not resolvable via WF-03 until REQ-062 itself lands (merged or its branch's
  content otherwise reaches main). Queue task 127 released with
  status: "blocked" (not "done", not left "open") so it doesn't get
  repeatedly re-claimed and re-discovered as unactionable by other hosts
  working this same backlog. It becomes claimable/re-evaluated once REQ-062
  merges -- whichever session handles that merge should also revisit this
  task's status.
