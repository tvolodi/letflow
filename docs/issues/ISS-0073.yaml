status: resolved
resolved_in_run: WF03-ISS0072-20260819
resolved_at: "2026-08-19T11:39:26Z"
resolution_note: >
  Fixed by editing only test/ fixtures (lib/letflow/tenant_provisioning.ex left
  untouched, per this run's own directive). `mix test` before: 90 failures (the
  80 originally reported here plus 10 more of the same class this issue's own
  filing didn't individually re-confirm file-by-file). `mix test` after: 0
  failures attributable to `duplicate_event_type_version` or any related
  schema-validation regression (`grep -c duplicate_event_type_version` on the
  post-fix full-suite log returns 0). Remaining ~13 failures on a full run are
  a confirmed-unrelated, pre-existing flaky/test-pollution class (this issue's
  own text already named 10 of them -- Letflow.IdentityMigrationTest's
  foreign_key_violation on tenant_schemas; this run additionally saw
  Mix.Tasks.Letflow.Check.TestTest's 60s subprocess timeouts, and, on
  different runs, one-off "schema does not exist"/FK failures in
  Letflow.Definitions.PromotionConflictTest, PromotionAssertionRerunTest, and
  Letflow.Definitions.StoreTest -- each independently confirmed to pass when
  its own file is run in isolation, and none reference
  duplicate_event_type_version or any file this run touched).

  Two categories of fix, by file:

  (a) Simply redundant -- self-registered json_schema was structurally
  equivalent in intent to what tenant_provisioning.ex now seeds (both
  permissive `%{"type" => "object"}` test fixtures standing in for the same
  named type, no real content conflict once compared against what the real
  production writer actually emits). The fixture's own `register_type/2` call
  (and, where now-unused, its `register_event_type!/2` helper and `Registry`
  alias) was deleted outright, relying on provisioning's own seed instead:
    - test/letflow/engine_complete_task_test.exs (TASK_COMPLETED)
    - test/letflow/engine_cancel_instance_test.exs (TASK_COMPLETED,
      INSTANCE_CANCELLED)
    - test/letflow/engine_concurrency_test.exs (TASK_COMPLETED)
    - test/letflow/engine_sub_process_test.exs (TASK_COMPLETED,
      EXECUTION_ERROR, SUB_PROCESS_COMPLETED, INSTANCE_CANCELLED)
    - test/letflow/engine_execution_error_test.exs (EXECUTION_ERROR, in its
      `provisioned_tenant/0`)
    - test/letflow/engine_plugin_error_routing_test.exs (EXECUTION_ERROR)
    - test/letflow/engine/snapshot_writer_test.exs (TASK_COMPLETED,
      EXECUTION_ERROR)
    - test/letflow/engine/reconstruction_test.exs (TASK_COMPLETED,
      INSTANCE_CANCELLED, EXECUTION_ERROR, SUB_PROCESS_COMPLETED --
      BOGUS_EVENT_TYPE, which has no production writer and isn't auto-seeded,
      kept registered as before, no collision)
    - test/letflow/engine/service_task_routing_test.exs (EXECUTION_ERROR)

  (b) Genuine conflicts, not mere duplicates -- required a real, deliberate
  fix rather than deletion:
    - test/letflow/engine_execution_error_test.exs's
      `provisioned_tenant_without_execution_error_type/0`: this fixture's
      whole premise ("EXECUTION_ERROR is unregistered") became unreachable via
      the default manifest once provisioning started auto-seeding it. Fixed by
      deleting the auto-seeded row (via the real
      `Letflow.EventStore.Registry.EventType` schema) immediately after
      provisioning, reconstructing the exact state AC2's atomicity test needs.
    - test/letflow/engine/pin_rebind_test.exs: provisioning's own seeded
      json_schema for INSTANCE_PINS_REBOUND types `prior_version`/
      `new_version` as `"integer"`, but `Letflow.Engine.PinRebind`'s real
      `String.t()`-typed fields mean every real `rebind_pins/3` write is
      schema-invalid against that seed -- a genuine production bug in
      ISS-0072's fix, not just a test-fixture duplicate (filed separately as
      ISS-0074/GH#269, out of this run's test/-only scope to fix at the
      source). Worked around by deleting the wrongly-typed auto-seeded row and
      re-registering the same name/version with a corrected string-typed
      schema, so this file keeps testing the real "INSTANCE_PINS_REBOUND" name
      end to end (PinRebind hardcodes that name, so a distinctly-named
      test-only type was not a viable option here).
    - test/letflow/engine_cancel_instance_test.exs's AC3 "further append after
      cancellation" test sent a bare `%{probe: true}` payload, relying on the
      old permissive fixture schema to reach `EventStore.append/2`'s
      `:instance_terminated` check. Against the real stricter schema that
      payload now fails `Registry.validate_payload/3` (which runs *before*
      the `:instance_terminated` check, per event_store.ex's own P4 ordering)
      before reaching the check the test actually means to exercise. Fixed by
      sending a schema-valid `%{cancelled_task_ids: [], cancelled_token_ids:
      []}` payload instead, so the test reaches and proves the intended
      check.
    - test/letflow/engine/reconstruction_test.exs's AC4 "EXECUTION_ERROR
      reconstructs to status ERROR" test hand-built an
      `EventStore.append/2` payload with only a `variables` key. Fixed by
      adding the schema's other required fields (`error_type`, `affected`,
      `reason`) with minimal placeholder values, preserving the `variables`
      assertion the test actually cares about.

  Verified via real `mix test` runs (not self-report): pre-fix 90 failures
  (`/tmp/pretest.log`), post-fix 0 `duplicate_event_type_version`-class
  failures across three separate full-suite runs, plus a dedicated
  re-run of every file this issue's own affected_files list named together
  (pin_rebind_test.exs + engine_cancel_instance_test.exs +
  reconstruction_test.exs: 40/40 passed) to rule out flakiness on the specific
  fixes above.
