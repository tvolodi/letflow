scoping_note: >
  Filed by ORCH during REQ-109's re-gate rather than fixed inline, for two
  reasons. (a) REQ-109 already edits this exact moduledoc under its AC9;
  a concurrent ORCH edit to the same docstring would collide. (b) Per
  core-directives' Unblock-Everything scope boundary this is a noticed
  pre-existing defect, not a REQ-109 blocker, and per "No Issue Left
  Local-Only" it must not evaporate into a conversation.

  RECOMMENDED DISPOSITION: fold both repairs into REQ-109's AC9, since that
  AC already requires opening and editing this file and the marginal cost is
  two sentences. If REQ-109's scope is judged already full, this stands
  alone as a docs-only fix owned by DOC-UPDATER. Either way it should not be
  scheduled as an independent WF-03 run -- the edit is smaller than the
  pipeline overhead of routing it.
