scoping_note: >
  Filed by ORCH rather than folded into REQ-109. ISS-0075's two repairs went
  into REQ-109's AC9 because REQ-109 already opens and edits that exact
  file; none of the files here is touched by REQ-109, so folding them in
  would be scope creep on a requirement that has already passed its gate
  (REQ-VALIDATOR PASS, WF01-REQ109-20260819).

  lib/letflow/engine/variable_merge.ex is deliberately EXCLUDED from
  affected_files -- REQ-109's AC9 owns that file's three corrections and
  needs the stale sentences present to correct in place. Editing it here
  would collide with REQ-109's diff and destroy REQ-049 AC4's evidence
  artifact.

  RECOMMENDED SEQUENCING, cheapest-first:
    1. req060-pin-rebind.md:134 -- stop the caveat being prescribed to
       future moduledocs. Docs-only, DOC-UPDATER, independent of the rest.
       Do this first regardless of what else is decided.
    2. The remaining flat occurrences -- restate or drop the environment
       claim. Docs-only. Use the loose grep pattern above, not a literal
       phrase.
    3. Item (1)'s shipped open questions (REQ-059 OQ-1, REQ-060 OQ-5 and
       siblings) -- genuine investigation against now-readable R-Co
       sources, with a real chance of surfacing a behavioural finding.
       Should be its own requirement, NOT bundled into a docs sweep.
    4. req062's citation audit -- same character as 3, separately scoped.
  Do not schedule 1 and 2 as independent WF-03 runs; those edits are smaller
  than the pipeline overhead of routing them. Items 3 and 4 are real work
  and should be sized as requirements by REQ-ANALYST.
