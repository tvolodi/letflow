  - audit
description: >
  ISS-0075 fixed ONE instance of this claim in
  lib/letflow/engine/variable_merge.ex, where it had caused a CORRECT
  reconstruction of R-Co's merge semantic to be documented as an unverified
  guess. Auditing for siblings found the pattern is systemic: 30 occurrences
  across 11 files, several of which DEFERRED DESIGN QUESTIONS IN SHIPPED
  REQUIREMENTS on the grounds that R-Co could not be consulted.

  The R-Co source tree IS reachable at c:\Users\tvolo\dev\ai-dala\R-Co and
  was read directly throughout WF01-REQ109-20260819.

  READ THIS BEFORE GREPPING -- THE WORDING IS INCONSISTENT. ORCH's first
  grep for the literal string "no R-Co source tree is reachable in this
  environment" returned ZERO matches across all five files that demonstrably
  contain the claim. Observed variants include: "No R-Co source tree is
  reachable in this environment", "no R-Co source tree was reachable",
  "no R-Co source available", "unreachable R-Co source", "without R-Co
  source access", "no R-Co source was reachable to confirm", and
  "(unreachable in this environment)". A sweep that greps one phrasing will
  silently conclude the work is done. Use a loose pattern such as
  `-i "no R-Co source|R-Co source tree|unreachable R-Co|without R-Co source"`
  and re-verify the count.

  AFFECTED FILES (30 hits total; counts exclude this issue file and
  ISS-0075):
    - lib/letflow/design/req059-pin-resolver.md      (incl. OQ-1)
    - lib/letflow/design/req060-pin-rebind.md        (incl. OQ-5)
    - lib/letflow/design/req062-sub-process-runtime.md
    - lib/letflow/design/promotion_plan.md
    - lib/letflow/design/req018-jit-provisioning.md
    - lib/letflow/design/req041-pack-update-diff-schema.md
    - lib/letflow/design/service_task.md
    - lib/letflow/engine/pin_resolver.ex   (SHIPPED moduledoc)
    - lib/letflow/engine/pin_rebind.ex     (SHIPPED moduledoc)
    - lib/letflow/engine/sub_process.ex    (SHIPPED moduledoc)
    - lib/letflow/engine/variable_merge.ex (owned by REQ-109 AC9; see below)

  MITIGATION -- these are NOT uniformly as bad as ISS-0075's. Most add that
  the requirement author verified against R-Co directly, and scope the claim
  to "never a second, unverifiable read." variable_merge.ex's was the only
  one that FLATLY declared its own reconstruction unverified, which is why
  it was the one that understated a guess that turned out correct. Do not
  bulk-rewrite on the assumption they all carry the same defect; assess each.

  THREE ITEMS DESERVE ACTION BEYOND A DOCS SWEEP:

  PROVENANCE (historical, not current decision authority):
  (1) SHIPPED OPEN QUESTIONS THAT ARE NOW ANSWERABLE -- the highest-value
  item. These were deferred specifically because R-Co could not be read, and
  their source files exist and are readable today
  (R-Co/src/engine/pin_resolver.zig, R-Co/src/engine/pin_rebind.zig,
  R-Co/src/api/routes/pin_rebind.zig):
    - req059-pin-resolver.md:538 -- "OQ-1: no R-Co source available. Every
      claim above sourced from REQ-059's own requirement text..."
    - req060-pin-rebind.md:551 -- "OQ-5: no R-Co source available, same
      standing caveat REQ-059's design..."
    - req060-pin-rebind.md:464 -- concurrent rebind-vs-rebind behaviour
      "unverifiable without R-Co source access"
    - req060-pin-rebind.md:100 -- a question "R-Co source could settle
      (unreachable in this environment)", explicitly left to REVIEWER
    - req062-sub-process-runtime.md:674 -- verifies a claim but explicitly
      "does not verify against unreachable R-Co source"
  REQ-059, REQ-060 and REQ-062 are all `done` and shipped. These are open
  questions standing in shipped design rationale that are answerable now.

  (2) req060-pin-rebind.md:134 IS SECOND-ORDER -- it does not merely carry
  the caveat, it PRESCRIBES it as required moduledoc content for
  implementations written against it. Left in place it keeps minting new
  stale claims in files that do not exist yet, which is how ISS-0075's
  defect was created. Fix this even if every other occurrence is judged
  acceptable: it is the only one that reproduces itself.

  PROVENANCE (historical, not current decision authority):
  (3) req062-sub-process-runtime.md:11 IS UNVERIFIED BY CONSTRUCTION -- it
  states that ALL of its instance.zig/transition.zig line citations came
  verbatim from handoff text rather than a direct read. REQ-062 is shipped,
  so those citations are load-bearing for future readers. Line citations
  demonstrably drift: in this run two ORCH citations were off by two lines
  (extractFormSchemaJson at instance.zig:5490 not :5488; the tasks.zig field
  read at :896 not :894). Neither mattered, but that was luck rather than
  method, and both were caught only because someone re-read the source. A
  WRONG citation in shipped design rationale is worse than an absent one,
  because it reads as verified.

  SCOPE NOTE -- THE REAL RISK. Verifying any of these may reveal that a
  "reasoned reconstruction" was WRONG, not merely under-attributed as
  ISS-0075's turned out to be. ISS-0075's guess was correct; that is
  evidence about one guess, not about the method. A wrong reconstruction in
  shipped code is a behavioural finding and MUST be filed as its own issue
  and routed through WF-03, never quietly corrected inside a documentation
  sweep.
correction: >
  CORRECTED 2026-08-19T20:05Z by ORCH, after REQ-ANALYST re-measured while
  scoping REQ-110/111/112. THIS ISSUE'S ORIGINAL FILE LIST AND HIT COUNT
  WERE BOTH WRONG, and the cause is the exact trap this issue warns about,
  one level up: the file list was derived FROM the recommended grep
  pattern, so the two were self-consistent and neither could reveal the
  other's blind spot. An issue about circular verification was itself
  circularly verified.

  COUNT. The original "30 occurrences across 11 files" is not reproducible
  by any pattern. It came from grepping lib/ AND docs/, so it counted this
  issue file, ISS-0075, and docs/requirements.yaml -- the record counting
  itself. Re-measured against lib/ only: 21 hits / 11 files under this
  issue's own recommended pattern; 29 hits / 15 files under a broadened
  one. Do not trust any of 30, 29 or 21 -- REQ-112's first AC makes the
  count an OUTPUT of the run, re-derived rather than inherited.

  BROADENED PATTERN (the recommended one misses four files). Add these
  alternations: `R-Co source (was|is) not`, `unreachable in this
  environment`, `unverifiable without R-Co`.

  FOUR FILES ONLY THE BROADER PATTERN FINDS:
    - lib/letflow/design/req050-exclusive-gateway-cel.md
    - lib/letflow/design/req052-instance-cancellation.md
    - lib/letflow/design/req061-execution-error-handling.md
    - lib/letflow/engine/execution_error.ex  <-- A FOURTH SHIPPED MODULEDOC

  execution_error.ex:5 IS THE MOST CONSEQUENTIAL MISS, for a reason
  neither this issue nor REQ-ANALYST stated. Its moduledoc ports
  `setInstanceError()` citing R-Co `~L3078` and its ERROR-CODE TABLE at
  `~L4067` as "unreachable in this environment" -- note the `~` on both:
  these are approximate citations by their own admission, drift built in
  from the start. That module is REQ-061's. REQ-061 owns the
  ExecutionError branch that REQ-109 exists to make reachable (ISS-0063 /
  GH#212). So the error-code table backing the very branch about to be
  lit up for the first time was never verified against R-Co, and REQ-109
  will make its output observable in production. This is a direct
  REQ-109 adjacency, not a generic docs nit -- whoever runs REQ-110/111
  should treat it as higher priority than its MINOR severity suggests.

  req050-exclusive-gateway-cel.md IS SELF-FLAGGING. Line 19 takes CEL's
  `translateCelToExpr()` literal rewrite/boundary rules without R-Co
  verification on a shipped S3 gateway path, and line 490 states:
  "Flagged for REVIEWER/RELEASE-VALIDATOR re-check if R-Co source access
  becomes available." That condition is now met. The document asked to be
  re-checked under exactly today's circumstances.

  DISPOSITION: REQ-110/111/112 (committed 66faa2c) are written against
  the broadened pattern and require the count be re-derived, with a
  dedicated AC naming execution_error.ex:5 so this gap is demonstrably
  closed rather than inherited. affected_files below is corrected to the
  15-file measurement.
