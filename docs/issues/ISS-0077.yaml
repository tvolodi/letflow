scoping_note: >
  DELIBERATELY NOT FIXED INSIDE REQ-109. REQ-109's own scope forbids
  altering `merge/3`, and CODE-DESIGNER correctly followed AC5 as written
  and raised this as its design OQ-1 rather than quietly widening the port.
  That was the right call: silently changing a shipped pure function's
  validation surface inside an unrelated requirement is exactly the class of
  change the producer/validator pipeline exists to prevent.

  ROUTING: this needs its own WF-03 run, or a requirement if the fix proves
  larger than an issue-fix. It is NOT a blocker for REQ-109 -- REQ-109 is a
  strict improvement even with this gap present (it validates overwrites,
  which today are not validated at all), and holding REQ-109 for this would
  block the fix for ISS-0063 behind a newly-discovered second defect.
  Sequencing them the other way costs nothing.

  DECISION REQUIRED BEFORE A FIX IS DESIGNED, and it is not obvious: does
  Letflow adopt R-Co's semantic (validate all keys) or keep its own
  (overwrite-only)? Adopting R-Co's is the migration-fidelity answer and
  closes the bypass, but it changes a shipped pure function's contract,
  invalidates REQ-049 design sec 3.1 and its AC, and would reject payloads
  that are accepted today -- a behaviour change visible at the API boundary
  for any tenant already relying on first-write leniency. Keeping Letflow's
  requires an explicit, recorded justification for diverging from the source
  system on a validation-bypass question, which no current record provides
  (sec 3.1 states the rule but argues no rationale for it beyond stating it).
  REVIEWER should decide, and given it contradicts a shipped requirement's
  acceptance criterion it likely warrants a decision record under
  docs/migration/decisions/.

  Whoever picks this up: verify BOTH sides directly rather than trusting
  this note. R-Co instance.zig:2389-2430 (Phase 1 iteration and the
  unconditional schema_map.get) and :2432 (the separate collision check);
  Letflow variable_merge.ex:153-183 (the split_with and the
  find_rejection(overwrite_keys, ...) call). That is the specific lesson
  this issue exists to record.
