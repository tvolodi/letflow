id: ISS-0077
title: "VariableMerge.merge/3 validates ONLY overwrite candidates, but R-Co validates EVERY output key -- a brand-new variable with a registered schema bypasses validation entirely, so the first write of a variable (the one most likely wrong) escapes its own schema"
discovered_by: CODE-DESIGNER
discovered_in_run: WF02-REQ109-20260819 (Step 1 design)
discovered_at: "2026-08-19T20:22:38Z"
severity: MAJOR
tags:
  - behavioural-divergence
  - req-049
  - req-109
  - variable-validation
  - validation-bypass
  - r-co-verification
description: >
  BEHAVIOURAL DIVERGENCE IN SHIPPED CODE, found by direct source comparison
  during REQ-109's design step. Not a docs defect.

  Letflow's `Letflow.Engine.VariableMerge.merge/3` splits incoming keys into
  `new_keys` and `overwrite_keys`, then validates ONLY the latter --
  `lib/letflow/engine/variable_merge.ex:160` reads
  `find_rejection(overwrite_keys, validations)`. Keys absent from
  `current_variables` are inserted unconditionally with no schema check. This
  is REQ-049 design doc sec 3.1's stated rule ("new_keys are NEVER looked up
  in variable_validations at all") and is faithfully implemented.

  R-Co does NOT do this. `mergeVariables`' Phase 1
  (R-Co/src/engine/instance.zig:2389-2430) iterates EVERY key of
  `output_variables` via `var it = output_variables.iterator()` and checks
  `if (schema_map.get(key))` unconditionally -- no comparison against
  `current_vars` is involved in the validation decision at all. Collision
  detection is a SEPARATE, later check (`if (current_vars.get(key))` at
  :2432) whose only role is deciding whether a VARIABLE_OVERWRITTEN event is
  recorded. In R-Co a brand-new key carrying a registered schema IS
  validated and CAN produce a SCHEMA_VIOLATION.

  CONSEQUENCE. The first write of a variable -- the write most likely to be
  malformed, and the only one for which no prior good value exists -- is
  precisely the write that escapes its own schema. Every subsequent write of
  the same key is validated. This inverts the intended protection.

  This becomes live rather than theoretical when REQ-109 lands. REQ-109
  ports R-Co's `variable_schemas` table and wires per-key validation into
  `merge_output_variables/5`, making REQ-061's rejection branch reachable
  for the first time (ISS-0063 / GH#212). After REQ-109, an operator who
  registers a schema for a variable will reasonably believe that variable is
  constrained -- and it will not be, on the write that creates it. A
  validation feature that silently does not apply on first write is worse
  than an absent one, because it is trusted.

  PROVENANCE -- this was flagged as unverified and then propagated as fact.
  REQ-049's own design doc could not check it (no R-Co source was reachable
  on the host that wrote it -- see ISS-0076/GH#297 for that systemic issue).
  ORCH then asserted the overwrite-candidates-only rule as verified fact in
  briefs to REQ-ANALYST, REQ-VALIDATOR and CODE-DESIGNER during
  WF01-REQ109/WF02-REQ109, having inherited it from the design doc rather
  than deriving it from R-Co. CODE-DESIGNER checked the source and caught
  it. This is the fourth recurrence in one session of the inherited-claim
  anti-pattern now recorded in docs/anti-patterns.md, and the first with a
  behavioural consequence rather than a documentation one.
