scoping_note: >
  Filed, NOT fixed, per REQ-110's NON-NEGOTIABLE clause -- this audit makes
  zero changes to engine behaviour so the finding survives as a record and
  the fix passes through CODE-DESIGNER, SECURITY-REVIEWER and REVIEWER.

  PROVENANCE (historical, not current decision authority):
  ROUTE THROUGH WF-03. Separable decisions the fix design must settle:
    1. Does a rebound pin's `source` become `:override` (matching R-Co and
       its test at pin_resolver.zig:914), or does Letflow introduce a
       distinct `:rebound` value? R-Co reuses `.override` for both producers,
       which loses the distinction between "caller overrode at start" and
       "operator rebound mid-flight". Letflow's `source` type
       (pin_resolver.ex:139) would need widening for the alternative, and
       `normalize_source/1` (:473-476) with it. Matching R-Co is the
       lower-risk option but is not obviously the better one; decide it
       deliberately.
    2. Should `resolved_id` follow `version` on a rebind? R-Co sets it to
       `change.new_version` (pin_resolver.zig:130) -- note that is the
       VERSION string stored into a RESOLVED_ID field, which looks like an
       R-Co quirk rather than an intention worth porting. Letflow's
       `INSTANCE_PINS_REBOUND` payload may not even carry a new
       `resolved_id` to use; check REQ-060 §5's payload shape before
       designing this one.
    3. Unknown-ref rebind entries: append (R-Co), drop (today), or error?
       R-Co's own comment calls its append "defensive only" because PIN-05's
       UnknownPinRef gate should prevent it -- Letflow has that same gate, so
       this is about what happens when the gate is bypassed, not normal flow.
    4. Threading the INSTANCE_STARTED event id into `merge_effective_pins/2`
       so `source_event_id` stops being `nil` and the shipped code stops
       contradicting `effective_pin()`'s own @type. This one has an arity
       change on a public function, so it needs REVIEWER on the call sites.

  Item 2 is the clearest case in this issue where copying R-Co would be
  copying a defect. Do not treat "match R-Co" as the default answer.

  PROVENANCE (historical, not current decision authority):
  TEST-DESIGNER note for the eventual WF-03 Step 4: R-Co's own test at
  pin_resolver.zig:898-914 is a directly portable fail-first regression case
  for item 1 -- seed a pin with source :resolved, fold one rebind, assert the
  source flipped. It fails against today's code.
