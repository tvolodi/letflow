id: ISS-0079
title: "PinResolver.resolve/4 trusts caller-supplied pin overrides verbatim; R-Co re-resolves every override against the catalog and rejects any that does not name the currently-resolvable version (UnresolvedPinOverride / HTTP 422), rejects module overrides outright, and rejects an override naming a ref the graph does not reference"
