id_note: >
  ORIGINALLY WRITTEN AS ISS-0077 and filed on GitHub as #298 under that id.
  A concurrent run (`WF02-REQ109-20260819`, CODE-DESIGNER) independently
  claimed ISS-0077 for an unrelated VariableMerge finding at almost the same
  moment and its file landed second, overwriting this one. Renumbered to
  ISS-0079 here rather than reverting the other agent's work; GH#298's body
  was edited to point at this file. If you followed a stale ISS-0077
  reference from GH#298, this is the record you wanted.

  Root cause is the issue-id allocation scheme itself: `ls docs/issues/ |
  tail -1` plus one is not atomic across concurrent hosts, and nothing in
  `docs/agents/protocols/ISSUE_QUEUE.md` serialises it. Worth raising with
  ORCH -- the same race can silently destroy an issue record rather than
  merely renumber one, and here it did (the original ISS-0077 content was
  only recoverable because this run still had it in context).
description: >
  Found by REQ-110's audit of REQ-059's OQ-1
  (lib/letflow/design/req059-pin-resolver.md:538), which self-described as
  "this design's single largest unverified inference": REQ-059's requirement
  text names `:override` as a valid `source` value but never describes what
  PRODUCES it, and the design's §4.1 invented a mechanism, stating that if
  R-Co's actual mechanism "differs materially from §4.1's design,
  ELIXIR-DEV/REVIEWER must correct this design before building against it."
  REQ-059 shipped against it. R-Co's source is now readable and the
  mechanism DOES differ materially, on a shipped S3 instance-start path.

  PROVENANCE (historical, not current decision authority):
  R-CO'S ACTUAL MECHANISM (all lines read directly this run in
  c:\Users\tvolo\dev\ai-dala\R-Co\src\engine\pin_resolver.zig):

  PROVENANCE (historical, not current decision authority):
  - Overrides arrive as raw caller-supplied JSON on `ResolutionInput`
    (`pin_overrides: ?[]const u8`, pin_resolver.zig:206) shaped
    `{kind, ref, version}[]` -- there is NO `resolved_id` in the wire form.
    R-Co derives `resolved_id` itself from its own catalog lookup.

  PROVENANCE (historical, not current decision authority):
  - Overrides are applied as Step 5 (pin_resolver.zig:296-299), AFTER full
    normal resolution (Steps 2/3 at :254-290) has already run and produced
    every pin with `.source = .resolved` (:265). An override is an OVERLAY
    onto an already-resolved pin set, never a substitute for resolving.

  PROVENANCE (historical, not current decision authority):
  - `applyPinOverrides()` (pin_resolver.zig:602-691) VERIFIES each override
    before applying it. For `catalog_entry` it calls
    `resolveServiceCatalogRef()` and requires the override's `version` to
    equal the currently-resolvable version, else `UnresolvedPinOverride`
    (:648-661). For `variable_schema` it recomputes the current hash and
    requires an exact match, else `UnresolvedPinOverride` (:670-683).

  PROVENANCE (historical, not current decision authority):
  - `kind: module` overrides are rejected UNCONDITIONALLY
    (pin_resolver.zig:642: "a module override can never verify --
    UnresolvedPinOverride").

  PROVENANCE (historical, not current decision authority):
  - An override naming a ref that is NOT in the enumerated pin set is an
    ERROR, not a no-op: `applyOverrideToPins()` returns false when no pin
    matches (pin_resolver.zig:707-723, the `return false` at :723), and both
    call sites turn that into `UnresolvedPinOverride` (:662-664, :684-686).

  PROVENANCE (historical, not current decision authority):
  - `UnresolvedPinOverride` is a first-class member of `ResolutionError`
    (pin_resolver.zig:189-190, documented "pin_overrides names a version that
    does not exist (PIN-01 AC4). HTTP 422"), and aborts resolution ENTIRELY
    with no partial pin set kept (:598-601).

  PROVENANCE (historical, not current decision authority):
  - `.source = .override` is set by exactly one line on this path:
    `applyOverrideToPins()` at pin_resolver.zig:719, only after verification
    succeeded.

  SHIPPED LETFLOW BEHAVIOUR (lib/letflow/engine/pin_resolver.ex, read this
  run):

  - `resolve_one_ref/4` (pin_resolver.ex:317-328) checks `find_override/3`
    FIRST and, on a hit, emits
    `%{kind:, ref:, resolved_id:, version:, source: :override}` taking
    `resolved_id` and `version` verbatim from the caller, and never calls
    `lookup_fun` for that ref at all. `resolve_variable_schema/3`
    (:353-379) does the same for the `:variable_schema` entry.

  - There is NO verification step of any kind. A caller may pin any
    arbitrary `version` string and any arbitrary `resolved_id` -- including
    ones naming nothing that exists -- and it is written into the
    `INSTANCE_STARTED` payload as an authoritative pin.

  - `override_entry()` (pin_resolver.ex:153-158) explicitly permits
    `kind: :catalog_entry | :module | :variable_schema`, so a `:module`
    override is accepted where R-Co rejects it categorically.

  - An override naming a ref the graph does not reference is silently
    ignored, because `find_override/3` is only ever consulted per already-
    enumerated ref (`resolve_refs/4`, pin_resolver.ex:304-315).

  - `resolve_error()` (pin_resolver.ex:184-187) has no
    `unresolved_pin_override` variant at all, so there is no error this path
    could return even if verification were added.

  BEHAVIOURAL DELTA. Given identical input, a `pin_overrides` entry naming a
  stale or nonexistent version causes R-Co to reject instance creation with
  HTTP 422 UNRESOLVED_PIN_OVERRIDE and create nothing; Letflow accepts it and
  persists an `INSTANCE_STARTED` event whose pin set asserts a version that
  was never verified to exist. Because pins are immutable after
  `INSTANCE_STARTED` except through `PinRebind` (REQ-060), and PIN-03's
  `pin_for/3` is documented "no fallback, ever", an unverified override
  poisons every later execution-time lookup for that instance's whole
  lifetime. This is a trust-boundary difference on a tenant-facing input,
  not a cosmetic one -- SECURITY-REVIEWER should be in the loop on the fix.

  ADJACENT DELTAS OBSERVED IN THE SAME §4.1/§4.3 SECTIONS. Recorded here so
  the record is not lost; these are NOT the override mechanism and each needs
  its own assessment rather than being assumed to travel with it:

  PROVENANCE (historical, not current decision authority):
  (a) DEDUPLICATION. Letflow deduplicates enumerated refs with `Enum.uniq()`
  (pin_resolver.ex:292), so two `SERVICE_TASK` nodes sharing one `service_id`
  yield ONE pin entry. R-Co appends one pin per node with no dedup whatsoever
  (pin_resolver.zig:254-267), yielding TWO identical entries. This changes the
  `INSTANCE_STARTED` payload's pin-list length and therefore its bytes.
  Letflow's behaviour is arguably the better one; it is nonetheless a
  divergence from the port and was never flagged as a deliberate deviation.

  PROVENANCE (historical, not current decision authority):
  (b) SORT ORDER. Letflow sorts by `Atom.to_string(kind)`
  (pin_resolver.ex:383-385), giving catalog_entry < module < variable_schema.
  R-Co sorts by `@intFromEnum(kind)` (`pinLessThan`, pin_resolver.zig:730-735)
  against `PinKind = enum { catalog_entry, variable_schema, module }`
  (:25), giving catalog_entry < variable_schema < module. The two orders
  differ whenever a `module` pin exists. NOTE THE HONEST LIMIT: R-Co can
  never actually produce a `module` pin, because any `module_ref` returns
  `UnresolvedModuleRef` unconditionally (pin_resolver.zig:275-284, PLC-01 not
  built), so R-Co's own ordering for that kind is unexercised and this
  divergence is unobservable in R-Co today. It becomes observable in Letflow
  the moment a real `module_lookup` is supplied. PIN-01 AC5 makes ordering
  load-bearing, so it should be settled deliberately rather than inherited.
