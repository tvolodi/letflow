scoping_note: >
  Filed, NOT fixed, per REQ-110's NON-NEGOTIABLE clause. REQ-110 is an audit
  whose deliverable is findings; it makes zero changes to engine behaviour,
  and repairing this inside the audit would bypass CODE-DESIGNER,
  SECURITY-REVIEWER and REVIEWER on a shipped tenant-facing engine path and
  destroy the record of what was wrong.

  ROUTE THROUGH WF-03. The fix is NOT mechanical and must not be treated as
  one. At least four separable decisions need a design:
    1. Should Letflow verify overrides against the injected `Lookup` (the
       nearest analogue of R-Co's catalog re-resolution), and does that make
       `resolve/4` non-pure in a way §4.1's "no lookup call at all" was
       specifically written to avoid?
    2. Does `resolve_error()` gain an `{:unresolved_pin_override, ref}`
       variant, and what does `Engine.create/2` map it to?
    3. Is `kind: :module` still a legal override, given R-Co rejects it only
       because PLC-01 does not exist -- an artefact of R-Co's own scoping,
       not a principled rule Letflow must inherit?
    4. Is a stray override ref an error or a no-op?
  Item 3 in particular is a case where copying R-Co would be copying a
  stopgap. Do not assume "match R-Co exactly" is the right answer to all
  four.

  Adjacent deltas (a) and (b) in the description are recorded for the same
  designer but should be dispositioned separately -- (a) may well be a
  deliberate improvement worth keeping, and (b) is unobservable in R-Co and
  needs a decision rather than a port.
