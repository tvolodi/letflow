  - variable-merge
description: >
  `lib/letflow/engine/variable_merge.ex`'s moduledoc carries a
  grep-checkable purity contract (~lines 48-66) whose stated expectation is
  that the grep returns ZERO matches. It does not. Verified this session by
  running the module's own grep string against the module:

    26:  ...by calling `Letflow.EventStore.Registry.validate_payload/3`
    56:  `Letflow.EventStore.Registry.validate_payload/3` or `.get_type/2`
    63:  grep -n "Repo\.\|...\|Registry\.validate_payload\|..."   <- the
         self-check line itself
    106: `Letflow.EventStore.Registry.validate_payload/3` (REQ-024).

  Lines 26, 56 and 106 are prose OUTSIDE the fenced block (the fence spans
  61-65); line 63 is the grep string itself. So the self-check has never
  held as literally written.

  THE UNDERLYING PURITY PROPERTY IS TRUE AND IS NOT IN QUESTION. The module
  genuinely performs no `Repo` I/O and calls neither `validate_payload/3`
  nor `get_type/2` -- confirmed by reading the module body. Every match is a
  prose MENTION of those functions (documenting what the caller does), not a
  CALL SITE. What is wrong is only the verification instruction: it greps
  for a bare symbol name across the whole file including its own moduledoc,
  so documentation that correctly describes the caller's responsibility
  registers as a purity violation.

  WHY IT MATTERS RATHER THAN BEING COSMETIC. An agent that trusts the stated
  expectation and tries to make the grep return zero must delete or reword
  the matching prose. Lines 24-29 are REQ-049 AC4's own evidence artifact
  (that AC is satisfied BY that sentence existing), and REQ-109's AC9
  requires those lines corrected IN PLACE, explicitly not deleted. So the
  false baseline actively steers an implementer into destroying the evidence
  for a shipped requirement's acceptance criterion, and into
  core-directives.md's "Never Satisfy a Gate by Editing What It Measures."
  This is not theoretical: REQ-109's design doc asserted the zero baseline as
  re-confirmed and built an instruction on it, which is what the Step 1b gate
  FAILed it for.
