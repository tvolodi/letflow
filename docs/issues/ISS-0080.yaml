scoping_note: >
  Filed separately rather than absorbed into REQ-109. REQ-109's AC9 makes
  three in-place corrections to this same moduledoc and its design rework
  must state the TRUE grep result -- but repairing the self-check ITSELF is
  a different change with a different owner, and folding it in would grow a
  gate-passed requirement and entangle two unrelated diffs in one docstring.

  RECOMMENDED FIX -- do not simply delete the self-check; it documents a real
  and valuable property. Make the instruction measure what it means:
  restrict the grep to non-comment lines (the property is about CALL SITES,
  not mentions), or state the expected non-zero match set explicitly with
  each match justified as prose, or assert the property positively against
  the module body rather than by absence-grep over the whole file. Whichever
  is chosen, the corrected text must survive REQ-109's AC9 edits to the same
  moduledoc -- so SEQUENCE THIS AFTER REQ-109 LANDS, or coordinate, to avoid
  two runs editing the same docstring concurrently. That collision class has
  already bitten once this session (see docs/anti-patterns.md on ISS-NNNN id
  allocation).

  NOT A BLOCKER for REQ-109: the rework only needs to stop asserting the
  false baseline and stop instructing anyone to chase it. It does not need
  this issue resolved first.
