id: ISS-0080
title: "Letflow.Engine.VariableMerge's own purity self-check at variable_merge.ex:63 asserts its grep 'returns zero matches' -- it returns four; the claim is false today, independent of any pending requirement"
discovered_by: CODE-DESIGN-VALIDATOR
discovered_in_run: WF02-REQ109-20260819 (Step 1b design gate)
