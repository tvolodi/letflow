scoping_note: >
  Filed by ORCH from SECURITY-REVIEWER's Step 2b finding on REQ-109
  (verdict PASS -- this was raised as a latent finding, explicitly NOT a
  blocker, and ORCH re-confirmed the raise by execution before filing).

  MUST LAND BEFORE OR WITH whichever of REQ-078 / REQ-082 first inserts a
  `variable_schemas` row. That insertion is the moment this stops being
  latent and becomes a crash on the completion hot path reachable from
  tenant-authored definition content. Bind this to those requirements
  rather than leaving it on a general backlog -- it has a specific
  activation event, and the two requirements that cause it are already
  written and depend on REQ-109.

  TWO CANDIDATE FIXES, not equivalent -- decide deliberately:
    (a) Add `when is_map(subschema)` to properties_violations/3's
        recursion, mirroring array_violations/3 exactly. Cheap, local,
        makes the validator total, and matches in-repo precedent. Silently
        ignores a malformed subschema, consistent with how `items` already
        behaves.
    (b) Validate schema well-formedness at REGISTRATION time so a
        malformed document can never be stored. Addresses the root cause
        and is what req109-variable-schemas.md sec 11.3 (OQ-3) already
        flags as unowned -- but it does not protect rows written before it
        lands, nor the event-registry path.
  These are complementary, not alternatives: (a) is the crash-safety fix
  and (b) is the data-quality fix. Doing only (b) leaves the validator
  partial; doing only (a) leaves malformed schemas silently inert, which
  may itself surprise an operator who registered one.

  SCOPE NOTE: this is REQ-024's module, shared with the event-type registry
  path. A fix changes behaviour for BOTH consumers, so it is not a
  variable_schemas-local change and should not be made inside a
  variable_schemas-scoped requirement without saying so.
