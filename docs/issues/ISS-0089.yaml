scoping_note: >
  Filed by ORCH from REVIEWER's Step 2d finding on REQ-109 (verdict PASS --
  raised as non-blocking). ORCH independently re-confirmed the loader
  behaviour by execution before filing.

  IMMEDIATE CONSEQUENCE FOR TEST-DESIGNER, which is why this was filed
  before the test step rather than after: a test that seeds a non-map
  `json_schema` value and asserts graceful skipping CAN ONLY PASS by calling
  `validations_for/3` directly. Such a test would certify a defence the
  production path bypasses. It must be scoped explicitly as a unit test of
  the pure function and must NOT be described as covering the production
  failure mode. TEST-DESIGNER has been told this directly.

  TWO CANDIDATE RESOLUTIONS, for whoever owns the fix:
    (a) Select `json_schema` as a raw/untyped value so the Letflow guard is
        actually the first thing to see it, and widen `error_reason()` with
        a load-failure case. Makes the existing branch reachable and the
        read total.
    (b) Validate schema well-formedness at REGISTRATION time (OQ-3,
        req109-variable-schemas.md sec 11.3) so a non-object row can never
        be stored, and DELETE the read-side branch as genuinely dead rather
        than leaving unreachable code that reads as a live defence.
  (b) is cleaner if registration validation is going to exist anyway, but it
  does not protect rows written before it lands. Do not do neither and leave
  the branch: unreachable defensive code that looks live is worse than no
  defence, because it stops anyone looking for the real one.

  LIKELY OWNER: whichever of REQ-078 / REQ-082 first inserts a
  `variable_schemas` row -- the same activation event as ISS-0088. Consider
  resolving both together, since they are the same class of question about
  where schema well-formedness is enforced.

triage_20260820: >
  Re-derived independently in response to GH#306 (this issue's mirror) before
  acting: REQ-078 and REQ-082 are both still `status: pending` in
  docs/requirements.yaml, and nothing in lib/ writes a `variable_schemas` row
  yet -- the defect is exactly as latent as when filed, so there is no code
  to fix today (fixing variable_schema.ex now, ahead of the registration
  path, would be scope creep past REQ-109's own turn and would preempt the
  (a)-vs-(b) choice this issue deliberately leaves to whoever builds
  registration). What WAS missing: neither REQ-078's nor REQ-082's own
  "VARIABLE_SCHEMAS REGISTRATION" paragraph mentioned this issue or ISS-0088
  at all, so the obligation to answer OQ-3 could have been silently dropped
  the same way ISS-0075's staleness was created. Added a "WELL-FORMEDNESS,
  NOT JUST PRESENCE" paragraph to BOTH REQ-078 and REQ-082 (mirrored, since
  either may land first) naming GH#306/ISS-0089 and GH#305/ISS-0088
  explicitly, restating both candidate resolutions, and requiring whichever
  lands first to record the choice in VariableSchema's moduledoc and close
  both GitHub issues. Status stays `open` -- this triage makes the fix
  unlosable, it does not perform it.
