scoping_note: >
  Filed by ORCH during REQ-109's WF-02 run rather than fixed inline,
  because editing an acceptance criterion mid-flight -- while
  RELEASE-VALIDATOR is about to verify against it -- changes the target a
  gate is measuring against while the run is still open. That is the
  behaviour the pipeline exists to prevent, even when the edit is
  obviously correct.

  RECOMMENDED FIX, one clause: replace AC4's "appends a
  VARIABLE_OVERWRITTEN event" with wording that matches INV-EE48-5 --
  e.g. "records the overwrite in the TASK_COMPLETED event's
  payload.merged_variable_events, with no separate VARIABLE_OVERWRITTEN
  event appended (REQ-048 INV-EE48-5)". Owner: REQ-ANALYST, gated by
  REQ-VALIDATOR as normal, since it is requirement text.

  DO THIS BEFORE REQ-109 IS RE-DERIVED BY ANY LATER RUN. It does not block
  REQ-109's current run: RELEASE-VALIDATOR is being told about the
  divergence explicitly in its handoff, and the test suite already pins
  both halves. But that handoff note protects exactly one run. The source
  text protects all of them.
