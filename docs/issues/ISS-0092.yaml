scoping_note: >
  Filed by ORCH immediately after causing and repairing the incident.
  Reported rather than quietly fixed because the damage touched an
  unrelated issue's records and a third party (GH#304's readers) saw a
  wrongly-closed issue.

  IMMEDIATE MITIGATION APPLIED THIS RUN: the four unbacked impl_order
  values are annotated in docs/requirements.yaml as NOT queue ids, so the
  next agent cannot repeat the call. That is a warning, not a fix.

  THE ACTUAL FIX, for whoever picks this up:
    1. Register REQ-112 (and REQ-110/REQ-111 if the queue should reflect
       that they are done) via register_task, and record the RETURNED
       impl_order -- never a locally-derived one. REQ-109 is done and
       merged; decide deliberately whether a done requirement needs a
       queue task at all.
    2. Correct TASK_QUEUE.md and the requirements.yaml schema convention
       so `impl_order` is documented as "assigned by the queue on
       register_task, absent until registered" rather than as a task id
       an agent may invent. An unregistered requirement should carry NO
       impl_order, not a guessed one.
    3. Consider asking letflow-queue for a non-destructive read-by-id
       (GET /tasks/<id>), whose absence is why this could not be checked
       before acting. Its absence turns every id-addressed write into an
       unverifiable gamble.

  PROCESS LESSON, which generalises beyond the queue: ORCH acted on an
  identifier whose provenance was asserted by a COMMENT rather than
  verified against the system that owns it -- the same
  inherited-claim failure recorded in docs/anti-patterns.md, but with a
  destructive write at the end of it instead of a wasted cycle. Before an
  id-addressed mutation against an external system, confirm the id maps to
  what you think it does, or use an endpoint that fails safe.

resolution: >
  RESOLVED 2026-08-20, from GH#314. All three items from the "actual fix"
  list above are done:

  1. REGISTERED. REQ-110 -> queue task 167 (GH#315), REQ-111 -> queue task
     168 (GH#316), REQ-112 -> queue task 169 (GH#317), all via a real
     register_task call whose RETURNED id was written back into
     docs/requirements.yaml's impl_order field (superseding the invented
     154/155/156). REQ-109 is `done` and merged -- deliberately left
     unregistered rather than backfilled: a completed requirement has no
     remaining claim for get_next_task to hand out, so registering it would
     create a queue task with nothing to do. Its impl_order:153 comment is
     corrected to state plainly it is not a queue id and why.

  2. DOCUMENTED. docs/agents/protocols/TASK_QUEUE.md's register_task
     section now states explicitly, with this incident cited: an
     unregistered requirement carries NO impl_order, never a guessed one,
     because impl_order and the deployed service's task id are the same
     integer and a placeholder silently doubles as a working /tasks/<id>
     URL against an unrelated task.

  3. FILED, not built (out of this repo's scope -- letflow-queue is a
     separate service/repo). tvolodi/letflow-queue#3 requests a genuinely
     non-destructive GET /tasks/:id, citing this incident as the concrete
     motivating case.

  Queue task 153 (ISS-0087's true task) remains stranded `done` from the
  original incident and is not reversible via the API -- this was already
  repaired at the time by re-registering ISS-0087 as task 166, recorded in
  the description above. Nothing further to do there.
