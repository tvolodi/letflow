resolution_note: >
  PROVENANCE (historical, not current decision authority):
  GH#326 was closed 2026-08-20T05:02:31Z with zero comment and no PR
  reference in its own GitHub timeline -- an undocumented closure, not
  something evidenced at the time. Verified for real during ORCH's
  2026-08-22 reconciliation audit (WF03-ISS0278-20260822): R-Co's
  `src/engine/instance.zig` was unreachable when this design was first
  written (§0's stated access gap), but the tree is reachable now at
  `c:\Users\tvolo\dev\ai-dala\R-Co` and settles both open questions.

  PROVENANCE (historical, not current decision authority):
  OQ-1 (reason/note field): `cancelInstance`'s real signature
  (`instance.zig:2513`) is
  `(self, allocator, task_store, instance_id, actor_id) CancelInstanceError!void`
  -- no reason/note parameter. `cancel_attrs()`'s omission (design §3) matches
  R-Co exactly.

  PROVENANCE (historical, not current decision authority):
  OQ-2 (branch-teardown mechanism): the doc-commented 8-step
  `cancelInstance` algorithm (steps d/e, `instance.zig:2578-2634`) issues
  plain SQL `UPDATE tasks SET status='CANCELLED' ... WHERE status='PENDING'`
  and `UPDATE timers SET status='cancelled' ... WHERE status='pending'`
  directly inside the transaction -- no per-branch event is driven through
  R-Co's own transition/graph machinery anywhere in this path. Design §4's
  decision not to drive `{:cancel_branch, branch_id}` through `Transition`
  is confirmed to match R-Co's actual mechanism, not merely a plausible
  independent choice.

  `lib/letflow/design/req052-instance-cancellation.md`'s §0 access-gap note
  and its §11 OQ-1/OQ-2 entries updated in this same run to cite this
  evidence and marked RESOLVED. No code changes needed -- `cancel_instance/3`
  (lib/letflow/engine.ex) already implements both confirmed behaviours;
  only the design doc's own open-question annotations were stale.
