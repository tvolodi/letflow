status: resolved
resolution: >
  PROVENANCE (historical, not current decision authority):
  R-Co/src/engine/instance.zig's mergeVariables (called at line 4956 for
  the sub-process completion path) uses the exact same variable_schemas
  lookup, keyed only on definition_id, as every other merge call site
  (line 1856, the task-completion path) -- the task_id parameter that
  call omits is used only to tag the overwritten-variable event payload,
  never to skip or scope schema validation. Answer: yes, the parent's own
  registered variable-type schemas DO apply to a sub-process output
  merge, the same way they already apply to a completed task's output
  merge.

  Unlike ISS-0102/GH#330 and ISS-0103/GH#331 (pure verification, no code
  change needed), this finding meant the existing design/implementation
  was a real divergence from R-Co, not a defensible simplification --
  lib/letflow/engine/sub_process.ex's build_completion_multi_from_merge/12
  previously hardcoded `VariableMerge.merge(seed_state.variables,
  merge_variables, nil)`. Fixed to call
  Letflow.Engine.VariableSchema.variable_validations/5 first (REQ-109's
  own lookup, reused unchanged, keyed on the parent's definition_id) and
  pass its result into VariableMerge.merge/3, matching
  Letflow.Engine.merge_output_variables/7's already-shipped pattern for
  the task-completion path. A :rejected outcome now routes into
  ExecutionError.append_multi/3 with error_type: :variable_schema_rejected
  instead of silently merging a registry-invalid value.
  lib/letflow/design/req062-sub-process-runtime.md's §3.4 step 3 and §9
  OQ-2 updated accordingly. New test coverage in
  test/letflow/engine_sub_process_test.exs (OQ-2/GH#329 describe block):
  an output value that passes the interface's own per-output json_schema
  (SPC-01) but violates a stricter registry row for the same key is
  rejected, proving the registry lookup itself fired rather than only the
  interface's own check.
