severity: MINOR
description: >
  PROVENANCE (historical, not current decision authority):
  Filed by DOC-UPDATER during REQ-112 (ISS-0076 item 2 sweep, GH#317).
  Deferred question (OQ-2): should the parent's own registered
  variable-type schemas (Letflow.EventStore.Registry, the schemas
  complete_task/3's variable_validations argument checks) also apply to a
  sub-process output merge, the way they already apply to a completed
  task's output merge? This design passes variable_validations: nil to
  VariableMerge.merge/3, reasoning the requirement text's "output schema
  violation" names only the interface's own declared json_schema, not the
  registry's separate per-variable-name schemas -- not verified against
  R-Co.
  Letflow file:line: lib/letflow/design/req062-sub-process-runtime.md:748
  R-Co source that could settle it: R-Co/src/engine/instance.zig
  (sub-process output-merge path).
