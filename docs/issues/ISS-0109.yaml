title: >
  Full-suite-only tenant-schema teardown race now also hits
  Letflow.Definitions.PromotionTest and Letflow.Definitions.PromotionAssertionRerunTest
  (invalid_schema_name / undefined_table on a schema the test itself just provisioned) --
  same class as ISS-0048/0050/0060/0062/0064 but in modules those issues do not name
