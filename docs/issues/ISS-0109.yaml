resolution:
  status_rationale: >
    INSTRUMENTED, NOT RESOLVED -- deliberately. Both the gate-approved design and REVIEWER
    independently concluded that this run instruments the failure rather than fixing it:
    there is no production defect to remove (see the corrected `mechanism:` above), the
    failure was never reproduced on demand, and the root cause is still unknown. Marking
    this `resolved` would put a false entry into a registry that six other issues
    cross-reference. The unresolved half continues in ISS-0116/GH#370.
  resolved_in_run: WF03-ISS0109-20260821
  closed_at: "2026-08-21T03:18:27Z"
  github_closed: >
    GH#358 was commented on and then closed DELIBERATELY (`gh issue comment` then
    `gh issue close --reason completed`), not left to be closed as a side effect of a
    queue release -- see github_issue_note above, which records that a release_lock on
    task 172 would have targeted the already-closed duplicate #359 instead.
    Comment: https://github.com/tvolodi/letflow/issues/358#issuecomment-5364776283
    Closed at 2026-08-21T03:18:27Z (confirmed via `gh issue view 358 --json state,closedAt`
    => state CLOSED). The comment states what shipped, the refuted mechanism, the unknown
    root cause, and the handoff to ISS-0116/GH#370 with ISS-0112/GH#366 sequenced first.
  what_shipped:
    - path: test/support/tenant_fixture.ex
      detail: >
        New `Letflow.TenantFixture`. Three capabilities: `capture_schema_state/1`, a
        one-shot 14-field forensic report of the tenant's actual database state (registry
        row present? schema present? which tables present/missing? which migration
        versions applied? db_now vs the BEAM clock? backend pid?);
        `assert_schema_complete!/2`, a completeness oracle that checks the schema's tables
        directly rather than trusting `replay_migrations/1`'s return value (measured: Ecto's
        Migrator re-applies NOTHING for an already-recorded version -- after dropping a
        table while leaving its version recorded, a second `replay_migrations/1` returned
        `{:ok, []}` with the table still absent); and a `LETFLOW_TENANT_FIXTURE` teardown
        marker emitting a closed phase vocabulary, so the next occurrence's log identifies
        which phase was running rather than leaving it to inference -- the exact inference
        that produced the refuted mechanism above.
    - path: test/letflow/definitions/promotion_test.exs
      detail: adopted Letflow.TenantFixture (one of the two modules this issue names).
    - path: test/letflow/definitions/promotion_assertion_rerun_test.exs
      detail: adopted Letflow.TenantFixture (the other module this issue names).
    - path: test/letflow/support/tenant_fixture_test.exs
      detail: 14 regression tests covering the fixture's capture, oracle and marker behaviour.
    - path: test/specs/ISS-0109.md
      detail: the test specification for the above.
    - path: lib/letflow/design/iss0109-provisioning-completeness-and-fixture-instrumentation.md
      detail: the gate-approved design artefact this run implemented.
  what_this_does_not_close: >
    Stated plainly, because the distinction is the whole reason this record is
    `instrumented` and not `resolved`: the shipped work makes a RECURRENCE ATTRIBUTABLE.
    It does not make the recurrence stop happening. Nothing in it removes a defect,
    because no production defect was found. The next occurrence will carry a 14-field
    capture and a phase marker instead of a bare Postgrex error -- that is the entire
    claim being made here.

new_evidence_from_resolving_run:
  source: test/reports/report-20260821-WF03-ISS0109-20260821.yaml
  run: >
    WF03-ISS0109-20260821 full suite -- 612.1s, 1228 of 1244 passed, 16 failures, seed 993324.
  observation: >
    A SIGNATURE-IDENTICAL reproduction of THIS issue's failure 3 appeared in a THIRD module
    that had NOT adopted the new fixture: Letflow.Definitions.RollbackTest, at
    test/letflow/definitions/rollback_test.exs:642, raised from that module's own
    hand-rolled `provisioned_tenant/0` at :120 --

      assert {:ok, _applied_versions} = TenantProvisioning.replay_migrations(tenant.id)
      right: {:error, {:migration_failed, %MatchError{term: {:error, %Postgrex.Error{
               postgres: %{code: :invalid_schema_name, pg_code: "3F000",
                 message: "schema \"tenant_72360c3d2a13493f84d11ac73b8d671f\" does not exist",
                 routine: "get_namespace_oid"}, connection_id: 107764}}}}}

    Same 3F000, same {:error, {:migration_failed, %MatchError{...}}} wrapper, same failing
    assertion. Meanwhile BOTH modules this issue names -- PromotionTest and
    PromotionAssertionRerunTest, the two that DID adopt the instrumentation -- passed, in
    the full suite AND in isolation.
  caveat: >
    ONE OBSERVATION, NOT A CONTROLLED EXPERIMENT. Nothing here isolates adoption of the
    fixture as the variable: the adopted modules passing and the un-adopted module failing
    in the same run is consistent with the fixture helping, and equally consistent with the
    ordinary intermittency this issue has always shown. It must not be read as evidence
    that the instrumentation prevents the failure -- it does not claim to.
  why_it_matters: >
    It is evidence the condition is REAL and NOT specific to the two modules this issue
    happened to name -- which is exactly what a module-scoped reading of this record would
    have assumed. That is the reason ISS-0116 exists and why ISS-0112 (adopting the fixture
    at the remaining sites) should be sequenced first: it is what makes the next occurrence
    diagnosable at all.
