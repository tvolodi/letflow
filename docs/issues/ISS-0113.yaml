investigated_in_run: WF03-ISS0113-20260821
investigated_at: "2026-08-21T13:49:05Z"
investigation_note: >
  Attempted a real fix (not just analysis) and reverted it after test evidence showed it
  is unsafe as a narrow change to the shared `Letflow.TenantFixture.provisioned_tenant!/1`
  helper. Recorded in detail so a future attempt does not repeat the same failed shape.

  THE ATTEMPTED FIX: added `Sandbox.mode(Letflow.Repo, :manual)` + a fresh
  `Sandbox.checkout(Letflow.Repo)` inside `provisioned_tenant!/1`, right after
  `replay_migrations/1` and before returning to the caller -- mirroring the exact pattern
  already proven correct, independently, in `test/letflow/identity/user_test.exs`,
  `group_test.exs`, `tenant_role_test.exs`, and `role_registry_test.exs` (their own
  hand-rolled provisioning helpers already do this restoration for themselves). Also added
  a defensive `Sandbox.mode(Letflow.Repo, :auto)` at the top of `teardown/2`, since that
  callback runs inside `ExUnit.OnExitHandler`'s own spawned process, which has no
  checked-out connection once mode is `:manual` -- confirmed this is necessary
  (`DBConnection.OwnershipError` without it).

  RESULT, measured (`mix test` on all six modules currently using the fixture --
  `promotion_test.exs`, `promotion_assertion_rerun_test.exs`, `rollback_test.exs`,
  `engine_test.exs`, `engine/reconstruction_test.exs`, `identity_test.exs`): went from
  125/125 (baseline) to 113/125 with the teardown fix included, 12 failures, three
  DISTINCT failure mechanisms -- not one bug, three separate real dependencies on `:auto`
  mode persisting through the whole test body:

  1. `identity_test.exs:268` -- `Letflow.IdentityTest`'s own test already calls
     `Sandbox.checkout(Letflow.Repo)` itself later in the same test, expecting `:ok`
     because it currently starts from `:auto` mode (where a fresh checkout always
     succeeds); with the fixture's own restore already holding a checkout for that
     process, the test's own call returns `{:already, :owner}` and its `:ok = ...` match
     fails. A double-checkout collision, not a leak.
  2. `engine/reconstruction_test.exs` AC5/AC6 (`with_locked_projection/3`) --
     `DBConnection.ConnectionError: could not checkout the connection owned by <pid>`.
     These tests deliberately spawn a SEPARATE process to hold a real `FOR UPDATE` lock
     concurrently with the test process, to prove lock-contention behavior. That requires
     genuine concurrent access to the real connection pool (`:auto` mode) -- a single
     sandboxed connection owned by one process cannot serve two processes wanting
     independent transactions at once. Restoring `:manual` breaks the very thing these
     tests are testing.
  3. `promotion_assertion_rerun_test.exs`, 7 tests -- all failed with
     `{:error, :provision_failed}` in place of their expected result. These tests call
     `TenantProvisioning.provision_tenant_schema/1`/`replay_migrations/1` a SECOND time
     within the same test body (provisioning an additional schema beyond the fixture's
     own initial one), and `Ecto.Migrator` cannot run under a sandboxed single connection
     -- exactly the reason `:auto` mode was needed in the first place, now needed again
     mid-test, after the fixture already switched back to `:manual`.

  CONCLUSION: `INV-F-6`'s original deferral ("the helper reproduces today's `:auto`
  behaviour unchanged... that is ISS-0113, out of scope") was correct engineering
  judgment when it was written, not a shortcut. A blanket restore inside the shared
  fixture cannot be made safe without also threading per-caller knowledge of whether that
  caller (a) does its own later checkout, (b) needs real concurrent multi-process access,
  or (c) provisions more than one schema in the same test -- which is exactly the
  per-call-site variation ISS-0112's full 41-site consolidation exists to reconcile, not
  something a single narrow patch to the shared helper can absorb. The code change and
  design-doc amendment attempted here were reverted in full (`git diff --stat` empty
  against origin/main before this record's own commit); nothing shipped.

  WHAT WOULD ACTUALLY FIX THIS: per-caller opt-in, not a global default -- e.g. an
  `opts[:restore_sandbox]` flag on `provisioned_tenant!/1` that callers which genuinely
  don't need `:auto` mode after provisioning (most of the 6 current adopters may qualify,
  but each needs individual verification against this run's three failure mechanisms
  above) can set explicitly, defaulting to `false` (today's behaviour, unchanged) so nothing
  regresses silently. This is a real, scoped follow-on -- not filed as a new issue here
  since it is squarely ISS-0112's territory (per-caller migration) rather than a new
  defect; whoever picks up ISS-0112 should read this record first.

resolved_in_run: WF03-ISS0423-20260905
resolved_at: "2026-09-05T04:00:00Z"
resolution_note: >
  RESOLVED WITH A DIFFERENT MECHANISM THAN THIS RECORD'S OWN "what would
  actually fix this" PROPOSAL -- worth stating plainly since that proposal
  (a per-caller `opts[:restore_sandbox]` opt-in doing an explicit
  Sandbox.mode(:manual) + fresh checkout restore) is EXACTLY what
  WF03-ISS0423-20260905 tried FIRST, and it was TRIED FOR REAL A SECOND
  TIME and FAILED A SECOND TIME, for a reason distinct from all three
  mechanisms this record already names: Ecto's Sandbox.mode/2 checks in
  ALL pool connections whenever the requested mode differs from the pool's
  current one, so a second mid-test mode flip (the opt-in restore itself)
  discards the connection the fixture's own provisioning had just
  populated -- a 4th mechanism, traced through actual Ecto/DBConnection
  source, not merely observed.

  THE ACTUAL FIX IS SIMPLER: no opt-in flag, no restore step, no new code
  at all. `provisioned_tenant!/1`'s OWN PRE-EXISTING, unconditional
  `Sandbox.mode(Letflow.Repo, :auto)` first line -- the very call this
  record originally filed as the "leak" -- is ALREADY SUFFICIENT for
  `async: true` safety by itself, PROVIDED the call site is independently
  verified against this record's own three named failure mechanisms
  (self-checkout, concurrent multi-process DB access, second provisioning
  call). No restoration to `:manual` is needed or wanted; the "leak" this
  record named is not a defect to be plugged, it is the load-bearing
  behaviour that makes `async: true` work once nothing ELSE also calls
  `Sandbox.mode/2` mid-test.

  Fixed for 2 of the 46 real `TenantFixture` call sites
  (`test/letflow/secrets_test.exs`, `test/letflow/webhooks_test.exs`),
  verified clean by FOUR independent parties/seeds (CODE-DESIGNER's own
  13 runs, CODE-DESIGN-VALIDATOR's regate at 2 distinct seeds,
  ELIXIR-DEV's sign-off at a third seed, and the required double
  full-suite run) -- full detail and the corrected mechanism's source-level
  trace in `lib/letflow/design/iss0113-tenant-fixture-sandbox-restore-opt-in.md`
  section 9 (normative; sections 2/3/8 marked superseded and preserved as
  the record of the falsified first mechanism, not deleted). The remaining
  44 call sites are unconverted -- see `docs/issues/ISS-0423.yaml`'s own
  resolution note for the full disclosure of what is and is not covered.
  This record's own severity (MINOR) and its "no observed failure
  attributed to it" framing both stand corrected in hindsight: the leak
  was genuinely inert for correctness under `async: false` (the
  `{:shared, self()}` mode DataCase sets there routes every pool
  connection through one owner regardless of mode switches, masking it
  completely) and is exactly what makes `async: true` safe once the
  three-mechanism procedure clears a call site -- it was never a
  correctness hazard requiring removal, only a hazard the record's own
  ISS-0112 cross-reference correctly anticipated needed per-caller
  verification before relying on it either way.
status: resolved
