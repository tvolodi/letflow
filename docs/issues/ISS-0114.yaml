verdict_note: >
  Severity raised MINOR -> MAJOR: this run's own diagnosis reproduced the root cause, and
  it is a real, already-tracked hazard, not a one-off. ISSUE-FIXER's Step 0.5+1 traced
  Letflow.Engine.insert_instance_projection/8 and TenantProvisioning.provision_tenant_schema/1
  and found both correct and synchronous -- no application-code defect. Constructed a
  targeted reproduction (a throwaway probe, deliberately not committed, per this project's
  standing discipline against leaving mutation/reproduction scaffolding in the tree):
  called TenantSchemaReaper.sweep_orphans(Repo, 0) mid-test to simulate a second
  invocation's boundary sweep reclaiming a >300s-old live tenant row, then ran the exact
  insert insert_instance_projection/8 makes. Reproduced byte-for-byte: Postgrex.Error
  42P01 undefined_table. Letflow.TenantFixture.capture_schema_state/1 on that tenant
  showed registration_present?: false, schema_present?: false, all 19 expected tables
  missing -- the signature of a full TenantSchemaReaper.reclaim_row/2 sweep, matching
  ISS-0110's already-filed mechanism exactly (a nested/concurrent mix test invocation's
  pre-suite sweep reclaiming a still-live schema once it exceeds the reaper's 300s
  min_age, which no longer outlives this project's 564-612s suite runtime).

  `instrumented` rather than `resolved`: no code was shipped by this run and the root
  cause (TenantSchemaReaper's unscoped, age-only liveness heuristic) is NOT removed here
  -- the actual fix is ISS-0110's own open, MAJOR-severity work, which this run's evidence
  is now attached to as corroborating_evidence rather than duplicated as a second issue.
  `no_defect` would be false (a real defect exists); `resolved` would be false (nothing
  was removed). This record's own diagnosis IS the shipped, verified improvement this
  status requires -- full evidence in
  handoffs/WF03-ISS0182-20260821/step-0.5-1-diagnose.json -- even though the reproducing
  probe itself was not persisted as committed test code.

  What this does NOT close: TenantSchemaReaper's actual fix (real liveness tracking, per
  ISS-0110's own "what a fix needs to decide" section) remains open work under ISS-0110.
  TenantFixture adoption in engine_concurrency_test.exs (ISS-0112-shaped) is a separate,
  optional, diagnostic-only companion task, not this root cause's fix.
