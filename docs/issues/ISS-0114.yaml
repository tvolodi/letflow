id: ISS-0114
title: >
  Letflow.EngineConcurrencyTest:365 -- 42P01 undefined_table on tenant_<id>.instance_projections from Engine.insert_instance_projection/8 (full-suite only, unattributed)
discovered_by: TEST-RUNNER
discovered_in_run: WF03-ISS0109-20260821
