description: >
  Observed by TEST-RUNNER during WF03-ISS0109-20260821's full-suite run (612.1s, 1228/1244
  passed, 16 failures, seed 993324, commit 12286e8).

  **This entry exists mainly to prevent a wrong attribution.** Letflow.IdentityTest is the module
  named in ISS-0108/GH#360, so the obvious move is to fold this into it. That would be wrong:
  ISS-0108 is an `Ecto.InvalidChangesetError` on the `tenants_idp_realm_id_partial_index` partial
  unique index -- a seed-row collision. This failure is a Postgrex 42P01 undefined_table on
  relation "tenant_87dc2692....users" at test/letflow/identity_test.exs:205. Same module, entirely
  different mechanism. TEST-RUNNER flagged it explicitly as the trap in its own attribution pass.

  Why it is not attributable to the run that observed it: that branch changes no production code
  (one markdown design doc is the only lib/ path in the diff), and the failing module does not
  reference the new test fixture.

  Why it is not attributable to an existing baseline: no match on module + test name + error class
  + frame in either recorded report under test/reports/.

  Relationship to ISS-0109/ISS-0114: same symptom family -- a table absent from a tenant schema
  during a test that provisioned that schema. Kept separate for the reason ISS-0109's own history
  demonstrates: this family has repeatedly been mis-merged on shared symptoms, and each mis-merge
  has cost a later run a re-derivation.

  What a diagnosis should use: the same capture_schema_state/1 instrumentation shipped by
  WF03-ISS0109-20260821 (test/support/tenant_fixture.ex). This module has not adopted it (ISS-0112).

