id: ISS-0171
title: >
  letflow_check_test_test.exs fake-mix fixture is POSIX-only: on Windows it runs
  the REAL mix test, timing out and orphaning a BEAM that holds DB connections
discovered_by: ELIXIR-DEV
discovered_in_run: unknown (see queue task 171 description; local record never
  materialized until this run)
discovered_at: "2026-08-20T20:08:01Z"
severity: MAJOR

description: >
  `test/mix/tasks/letflow_check_test_test.exs` fakes the `mix test` subprocess by
  writing an extensionless `#!/bin/sh` file named `mix` into a temp dir and
  prepending that dir onto PATH with a `:` separator. Both halves are POSIX-only:
  on Windows the PATH separator is `;`, and `System.find_executable/1` will not
  resolve an extensionless file (PATHEXT requires .bat/.exe/.cmd). So
  `install_fake_mix/2` had no effect on Windows and
  `Mix.Tasks.Letflow.Check.Test.run/1` shelled out to the REAL `mix`, recursing
  into a full nested `mix test`.

  Observed on this Windows 11 host (letflow-2 checkout): 3 tests in this module
  failed, two by ExUnit timeout at 60s inside
  `Mix.Tasks.Letflow.Check.Test.collect/2`, one with `Mix.Error: underlying mix
  test run exited 1`. Each timed-out test left an orphaned `erl.exe` alive after
  the run, holding open connections to `letflow_test` -- consistent with (though
  not confirmed as the sole source of) the ~105-idle-connection exhaustion this
  same orchestrating session hit and manually cleared earlier today before
  WF03-ISS0199-20260821's tests could pass.

filename_note: >
