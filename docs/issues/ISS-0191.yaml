id: ISS-0191
title: >
  Build the handoff linter HANDOFF_PROTOCOL.md's Enforcement note defers (`mix letflow.lint_handoffs`) -- it now has a measured backlog
discovered_by: ISSUE-FIXER
discovered_in_run: WF03-ISS0117-20260821
discovered_at: "2026-08-21T06:56:56Z"
severity: MINOR

description: >
  HANDOFF_PROTOCOL.md's closing Enforcement note has recorded this as a known gap since the
  protocol was written: R-Co enforces its handoff protocol mechanically via
  tools/lint_handoffs.py (schema conformance, timestamp monotonicity, encoding, registry
  coverage), adopted after a 2026-08-05 pipeline audit found unenforced bookkeeping rules
  were followed at 0.4-8.6% compliance DESPITE BEING WRITTEN DOWN. Letflow has no
  equivalent. The note says building one "is worth raising as its own requirement once the
  pipeline has run enough cycles to show whether Letflow drifts the same way R-Co did."

  IT HAS RUN ENOUGH CYCLES, AND IT DRIFTS THE SAME WAY. Measured during
  WF03-ISS0117-20260821 Step 1 and independently re-derived by ORCH over all 534 handoff
  files:
    - 15 files carry a top-level `status` outside section 2's legal enum (13 of them the
      value `"PASS"`, i.e. a result.status used as a handoff status).
    - 13 files carry non-schema top-level keys, including 2 Step-00 files on an entirely
      different flat schema with no context/task/result blocks.
    - 2 handoffs sit at PENDING inside runs the registry records as COMPLETED -- one
      (WF02-REQ043-20260818/step-final-git-merge.json) has misrepresented a run that merged
      to main since 2026-08-18. See ISS-0192.
    - 3 files carry three DIFFERENT ad-hoc key names for the same recovery situation, in
      two different shapes. See ISS-0117.
    - `grep -rn "handoffs/" test/ --include=*.exs` returns 6 hits, all source comments
      citing a handoff as provenance: ZERO ExUnit tests assert anything over
      handoffs/*.json today.

  This is the same shape as R-Co's own finding, and every gate in this pipeline rests on
  these files being trustworthy.

  WHY SEPARATE FROM THE DATA DEFECTS (ISS-0190): that issue covers CORRECTING the 15+13
  violations; this one covers building the CHECK so they stop recurring. Doing either alone
  leaves the other half open -- cleaned data with no linter drifts again, and a linter with
  dirty data is red from its first run.

  WHAT A LINTER CANNOT DO, established by measurement rather than assumed: it cannot verify
  that a `result` block was actually attested by its acting agent rather than reconstructed
  after that agent died. Whether the agent was alive exists in no artefact, so a file
  missing a recovery marker is indistinguishable from one that never needed one. The linter
  can only assert the conditional -- WHEN the marker ISS-0117's amendment defines is
  present, it is well-formed. This is exactly why WF03-ISS0117-20260821 marked its own Step
  4 SKIPPED rather than writing a partial linter as a regression test.

  IMPLEMENTATION NOTE: Jason is already a runtime dependency (mix.exs, `{:jason, "~> 1.4"}`),
  so decoding needs no new dep. Whether this ships as a mix task or a plain script is open
  -- see docs/anti-patterns.md's Mix-task-discovery-cost finding and the precedent of
  scripts/timed_test.sh, which is deliberately not a mix task.

  ADDED TO SCOPE 2026-08-21 (ISS-0198, run WF03-ISS0198-20260821): three size/structure
  checks -- H-SIZE-1 (WARN, cite-and-restate), H-SIZE-2 (WARN, under-specified) and
  H-SIZE-3 (INFO, per-run report). They are specified in full, mechanically, in
  HANDOFF_PROTOCOL.md's Enforcement note under "Specified but NOT YET RUNNING"; do not
  re-derive them here. Each is computable from a single handoff file with json.load, len,
  substring search and basename -- no repo state, no cross-file reads, no judgement.
  SEQUENCING: like every other check in this issue, these will not run green until
  ISS-0190's 15+13 existing violations are cleared, so ISS-0190 is a prerequisite for them
  too. Nothing in HANDOFF_PROTOCOL.md claims these checks run today, and ISS-0198's fix
  deliberately does not depend on their existing -- the structure rule stands on its own
  and these only measure it.

  ADDED TO SCOPE 2026-08-21 (ISS-0200, run WF03-ISS0200-20260821): one extension to the
  EXISTING H-SIZE-3 INFO reporter above -- alongside the len(task.description) figures it
  already emits, it also emits median/max/total len(result.summary) and the per-step
  summary/description ratio. Specified in full in HANDOFF_PROTOCOL.md's Enforcement note,
  in the same "Specified but NOT YET RUNNING" block and the same code fence as H-SIZE-1/2/3;
  do not re-derive it here. REPORT ONLY: no threshold, no WARN, no pass/fail on either
  figure. ISS-0200 measured 605 handoff files and returned a NO-CHANGE verdict -- there is
  no result-side restatement defect for a check to gate on -- so a WARN here would be a
  length rule on result.summary by the back door. Like every other check in this issue, and
  like H-SIZE-1/2/3, THIS DOES NOT RUN TODAY: H-SIZE-3 itself is unbuilt, this issue is open
  and gated on ISS-0190, and nothing in HANDOFF_PROTOCOL.md or here claims otherwise. Its
  sole purpose is that if the result side ever does acquire a restatement mechanism, the
  drift shows up in a report instead of needing a fresh investigation.

  FRAMING NOTE: HANDOFF_PROTOCOL.md calls this "its own requirement". It is filed as an
  issue because that is the mechanism available to a discovering agent under
  ISSUE_QUEUE.md; whoever picks it up should judge whether it warrants promotion to a REQ
  entry via WF-01 first, given its size.

  ADDED TO SCOPE 2026-08-21 (ISS-0203, run WF03-ISS0203-20260821): the `not_agent_attested`
  member check needs two inputs that exist today only as prose inside HANDOFF_PROTOCOL.md
  §4.1(b) -- the `backfill_note` allowlist path (the one file name §4.1(b) declares SPENT)
  and the optional member's own name. A linter written against today's wording would
  silently stop tracking either the moment §4.1(b) is next edited, with nothing to flag the
  drift. Whoever builds this linter should read those two values out of §4.1(b) at build
  time rather than copy them into this record, and the linter itself should be the thing
  that goes stale-visibly if a future §4.1(b) edit changes either value without a matching
  linter update -- not a silent pass. Ergonomic, not a blocker: filed here per REVIEWER's
  own framing in `WF03-ISS0201-20260821`'s gate rather than as a HANDOFF_PROTOCOL.md change.

