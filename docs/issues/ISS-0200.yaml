resolution: >
  NO DEFECT. The issue asked whether `result.summary` carries a redundancy defect
  DISTINCT FROM being genuinely long. It was investigated and measured across the whole
  handoff corpus, six candidate restatement mechanisms were tested individually, and
  none was supported. Nothing was changed in HANDOFF_PROTOCOL.md's rules.

  `resolved` would be false -- no root cause was removed, because none was found to
  remove -- and `instrumented` would be false, because nothing shipped. This is the
  first record in this project to carry `status: no_defect`; the status was added to
  ISSUE_QUEUE.md's vocabulary during this run, on this run's own Step 1 finding that no
  legal terminal value existed for a reasoned NO-CHANGE outcome.

  Full working, producing code, and every figure below: this run's diagnosis handoff,
  `handoffs/WF03-ISS0200-20260821/step-005-01-diagnose.json`. The verdict was gated
  independently by REVIEWER at
  `handoffs/WF03-ISS0200-20260821/step-03b-reviewer-gate.json` and, after one rework,
  `handoffs/WF03-ISS0200-20260821/step-03c-reviewer-regate.json` (PASS).

# --- ISSUE_QUEUE.md `no_defect` evidence bar, item by item ---

evidence_1_first_hand_measurement: >
  BAR ITEM 1 -- first-hand measurement, producing code quoted, real figures. Every
  figure here was measured in this run from `handoffs/**/*.json`; NONE is inherited from
  this issue's own filing, which bar item 1 forbids by name. Where the re-measurement
  disagrees with the filing, the measurement wins and this record says so (see
  `correction_to_this_issues_own_figures` below).

  Corpus: 605 parseable handoff files across 60 run directories, 0 unparseable
  (`registry.json` excluded). Producing code, reproduced from the diagnosis handoff --
  the script itself lived in `scratch/`, which is git-ignored per core-directives.md's
  File Placement Rules, so it is quoted here rather than committed:

      for f in sorted(glob.glob('handoffs/**/*.json', recursive=True)):
          if os.path.basename(f) == 'registry.json': continue
          d = json.load(open(f, encoding='utf-8'))
          t = d.get('task') or {}; r = d.get('result') or {}; c = d.get('context') or {}
          recs.append(dict(desc=t.get('description') or '', summ=r.get('summary') or '',
                           ain=c.get('artifacts_in') or [], aout=r.get('artifacts_out') or [],
                           issues=r.get('issues') or [], size=os.path.getsize(f)))

  len(result.summary), n=605:    median 2,986  p90 8,493  p95 12,323  max 47,036
                                 mean 4,296    total 2,599,136
  len(task.description), n=605:  median 704    p90 3,940  p95 5,737   max 19,040
                                 mean 1,470    total 889,118
  per-handoff summ/desc ratio (n=601 carrying both): median 3.53x  p90 13.86x  max 43.5x

  120 of 605 summaries (19.8%) exceed 6,000 chars, against 26 of 605 descriptions
  (4.3%) -- so H-SIZE-1's 6,000-char threshold, which selects a 3.4% tail on the
  dispatch side, would select a fifth of the corpus on the result side. That is a
  property of the threshold, not evidence of a defect.

  So the premise -- `result.summary` is the larger half of the artefact -- is CONFIRMED,
  and confirmed more strongly than it was filed. The defect question is a separate one,
  and it is the one answered no.

correction_to_this_issues_own_figures: >
  BAR ITEM 1's disagreement clause. Every specific figure in this issue's `description`
  was re-derived first-hand and ALL matched exactly: WF03-ISS0117-20260821's 143,465 vs
  68,348 chars; `step-03d-reviewer-regate.json` at 41,723 bytes with a 6,290-char
  description and a 24,369-char summary; ISS-0198's three dispatches at 1,999 / 3,074 /
  2,451 against summaries of 20,095 / 9,021 / 12,104.

  ONE CORRECTION, and it runs UPWARD. The filing's "2.1x" is ONE RUN's ratio
  (143,465 / 68,348 = 2.099x on WF03-ISS0117-20260821), and this issue's title
  generalises it to the corpus. Pooled corpus-wide the gap is WIDER: 2,599,136 summary
  chars against 889,118 description chars = 2.92x over 605 files. The generalisation
  understated the effect it asserted. It is corrected here, in the record, rather than
  left only in a handoff, because a later reader citing "2.1x" from this file as a
  corpus figure would be citing a number this run superseded.

evidence_2_candidate_mechanisms: >
  BAR ITEM 2 -- the specific candidate mechanisms tested, named individually, each with
  its result, INCLUDING the ones the data did not support. All six were looked for and
  NOT found; that list is the substance of the verdict, not an absence of findings.

  Population under test: the 120 summaries over 6,000 chars. Method: 8-word-shingle set
  overlap, reported as the fraction of the SUMMARY's shingles also present in the
  comparison text, so a mostly-restated summary scores high regardless of the source's
  size. Mechanism labels are the diagnosis handoff's own; six mechanisms were run and
  reported, labelled M1, M2, M3, M5, M6, M7 (no M4 row was reported -- the label is
  unused, not a suppressed result).

    M1  summary restates a file named in its own `artifacts_out`
        n=35 usable pairs -- median 0.059, max 0.264, none over 0.30. NOT SUPPORTED.
        This is the direct H-SIZE-1 analogue and it fails at the structural screen too:
        only 46 of the 120 large summaries name an `artifacts_out` basename at all,
        against 20 of 20 on the dispatch side. The screen does not even select.
    M2  summary restates its own `issues[]` entries in prose
        n=130 -- median 0.009, p90 0.075, max 0.162. NOT SUPPORTED.
    M3  a validator's summary restates the producer's summary
        n=248 validator/producer pairs -- median 0.002, p90 0.029, max 0.200.
        NOT SUPPORTED, and it is the load-bearing negative: it is direct positive
        evidence that section 4's re-derivation requirement is being honoured rather
        than echoed.
    M5  summary echoes back its own `task.description`
        n=120 -- median 0.002, max 0.069. NOT SUPPORTED.
    M6  summary restates an earlier summary from the same run
        n=100 -- median 0.007, max 0.162. NOT SUPPORTED.
    M7  summary restates a file it names in its own `artifacts_in`
        n=119 -- median 0.018, max 0.264. NOT SUPPORTED.

  Not one of the 120 large summaries exceeded 0.30 overlap on ANY of the six axes.

  TWO INDEPENDENT LINES carry the verdict, because the shingle test alone cannot (see
  the limitations below):

    (a) EVIDENCE DENSITY. Segments over 25 chars, counted as evidence-bearing if they
        carry a digit, a path-like token or an `ABC-123` identifier. Large summaries:
        median 65.3%, p10 54.7%, min 36.7%. Large descriptions: median 60.1%, p10 41.0%,
        min 30.9%. Digit fraction in large summaries: median 0.0295, p90 0.0490 -- 3-5x
        ordinary English prose. Long summaries are long because they carry MORE
        first-hand measurement per sentence. Restatement would dilute that ratio; it is
        instead the highest in the corpus.
    (b) THE HARDEST CASE, READ BY HAND. The least-evidence-dense large summary that this
        metric selects, `handoffs/WF02-REQ027-20260816/step-02c-security-reviewer.json`
        (34,681 chars, density 0.440, 2nd largest in the corpus): a re-derived scope test
        explicitly refusing ORCH's, an INV-1..INV-8 determination table with all eight
        verdicts, live `__info__(:functions)` output, quoted cleanup output, and a "what
        I did not find" section. It restates its `artifacts_in` nowhere. If the thesis
        fails anywhere it fails here, and it holds here.

  WHY THE TWO SIDES ARE ASYMMETRIC -- the answer to the question this issue explicitly
  refused to pre-decide. The dispatch-side defect (ISS-0198) had TWO halves: a duplicated
  copy AND an empty structured field the content should have travelled in
  (`requirement_text == {}` in 66 of 69). Neither half exists on the result side. A
  duplicated copy is unmeasurable and drifts from its source; a `result.summary` is an
  attestation -- it has no source to drift from, it IS the source, and section 4 makes
  the acting agent the only party who can write it. Length bought by attestation is not
  the same object as length bought by duplication, and the corpus says this is the
  former.

evidence_3_method_limitations: >
  BAR ITEM 3 -- the stated limitations of the method, unsoftened, so a later reader can
  weigh this negative result instead of inheriting it as settled.

  (i) THE SHINGLE CALIBRATION IS THE WEAK POINT, and it is reported rather than hidden.
  Run against the 26 large DISPATCHES -- the side where a restatement defect IS known to
  exist -- the same 8-gram method gives median 0.054, p90 0.200, max 0.347 against
  `artifacts_in` content. It barely separates the side already proven guilty, because
  ISS-0198's cite-and-restate was PARAPHRASE, and verbatim shingles are under-powered
  against paraphrase. So M1-M7 are weak evidence taken alone. They are load-bearing only
  COMPARATIVELY: on every axis the result side scores at or BELOW the dispatch side
  (result max 0.264 < dispatch max 0.347; result p90 0.167 < dispatch p90 0.200). A
  paraphrase-tolerant method -- embeddings, or a normalised-token measure -- could find
  something this one cannot, and nothing here excludes that.

  (ii) THE DENSITY FIGURES ARE METRIC-DEPENDENT, NOT EXACT. Found by REVIEWER at the
  closing gate, independently of the diagnosis: a variant density metric reproduces the
  DIRECTION -- large summaries above large descriptions -- with different absolute values
  AND a DIFFERENT least-dense file. Which summary is the hardest case is therefore a
  property of the metric that selects it, not a fixed fact about the corpus. The hand-read
  at (b) above is a hand-read of the file THIS metric selects. Do not cite 65.3% / 36.7%
  as exact without restating the metric that produced them.

  (iii) SCOPE. This measures the corpus as it stood on 2026-08-21 (605 files, 60 runs).
  It is a negative result about a mechanism at a point in time, not a guarantee that one
  cannot appear later -- which is exactly why the reporting-only extension below was
  recommended instead of nothing.

recommendation_carried_forward: >
  NOT part of this closure and NOT implemented here. This run recommended that ISS-0191's
  linter scope gain ONE extension to the EXISTING H-SIZE-3 INFO reporter: emit
  median/max/total `len(result.summary)` and the summ/desc ratio alongside the description
  figures it already emits. Reporting only -- no threshold, no WARN, no pass/fail, because
  a threshold would be a length rule by the back door and would be correctly discarded by
  the next agent who checked it. Its sole purpose is that if the result side ever DOES
  acquire a restatement mechanism, the drift is visible without a fresh investigation.
  ISS-0191 remains open and unbuilt, and that wording sits under its Enforcement note's
  existing "Specified but NOT YET RUNNING" heading.

what_was_deliberately_not_changed: >
  HANDOFF_PROTOCOL.md's rules are unchanged by this verdict: no result-side length
  target, no required `result.summary` shape, and no extension of section 2's
  inline-vs-`artifacts_in` table to the result side. Section 4's requirement that a
  validator state what it independently re-derived, and section 2's four worked examples,
  were re-verified byte-identical to merge-base 7322185 at every gate of this run, as this
  issue's own closing DO-NOT requires. What this run DID add to that file is a
  non-normative note recording the finding; it changes no rule.

