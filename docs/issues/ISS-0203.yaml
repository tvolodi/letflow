  name exist only in section 4.1(b) prose, so two of the four inputs ISS-0191's linter
  needs for the `not_agent_attested` member check will not track a later 4.1(b) edit.
  Ergonomic, not a blocker -- likely belongs appended to ISS-0191's scope rather than
  fixed in HANDOFF_PROTOCOL.md.

  Both are one-clause edits to documents the ISS-0198/ISS-0201 pair just amended, which
  is why they are one work package.

