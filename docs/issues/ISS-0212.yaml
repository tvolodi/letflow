id: ISS-0212
title: >
  scripts/test_parallel.sh at nproc-default N hits Postgres too_many_connections on a
  16-core host before any test runs
discovered_by: ORCH
discovered_in_run: WF03-ISS0193-20260821
discovered_at: "2026-08-21T12:55:20Z"
severity: MINOR

description: >
  Filed from a MINOR finding in `handoffs/WF03-ISS0193-20260821/step-04-test-runner.json`
  `result.issues`. On a 16-core host, `scripts/test_parallel.sh` defaulted
  `TEST_PARALLEL_N` to `nproc` (16); each partition's Ecto pool defaulted to
  `schedulers_online()*2` (32), so 16 partitions requested 16*32 = 512 connections
  against Postgres `max_connections=100` -- most partitions crashed at `mix ecto.create`
  before a single test ran. Not fixed in the filing run because it was adjacent to that
  run's own unrelated scope (a status-history invariant suite fix).

affected_files:
  - scripts/test_parallel.sh
  - config/test.exs

related:
  - ISS-0194  # the fix that already closes this -- filed and merged independently, same day

