resolved_at: "2026-08-21T16:13:49Z"
resolution_note: >
  Fix: scripts/test_parallel.sh generates one TEST_PARALLEL_GROUP value ("tp$$", its
  own shell PID) once before forking its N partitions, exports it, so every partition
  (a child process of that shell) inherits it. config/test.exs folds a present
  TEST_PARALLEL_GROUP into each connection's application_name as a "_grp<id>" suffix.
  TenantSchemaReaper.concurrent_invocation_present?/2 (test/support/tenant_schema_reaper.ex)
  now extracts that suffix from its own tag and from every other letflow_mixtest_*
  connection found in pg_stat_activity, and excludes a matching group from counting as
  a hazard -- same group, same test_parallel.sh invocation, expected sibling. A
  connection with no group (a plain `mix test`) or a different group (a genuinely
  separate/nested invocation, ISS-0107's scenario) still counts as external and still
  triggers deferral, exactly as ISS-0110 originally specified -- preserving that
  protection unweakened.

  Design documented in lib/letflow/design/iss064-orphaned-tenant-schemas-fix.md's new
  §12, extending the §11 (ISS-0110) section.

  Verification: `TEST_PARALLEL_N=4 ./scripts/test_parallel.sh` run TWICE, both times
  1390/1390 tests passed with zero failures (first pass at TEST_PARALLEL_GROUP=tp3265586,
  second at tp3268548) -- satisfying the acceptance criterion's explicit "at least
  twice" requirement. TenantSchemaReaperTest's own ISS-0110 nested-invocation test
  (which simulates an external invocation via a fake, ungrouped application_name tag)
  passed in both runs, confirming the original protection still holds.

  INCIDENTAL FINDING, fixed in the same pass since it directly blocked the required
  two-clean-runs verification: an earlier verification attempt hit 3 cascading
  failures in one partition, traced to a pre-existing test-hygiene gap in
  tenant_schema_reaper_test.exs's ISS-0110 test -- its `other_conn` (a raw Postgrex
  connection simulating an external invocation) was only closed by an explicit call at
  the end of the test body, so a transient connection-pool-pressure timeout on an
  earlier assertion left it open for the rest of the partition's run, cascading
  deferral into unrelated later tests. Added a guaranteed `on_exit` cleanup
  (`if Process.alive?(other_conn), do: GenServer.stop(other_conn)`) so the connection
  closes regardless of what else in the test raises. This is a test-hygiene fix, not a
  change to sweep_orphans/2's own logic or contract.

  Self-gated throughout (no CODE-DESIGNER/CODE-DESIGN-VALIDATOR/REVIEWER role split
  available in this execution context) -- stated here plainly per this session's
  established convention for that deviation.
