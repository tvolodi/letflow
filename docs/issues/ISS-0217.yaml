id: ISS-0217
title: >
  scripts/test_parallel.sh sibling partitions trigger TenantSchemaReaper
  concurrent-invocation guard ISS-0110, always deferring the sweep and failing
  reclaimed/skipped assertions
discovered_by: ORCH
discovered_in_run: WF02-REQ067-20260821
discovered_at: "2026-08-21T15:37:53Z"
severity: MAJOR

description: >
  Filed from a MAJOR finding in `handoffs/WF02-REQ067-20260821/step-04-test-runner.json`
  `result.issues`. `TenantSchemaReaper.sweep_orphans/2`'s ISS-0110 liveness guard defers
  its entire sweep whenever `pg_stat_activity` shows any other `letflow_mixtest`-tagged
  connection, since it cannot distinguish a live sibling's row from a dead one.
  `scripts/test_parallel.sh`'s own N parallel `mix test` OS processes are exactly such
  siblings from each other's point of view, so whichever partition runs
  `test/support/tenant_schema_reaper_test.exs` sees the other partitions as another
  invocation and defers entirely, making `reclaimed`/`skipped` always 0 regardless of the
  test's own fixture setup. Reproduced directly: the 3 failing tests pass 6/6 in
  isolation and fail identically inside a `TEST_PARALLEL_N=4` run, with the guard's own
  deferral log line printed at each failure point. Distinct from ISS-0194/ISS-0212
  (connection-pool exhaustion at `ecto.create`, already resolved) and from ISS-0110
  itself (the original nested-invocation scenario the guard was built for, not this
  sibling-partition trigger of the same guard).

