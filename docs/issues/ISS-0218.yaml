resolution_note: >
  Removed the orphaned `<<<<<<< HEAD` line (docs/status/requirement_status.v2.yaml
  line 368). No other file change. Re-ran
  test/docs/requirement_status_invariants_test.exs after the fix: 20/20 passed,
  matching the pre-fix run (the suite does not assert against this specific
  marker text, so its pass/fail count is unchanged by design -- verification here
  rests on the direct grep re-check below, not the test count). Post-fix
  `grep -n '^<<<<<<<\|^=======\|^>>>>>>>' docs/status/requirement_status.v2.yaml`
  returns no matches.
