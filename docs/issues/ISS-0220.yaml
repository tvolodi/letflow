id: ISS-0220
title: >
  SandboxPool claim/release call timeouts are derived from max_wait_ms plus a fixed
  5000 ms that was never sized against provisioning cost, so claims fail under load
discovered_by: TEST-RUNNER
discovered_in_run: WF02-REQ071-20260821
discovered_at: "2026-08-22T00:30:00Z"
severity: MAJOR
severity_note: >
  Filed as MINOR; raised to MAJOR by this run's diagnosis. The filing read the
  symptom as environmental resource contention, which would have been MINOR. It is
  in fact a library defect that makes claim/2 fail on correct work whenever
  provisioning exceeds a budget with 1.38x margin on a completely idle host --
  reachable without any test parallelism at all.

description: >
  Filed by TEST-RUNNER during WF02-REQ071-20260821 Step 4. At TEST_PARALLEL_N=4, 16
  pre-existing tests failed: Letflow.SandboxPoolTest (7), Letflow.SandboxPool.FixtureLoaderTest
  (5), Letflow.Definitions.PromotionAssertionRerunTest (4). Every failure was a
  `GenServer.call(SandboxPool pid, {:claim, N}, timeout)` exit.

  The filing attributed this to connection-pool resource contention, citing a
  `Postgrex.Protocol disconnected: DBConnection.ConnectionError` immediately preceding
  each failure. THAT ATTRIBUTION WAS WRONG, and the diagnosis below refutes it with
  measurement -- see resolution_note. The filing's Route-1 work was sound and was
  re-checked: the REQ-071 branch touched none of the failing test files, nor
  lib/letflow/sandbox_pool.ex, nor lib/letflow/sandbox_pool/fixture_loader.ex; and it is
  correctly distinguished from ISS-0217 (a TenantSchemaReaper sibling-partition deferral
  guard), which is a different mechanism.

