id: ISS-0221
title: >
  WF-01 never tells ORCH to register the requirement in letflow-queue, so a
  correctly-produced requirement is unclaimable
discovered_by: ORCH
discovered_in_run: ORCH-20260822-queue-loop
discovered_at: "2026-08-22T00:52:00Z"
severity: MAJOR

description: >
  `docs/agents/workflows/WF-01_requirement_development.md` contains zero
  occurrences of `register`, `queue`, or `impl_order` (verified by
  `grep -in "register\|queue\|impl_order"` over the whole file). Its Overview
  diagram ends at `[OUTPUT: requirement(s) ready for WF-02]` and its Output
  section repeats the same, with no registration step anywhere.

  But `docs/agents/protocols/TASK_QUEUE.md` makes registration the thing that
  turns a requirement into claimable work. It states that `register_task` fires
  on "WF-01 (Requirement Development) reaching its end: once REQ-VALIDATOR
  passes a new requirement"; that "task selection happens through
  `get_next_task` only"; and that "`register_task` is the only source of
  `impl_order`" with "an unregistered requirement carries no `impl_order` at
  all -- never a guessed one".

  Net effect: an ORCH that follows WF-01 to the letter produces a well-formed,
  validated, `pending` requirement that no agent can ever claim. It fails
  silently -- no error is raised, the requirement simply never appears in
  `get_next_task`, and the only symptom is an idle pipeline.

  Observed live on 2026-08-22: `docs/requirements.yaml` held 35 `pending`
  requirements while `get_next_task` returned `no_eligible_task`.

  The obligation exists only in TASK_QUEUE.md, describing a trigger inside a
  workflow that does not itself mention it. Neither document is wrong on its
  own; they are only correct when read together, and WF-01 gives no signal that
  a second document must be read.

affected_files:
  - docs/agents/workflows/WF-01_requirement_development.md
  - docs/agents/workflows/WF-03_issue_resolving.md  # check for the same gap

related:
  - REQ-128  # ..REQ-135: drafted 2026-08-22, deliberately left UNREGISTERED
             # pending validation -- the case that surfaced this gap

queue_task_id: 221
github_issue: 452
github_issue_note: >
  `register_task` created both the queue task (221) and its mirrored GitHub
  issue (452) in one call, per ISSUE_QUEUE.md step 2a; `gh issue create` was
  deliberately not called separately.

status: resolved
resolved_in_run: WF03-ISS0221-20260821
resolved_at: "2026-08-21T21:00:00Z"
resolution_note: >
  Added an explicit Step 3 ("Register in letflow-queue") to
  `docs/agents/workflows/WF-01_requirement_development.md`, between the
  existing Step 2 (REQ-VALIDATOR gate) and the Output section: names ORCH as
  the caller, cites `TASK_QUEUE.md`'s `register_task` contract directly, and
  states `impl_order` is written back into the requirement's
  `docs/requirements.yaml` entry from the response, never guessed. The
  Overview diagram gained a matching `STEP 3: REGISTER` box, and the Output
  section now states registration explicitly as part of what "ready for WF-02"
  means. All four of this issue's acceptance criteria satisfied by that single
  edit.

  AC4 (WF-03 checked for the same gap): confirmed WF-03 does NOT have the same
  gap, structurally rather than by inspection alone -- `ISSUE_QUEUE.md`'s own
  procedure (steps 1-3) makes `register_task` a PREREQUISITE of a
  `docs/issues/ISS-NNNN.yaml` file existing at all: the issue's very id (its
  filename) comes from `register_task`'s `issue_ref` response field, so an
  issue simply cannot reach WF-03's trigger condition ("a queued
  `docs/issues/ISS-NNNN.yaml` entry") without already being registered. This
  is unlike WF-01, where a requirement is drafted and validated entirely
  within `docs/requirements.yaml` with no queue interaction required at any
  point -- the exact asymmetry this issue's own filing predicted might not
  hold on the WF-03 side. No WF-03 edit needed.

  Also checked whether the 35 unregistered `pending` requirements the original
  filing observed live still exist: they do not -- every requirement in the
  current `docs/requirements.yaml` (checked via a full-file scan, not a
  sample) already carries `impl_order`, so the practical backfill this
  filing's symptom described has since been completed by other work, separate
  from this issue's own scope (a documentation fix, not a data-remediation
  task). No further action taken on that front.

  Docs-only change (one file), self-gated per `docs/agents/ORCHESTRATOR.md`
  §10's direct-action allowance.
