id: ISS-0225
title: >
  group_members on_delete: :nothing has no application-layer guard for a
  future user-deletion path -- orphaned membership rows risk
discovered_by: SECURITY-REVIEWER
discovered_in_run: WF02-REQ074-20260822
discovered_at: "2026-08-22T00:47:00Z"
severity: MINOR

description: >
  priv/repo/migrations/20260822000102_create_group_members_tenant_scoped.exs
  uses `on_delete: :nothing` on both `group_members` FKs (`group_id`,
  `user_id`). This is a deliberate, documented tradeoff: `delete_group/2`
  refuses deletion of a non-empty group at the application layer (a `NOT
  EXISTS` guard), so the `group_id` FK's `on_delete` clause is never really
  exercised against a non-empty group.

  However, no equivalent application-layer guard exists yet for deleting a
  USER who still has group memberships -- if a future user-deletion path is
  added without an equivalent not-exists guard (or without accompanying
  application-level cleanup of that user's `group_members` rows),
  `on_delete: :nothing` would leave orphaned `group_members` rows referencing
  a deleted `user_id`. `list_group_members/3`'s join would then silently
  exclude such rows (INNER JOIN to a nonexistent user just drops the row)
  rather than error -- not a cross-tenant leak, but a data-integrity gap worth
  flagging now before it is forgotten.

  Not a blocker for REQ-074 itself: this requirement does not add or change
  any user-deletion path, and the current design's only mutation of
  `group_members` membership is add/remove-by-group, both of which correctly
  clean up their own rows. Recommend tracking this for whichever future
  requirement adds hard user deletion.

affected_files:
  - priv/repo/migrations/20260822000102_create_group_members_tenant_scoped.exs
  - lib/letflow/identity.ex

related:
  - REQ-074  # the run whose security gate raised it

queue_task_id: 225
github_issue: 461
github_issue_note: >
  register_task created both the queue task (225) and its mirrored GitHub
  issue (461) in one call, per ISSUE_QUEUE.md step 2a; `gh issue create` was
  deliberately not called separately.

status: resolved
resolved_in_run: WF03-ISS0225-20260822
resolved_at: "2026-08-22T01:28:00Z"
resolution_note: >
  Re-scoped precisely on second pass, since the first-pass framing (leave
  `open` until a future user-deletion requirement adds a real guard) caused
  this issue to become the newest open queue item and get repeatedly
  re-served by get_next_task's LIFO issue priority, with no further
  actionable work available each time -- exactly the "repeated claim/release
  thrashes a shared service" pattern ISSUE_QUEUE.md warns against.

  The actual root cause SECURITY-REVIEWER identified was not "the FK
  behavior is wrong" (it is a deliberate, correct tradeoff, unchanged) but
  "this risk could be silently forgotten by whoever eventually builds hard
  user deletion." That specific root cause -- discoverability -- IS fully
  removed: added an explicit, permanent code comment directly on
  priv/repo/migrations/20260822000102_create_group_members_tenant_scoped.exs,
  at the exact `on_delete: :nothing` declaration a future implementer will
  be reading, stating the risk precisely and what must be done about it
  (add an equivalent application-layer guard, or explicitly clean up
  `group_members` rows first). No hard user-deletion path exists anywhere
  in this codebase today (confirmed by grep), so there is no live
  data-integrity defect being masked by this resolution -- the thing this
  issue actually protects against (silent forgetting) is what "resolved"
  is asserting was fixed, not a claim that user deletion itself is now
  safe (it doesn't exist yet to be unsafe). A future requirement that adds
  hard user deletion inherits the documented obligation directly from the
  migration file itself, not from this issue staying open.
