resolved_in_run: WF03-ISS0227-20260822
resolved_at: "2026-08-22T05:08:55Z"
resolution_note: >
  Both fields removed, each replaced by a derivation at the point of use, with a
  fail-then-pass regression test. Design:
  lib/letflow/design/iss0227-sandbox-pool-dead-field-removal.md.

  WRITE-ONLY CONFIRMED BEFORE ANYTHING WAS REMOVED, by three agents
  independently. `owner_pid` appeared in code at exactly four lines, all in
  sandbox_pool.ex: :160 (typespec), :527 (a local), :528 (that local read by
  `Process.monitor/1`), :535 (the op-literal write). No read of the FIELD
  anywhere -- the four `owner_pid` tokens in sandbox_pool_test.exs (:420, :443,
  :444, :445) bind an unrelated local for a process the test spawns and kills.
  For `in_flight.schema_name`, every `in_flight.<field>` access in code across
  lib/ and test/ was enumerated: `grep -rohE --include=*.ex --include=*.exs
  "in_flight[a-z_]*\.[a-z_]+" lib test | sort | uniq -c` returns 12 hits --
  `.op` x7, `.task_ref` x4, `.task_pid` x1 -- and ZERO `.schema_name`. No map
  pattern destructured it, and the module's only `Map.*` lookup is
  `Map.fetch(state.active, sandbox_id)`.

  WHAT CHANGED. lib/letflow/sandbox_pool.ex, five deletions plus two trailing
  commas: `owner_pid` out of the `@typep provision_op` and out of
  `reserve_slot/2`'s op literal; `schema_name` out of `pump/1`'s `in_flight`
  record and out of the state-shape comment; `op_schema_name/1` deleted, having
  become callerless. The local `owner_pid = elem(from, 0)` and
  `owner_ref = Process.monitor(owner_pid)` are untouched -- only the redundant
  stored copy went, never the monitor.

  THE DERIVATIONS, and why each is equivalent. `owner_pid` -> `elem(p.from, 0)`:
  `from` is retained on the op for its whole lifetime, `owner_pid` was computed
  from that same `from` at that same instant in `reserve_slot/2`, and the single
  in-place rewrite this module performs on a provision op is `owner_down?: true`,
  which touches no other key -- so the derivation cannot drift from what the
  field held. `in_flight.schema_name` -> the name off `in_flight.op`: the record
  retains the very op the removed copy was computed from, both op kinds keep
  `schema_name` in their typespecs, and both `in_flight` map-updates touch only
  the `op` key. Every existing consumer already read it that way.

  NO INVARIANT MOVED. REVIEWER (the filer) verified by reading, not by diff size:
  `owner_ref` intact at all 20 of its sites; the owner monitor still established
  at reservation, on the caller, strictly before any schema can exist; clause B's
  ordered classification (cases 1, 2, 3, 4, 4b, 5) untouched with 4b still ahead
  of 5; the serialized-DB-worker property untouched (`pump/1` tests `in_flight`
  for nil as a whole field, which a smaller record cannot affect); and the
  `db_queue` `2 x max_concurrent` bound still sound, because it counts OPS via
  the `op` key and is inert to a deleted sibling key. No external behaviour
  change, no new invariant, nothing in docs/migration/decisions/ re-decided.

  SECURITY. SECURITY-REVIEWER was dispatched rather than skipped, because one
  removed field was a schema name in a module that DROPs real Postgres schemas by
  interpolated identifier -- "dead-code deletion" is not self-evidently safe
  there. Its scope test came back out-of-scope on all five items, but it ran
  INV-1, INV-7 and INV-8 in full anyway and answered the load-bearing question
  negatively: no DROP can be redirected, widened or lost, because every
  schema-naming path (`run_op/1`, `handle_worker_death/1`, the `owner_down?`
  discard, case 4b's orphan rewrite, case 5's reclaim) takes the name off an op,
  off the returned `%SandboxClaim{}`, or off `state.active` -- never off the
  `in_flight` record. PASS.

  REGRESSION TEST -- RT-9, test/letflow/sandbox_pool_test.exs:1194, appended to
  the existing ISS-0224 RT block. Sorted-key-list EQUALITY on the provision op's
  key set and on the `in_flight` record's, chosen over `refute Map.has_key?/2`
  so the guard catches a removed field returning AND an undeclared one appearing;
  plus assertions that both replacement derivations still reach their values.
  FAIL-THEN-PASS, reproduced independently by TEST-DESIGN-VALIDATOR in its own
  throwaway worktree rather than accepted from the report: pre-fix at a64159d,
  RT-9 alone gives `Result: 0/1 passed`, assertion (1) failing with
  `left: [:from, :owner_down?, :owner_pid, :owner_ref, :sandbox_id, :schema_name]`
  against a right-hand side without `:owner_pid`. ExUnit halts at the first
  failed assertion, so assertion (2)'s pre-fix failure was shown by a second
  probe with (1) elided: `left: [:op, :schema_name, :task_pid, :task_ref]` vs
  `right: [:op, :task_pid, :task_ref]`. Post-fix, all three pass.

  MUTATION TESTING, not owed but done. WF-03's "pre-fix failure is non-existence"
  clause does not apply here, so no mutant set was required; TEST-DESIGN-VALIDATOR
  ran two anyway to prove RT-9 discriminates rather than merely passes. Re-adding
  `owner_pid` to `reserve_slot/2`'s literal kills RT-9 on assertion (1) and no
  other; re-adding `schema_name` to `pump/1`'s record kills it on assertion (2)
  and no other. Both applied in a throwaway worktree, never in the checkout, and
  reverted with the revert verified.

  TEST EVIDENCE. Full suite via `TEST_PARALLEL_N=4 sh scripts/test_parallel.sh`
  (REQ-114): `combined: 1546 tests, 5 properties, 0 failures (1551/1551 passed)`,
  all four partitions exit 0. Scoped pair
  `mix test test/letflow/sandbox_pool_test.exs
  test/letflow/sandbox_pool_call_timeout_test.exs`: `Result: 21 passed` --
  the pre-change baseline of 20 plus RT-9, no bound moved and no existing test
  rewritten, weakened or deleted. `mix compile --warnings-as-errors` exits 0
  (including with `--force`), which is what proves `op_schema_name/1` was
  actually deleted rather than left orphaned. `mix format --check-formatted`
  exits 0. GH #465's acceptance criterion 4 grep, code-file-restricted, returns
  no output: no writer of either field remains in any .ex or .exs.

  ONE RUN-LOCAL FAILURE, DIAGNOSED NOT SWEPT. TEST-RUNNER's first scoped-pair
  attempt gave 19/21, failing RT-7 and RT-3 -- both on
  `assert sandbox_schema_names() == baseline`, a GLOBAL query over every
  `sandbox_%` schema rather than one scoped to the pool under test. Attributed to
  a concurrent foreign `mix test` on the shared 5472 database on four grounds:
  `pg_stat_activity` showed it connected; the run's own log carried
  TenantSchemaReaper declining to sweep for exactly that reason (the ISS-0110
  guard firing as designed); diffing the MapSets showed +1 schema appearing in
  one test and -1 vanishing in the other, which third-party drift does and a leak
  does not; and re-running alone, after polling until no mixtest connections
  remained, gave 21 passed. The full-suite run had already exercised both tests
  at 0 failures. Not attributable to ISS-0227. This is the known
  ISS-0107/ISS-0110 class and warranted no code change.

  SCOPE HELD. This removed the two fields the issue names and nothing else. No
  module-wide dead-field audit of `drop_op()`, `db_queue` or `active` was
  performed, and the design says so explicitly rather than implying completeness
  -- reported to ORCH as a successor candidate instead of quietly expanding a
  MINOR issue. REVIEWER separately recorded, declining to mint an id per
  ISSUE_QUEUE.md, that `in_flight` and both op maps are bare maps rather than
  structs, so re-adding a redundant key remains a legal warning-free edit and
  RT-9 is the only thing standing between it and main; a struct with
  `@enforce_keys` would make this defect class unrepresentable rather than merely
  detectable. Left for ORCH to weigh.

  TWO ANTI-PATTERN ENTRIES WRITTEN, on REVIEWER's ruling that both were
  write-now rather than deferrable. (1) An amendment to
  docs/anti-patterns.md:1195: this run's own AC4 grep is tripped by three media
  the existing entry does not contemplate -- a live design doc, a superseded
  design doc, and handoff JSON -- and for those the entry's stated remedy
  INVERTS. You restrict the criterion by path; you do not reword the prose,
  because a design that cannot name the field it removes is not a design and a
  handoff is a frozen audit record. (2) A new entry: `elixirc
  --warnings-as-errors` exits 0 on an unused private function while
  `mix compile --warnings-as-errors` exits 1 on the same shape. Same flag name,
  same warning text, opposite exit code -- and this project's merge gate is the
  mix form. In this run that divergence decided whether `op_schema_name/1` had to
  go.

