id: ISS-0227
title: >
  SandboxPool carries two write-only fields that are derivable from state it
  already holds: `owner_pid` on the provision op, and `schema_name` on the
  `in_flight` record
discovered_by: REVIEWER
discovered_in_run: WF03-ISS0224-20260822
discovered_at: "2026-08-22T02:11:00Z"
severity: MINOR

description: >
  Raised by REVIEWER during WF03-ISS0224-20260822 (merge b8ebfb0), which declined
  to mint an id itself per ISSUE_QUEUE.md and reported the finding to ORCH for
  registration instead.

  ISS-0224 reshaped `Letflow.SandboxPool`'s internals substantially -- async
  provisioning through a single serialized DB worker, with new `db_queue` and
  `in_flight` state. Two fields introduced by that reshape are written but never
  read, and each duplicates a fact the pool already holds elsewhere:

    1. `owner_pid` in `provision_op()` -- declared at lib/letflow/sandbox_pool.ex
       :160, written at :535 in `reserve_slot/2`'s op literal. The same value is
       already recoverable from the op's own `from` field as `elem(from, 0)`,
       which is exactly how :527 computed it in the first place.
    2. `schema_name` on the `in_flight` record -- declared in the state-shape
       comment at :316, written at :572 in `pump/1` as `op_schema_name(op)`. The
       op it was computed from is retained on the very same record as
       `in_flight.op`, so the value is recoverable as
       `op_schema_name(in_flight.op)`.

  Write-only derivable state in a process that carries concurrency invariants is
  a future correctness hazard rather than a present bug: the two copies can drift
  apart under a later edit, and a reader arriving afterwards cannot tell which of
  them is authoritative. `SandboxPool`'s invariants (INV-SP-A1..A7, the
  owner-monitor reclaim mechanism, the same-process claim/release contract) are
  precisely the kind that a stale second copy would corrupt silently.

  No test caught this and none could have. Both fields are write-only, so no
  observable behaviour depends on them and no black-box assertion can
  distinguish their presence from their absence; the ISS-0224 suite's white-box
  `:sys.get_state/1` probes assert on the specific fields they need (`.op`,
  `.task_ref`, `.task_pid`) rather than on the whole state map, so a surplus key
  is invisible to them too. Tellingly, the two tests that DO need the in-flight
  schema name already derive it the intended way rather than reading the stored
  copy -- test/letflow/sandbox_pool_test.exs:920 and :1007 both destructure
  `{:provision, %{schema_name: o_schema}} = state.in_flight.op`.

affected_files:
  - lib/letflow/sandbox_pool.ex
  - lib/letflow/design/iss0224-sandbox-pool-async-provisioning.md
  - test/letflow/sandbox_pool_test.exs
