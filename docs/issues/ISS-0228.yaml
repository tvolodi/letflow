description: >
  Raised by REVIEWER during WF03-ISS0224-20260822 (merge b8ebfb0), which
  declined to mint an id itself per ISSUE_QUEUE.md.

  `lib/letflow/design/iss0224-sandbox-pool-async-provisioning.md` section 6.4
  enumerates the `GenServer.reply/2` call sites that back the exactly-one-reply
  invariant (INV-SP-A2), but its table was missing one row. An incomplete
  enumeration in a design doc that is the reference for a concurrency invariant
  is worse than no table at all: a later reader treats it as exhaustive.

  Note: no `docs/issues/ISS-0228.yaml` local record was ever written by the
  filing run (`WF03-ISS0224-20260822`) — this file was created retroactively
  as part of resolving the issue, since none existed anywhere in git history
  at claim time.

