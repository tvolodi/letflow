resolution_note: >
  Verified the enumeration against the actual implementation, not against the
  existing table: `grep -n "GenServer.reply" lib/letflow/sandbox_pool.ex`
  found 7 call sites. Traced each to its owning code path:
  - `complete_op` `{:provision, _}` success -> `{:ok, claim}` (1 site)
  - `complete_op` `{:provision, _}` failure -> `{:error, :provision_failed}` (1 site)
  - `handle_worker_death/1`'s `{:provision, p}` clause (worker crashed during
    provisioning) -> `{:error, :provision_failed}` (1 site)
  - `complete_op` `{:drop, d}` when `d.from != nil` (the DROP worker
    *returned*, either `:ok` or `{:error, :release_failed}`) -> 2 call sites,
    one table row (already present, correctly documented as one row covering
    both outcomes)
  - `handle_worker_death/1`'s `{:drop, d}` clause when `d.purpose == :release`
    (the DROP worker *crashed*, distinct from the row above -- a genuinely
    different trigger, worker exit vs. worker return) -> `{:error,
    :release_failed}` (1 site) -- **this was the missing sixth row**
  - `handle_info({:claim_timeout, _}, ...)` -> `{:error, :sandbox_unavailable}`
    (1 site)

  All 7 call sites accounted for across 6 table rows (one row legitimately
  covers 2 call sites, as it already did before this fix). Added the missing
  row, corrected "five sites" to "six sites" in section 6.4's own intro and in
  the restated INV-SP-A2 invariant elsewhere in the document, and added an
  explicit completeness-verification paragraph stating the grep-and-trace
  method used, so a future reader knows this was checked, not assumed.
  Docs-only change (one file), no code touched, self-gated per
  ORCHESTRATOR.md §10 direct-action allowance.
