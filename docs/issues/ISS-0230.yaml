status: resolved
resolved_in_run: WF03-ISS0230-20260822
resolved_at: "2026-08-22T03:19:41Z"
resolution_note: >
  OUTCOME SHAPE CHOSEN: scoped forward into REQ-076 with the gap documented --
  NOT implemented inline. This follows ISS-0225's precedent, and it is a claim
  about a specific root cause, so state plainly what it does and does not
  assert.

  WHAT IS NOT ASSERTED: there is still no reconciliation, retry or sweep
  mechanism in this codebase, and a tenant half-provisioned by a replay failure
  still requires manual intervention. This record does not claim otherwise, and
  a later run cross-referencing this registry must not read `resolved` as
  "recovery now exists".

  WHAT IS ASSERTED, AND IS THE ROOT CAUSE ACTUALLY REMOVED: the absence of the
  orchestration is a deliberate design decision already on record (req022
  section 3.2's "No implicit chaining invariant"), re-affirmed by this run and
  not relaxed. The removable root cause was therefore never "no code exists"
  -- it was that the obligation to handle this could be silently forgotten by
  whoever eventually builds the orchestration, with nothing anywhere naming it
  as their job. That is now impossible to miss, anchored in three places a
  future implementer reads by necessity rather than by luck: (a)
  `Letflow.TenantProvisioning`'s own moduledoc, immediately adjacent to the
  two primitives any onboarding caller must call, carrying the measured
  detection predicate and recovery procedure; (b) the same design document's
  section 3.2, as a dated addendum directly under the invariant that creates
  the deferral; and (c) REQ-076's own description plus two new acceptance
  criteria, so onboarding cannot pass its own release gate without an
  idempotent recovery entry point and an explicit decision on the tenant
  status lifecycle across onboarding.

  WHY NOT IMPLEMENT NOW. Three independent reasons, any one sufficient. First,
  the shape of a minimal inline fix collides head-on with the invariant: a
  recovery function inside `Letflow.TenantProvisioning` that calls both
  primitives IS the implicit chaining section 3.2 forbids, so implementing here
  would require either violating it or writing a new decision record to
  override it -- and the hard constraint on this run, from REVIEWER's own
  finding, was not to do that silently. The recovery entry point belongs in the
  orchestration layer, which is REQ-076's, not this module's. Second, a
  reconciliation sweep needs design decisions this issue cannot make alone --
  who invokes it (no scheduler subsystem exists; adding one is scope creep into
  the supervision tree), what the tenant status lifecycle should be, multi-node
  concurrency -- i.e. a design pass, which is precisely what REQ-076 gets and a
  WF-03 patch does not. Building it here risks the throwaway orchestration
  REQ-076 would then have to unwind. Third, measurement (see `diagnosis`): the
  recovery capability itself already works and converges, so the gap is
  genuinely orchestration, not capability.

  A FOURTH reason was offered in this record's first draft -- that no caller
  could reach the state at all, since `lib/letflow/routers/tenants.ex` was not
  on `main` -- and it is WITHDRAWN rather than quietly retained: REQ-075 merged
  to `main` during this run's own validation gate, so `POST /tenants` is live
  there and that argument expired before this record was committed (see
  `diagnosis` finding 5). The first two reasons are each independently
  sufficient and are unaffected. The residual exposure is bounded --
  `POST /tenants` is PLATFORM_ADMIN-only via `:TenantsManage`, there is no
  production deployment, and an operator can recover any half-provisioned
  tenant with the two-call sequence the moduledoc now records.

  WHY NOT `instrumented`, and why no successor issue was filed: `instrumented`
  requires a `superseded_by: ISS-NNNN` successor, and the successor here is a
  REQUIREMENT (REQ-076), not an issue. Filing a successor issue would leave a
  newly-created open issue as the newest queue item, to be re-served
  repeatedly by `get_next_task`'s LIFO issue priority with no actionable work
  available each time -- exactly the thrash ISS-0225 hit live and
  ISSUE_QUEUE.md warns against. REQ-076 is `pending` and unstarted, so the
  obligation is carried by work that is already queued and will actually be
  executed.

  NO CODE BEHAVIOUR CHANGED by this resolution -- the only `lib/` edits are a
  moduledoc section and a design-document addendum. `mix compile` clean. No
  regression test accompanies this record, and none is claimed: there is no
  behaviour change to regress, and the two new REQ-076 acceptance criteria are
  where the eventual tests are specified. Consistent with the hard constraint
  from REVIEWER's filing, no compensating rollback or delete of the tenant row
  was added, and the "No implicit chaining invariant" is left standing exactly
  as written.
