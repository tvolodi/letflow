id: ISS-0230
title: >
  No idempotent retry/reconciliation path for a tenants row left in a
  partial-provisioning state after POST /tenants fails downstream
discovered_by: REVIEWER
discovered_in_run: WF02-REQ075-20260822
discovered_at: "2026-08-22T02:27:46Z"
severity: MINOR

description: >
  `POST /tenants` (`lib/letflow/routers/tenants.ex`, `provision_and_respond/2`)
  orchestrates `Letflow.Identity.create_tenant/1` ->
  `Letflow.TenantProvisioning.provision_tenant_schema/1` ->
  `Letflow.TenantProvisioning.replay_migrations/2` in sequence. The `tenants`
  row commits first, so if either downstream call fails the request returns 500
  and a `tenants` row exists with no matching, or only partially migrated,
  Postgres schema. No rollback is implemented -- deliberately -- and no retry,
  reconciliation or sweep path exists anywhere in the codebase.

  REVIEWER confirmed at filing time that the absent rollback is the CORRECT
  call, not a gap: if `provision_tenant_schema/1` had already succeeded and only
  `replay_migrations/2` failed, deleting the tenant row would orphan a real
  Postgres schema plus a `tenant_schemas` registration row pointing at a
  `tenant_id` no longer present in `tenants` -- trading a recoverable partial
  state for an unrecoverable orphan. The filing itself names the right
  remediation as a future idempotent retry/reconciliation mechanism, and notes
  it overlaps REQ-076's self-service onboarding path and
  `Letflow.TenantProvisioning`'s own moduledoc, which already names a future
  tenant-onboarding orchestration requirement as the natural home for it.

diagnosis: >
  Run WF03-ISS0230-20260822, Step 1. Reproduced first-hand against real Postgres
  (`Letflow.DataCase`, Sandbox `:auto` mode, throwaway probe
  `test/iss0230_repro_test.exs`, run and then deleted -- not committed; the
  probe created a tenant, called `provision_tenant_schema/1`, then called
  `replay_migrations/2` with a migration module whose `up/0` raises). Measured,
  quoted from that run's stdout:

    [A] replay outcome: {:error, {:migration_failed, ...}}
    [B] tenants row present?        true
    [B] tenant.status               :active
    [B] tenant_schemas row present? true
    [B] migrations_applied_at       nil
    [B] pg schema exists?           [[true]]
    [B] fixture table present?      false
    [C] TenantProvisioning public functions: [provision_tenant_schema: 1,
        replay_migrations: 1, replay_migrations: 2, schema_name_for_tenant: 1,
        tenant_id_for_schema_name: 1, tenant_scoped_migrations: 0]
    [C] reconciliation-shaped functions found: []
    [D] after re-invocation, migrations_applied_at: ~N[2026-08-22 03:17:47]
    [D] after re-invocation, fixture table present?: true
    [D] registration rows for tenant: 1
    Result: 1 passed

  Findings the filing did not already contain:

  1. `replay_migrations/2` returns a clean tagged `{:error, {:migration_failed,
     _}}` rather than raising, so the call site's `with/else` sees it -- the 500
     is a deliberate branch, not an unhandled crash.
  2. `Registration.migrations_applied_at IS NULL` is ALREADY a sufficient,
     shipped detection predicate for "provisioned but not migrated". A
     reconciliation sweep needs no new column and no new migration.
  3. Re-invoking BOTH primitives with the same `tenant_id` fully converges the
     state -- `migrations_applied_at` set, tables present, still exactly one
     `tenant_schemas` row. The recovery CAPABILITY is shipped and works; only
     the orchestration that would invoke it is absent.
  4. NOT in the filing: the half-provisioned tenant's `status` was `:active`
     throughout. An unmigrated tenant is currently advertised as fully live,
     so `Letflow.Plugs.TenantStatus` (REQ-021) does not gate it. This is the
     same question `Letflow.TenantProvisioning`'s moduledoc already flags under
     "Secondary open question", now shown to be load-bearing for this issue
     rather than theoretical.
  5. Scope datum, and its expiry. At DIAGNOSIS time
     `lib/letflow/routers/tenants.ex` did not exist on `main` at all -- it
     lived only on the unmerged `feature/WF02-REQ075-20260822` branch, and
     `grep` confirmed `main` had no production caller of
     `provision_tenant_schema/1` whatsoever, so no caller could reach this
     state. That is no longer true as of this run's own Step Final: REQ-075
     merged to `main` (PR #464) while this run was in its validation gate, so
     `POST /tenants` and with it the partial-provisioning window are now live
     on `main`. Recorded rather than quietly dropped, because it WEAKENS one
     of the three reasons given below for scoping forward instead of
     implementing -- the "nobody can hit it yet" argument expired on merge.
     The other two reasons (the invariant collision, and recovery being an
     orchestration-design problem rather than a missing capability) are
     unaffected and remain sufficient on their own. The residual exposure is
     bounded: `POST /tenants` is `:TenantsManage`, restricted to
     PLATFORM_ADMIN, there is no production deployment, and recovery from the
     partial state is a two-call sequence any operator can run from IEx using
     the procedure recorded in the moduledoc.

  Root cause, stated precisely: this is NOT "the code does the wrong thing".
  Every individual component behaves as designed, the missing rollback is
  correct, and the two primitives are idempotent exactly so that re-invocation
  is safe. What is missing is an ORCHESTRATION LAYER, and its absence is itself
  a deliberate, recorded design decision --
  `lib/letflow/design/req022-tenant-schema-provisioning.md` section 3.2's "No
  implicit chaining invariant" holds `provision_tenant_schema/1` and
  `replay_migrations/2` uncoupled on purpose and explicitly assigns the
  sequencing, and therefore the failure handling between the two steps, to a
  future onboarding-orchestration requirement. The real risk this issue guards
  against is that this obligation is silently forgotten by whoever builds that
  orchestration.

affected_files:
  - lib/letflow/tenant_provisioning.ex
  - lib/letflow/design/req022-tenant-schema-provisioning.md
  - docs/requirements.yaml           # REQ-076, the anchor this resolves into
  - lib/letflow/routers/tenants.ex   # not on main; feature/WF02-REQ075-20260822 only

related:
  - REQ-075  # the run whose REVIEWER gate raised it
  - REQ-076  # tenant onboarding -- the anchor this issue is scoped into
  - REQ-022  # the design whose section 3.2 invariant defers the orchestration
  - ISS-0225 # precedent: resolve by removing the discoverability root cause

