status: resolved
resolved_in_run: WF03-ISS0231-20260822
resolved_at: "2026-08-22T03:46:57Z"
resolution_note: >
  Two parts, matching the two the filing scoped.

  PART 1 -- THE RECORD. `docs/issues/ISS-0221.yaml` gained a top-level
  `correction:` field, following ISS-0076's precedent for amending a closed
  issue honestly. Nothing was rewritten: the false sentence is left in place
  inside `resolution_note`, quoted and labelled, with the surrounding paragraph
  redirecting the reader to the correction; the "No further action taken on
  that front" framing is explicitly retracted, since that framing is what let
  the gap sit undetected. The correction gives the real count (21), names the
  root cause (a substring scan that matched `impl_order:` anywhere on the line,
  so the `# impl_order: UNREGISTERED` marker form counted as registered),
  re-verifies it at the fix commit as well as live, and states plainly that the
  21 are DELIBERATELY deferred with inline rationale and are not this issue's
  to register. A `corrected_by: [ISS-0231]` field makes the amendment
  traceable from the record itself.

  PART 1b -- AN ADDENDUM, BECAUSE THE WORLD MOVED MID-RUN. While this run was
  in flight, a sibling session landed c84c27a ("docs(WF-01): put REQ-115..139
  through WF-01 and register all 25 in letflow-queue", PR #495). After rebasing
  onto it the count is 0 unregistered of 115. Rather than editing the
  correction to match -- which would have made the record silently
  self-updating, the same dishonesty class the correction exists to fix -- a
  `correction_addendum:` field was APPENDED recording what changed, and why it
  does not vacate the correction: the correction is about a claim that was
  false when asserted, which no later work changes.

  PART 2 -- THE DETECTOR.
  `lib/mix/tasks/letflow.check_requirements_registration.ex`, wired into the
  `letflow.check` alias in `mix.exs` at position 2 (immediately after
  `letflow.check_toolchain`; decision record 0005 legislates slot 1 only, so
  this re-decides nothing). Placement was the load-bearing choice: this repo
  has NO CI configuration at all, so `mix letflow.check` is not merely the
  primary gate surface but the only one, and `mix letflow.lint_handoffs` is the
  local counter-example of a good check wired into nothing.

  It classifies every requirement entry into four states -- `:registered`
  (an `impl_order: <int>` field), `:deferred` (the `# impl_order: UNREGISTERED
  -- <rationale>` marker), `:neither` (no `impl_order` line of any form), and
  `:unclassified` (a novel or malformed shape). The fourth state is the whole
  defence against the original bug: an unrecognised form falls into a FAILING
  bucket instead of being silently absorbed into a passing one, so a scan that
  fails to recognise a form surfaces as a violation rather than as a clean
  report.

  Hard rules R1-R6 (no silent absence, no unrecognised form, every deferral
  carries a rationale, ids unique, partition total with a non-empty corpus,
  file present and shaped). The `:deferred` roster is printed unconditionally
  on green runs and NEVER gates. That split was argued and upheld at the design
  gate: a gate permanently red for a known, documented, intended state gets
  ignored just as surely as a check nobody runs, and the roster under a loud
  header is what makes an ISS-0221-style claim self-refuting without muting
  anything.

  `docs/agents/protocols/TASK_QUEUE.md`'s permissive sentence was tightened in
  the same commit, because R1 otherwise gates a rule the protocol did not
  state: the marker plus a non-empty rationale is now MANDATORY and bare
  absence of an `impl_order` line is an error condition, not a second legal
  form. The comment form stays legal; only bare absence stopped being.

  VERIFICATION. All quoted from real runs, not claimed. On the pre-rebase
  corpus the task reported `111 entries = 90 registered + 21 deferred + 0
  neither + 0 unclassified`; post-rebase, `115 entries = 115 registered + 0
  deferred + 0 neither + 0 unclassified`, exit 0 both times. Deleting one
  marker line from an in-memory copy produced `[R1] REQ-115 ... carries no
  `impl_order` line of any form`, naming the exact id. The original bug was
  reproduced against the shipped code: the substring scan returns 112 hits over
  111 entries where the real registered count is 90.

  FAIL-FIRST IS MUTATION-BASED, NOT UndefinedFunctionError. The fix adds a
  module, so WF-03's "when the pre-fix failure is non-existence" clause
  applies. Twelve mutants were applied to the shipped logic and run.
  TEST-DESIGN-VALIDATOR independently re-applied eight of them after reading
  the harness and inspecting each resulting `lib/` diff, and hand-wrote two
  more (MR4, MR6) to close R4 and R6, the two rules the harness had no mutant
  for; every count matched. M1 -- the field-form/substring blindness that
  caused ISS-0221's false all-clear -- takes the suite to 19/29, and all ten
  red tests are hermetic with zero live-corpus tests red. That is the headline
  result: because PR #495 emptied the deferred set, M1 is now invisible to any
  live-corpus test, so the hermetic fixture group is the entire regression
  value and the design's insistence on a public pure core was load-bearing
  rather than stylistic.

  GATES. CODE-DESIGN-VALIDATOR PASS (one MAJOR corrected in place: R5's
  totality equality is a tautology, so mutant M3 was narrowed and the design's
  claim demoted; all five open questions ruled). SECURITY-REVIEWER
  OUT_OF_SCOPE, scope test applied to the real diff -- no migration, no Ecto
  schema, no tenant-scoped query, no route; INV-4/6/7/8 PASS. REVIEWER PASS,
  no MAJOR, no MINOR. TEST-DESIGN-VALIDATOR PASS.

  NOT DONE, DELIBERATELY: REQ-115..135 were not registered by this run, and
  `docs/requirements.yaml` is byte-identical to `main` on this branch.

follow_ups:
  - >
    `mix letflow.lint_handoffs` is built but wired into no gate --
    `HANDOFF_PROTOCOL.md` only says agents *may* run it, and `mix.exs`
    references it nowhere. Severity MINOR. Ruled out of scope for ISS-0231 at
    the design gate (wiring it in changes what a green `letflow.check` means
    for every in-flight branch, a different blast radius from adding a check
    that is green today), but explicitly NOT dropped: ORCH to `register_task`.
  - >
    The `:deferred` bucket is green forever, with no expiry. R3 accepts any
    non-empty rationale by design, so a requirement can sit deferred
    indefinitely while the gate reports PASS and prints the same roster for
    months -- an idle pipeline again, with a green gate. Raised by REVIEWER as
    a residual gap rather than a defect in this detector; it is a different
    detector (a staleness/expiry rule, probably keyed on whether the
    requirement's stage has become active). ORCH to `register_task` if wanted.
