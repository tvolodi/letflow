id: ISS-0231
title: >
  ISS-0221 closed on a false all-clear: 21 requirements were left UNREGISTERED
  and unclaimable, and nothing detects that class of gap
discovered_by: ORCH
discovered_in_run: ORCH-20260822-queue-loop
discovered_at: "2026-08-22T02:48:10Z"
severity: MAJOR

description: >
  ISS-0221 (WF-01 never told ORCH to register a requirement in letflow-queue)
  was resolved 2026-08-21 with a correct documentation fix -- WF-01 gained an
  explicit Step 3. But its `resolution_note` also asserted: "every requirement
  in the current `docs/requirements.yaml` (checked via a full-file scan, not a
  sample) already carries `impl_order`, so the practical backfill this filing's
  symptom described has since been completed by other work" and "No further
  action taken on that front."

  That statement was FALSE, and was false when written. Verified against the fix
  commit itself: `git show 75f553d:docs/requirements.yaml | grep -c
  '# impl_order: UNREGISTERED'` returns 21. REQ-115..135 all carried the marker
  at that exact moment and still did on `main` when this issue was filed. So
  ISS-0221 closed while its own symptom -- validated-looking requirements that
  `get_next_task` can never return -- was live in 21 places, and the note's
  all-clear is exactly what would stop a later reader from re-checking.

  ROOT CAUSE OF THE FALSE CLAIM. `docs/agents/protocols/TASK_QUEUE.md` permitted
  TWO surface forms for an unregistered requirement: "leave `impl_order` absent
  (or note `# UNREGISTERED`)". The verifying scan matched the substring
  `impl_order:` anywhere on a line. The deferral marker `# impl_order:
  UNREGISTERED` contains that substring, so all 21 unregistered entries were
  counted as registered. Measured on the 111-entry corpus: the substring scan
  returned 112 hits over 111 entries -- more hits than entries -- which is what
  "every requirement already carries impl_order" was read off. The strict
  registered-field-form count was 90.

  IMPACT. The S8/S9 frontend+mobile batch and the S4 identity-infrastructure
  batch were both invisible to the queue. The failure is silent by construction:
  no error is raised, the requirement simply never appears in `get_next_task`,
  and the only symptom is an idle pipeline. Nothing in the pipeline re-checks
  registration state, so a false all-clear about it was unfalsifiable by any
  gate. That is why it sat for a day.

  SCOPE. This issue covers the two things ISS-0221's own fix did not:
  (1) ISS-0221's resolution note is on record with a false all-clear that needs
  correcting, and (2) nothing detects this class of gap. Actually REGISTERING
  the 21 requirements is explicitly NOT in scope -- that is separate work
  (its own WF-01 batch), and `TASK_QUEUE.md` is explicit that an unregistered
  requirement carries no `impl_order` at all, "never a guessed one".

acceptance_criteria:
  - "docs/issues/ISS-0221.yaml records, in place and without rewriting history, that its all-clear was false when written, with the real count and the root cause named"
  - "a standing mechanism detects requirement-registration drift and runs as part of an existing gate rather than on request"
  - "the mechanism is not fooled by the same form-blindness that caused the original false claim, demonstrated by a mutant that reproduces it"
  - "docs/requirements.yaml is not modified and no impl_order value is invented"

affected_files:
  - docs/issues/ISS-0221.yaml
  - docs/agents/protocols/TASK_QUEUE.md
  - mix.exs
  - lib/mix/tasks/letflow.check_requirements_registration.ex

related:
