id: ISS-0257
title: >
  Wire mix letflow.lint_handoffs into a gate
discovered_by: REVIEWER
discovered_in_run: WF03-ISS0231-20260822
discovered_at: "2026-08-22T04:37:58Z"
severity: MINOR

description: >
  Raised as a follow-up during WF03-ISS0231-20260822 (merge d16f3c8).
  `mix letflow.lint_handoffs` is built but wired into no gate:
  `HANDOFF_PROTOCOL.md` only says agents MAY run it, and `mix.exs` references
  it nowhere. Severity MINOR, deliberately ruled out of scope for ISS-0231
  itself since wiring it in changes what a green `mix letflow.check` means for
  every in-flight branch -- a different blast radius from ISS-0231's own
  detector, which was green on landing.

  Established whether it should gate `mix letflow.check` (hard fail) or run as
  a separate, non-gating report, and implemented that placement deliberately --
  did not default to hard-gating without checking what currently in-flight
  branches would break.

affected_files:
  - mix.exs
  - docs/agents/shared/HANDOFF_PROTOCOL.md

related: []

