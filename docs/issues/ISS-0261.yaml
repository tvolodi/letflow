status: resolved
resolved_in_run: WF03-ISS0261-20260822
resolved_at: "2026-08-22T07:30:00Z"
resolution_note: >
  Built `scripts/mutate.py`, a tracked, general-purpose mutation-testing
  helper, plus `scripts/README.md` documenting it as the index entry for
  `scripts/`.

  LANGUAGE CHOICE: Python, stdlib only -- kept, not ported to a mix task
  or shell script, for the same reason the original was Python: this
  project's dev hosts are Windows (docs/anti-patterns.md logs more than
  one Windows `sed -i`/quoting/line-ending hazard), a mix task cannot run
  against code that is expected to be broken by the very mutation it is
  testing (the unmutated project must compile first), and a raw shell
  one-liner cannot portably enforce "exactly one occurrence" or handle
  UTF-8/newlines correctly on Windows the way stdlib Python does.

  INTERFACE (AC1, AC2, AC4): `python scripts/mutate.py <file> <old> <new>
  -- <test-command...>`. Preserves the original's single-occurrence
  guard verbatim in spirit (refuses to write unless <old> occurs exactly
  once in <file>, exit 2, nothing written) and generalises it: applies
  the mutant, runs <test-command>, reports MUTANT_KILLED (exit 0,
  nonzero test exit) or MUTANT_SURVIVED (exit 1, zero test exit), then
  ALWAYS reverts the file to its exact original bytes (try/finally, so a
  crashed or interrupted test command still reverts) and verifies the
  revert byte-identical before exiting. Full usage/exit-codes/mutant-
  taxonomy documented in the script's own header docstring plus
  scripts/README.md's `mutate.py` section (worked example, origin note,
  and guidance on when to still prefer the throwaway-git-worktree
  isolation technique for a multi-mutant pass).

  MUTANT TAXONOMY (matches this project's own WF-03 precedent, not
  invented fresh): a mutant is a single-occurrence substitution --
  operator swap, comparison flip, constant perturbation, or deletion
  (<new> = '') -- hand-chosen by the calling agent to target a specific
  trap the fix under test exists to catch, per WF-03's own "mutants must
  target the specific traps the fix exists to handle" rule. Matches the
  MS/MV-numbered mutant style WF03-ISS0258-20260822 itself used.

  REAL DEMONSTRATION (AC3), not synthetic: reproduced
  WF03-ISS0258-20260822's own MS3 mutant against
  lib/mix/tasks/letflow.check_deferral_staleness.ex --
  `@active_statuses [:done, :in_progress, :blocked]` ->
  `@active_statuses [:in_progress, :blocked]`. Baseline
  `mix test test/mix/tasks/letflow_check_deferral_staleness_test.exs`:
  57 passed. Mutated run: 43/57 passed, 14 failed -- the exact same
  14-test red set WF03-ISS0258-20260822 recorded by hand for this mutant
  (that run's suite had 55 tests at the time, 41/55 passed, 14 red; the
  suite has since grown to 57 tests by an unrelated later change, still
  14 red). `scripts/mutate.py` reported MUTANT_KILLED, exit 0. Revert
  verified byte-identical; `git status --porcelain lib/ test/` empty
  both before and after; suite re-ran 57/57 green post-revert with no
  manual cleanup. The single-occurrence guard was also demonstrated
  directly: a 0-occurrence target string refuses with exit 2, writes
  nothing (`git status --porcelain lib/` empty).

  DOCUMENTATION (AC4): full header docstring in scripts/mutate.py
  (usage, exit codes, output format, guarantees, mutant taxonomy, why
  Python) plus scripts/README.md's dedicated section (worked example
  transcript, origin note pointing back to this issue and
  WF03-ISS0258-20260822, guidance on when to still use the throwaway-
  worktree technique instead).

  SCOPE (AC5): scripts/mutate.py plus scripts/README.md only -- no
  changes to any lib/, test/, or mix.exs file; no attempt at an
  AST-level mutation framework, automatic mutant generation, or
  operator-coverage matrix, deliberately (documented in the script's own
  header as an explicit non-goal).

  SECURITY-REVIEWER: OUT OF SCOPE, stated explicitly rather than skipped
  -- a Python helper script under scripts/, not a tenant-data path, no
  HTTP surface, no migration, no secret.

  REVIEWER: see handoff at handoffs/WF03-ISS0261-20260822/ for the full
  verdict.
