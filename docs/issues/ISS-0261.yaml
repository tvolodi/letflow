id: ISS-0261
title: >
  No tracked, general-purpose mutation-testing helper -- WF-03 runs keep
  reinventing/deleting a throwaway single-occurrence mutator ad hoc
discovered_by: TEST-DESIGN-VALIDATOR
discovered_in_run: WF03-ISS0258-20260822
discovered_at: "2026-08-22T06:35:00Z"
severity: MINOR

description: >
  Follow-up from ISS-0258 (merge 836a25b). WF-03's own regression-test
  procedure (docs/agents/workflows/WF-03_issue_resolving.md, "When the
  pre-fix failure is 'the code under test does not exist'") requires
  mutation testing whenever a fix ADDS a module, since a fail-then-pass
  test against a nonexistent module proves nothing about whether the
  suite discriminates a correct implementation from a wrong one.
  WF03-ISS0258-20260822's TEST-DESIGN-VALIDATOR wrote a throwaway
  `tdv_mutate.py` to do this against
  lib/mix/tasks/letflow.check_deferral_staleness.ex -- a single-
  occurrence-enforcing string replacer (refuses to write unless the
  target string occurs exactly once in the file, so a mis-typed or
  drifted mutant fails loudly rather than silently no-op'ing) -- then
  deleted it per its own handoff
  (handoffs/WF03-ISS0258-20260822/step-04b-test-design-validator.md,
  section 7), correctly ruling that promoting a reusable tool was
  outside a validator's remit for that run, and recommending ORCH route
  a small follow-up to move it to scripts/ and reference it from
  WF-03's own mutant-isolation section.

  ROOT CAUSE. Not a logic defect -- the throwaway script worked
  correctly for its one run. The root cause is a MISSING ARTEFACT: every
  WF-03 run whose fix adds a module must independently reconstruct (or
  skip) the same single-occurrence-substitution machinery, with no
  shared, documented calling convention. That is real toil repeated
  across runs (this issue itself had to reconstruct the original
  script's interface from a deleted-file handoff description rather
  than from a live script), and it invites the exact failure the
  original script was built to make loud: a mutant that never actually
  landed producing a false KILLED/SURVIVED reading.

acceptance_criteria:
  - "A tracked, general-purpose mutation-testing helper exists under scripts/, usable against an arbitrary lib/ module -- not hardcoded to ISS-0258's detector"
  - "It preserves the single-occurrence guard (refuses to mutate unless the target string occurs exactly once) that made the original throwaway script trustworthy"
  - "A real demonstration exists: run against a real small module in this codebase with actual kill/survive output quoted, not a synthetic self-test"
  - "The calling convention is documented well enough (header comment or scripts/README.md) that a future TEST-DESIGNER/TEST-DESIGN-VALIDATOR can invoke it directly without re-deriving it"
  - "The change stays small and scoped to a mutation-testing helper -- not expanded into a general test-quality framework"

affected_files:
