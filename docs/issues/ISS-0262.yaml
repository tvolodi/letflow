id: ISS-0262
title: >
  letflow.lint_handoffs globs *.json only -- a run using Markdown handoffs
  passes the gate by omission, not conformance
discovered_by: ORCH
discovered_in_run: WF03-ISS0262-20260822
discovered_at: "2026-08-22T07:20:00Z"
severity: MAJOR

description: >
  `mix letflow.lint_handoffs`'s file discovery (`lib/mix/tasks/letflow.lint_handoffs.ex`'s
  private `handoff_files/0`) globbed `handoffs/**/*.json` exclusively. Any
  handoff-shaped file under `handoffs/<run_id>/` that was not named `*.json` --
  e.g. the 10 Markdown files under `handoffs/WF03-ISS0258-20260822/` -- was
  structurally invisible to every check the task runs (H1-H5, advisory), and,
  as a second-order consequence, to `check_registry_coverage/1`'s H5 disk-vs-registry
  diff as well, since that function derives `disk_run_ids` from the same file
  list: a run_id whose directory contained only non-.json files contributed
  nothing to `disk_run_ids` and so was invisible to the H5 diff in both
  directions, not merely unflagged by the per-file schema checks. Net effect:
  such a run passed `mix letflow.lint_handoffs` (and therefore `mix letflow.check`,
  which gates on it per ISS-0257) by omission -- the gate never saw the
  non-conforming files to fail on them -- not by actually conforming to
  HANDOFF_PROTOCOL.md's "Handoff files ... stay JSON" rule.

acceptance_criteria:
  - "handoff_files/0's discovery is broadened beyond the hardcoded **/*.json glob to see every handoff-shaped file under handoffs/<run_id>/"
  - "A non-.json handoff-shaped file is reported as a distinct hard violation (not silently ignored, and not conflated with the existing JSON-parse-failure violation)"
  - "The 10 pre-existing Markdown files under handoffs/WF03-ISS0258-20260822/ are given an explicit, individually-named disposition (grandfathered or converted), not left ambiguous"
  - "A regression test proves the fix: fails against the pre-fix glob, passes against the post-fix discovery"

affected_files:
  - lib/mix/tasks/letflow.lint_handoffs.ex
  - test/mix/tasks/letflow.lint_handoffs_test.exs
  - lib/letflow/design/iss0262-lint-handoffs-non-json-discovery.md
  - test/specs/ISS-0262.md
  - test/fixtures/lint_handoffs/h6/step-01-fixture-non-json.md

