resolution_note: >
  ROOT CAUSE (confirmed by direct reproduction, see
  handoffs/WF03-ISS0262-20260822/step-01-issue-fixer.json): `handoff_files/0` at
  lib/mix/tasks/letflow.lint_handoffs.ex (pre-fix lines 186-191) called
  `Path.wildcard(Path.join(@handoffs_dir, "**/*.json"))` as the sole file-discovery
  mechanism for the entire task -- every downstream check (H1-H5, advisory) operates
  only over that list, so a non-.json file was never read, never passed to
  Jason.decode, and never appeared in any output branch. Reproduced live on this
  branch pre-fix: `mix letflow.lint_handoffs` reported "OK -- 0 new violations across
  765 handoff files" with zero mentions of WF03-ISS0258-20260822 anywhere in NEW HARD
  VIOLATIONS, GRANDFATHERED, ADVISORY, or H5's missing_from_registry/missing_on_disk
  lists, despite that run_id's 10 Markdown handoff files existing on disk.

  FIX (ELIXIR-DEV, design at lib/letflow/design/iss0262-lint-handoffs-non-json-discovery.md,
  independently confirmed at each gate by CODE-DESIGN-VALIDATOR, SECURITY-REVIEWER,
  REVIEWER, TEST-DESIGN-VALIDATOR, and TEST-RUNNER): discovery broadened to see every
  handoff-shaped file under handoffs/<run_id>/step-*.*, each file classified into (1)
  .json + valid JSON -- existing H1-H5 path unchanged; (2) .json + invalid JSON --
  existing PARSE violation path unchanged; (3) non-.json extension -- new hard
  violation H6, gating like H1-H4. The 10 pre-existing WF03-ISS0258-20260822 Markdown
  files were grandfathered individually by exact path (not converted), per this
  project's established precedent (ISS-0190's path-level grandfathering, ISS-0209's
  "existing handoffs are not backfilled" ruling) and HANDOFF_PROTOCOL.md's no-blanket-backfill
  rule for already-completed, already-reviewed historical records.

  REGRESSION TEST: test/mix/tasks/letflow.lint_handoffs_test.exs (grown to cover H6
  detection, the grandfather list, and the three-way classification), backed by
  test/fixtures/lint_handoffs/h6/step-01-fixture-non-json.md as a fail-first fixture.
  TEST-RUNNER (handoffs/WF03-ISS0262-20260822/step-04c-test-runner.json) independently
  ran the full suite three times, `mix letflow.lint_handoffs` standalone (exit 0,
  "OK -- 0 new violations across 783 handoff files (16 pre-existing grandfathered,
  traced to ISS-0190)"), and `mix letflow.check` (green after a pure-formatting fix to
  the new test file) -- PASS. Two findings surfaced during that run
  (test/letflow/api/context_test.exs order-dependent flake, ISS-0069-class compiler
  warnings recurring in unrelated files) were confirmed pre-existing on main and
  unrelated to this diff; they are explicitly out of scope for this closure and are
  left for ORCH to file as separate issues, per this run's own Step 5 dispatch.
