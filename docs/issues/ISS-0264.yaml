resolution_note: >
  Updated `test/mix/tasks/letflow_check_deferral_staleness_test.exs`'s
  `T-LIVE-ACTIVITY` test literal to the current true values
  (`active == ["S0","S1","S2","S3","S4","S8","S9"]`, `inactive == []`),
  extended its "Design OQ-5" comment with this run's context, per
  CODE-DESIGNER's design (`lib/letflow/design/iss0264-deferral-staleness-test-literal-update.md`,
  CODE-DESIGN-VALIDATOR PASS after one rework round). `lib/mix/tasks/letflow.check_deferral_staleness.ex`
  and `docs/requirements.yaml` are both unchanged -- this was a test-data-only
  fix. REVIEWER PASS (scope confirmed limited to the one test file plus the
  design doc; SECURITY-REVIEWER out of scope, no tenant-data path).
  TEST-DESIGNER/TEST-DESIGN-VALIDATOR confirmed this existing test IS the
  fail-then-pass regression proof (no new test needed -- the bug was the
  test's own assertion; pre-fix failure independently reproduced twice, once
  by ISSUE-FIXER directly and once by TEST-DESIGN-VALIDATOR via a disposable
  worktree against `main`, both showing 56/57 with this test the sole
  failure; post-fix `mix test test/mix/tasks/letflow_check_deferral_staleness_test.exs`
  -> 57/57 passed, confirmed independently three times across this run).
  Full suite (TEST-RUNNER, `scripts/test_parallel.sh` TEST_PARALLEL_N=4):
  1360/1718 passed, 358 failures, all attributed structurally to shared-host
  contention (~15 concurrent sibling worktrees tonight) -- not this branch:
  `git diff --name-only main...HEAD` shows only the two files above changed;
  357 of the 358 failures were `UndefinedFunctionError`/module-unavailable
  errors against modules not in this branch's diff, inconsistent per
  partition (a real missing symbol fails identically everywhere), and
  directly reproduced as a false positive by re-running one such file
  (`registry_test.exs`, 93 of the 357) standalone: 28/28 passed, 0 failures;
  the remaining 1 failure and 43 `too_many_connections` errors landed in the
  same partition, consistent with the documented ISS-0110 pool-exhaustion
  pattern under concurrent `mix test` sessions. The changed test file itself
  appears in no failure listing anywhere.
