id: ISS-0277
title: >
  Three GitHub issues (#360, #366, #367) closed COMPLETED despite their own
  closing comment saying the fix was not shipped
discovered_by: ORCH (2026-08-22 GitHub/local-docs/queue reconciliation audit)
discovered_in_run: reconciliation-audit-20260822
discovered_at: 2026-08-22T14:48:50Z
severity: MAJOR
description: >
  GH#360 (ISS-0108, sandbox-mode-leak-related identity test flake), GH#366
  (ISS-0112, provisioned_tenant fixture duplication), and GH#367 (ISS-0113,
  Sandbox.mode(:auto) global leak) were each closed with GitHub stateReason
  COMPLETED, but each one's own last comment explicitly says the opposite:
  "left open, not closed", "left open", "leaving this issue open -- the
  defect is real". All three read as legitimate investigation-only or
  reverted-fix runs that correctly declined to ship an unsafe change.
affected_files:
  - docs/agents/protocols/TASK_QUEUE.md
