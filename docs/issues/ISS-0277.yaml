  - docs/issues/ISS-0112.yaml
  - docs/issues/ISS-0113.yaml
github_issue: 548
status: resolved
resolved_in_run: WF03-ISS0277-20260822
resolved_at: 2026-08-22T17:20:00Z
resolution_note: >
  Root cause: a WF-03 closeout mistake, not a queue/GitHub auto-close
  mechanism. release_lock(status: "done") was called by ORCH for all three
  runs because each run's Step Final gate PASSed cleanly (diagnosis
  produced, or an attempted fix reverted with recorded test evidence, no
  crash/escalation) -- but "done" was read as "the run finished" rather
  than "the issue's defect is resolved". docs/agents/protocols/
  TASK_QUEUE.md already documents that release_lock(status: "done")
  best-effort-closes the linked GitHub Issue unconditionally, so all three
  GitHub mirrors closed despite their own PR bodies (#436, #430/b17cd91,
  #428) explicitly saying the work was investigation-only and the issue
  should stay open.

  Verified via `gh pr view` on all three PRs directly: #436's body says
  "not closing, this is a diagnosis-only update... Left open"; #430's body
  says "Progress on #366, not closing it... Status left open"; #428's body
  says "Not closing #367 -- status stays open". None used a "Closes #N"
  auto-close trailer.

  docs/issues/ISS-0108.yaml, ISS-0112.yaml, ISS-0113.yaml were checked and
  were already `status: open` -- the local records were never incorrectly
  flipped, only the GitHub-visible mirror was wrong. No local YAML content
  change needed beyond this record.

  Fix applied:
  1. GH#360, #366, #367 reopened, each with a comment citing this root
     cause and pointing back to the still-open local issue record.
  2. docs/agents/protocols/TASK_QUEUE.md's `release_lock` section (§4)
     amended with an explicit rule: `status: "done"` means the underlying
     issue/requirement is resolved, not merely that the run finished
     cleanly. A run whose own final report describes a diagnosis, a
     triage/re-scoping, or a reverted fix must be released WITHOUT a
     status (hand-back path, stays `open`) so the GitHub mirror stays open
     too. This is a protocol-doc fix, not a code change -- it prevents
     future WF-03 runs from repeating this exact closeout mistake.

  No other issues beyond these three were found exhibiting the same
  pattern in this audit; if one turns up later it should cite this record
  as the known root cause rather than re-diagnosing from scratch.
