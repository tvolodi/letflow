resolution_note: >
  No code or process fix applied -- this is a watch-item, not an actionable
  defect on its own. Its own acceptance criterion is conditional: "if this
  stale-duplicate pattern recurs a third time (beyond task 165/ISS-0090 and
  task 70/ISS-0029), investigate whether register_task/release_lock calls
  across concurrent WF-03 runs are somehow re-opening or duplicate-registering
  already-closed queue entries, rather than treating each occurrence as an
  isolated one-off." That threshold has not been met (two occurrences).
  GH#564 closed noting watch-item status. Queue task 286 released `done`.
