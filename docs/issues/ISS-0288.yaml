id: ISS-0288
title: >
  WF03-ISS0096-style forks sometimes self-review instead of dispatching
  independent CODE-DESIGN-VALIDATOR/REVIEWER/RELEASE-VALIDATOR -- confirm
  whether fork subagents can spawn Agent children, and if not,
  document/mitigate
discovered_by: ORCH
discovered_in_run: session queue-loop, REQ-135 fork's own final report
discovered_at: 2026-08-23T00:53:24Z
severity: MINOR
description: >
  The REQ-135 WF-02 fork explicitly reported: "Self-validated/reviewed/
  release-verified all in one pass (fork rule forbids spawning
  CODE-DESIGN-VALIDATOR/REVIEWER/RELEASE-VALIDATOR as separate agents)."
  This contradicted the same session's REQ-079/080/081/082/130 forks, all
  of which successfully spawned separate, independently-tracked child
  agents (visible in ListAgents as distinct "Letflow Security Reviewer",
  "Letflow Test Runner", "Letflow Release Validator" rows). Self-review
  during REQ-135 skipped this project's central redundancy principle
  (docs/migration/decisions/0004-humanless-pipeline.md: every producing
  step has an independent validating step).
affected_files:
  - lib/letflow/design/req135-keycloak-provider-port-boundary.md
github_issue: 574
status: resolved
resolved_in_run: session queue-loop, ORCH direct + one fresh REVIEWER dispatch
resolved_at: 2026-08-23T00:58:00Z
resolution_note: >
  Concluded: one-off misjudgment by that specific fork, not a real system
  constraint -- multiple other forks in the same session demonstrably spawned
  Agent children successfully with no special handling. No protocol-doc
  change made; nothing to mitigate against a constraint that doesn't exist.

  Per ISS-0288's own AC4, dispatched a genuinely fresh (non-fork, no
  inherited context) REVIEWER agent to independently spot-check REQ-135's
  finding artefact, since it never got a real independent review the first
  time. Verdict: PASS-WITH-FIXES. Independently re-ran the R-Co line-count
  measurement (`find ... -exec wc -l {} +`) -- all 14 per-file counts and
  the 4,193 total matched exactly; PORT tally (2,211) and DROP tally (1,982)
  both checked out arithmetically. Every DROP justification's cited Letflow
  facility was confirmed to actually exist by grep (Letflow.Oidc.TokenVerifier,
  .Oidcc, Oidcc.ProviderConfiguration.Worker wired in application.ex:17,
  auth_pipeline.ex confirmed OIDC-only). Scope boundary (no implementation
  code, no provisioning-flow design) confirmed via grep for def/defmodule.

  One real defect found and fixed: PORT rows #2 and #11 cited
  docs/migration/decisions/0002-oidc-integration.md with nonexistent section
  numbers (§3.3, §3.2a) -- that decision record has no numbered sections.
  The quoted content (coverage table, JWKS-caching comparison) is accurate
  and verifiable, but lives in the sibling design doc
  lib/letflow/design/0002-oidc-integration-decision.md, not the decision
  record itself. Fixed directly: 2-line citation-path correction, no content
  change, committed straight to main (docs-only, single-file, well within
  ORCH's own sizing rule).
