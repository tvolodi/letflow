id: ISS-0292
title: >
  SandboxPoolTest RT-9/RT-8 CI flake -- cleanup helpers crash uncaught on a
  real Postgres error and abort partway through orphan-schema cleanup
discovered_by: ISSUE-FIXER
discovered_in_run: WF03-ISS0292-20260823
discovered_at: "2026-08-23T08:00:00Z"
severity: MAJOR
description: >
  test/letflow/sandbox_pool_test.exs's cleanup helpers
  (query_without_holding/1, sandbox_schema_names/0,
  drop_sandbox_schemas_created_since!/1) had no rescue around Repo.query!
  inside a bare spawn_monitor, so a real Postgres :query_canceled error
  (e.g. on a CPU-throttled GitHub Actions runner) crashed the cleanup
  helper uncaught. Separately, drop_sandbox_schemas_created_since!/1's
  DROP-schema cleanup loop was a bare `for` that aborted on the first
  per-schema failure, leaving every schema after the failing one in the
  diff set un-dropped and orphaned for later tests (the RT-8/RT-9
  signature). ISSUE-FIXER's Step 1 diagnosis confirmed this as a real,
  generalizable defect independent of recurrence frequency -- a scan of
  the last 5 CI runs on main found zero recent recurrence of this exact
  signature, but the code defect stood on its own regardless.
affected_files:
  - test/letflow/sandbox_pool_test.exs
