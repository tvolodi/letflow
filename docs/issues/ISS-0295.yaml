resolution_note: >
  Root cause removed, not just masked: web/tests/e2e/helpers.ts now exports
  shared, overridable BPM_IDP_BASE_URL (default port 8082) and
  BPM_IDP_CLIENT_ID (default letflow-web) constants; all 33 e2e spec files
  were converged onto them (commit f7aec1d). Verified live post-fix: zero
  remaining matches for 8081 or bpm-platform-api under web/tests/e2e/.
  Design produced and independently validated (CODE-DESIGNER /
  CODE-DESIGN-VALIDATOR, lib/letflow/design/iss0295-e2e-keycloak-config-consolidation.md).
  SECURITY-REVIEWER and REVIEWER both PASS (test-only, non-secret config;
  no scope creep; assertion rewrites preserve original regression intent).
  New regression test web/tests/unit/iss-0295-e2e-idp-config.test.ts
  (commit 3b652a9, comment fix bb962d0) independently fail-then-pass
  verified twice by TEST-DESIGN-VALIDATOR: against pre-fix main (275e9f1)
  it failed 4/4 with 49 hardcoded literals found; against the fix branch it
  passed 4/4. TEST-RUNNER confirmed the full web/ suite green: type-check
  clean, lint clean, 184/184 unit tests passed (including the new 4),
  48/48 guards passed against a real production build, and Playwright
  discovery parsed 228 tests / 37 files with zero errors. No rework was
  needed anywhere in this run.

  Scope note: this fix covers only web/tests/e2e/'s own hardcoded IdP
  config. REQ-133 (SPA-side OIDC defaults in web/src/auth/OidcManager.ts
  and tenantConfig.ts) remains separately pending on main and was NOT
  touched by this fix -- see description above for the discrepancy this
  run caught in the issue's original premise.
