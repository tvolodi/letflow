id: ISS-0295
title: >
  web/tests/e2e/*.ts hardcode a stale Keycloak port (8081) and client_id
  (bpm-platform-api) across 33 files, with no shared constant/override
  mechanism
discovered_by: ISSUE-FIXER
discovered_in_run: WF03-ISS0295-20260823
discovered_at: 2026-08-23T00:00:00Z
severity: MINOR
description: >
  52 matches across 33 files under web/tests/e2e/ hardcoded a stale Keycloak
  IdP base URL (port 8081) and client_id (bpm-platform-api) rather than
  reading them from a single shared, overridable source. Every spec file
  independently redeclared its own copy of these values, so a real IdP
  config change (e.g. moving to port 8082 / client_id letflow-web) required
  editing all 33 files individually with no override mechanism for
  environment-specific runs. Confirmed live via grep at diagnosis time (52
  matches / 33 files) before any fix was applied.

  Diagnosis-time discrepancy worth recording: the issue's originating report
  asserted that REQ-133 had already corrected the SPA's own OIDC defaults
  (web/src/auth/OidcManager.ts, tenantConfig.ts, etc.). That premise is
  FALSE — REQ-133 was still `pending` on main with no merged work at the
  time of this fix, and remains pending after it. This issue's fix is
  scoped ONLY to the e2e test suite's own hardcoded config; it does not
  touch and does not substitute for REQ-133's separate, still-open work on
  the SPA's own OIDC defaults. A future reader should not assume the OIDC
  config story is fully resolved end-to-end just because this issue is
  closed.
