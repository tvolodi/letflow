  - REQ-169  # req169_hang.wat
  - decision-0014  # OQ-5, WASM-11 correction
source: >
  handoffs/WF02-REQ170-20260828/step-final-ci-fix.json (root-cause diagnosis
  and mitigation), lib/letflow/design/req170-wasm-wallclock-timeout.md
  section 1.4/1.5/8 (original design-session finding), CI run
  https://github.com/tvolodi/letflow/actions/runs/33165402662 (the real
