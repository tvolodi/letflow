candidate_scope_for_whoever_picks_this_up: >
  (a) Move WASM NIF-heavy test files (module_registry_test.exs,
  capability_gate_test.exs, memory_guard_test.exs, resource_limits_test.exs,
  call_timeout_test.exs, plugin_handler_test.exs) to run FIRST in the test
  suite (before any hang test's leaked threads accumulate) or into their own
  isolated CI job/process, so a leaked thread from one file cannot starve
  another. (b) Have CI's mix letflow.check invoke scripts/test_parallel.sh
  instead of plain `mix test`, and confirm partitioning genuinely isolates
  this risk (each partition is presumably its own OS process/pool, though
  this was not verified in this run). (c) The deeper OQ-5 fix (an
  operator-configurable cap on concurrently in-flight WASM invocations) per
  design req170's own section 8 filing -- this issue's CI reproduction is
  additional evidence for that filing, not a substitute for it.
resolution: >
  PR #691's mitigation (7 remaining genuine hangs) was insufficient: PR #692
  (REQ-171) reproduced the same mechanism WORSE -- one of its two duplicate
  CI runs took 1897.8s (vs. the other's 353s) and cascade-failed 18 tests,
  every one of them a real `wasmex` NIF call in `host_api_test.exs` that hit
  ExUnit's own 60000ms per-test timeout waiting on an already-exhausted
  native pool, because `call_timeout_test.exs` (alphabetically first among
  the WASM test files) still leaked 2 threads before `host_api_test.exs`
  ever ran, and this runner's pool was apparently that small.

  Root-fixed by ORCH directly (not another footprint reduction, which had
  already proven insufficient once): tagged every genuinely, permanently
  hanging test (2 in call_timeout_test.exs, 4 in plugin_handler_test.exs --
  6 total, one of which dispatches 2 live hangs) with `@tag :wasm_hang`.
  `test/test_helper.exs` now excludes `:wasm_hang` by default (mirroring the
  existing `:keycloak` exclusion precedent, REQ-134), so plain `mix test`,
  `mix test <path>`, and every `scripts/test_parallel.sh` partition never
  touch a genuine hang at all -- zero leaks, structurally, not merely fewer
  of them. `lib/mix/tasks/letflow.check.test.ex` (the task CI's own `mix
  letflow.check` alias runs) now runs a SECOND subprocess after the main
  suite passes, `mix test --only wasm_hang`, in its own fresh BEAM node --
  the tests that must genuinely hang to prove REQ-170's own honest finding
  still run, in full, every CI run, but their permanent leaks die with that
  short-lived process instead of touching any other test's pool. Both
  subprocess exit codes gate the task's own exit code.

  Recurrence note (2026-09-01, WF03-ISS0392-20260901 Step Final, PR #780):
  the isolated `mix test --only wasm_hang` subprocess itself timed out --
  `host_api_write_test.exs:449` ("write_variable: discard on every failure
  arm... REQ-170's wall-clock timeout abandons the staged write") hit
  ExUnit's 60000ms per-test timeout, `Result: 6/7 passed, 3005 excluded`,
  on CI run 33509028083. Structurally cleared as NOT attributable to
  WF03-ISS0392-20260901's branch: that branch's diff touches only
  `lib/letflow/engine.ex` and ISS-0392 test/doc/handoff files (confirmed via
  `git diff origin/main...HEAD --stat`), never any WASM/plugin_handler code;
  and the SAME commit's sibling duplicate CI run (33508992924, triggered by
  the same push) ran the identical isolated `:wasm_hang` suite and passed
  clean in ~24s (`Result: 7 passed, 3005 excluded`). Confirms this is the
  same runner-variance-dependent pool-exhaustion mechanism this issue
  already documents, now manifesting inside the isolation subprocess this
  issue's own fix introduced rather than cascading into the main suite --
  the residual risk this record already flagged (line "nothing prevents a
  future WASM test file... from tipping the same pool into exhaustion
  again") was not eliminated, only moved. Did not block PR #780's merge per
  GIT_MERGE.md's precondition ("green means no failure attributable to this
  branch") and core-directives.md's structural-attribution rule. Left
  `status: resolved` as-is since PR #691's specific defect remains fixed;
  the deeper OQ-5 cap (`candidate_scope_for_whoever_picks_this_up` (c)
  above) is still the only structural fix for this recurrence class.

  Verified locally end-to-end before push: main suite (wasm_hang excluded)
  -- `Result: 113 passed, 6 excluded` in 0.6s; isolated `--only wasm_hang`
  run -- `Result: 6 passed, 2407 excluded` in 10.4s; full `mix
  letflow.check.test` task run end-to-end (matching CI's own invocation
  exactly) -- both subprocesses passed, overall exit 0. `mix format
  --check-formatted` and `mix letflow.lint_handoffs` both clean.

  This is a genuine structural fix, not a probabilistic mitigation: the
  main suite now has zero live-hang tests in it, by construction, so no
  runner size or test-file ordering can reintroduce this cascade. The
  isolated subprocess's own tests could in principle still contend with
  each other (2 leaks within that one short-lived process), but that
  process runs nothing else and exits immediately after, so there is
  nothing left for those leaks to starve.

  Recurrence note (2026-09-01, WF03-ISS0400-20260901 Step Final, PR #786):
  the isolated `mix test --only wasm_hang` subprocess timed out again, this
  time worse -- 3 of 7 tests failed on CI run 33542941158 (initial run:
  `Result: 5/7 passed`, `host_api_write_test.exs:449` timed out plus one
  other; rerun via `gh run rerun --failed`: `Result: 4/7 passed`,
  `plugin_handler_test.exs:457`'s own AC4 timing assertion also failed
  outright, `long_elapsed_ms: 30003` against an expected `< 15000`, on top
  of the same two ExUnit 60000ms timeouts). Structurally cleared as NOT
  attributable to WF03-ISS0400-20260901's branch: that branch's diff
  touches only `lib/letflow/engine/transition.ex` and ISS-0400
  test/doc/handoff files (confirmed via `git diff main...HEAD --stat`),
  never any WASM/plugin_handler code; and the SAME commit's sibling
  duplicate CI run (33542914516) ran the identical isolated `:wasm_hang`
  suite and passed clean (`Result: 7 passed, 3037 excluded`) in ~22s. Same
  runner-variance-dependent pool-exhaustion mechanism this issue already
  documents twice, now manifesting worse (3 failures instead of 1, plus a
  new failure mode -- an outright timing-threshold assertion failure, not
  only ExUnit timeouts) but in the same isolated subprocess, still fully
  contained (main suite unaffected, 3034/3034 clean on both CI runs). Did
  not block PR #786's merge per GIT_MERGE.md's precondition and
  core-directives.md's structural-attribution rule. Left `status: resolved`
  as-is per the same reasoning as the prior recurrence note; three
  recurrences now on record (PR #691 original, PR #780/ISS-0392, PR
  #786/ISS-0400) all pointing at the same unresolved residual risk --
  the deeper OQ-5 cap (`candidate_scope_for_whoever_picks_this_up` (c)
  above) is increasingly the load-bearing fix, not an optional follow-up.
