status: open
tags:
  - idiom-gap
description: >
  lib/letflow/dlq/entry.ex's insert_changeset/2 docstring reads: "`status`,
  `retry_count`, `retry_history`, `tenant_id`, and `created_at` are
  deliberately not castable here -- `Letflow.Dlq.enqueue/2` sets all five
  itself, never from caller-supplied `attrs`." The actual cast/3 call lists
  all five fields as castable. Today this is harmless: `Letflow.Dlq.enqueue/2`
  (the sole caller) pre-sanitizes `attrs` via `Map.take/2` before ever
  reaching the changeset, then `Map.merge/2`s its own trusted
  tenant_id/status/retry_count/retry_history/created_at values on top -- no
  caller-supplied value for any of these five fields can currently reach
  `insert_changeset/2`.

  This is a real deviation from an established pattern in this exact
  codebase, not a hypothetical concern: lib/letflow/definitions/
  solution_pack_install.ex's insert_changeset/2 makes the identical claim
  ("`status` and `uninstalled_at` are deliberately NOT castable here") and
  its cast list genuinely excludes them; lib/letflow/definitions/
  promotion_review.ex's insert_changeset/2 does the same for `status`,
  `approved_by`, `approved_at`, `superseded_by`, `row_version`. Both rely on
  the changeset itself enforcing the claim, not caller discipline.
  Letflow.Dlq.Entry is the outlier: its changeset is not actually the
  safety boundary its own docstring describes -- caller discipline
  (enqueue/2's Map.take/2) is doing the enforcement instead.

  Fixing this correctly is not a one-line deletion: `status` and
  `retry_count`/`retry_history` have schema-level defaults
  (`:pending`/`0`/`[]`) so removing them from the cast list is safe and
  free (Ecto.Schema's own struct defaults apply). `tenant_id` and
  `created_at` have NO schema-level default, so removing them from the cast
  list without another mechanism (e.g. `put_change/3` on the changeset
  inside `insert_changeset/2`, reading them out of `attrs` explicitly)
  would make every `enqueue/2` call fail `validate_required/2` for
  `tenant_id` and `created_at`. This is real, small implementation work
  (~10-15 line change to `insert_changeset/2`), appropriately routed to
  ELIXIR-DEV rather than hand-waved as a trivial fix.
