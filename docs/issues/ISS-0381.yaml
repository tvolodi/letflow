candidate_scope_for_whoever_picks_this_up: >
  In `insert_changeset/2`: narrow the `cast/3` list to drop `:status`,
  `:retry_count`, `:retry_history` (their schema defaults already produce
  the correct values once excluded) and replace `:tenant_id`/`:created_at`'s
  cast-list membership with explicit `put_change/3` calls reading those two
  keys out of `attrs` (they remain required inputs from `enqueue/2`'s own
  merged `insert_attrs` map -- only the mechanism changes from cast to
  put_change, not the caller contract). Add a changeset-level test
  confirming a raw/unfiltered `attrs` map with a caller-supplied `tenant_id`
  cannot override the value passed via `put_change/3`, to lock in the fix
  against regression if a future caller ever calls `insert_changeset/2`
  directly with unsanitized attrs.
