id: ISS-0381
title: >
  Letflow.Dlq.Entry.insert_changeset/2's cast list contradicts its own
  docstring -- tenant_id/status/retry_count/retry_history/created_at are all
  castable despite the docstring calling them "deliberately not castable"
discovered_by: REVIEWER
discovered_in_run: WF02-REQ176-20260829
