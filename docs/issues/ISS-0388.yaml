description: >
  REQ-205 (S7 scenario-harness foundation, done WF02-REQ205-20260831) shipped
  `Letflow.Simulation.Seed` and `Letflow.Simulation.Runner` against 12
  company/org/process YAML fixture files under
  `test/fixtures/simulation/{swiftroute,vortex,meridian}/`. Those 12 files
  are SYNTHETIC, self-authored data -- honestly disclosed in each file's own
  header comment -- not a byte-for-byte port of R-Co's real
  `tests/simulation/companies/{swiftroute,vortex,meridian}/` tree
  (`company.yaml`, `org_structure.yaml`, `process_*.yaml`, 12 files total).

  ELIXIR-DEV confirmed R-Co's source tree is genuinely unreachable from the
  Linux sandbox this run executed in: no `/mnt/c` or Windows-host mount, a
  filesystem-wide `find` for swiftroute/vortex/meridian content returns
  nothing, and no prior handoff/session artifact in this repo carries the
  real content. RELEASE-VALIDATOR independently re-confirmed the same
  unreachability at Step 5 (own fresh search, same conclusion, not just
  trusted). This sandbox does have outbound network reachability, but that is
  irrelevant -- there is no address/credential anywhere in this repo for the
  specific Windows host at `c:\Users\tvolo\dev\ai-dala\R-Co\`.

  This is a routing gap, not permanently lost data: REQ-205's own
  `docs/requirements.yaml` entry states the source material was "confirmed
  present in R-Co ... this session" at requirement-drafting time, meaning
  some session/host DID have R-Co filesystem access when REQ-ANALYST wrote
  REQ-205 (it cites literal file counts and `seed.py`'s exact 356-line
  count). The gap is that no session transcribed the fixture files'
  byte-for-byte *content* anywhere durable before this implementation run,
  which ran on a host without that access.

  WHY THIS BLOCKS REQ-206 (not merely a nice-to-have cleanup): REQ-206/207/208
  (S7's next three requirements) each run real R-Co scenario YAML that
  references specific `actor_id` values from the real org-structure fixtures
  (e.g. `actor-swiftroute-lena`). Those references will NOT resolve against
  the current synthetic fixtures' invented actor ids. REQ-206 cannot be
  genuinely run against real R-Co scenario content until these 12 files carry
  real, actor-id-matching data.

  SCOPE IS SMALL AND WELL-BOUNDED: only
  `test/fixtures/simulation/**/*.yaml` content changes. `Letflow.Simulation.
  Seed`/`Runner` (test/support/simulation/{seed,runner}.ex) already work
  correctly against fixture SHAPE (slug/display_name/hostname,
  people/groups with actor_id, name/version/graph) -- confirmed by both
  ELIXIR-DEV and RELEASE-VALIDATOR reading the modules directly, no
  hardcoded synthetic values found outside the fixture files themselves.
  Swapping in real content requires ZERO changes to either module.

  REQUIRES A HOST WITH R-CO ACCESS: this work cannot be done from a sandbox
  like the one that implemented REQ-205 -- it needs filesystem access to
  `c:\Users\tvolo\dev\ai-dala\R-Co\`, specifically
  `tests/simulation/companies/{swiftroute,vortex,meridian}/{company.yaml,
  org_structure.yaml,process_*.yaml}` (12 files). Whichever session/host
  picks this up should read those 12 files directly and replace the current
  synthetic content verbatim (field names/values unchanged, so actor ids
  like `actor-swiftroute-lena` stay stable references for REQ-206/207/208),
  then re-run REQ-205's existing test suite (test/letflow/simulation/,
  test/fixtures/simulation/) to confirm nothing in Seed/Runner needed to
  change.
