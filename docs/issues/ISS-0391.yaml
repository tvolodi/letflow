severity: MINOR
tags: [fixture-porting, needs-r-co-access, s7]
description: >
  REQ-206 authored 4 disclosed-synthetic SwiftRoute scenario YAMLs under
  test/fixtures/simulation/swiftroute/scenarios/ because R-Co's real
  tests/simulation/scenarios/*.yaml corpus remains genuinely unreachable
  from this sandbox -- confirmed by fresh ls/find at both the design stage
  (2 CODE-DESIGNER reworks) and implementation stage, the same conclusion
  ISS-0388 reached for the (different) fixture file set.

  This is a DIFFERENT file set from what ISS-0388 already fixed: ISS-0388
  ported test/fixtures/simulation/*/{company.yaml,org_structure.yaml,
  process_*.yaml} (company/org/process fixtures -- already real, resolved
  2026-09-01). This issue is about tests/simulation/scenarios/*.yaml (the
  actual scenario definitions -- preconditions, steps, expected outcomes),
  which is a separate R-Co source tree location and was never in ISS-0388's
  scope.

  A future session/host with real R-Co filesystem access should read
  tests/simulation/scenarios/*.yaml directly and replace the current
  synthetic scenario content verbatim under
  test/fixtures/simulation/{swiftroute,vortex,meridian}/scenarios/, then
  re-run REQ-206/207/208's test suites to confirm
  Letflow.Simulation.Runner needs zero code changes -- the same pattern
  ISS-0388 already proved for Seed/Runner against real fixture-shape data.

  REQ-207/208 (Vortex/Meridian scenarios) will hit this identical
  constraint and should reference this issue rather than each filing their
  own duplicate follow-up.
