resolution: >
  Fixed by e30873f8 ("fix(ISS-0392): skip build-time task-activation step
  when a SUB_PROCESS child completes synchronously"), implementing Revision
  2 of lib/letflow/design/iss0392-multi-task-records-collision-fix.md: a
  build-time skip predicate (skip_task_activation?, computed from
  prepared_children's already-known child_initial_state.status before
  either Ecto.Multi step is built) that omits the hop-chain's own
  {:task_records, parent_instance_id} step when a spawned SUB_PROCESS
  child is already known to complete synchronously in the same
  transaction, removing the call(1)-vs-call(2) key collision. Passed
  SECURITY-REVIEWER (INV-1/4/6/7/8) and REVIEWER (idiom/scope) gates.
  Proven by a fail-then-pass regression test in
  test/letflow/engine_sub_process_test.exs's "ISS-0392" describe block
  (independently re-verified by TEST-DESIGN-VALIDATOR), and confirmed in
  the full-suite run at 2999/2999 passed
  (test/reports/report-20260901-WF03-ISS0392-20260901.yaml).

  Distinct follow-up: docs/issues/ISS-0396.yaml (GH#776, still open)
  covers a second, still-unaddressed collision class -- 2+ SUB_PROCESS
  children spawned in the same hop chain (e.g. via a PARALLEL_GATEWAY
  split) each completing synchronously, a call(2)-vs-call(2) collision
  this fix's skip predicate does not prevent. That issue is out of scope
  for this fix and is not resolved by it.
