scoping_note: >
  ISSUE-FIXER investigated (WF03-ISS0399-20260901, 2026-09-01) and
  recommended NOT implementing a scanning pipeline yet: confirmed via
  real source read that no caller of Attachments.upload/2 exists
  anywhere in lib/letflow/ today -- REQ-212 (the route layer that would
  expose this) is still status: pending, and no router entry for
  attachments exists yet. There is currently no exposed upload path at
  all, trusted or untrusted -- even less urgent than this issue's own
  original framing assumed. No scanning/AV dependency exists in
  mix.exs, and no decision record in docs/migration/decisions/
  addresses provider choice (ClamAV, cloud-scanning, sync vs async,
  self-hosted vs vendor) -- per this project's "don't silently
  re-decide" rule, real implementation needs a new ADR-level decision
  first, not a CODE-DESIGNER pass improvising one. Real urgency trigger
  is unchanged from this issue's own text: before a route exposes
  upload to a less-trusted-than-authenticated-tenant-user caller (a
  future REQ-212 or similar should raise the ADR question explicitly
  when it lands, rather than this issue being picked up speculatively
  ahead of that). Queue task 399 released back to open (not done) --
  see handoffs/WF03-ISS0399-20260901/step-01-issue-fixer-diagnosis.json.

  RECHECKED (WF03-ISS0399-20260905, 2026-09-05): REQ-212 has since
  landed (status: done) and added the actual route surface --
  lib/letflow/routers/instances.ex's POST/GET
  /instances/:id/attachments and GET/DELETE
  /instances/:id/attachments/:attachment_id, gated by
  AttachmentsManage/AttachmentsRead permission macros and
  Letflow.Api.Context.scoped_repo_opts/1 tenant scoping on every
  handler. This closes the "no route at all" gap the 2026-09-01 check
  found, but lands at the SAME authenticated/tenant-scoped/permission-
  gated trust level this issue's own original text already treats as
  non-blocking -- not the less-trusted exposure (public-facing route,
  external integration) the real trigger condition requires. Also
  checked the webhooks subsystem as the other plausible external-
  trigger candidate: outbound-only (HMAC-signed deliver/3 to external
  endpoints), no inbound webhook-receiver route exists anywhere in
  lib/letflow/routers/, and grep confirms the only Attachments.upload
  caller is REQ-212's own authenticated route handler. Trigger
  condition still NOT met. Queue task 399 released back to open (not
  done) again -- see
  handoffs/WF03-ISS0399-20260905/step-01-issue-fixer-diagnosis.json.
resolved_in_run: WF03-ISS0399-20260907
resolved_at: "2026-09-07T21:06:38Z"
resolution_note: >
  RESOLVED (WF03-ISS0399-20260907): a real scanning pipeline was designed
  and implemented, not merely re-scoped again. Design:
  lib/letflow/design/iss0399-attachment-content-scanning.md, CODE-DESIGNER
  PASS after 2 rework rounds (fix commits 2ea264ef "correct
  attachment_scanner precedent citation to REQ-160" and e67a131e "correct
  NoServiceCaller characterization in design section 0" -- both design-accuracy
  corrections caught by CODE-DESIGN-VALIDATOR before PASS). Implementation
  (60f3614e): new Letflow.Repository.AttachmentScanner behaviour with a
  default Letflow.Repository.AttachmentScanner.SignatureHeuristic adapter
  (EICAR test-signature detection, satisfying the "no scanning dependency
  in mix.exs / no ADR for a real AV vendor yet" constraint the two prior
  ISSUE-FIXER recheck rounds correctly held the line on -- this ships a
  heuristic adapter behind a swappable behaviour, not a vendor decision);
  a new tenant-scoped scan_status column/migration on the attachments
  schema; Attachments.upload/2 now scans synchronously and rejects
  before persisting on a positive/errored scan (fail-closed);
  Attachments.get_content/2 is gated on scan_status == :clean; and
  router error-mapping (422 malicious content, 503 scanner unavailable,
  409 not-yet-clean) was added to the REQ-212 route handlers. Gated by
  SECURITY-REVIEWER PASS and REVIEWER PASS. TEST-DESIGNER added real
  regression coverage (0f92da2a: test/letflow/repository/attachments_test.exs,
  test/letflow/repository/attachment_scanner/signature_heuristic_test.exs,
  test/letflow/routers/req212_attachments_routes_test.exs) plus a test
  spec and mutation-testing addendum (9d042aef); TEST-DESIGN-VALIDATOR
  PASS after independently reproducing one of the mutation-test results
  itself rather than trusting the report. TEST-RUNNER PASS: full suite
  3447/3449 (2 failures are the known-unrelated wasm_hang flake in
  test/mix/tasks/letflow_check_test_test.exs, zero diff overlap with this
  branch). This closes the deferral this issue tracked; REQ-211 and
  REQ-212 both already carry status: done and needed no additional
  requirements.yaml change -- confirmed neither entry has an open
  follow-up-tracking field this resolution should update.
