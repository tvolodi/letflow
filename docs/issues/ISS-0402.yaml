scoping_note: >
  PROVENANCE (historical, not current decision authority):
  ISSUE-FIXER investigated (WF03-ISS0402-20260902, 2026-09-02) and
  recommended NOT implementing branch-level cancellation: ISS-0397's
  fix does genuinely close OQ-2's literal cited blocker (join_counters
  is now durably persisted), but a second, independent, already-on-
  record reason survives untouched -- docs/issues/ISS-0098 (resolved
  2026-08-22, before ISS-0397 even existed) independently verified
  against R-Co's real shipped source (src/engine/instance.zig,
  cancelInstance, EE-08) that R-Co's own reference cancellation path
  never drives per-branch events through transition/graph machinery at
  all -- it issues plain unconditional SQL UPDATEs. Letflow's
  whole-instance-only cancel_instance/3 is architectural parity with
  the reference system, not a stopgap for a missing table. No current
  route, UAT scenario, or scheduled requirement needs branch-level
  cancellation as a caller-facing feature (confirmed by grep across
  lib/letflow_web/, docs/uat/, docs/requirements.yaml). Two non-trivial
  semantic questions with no reference-implementation precedent remain
  open (how completed sibling branches should be handled; whether
  cancelling a branch that spawned a REQ-062 SUB_PROCESS child should
  cascade) -- these need a product decision, not an improvised design.
  Queue task 402 released back to open (not done) on 2026-09-02 -- see
  handoffs/WF03-ISS0402-20260902/step-01-issue-fixer-diagnosis.json.
resolution: >
  ORCH (2026-09-05): the queue task resurfaced (get_next_task, LIFO)
  after the 2026-09-02 scoping decision above was recorded but the
  task was released status-unset rather than done, since no code/doc
  fix had yet been applied. ISSUE-FIXER re-diagnosed independently
  this run (handoffs/WF03-ISS0402-20260905/step-01-issue-fixer-
  diagnosis.json) and reconfirmed the 2026-09-02 verdict against the
  current tree (join_counters persistence genuinely closed by ISS-0397,
  R-Co architectural-parity finding independently still stands, no
  caller/UAT/requirement needs branch-level cancellation today).

  The actual outstanding gap was documentation, not code:
  lib/letflow/design/req052-instance-cancellation.md's own OQ-2 entries
  (section 4/table and section 11) still read as if join-counters
  persistence were the primary/only blocker, without noting ISS-0397
  closed it or that the architectural-parity finding (already recorded
  in the design doc's own section 0, dated 2026-08-22) is the
  independent, still-standing reason. Corrected both OQ-2 references
  to state the current, accurate reasoning and cross-reference this
  issue. Docs-only, sized as two independent single-file edits (this
  file, req052-instance-cancellation.md) per ORCHESTRATOR.md Sec10,
  done directly by ORCH. GH#789 to be closed with an evidence comment;
  queue task 402 released status:done.
