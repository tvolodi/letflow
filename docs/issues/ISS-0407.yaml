description: >
  ISS-0396 (WF03-ISS0396-20260902) added an optional
  key_disambiguator :: term() | nil parameter to
  Letflow.Engine.TaskActivation.append_multi_from_existing_records/7.
  Every real caller passes an Ecto.UUID.t() (parent_token.id) or nil --
  the term() | nil spec is looser than necessary and could hide a real
  type error at a future call site. Tighten to Ecto.UUID.t() | nil.
