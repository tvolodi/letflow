id: ISS-0408
title: "TaskActivation rejects the synthetic non-UUID token ids dispatch_parallel_join/4 mints for freshly-joined branches, blocking join-to-further-work scenarios"
discovered_by: TEST-DESIGNER
discovered_in_run: WF03-ISS0396-20260902
discovered_at: "2026-09-02T04:30:00Z"
severity: MAJOR
tags: [engine, parallel-gateway, task-activation, follow-up]
description: >
  Discovered by TEST-DESIGNER while extending ISS-0396's regression
  test (WF03-ISS0396-20260902, Step 4), independently confirmed by
  TEST-DESIGN-VALIDATOR. Letflow.Engine.Transition.
  dispatch_parallel_join/4's fire_join/5 mints a synthetic non-UUID
  token id (origin_token_id <> "/" <> node.id <> "/joined") for a
  freshly-joined PARALLEL_GATEWAY branch that is not yet persisted as
  a TokenRecord. Letflow.Engine.TaskActivation.
  append_multi_from_existing_records/7's cast_token_record_id/1
  rejects any non-UUID via Ecto.UUID.cast/1, raising
  {:invalid_token_record_id, ...}.

  This means any scenario where a PARALLEL_GATEWAY join is immediately
  followed by further work requiring a new task activation (e.g.
  join -> HUMAN_TASK) currently fails -- only join -> END works today.
  ISS-0396's own shipped fix and regression test only require
  join->END and are unaffected, but this is a real, distinct
  pre-existing gap in the join-then-continue path.
affected_files:
  - lib/letflow/engine.ex
  - lib/letflow/engine/token_record.ex
  - lib/letflow/tenant_provisioning.ex
  - priv/repo/migrations/20260902000001_make_tokens_branch_id_nullable.exs
  - test/letflow/engine/schemas_test.exs
affected_files_note: >
  The original filing (written by ORCH from the bug report, before diagnosis)
  listed lib/letflow/engine/transition.ex and lib/letflow/engine/task_activation.ex
  as affected -- that was a guess based on where the symptom surfaced
  (fire_join/5 mints the synthetic id; cast_token_record_id/1 rejects it).
  Diagnosis (Step 1) traced the actual root cause one layer up: the hop-chain
  Multi construction in lib/letflow/engine.ex (build_task_activation_and_
  reconciliation_multi/4 and persist_timer_fired_advance/6) had no insert step
  to persist a real TokenRecord for a hop-chain-new join token before
  task-activation/reconciliation ran against it. Both engine.ex commits
  (542f2974, 74aba472) explicitly confirm transition.ex and task_activation.ex
  were NOT modified -- the fix left cast_token_record_id/1 and
  do_reconcile_token_records/5 byte-for-byte unchanged and instead ensured the
  token they receive is always a real, persisted record. A schema/changeset
  gap surfaced during implementation (TokenRecord.branch_id was null: false at
  the DB level though a join-merged token's branch_id is legitimately nil per
  REQ-051/REQ-044) required the additive migration and token_record.ex/
  tenant_provisioning.ex changes.
related:
