severity: MINOR
tags: [test-isolation, service-catalog, req-192, flaky]
description: >
  Discovered by ELIXIR-DEV during WF03-ISS0408-20260902 Step Final
  (git-merge, post-rebase mix test verification).

  test/letflow/service_catalog_test.exs "REQ-192 list_all/1 pagination
  correctness" fails when run as part of the full mix test suite (observed
  twice, consistently, across two separate full-suite runs post-rebase) but
  passes when run in isolation.

  Confirmed unrelated to ISS-0408's own changes: test/letflow/service_catalog_test.exs
  and lib/letflow/service_catalog.ex are byte-identical to origin/main on that
  branch -- the ISS-0408 diff never touches either file.

  Suspected cross-test isolation fragility -- possibly leftover global-scope
  service_catalog rows from another test not cleaning up, or a shared
  :global-scope fixture race. ELIXIR-DEV also noted two stray leftover
  :global-scope service_catalog rows left behind by an earlier interrupted
  mix test run in that same session, which may be a related or contributing
  factor rather than the sole cause -- needs its own diagnosis rather than
  assuming that was the only source.
