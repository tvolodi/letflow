id: ISS-0411
title: "Letflow.Engine does not dispatch SERVICE_TASK nodes -- disclosed in 3 S7 test files' moduledocs but never registered as an issue"
discovered_by: RELEASE-VALIDATOR
discovered_in_run: WF04-S7-20260902
