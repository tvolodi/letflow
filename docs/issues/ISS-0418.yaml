orch_note_20260905: >
  ORCH observation (2026-09-05, direct-append per this issue's own
  convention, no code change): PR #937 (ISS-0389, docs/scheduler/router/
  authz changes only, zero wasm-engine files touched) is the first PR in
  this session to run CI AFTER this issue's own OQ-5 mitigation (commit
  7a029591) landed on main. Both its duplicate CI runs hit the wasm_hang
  subprocess on their first attempt: one run's second attempt (after an
  unrelated first-attempt failure on ISS-0480's PackUpdateMigrationTest
  flake) also hit wasm_hang; the other run's second attempt passed
  clean. Net: 2 wasm_hang failures across 4 total attempts (2 runs x
  2 attempts each) post-fix -- 50%, matching this issue's own cited
  pre-fix baseline (3-in-6, also 50%) almost exactly. This is a single
  additional data point, not a conclusion -- consistent with the
  issue's own "accumulated ... across many runs" requirement before
  re-diagnosis is warranted, and does not by itself refute or confirm
  either the concurrent-contention or sequential-exhaustion hypothesis.
  Queue task 418 released status:blocked (not done, not a defect
  resolution -- this genuinely needs more accumulated CI history before
  the next diagnostic step is actionable in a single agent turn;
  status:blocked stops it resurfacing via get_next_task's LIFO ordering
  ahead of genuinely actionable work, matching the precedent already
  used for ISS-0399/ISS-0391 this same session).

recurrence_evidence_20260904: >
  THREE OCCURRENCES ON A SINGLE PR (#899, WF03-ISS0428-20260904), observed
  by ORCH and recorded here because frequency data is what OQ-5's cap
  proposal needs and this is the densest sample yet.

  All three ran on the same commit, on GitHub's ubuntu-latest (N=4 vCPU),
  and in EVERY case the main parallel suite passed completely --
  "combined: 3217 tests, 6 properties, 0 failures (3223/3223 passed)" --
  with the failure isolated entirely to the separate
  `mix test --only wasm_hang` subprocess:

    run 33905940608 (initial):  Result: 5/7 passed  -- GenServer.call timeouts
                                at platform_test.exs:1939 on the deliberately
                                hanging Lua script
    run 33905976557 (duplicate): PASSED clean
    run 33906933563 (later):    Result: 6/7 passed
    ORCH's own rerun of 33905940608: PASSED clean

  So on this PR the isolated subprocess failed 2 of 4 attempts (50%) while
  the 3223-test parallel suite passed 4 of 4. That asymmetry is the whole
  point: the flake lives specifically in the isolated wasm_hang run, not in
  the suite at large, and it is frequent enough on a 4-vCPU runner to block
  merges routinely.

  CONTEXT WORTH NOTING FOR WHOEVER IMPLEMENTS OQ-5: ISS-0428 (merged
  alongside this observation) moved the main suite to the parallel runner
  but DELIBERATELY LEFT the wasm_hang and lua_wallclock_race subprocesses
  serial, precisely because they exist due to contention sensitivity. That
  decision is unaffected by these recurrences -- the flake predates it and
  reproduces identically -- but it does mean the wasm_hang subprocess is
  now the single slowest and least reliable segment of the backend gate,
  which raises this issue's priority relative to when it was filed.

partial_fix_20260905: >
  PARTIALLY ADDRESSED by WF03-ISS0418-20260905, PR #927, merged as e5d07019.
  THIS ISSUE REMAINS OPEN -- deliberately. Queue task 418 was released back to
  `open` (no status), not `done`.

  WHAT SHIPPED: Letflow.Engine.Wasm.InvocationLease, a monitor-backed counting
  semaphore (auto-releases if the holder dies, closing the brutal-kill leak class
  that ruled out reusing Letflow.Admission unmodified; fails OPEN on its own
  crash, the correct direction for an availability gate). Plus test-side wiring
  across three call shapes, reducing the :wasm_hang suite from 8 slot-consuming
  dispatches to 6 with zero coverage lost. Six unit tests, proven non-vacuous by
  two deliberate mutations.

  WHAT IS VERIFIED: the concurrent-contention race this issue's own recurrence
  log documents is closed by construction (design section 6.3, independently
  gate-verified). The footprint reduction is real and gate-verified.

  WHAT IS NOT FIXED, and why this issue stays open:
    1. PRODUCTION WASM DISPATCH IS STILL UNCAPPED. It does not call this module
       at all. The multi-tenant availability hazard this issue is really about --
       one tenant's hanging plugins permanently leaking uncancellable native
       threads from a node-global pool shared by every tenant -- is UNCHANGED in
       production. Only the test path is capped. Closing the follow-up
       dispatch-integration work (design OQ-C) is what would actually address it.
    2. THE CI FLAKE IS NOT DEMONSTRABLY FIXED. Post-implementation CI on the
       merging PR itself showed the wasm_hang subprocess still failing (4/5, AC2
       timing out at 180s). Across that PR: 4 passes / 2 failures in 6 attempts,
       against a measured pre-change baseline of 3 failures in 6. 50% -> 33% on
       six samples is inside noise and is NOT claimed as improvement.
    3. THE SEQUENTIAL-EXHAUSTION HYPOTHESIS IS NOT REFUTED, and gained weak
       corroboration. The design gate raised it as a BLOCKER (8 permanent leaks
       cannot fit a ~4-slot CI pool regardless of serialization); ORCH overrode
       it on the grounds that the strict model predicts DETERMINISTIC failure
       while real CI showed probabilistic results. That override stands as
       reasoning, but the post-merge failure landed on AC2 -- the ONLY test that
       dispatches twice -- which is exactly where sequential slot pressure would
       surface first.

  WHAT WOULD SETTLE IT: accumulated wasm_hang outcomes on main across many runs.
  Per design section 10's own falsifiable prediction, if the failure rate does not
  improve materially against the 3-in-6 baseline, the concurrent-contention
  diagnosis is wrong as the DOMINANT mechanism and this issue needs re-diagnosis,
  with sequential exhaustion as the leading alternative. Whoever picks this up
  next should gather that history FIRST rather than assuming either the fix
  worked or that more reduction is the answer.

