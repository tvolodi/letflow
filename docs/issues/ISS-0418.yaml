severity: MAJOR
tags: [ci, flake, wasm, s6]
description: >
  ISS-0352 (test/letflow/engine/wasm/*_test.exs,
  lib/mix/tasks/letflow.check.test.ex) documents SIX independent recurrences
  (PR #691, #780/ISS-0392, #786/ISS-0400, #790/ISS-0401, #795/ISS-0406,
  #810/ISS-0404) of the same wasmex native-thread-pool exhaustion mechanism
  inside the isolated `mix test --only wasm_hang` CI subprocess -- always
  contained to that subprocess (main suite always green), but chronically
  blocking merges via ExUnit 60-180s timeouts under runner contention.
  ISS-0352's own `resolution:` field already states: the deeper OQ-5 fix
  (an operator-configurable cap on concurrently in-flight WASM invocations,
  per lib/letflow/design/req170-wasm-wallclock-timeout.md section 8 and
  decision 0014) is the only structural fix for this recurrence class and
  is increasingly load-bearing, not an optional follow-up, after
  four-plus recurrences documented at filing time (now six).
  This issue is exactly that follow-up: design and implement the
  concurrency cap so the isolated wasm_hang subprocess (and/or the
  underlying wasmex invocation path generally) cannot exhaust the shared
  Tokio native worker pool regardless of CI runner size or concurrent-
  session contention.
  Raised to MAJOR (from ISS-0406's MINOR) because this is no longer a
  single-incident flake report -- it is the sixth recurrence of a known,
  already-diagnosed, already-load-bearing-per-its-own-issue-record defect
  whose fix has been deferred six times running.
recurrence_2026_09_03: >
  ANOTHER RECURRENCE, observed live 2026-09-03T20:36:26Z by ORCH during
  WF03-ISS0440-20260903's Step Final, on PR #866's backend gate re-run
  (GitHub Actions run 33800044829). Recorded here rather than filed as a new
  issue, since this is the exact class this issue already owns.

  SHAPE: the MAIN suite passed clean in that same run -- "Result: 3192 passed
  (6 properties, 3186 tests), 21 excluded", 0 failures. The failure was in the
  ISOLATED `mix test --only wasm_hang` subprocess stage that runs afterwards:
  "Result: 6/7 passed" / "Failed: 1 test", i.e. exactly the isolated-subprocess
  surface this issue is named for, not the ordinary suite.

  FAILING TEST: test/letflow/engine/wasm/host_api_write_test.exs:460 --
  "write_variable: discard on every failure arm ... REQ-170's wall-clock
  timeout abandons the staged write". Failure mode was
  ** (ExUnit.TimeoutError) test timed out after 180000ms, stack ending in
  :proc_lib.sync_start/2 at `start_instance("req172_write_then_hang.wat",
  ["var:write"])` -- i.e. the instance never came up within 180s, the
  concurrent-WASM-invocation starvation this issue's OQ-5 cap exists to fix.
  Not an assertion failure.

  ATTRIBUTION CONTEXT worth keeping: PR #866 touches only
  lib/mix/tasks/letflow.lint_handoffs.ex, its test, and a design doc -- no WASM
  code whatsoever. Across three CI runs of that same tree the gate failed three
  times on THREE DIFFERENT tests in three different documented flake classes
  (executor_test.exs:625 :lua_wallclock_race/ISS-0426; then
  service_task_dispatcher_test.exs:1113 on_exit teardown race, filed as
  ISS-0446; then this one), never twice on the same test, while the identical
  tree passed 3192/3192 locally on an exclusive database. That pattern is
  itself evidence for this issue's premise: the backend gate is currently
  flaky enough that an unrelated branch expects roughly a coin-flip per run,
  which is precisely what trains agents to merge past red -- see ISS-0441.
  RECURRENCE, 2026-09-03, PR #864 (ADHOC-ADR0017-20260903), two more hits
  taking the count to nine-plus. Both CI backend-gate runs on commit 35582316
  passed the MAIN suite clean ("Result: 3192 passed (6 properties, 3186
  tests), 21 excluded") and then failed the isolated `mix test --only
  wasm_hang` stage 6/7 -- each on a DIFFERENT test, neither of them the one
  main failed on 40 minutes earlier:
    - run 33807483194 job 100821298855: plugin_handler_test.exs:355
      "REQ-170 AC1: configured timeout_ms bounds the caller's wait" --
      "expected the call to be bounded by the configured 500ms timeout_ms,
      not the outer 30_000ms default; took 30001ms".
    - run 33807487838 job 100821314037: call_timeout_test.exs:78 "AC2:
      wasmex's documented interrupt-and-keep-Store claim" -- ExUnit.TimeoutError
      after 180000ms, hung inside Wasmex.start_link/1 (proc_lib.sync_start/2),
      i.e. it never even reached the call under test.
    - main's own run 33803517930 (commit 72aeb342, unrelated) failed the same
      stage on host_api_write_test.exs -- a third distinct test.
  Three consecutive distinct failures across three runs of three different
  commits. PR #864's diff is docs plus seven test-teardown fixes and touches
  no lib/ file and no wasm test at all, so it cannot be causal. Merged past
  the red gate on that basis, same judgement call as PR #848 and for the same
  documented reason -- which is exactly the reflex ISS-0441 warns about.
  Notably the call_timeout_test hit is a NEW shape: previous recurrences
  failed an assertion inside a running test, this one blocked in
  Wasmex.start_link before any call, which points harder at native
  thread-pool/instantiation contention (ISS-0352's premise) than at any
  individual test's timing tolerance.
