source: >
  User-initiated investigation during ISS-0404/ISS-0418 work, 2026-09-02.
  Confirmed via reading .github/workflows/ci.yml and
  deps/rustler/lib/rustler/compiler.ex directly (compile_crate/3's
  `cd: config.path` call site).
