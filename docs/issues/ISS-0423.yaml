id: ISS-0423
title: >
  ExUnit suite runs 99.2% serially (1790s of 1805s) -- a ~30 min gate on every
  requirement is a pipeline throughput ceiling
discovered_by: ORCH
discovered_in_run: ORCH-adhoc-20260902
discovered_at: "2026-09-02T17:38:55Z"
severity: MAJOR
description: >
  MEASURED, not estimated. Full mix test on main (letflow-3,
  MIX_TEST_PARTITION=3, 2026-09-02), exit 0: "Finished in 1805.1 seconds
  (14.8s async, 1790.2s sync)" / "Result: 3060 passed (6 properties, 3054
  tests), 10 excluded". 99.2% of wall-clock is the synchronous portion. On a
  16-core machine the suite effectively uses about one core.

  ROOT CAUSE (structural, not incidental): Letflow state lives in per-tenant
  Postgres schemas, not in processes, so tests cannot set async: true without
  contending on shared schemas and the engine's own FOR UPDATE locks. The
  test-support tenant fixture provisions and drops a REAL schema per test, and
  each provisioning replays the full tenant-scoped migration set
  (Letflow.SandboxPool moduledoc measures this at 411ms at its very fastest,
  for 31 migrations; priv/repo/migrations/ now holds 69 files).

  WHY IT MATTERS: mix letflow.check runs the full suite and is the gate on
  EVERY requirement and issue run in a humanless pipeline. A ~30 min serial
  gate bounds how many runs per day the pipeline can complete, and it grows
  linearly with the suite. It also actively caused a defect in a review
  session: a 900s timeout on the suite killed it at exit 143 with zero output,
  producing an initially wrong "still running" report. ISS-0419's own evidence
  independently measured the same thing in CI ("Finished in 694.2 seconds
  (23.5s async, 670.7s sync)") and concluded the suite, not the wasmex NIF
  build, accounts for ~694s of a ~720s CI job -- already the dominant cost in
  CI too, confirmed twice from different directions.

  Suggested direction, NOT prescribed -- CODE-DESIGNER decides scope and
  whether it is worth it: Letflow already owns Letflow.SandboxPool, a
  quota-bounded pool of pre-provisioned, migration-scaffolded schemas built
  for exactly this shape (claim/release, owner-monitored, at-most-one-DB-op-
  in-flight). Backing the test tenant fixture with pooled pre-provisioned
  schemas could allow async: true for the large share of tests that need only
  an isolated schema and touch no global table. HARD CONSTRAINT: any change
  must not raise peak concurrent DBConnection checkouts past what the test
  Repo pool can serve -- that is the exact hazard ISS-0224 fixed in the pool
  itself, and decision 0009-test-parallel-pool-sizing.md already governs this
  area and must be read first. A partial result (a subset of modules made
  async) is a legitimate outcome; so is a reasoned "not worth it" with the
  measurement recorded.

  NOTE (ORCH, at filing time 2026-09-05): since this issue's 2026-09-02
  numbers were recorded, ISS-0427 landed and changed the tenant fixture's
  default provisioning mechanism from migration replay to schema CLONE
  (Letflow.Test.TenantTemplate, test/support/tenant_template.ex) -- a
  materially different starting point than this filing describes
  (69 migrations replayed per test). ISSUE-FIXER's Step 1 diagnosis must
  re-verify the CURRENT baseline first-hand (a fresh mix test run, quoted
  verbatim) rather than trusting either this filing's or ISS-0419's numbers
  as still current, and must re-describe the fixture's actual current shape
  before any design work proceeds.
