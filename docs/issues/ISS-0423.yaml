resolution_note: >
  ROOT CAUSE CONFIRMED, THEN A REAL FIX SHIPPED AND VERIFIED FOUR TIMES
  INDEPENDENTLY -- not merely a diagnosis. ISSUE-FIXER's fresh Step 1
  measurement (this run) confirmed the reopen note's own reconciliation:
  ISS-0427/ISS-0428/ISS-0426 all landed and resolved their own levers
  (template-clone provisioning, test_parallel.sh wiring, wall-clock flake);
  ISS-0113 (Letflow.TenantFixture.provisioned_tenant!/1's global
  Sandbox.mode(Letflow.Repo, :auto) call) remained the sole confirmed
  blocker on this record's own causal chain to real async: true execution.
  Also confirmed: of the 46 real TenantFixture call sites, ZERO were
  actually async: true before this run (a prior "93 files/1.4%" figure had
  conflated moduledoc prose with real declarations) -- so "conversion" here
  means genuinely NEW async: false -> async: true flips, not un-defeating
  already-declared-but-inert files.

  DESIGN CYCLE, self-correcting exactly as this pipeline's redundancy
  principle is supposed to work. CODE-DESIGNER's first design (an
  opts[:restore_sandbox] opt-in doing Sandbox.mode(:manual) + a fresh
  checkout post-provisioning) passed CODE-DESIGN-VALIDATOR's independent
  gate, then FAILED for real at ELIXIR-DEV's own implementation: 26/38
  scoped-run examples failed. ELIXIR-DEV traced the true mechanism rather
  than forcing a pass or guessing: Ecto's Sandbox.mode/2 checks in ALL pool
  connections whenever the requested mode differs from the pool's current
  one -- a 4th failure mechanism distinct from the three ISS-0113's own
  investigation had named, and one the original design did not anticipate.
  Routed back to CODE-DESIGNER as rework iteration 1 (not iteration
  exhausted -- 1 of 3 max).

  THE REWORK'S FIX IS SIMPLER THAN THE ORIGINAL DESIGN, NOT MORE COMPLEX:
  traced through actual Ecto/DBConnection source
  (DBConnection.Ownership.Manager's same-mode no-op guard) that
  provisioned_tenant!/1's OWN PRE-EXISTING, unconditional
  Sandbox.mode(Letflow.Repo, :auto) first line is ALREADY sufficient for
  async: true safety by itself -- the newly-added restore_sandbox branch's
  own SECOND mid-test mode flip was the actual defect, discarding the
  connection provisioning had just populated. Fix: deleted the
  restore_sandbox mechanism entirely. Net shipped diff: a moduledoc note on
  test/support/tenant_fixture.ex plus `async: false` -> `async: true` on
  test/letflow/secrets_test.exs and test/letflow/webhooks_test.exs -- zero
  new runtime code.

  VERIFIED FOUR TIMES BY FOUR DIFFERENT PARTIES/SEEDS, not once: (1)
  CODE-DESIGNER's own rework verification -- reproduced the original
  failure (4/11), then 13 clean runs of the fix across default and
  randomized seeds, 38/38 every time. (2) CODE-DESIGN-VALIDATOR's
  independent regate -- personally ran the scoped suite twice with two
  distinct explicit seeds (12345, 98765), 38/38 both times. (3)
  ELIXIR-DEV's sign-off -- a third independent run, seed 840049, 38/38,
  plus confirmed the diff matches the design's own normative section
