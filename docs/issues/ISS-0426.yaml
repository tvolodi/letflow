id: ISS-0426
title: "Lua executor wall-clock tests flake under CPU contention: a 0.3s test hits its 5000ms timeout when the suite runs 6-way parallel"
discovered_by: ORCH
discovered_in_run: ORCH-adhoc-20260902
discovered_at: "2026-09-02T18:18:45Z"
severity: MAJOR
tags: [test-flake, ci, lua, wasm, parallel, s6]
description: >
  MEASURED, reproducible. Found while benchmarking scripts/test_parallel.sh
  (REQ-113) as a candidate speedup for ISS-0423.

  SYMPTOM: running the full suite as 6 parallel partitions on a 16-core host
  produced exactly one failure, in a test that passes reliably in a serial run:
  "test SCRIPT_ERROR capture (REQ-162) AC7: stack trace frames contain no '/'
  path separator or 'Elixir.' prefix (Letflow.Engine.Lua.ExecutorTest)" at
  test/letflow/engine/lua/executor_test.exs:983 --
  left: {:error, {:script_error, script_error}},
  right: {:error, {:wallclock_timeout, 5000}}.

  The test asserts a Lua script fails with a SCRIPT_ERROR (integer division by
  zero). Instead Letflow.Engine.Lua.Executor's own wall-clock kill fired first.

  EVIDENCE IT IS CONTENTION, NOT A DEFECT: the same test, same worktree, same
  commit, run in isolation immediately afterward passed in 0.3 seconds against
  a 5000 ms budget -- roughly a 16,000x margin -- collapsing to a timeout purely
  because 6 partitions were competing for 16 cores. The full serial run of the
  same commit passed 3060/3060 with zero failures (1805.1 seconds).

  WHY THIS MATTERS BEYOND ONE TEST: Letflow.Engine.Lua.Executor and
  Letflow.Engine.Wasm.CallTimeout are the two subsystems whose CORRECTNESS is
  defined in wall-clock terms (REQ-155's LUA-10 layer-2 host-enforced kill,
  REQ-169/REQ-170's fuel and epoch interruption). Their tests assert on real
  elapsed time, making them structurally sensitive to scheduler pressure in a
  way no other test in this suite is. Any move to run the suite in parallel --
  in CI or locally -- will surface this class of flake, and it will look like a
  random unrelated failure to whoever hits it. ISS-0352's own wasm_hang cascade
  is the same family of problem.

  SCOPE: identify the wall-clock-sensitive tests and make them robust under
  contention. Options for CODE-DESIGNER to weigh, none prescribed: (a) tag them
  and run them in their own low-concurrency partition, mirroring the wasm_hang
  precedent already in test_helper.exs; (b) raise the timeout budgets used
  specifically in tests, being careful not to weaken what the test proves;
  (c) restructure the assertions so they do not depend on which of two racing
  outcomes wins. Option (b) alone is the weakest -- it moves the threshold
  without removing the sensitivity.

  DO NOT change Letflow.Engine.Lua.Executor's production timeout semantics to
  fix a test-environment problem -- the wall-clock kill is a security control
  against untrusted tenant scripts (LUA-10) and its behaviour under load is the
  thing being asserted, not an implementation detail to relax.
