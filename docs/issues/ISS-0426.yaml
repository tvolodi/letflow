resolution: >
  STATUS CHOSEN: resolved, not instrumented and not no_defect -- judged against
  docs/agents/protocols/ISSUE_QUEUE.md's "Issue status vocabulary" definitions,
  not defaulted.

  Why `resolved` and not `instrumented`: `instrumented` applies when verified
  work shipped but "the underlying defect's root cause is not removed."
  That is not this case. The filed defect's root cause -- 14 Group 1 call
  sites (11 nil-heap, 3 heap-limited) racing a wall-clock OBSERVATION window
  (Task.yield/2's timeout_ms, or a receive block's `after timeout_ms ->`
  clause) against ordinary BEAM scheduler contention, producing the filed
  {:error, {:wallclock_timeout, 5000}} at executor_test.exs:983 where
  {:error, {:script_error, _}} was asserted -- is now structurally unreachable
  BY CONSTRUCTION from all 14 call sites: the 11 nil-heap sites no longer call
  Task.yield/2 at all, and the 3 heap-limited sites no longer evaluate any
  `after timeout_ms ->` clause at all. This is confirmed by a static, one-time
  source/diff read (grep each seam's body for Task.yield / an `after` clause
  inside its receive block -- both absent), not by a repeated-run count, which
  is the design's own explicitly stated preference (see
  lib/letflow/design/iss426-wallclock-test-contention.md section 4) precisely
  because the flake could not be reproduced on demand (see honesty note
  below). "Root cause removed, evidenced structurally" is exactly resolved's
  bar, not instrumented's.

  Why `resolved` and not `no_defect`: a real defect was diagnosed (Step 1) and
  a real fix shipped and passed every gate (CODE-DESIGN-VALIDATOR after 2
  reworks, SECURITY-REVIEWER, REVIEWER, TEST-DESIGN-VALIDATOR, TEST-RUNNER) --
  this is not an investigated-and-found-nothing outcome.

  The genuine tension, stated plainly rather than smoothed over: 11 tests in
  Group 2 (tagged @tag :lua_wallclock_race) still race a REAL wall-clock
  timeout by design -- hard constraint 4 of the diagnosis/design required
  keeping that race, because those tests exist to assert the LUA-10
  wall-clock kill (REQ-155) actually fires; removing the race would remove
  the property under test. Their contention exposure is REDUCED (isolated
  single-file `mix test --only lua_wallclock_race` subprocess: no async:true
  siblings, no scripts/test_parallel.sh cross-partition contention) rather
  than eliminated -- see design section 4's own "what would still require a
  repeated-run check, and why this design doesn't lean on it" paragraph. This
  retained Group 2 race is judged NOT to be the filed defect: the filed
  failure was a Group 1 test (AC7, a fast script_error assertion with a
  generous 5000ms budget that never intended to race the timeout at all) and
  was explicitly out of scope for full contention-immunity per hard
  constraint 4 and ISS-0426's own AC framing. A future flake surfacing from
  one of the 11 Group 2 tests under sufficient isolated-subprocess load would
  be a NEW issue against that residual, narrower, deliberately-retained risk
  -- not a recurrence of this one -- and should be filed as such rather than
  reopening this record.

  HONESTY REQUIREMENT ON WHAT WAS AND WAS NOT DEMONSTRATED (this record
  outlives the run, so stating this plainly matters): the original filed
  flake was NEVER reproduced on demand, at any point in this run. Step 1
  (ISSUE-FIXER) could not trigger it under 24 concurrent OS-level CPU-burner
  processes plus 48 concentrated back-to-back runs of the exact failing
  AC7 test -- all 48 passed cleanly -- and recorded that as an honest
  negative result, not as evidence the defect didn't exist. The fix
  therefore does NOT rest on "reproduced the flake, applied the fix,
  confirmed the flake is gone." It rests on STRUCTURAL verification: the
  failure branch ({:error, {:wallclock_timeout, _}}) is unreachable from the
  14 Group 1 call sites by construction, confirmable by reading the diff
  without running anything. TEST-RUNNER's two clean TEST_PARALLEL_N=6
  scripts/test_parallel.sh runs (AC6, both "combined: 3048 tests, 6
  properties, 0 failures (3054/3054 passed)") are CONFIRMATORY evidence for
  Group 1 and load-bearing only for Group 2's residual, narrower risk -- not
  proof the Group 1 fix works, and not proof the original flake would have
  been caught by these runs even pre-fix, since it was never reproduced
  pre-fix either. Do not read this record as "flake reproduced and shown
  gone"; it was never reproduced at all, before or after the fix.

  EVIDENCE CITED (all verified this run, not inherited):
  - Fix: two additive @doc false test-only seams on
    Letflow.Engine.Lua.Executor (run_script_sync/3,
    run_with_heap_limit_sync/4). lib/letflow/engine/lua/executor.ex diff vs
    main: 113 insertions, 0 deletions. AC4 holds: production wall-clock kill
    semantics byte-for-byte unchanged, config/config.exs:17 untouched.
    REQ-155's LUA-10 security control intact.
  - 11 genuinely-racing Group 2 tests tagged @tag :lua_wallclock_race,
    excluded by default in test/test_helper.exs, isolated in a new additive
    subprocess in lib/mix/tasks/letflow.check.test.ex (37 insertions, 0
    deletions -- zero existing lines touched, which mattered because that
    file is shared with the concurrent sibling run WF03-ISS0418-20260902).
  - Coverage: 8 new tests. Fail-first satisfied by MUTATION per WF-03's rule
    for new/repointed code, since the pre-fix failure mode here is
    non-existence: 4 mutants each producing a discriminating failure set
    (4/45, 4/45, 12/45, 1/56). TEST-DESIGN-VALIDATOR independently
    reproduced mutant 1 in a throwaway git worktree and matched both the
    failure count (4/45) and the exact failing-test set.
  - TEST-RUNNER (test/reports/report-20260903-WF03-ISS0426-20260902.yaml):
    full serial `mix test` -> "Result: 3057 passed (6 properties, 3051
    tests), 21 excluded", 0 failures (AC3). Isolated
    `--only lua_wallclock_race` partition -> 11 passed, 45 excluded, 0
    failures. `mix letflow.check.test` -> PASS all 3 phases (default suite,
    isolated :wasm_hang subprocess, isolated :lua_wallclock_race subprocess).
    AC6 -> two TEST_PARALLEL_N=6 scripts/test_parallel.sh runs, both
    "combined: 3048 tests, 6 properties, 0 failures (3054/3054 passed)", all
    6 partitions clean both times, no ISS-0219/ISS-0222 infrastructure
    symptoms encountered.
  - AC6's literal-criterion concern: TEST-DESIGN-VALIDATOR filed a MINOR at
    step-04b noting AC6's literal text (>=2 repeated end-to-end
    scripts/test_parallel.sh runs) was not addressed within its own gate's
    scope (correctly, since that AC was never TEST-DESIGNER's to satisfy).
    TEST-RUNNER has since satisfied it directly with the two real runs cited
    above -- that concern is closed.

  Regression test: test/letflow/engine/lua/executor_test.exs (3 new describe
  blocks, 8 new tests, committed alongside the fix). Diagnosis handoff:
  handoffs/WF03-ISS0426-20260902/step-01-issue-fixer-diagnosis.json. Design:
  lib/letflow/design/iss426-wallclock-test-contention.md.
