source: >
  User asked whether adopting scripts/test_parallel.sh into
  `mix letflow.check` was covered by any requirement or issue. Checked
  directly: REQ-113/REQ-114 (both done) cover building the script and
  wiring it into docs/agents/workflows/ only; grep confirms no
  lib/mix/tasks/, mix.exs or ci.yml reference. ISS-0352 named the
  check-adoption as option (b) but resolved via option (a). Timings
  measured in this same session on the same commit.
queue_task_id: 428
