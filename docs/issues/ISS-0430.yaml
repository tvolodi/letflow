acceptance_criteria:
  - "A design artefact under lib/letflow/design/ answers all five named design questions explicitly"
  - "The design states Postgres remains the source of truth and no state is transported in a NOTIFY payload -- payloads carry identifiers/routing hints only, treated as untrusted"
  - "The design states explicitly that polling is RETAINED as a reconciliation backstop and is not deleted, naming the retained interval(s) for both Letflow.Scheduler.Poller and Letflow.Engine.ServiceTaskDispatcher.Poller if adoption is recommended"
  - "Tenant isolation is addressed as a security property, not a naming convention -- the design names the mechanism preventing tenant A's notification reaching tenant B's listener, and SECURITY-REVIEWER signs off on it as a tenant-data-path change"
  - "The design is reconciled with the CURRENT, ALREADY-LANDED supervision tree (Letflow.Supervisor.Infrastructure / Pollers / PollersBreaker / Http, REQ-219) -- the LISTEN connection's owner has a stated place in that tree, not added as an unplaced peer"
  - "The design states its relationship to the two ALREADY-SHIPPED pollers (Letflow.Scheduler.Poller, Letflow.Engine.ServiceTaskDispatcher.Poller) explicitly: either a future retrofit is recommended (with the reason and rough scope), or it is not (with the reason) -- REQ-214 having already shipped as a polling loop, this is a retrofit question, not a greenfield sequencing question"
  - "Any performance claim is justified by ELIMINATED ROUND TRIPS, not this dev host's inflated 1.3ms figure -- must note ~92% is Docker Desktop network overhead and co-located deployment measures ~0.11ms"
  - "No implementation of a specific consumer is included"
