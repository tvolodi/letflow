id: ISS-0430
title: "Adopt Postgres LISTEN/NOTIFY as the BEAM<->Postgres push channel -- decide the pattern (design-first; REQ-214 already shipped as a polling loop, ISS-0425's tree layering also already landed)"
discovered_by: ORCH
discovered_in_run: ORCH-adhoc-20260903-arch-review
discovered_at: "2026-09-02T19:15:50Z"
severity: MAJOR
tags: [postgres, notify, listen, pubsub, architecture, s6, design-only]
description: >
  Letflow has ZERO LISTEN/NOTIFY, zero Postgrex.Notifications, and no
  PubSub of any kind -- reverified by ORCH 2026-09-05 via
  `grep -rniE "Postgrex\.Notifications|LISTEN |NOTIFY |Phoenix\.PubSub"
  lib/` (zero hits; the only unrelated match on a looser pattern was
  lib/letflow/supervisor/http.ex, a false positive on the word "listen"
  used generically). This is the single largest unused Postgres<->BEAM
  integration, and it is the one capability that lets Postgres PUSH
  rather than be polled -- keeping Postgres fully authoritative for
  state while removing the polling that currently stands in for
  notification.

  SEQUENCING NOTE, added at filing (ORCH re-verification, 2026-09-05):
  this issue's original filing text argued the design must land BEFORE
  REQ-214 (then pending, queue task 415) so REQ-214 could adopt the
  pattern rather than needing a retrofit. **REQ-214 has since shipped**
  (PR #847, merged; status: done in docs/requirements.yaml) as
  Letflow.Engine.ServiceTaskDispatcher.Poller, a second fixed-interval
  GenServer ticker alongside Letflow.Scheduler.Poller, both now owned by
  Letflow.Supervisor.Pollers (lib/letflow/supervisor/pollers.ex). ISS-0425
  (the supervision-tree layering issue this design must also reconcile
  with) has likewise had both of its own follow-on requirements land --
  REQ-219 (tree layering: Infrastructure / Pollers / PollersBreaker /
  Http, closes ISS-0425 parts 1+partial-2) and REQ-220 (Task.Supervisor
  sprawl review, closes ISS-0425 part 3) are both status: done. ISS-0425's
  own yaml is still status: open (a separate, pre-existing bookkeeping gap
  in that record, not something this issue resolves).

  So the "settle before REQ-214 lands" framing is moot as literally
  written -- there is no longer a live sequencing choice to make for
  REQ-214 specifically. What remains live, and is unchanged by REQ-214
  shipping: (a) Letflow now has TWO fixed-interval polling loops
  (Letflow.Scheduler.Poller, ISS-0421's SPOF/sweep-inefficiency subject,
  and Letflow.Engine.ServiceTaskDispatcher.Poller) instead of one, which
  sharpens rather than removes the case for a push-based alternative;
  (b) the design questions below (connection ownership, tenant isolation,
  payload discipline, delivery semantics, test story) are unaffected by
  which requirement lands first, and are exactly as unsettled today as
  when this issue was filed; (c) the design must now state explicitly
  whether a FUTURE retrofit of the already-shipped pollers is worth doing,
  rather than a greenfield adoption -- this is a materially different
  question from the original framing and the design artefact must answer
  it as such, not silently keep the original "adopt before it's built"
  framing.

  WHAT THIS BUYS, IF ADOPTED (unchanged from original filing): (a) both
  existing Pollers stop being fixed-interval sweepers for the common
  case -- each currently wakes on a timer and queries whether or not
  anything happened. With NOTIFY on the relevant row insert (a timer row
  for Scheduler.Poller, a service_task_dispatches row for
  ServiceTaskDispatcher.Poller), work arrives as a message and polling is
  demoted to a safety net for missed wakeups. (b) a real-time push path to
  web/ becomes possible for the first time -- NOT in scope, listed so the
  design does not foreclose it.

  EVIDENCE (profiled on the dev host 2026-09-03, unchanged by REQ-214
  landing): a Repo.query!("SELECT 1") round trip from the BEAM costs
  1186-1436 us, while the same query inside the Postgres container costs
  0.110 ms -- ~92% of a DB call on this host is host<->container network
  overhead (Docker Desktop). A 3-query Repo.transaction costs 6476 us
  (five round trips). THE LEVER IS ROUND-TRIP COUNT. A poll that finds
  nothing still pays a full round trip per tenant per sweep; a
  NOTIFY-driven wake pays zero when idle. On a co-located production
  deployment the ratio narrows -- the design must be justified by
  ELIMINATED POLLS, not this host's inflated numbers.

  DESIGN QUESTIONS THE ARTEFACT MUST SETTLE:
  1. CONNECTION OWNERSHIP. Postgrex.Notifications needs its own
     connection OUTSIDE the Ecto pool (long-lived, cannot be checked back
     in). Where in the NOW-LAYERED supervision tree (Infrastructure /
     Pollers / PollersBreaker / Http, per REQ-219 -- see
     lib/letflow/application.ex and lib/letflow/supervisor/*.ex), how
     many connections, does it count against Repo pool_size or Postgres
     max_connections separately? ISS-0224's at-most-one-in-flight
     reasoning and decision 0009-test-parallel-pool-sizing.md are
     precedent.
  2. MULTI-TENANCY. Channel names are database-global, NOT
     schema-scoped. A NOTIFY in tenant A's schema is visible to any
     listener on the same database. Since tenant isolation is THE
     load-bearing invariant (INV-1, schema-per-tenant), the design must
     state how a tenant's notifications cannot leak to another tenant's
     listener, and payloads must be treated as untrusted routing hints,
     never data.
  3. PAYLOAD LIMIT. NOTIFY payloads capped at 8000 bytes. Design must
     specify notify-then-fetch (send an id, read the row), not shipping
     state through the channel.
  4. DELIVERY SEMANTICS. NOTIFY is fire-and-forget, LOST if no session
     listening, only delivered on COMMIT. Polling CANNOT be deleted --
     must remain as reconciliation backstop for BOTH existing pollers if
     adopted. Design must state retained poll interval and why it's safe
     to lengthen (if it is).
  5. TEST STORY. Ecto's SQL sandbox rolls back, so a NOTIFY issued in a
     sandboxed test never commits and never fires. Design must say how
     this is tested at all.

  SCOPE: produce the design artefact and decide 1-5, PLUS the
  re-framed sequencing question (retrofit-worth-it vs. not, now that
  both consumers already exist as pollers). Implementation is separate
  follow-on work. A decided "not worth it, keep polling" is a legitimate
  outcome IF argued against the round-trip evidence, not by default.
