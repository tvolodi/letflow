id: ISS-0441
title: "main has NO branch protection: CI is advisory, not a merge gate -- every hard gate in this pipeline is procedurally enforced, not structurally"
discovered_by: ORCH
discovered_in_run: WF03-ISS0440-20260903
discovered_at: "2026-09-03T10:42:00Z"
severity: MAJOR
tags: [ci, repo-admin, pipeline-integrity, decision-needed, s6]
description: >
  DISCOVERED during WF03-ISS0440-20260903, while validating whether that
  issue's fix could honestly claim to make a violation "structurally
  impossible". Verified independently twice (ORCH, then CODE-DESIGN-VALIDATOR
  which additionally pulled PR #848's own statusCheckRollup).

  FINDING: `gh api repos/tvolodi/letflow/branches/main/protection` returns
  404 {"message":"Branch not protected"}. main has NO branch protection
  whatsoever -- no required status checks, no required reviews, nothing.

  WHY THIS MATTERS FAR BEYOND ISS-0440: this project's entire quality model
  rests on gates described as HARD -- SECURITY-REVIEWER, REVIEWER,
  TEST-DESIGN-VALIDATOR, and the CI backend gate itself.
  docs/migration/decisions/0004-humanless-pipeline.md makes agents the only
  backstop, with no human reviewer or merge-clicker. But nothing structurally
  prevents a merge while CI is red or still running. Every one of those gates
  is enforced by the merging agent choosing to honor it.

  LIVE COUNTEREXAMPLE, from the same session that filed this: PR #848
  (ISS-0426, merged 2026-09-03) has statusCheckRollup showing its two Backend
  gate runs as FAILURE and SUCCESS. It was merged with a failing gate via
  --admin. That merge was, in ORCH's judgement, correct -- the failure was the
  documented ISS-0352 wasm_hang flake, structurally unrelated to the change
  (the branch touched no wasm path at all), and confirmed flaky by the
  identical commit passing in the parallel CI run. The point is NOT that the
  merge was wrong. The point is that nothing except the agent's own judgement
  stood between a red gate and main, and that judgement could equally have
  been wrong.

  SCOPE: decide and implement the repo's branch-protection posture. This is
  repo ADMINISTRATION, not code, and it affects every concurrent run on every
  host -- so it needs a deliberate decision, not a drive-by change. Questions
  a designer must answer, none prescribed:
  (a) should main require the Backend gate and Frontend gate status checks to
  pass before merge?
  (b) if so, how do agents merge past a KNOWN-flaky unrelated failure -- the
  exact ISS-0352/ISS-0418 situation that has now recurred seven-plus times --
  without either blocking indefinitely or retaining a blanket --admin bypass
  that defeats the protection?
  (c) does requiring checks break the humanless pipeline's ability to
  self-merge, given the merging identity is the repo owner and GitHub lets
  admins bypass protection unless enforce_admins is set?
  (d) is enforce_admins appropriate here, given there is no human available to
  unblock a genuinely stuck merge?

  NOTE (b) IS THE HARD PART and should not be waved away: a protection rule
  that agents must routinely bypass is worse than none, because it trains the
  bypass reflex while creating a false impression of enforcement.

  Filed as a KNOWN GAP, not a defect in any single run. ISS-0440's design
  explicitly references this issue as the reason its own guarantee is stated
  as "always detected and recorded" rather than "cannot reach main".
later_evidence: >
  OCCURRENCE 8 OF ISS-0440's DEFECT CLASS REACHED main AND STAYED THERE,
  observed 2026-09-03T18:5xZ by ORCH during WF03-ISS0440-20260903's own Step
  Final rebase. handoffs/WF01-REQ219-220-20260903/step-validator-recheck.json
  carried top-level status "PASSED" (REQ-VALIDATOR bleeding its own nested
  result.status "PASS" into the schema-constrained lifecycle field -- the exact
  mechanism ISS-0440 documents). This is direct, unsought confirmation of THIS
  issue's thesis rather than ISS-0440's: the violation WAS detected -- main's
  Backend gate caught it and went red on the very first commit carrying it --
  and it reached and remained on main ANYWAY, through FOUR consecutive red CI
  runs (16:41Z, 16:45Z, 16:49Z, 16:51Z), because nothing structurally prevents
  pushing to or merging into an unprotected main. Detection worked exactly as
  designed; enforcement does not exist. That is precisely the gap this issue
  describes, and it is why ISS-0440 closed as `instrumented` rather than
  `resolved` -- better tooling cannot close a hole whose cause is that a red
  gate has no teeth.

  Corrected in passing by ORCH (commit 8b44aceb on
  feature/WF03-ISS0440-20260903) since it blocked that branch's own merge:
  one field, PASSED -> COMPLETED, semantics unambiguous (completed_at set,
  result.status PASS). Note ISS-0440's --autofix would correctly REFUSE this
  file -- "PASSED" is outside its closed PASS/COMPLETE/DONE map -- so the hand
  fix is the designed behaviour, not a shortfall in the shipped tool.
