source: >
  Project owner's observation of the letflow-2-postgres-1 container log
  during WF03-ISS0446-20260904; root cause confirmed by ORCH via
  docker inspect against the live container (healthcheck "pg_isready -U
  letflow", interval 2s, POSTGRES_DB=letflow_dev).
