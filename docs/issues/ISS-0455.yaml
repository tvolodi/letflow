severity: MINOR
tags: [docker, postgres, healthcheck, logging, s6]
description: >
  Reported by the project owner during WF03-ISS0446-20260904.
  docker-compose.yml's postgres healthcheck was `pg_isready -U letflow`
  with interval 2s; pg_isready defaults dbname to the -U value, but
  POSTGRES_DB is letflow_dev, so every probe hit a nonexistent database
  named `letflow` and logged FATAL. Confirmed via `docker inspect` on the
  live container. COSMETIC ONLY -- the healthcheck still correctly
  reported healthy (a FATAL response proves the server is answering) and
  nothing in the app uses a bare `letflow` database. Worth fixing because
  it emitted ~43k FATAL-level noise lines/day, degrading the postgres log
  as a debugging surface.
