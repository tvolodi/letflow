resolution: >
  ORCHESTRATOR.md S10 direct-action sizing: single file, no application
  code, no migration, no supervision-tree touch, no tenant-data path, no
  test-asserted-behavior change -- applied directly by ORCH.

  FIX. `pg_isready -U letflow` -> `pg_isready -U letflow -d $$POSTGRES_DB`
  (the doubled `$$` escapes docker compose's own variable interpolation so
  the reference resolves inside the container's shell against the real
  POSTGRES_DB env var already set on this service, per the issue's own
  "consider referencing POSTGRES_DB so the two cannot drift" suggestion --
  chosen over hardcoding `letflow_dev` a second time).

  VERIFICATION (real container, not assumed). Before: `docker logs` showed
  a `FATAL: database "letflow" does not exist` line every ~2s. Manually
  ran the fixed command inside the running container
  (`pg_isready -U letflow -d $POSTGRES_DB`) -- clean "accepting
  connections", no FATAL. Recreated the postgres service
  (`docker compose up -d --force-recreate postgres`) to pick up the new
  healthcheck definition: container reports `(healthy)`, and `docker logs
  --since 8s` after startup settled shows zero output across multiple
  full healthcheck intervals (was previously ~1 FATAL line per interval).
