description: >
  During WF03-ISS0451-20260904's Step Final CI wait, PR #874's push-event
  backend-gate run (33840184735, job 100920721979) failed the isolated
  wasm_hang CI phase on commit f7858821:
  test/letflow/engine/wasm/plugin_handler_test.exs:474 (REQ-170 AC4
  wall-clock-ordering assertion, both measured elapsed times pinned at
  30000ms) and test/letflow/engine/wasm/host_api_write_test.exs:460
  (ExUnit.TimeoutError after 180000ms in start_instance/2), with concurrent
  unrelated Keycloak econnrefused noise in the same window.

  The identical commit passed the entire backend gate cleanly on the
  concurrent pull_request-event run (33840208029). PR #874's own diff
  touches zero files under lib/letflow/engine/wasm/,
  test/letflow/engine/wasm/, or lib/letflow/engine/lua/ (confirmed via
  git diff origin/main --stat over those paths, empty) -- structurally
  cleared as unrelated to that branch's own change (Letflow.Supervisor
  circuit-breaker isolation, ISS-0451).

  This matches the already-tracked recurring wasm_hang/wall-clock-ordering
  CI-contention-sensitive flake class documented on ISS-0418 and ISS-0453.
  Filed as its own task per those issues' own note against re-deciding the
  shared question a third time independently -- a future run should fold
  this instance into whichever resolves ISS-0418/ISS-0453 rather than
  treating it as a fresh root cause.
