description: >
  test/letflow/engine/lua/executor_test.exs line 654 asserts
  `small_elapsed_ms < large_elapsed_ms` -- a raw `:timer.tc/1`-measured
  wall-clock comparison -- unguarded by any tag/isolation, even though the
  test's deterministic outcome assertions (:memory_limit_exceeded / :ok)
  were already routed off the racy caller-timeout seam by ISS-0426.

  Failed live on PR #902's CI (GH Actions run 33915056916, Backend gate,
  2026-09-04T20:13:15Z): 440.152ms vs 398.195ms. A second CI run on the
  identical commit (run 33915018100) and a local run both passed the same
  test cleanly -- confirmed nondeterministic, not a regression (the merging
  branch, WF03-ISS0467-20260904, touched no test files:
  git diff --name-only bf593f8a...HEAD is 7 non-test files: 3 docs, 1
  design artefact, 3 handoff/registry bookkeeping paths).

  docs/issues/ISS-0446.yaml independently corroborates this same file:line
  failing on a prior, unrelated PR (#866).

  Suggested scope options: (a) tag :lua_wallclock_race and ride ISS-0426's
  existing isolated subprocess; (b) replace the wall-clock comparison with
  a deterministic proxy; (c) add a tolerance margin.
