id: ISS-0469
title: "executor_test.exs:625 (REQ-156 AC-1) retains a raw wall-clock elapsed-time comparison outside lua_wallclock_race isolation -- flaked on CI under contention"
discovered_by: ORCH
discovered_in_run: WF03-ISS0467-20260904
discovered_at: "2026-09-04T20:51:30Z"
severity: MINOR
tags: [testing, flake, lua, ci, s6]
description: >
  test/letflow/engine/lua/executor_test.exs line 654 asserts
  small_elapsed_ms < large_elapsed_ms -- a raw :timer.tc/1-measured
  wall-clock comparison -- unguarded by any tag/isolation, even though the
  test's deterministic outcome assertions (:memory_limit_exceeded / :ok)
  were already routed off the racy caller-timeout seam by ISS-0426.

  Failed live on PR #902 CI (GH Actions run 33915056916, Backend gate,
  2026-09-04T20:13:15Z): 440.152ms vs 398.195ms. A second CI run on the
  identical commit (33915018100) and a local run both passed the same test
  cleanly -- confirmed nondeterministic, not a regression (the merging
  branch touched no test files). docs/issues/ISS-0446.yaml independently
  corroborates this same file:line failing on a prior, unrelated PR (#866).

  SCOPE, options none prescribed: (a) tag :lua_wallclock_race and ride
  ISS-0426's existing isolated subprocess; (b) replace the wall-clock
  comparison with a deterministic proxy; (c) add a tolerance margin.
