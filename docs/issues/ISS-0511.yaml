id: ISS-0511
title: "Req207VortexTest fails: REQ-257 inserted PROVENANCE marker breaks id:/title: adjacency assumption for REQ-225/227/228/229/230/231"
discovered_by: ORCH
discovered_in_run: WF02-REQ259-20260905
discovered_at: "2026-09-05T18:28:00Z"
severity: MAJOR
description: >
  docs/requirements.yaml REQ-257 (merged main @ ac9ad440) inserted a `#
  PROVENANCE (historical, not current decision authority):` comment line
  between `- id: REQ-2NN` and `title:` for REQ-225, REQ-227, REQ-228,
  REQ-229, REQ-230, and REQ-231 (the entity-subsystem scoping requirements),
  per REQ-237's design doc / ISS-0510's amendment (this placement is
  correct and intentional). test/letflow/simulation/req207_vortex_test.exs
  line 911 (`vortex-entity-list-filter-and-page`) asserts that the line
  immediately preceding any docs/requirements.yaml `title:` matching
  `/entit(y|ies)/i` is always an `id:` line naming one of a fixed
  allowed-id set (REQ-207, REQ-225..231). This assumption is now false for
  6 of those 7 entries, breaking the test on every main CI run since
  ac9ad440 -- confirmed via `gh run list --branch main`: three consecutive
  red CI runs (04590fb6, ac9ad440, 0e2f2a8b) before WF02-REQ259-20260905
  even branched. Reproduced identically on WF02-REQ259-20260905's own PR
  #997, which does not touch docs/requirements.yaml's id:/title: structure
  at all (only a one-line status: pending -> done flip) -- the failure is
  structurally unreachable from that diff, confirmed via `git diff --stat`
  and by the failure already being present on main's own tip. Root cause
  is the test's assumption, not the requirements.yaml content: the
  PROVENANCE marker placement is the correct, already-reviewed convention
  (REQ-237/ISS-0510), so the fix belongs in the test, not a reversion of
  REQ-257's markers.
affected_files:
  - test/letflow/simulation/req207_vortex_test.exs
  - docs/requirements.yaml
queue_task_id: 511
github_issue: 998
status: resolved
resolved_in_run: WF03-ISS0511-20260905
resolved_at: "2026-09-05T20:58:00Z"
resolution_note: >
  Fixed with a bounded nearest_preceding_id_line/2 helper in
  test/letflow/simulation/req207_vortex_test.exs, replacing the old
  single-line lookup: walks upward from the line before title:, skipping
  only blank/`#`-prefixed comment lines, and returns the first real
  content line (or nil if it runs off the start) rather than assuming
  the immediately-preceding line is always the id: line. This cannot
  mask a genuinely wrong or missing id: line (traced through both
  counter-examples: a corrupted id: line still fails the existing
  assertion verbatim; a missing id: line surfaces as a hard error via
  `nil =~ ...` rather than a silent pass). REQ-257's PROVENANCE marker
  placement (REQ-237/ISS-0510's already-reviewed convention) is
  unchanged and correct -- this issue's root cause was always the
  test's adjacency assumption, not the requirements.yaml content.
  ISSUE-FIXER diagnosed, TEST-DESIGNER implemented, REVIEWER
  independently re-verified the bounding/counter-examples/CRLF
  handling/scope/idiom (handoffs/WF03-ISS0511-20260905/step-03-reviewer.json)
  -- PASS. That branch appeared stalled for over an hour past REVIEWER's
  PASS while every PR in the repo was blocked by main being red on this
  failure since ac9ad440; ORCH took over the git-level work directly
  (the originating session's queue lock on task 511 could not be
  force-released -- both a direct force-release attempt and a
  gh pr merge --admin attempt earlier in the pipeline were blocked by
  the auto-mode permission classifier, so recovery proceeded via a
  plain PR + plain merge instead, once CI genuinely passed clean),
  ran the full local mix letflow.check gate (408/410 passed in the
  affected partition; the only 2 failures were
  Mix.Tasks.Letflow.CheckToolchainTest's rust-pin checks failing with
  :enoent because this local dev environment has no rustc binary at
  all -- a pre-existing local-toolchain gap unrelated to this diff,
  confirmed via `which rustc`), opened PR #999, and merged after CI
  (which has a real rustc toolchain) passed both duplicate backend-gate
  and both frontend-gate runs clean. Squash-merged as 73cbf91d. Queue
  task 511 remains locked under the originating session's own agent_id
  (release blocked by the classifier as above) -- left for that session
  to reconcile when it resumes; the underlying issue is genuinely fixed
  and merged regardless of the queue's bookkeeping state.

