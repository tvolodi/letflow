id: ISS-0512
title: "enforce no async:true test file may reach Sandbox.mode/2"
discovered_by: TEST-RUNNER
discovered_in_run: WF03-ISS0480-20260905
severity: MAJOR
description: >
  Filed as a follow-on from ISS-0480/ISS-0481. Sandbox.mode/2 checks in every
  connection in the pool when the mode changes, so an async:true file
  reaching it (directly or transitively via
  TenantFixture.provisioned_tenant!/1) corrupts concurrently-running async
  tests. ISS-0480 restored the invariant by construction for two files but
  nothing prevents recurrence. This is the third recurrence in this family
  (ISS-0113 OQ-5 flagged the general risk but only guarded a file that
  itself calls mode/2 directly, never a bystander file reached transitively).

  CAUTION (carried forward from the filing note): the naive check is wrong
  -- an unanchored grep matches moduledoc prose, not real declarations.
  Detection must anchor on a real `use ... async: true` declaration (e.g.
  `^  use .*async: true`), not any line containing the substring. The check
  must also correctly recognize legitimate mode/2 callers
  (test/support/tenant_schema_reaper.ex, test/support/tenant_template.ex)
  without false-flagging them -- those files are allowed to call mode/2;
  the defect class is an *async:true test file* reaching it, not the
  existence of a mode/2 caller.
affected_files:
  - test/support/tenant_fixture.ex
  - test/support/tenant_schema_reaper.ex
  - test/support/tenant_template.ex
  - mix.exs (or wherever mix letflow.check's task chain is defined)
acceptance_criteria:
  - "A check in the mix letflow.check chain fails when an async:true test file
    transitively reaches Sandbox.mode/2"
  - "The check is anchored to real async:true declarations, not moduledoc prose
    mentioning the phrase, with a test proving this"
  - "test/support/tenant_schema_reaper.ex and test/support/tenant_template.ex are
    not false-flagged"
  - "The check catches a reintroduction of the ISS-0480 pattern (a regression
    test proves this)"
related:
  - ISS-0480
  - ISS-0113
queue_task_id: 512
github_issue: 1000
status: resolved
resolved_in_run: WF03-ISS0512-20260905
resolved_at: "2026-09-05T21:34:26Z"
resolution_note: >
  Added lib/mix/tasks/letflow.check_async_sandbox_reachability.ex, a static
  mix task wired into mix.exs's "letflow.check": alias (immediately after
  letflow.lint_handoffs). Scans test/**/*_test.exs for real `use ...,
  async: true` declarations (anchored, rejecting moduledoc/comment prose)
  and flags any such file with a real call site (not inside a moduledoc or
  comment) reaching provisioned_tenant!/1 or a bare Sandbox.mode/2 call --
  ISSUE-FIXER's diagnosis confirmed provisioned_tenant!/1's own first
  statement is an unconditional Sandbox.mode call, so detecting either
  call directly is sufficient without modeling the second hop into
  TenantTemplate.ensure_template!/0. A closed, individually-cited
  allowlist (mirroring lint_handoffs.ex's @grandfathered idiom) permits
  exactly the two files already verified safe under ISS-0113/ISS-0423
  (secrets_test.exs, webhooks_test.exs); any other match fails the build.
  tenant_schema_reaper.ex/tenant_template.ex are excluded structurally by
  the test/**/*_test.exs file-selection step, never scanned as subjects.
  16 regression tests (test/mix/tasks/letflow_check_async_sandbox_reachability_test.exs)
  prove: a genuine violation fails the build, moduledoc-only mentions are
  not false-flagged, the allowlist exempts exactly the two named files,
  non-async:true mode/2-caller fixtures are excluded by file selection,
  and a reintroduction of the ISS-0480 shape is caught. CODE-DESIGN-VALIDATOR
  independently re-verified the design's regex/allowlist/graph-resolution
  claims against the real files (PASS,
  handoffs/WF03-ISS0512-20260905/step-02b-code-design-validator.json);
  REVIEWER independently re-ran compile/format/test/the real-tree scan and
  traced the self-referential test-file snag's fix (PASS,
  handoffs/WF03-ISS0512-20260905/step-03d-reviewer.json). ORCH
  independently confirmed compile --warnings-as-errors, format
  --check-formatted, the 16-test regression suite, and a clean real-tree
  scan (0 new violations, 66 async:true files scanned) before merge.
