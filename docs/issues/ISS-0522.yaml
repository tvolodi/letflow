id: ISS-0522
title: "Hardening: unhandled raise on malformed cursor component (recurring pattern, 2 call sites)"
discovered_by: REVIEWER
discovered_in_run: WF02-REQ231-20260907
discovered_at: "2026-09-07T06:00:00Z"
severity: MINOR
tags: [hardening, robustness, cursor, pagination, req-067]
description: >
  A caller-supplied pagination cursor with a malformed component (e.g. a
  non-UUID string where a binary_id keyset value is expected) causes an
  unhandled raise (an `ArgumentError` from `Ecto.UUID.dump!/1` or similar)
  rather than a clean, typed `{:error, :invalid_cursor}`-shaped result.

  This is now a RECURRING pattern across two independently-shipped call
  sites: `Letflow.Entities.Definitions.list_definitions/2` (REQ-226,
  REQ-067's cursor contract) and `Letflow.Entities.Query.Cursor` (REQ-231).
  SECURITY-REVIEWER assessed each instance individually as non-blocking at
  the time (the request runs in its own isolated BEAM process, so a raise
  there is a doomed single request, not a shared-state or cross-tenant
  security issue -- fits INV-8's own "isolated crash, not a shared one"
  carve-out) but did not evaluate the pattern across both sites together,
  since each review only ever saw its own requirement's diff.

  REVIEWER (WF02-REQ231-20260907) flagged, upon noticing this was the
  SECOND occurrence of the same class, that this is worth evaluating as a
  cross-cutting hardening item now that a pattern (not just an isolated
  instance) exists: every future cursor-consuming call site is likely to
  reintroduce the identical gap unless a shared, reusable safe-decode
  helper exists.
affected_files:
  - lib/letflow/entities/definitions.ex
  - lib/letflow/entities/query/cursor.ex
  - lib/letflow/api/pagination.ex
related:
  - REQ-067
  - REQ-226
  - REQ-231
  - ISS-0438
queue_task_id: 522
github_issue: 1049
status: open
progress_note: >
  IN PROGRESS, not yet resolved -- recorded here rather than left silent
  mid-run. Site 1 (Letflow.Entities.Definitions.list_definitions/2) is
  fixed: added Letflow.Api.Pagination.cast_binary_id_component/1
  ({:ok, Ecto.UUID.t()} | {:error, :invalid_cursor}, wrapping
  Ecto.UUID.cast/1) and routed decode_list_definitions_seek/1's id
  component through it before the value ever reaches a query
  (list_definitions/2's own @spec already declared {:error,
  :invalid_cursor}, so no with-chain/@spec change was needed further up).
  SECURITY-REVIEWER, REVIEWER, TEST-DESIGN-VALIDATOR (one rework cycle),
  and TEST-RUNNER all independently PASSed this site-1 fix and its 7
  regression tests + test/specs/ISS-0522.md.

  EARLIER DIAGNOSIS CORRECTED, NOT SILENTLY: this run's ISSUE-FIXER
  originally found lib/letflow/entities/query/cursor.ex did not exist
  anywhere and REQ-231 was still pending, concluding only 1 of the 2
  named call sites was real. REQ-231 merged to main (PR #1050, commit
  1e3a1d6f) while this run's Step 4/5 was in flight -- ORCH caught this
  on rebase (an add/add conflict on this very file, since the REQ-231
  session filed an equivalent ISS-0522 record independently under the
  same queue task) and re-verified against the newly-landed module
  rather than trusting the now-stale diagnosis. Confirmed by direct
  reading: Letflow.Entities.Query.Cursor's maybe_dump/2
  (lib/letflow/entities/query/cursor.ex:354-355) calls
  Ecto.UUID.dump!/1 unconditionally for :binary_id/Ecto.UUID-typed sort
  terms, and decode_component/2's catch-all
  (lib/letflow/entities/query/cursor.ex:306) accepts ANY binary string
  for the id tiebreaker with no UUID validation -- the identical
  unhandled-raise defect class, genuinely present at a real, newly-live
  site. Site 2 is NOT yet fixed. Extending the same
  cast_binary_id_component/1 helper to cursor.ex's maybe_dump/2 next,
  through the full pipeline again (SECURITY-REVIEWER/REVIEWER/
  TEST-DESIGN-VALIDATOR/TEST-RUNNER all re-gate, since this is new
  substantive scope against a tenant-data query path, not a
  documentation-only change).
