id: ISS-0522
title: "Hardening: unhandled raise on malformed cursor component (recurring pattern, 2 call sites)"
discovered_by: REVIEWER
discovered_in_run: WF02-REQ231-20260907
discovered_at: "2026-09-07T06:00:00Z"
severity: MINOR
tags: [hardening, robustness, cursor, pagination, req-067]
description: >
  A caller-supplied pagination cursor with a malformed component (e.g. a
  non-UUID string where a binary_id keyset value is expected) causes an
  unhandled raise (an `ArgumentError` from `Ecto.UUID.dump!/1` or similar)
  rather than a clean, typed `{:error, :invalid_cursor}`-shaped result.

  This is now a RECURRING pattern across two independently-shipped call
  sites: `Letflow.Entities.Definitions.list_definitions/2` (REQ-226,
  REQ-067's cursor contract) and `Letflow.Entities.Query.Cursor` (REQ-231).
  SECURITY-REVIEWER assessed each instance individually as non-blocking at
  the time (the request runs in its own isolated BEAM process, so a raise
  there is a doomed single request, not a shared-state or cross-tenant
  security issue -- fits INV-8's own "isolated crash, not a shared one"
  carve-out) but did not evaluate the pattern across both sites together,
  since each review only ever saw its own requirement's diff.

  REVIEWER (WF02-REQ231-20260907) flagged, upon noticing this was the
  SECOND occurrence of the same class, that this is worth evaluating as a
  cross-cutting hardening item now that a pattern (not just an isolated
  instance) exists: every future cursor-consuming call site is likely to
  reintroduce the identical gap unless a shared, reusable safe-decode
  helper exists.
affected_files:
  - lib/letflow/entities/definitions.ex
  - lib/letflow/entities/query/cursor.ex
  - lib/letflow/api/pagination.ex
related:
  - REQ-067
  - REQ-226
  - REQ-231
  - ISS-0438
queue_ref: Q-522
github_ref: GH-1049
status: resolved
resolved_in_run: WF03-ISS0522-20260907
resolved_at: "2026-09-07T09:00:00Z"
resolution_note: >
  BOTH real call sites fixed. Site 1
  (Letflow.Entities.Definitions.list_definitions/2): added
  Letflow.Api.Pagination.cast_binary_id_component/1 ({:ok, Ecto.UUID.t()}
  | {:error, :invalid_cursor}, wrapping Ecto.UUID.cast/1) and routed
  decode_list_definitions_seek/1's id component through it before the
  value ever reaches a query. Site 2 (Letflow.Entities.Query.Cursor,
  REQ-231 -- landed on main mid-run, see history below): in
  build_resume_terms/2, replaced the unchecked
  decode_component(:string, id_value) with the same
  cast_binary_id_component/1 call, matching site 1's pattern exactly and
  fulfilling the issue's own original ask for a shared, reusable helper.
  CODE-DESIGN-VALIDATOR independently confirmed (for site 2) that
  Allowlist.typed_columns/0 has no `id` entry and Definition.field_type/0
  has no UUID variant, so the hardcoded id tiebreaker at cursor.ex:254
  was the ONLY reachable :binary_id/Ecto.UUID path -- the narrow,
  single-line fix is complete, not partial. SECURITY-REVIEWER PASSed both
  sites (tenant_id/prefix scoping untouched in both, {:error,
  :invalid_cursor} carries zero tenant-data content, matches this
  codebase's established error-shape convention). REVIEWER PASSed both
  (independently traced with/else-chain propagation, confirmed no
  @spec-widening needed either site). TEST-DESIGN-VALIDATOR PASSed both
  (one rework cycle on site 1 for a missing required test/specs/
  ISS-0522.md deliverable) -- independently reproduced both fail-then-pass
  proofs: site 1 pre-fix 25/26 (real Ecto.Query.CastError), post-fix
  26/26; site 2 pre-fix 9/11 (real ArgumentError from Ecto.UUID.dump!/1),
  post-fix 11/11. TEST-RUNNER ran the full mix letflow.check gate twice
  (once per site's completion); the final run showed 3408/3413 passed,
  5 failures, all structurally cleared: 4 already-tracked (ISS-0513's
  Windows-only Path.expand() bug in
  letflow_check_async_sandbox_reachability_test.exs, not yet merged --
  this branch simply inherits main's current pre-fix state) and 1 in
  Letflow.Scheduler.PollerTest (REQ-218 AC3 family), the same
  already-open, already-documented CI-load-timing flake class as
  ISS-0453 (status: open) -- that issue's own precedent establishes a
  PR touching zero scheduler files can still hit this race, and this
  branch's diff likewise touches zero files under lib/letflow/scheduler
  or test/letflow/scheduler.
