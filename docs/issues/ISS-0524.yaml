notes:
  - date: "2026-09-07"
    author: ISSUE-FIXER
    run_id: WF03-ISS0524-20260907
    note: >
      Root-cause diagnosis (handoffs/WF03-ISS0524-20260907/step-01-issue-fixer-diagnosis.json):
      the claimed regression is NOT REPRODUCIBLE. All 5 real @tag :wasm_hang sites
      confirmed intact (plugin_handler_test.exs:153,390,493; call_timeout_test.exs:77;
      host_api_write_test.exs:459) -- ISS-0418 did not remove or retag anything,
      contrary to this issue's own stated premise. Live `mix test --only wasm_hang
      --dry-run` correctly discovers all 5. Mix.Tasks.Letflow.Check.TestTest passes
      consistently across 5 repeated runs with distinct seeds; its
      install_wasm_hang_aware_fake_mix/1 fixture uses a fake mix binary independent
      of real repo tag counts, so it was never actually coupled to the real
      wasm_hang tag count. discover_wasm_hang_tests/0's parsing logic shows no bug
      against current real output shape. Judged most likely a one-off
      transient/environmental flake at TEST-RUNNER's original observation time, not
      a code defect; no surviving raw output from the original observation exists to
      confirm this definitively.
  - date: "2026-09-07"
    author: CODE-DESIGNER
    run_id: WF03-ISS0524-20260907
    note: >
      Per ISSUE-FIXER's recommendation, scoped a diagnosability-only fix (design doc
      lib/letflow/design/iss0524-wasm-hang-discovery-diagnosability.md): (1) the
      discover_wasm_hang_tests/0 hard-fail Mix.raise message will include the raw
      captured discovery output (last 40 lines) so a future recurrence is
      diagnosable without a live repro; (2) one bounded single retry of the
      discovery dry-run subprocess is added when the first attempt's test-list
      block is empty, to rule out one-shot compile-race flakiness, WITHOUT changing
      the zero-tolerance "never silently proceed with zero" policy -- a persistently
      empty block after the retry still hard-fails. No change to
      extract_test_list_block/1's parsing logic, no change to any real @tag
      :wasm_hang test, no change to try_acquire-style admission logic (unrelated).
