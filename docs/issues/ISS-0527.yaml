id: ISS-0527
title: "Port R-Co's 18-file platform-operator UAT corpus (tests/simulation/scenarios/platform/*.yaml) into UAT-RUNNER's domain"
discovered_by: ORCH
discovered_in_run: WF03-ISS0526-20260907
discovered_at: "2026-09-07T18:16:33Z"
severity: MINOR
tags: [fixture-porting, uat-runner, s7]
description: >
  Follow-up to ISS-0526, which ported R-Co's 11 tenant-business narrative
  UAT scenario files (SwiftRoute/Vortex/Meridian) into
  test/fixtures/uat/scenarios/<company>/*.yaml. R-Co also has an 18-file
  platform-operator scenario corpus at
  tests/simulation/scenarios/platform/*.yaml, explicitly deferred/out of
  scope for that pass per docs/migration/stage-7-simulation-uat-parity.md's
  own existing REQ-210 scoping decision.

  R-Co is reachable via https://github.com/tvolodi/R-Co (confirmed commit
  d19bfec4a9ec492345346bfccd8e389bd9cd92db).

  Scope: repeat ISS-0526's design/port process
  (lib/letflow/design/iss0526-uat-scenario-corpus-destination.md §0-§3)
  against the 18 platform/ files -- same destination convention
  (test/fixtures/uat/scenarios/platform/*.yaml), same provenance-header
  format, same pipeline_test: verbatim-plus-NOTE-if-unresolved handling,
  same byte-for-byte fidelity requirement, updating
  .claude/agents/uat-runner.md and docs/agents/workflows/WF-05_uat_run.md
  if their corpus-location text needs broadening to mention the platform/
  subdirectory.

  Two files need explicit SECURITY-REVIEWER attention during this pass:
  platform-sandbox-cross-tenant-probe.yaml and
  platform-attachment-cross-tenant-probe.yaml (plausible
  tenant-isolation/security-invariant territory, not just narrative
  fixture content).

  Confirm this porting decision does not silently re-decide REQ-210's own
  already-recorded platform-corpus scoping rationale beyond what
  ISS-0526's own design already established.
