id: ISS-0531
title: "SPA derives the tenant slug by stripping the realm's `bpm-` prefix, but the seeded tenant's slug IS `bpm-default` -- every authenticated session renders 'Unknown workspace'"
discovered_by: ORCH
discovered_in_run: ADHOC-ENGINE-AUDIT-20260908
discovered_at: "2026-09-08T07:26:00Z"
severity: MAJOR
tags: [frontend, identity, s8, uat]
description: >
  Found by looking at the authenticated workspace the live-browser login proof
  (ISS-0296/ISS-0529) finally rendered -- NOT visible to any API-level test, because
  every REQ-133 acceptance criterion passes while this is broken.

  web/src/auth/tokenUtils.ts's resolveTenantSlug/1 falls back to the token issuer when
  the token carries no tenant_id claim (Keycloak's does not), parsing the realm out of
  `iss` and then applying: `realm.startsWith('bpm-') ? realm.slice(4) : realm`. For realm
  `bpm-default` that yields slug `default`.

  The seeded tenant's actual slug is `bpm-default` -- slug and idp_realm_id are BOTH
  `bpm-default` (README's "Running it" section states this explicitly, and the DB
  confirms: `SELECT slug, idp_realm_id FROM tenants` => `bpm-default|bpm-default`).

  So AuthProvider.tsx's tenantsApi.getBySlug('default') 404s, the catch swallows it, and
  tenantDisplayName stays null, which useTenantContext renders as the literal
  'Unknown workspace' plus the dashboard's "Tenant name could not be loaded. Contact your
  administrator." banner. Confirmed live:
    GET /api/v1/tenants/default     -> 404
    GET /api/v1/tenants/bpm-default -> 200
  Screenshot evidence: web/tests/screenshots/REQ133-AC5-authenticated.png shows a fully
  authenticated PLATFORM_ADMIN session with correct nav and user identity, titled
  "Unknown workspace".

  NOT YET FIXED and deliberately not fixed blind -- the correct resolution is a contract
  decision, not a one-line edit, and it should be made by FRONTEND-DEV against
  docs/frontend/: either (a) the prefix-stripping heuristic is wrong and slug should equal
  the realm, (b) Letflow should mint a tenant_id claim so the SPA never guesses, or (c)
  the seeded tenant's slug should not equal its realm. (b) is the only one that removes
  the guessing entirely; (a) is the smallest change. The heuristic is R-Co-inherited and
  should be checked against R-Co's own realm/slug convention before choosing.
