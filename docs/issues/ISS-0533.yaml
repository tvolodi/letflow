id: ISS-0533
title: "JSON log formatter cannot encode non-Jason-encodable metadata, so Bandit/OTP startup and crash reports are emitted as level=error 'log encoding failed' lines that hide their own payload"
discovered_by: ORCH
discovered_in_run: ADHOC-ENGINE-AUDIT-20260908
discovered_at: "2026-09-08T07:16:00Z"
severity: MINOR
status: resolved
resolved_in_run: WF03-ISS0533-20260908
resolved_at: "2026-09-08T09:35:46Z"
tags: [observability, logging, diagnosability]
description: >
  Observed continuously while bringing the stack up for the ISS-0296 live-browser proof.

  Letflow's JSON log formatter fails on any log event whose metadata contains a term with
  no Jason.Encoder implementation, and emits a synthetic level=error entry reading
  "log encoding failed: ..." with the original event stringified inside it.

  Two concrete, reproducible instances:
    1. Bandit's own startup line -- metadata carries plug: {Letflow.Router, []}. A perfectly
       normal :info "Running Letflow.Router with Bandit 1.12.5 at 0.0.0.0:4000 (http)"
       is therefore logged at level=error on EVERY boot of a healthy server.
    2. OTP application_controller shutdown reports -- metadata carries a report_cb function
       reference (&:application_controller.format_log/1). A port-conflict shutdown produced
       ~25 consecutive "log encoding failed" error lines, none of which stated plainly that
       port 4000 was already in use; that fact was only legible inside an escaped string.

  WHY THIS MATTERS beyond noise: it inverts severity (healthy startup logs as error) and
  degrades exactly the events that matter most (crash/shutdown reports), so an operator
  grepping for level=error on a healthy instance gets false positives, while a real crash
  is hardest to read. Separately noted during this session: the AuthPipeline provisioning
  failure that produced a 500 (see ISS-0534) logged NOTHING at all, so the log was no help
  in diagnosing it -- the two together mean the JSON log is currently unreliable in both
  directions.

  Suggested direction (not prescribed): give the formatter a total fallback for
  non-encodable terms (inspect/1 the offending value and keep the event's original level
  and message) rather than converting the whole event into an error about itself.
