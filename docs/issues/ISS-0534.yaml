status: resolved
resolution: >
  Resolved 2026-09-08 via WF03-ISS0534-20260908. Fixed by adding one
  Logger.error call (via inspect/1) to lib/letflow/plugs/auth_pipeline.ex's
  handle_auth_error/2, logging the previously-discarded {:provision, reason}
  value before its unchanged 500 response -- no manual trace_id threading
  needed, Letflow.Obs.Logger's formatter already attaches it automatically
  from Logger.metadata(). ISSUE-FIXER traced every reachable reason shape
  (Letflow.Identity.@type provisioning_error's open union plus a plug-layer
  :invalid_tenant_id atom) and confirmed a naive %Ecto.Changeset{}-only fix
  would have crashed on the atom cases -- inspect/1 handles all shapes
  safely. SECURITY-REVIEWER traced User.jit_changeset/2 and confirmed no
  reachable reason shape can carry a raw credential/token/password hash
  (password_hash is unconditionally a fixed sentinel, never from caller
  attrs) -- INV-4 PASS. Explicitly did NOT reclassify the 500 to a
  distinguishing status code (would have silently reversed
  req021-auth-plug-pipeline.md's own settled OQ-9 decision) and did NOT add
  a Keycloak-volume-reset doc note (out of scope, unrelated file). New
  regression test added proving the fix via a deterministic (non-race)
  username-collision reproduction. Pipeline: ISSUE-FIXER -> ELIXIR-DEV ->
  SECURITY-REVIEWER (PASS, INV-4 focus) -> REVIEWER (PASS) -> TEST-RUNNER.
  Along the way, TEST-RUNNER's first full-suite attempt surfaced a much
  larger pre-existing environmental problem on this host (letflow-1-postgres-1):
  745 failures from 25 stale letflow_test* Postgres databases, a recurrence
  of the same class WF03-ISS0399-20260907 already hit -- ORCH obtained user
  approval to drop the stale databases, confirmed via a clean re-run
  (3448/3450 passed, only the known unrelated rustc-absent failures
  remaining), and filed ISS-0535 for this class before discovering a
  sibling session had independently found and fixed a differently-rooted
  cause of the same GH issue on a different host -- composed both root
  causes into ISS-0535's own record on rebase and added an anti-patterns.md
  recurrence note. Implementation commit 76f3bf5c.
