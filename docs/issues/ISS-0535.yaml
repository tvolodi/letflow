id: ISS-0535
title: >
  Letflow.TenantFixture.provisioned_tenant!/1 reports versions_missing=[20260907020001]
  even though that migration file exists and is listed in manifest_versions --
  admission_pipeline_test.exs 5/8 failing
discovered_by: ORCH
discovered_in_run: WF03-ISS0534-20260908
discovered_at: "2026-09-08T08:06:13Z"
severity: MINOR
tags: [tenant-fixture, migration, ci, environment, s6]
description: >
  Observed live on WF03-ISS0534-20260908 and independently re-confirmed by REVIEWER
  (git stash + re-run on the unmodified branch, same failures present, confirmed
  unrelated to that ISS-0534 diff). mix test test/letflow/plugs/admission_pipeline_test.exs:
  3/8 passed, 5 failed, all with the identical root cause --
  Letflow.TenantFixture.provisioned_tenant!/1 reports
  versions_missing=[20260907020001] for the tenant-schema fixture's schema_migrations
  table, even though priv/repo/migrations/20260907020001_add_scan_status_to_instance_attachments.exs
  (added by ISS-0399, merged PR #1069) genuinely exists on disk and is listed in
  @tenant_scoped_migration_manifest in lib/letflow/tenant_provisioning.ex (confirmed:
  it is the last entry in the manifest).

  ROOT CAUSE (WF03-ISS0535-20260908, confirmed via direct measurement):
  Two independent environmental problems were stacked:

  (1) letflow-2-postgres-1 (shared Postgres container, port 5472, referenced by
      letflow-3's .env LETFLOW_DB_PORT=5472) had reached its max_connections limit
      of 100. The letflow-2 workspace maintains ~70-80 idle pool connections to
      letflow_test2/3/4 from previous test runs; when letflow-3's mix test attempts
      to open its own pool (ecto.create + ecto.migrate), Postgres rejects the new
      connections with FATAL 53300 (too_many_connections). This caused mix ecto.create
      to fail with "The database for Letflow.Repo couldn't be created: killed" on every
      attempt in the current session.

  (2) The original versions_missing=[20260907020001] failure reported in the issue
      description (observed during WF03-ISS0534-20260908) was the stale tenant_template
      schema class documented in docs/anti-patterns.md ("Stale tenant_template schema
      surviving a migration-adding commit (docker-compose-persisted Postgres)"). That
      specific class is already resolved on this host (confirmed: letflow_test's
      tenant_template.schema_migrations already contains 20260907020001 -- the ISS-0399
      run's cleanup of stale test databases already applied the fix for that host).

  FIX APPLIED (WF03-ISS0535-20260908):
  - Increased max_connections from 100 to 300 in letflow-2-postgres-1 via
    ALTER SYSTEM SET max_connections = 300 followed by a container restart.
  - Verified: mix test test/letflow/plugs/admission_pipeline_test.exs passes 8/8
    after the connection limit increase.

  NOTE on manifest registration: @tenant_scoped_migration_manifest in
  lib/letflow/tenant_provisioning.ex DOES include 20260907020001 as the last entry
  (confirmed by direct read). No code change was needed or made.

  FUTURE RECURRENCE PREVENTION: the shared Postgres max_connections=300 setting
  is persisted via ALTER SYSTEM (postgresql.auto.conf inside the container volume),
  so it survives future container restarts. A separate anti-patterns.md entry
  documents this class for future sessions.

  ADDENDUM (ORCH, WF03-ISS0534-20260908, a separate/independent host --
  letflow-1-postgres-1, not letflow-2/letflow-3): hit the same
  versions_missing=[20260907020001] signature at essentially the same time,
  from a THIRD distinct cause on a different host than either (1) or (2)
  above -- 25 stale letflow_test* databases (letflow_test, letflow_test1-16,
  letflow_test42/99/165/195/226/901/RV1/validator1) accumulated in
  letflow-1-postgres-1's persisted volume from earlier runs, predating
  migration 20260907020001 (the exact class docs/anti-patterns.md's "Stale
  tenant_template schema surviving a migration-adding commit" entry already
  documents, recurring for a second time on this specific host). True blast
  radius on this host was much larger than admission_pipeline_test.exs's
  5/8: 745 failures across 46 modules. Fix: dropped all 25 stale test
  databases (never letflow_dev), with explicit user approval since the
  auto-mode classifier blocks DROP DATABASE. Confirmed via clean re-run:
  3448/3450 passed, zero versions_missing anywhere, zero AuthPipelineTest
  regressions. This confirms the "stale tenant_template" class (anti-patterns.md)
  and the "shared-Postgres connection exhaustion" class (this issue's own
  root cause 1) are two DISTINCT environmental hazards that can both produce
  the identical versions_missing symptom on different hosts running this
  multi-workspace setup -- worth keeping both root causes on record rather
  than assuming either one alone explains every future recurrence.
