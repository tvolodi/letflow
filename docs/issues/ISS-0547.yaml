id: ISS-0547
title: >
  ConfirmDialog.tsx prop names diverge from design-system.md 7.3
  (description/confirmLabel vs body/confirmText)
discovered_by: CODE-DESIGNER / CODE-DESIGN-VALIDATOR / FRONTEND-DEV
discovered_in_run: WF02-REQ275-20260909
