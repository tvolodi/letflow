description: >
  TEST-RUNNER (WF02-REQ304-20260910, Step 4) hit
  test/letflow/scheduler/poller_test.exs:137 (AC8) failing under 8-way
  parallel scripts/test_parallel.sh: `reloaded.status` expected `"fired"`,
