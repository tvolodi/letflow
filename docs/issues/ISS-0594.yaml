id: ISS-0594
title: service_catalog_test.exs REQ-192 assertion is a latent false-green -- bare substring check now semantically inverted
discovered_by: RELEASE-VALIDATOR
discovered_in_run: WF02-REQ307-20260911
discovered_at: "2026-09-11T03:20:00Z"
severity: MINOR
description: >
  test/letflow/service_catalog_test.exs:588 has a describe block
  "AC10: SolutionPack.service_catalog_entries hard-fail retained,
  REQ-192 named" containing a test "SolutionPack's moduledoc names
  REQ-192 as the owner". The assertion is a bare substring check:
  module_source =~ "REQ-192".

  REQ-307 (2026-09-11) corrected solution_pack.ex's moduledoc bullet
  and the inline comment above check_unsupported_sections/1. They
  previously deferred the service_catalog_entries install policy to
  REQ-192; they now state the policy is UNOWNED, because REQ-192 is
  done and landed the service-catalog route surface without lifting
  the pack restriction.

  The test still passes -- but only because the corrected text happens
  to still contain the literal substring "REQ-192" while now saying
  the OPPOSITE of what the test's name asserts. The assertion claims
  REQ-192 is named as the owner; the source it reads says no
  requirement owns the policy.

  The failure mode is the dangerous direction: a future edit that
  removes the string "REQ-192" entirely -- i.e. one that makes the
  moduledoc MORE correct -- would FAIL this test. A test that fails
  when the code improves is a trap for the next agent, and this one is
  primed.

  test/specs/REQ-191.md:179-182 carries the same stale wording and
  should be corrected alongside it.

  Discovered by RELEASE-VALIDATOR while validating REQ-307. Out of
  that requirement's two-file scope fence (which forbids test
  changes), so reported per ISSUE_QUEUE.md rather than folded in.
  Severity MINOR: the suite is green and correct today, there is no
  current false pass, but the assertion no longer tests what its name
  claims.

  Fix direction: assert the actual present property -- that the policy
  is documented as unowned and the hard-fail is retained -- rather
  than the presence of a requirement-id substring.
affected_files:
  - test/letflow/service_catalog_test.exs
  - test/specs/REQ-191.md
