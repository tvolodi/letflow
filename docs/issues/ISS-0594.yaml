  corrected moduledoc/comment text that now states the
  service_catalog_entries install policy is UNOWNED rather than
  deferred to REQ-192. Corrected test/specs/REQ-191.md's matching stale
  wording in the same change. No lib/ changes. Confirmed the new
  assertion is a genuine pre/post-REQ-307 discriminator (old moduledoc
  text had no "UNOWNED" substring at all) via git log/git show.
  mix test test/letflow/service_catalog_test.exs: 33/33 passed.
  mix compile --warnings-as-errors and mix format --check-formatted:
  clean. SECURITY-REVIEWER skipped (test/spec-doc-only, no tenant-data
  path). REVIEWER PASSED.
