id: ISS-0650
title: Short-text exam questions cannot be answered -- Session.autosave_answer/4's answer_attrs and upsert_answer/6 have no text_answer field at all
discovered_by: FRONTEND-DEV
discovered_in_run: WF02-REQ338-20260913
discovered_at: "2026-09-13T16:55:00Z"
severity: MAJOR
description: >
  Found by FRONTEND-DEV while implementing REQ-338 (candidate exam-taking
  UI): REQ-335's exam-session HTTP routes wrap
  Letflow.Exam.Session.autosave_answer/4, whose answer_attrs type
  (lib/letflow/exam/session.ex line 166) is
  %{question_id, selected_option_ids, time_spent_seconds} -- no
  text_answer field exists anywhere in the input path.

  Confirmed by reading the implementation directly: check_answer_shape/2
  (line 799) for a :short_text question only validates that
  selected_option_ids is EMPTY (count == 0 passes, count > 0 fails) --
  there is no branch that accepts or validates free-text content.
  upsert_answer/6 (line 820) builds its write attrs map with
  session_id/question_id/selected_option_ids/saved_at/time_spent_seconds
  only -- text_answer is never included, so it is always left unset
  regardless of what a caller might try to send.

  Meanwhile lib/letflow/exam/session.ex's own saved_answer type (line
  281-286, added for REQ-335's session-state read route) DOES declare
  text_answer: String.t() | nil, and session_answer.json (REQ-329)
  declares the field in its schema, and REQ-332's Scoring module marks a
  short_text answer pending_manual for human grading -- but there is
  nothing for a human grader to grade, because the candidate's actual
  text was never captured anywhere in the write path.

  This is not a frontend gap: web/'s ExamSessionPage (REQ-338) correctly
  shows a "not yet supported" note for short-text questions rather than
  silently offering a text input that would fail to save, per REQ-338's
  own close-out. The gap is entirely in REQ-332's autosave_answer/4
  implementation.

  FIX DIRECTION: extend answer_attrs to accept an optional text_answer
  field, branch check_answer_shape/2's :short_text case to validate
  text_answer presence/shape instead of (or in addition to) the
  empty-selected_option_ids check, and extend upsert_answer/6 to write
  it. Also confirm submit/3 and the Scoring module's pending_manual path
  correctly reads the now-populated text_answer rather than assuming it
  will always be nil.
affected_files:
  - lib/letflow/exam/session.ex
  - lib/letflow/exam/scoring.ex
  - web/src/pages/exam/ExamSessionPage.tsx
queue_ref: Q-650
github_ref: GH-1356
status: resolved
resolved_by: ORCH
resolved_in_run: fix/ISS-0650-20260914
resolved_at: "2026-09-14T04:13:00Z"
resolution_note: >
  Fixed end to end, backend then frontend.

  Backend (commit 0332bf8f): check_answer_shape/2 -> /3 now validates
  text_answer -- nil or a string for :short_text, must be nil for
  every other question type (hard rejection with
  :answer_shape_invalid, not silent-drop). upsert_answer/6 -> /7
  writes text_answer into session_answer's field_values when present,
  OMITTING the key entirely (not writing an explicit nil) when absent
  -- session_answer.json declares the field required: false but not
  nullable, so an explicit nil fails validation; omission also
  correctly clears a prior answer via Records.update_record/2's
  full-replacement write semantics. Scoring.score_question/2's
  :short_text clause now threads text_answer into the returned
  per_question_score map instead of discarding it, so the
  pending_manual result actually carries something for a human grader
  to grade.

  A companion fix beyond the issue's own listed affected_files was
  required and applied: lib/letflow/routers/exam_sessions.ex's PUT
  .../answers/:question_id route and @autosave_schema had no
  text_answer field in the request-body schema at all -- without it,
  no real HTTP client could ever have reached the fixed backend path.
  REVIEWER confirmed this was a genuine correction to the issue's own
  scope estimate, not scope creep.

  Frontend (commit 696d902e): ExamSessionPage.tsx's static "not yet
  supported" placeholder replaced with a real controlled textarea --
  restores a previously-saved text_answer on load, autosaves on blur
  (guarded against redundant no-op saves), i18n'd in en/ru/kk. New
  tests confirm the real input renders, autosave payload shape,
  restore-on-load, and the i18n-grep guard.

  Pipeline: ELIXIR-DEV (backend) -> SECURITY-REVIEWER PASS (traced
  text_answer through validation before the write path with no
  bypass, verified the omit-vs-nil distinction against
  Records.update_record/2's actual full-replacement semantics,
  confirmed cross-type rejection is real and tested; flagged an
  unbounded text_answer string length as a non-blocking hardening
  note) -> REVIEWER PASS (backend: agreed deferring the length cap is
  correct given existing unbounded-string precedent in the same
  router layer and the global 2MiB body ceiling; confirmed the router
  companion fix was a genuine scope correction) -> FRONTEND-DEV
  (frontend) -> REVIEWER PASS (frontend: confirmed type/shape fidelity
  against the real backend schema, confirmed the no-op guard's
  baseline is correct, confirmed i18n discipline; found and reported a
  genuine narrow edge case -- an anti-cheat forced-submit can discard
  an uncommitted textarea edit that never reached blur -- filed
  separately as ISS-0654 rather than blocking this fix) -> TEST-RUNNER
  confirmed both mix letflow.check and npm run check clean except
  pre-existing environment-only/probabilistic flakes, none touching
  exam or router test paths.
