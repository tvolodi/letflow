id: ISS-0653
title: Query.Cursor.resolved_sort_term/2's :typed_column clause raises KeyError when sorting a promoted entity type by its own promoted business column
discovered_by: ELIXIR-DEV
discovered_in_run: WF03-ISS0651-20260913
discovered_at: "2026-09-13T23:22:12Z"
severity: MINOR
description: >
  Found by ELIXIR-DEV while implementing ISS-0651's Cursor
  keyset-pagination fix for promoted per-type-table entity rows.
  lib/letflow/entities/query/cursor.ex's resolved_sort_term/2
  :typed_column clause (around line 209) resolves a sort column atom
  via Letflow.Entities.Query.Allowlist.typed_columns/0, which only
  enumerates the fixed structural-7 columns (record_id, field_values,
  deleted, entity_def_version, last_event_global_seq, inserted_at,
  updated_at) plus entity_record_latest's own typed columns -- it does
  NOT know about a promoted entity type's own promoted business
  columns (e.g. a tag's name column once promoted). Sorting a
  keyset-paginated query by a genuinely promoted business column
  therefore raises KeyError rather than resolving the column, the same
  class of not-generalized-for-both-shapes defect ISS-0651/ISS-0652
  already found twice in sibling functions (field_grants.ex,
  routers/entities.ex, cursor.ex's own build_next_cursor/2 and
  read_sort_value/2).

  Distinct from ISS-0651's own named scope (build_next_cursor/2 and
  read_sort_value/2 only) -- this is a third function in the same
  module with a related but separate gap. Reproduced narrowly:
  ISS-0651's own regression test had to route its promoted-column sort
  through the :json_field path (an 0023 additive-declare-then-promote
  sequence) specifically to avoid tripping this bug, rather than
  sorting by the promoted column's typed form directly.
affected_files:
  - lib/letflow/entities/query/cursor.ex
queue_ref: Q-653
github_ref: GH-1370
status: resolved
resolved_by: ORCH
resolved_in_run: fix/ISS-0653-20260914
resolved_at: "2026-09-14T02:26:00Z"
resolution_note: >
  Third and final fix in this defect family (after ISS-0651,
  ISS-0652). resolved_sort_term/2's :typed_column clause previously
  did Map.fetch!(Allowlist.typed_columns(), name) unconditionally --
  the fixed structural-7 columns only -- raising KeyError for a
  genuinely promoted business column. Generalized by mirroring an
  ALREADY-REVIEWED-AND-MERGED pattern in a different module,
  Letflow.Entities.Query.Compiler's build_order_by/3: a fixed-7 hit
  keeps the original field(r, ^column_atom) path; a miss builds
  dynamic([r], fragment("?", literal(^name))). read_sort_value/2's
  :typed_column clause gets the same dispatch, falling through to a
  new read_promoted_column_value/2 helper (two-clause %Latest{}/
  plain-map dispatch, matching FieldGrants.redact_item/2's precedent)
  that reads the value from field_values for the cursor-encoding side.

  No new design decision was needed: Compiler had already solved this
  exact same-shaped problem twice (once for filter dynamics, once for
  sorting), so ELIXIR-DEV mirrored the existing, reviewed pattern
  rather than inventing a fourth one.

  SECURITY-REVIEWER independently verified fragment("?", literal(^name))
  is Ecto's own safe identifier-quoting macro (not string
  interpolation), traced name's provenance back to a server-built
  allowlist map derived from the tenant's own stored entity
  definitions (never raw caller input), and confirmed no
  tenant-scoping predicate was touched. REVIEWER confirmed the idiom
  matches Compiler's precedent exactly, confirmed read_promoted_column_value/2
  matches the struct-then-plain-map dispatch already established by
  read_record_id/1 (ISS-0651) and FieldGrants.redact_item/2, and
  grepped the whole module to confirm no fourth instance of this
  defect class remains -- this closes the entire ISS-0651/0652/0653
  defect family in Letflow.Entities.Query.Cursor.

  New regression test proves sorting a keyset-paginated query by a
  promoted business column's real typed/generated-column form (not
  the :json_field fallback) works correctly across three real pages,
  with source: :typed_column explicitly asserted to confirm the
  promoted-column path is genuinely exercised. ELIXIR-DEV verified
  the test reproduces the original KeyError when the fix is reverted.

  Pipeline: ELIXIR-DEV -> SECURITY-REVIEWER PASS -> REVIEWER PASS ->
  TEST-RUNNER confirmed a full mix letflow.check run clean except the
  pre-existing rust-toolchain-absence failures.
