id: ISS-0655
title: "'tag' is an authored, installed pack entity type with no admin screen -- absent from BILIMBAGA_ENTITY_TYPES, so /admin/bilimbaga/tag 404s"
discovered_by: ORCH
discovered_in_run: P5-expansion-survey-20260914
discovered_at: "2026-09-14T09:40:00Z"
severity: MINOR
description: >
  REQ-326 authored TEN entity definitions, tag.json among them
  (priv/packs/bilimbaga/entity_definitions/tag.json: name "tag", one
  field "name", porting FR-BB21's tags table). It installs with the pack
  like every other type.

  But web/src/config/bilimbagaEntities.ts's BILIMBAGA_ENTITY_TYPES lists
  only NINE: category, question, answer_option, question_tag, exam,
  exam_section, exam_question_rule, exam_question_rule_tag,
  exam_manual_question. "tag" is not among them, and that file's own
  header comment says "the nine remaining BilimBaga entity types" while
  enumerating REQ-326's contribution as four -- REQ-326 actually
  authored five, including tag.

  CONSEQUENCE, traced through the code: BilimBagaEntityRoute
  (web/src/pages/admin/bilimbaga/BilimBagaEntityRoute.tsx) calls
  isBilimBagaEntityType(entityType) and, when it returns false, renders
  NotFoundInner instead of EntityCrudPage. So /admin/bilimbaga/tag
  404s. Ten pack entity types are authored and installed; nine are
  reachable through the admin UI. A tenant can hold tag records -- the
  type installs, records write -- with no screen to manage them.

  WHY THIS LOOKS LIKE AN OVERSIGHT RATHER THAN A DECISION: "tag" was
  REQ-336's PILOT entity. web/src/pages/entities/TagListPage.tsx is the
  ~280-line list/create/edit/delete screen that REQ-343 then
  generalized into the entity-agnostic EntityCrudPage. When the pilot
  was generalized, tag was dropped from the wired list rather than
  carried across. TagListPage.tsx still exists but is now referenced
  ONLY in moduledoc prose (bilimbagaEntities.ts:8 and
  EntityCrudPage.tsx:5) -- no route, no import, no render path outside
  its own test file. Nothing in REQ-343's description states an intent
  to exclude tag; it consistently frames the work as "the nine
  remaining".

  EntityCrudPage is entity-agnostic by construction -- it renders
  whatever fields GET /entities/definitions/active/:name returns -- so
  tag needs no special handling. A single list entry would make it work.

  Severity MINOR: no data loss, no security exposure, nothing crashes
  (the route fails closed to a 404). But an authored, installed entity
  type is unmanageable through the UI that exists precisely to manage
  it, and the discrepancy is invisible unless someone counts definition
  files against the config list.

  FIX DIRECTION: add { entityType: 'tag' } to BILIMBAGA_ENTITY_TYPES and
  correct the header comment's "nine"/REQ-326-authored-four arithmetic.
  Then decide TagListPage.tsx's fate explicitly -- either delete it as
  superseded dead code, or state why the pilot is retained; leaving an
  unrouted near-duplicate of EntityCrudPage invites a future reader to
  wire the wrong one. Add a test asserting every admin-manageable entity
  definition has a BILIMBAGA_ENTITY_TYPES entry so the two lists cannot
  silently diverge again -- note session*.json are runtime state, not
  admin-CRUD surfaces, so the test must encode which types are expected
  to be manageable rather than assuming all fifteen definition files.
affected_files:
  - web/src/config/bilimbagaEntities.ts
  - web/src/pages/entities/TagListPage.tsx
