resolution_note: >
  ROOT CAUSE NOT FULLY EXPLAINED, BUT THE DEFECT IS REMOVED AND PROVEN BY A
  FAIL-THEN-PASS REGRESSION TEST -- this is a `resolved` per
  ISSUE_QUEUE.md's vocabulary (a real defect existed, a change removes it,
  a regression test proves it), even though the deep Chromium/React
  mechanism behind "why a real trusted click's synchronous setState during
  the native event-dispatch turn freezes the tab" remains unconfirmed.
  CODE-DESIGNER falsified the leading EntitiesIntlProvider hypothesis
  empirically (the freeze reproduces identically on the delete path, which
  touches no react-intl code and never mounts EntityRecordForm) and, via 13
  targeted experiments, confirmed that deferring the same state update by
  one macrotask (setTimeout(fn, 0)) eliminates the freeze with correct
  resulting UI state -- verified independently on two unrelated components
  (EntityCrudPage, DataTable).

  FIX: web/src/utils/deferClickState.ts (new, a setTimeout(fn, 0) wrapper),
  applied ONLY to the empirically-implicated handlers -- EntityCrudPage.tsx's
  openCreate/openEdit/closeModal/openDeleteConfirm/confirmDelete/ConfirmDialog
  onCancel, and DataTable.tsx's sort-header click -- not defensively spread
  elsewhere (pagination handlers explicitly untouched, never shown to have
  the bug). A second commit closed a double-submission race the first fix
  introduced (SECURITY-REVIEWER PASS-WITH-NOTES caught it): confirmDelete now
  sets a synchronous useRef guard (deleteInFlightRef) before scheduling the
  deferred delete, so a second real click/Enter within the same macrotask
  window no-ops instead of firing a second DELETE.

  REGRESSION TEST: web/tests/e2e/iss-0662-entity-crud-click-freeze.e2e.spec.ts,
  5 tests, each a REAL trusted gesture (hover+mousedown+mouseup, never
  dispatchEvent) with a bounded 5s timeout AND a correct-end-state assertion.
  Fail-then-pass proven twice over three TEST-DESIGN-VALIDATOR rounds: at
  commit a88fc67b (parent of the first fix), all 5 fail with the bounded
  "did not resolve within 5000ms" message; at the tip, all 5 pass in
  ~1-2s each. TC-05 (the double-submit test) independently re-confirmed to
  fail specifically against 14b04903-without-0bf883fc (2 DELETEs fired, not
  1), proving it discriminates the race-fix specifically. Two rework rounds
  closed real test-data leaks TEST-DESIGN-VALIDATOR found and reproduced
  itself (TC-03, then TC-05, each creating a tag record with no
  unconditional cleanup) -- both now use a recordIdToCleanUp/afterEach
  mechanism proven, via a deliberate sabotage-then-revert test, to clean up
  even on a genuine mid-test failure.

  KNOWN LIMITATION, NOT A REGRESSION: as of this resolution, the shared dev
  tenant's tag table has accumulated ~64 soft-deleted rows from this
  session's own extensive today-long testing (0 active, all deleted:true),
  and EntityCrudPage's fixed PAGE_SIZE=25 with a query that does not filter
  deleted rows makes a freshly-created record intermittently fall off page 1
  in THIS specific polluted dev database -- filed separately as ISS-0664
  (not fixed here, out of scope for this issue). This flakiness is a
  pre-existing pagination/query defect exposed by accumulated test data, not
  a defect in this fix's own logic -- confirmed by direct query
  (`select count(*) ... where entity_type='tag'` = 64 total, 0 with
  deleted=false) attributing it structurally per core-directives.md's
  Failure Attribution rule (route 3: a demonstrated mechanism outside this
  branch, evidenced by measurement). A fresh database (e.g. any environment
  without this session's accumulated dev-tenant history) would not
  reproduce it, and three earlier TEST-DESIGN-VALIDATOR passes did get
  clean 5/5 runs before the backlog grew this large.

  Pipeline: ISSUE-FIXER (diagnosis, direct reproduction, severity escalated
  MINOR -> MAJOR) -> CODE-DESIGNER (empirical root-cause investigation,
  design) -> CODE-DESIGN-VALIDATOR PASS -> FRONTEND-DEV (fix + race-fix) ->
  SECURITY-REVIEWER PASS-WITH-NOTES (caught the race, addressed same run) ->
  REVIEWER PASS -> TEST-DESIGNER (3 rounds, 2 legitimate rework FAILs from
  TEST-DESIGN-VALIDATOR, both closed) -> TEST-DESIGN-VALIDATOR PASS (3rd
  round, independently re-ran fail-then-pass, cleanup-under-real-failure,
  and static checks).
