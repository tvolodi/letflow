resolution: >
  Decision 0034 was researched and documented in this run. The ruleset
  configuration was subsequently applied to tvolodi/letflow by ISS-0841
  (2026-09-26): GitHub repository ruleset id 24040748 "main-protection",
  with bypass_mode "pull_request" on actor tvolodi. Bare pushes to main are
  now rejected with GH013. GIT_MERGE.md updated with mechanical enforcement
  notice. See docs/migration/decisions/0034-ruleset-bypass-mode-direct-push-closure.md
  Applied addendum for full verification outputs.
