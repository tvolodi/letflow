status: resolved
resolved_by: CODE-DESIGNER
resolved_in_run: ISS-0679-20260915
resolved_at: "2026-09-15T00:00:00Z"
resolution_note: >
  Decision (c): accept the Latin-1/WinAnsi-only limitation as a deliberate,
  documented product constraint. No dependency change, no font-embedding
  code, no library switch. `lib/letflow/exam/certificate_document.ex`'s
  existing `safe_text_at/3` fallback (`encoding_replacement_character: "?"`)
  stays as the permanent, honest degrade path for non-Latin-1 content --
  REQ-356 already ships this and it was already confirmed non-crashing by
  SECURITY-REVIEWER.

  Reasoning: option (a) (embed a Unicode TrueType font into `pdf`) is not a
  small, well-scoped addition -- see the INVESTIGATION note above; `pdf` has
  no Unicode/CID glyph path at any level, including its "external font"
  loader, so closing this gap means hand-writing a CID-font PDF subsystem,
  disproportionate effort for a MINOR issue with a working fallback already
  in place. Option (b) (switch PDF libraries) has no viable pure-Elixir
  Unicode-capable candidate; the one Unicode-capable option, `chromic_pdf`,
  was already rejected by decision 0033 for an operational reason (a
  required Chrome/Chromium binary) unrelated to and unaffected by this
  finding, so reopening 0033 to reverse that choice over a MINOR gap is not
  proportionate.

  Recorded as a formal addendum to decision 0033 (not an in-place edit to
  signed decision text, per this project's addendum convention) --
  `docs/migration/decisions/0033-pdf-qr-rendering-dependencies.md`'s
  "Addendum (2026-09-15, ISS-0679)" section carries the full investigation,
  the decision, and the trigger for revisiting: if/when a tenant actually
  issues certificates to real kk/ru candidates in production (not merely a
  declared exam-pack locale) and the "?"-degraded rendering is reported as a
  genuine user-facing problem, re-open that addendum and re-cost both the
  hand-built CID-font approach and the pure-Elixir PDF-library ecosystem at
  that later date.
