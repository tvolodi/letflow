id: ISS-0679
title: "pdf library (decision 0033) has no Unicode/non-Latin-1 glyph path -- Cyrillic (kk/ru) certificate content degrades to question-mark rather than rendering"
discovered_by: REVIEWER
discovered_in_run: WF02-REQ356-20260915
discovered_at: "2026-09-15T04:40:57Z"
severity: MINOR
description: >
  Discovered by REVIEWER during REQ-356's close-out review. The `pdf` hex
  package chosen by decision 0033 only supports WinAnsi/Latin-1 text
  (bundled Type-1 AFM fonts, no Unicode/CID path). A certificate rendered
  for a candidate name, exam title, or branding text containing Cyrillic
  characters (kk/ru locales) degrades each such glyph to a literal
  question-mark character rather than crashing -- confirmed as a genuine
  graceful-degradation code path (lib/letflow/exam/certificate_document.ex,
  safe_text_at/3 and its moduledoc), not a crash risk, by SECURITY-REVIEWER
  during REQ-356's review.

  Non-blocking for REQ-356 itself (documented explicitly in the module's
  moduledoc, not silently swallowed), but reopens decision 0033's
  evaluation criteria -- glyph coverage was never assessed when `pdf` was
  chosen -- for this vertical's actual kk/ru locale needs, which the
  platform otherwise supports (see i18n catalogs elsewhere in the
  codebase).

  FIX DIRECTION: embed a Unicode/CID-capable TrueType font into the `pdf`
  library's rendering path (if the library supports custom font
  embedding), or choose a different PDF-rendering approach/library with
  real Unicode support, or explicitly decide non-Latin certificate
  rendering is out of scope for now and document that as a real product
  decision rather than a silent gap.

  INVESTIGATION (2026-09-15, CODE-DESIGNER): read `deps/pdf/lib/pdf/text.ex`
  and `deps/pdf/lib/pdf/external_font.ex` directly, not just the finding's
  prose. `Pdf.Text.normalize_string/2` unconditionally routes every string
  through `Pdf.Encoding.WinAnsi.encode/2` with no alternate path. The
  library's ONE "load a different font" mechanism, `Pdf.ExternalFont.load/1`,
  is NOT a Unicode/TrueType embedding path either: it parses an AFM metrics
  file plus a `.pfb` Type-1 font-program binary (an opaque byte blob, no
  glyph-table parsing) and `font_dictionary/3` hardcodes
  `Encoding: WinAnsiEncoding` with single-byte `first_char`/`last_char` (0-255).
  There is no `Type0`/`CIDFontType2` construction, no `Identity-H` two-byte
  encoding, no `ToUnicode` CMap, no TrueType `cmap`/`glyf`/`loca` parsing
  anywhere in `pdf` 0.8.2. Real Cyrillic rendering through this library would
  require hand-building a CID-font subsystem from scratch (TrueType table
  parsing, a `Type0` font dictionary, a `W` widths array, a `ToUnicode` CMap,
  two-byte content-stream text operators bypassing `Pdf.Page.text_at/4`
  entirely) -- exactly the class of PDF-internals complexity decision 0033's
  own §5(a) already rejected building in-house, at a smaller but still real
  scale. No viable pure-Elixir Unicode-capable PDF library alternative was
  found either; the one Unicode-capable option on the market, `chromic_pdf`,
  was already rejected in 0033 §2 for an unrelated operational reason (a
  Chrome/Chromium binary in every runtime environment) that this finding does
  not change, making a library switch disproportionate churn to reverse a
  signed decision over a MINOR font-coverage gap.
affected_files:
  - lib/letflow/exam/certificate_document.ex
  - docs/migration/decisions/0033-pdf-qr-rendering-dependencies.md
