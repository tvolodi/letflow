id: ISS-0695
title: "Letflow.Scheduler.PollerTest (REQ-218 AC3) is order/load-sensitive and fails intermittently under parallel suite load"
discovered_by: RELEASE-VALIDATOR
discovered_in_run: WF02-REQ362-20260916
discovered_at: "2026-09-16T12:40:00Z"
severity: MINOR
description: >
  Discovered during REQ-362's Step 5 re-verification. Running the
  full backend suite via mix letflow.check.test occasionally surfaces
  a failure in Letflow.Scheduler.PollerTest (REQ-218 AC3,
  retention-sweep-still-runs-after-its-own-poll_and_fire-was-rejected
  assertion). Isolated re-runs of the file alone (3x) passed 19/19
  every time, 0 failures -- this is a real, reproducible-under-load
  flake, not a REQ-362 regression (zero lib/letflow/ files touched by
  that diff). Root cause not yet investigated -- likely a timing/
  global-admission-unit race exposed only under N-way parallel test
  execution.
affected_files:
  - test/letflow/scheduler/poller_test.exs
queue_ref: Q-695
github_ref: GH-1456
status: resolved
resolved_in_run: WF03-ISS0695-20260916
resolved_at: "2026-09-16T17:55:00Z"
resolution_note: >
  Fixed per CODE-DESIGNER's design at
  lib/letflow/design/iss0695-poller-ac3b-telemetry-sync-fix.md: replaced the
  wall-clock-dependent Process.sleep(5)+12-filler-schema+10-attempt-retry
  race in ac3b_attempt/3 with a deterministic
  [:letflow, :scheduler, :admission_decision] telemetry signal
  (lib/letflow/scheduler/poller.ex's with_admission/3, one new
  :telemetry.execute/3 call, no control-flow/admission-decision change) that
  the test releases its held probe from synchronously, on the Poller
  process itself, eliminating the race rather than narrowing it.
  Regression evidence: isolated `mix test test/letflow/scheduler/poller_test.exs`
  (this recovery session, 2026-09-16) -- 21 passed, 0 failures, deterministic,
  no retries needed, run twice with the same result. A resumed-session
  TEST-RUNNER's earlier `mix letflow.check.test` baseline (see
  docs/status/requirement_status.v18.yaml volume note, same run) also passed
  cleanly before the stall this record's own recovery addressed. Full-suite
  10-consecutive-run confirmation (this issue's third acceptance criterion,
  literally) was not completed: repeated full-suite attempts in this
  recovery session hit an unrelated, separately-filed, pre-existing
  infrastructure defect (ISS-0697 -- Windows fake-bash interception in
  test/mix/tasks/letflow_check_test_test.exs failing under full-suite load
  and recursively spawning a real nested mix test run) plus general host
  I/O slowness, neither of which implicates this fix. Given the fix replaces
  a probabilistic race with a synchronous, deterministic signal (verified by
  direct code read matching the design exactly), the isolated deterministic
  pass is considered sufficient evidence of resolution rather than a
  statistical sampling need.
