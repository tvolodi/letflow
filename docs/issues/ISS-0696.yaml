description: >
  Discovered during REQ-362's Step 5 re-verification. Ran the full
  frontend vitest unit suite 5 times: 4/5 runs showed only the known
  pre-existing ISS-0694 failure (bilimbagaEntities.test.ts); 1/5 runs
  additionally showed
  web/src/pages/exam/__tests__/ExamSessionPage.test.tsx failing.
  Isolated re-run of that file alone passed 22/22, and it passes on
  main too. Root-caused to test-file worker-distribution
  nondeterminism (vitest's parallel worker pool), not to REQ-362's new
  visual-baseline.test.ts (verified to contain zero mocks/globals/fake
  timers via grep and full read) or to any bug in
  ExamSessionPage.test.tsx's own assertions. Not reliably reproducible
