pipeline_log:
  - step: ISSUE-FIXER
    at: "2026-09-17T06:45:00Z"
    result: >
      Root-caused live: a genuine React effect-ordering race, not shared
      module state. ExamSessionPage.tsx's textDraft state synced via a
      useEffect that commits one render cycle after the textarea first
      appears; under full-suite vitest scheduler jitter, a forced-blur
      anti-cheat signal can fire before that effect commits, so
      maybeSaveDraft sees a stale empty draft and wrongly calls
      saveAnswer. Reproduced live on run 10/12
      ("expected \"spy\" to not be called at all, but actually been
      called 1 times", called with text_answer: ""). Confirmed no
      module-level singleton/global state involved.
  - step: CODE-DESIGNER
    at: "2026-09-17T07:05:00Z"
    result: >
      PASS. Design: lib/letflow/design/iss-0696-examsessionpage-race-fix.md.
      Component-side fix chosen over test-side waitFor -- derive textDraft
      during render (guarded by new textDraftQuestionId state) instead of
      via effect, removing the race for real users too. No test-file
      changes needed.
  - step: CODE-DESIGN-VALIDATOR
    at: "2026-09-17T07:12:00Z"
