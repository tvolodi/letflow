description: >
  Discovered during REQ-360 (author the platform-admin login-routing UAT
  scenario using REQ-358's branching construct). web/src/auth/ProtectedRoute.tsx
  never renders an in-app login form -- on unauthenticated it redirects the
  whole page to Keycloak's externally-hosted login UI, showing only a
  "Redirecting to login..." placeholder first. Grepping for
  LoginPage/LoginForm across web/src found zero matches.

  This contradicts REQ-360's own Why-section framing, which assumed "the
  login form with its actual field set" would be an in-app, testable
  surface. The real behaviour is documented as such (not papered over) in
  test/fixtures/uat/scenarios/platform/platform-login-routing-by-role.yaml's
  unauthenticated branch, which asserts a redirect to the Keycloak-hosted
  login UI rather than an in-app form.
