status: resolved
resolved_in_run: WF03-ISS0703-20260917
resolved_at: "2026-09-17T09:55:47Z"
resolution_summary: >
  Root cause fixed: Letflow.Oidc.TokenVerifier.Oidcc.verify_bearer_token/2
  (lib/letflow/oidc/token_verifier/oidcc.ex) now catches exceptions raised
  by the underlying Oidcc/jose JWT-parsing chain on a malformed/non-JWT-shaped
  bearer token and returns {:error, reason} instead of letting the exception
  escape uncaught, so Letflow.Plugs.AuthPipeline.verify_token/1's existing
  {:error,_} -> 401 Problem+JSON path handles it (matching the pipeline's
  documented single-401-collapse design intent) instead of crashing to a
  raw HTTP 500 with an empty body. Proven by a fail-then-pass regression
  test at test/letflow/integration/keycloak_auth_pipeline_test.exs
  exercising the real Oidcc.Token.validate_jwt/3 path (not the
  TokenVerifierDouble) with a non-JWT-shaped Authorization value.
  Independently re-verified by TEST-DESIGN-VALIDATOR and confirmed clean
  by a full `mix test` run (4334/4335, only the pre-existing unrelated A9
  drift failing).
