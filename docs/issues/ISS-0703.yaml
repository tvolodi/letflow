id: ISS-0703
title: >
  QA regression: PLATFORM_ADMIN token now gets HTTP 500 from
  /api/v1/tenants, /api/v1/identity/users, /api/v1/health
discovered_by: UAT-RUNNER
discovered_in_run: WF02-REQ360-20260917
discovered_at: "2026-09-17T01:42:41Z"
severity: MAJOR
description: >
  Discovered live during REQ-360's WF-05 UAT run (2026-09-17,
  test/uat-reports/uat-2026-09-17-WF02-REQ360-20260917.yaml) against
  https://qa.bizdala.com. A real Keycloak password-grant token for
  admin-user (realm_access.roles=["PLATFORM_ADMIN"], confirmed by decoding
  the JWT) got HTTP 500 with an empty body from GET /api/v1/tenants, GET
  /api/v1/identity/users, and GET /api/v1/health -- reproducible on retry.
  The identical call with the identical role one day earlier (REQ-358's own
  QA run, 2026-09-16) got HTTP 200 with well-formed bodies. A non-admin
  operator-user token against the same endpoints on the same day got
  well-formed 403/403/404 responses (not 500), so this appears isolated to
  the PLATFORM_ADMIN-authenticated path specifically, not a blanket QA
  outage.

  Needs ISSUE-FIXER triage against the live QA instance and/or its recent
  deploys.

  RESOLUTION NOTE (WF03-ISS0703-20260917): the filing's framing above --
  a PLATFORM_ADMIN-specific regression tied to a merged commit between
  2026-09-16 and 2026-09-17 -- was NOT supported by the evidence found
  during diagnosis (see handoffs/WF03-ISS0703-20260917/step-01-issue-fixer-diagnosis.json
  for the full trace). Live QA container logs showed the three crashing
  requests each carried a malformed Authorization header -- the caller
  sent the entire raw Keycloak token-endpoint JSON response as the bearer
  value instead of extracting `.access_token` -- not a role-specific code
  path. No commit in the 09-16..09-17 window touched the auth/oidc code
  path, and the QA app container had not restarted or redeployed since
  2026-09-15, so no merged-commit regression could explain it; the 500
  was not reproducible with a well-formed PLATFORM_ADMIN token at
  diagnosis time. That investigation did surface a real, independently
  confirmed, now-fixed code defect: Letflow.Oidc.TokenVerifier.Oidcc.verify_bearer_token/2
  let an exception escape uncaught when given ANY malformed/non-JWT-shaped
  bearer token (reachable by any client, not just this specific mistake),
  producing a raw HTTP 500 with an empty body instead of the documented
  single-401-collapse behavior. This is the defect actually fixed and
  recorded as resolved below.
affected_files:
  - lib/letflow/oidc/token_verifier/oidcc.ex
  - lib/letflow/plugs/auth_pipeline.ex
related_requirements:
