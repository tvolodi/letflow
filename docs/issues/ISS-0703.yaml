id: ISS-0703
title: >
  QA regression: PLATFORM_ADMIN token now gets HTTP 500 from
  /api/v1/tenants, /api/v1/identity/users, /api/v1/health
discovered_by: UAT-RUNNER
discovered_in_run: WF02-REQ360-20260917
discovered_at: "2026-09-17T01:42:41Z"
severity: MAJOR
description: >
  Discovered live during REQ-360's WF-05 UAT run (2026-09-17,
  test/uat-reports/uat-2026-09-17-WF02-REQ360-20260917.yaml) against
  https://qa.bizdala.com. A real Keycloak password-grant token for
  admin-user (realm_access.roles=["PLATFORM_ADMIN"], confirmed by decoding
  the JWT) got HTTP 500 with an empty body from GET /api/v1/tenants, GET
  /api/v1/identity/users, and GET /api/v1/health -- reproducible on retry.
  The identical call with the identical role one day earlier (REQ-358's own
  QA run, 2026-09-16) got HTTP 200 with well-formed bodies. A non-admin
  operator-user token against the same endpoints on the same day got
  well-formed 403/403/404 responses (not 500), so this appears isolated to
  the PLATFORM_ADMIN-authenticated path specifically, not a blanket QA
  outage.

  Needs ISSUE-FIXER triage against the live QA instance and/or its recent
  deploys.
