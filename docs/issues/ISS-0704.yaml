description: >
  Discovered during REQ-360's WF-02 Step Final full `mix test` run
  (2026-09-17, feature/WF02-REQ360-20260917). test/letflow/routers/tenants_test.exs:356
  ("GET /tenants as PLATFORM_ADMIN lists tenants in the paginated
  allowlisted shape") failed -- 4327/4328 tests passed, this one failed.
  Structurally cleared as pre-existing/unrelated to REQ-360's own diff:
  `git diff --name-only origin/main...HEAD` for that branch touched only
  docs/, lib/letflow/design/, test/fixtures/uat/, and test/uat-reports/ --
  neither the failing test module nor lib/letflow/routers/tenants.ex appear
  in that diff.

  Likely cause per ELIXIR-DEV's own hypothesis (not yet confirmed): tenant-
  fixture accumulation past the paginated LIMIT 51 in the shared test DB
  across the full suite's accumulated state. Needs ISSUE-FIXER triage to
  confirm rather than assume, and reproduction.
