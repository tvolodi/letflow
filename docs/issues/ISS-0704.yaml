resolution: >
  Root cause confirmed by ISSUE-FIXER: the "lists tenants in the paginated
  allowlisted shape" test issued an unscoped `GET /` request that
  deterministically fails once 129+ orphaned real tenant rows (leaked by a
  separate, unrestored global `Ecto.Adapters.SQL.Sandbox.mode(Letflow.Repo,
  :auto)` flip elsewhere in the suite -- see follow-up ISS-0705) fill page 1
  ahead of the test's own fixture. Fixed by scoping the request to
  `GET /?search=<fixture's own slug>`, mirroring the neighboring "search
  filters by slug/display_name substring" test's existing pattern -- no
  production code changed.

  Design doc: lib/letflow/design/iss0704-tenants-pagination-test-scoping-fix.md
  Implementation commit: 549c4bec (fix(ISS-0704): scope pagination test to
  fixture's own slug via search)
  Docs commit: 1292527e (docs(ISS-0704): record git-checkout-restore pitfall
  found during Step 4 verification)

  Gates passed: CODE-DESIGN-VALIDATOR (PASS), SECURITY-REVIEWER (PASS, out of
  scope -- test-only change), REVIEWER (PASS), TEST-DESIGNER +
  TEST-DESIGN-VALIDATOR both independently reproduced fail-then-pass,
  TEST-RUNNER ran the full suite: 4331/4331 passed, 0 failures.

  The underlying pollution mechanism (the unrestored Sandbox.mode(:auto)
  flip itself, and the 129+ already-orphaned rows it left behind) is
  DELIBERATELY NOT fixed by this run -- it is filed as its own issue,
  ISS-0705 (docs/issues/ISS-0705.yaml), per REVIEWER's own flag that this
  needs to be claimable work rather than a design-doc recommendation.
