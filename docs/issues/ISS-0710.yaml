status: resolved
resolved_by: ORCH
resolved_in_run: WF02-REQ364-20260917
resolved_at: "2026-09-17T23:56:00Z"
resolution_note: >
  Fixed directly on feature/WF02-REQ364-20260917 (the branch this defect
  was blocking) rather than a separate WF-03 pipeline, given how trivial
  the change is (one-line default-argument removal). Removed the dead
  default from draft_attrs/1 (defp draft_attrs(overrides), no \\ %{}).
  Verified: mix compile --warnings-as-errors clean, mix test
  test/letflow/help_test.exs 55/55, mix letflow.check.test re-run clean
  (no "default values for the optional arguments" warning).
