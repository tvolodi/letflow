id: ISS-0711
title: >
  PlatformDashboardPage tile-tenant-count always renders 0 -- GET
  /api/v1/tenants has no total field
discovered_by: UAT-RUNNER
discovered_in_run: WF02-REQ369-AC6AC7-20260918T143000Z
discovered_at: "2026-09-18T14:30:00Z"
severity: BLOCKER
description: >
  Found during letflow-queue task 708 (REQ-369) AC6 re-verification, running
  a real Keycloak-redirect PLATFORM_ADMIN login against live QA and capturing
  a fresh screenshot (see
  test/uat-reports/uat-2026-09-18-WF02-REQ369-AC6AC7-20260918T143000Z.yaml,
  real_oidc_verification / new_finding_tenant_count_bug sections).

  web/src/pages/dashboard/PlatformDashboardPage.tsx line 61 renders
  `String(tenantsQuery.data?.total ?? 0)` -- it reads a `.total` field.
  web/src/api/tenants.ts line 19 declares `TenantListResponse.total: number`,
  but the real backend response shape (lib/letflow/api/pagination.ex's
  `Pagination.page_response/2`, `@derive {Jason.Encoder, only: [:items,
  :next_cursor, :count]}`, used by lib/letflow/routers/tenants.ex's tenant
  list route) is `{items, next_cursor, count}` -- there is no `total` key
  anywhere in the real response. `.total` is therefore always `undefined`
  and the `?? 0` fallback fires unconditionally, independent of how many
  tenants actually exist.

  Confirmed live against QA, not inferred: obtained a real admin-user token
  via direct Keycloak password-grant, then
  `curl -H "Authorization: Bearer <token>" https://qa.bizdala.com/api/v1/tenants`
  returned `{"items":[{"display_name":"Default Tenant",...},
  {"display_name":"BilimBaga",...}],"next_cursor":null,"count":2}` -- the
  real, live tenant count is 2. The screenshot captured the same run shows
  the TENANTS tile rendering "0".

  This directly contradicts REQ-369's own scenario EO-001 detail text
  ("tile...populated from the real GET /api/v1/tenants endpoint's 'total'
  field") and AC6's explicit "real tenant count rendered" wording.
affected_files:
  - web/src/pages/dashboard/PlatformDashboardPage.tsx
  - web/src/api/tenants.ts
related_requirements:
  - REQ-369
related: []
severity_rationale: >
  BLOCKER for REQ-369's AC6 specifically ("real tenant count rendered") --
  a real, reproducible product defect (frontend/backend field-name contract
  mismatch), not a test artifact or flake. Does not block AC6's other
  clauses (routing, heading, nav all independently confirmed correct).
fix_direction: >
  CODE-DESIGNER/ELIXIR-DEV or FRONTEND-DEV to decide which side of the
  contract is authoritative and fix the mismatch: either (a) the backend
  Pagination envelope gains a genuine `total` field distinct from `count`
  (meaningful if tenant listing is ever paginated below the full set), or
  (b, more likely correct today, since `count` is already `length(items)`
  and the tenant list is small/unpaginated in practice) the frontend
  `TenantListResponse` type and `PlatformDashboardPage`'s tile read `count`
  instead of `total`. Whichever is chosen, add a regression test asserting
  the tile renders the mocked/real count field actually returned by the API
  (per REQ-369's own AC2, which mocked `total` and therefore did not catch
  this). After the fix, dispatch UAT-RUNNER for a re-verification pass
  against live QA to confirm the tile shows the real count before REQ-369's
  AC6 can be marked done.
queue_ref: Q-711
github_ref: GH-1519
status: resolved
resolution_note: >
  Full pipeline PASSed: CODE-DESIGNER/CODE-DESIGN-VALIDATOR (design fixed on
  its 2nd attempt), FRONTEND-DEV, SECURITY-REVIEWER, REVIEWER, TEST-DESIGNER,
  TEST-RUNNER, RELEASE-VALIDATOR ("Clearing ISS-0711 for DOC-UPDATER to flip
  status and for merge."). Real commits: 68127f70 (CODE-DESIGNER's design,
  addressing CODE-DESIGN-VALIDATOR's first-round findings), 80cd88d1
  (FRONTEND-DEV implementation), aaa2550e (TEST-DESIGNER's test spec, with a
  real fail-then-pass verification -- confirmed failing against the old code
  before the fix, passing after), 9b2729f1 (TEST-RUNNER's report, all
  frontend gates PASS).

  Fix: web/src/api/tenants.ts's TenantListResponse type corrected from the
  fictitious `{total}` field to the real backend envelope shape
  `{items, next_cursor, count}` (matching lib/letflow/api/pagination.ex's
  Pagination.page_response/2 exactly). web/src/pages/dashboard/
  PlatformDashboardPage.tsx's tile-tenant-count now reads `count` instead of
  the always-undefined `total`. Per CODE-DESIGN-VALIDATOR's explicit ruling,
  the fix's scope was bundled to also migrate web/src/pages/admin/tenants/
  TenantsPage.tsx to cursor-based pagination (matching AuditLogPage.tsx's
  existing precedent) -- TenantsPage.tsx shared the same stale
  TenantListResponse type and had its own latent, related pagination bug not
  named in this issue's original affected_files, closed here as part of the
  same type-contract fix rather than left for a separate issue.

  This fix unblocks REQ-369's AC6 ("real tenant count rendered") but does
  NOT itself flip REQ-369 to done -- REQ-369 needs a fresh UAT-RUNNER
  re-verification pass against live QA to confirm the tile now actually
  renders the real count (2, per ISS-0711's own live-QA confirmation), which
  is separate follow-up work. As of this resolution, REQ-369's
  docs/requirements.yaml status is still `blocked` (unchanged by this step)
  -- see its close_out_note for AC6/AC7's precise remaining-work pointer,
  which now additionally needs ISS-0711 cited as resolved.
