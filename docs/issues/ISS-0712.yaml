id: ISS-0712
title: >
  platform-login-routing-by-role pipeline_test cannot exercise REQ-369's
  redirect -- shared login helper bypasses real OIDC callback
discovered_by: UAT-RUNNER
discovered_in_run: WF02-REQ369-AC6AC7-20260918T143000Z
discovered_at: "2026-09-18T14:30:00Z"
severity: MAJOR
description: >
  Found during letflow-queue task 708 (REQ-369) AC7 re-verification (see
  test/uat-reports/uat-2026-09-18-WF02-REQ369-AC6AC7-20260918T143000Z.yaml,
  new_finding_login_mechanism_gap section).

  web/tests/e2e/pipelines/platform-login-routing-by-role.pipeline.e2e.spec.ts
  uses web/tests/e2e/helpers.ts's `loginWithToken`, which authenticates by
  writing a session object directly into sessionStorage via `addInitScript`
  and navigating straight to `/` -- it deliberately bypasses Keycloak's real
  hosted-login-page redirect and the app's own `/auth/callback` route
  entirely (per helpers.ts's own module comment: "the token-based login page
  has been removed... tests authenticate by... injecting the session").

  REQ-369's role-conditional redirect
  (`navigate(payload.roles.includes('PLATFORM_ADMIN') ? '/platform-dashboard' : '/', ...)`)
  lives ONLY inside web/src/pages/OidcCallbackPage.tsx's one-time useEffect
  (line 72), which runs solely during the real `/auth/callback` OIDC
  exchange -- confirmed by reading the source directly, and by grepping
  router.tsx for PLATFORM_ADMIN (only the route registration is found, no
  redirect guard elsewhere). Session-injection login therefore structurally
  can never reach the code path this scenario's EO-001 needs to prove.

  Confirmed live, not guessed: running the pipeline_test with a real,
  correct PLATFORM_ADMIN credential (fetched via
  ai-dala-infra/scripts/qa-login.sh) still produced a genuine FAIL --
  `expect(page).toHaveURL('/platform-dashboard')` received
  "https://qa.bizdala.com/" instead. This is a test-design gap, not a
  product defect: the real product behavior was independently proven
  correct in the same run via a genuine Keycloak-redirect login (a
  throwaway, uncommitted spec that drove the real hosted login form), which
  landed on /platform-dashboard with all expected content rendered.

  Secondary finding in the same file: helpers.ts's
  `getKeycloakToken`/`loginWithToken` hardcode `'admin-pass'`/`'worker-pass'`
  as literal default arguments, not sourced from any secret store or env
  var. Real QA passwords are never those literals (confirmed 401
  invalid_grant against them in a prior run,
  test/uat-reports/uat-2026-09-18-WF02-REQ369-20260918.yaml) -- this forced
  this run's UAT-RUNNER to make a temporary, reverted, uncommitted edit to
  read from `process.env.UAT_QA_ADMIN_PASSWORD` instead, just to complete
  the run.
affected_files:
  - web/tests/e2e/pipelines/platform-login-routing-by-role.pipeline.e2e.spec.ts
  - web/tests/e2e/helpers.ts
related_requirements:
  - REQ-369
related:
  - ISS-0711
severity_rationale: >
  MAJOR -- blocks REQ-369's AC7 (re-run the named scenario "for real against
  QA" via its own pipeline_test) from ever producing a genuine PASS,
  regardless of credential correctness, until fixed. Not a BLOCKER on
  product functionality itself: the real routing behavior is independently
  proven correct by this same run's throwaway real-OIDC verification.
fix_direction: >
  TEST-DESIGNER: give the PLATFORM_ADMIN case of
  platform-login-routing-by-role.pipeline.e2e.spec.ts its own real-redirect-
  based login (drive Keycloak's hosted login form directly -- navigate with
  no session, wait for the off-origin redirect, fill Keycloak's own
  #username/#password fields, submit, wait for the redirect back through
  /auth/callback) rather than sharing helpers.ts's session-injection
  `loginWithToken`, so the case can actually exercise
  OidcCallbackPage.tsx's role-conditional redirect. Separately, add an
  env-var credential path to helpers.ts (e.g. read
  `process.env.UAT_QA_ADMIN_PASSWORD`/`UAT_QA_WORKER_PASSWORD` when
  `E2E_BASE_URL` points at a non-local environment, falling back to the
  existing local-dev literals otherwise) so a real environment run never
  needs an ad-hoc, reverted source edit to supply a real credential. After
  both fixes land, dispatch UAT-RUNNER to re-run
  test/fixtures/uat/scenarios/platform/platform-login-routing-by-role.yaml's
  PLATFORM_ADMIN branch for real against QA via the fixed pipeline_test
  before REQ-369's AC7 can be marked done.
