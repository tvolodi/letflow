id: ISS-0716
title: >
  ColumnPromotionTest AC1 flaky: :all-scoped tenant query picks up rows left
  by a concurrently-scheduled test
discovered_by: TEST-RUNNER
discovered_in_run: WF02-REQ370-20260918
discovered_at: "2026-09-18T18:59:02Z"
severity: MINOR
description: >
  Discovered by TEST-RUNNER during an unrelated WF02-REQ370-20260918 full-suite
  run -- test/letflow/tenant_provisioning/column_promotion_test.exs was not
  touched by any commit on that branch, confirming this is pre-existing
  test-isolation flakiness, not a regression introduced by REQ-370's own diff.

  Letflow.TenantProvisioning.ColumnPromotionTest's AC1 test calls
  `TenantProvisioning.register_column_promotion("invoice", "amount", %{...},
  :all)` and asserts the resolved tenant ids equal exactly
  `Enum.sort([tenant_a, tenant_b])` (2 ids) -- but one full-suite run observed
  4 tenant ids on disk, 2 extra rows not accounted for by this test's own
  setup.

  TEST-RUNNER's OWN original finding (verbatim from its queue-task filing,
  preserved here rather than silently upgraded to a later, more confident
  diagnosis) explicitly flagged this as: "Lower confidence than a typical
  pre-existing finding: could not pin an exact external mechanism (e.g. a
  specific sibling test that leaves rows), only the structural exposure (no
  sandboxing + :all-scoped query). Needs investigation to confirm root cause
  and either add proper isolation/cleanup or scope the query more precisely."
  That investigation is exactly what ISSUE-FIXER's dispatch (below) performed
  -- the structural-exposure hypothesis is now confirmed as the actual
  mechanism, not merely a suspicion, but no single deterministic culprit test
  was pinned (see below), consistent with TEST-RUNNER's own original framing.

  Root cause diagnosed by ISSUE-FIXER (WF03-ISS0716-20260918): the test file's
  `provisioned_tenant()` fixture calls
  `Letflow.Test.SandboxAutoMode.provision!/2` (test/support/sandbox_auto_mode.ex)
  twice per test run. That helper sets the DB sandbox to global `:auto` mode
  for the duration of tenant provisioning (a real Postgres round trip:
  tenant insert, schema provisioning, migration replay, event-type seeding) --
  `Sandbox.mode/2` is pool-wide, not scoped to the calling process. Any OTHER
  concurrently-scheduled test process's writes committed during that window
  commit for real instead of rolling back, invisible to this test's own
  on_exit cleanup (which only knows about tenant_a/tenant_b).
  `TenantProvisioning.register_column_promotion/4`'s `:all` scope resolves via
  `list_registrations/0`, an unscoped `Repo.all(Registration)` -- production-
  correct behavior (querying "every current registration"), not a defect.
  So the assertion's own exact-equality expectation is what's wrong, not the
  production code.

  This is the same root-cause family as ISS-0580 (resolved 2026-09-10,
  lib/letflow/design/iss0580-sandbox-auto-mode-restore-leak.md) -- that fix
  closed the *unbounded* leak (sandbox mode never restored); this issue is the
  *residual bounded* window ISS-0580's own design doc flagged as still open,
  not a recurrence of the same bug. 10+ other test files also use
  SandboxAutoMode (audit_capture_test.exs, audit_test.exs,
  role_registry_test.exs, repository_test.exs, engine_concurrency_test.exs,
  audit_dispositions_test.exs, routers/identity_test.exs,
  task_completed_backfill_test.exs, entities/records_test.exs,
  routers/tenants_test.exs) -- any of these, or any other tenant-creating
  test scheduled concurrently, is a plausible contributor. No single
  deterministic culprit test was found or expected to exist, consistent with
  genuine scheduling-dependent flakiness rather than a fixed collision.
affected_files:
  - test/letflow/tenant_provisioning/column_promotion_test.exs
related:
