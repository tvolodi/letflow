severity_rationale: >
  BLOCKER -- breaks real end-user login for the entire QA environment, not
  only PLATFORM_ADMIN or REQ-369's own scope. Directly blocks REQ-369's AC6
  (real PLATFORM_ADMIN login, real tenant count rendered) and AC7 (named
  pipeline_test re-run against QA), both reproduced FAIL twice with a
  precisely traced root cause.
fix_direction: >
  Almost certainly an infra/deployment env-var gap on the QA app service:
  BPM_IDP_BASE_URL (or KEYCLOAK_BASE_URL) is not set, or set incorrectly, on
  the live QA container/process -- most likely introduced or exposed by the
  recent docker-compose.qa.yml / image-tag redeploy work (ISS-0717/T-0134).
  Route to infra/deployment triage to inspect the actual QA
  docker-compose.qa.yml / env file on ubuntu-16gb-nbg1-1 and confirm/fix
  BPM_IDP_BASE_URL (expected: https://auth.qa.bizdala.com), then redeploy and
  re-verify GET /api/tenant-config's oidc_authority directly. Only once fixed
  and confirmed live should UAT-RUNNER re-attempt REQ-369's AC6/AC7
  re-verification (queue task 708).
