id: ISS-0724
title: >
  Letflow.Exam.Session resolved_question maps from random vs manual origin
  are structurally indistinguishable after concatenation
discovered_by: REVIEWER
discovered_in_run: WF03-ISS0722-20260919
discovered_at: "2026-09-19T06:10:00Z"
severity: MINOR
tags:
  - exam
  - type-safety
description: >
  Found during REVIEWER's idiom/scope gate on PR #1564 (ISS-0722's own fix
  for exam_question_rule mode "manual" being silently dropped).
  materialize_session/5 (lib/letflow/exam/session.ex ~lines 711-736)
  concatenates resolved_random (from QuestionSetResolver.resolve/5) and
  resolved_manual (from the new fetch_manual_questions/2 path) into one
  untagged list of identically-shaped maps (question_id, options_order,
  sort_order) before a single Enum.with_index/1 re-indexing pass. Verified
  correct as implemented for ISS-0722's own fix -- but once concatenated,
  nothing in the type system distinguishes manual-origin rows (which must
  never be reordered/reshuffled per design
  lib/letflow/design/iss0722-exam-manual-question-mode.md section 4.1) from
  random-origin rows (which legitimately get shuffled upstream). A future
  refactor of this function could silently violate that invariant with no
  compiler/dialyzer signal, relying solely on a property test's continued
  existence and execution to catch it.
affected_files:
  - lib/letflow/exam/session.ex
suggested_fix: >
  Not designed further by REVIEWER, routed to CODE-DESIGNER/ELIXIR-DEV.
  Either tag each resolved_question() with its origin at construction
  (origin: :random | :manual), or keep the two lists separate one call
  further (into persist_session_questions/4) rather than merging as early
  as materialize_session/5 does today.
queue_ref: Q-722
github_ref: GH-1565
status: resolved
resolved_in_run: WF03-ISS0724-20260919
resolved_at: "2026-09-19T10:06:05Z"
resolution_summary: >
  materialize_session/5 (lib/letflow/exam/session.ex) no longer concatenates
  resolved_random and resolved_manual into one untagged list before
  persisting. persist_session_questions/4 was replaced by an arity-5 version
  that keeps the two origins distinguishable end-to-end; the old arity-4
  clause was deleted outright (no fallback), so a future accidental re-merge
  fails to compile rather than silently reintroducing the gap. Design:
  lib/letflow/design/iss0724-exam-question-origin-separation.md. A
  property test (test/letflow/exam/session_test.exs, "ISS-0724 -- never
  -reorder invariant holds across many seeds") backstops the residual gap
  the compile-time mechanism doesn't catch by itself, and was independently
  verified sensitive to that exact regression by TEST-DESIGN-VALIDATOR via
  its own mutant. Gates passed: CODE-DESIGN-VALIDATOR (after 1 rework),
  SECURITY-REVIEWER, REVIEWER, TEST-DESIGN-VALIDATOR, TEST-RUNNER
  full-suite (4462/4462, 0 failures).
