  design_doc: lib/letflow/design/iss-0726-oidc-redirect-path-restore.md
  summary: >
    Root cause (pre-confirmed by ISSUE-FIXER, independently re-verified against
    current main at fetch e0b3fdc7 while writing the design): ProtectedRoute's
    OIDC redirect never captured the originally-requested path anywhere that
    survives the full-page navigation round trip to Keycloak and back, so
    OidcCallbackPage always fell through to its role-based fallback
    (/platform-dashboard for PLATFORM_ADMIN, / for everyone else) instead of
    the path the user actually asked for. Fix ships in three parts, all in
    web/: (1) a new validator web/src/auth/safeRestorePath.ts
    (isSafeRestorePath, a type guard) enforcing a 9-check open-redirect guard
    -- string type and length bound, leading-slash-required, rejects
    protocol-relative "//", rejects any backslash, rejects an embedded URL
    scheme anywhere in the string, and restricts the path/query/fragment
    portions to safe RFC 3986-derived character classes -- adversarially
    tested by SECURITY-REVIEWER with real bypass payloads
    (//evil.com, /\evil.com, javascript:/data: schemes, embedded <script>,
    etc.), all correctly rejected; (2) capture via oidc-client-ts's own
    `state` signin option, not a separate sessionStorage key --
    web/src/auth/oidcRedirectArgs.ts's buildRedirectArgs() gained an optional
    capturePath parameter, validated again at capture time (defense in
    depth, not only at restore time) before being included as `state`;
    ProtectedRoute.tsx's call site now passes
    `window.location.pathname + window.location.search` at the exact moment
    it decides to redirect. The two near-duplicate buildRedirectArgs()
    implementations (oidcRedirectArgs.ts and AuthProvider.tsx) were also
    deduped -- AuthProvider.tsx now imports the shared one; (3) restore
    priority in web/src/pages/OidcCallbackPage.tsx: a validated restored
    `user.state` path now wins over the role-based fallback whenever
    present, including for PLATFORM_ADMIN (falls back to the old
    role-conditional branch only when `state` is absent or fails
    isSafeRestorePath).
