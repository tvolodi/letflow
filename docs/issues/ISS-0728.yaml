  fix: >
    web/src/components/layout/AppShell.tsx: Role type widened to include
    CANDIDATE; new NAV_ITEMS entry ({ to: '/exam', label: 'Exams', roles:
    ['CANDIDATE'] }) added right after "My Tasks", so a CANDIDATE session's
    sidebar now shows a discoverable path to the exam list.
    web/src/components/ui/PermissionDenied.tsx made role-aware: reads the
    session via useAuth() and renders "Go to Exams" -> /exam for a
    CANDIDATE session, while every other role (and a null session) keeps
    the existing "My Tasks" -> /tasks fallback unchanged.
