id: ISS-0729
title: >
  DefinitionListPage main-thread freeze in dev/StrictMode when interacting
  with debounced search shortly after navigation, causing an intermittent
  Playwright hang
discovered_by: ISSUE-FIXER
discovered_in_run: WF02-REQ371-20260919
discovered_at: "2026-09-20T01:20:00Z"
severity: MAJOR
tags:
