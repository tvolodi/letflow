  - performance
  - dev-mode
  - flake
description: >
  Discovered by ISSUE-FIXER while root-causing REQ-371's required e2e spec
  (web/tests/e2e/pipelines/platform-definition-promotion-rollback.pipeline.e2e.spec.ts)
  hanging at step 1's `definition-search` fill/click. Confirmed a genuine,
  intermittent (60-80% reproduction rate across 11 real runs), dev-mode-only
  (`npm run dev`, never `vite preview`) main-thread freeze: Chromium
  renderer pegged at ~106-107% CPU continuously during the hang, no network
  activity, CDP profiler cannot capture a stack during the freeze (mirrors
  ISS-0662's own note about `Profiler.stop` hanging during a genuine
  freeze). A second, independently-launched browser hitting the same dev
  server while the first was mid-hang also hung on its own fresh page,
  ruling out single-page corrupted state as the sole cause. Consistent with
  ISS-0296's prior finding on this same codebase (React 18 StrictMode
  double-invocation causing a dev-only race; use build+preview for e2e
  tests) -- web/src/main.tsx wraps the app in React.StrictMode.
  web/src/pages/definitions/DefinitionListPage.tsx is the only consumer of
  `useDebounce` in the pages tree (via `useDefinitionSearch`, 300ms
  debounce), making it the standout structural difference vs non-hanging
  routes. Root cause not yet pinned to a single line -- likely an
  interaction between StrictMode's double-effect-invocation and one of: the
  `useDebounce`/`useDefinitionSearch` hook chain, a `pendingNavId`
  navigation effect, or `DataTable.tsx`'s existing `deferClickState`
  machinery (which ISS-0662 already patched for an analogous freeze on
  `EntityCrudPage.tsx`/`DataTable.tsx`'s sort-header click). Needs
  CODE-DESIGNER to design a fix, likely via the same empirical
  mutation/deferral approach used for ISS-0662, since the CDP profiler
  cannot capture a stack during the freeze itself.

  Separately, also found (not the hang's cause, but a real correctness bug
  in the same investigation): web/src/utils/highlightText.tsx lines 11-18
  creates one RegExp with the global flag and calls `.test()` on it
  repeatedly inside `.map()` -- a global-flagged regex is stateful
  (`lastIndex`), so reusing it across `.test()` calls in a loop produces
  incorrect alternating match results.

  This blocks REQ-371's own AC6 (the required e2e spec must be authored AND
  PASSING) from being honestly claimed, since the spec now reliably
  exercises this exact hang via DefinitionListPage.tsx.
