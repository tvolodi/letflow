resolution:
  requirement: REQ-378
  design_doc: lib/letflow/design/req378-oidc-live-revocation-check.md
  regression_tests:
    - test/letflow/plugs/iss0736_oidc_live_revocation_test.exs
    - web/src/api/__tests__/identity.removeMembers.test.ts
  summary: >
    AuthPipeline's OIDC branch now performs a live, per-request, uncached
    local revocation/status check (mirroring the API-token branch's
    existing Identity.verify_api_token/2 live-DB-read precedent), so a
    Letflow-local tenant-admin role/status change takes effect on the very
    next request instead of waiting for JWT expiry or re-login. Gated
    through SECURITY-REVIEWER PASS (original mechanism + delta re-review)
    and REVIEWER PASS (twice) after 3 rounds of design rework and 2 rounds
    of implementation rework; full backend suite 4472/4472 and full
    frontend suite 728/728 green, both REQ-378 test files green.
