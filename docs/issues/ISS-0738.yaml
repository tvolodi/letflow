id: ISS-0738
title: >
  DefinitionListPage def-name click (expand version history) main-thread
  freeze in both dev and production builds
discovered_by: ISSUE-FIXER
discovered_in_run: WF02-REQ371-20260919
discovered_at: "2026-09-20T03:55:00Z"
severity: MAJOR
tags:
  - frontend
  - performance
  - flake
description: >
  Discovered by ISSUE-FIXER while root-causing REQ-371's required e2e spec
  (web/tests/e2e/pipelines/platform-definition-promotion-rollback.pipeline.e2e.spec.ts),
  one step past ISS-0729's already-fixed search-input freeze.
  web/src/pages/definitions/DefinitionListPage.tsx lines 168-176's
  `def-name-${def.id}` span's `onClick` handler calls
  `setExpandedDefId`/`setExpandedDefName` synchronously inside the same
  native trusted click's event-dispatch turn -- the same general trigger
  class ISS-0662 already confirmed and fixed via
  web/src/utils/deferClickState.ts (`setTimeout(fn, 0)`), but that fix was
  applied only to `DataTable.tsx`'s header-sort click and
  `EntityCrudPage.tsx`'s handlers, never to this bespoke inline `onClick` in
  `DefinitionListPage.tsx`. Confirmed by direct reproduction against the
  real backend+Keycloak stack, in BOTH `npm run dev` and
  `npm run build && vite preview` (NOT dev/StrictMode-only, unlike
  ISS-0729) -- renderer CPU pegged continuously at ~95-106% during the
  hang, a genuine busy-loop/freeze not an idle wait. Reproduces with or
  without a search filter active, ruling out the highlightText/isSearching
  code path as causal (that framing in the original observation was
  circumstantial, since the e2e spec's own flow always searches before
  this click to disambiguate v1/v2 rows). Was pre-existing before
  ISS-0729's fix landed but masked, since execution never reached this
  click at all (the search `fill()` step froze first) -- NOT introduced by
  ISS-0729's fix. Fix validated empirically by ISSUE-FIXER: wrapping the
  handler's existing body in `deferClickState(() => {...unchanged...})`
  (the same pattern already used by `DataTable.tsx`'s `handleHeaderClick`
  and `EntityCrudPage.tsx`'s handlers) eliminated the freeze in both
  filtered and unfiltered cases in the production build, click resolved in
  under 1s, `version-history-row` correctly became visible. This blocks
  REQ-371's own AC6 (the required e2e spec must be authored AND PASSING)
  from being honestly claimed.
affected_files:
  - web/src/pages/definitions/DefinitionListPage.tsx
  - web/src/utils/deferClickState.ts
  - web/tests/e2e/pipelines/platform-definition-promotion-rollback.pipeline.e2e.spec.ts
suggested_fix: >
  Wrap the `def-name-${id}` span's `onClick` body in `deferClickState(() =>
  { ...unchanged... })`, exactly matching the established pattern
  `DataTable.tsx`'s `handleHeaderClick` and `EntityCrudPage.tsx`'s handlers
  already use (docs/frontend/iss-0662-entity-crud-page-click-freeze-fix.md
  is the precedent design doc). Small, well-established fix class, already
  empirically validated by ISSUE-FIXER -- likely a lightweight CODE-DESIGNER
  pass, not a full new investigation.
severity_rationale: >
  MAJOR -- blocks REQ-371's required e2e spec from being honestly claimed
  as passing (AC6), and represents a genuine main-thread freeze (confirmed
  in BOTH dev and production builds, unlike ISS-0729) reachable by any
  operator expanding a definition's version history on the definitions
  list.
related:
