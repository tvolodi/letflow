resolution: >
  Closed 2026-09-20 as not applicable to Letflow's actual product scope.
  The scenario exercises R-Co's own runtime-agent artifact-submission
  subsystem (agent_task_specs.zig / agent_sandboxes.zig /
  agent_artifacts.zig), which Letflow has never built and which no S0-S9
  migration stage claims -- router.ex's own "Deferred routes" table lists
  it as "post-S6" with no owning requirement, distinguishing it from a
  genuine unbuilt-but-in-scope gap (the disposition used elsewhere in this
  sweep, e.g. REQ-386/387/388 for attachment-cross-tenant-probe). No code
  changed. No Playwright spec authored -- there is no feature for one to
  exercise. See
  test/uat-reports/gui-review-2026-09-20-agent-artifact-resubmit-idempotent.md
  for the full verification trail.
