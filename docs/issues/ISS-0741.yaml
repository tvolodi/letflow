  - ISS-0738
suggested_fix: >
  See lib/letflow/design/iss-0739-instanceboardpage-start-dialog-click-freeze-fix.md
  for the full design. Summary: wrap openStartDialog's entire 7-call body,
  closeStartDialog's setShowStart(false), and submitStartInstance's
  pre-await validation-branch setState calls (the two resets plus each of
  the three early-return branches) in deferClickState(() => {...}),
  matching EntityCrudPage.tsx/DefinitionListPage.tsx's established pattern
  exactly. Controlled-input onChange handlers and the post-await
  setShowStart(false)/navigate() are deliberately NOT wrapped (design §1/§2.2).
severity_rationale: >
  MAJOR -- blocked REQ-371's AC6 (the required e2e spec must be authored
  AND passing) from being honestly claimed, and represents a genuine,
  reproducible main-thread freeze on a primary operator action
  (starting a process instance).
