id: ISS-0741
title: >
  InstanceBoardPage start-instance-button click freeze: openStartDialog's
  synchronous multi-setState body froze the renderer on a real trusted click
discovered_by: ISSUE-FIXER
discovered_in_run: WF02-REQ371-20260919
discovered_at: "2026-09-20T00:00:00Z"
severity: MAJOR
tags:
  - frontend
  - performance
  - flake
description: >
  ISSUE-FIXER root-caused, while diagnosing an intermittent (~1/3 hit rate)
  hang at step 02 of REQ-371's required e2e spec
  (web/tests/e2e/pipelines/platform-definition-promotion-rollback.pipeline.e2e.spec.ts,
  the start-instance-button click), that InstanceBoardPage.tsx's
  openStartDialog fires 7 synchronous setState calls
  (setStartDefinitionName, setStartDefinitionVersion,
  setStartCorrelationKey, setStartVariablesJson, setStartError,
  setStartValidationError, setShowStart) inside the same native click
  event-dispatch turn as a real UA-trusted click. This is the identical
  trigger class already confirmed for ISS-0662 (EntityCrudPage.tsx),
  ISS-0729/ISS-0737/ISS-0738 (DefinitionListPage.tsx) -- see
  web/src/utils/deferClickState.ts's moduledoc for the confirmed mechanism.
  closeStartDialog (called from both the dialog's Cancel button and the
  backdrop click) and submitStartInstance's pre-await validation-branch
  setState calls share the same defect. This blocked REQ-371's own AC6 (the
  required e2e spec must be authored AND passing).

  Design doc originally filed this issue's own YAML target as
  docs/issues/ISS-0739.yaml (the confirmed-unused slot at design-authoring
  time), but a concurrent CODE-DESIGNER claimed that slot first for an
  unrelated backend defect (GET /api/v1/definitions/search's empty-body
  HTTP 500 -- see docs/issues/ISS-0739.yaml). This issue was then filed as
  ISS-0740.yaml, the next unused slot at that time -- but a THIRD, wholly
  separate concurrent session (a GUI-review UAT sweep, PW-11) independently
  merged its own unrelated ISS-0740.yaml to main (an out-of-scope
  runtime-agent-subsystem finding) before this branch could merge, and also
  a separate concurrent session's ISS-0739.yaml collided with this repo's
  ISS-0739.yaml too. ORCH resolved both collisions by rebasing this fix's
  commit onto fresh origin/main and renumbering this issue a second time to
  ISS-0741.yaml, the next genuinely unused slot as of that rebase. The design
  doc's own filename (lib/letflow/design/iss-0739-instanceboardpage-start-dialog-click-freeze-fix.md)
  and its internal prose still say "ISS-0739" throughout, and the e2e spec
  filename still says "iss-0739" -- this is a filename/id mismatch only,
  matching the same class of collision already documented in
  ISS-0729.yaml/ISS-0738.yaml's own NOTE comments; the design doc's content
  and reasoning are otherwise unaffected and were not re-authored under the
  new number.
affected_files:
  - web/src/pages/instances/InstanceBoardPage.tsx
  - web/src/utils/deferClickState.ts
  - web/tests/e2e/pipelines/platform-definition-promotion-rollback.pipeline.e2e.spec.ts
  - web/tests/e2e/iss-0739-instance-start-dialog-click-freeze.e2e.spec.ts
related_requirements:
  - REQ-371
related:
