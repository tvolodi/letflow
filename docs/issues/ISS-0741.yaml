resolution:
  resolved_in_run: WF03-ISS0741-20260920
  design_doc: lib/letflow/design/iss-0739-instanceboardpage-start-dialog-click-freeze-fix.md
  summary: >
    Wrapped openStartDialog's entire 7-setState body, closeStartDialog's
    setShowStart(false), and submitStartInstance's three pre-await
    validation-branch setState call sites in
    web/src/utils/deferClickState.ts's deferClickState(() => {...}),
    matching EntityCrudPage.tsx/DefinitionListPage.tsx's already-established
    pattern exactly. No useRef double-submit guard was added, per the
    design's OQ-3 reasoning (mutateAsync itself is never deferred) --
    see empirical_evidence_trail below for a caveat FRONTEND-DEV surfaced
    on this specific point. A new e2e regression guard
    (web/tests/e2e/iss-0739-instance-start-dialog-click-freeze.e2e.spec.ts)
    drives real trusted clicks (hover+mousedown+mouseup) on
    start-instance-button (open), the dialog's Cancel button, the backdrop,
    and submit-start-instance (both the early-return validation path and
    the success path), asserting the dialog actually opens/closes/navigates
    within a 5s bound each time.
  empirical_evidence_trail: >
    Fail-then-pass proven against a live backend+Keycloak stack, after
    FRONTEND-DEV first had to fix an unrelated local dev-server
    misconfiguration (vite's proxy resolved `localhost:4000` to IPv6 `::1`
    while the backend listens IPv4-only, causing every proxied API request
    to fail with a connection-refused-derived 500 regardless of fix state
    -- restarting vite with NODE_OPTIONS=--dns-result-order=ipv4first
    resolved it). Pre-fix baseline: 5/5 full spec runs failed, 15/15
    individual test cases froze past the 5s bound on the very first
    trusted click on start-instance-button (a materially HIGHER hit rate
    than the originally reported ~1/3, plausibly because this harness's
    synthetic click conditions reproduce the freeze more reliably than ad
    hoc human clicking, matching ISS-0662/ISS-0737's own prior experience).
    Post-fix: 7/7 full spec runs passed, 21/21 individual test cases passed
    cleanly (each full run completing in ~7s, vs. the pre-fix bound-tripping
    failures). FRONTEND-DEV also ran the OQ-3-mandated rapid-double-click
    sanity check on submit-start-instance (two independent real
    mousedown/mouseup cycles back-to-back, no gap): this DID produce two
    instances from one intended submission in this session's one trial --
    the design's OQ-3 assumption ("existing disabled={isPending} remains
    sufficient") is NOT fully confirmed empirically and should be treated
    as an open finding for REVIEWER, not a settled non-issue; this was not
    re-tested against pre-fix code since the pre-fix click freeze itself
    blocks reaching the double-click step, so whether this race predates
    this fix or not is unresolved. Separately, FRONTEND-DEV found and
    worked around (in the new spec only, not in application code) a
    sandbox-environment-level Playwright/Chromium limitation where
    Locator.fill()/.pressSequentially()/page.keyboard.insertText() all hang
    indefinitely on every text input regardless of page/handler/fix-state
    (reproduced on inputs with no relation to this fix, e.g.
    start-correlation-key) -- worked around via a direct JS
    value-setter + bubbling `input` Event dispatch, verified to be observed
    by React identically to a real keystroke.
  gates: >
    REVIEWER PASSed, having specifically re-examined the OQ-3 double-submit
    finding rather than accepting the design's original "no useRef guard
    needed" reasoning as closed: REVIEWER independently reproduced the
    double-instance-on-rapid-double-click (2/6 trials via its own Playwright
    repro), then determined via structural code comparison against
    EntityCrudPage.tsx's confirmDelete/ISS-0662 fix that this PR's diff
    never widens the pre-existing window (submitStartInstance's
    mutateAsync call is not itself deferred, unlike confirmDelete's
    deferred mutate() call) -- concluding this is a pre-existing gap on
    this button predating this fix, not a regression introduced by it.
    Filed separately as MINOR docs/issues/ISS-0742.yaml (a startInFlightRef
    guard matching EntityCrudPage.tsx's deleteInFlightRef pattern),
    non-blocking for this issue's own merge. REVIEWER also independently
    re-ran type-check/lint/guards/unit-tests (773/773) and the new e2e spec
    (3/3) against the live stack. TEST-DESIGN-VALIDATOR/TEST-RUNNER/
    RELEASE-VALIDATOR pending next.
