resolution:
  resolved_in_run: WF03-ISS0743-20260920
  design_doc: lib/letflow/design/iss-0739-search-paginated-exception-hardening.md
  summary: >
    Wrapped Letflow.Definitions.search_paginated/3's with chain in a
    try/rescue mirroring activate/2's exact idiom (guard/Keyword.get calls
    outside the try, bare rescue exception -> {:error, {:query_failed,
    exception}} catch-all). Added {:error, {:query_failed, term()}} to
    search_error() only, not common_error(). Added a doc comment above
    render_search_result/2's existing catch-all clause noting it already
    structurally matches the new tuple -- no router code change needed.
    get_by_id/2, get_active_by_name/2, list_paginated/2, and delta/2 share
    the identical unhandled-exception gap but are explicitly left unfixed
    (flagged, out of scope for this PR).
  empirical_evidence_trail: >
    No fail-then-pass live-crash reproduction was required (per this fix's
    honest root_cause_honesty_note above) -- instead, new deterministic test
    coverage exercises the new rescue path directly: 7 new tests in
    test/letflow/definitions/search_paginated_test.exs (happy path + cursor
    pagination, four typed-error branches, and a forced-exception test that
    drops the tenant's process_definitions table CASCADE inside a sandboxed
    transaction, asserting {:error, {:query_failed, %Postgrex.Error{}}} with
    postgres.code == :undefined_table). mix compile --warnings-as-errors
    clean. mix test test/letflow/definitions/search_paginated_test.exs --
    7/7 passed. mix test test/letflow/definitions/ test/letflow/routers/ --
    1060/1060 passed.
  gates: >
    Implemented by ELIXIR-DEV in an isolated git worktree (this repo's
    subagents share one working directory, and a concurrent agent's branch
    switch mid-task reverted this fix's tracked-file edits once -- recovered
    by redoing the work in isolation). Pending SECURITY-REVIEWER (mandatory,
    tenant-data-read-path per INV-8) -> REVIEWER -> TEST-DESIGNER/
    TEST-DESIGN-VALIDATOR -> TEST-RUNNER -> RELEASE-VALIDATOR.
