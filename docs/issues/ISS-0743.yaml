id: ISS-0743
title: >
  GET /api/v1/definitions/search -- Letflow.Definitions.search_paginated/3 has
  zero exception handling, so any raised exception surfaces as Bandit's raw
  empty-body HTTP 500 instead of a shaped JSON problem response
discovered_by: ISSUE-FIXER
discovered_in_run: WF02-REQ371-20260919
discovered_at: "2026-09-20T06:00:00Z"
severity: MAJOR
tags:
  - backend
  - reliability
  - api
description: >
  ISSUE-FIXER diagnosed an intermittent HTTP 500 with an EMPTY response body
  on GET /api/v1/definitions/search, discovered blocking REQ-371's required
  e2e spec (platform-definition-promotion-rollback.pipeline.e2e.spec.ts).
  Route: Letflow.Router -> Letflow.Plugs.ApiPipeline ->
  Letflow.Routers.Definitions.handle_search/1
  (lib/letflow/routers/definitions.ex) -> Letflow.Definitions.search_paginated/3
  (lib/letflow/definitions.ex).

  Root cause could NOT be pinned to a single raising line despite ~440+ direct
  concurrent-load reproduction attempts at the Elixir/Ecto function level
  (zero crashes) -- so it's likely at the HTTP layer (Admission plug,
  AuthPipeline, Plug.Parsers, or Jason response encoding) rather than a pure
  Ecto data race in search_paginated/3 itself, and could not be forced to
  reproduce again.

  What IS certain and code-verified (the actionable, structural defect fixed
  here regardless of the exact original trigger):
  1. lib/letflow/plugs/api_pipeline.ex's handle_errors/2 is why ANY unrescued
     exception anywhere in this pipeline surfaces as "500, empty body" -- a
     deliberate crash-passthrough for admission-pool-ref release, not a bug
     in the handler itself.
  2. search_paginated/3 and its router handler had ZERO exception handling --
     contrast with Letflow.Definitions.activate/2, which explicitly wraps its
     transaction in try/rescue and converts any raised exception to a typed
     {:error, {:transaction_failed, exception}} tuple, the established idiom
     in this codebase for exactly this risk class.
  3. search_paginated/3 had ZERO test coverage before this fix.
affected_files:
  - lib/letflow/definitions.ex
  - lib/letflow/routers/definitions.ex
  - test/letflow/definitions/search_paginated_test.exs
related_requirements:
  - REQ-371
suggested_fix: >
  See lib/letflow/design/iss-0739-search-paginated-exception-hardening.md for
  the full design (filename retains its originally-authored "iss-0739" name;
  see NOTE below for why the issue's own id diverged from it). Summary: wrap
  search_paginated/3's with chain in a try/rescue mirroring activate/2's exact
  shape, adding {:error, {:query_failed, exception}} to the search_error type
  only (not the shared common_error() union, since this isn't a transactional
  failure). No router change needed -- render_search_result/2's existing
  catch-all {:error, _common_error} -> Response.internal_error(conn) clause
  already structurally matches the new tuple. get_by_id/2, get_active_by_name/2,
  list_paginated/2, and delta/2 share the identical gap but are explicitly out
  of scope for this fix (flagged, not fixed, to avoid scope creep).
severity_rationale: >
  MAJOR -- blocked REQ-371's AC6 (the required e2e spec must be authored AND
  passing) from being honestly claimed, and represents a genuine, if rare,
  production-reachable crash symptom (a bare empty-body 500 on a primary
  read endpoint) even though the original trigger could not be reproduced.
root_cause_honesty_note: >
  ~440+ reproduction attempts by ISSUE-FIXER never reproduced the original
  crash. This fix is idiom-matching defensive hardening (bringing
  search_paginated/3 in line with activate/2's already-established
  try/rescue convention and closing its test-coverage gap), NOT a
  confirmed-root-cause patch. No fail-then-pass live-crash reproduction was
  required or attempted for this fix; instead, the new rescue path itself is
  exercised by a real deterministic test (forcing a genuine Postgrex.Error by
  dropping the tenant schema's process_definitions table inside a sandboxed
  test transaction, the same technique already precedented in
  test/letflow/audit_capture_test.exs).
related:
  - ISS-0740  # REQ-371's own blocking pipeline discovered both this and the InstanceBoardPage freeze (ISS-0741) at the same time
  - ISS-0741  # InstanceBoardPage.tsx start-instance-button freeze, found and fixed in the same investigation sweep
