resolution_2026_09_27: >
  ISS-0870 investigation: queue task 808 (this file's own queue_ref) reports
  "done", which mix letflow.check_queue_reconciliation flagged as a mismatch
  against this file's prior status: open. Verified this is the queue-id
  collision this file's own NOTE above already documents (task 808 auto-
  titled "ISS-0808", not this file's id) -- a separate, later local record,
  docs/issues/ISS-0808.yaml, was filed against the identical defect
  (same file/lines, lib/letflow/plugs/tenant_status.ex:92-95, same
  PLATFORM_ADMIN raw-roles-vs-roles_from_strings/1 finding) and was
  independently resolved (resolved_in_run: WF03-ISS0808-20260925). Confirmed
  live: lib/letflow/plugs/tenant_status.ex now reads
  `raw_roles = get_in(conn.assigns, [:auth_context, :roles]) || []` then
  `Authorization.roles_from_strings(raw_roles)`, with an inline
  "# ISS-0808: use Authorization.roles_from_strings/1..." comment -- this
  file's own fix_direction, delivered under ISS-0808's queue task instead of
  this one. Queue task 808's "done" is therefore CORRECT; this file's status
  was the stale side. Marked resolved_via_duplicate (superseded_by:
  ISS-0808) rather than plain resolved, since the actual fixing run and
  queue release both belong to that record, not this one.
