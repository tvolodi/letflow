related:
  - ISS-0736  # discovered as an out-of-scope finding during ISS-0736's fix (design rework)
severity_rationale: >
  MAJOR -- every group-management admin action other than remove-members
  (add members, list/get/update/delete a group) is calling a URL prefix
  with no matching backend route, i.e. likely non-functional in
  production today; not BLOCKER only because it is confined to the
  Groups admin surface rather than authentication/authorization itself.
fix_direction: >
  Audit web/src/api/identity.ts's groupsApi and the actual backend route
  table together; correct addMembers/.list/.get/.update/.delete/.members
  to the real /api/v1 group-management route prefix, following the same
  correction already applied to .removeMembers in ISS-0736/REQ-378, and
  add regression coverage mirroring
  web/src/api/__tests__/identity.removeMembers.test.ts for each corrected
  call.
