title: >
  web/src/api/identity.ts groupsApi.addMembers/.list/.get/.update/.delete/.members
  all share the same broken /api/v1/admin/groups/... prefix .removeMembers
  had before ISS-0736's fix
discovered_by: CODE-DESIGN-VALIDATOR
discovered_in_run: WF03-ISS0736-20260921
