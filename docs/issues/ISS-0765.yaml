description: >
  Flagged during REQ-378's design rework (CODE-DESIGN-VALIDATOR, run
  WF03-ISS0736-20260921, part of ISS-0736's fix) as an out-of-scope
  finding. web/src/api/identity.ts's groupsApi.addMembers, .list, .get,
  .update, .delete, and .members all still call the same
  /api/v1/admin/groups/... URL prefix that groupsApi.removeMembers used
  before this run fixed it -- no matching backend route exists at that
  prefix. removeMembers was corrected in scope for ISS-0736/REQ-378
  because it was directly implicated in that fix's regression coverage;
  the sibling group-management calls were left untouched as genuinely
  out of scope for a live-revocation-check fix, but they carry the exact
  same defect and are presumably equally broken at runtime today.
