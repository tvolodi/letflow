id: ISS-0767
title: >
  NonSkippableApprovalGate.tsx does not surface a rehearsal-required
  blocked state once apply_review/4 gains its assertion-run gate
  (ISS-0732 follow-up)
discovered_by: ORCH (scoping WF03-ISS0732-20260921, backend-only sizing split)
discovered_in_run: WF03-ISS0732-20260921
discovered_at: "2026-09-21T01:40:38Z"
severity: MINOR
description: >
  ISS-0732 fixes lib/letflow/definitions/promotion.ex's apply_review/4 to
  reject an Apply call with no passing PromotionAssertionRun for the
  current plan_digest, returning a new error reason instead of silently
  releasing. web/src/components/NonSkippableApprovalGate.tsx and its API
  client have no surfaced state for this: the Apply flow currently
  assumes apply either succeeds or hits the existing
  digest-mismatch/invalid-transition error branches. Deliberately split
  out of ISS-0732's own run per ORCHESTRATOR.md section 10 sizing
  judgment -- the backend fix is the security-relevant BLOCKER and
  stands on its own (the gate is enforced with or without this UI
  surfacing); this piece is a UX-quality follow-on, not a same-run
  requirement.
affected_files:
  - web/src/components/promotions/NonSkippableApprovalGate.tsx  # corrected path --
    # the file lives under components/promotions/, not components/ directly;
    # this entry originally omitted the promotions/ segment.
  - web/src/api/promotions.ts
fix_direction: >
  Once ISS-0732's backend fix lands (new error reasons from apply_review/4,
  surfaced through the API), FRONTEND-DEV adds a distinct blocked state in
  NonSkippableApprovalGate.tsx (and its api layer) that renders a clear
  "release blocked -- rehearsal required, run assertions first" message
  rather than a generic error toast, matching this repo's existing pattern
  for other apply_review error branches. Needs a frontend test exercising
  the new state against a mocked backend response, with no regression to
  existing digest-mismatch/invalid-transition coverage.

  CORRECTION (added by CODE-DESIGNER, 2026-09-21, see
  lib/letflow/design/iss0767-non-skippable-gate-rehearsal-blocked-state.md
  §0): this issue's original filing guessed the backend error shape as
  "e.g. :assertion_run_required or :assertions_failed" -- a single reason,
  wrongly named. Neither name exists. ISS-0732 actually shipped FOUR
  distinct error reasons from apply_review/4, all HTTP 409, disambiguated
  only by the RFC 9457 `detail` string (not by status or `type`, which are
  identical across all five 409 cases including the pre-existing
  :digest_mismatch): `:assertion_run_missing`, `:assertion_run_digest_mismatch`,
  `:assertion_run_in_progress`, and `:assertion_run_failed`. The linked
  design surfaces all four as distinct UI states (a deliberate design
  choice, not a default) rather than collapsing them into one generic
  message -- see that design's §2 for the reasoning.
queue_ref: Q-767  # letflow-queue task id 767, issue_ref ISS-0767. Registered
  # 2026-09-21 by ORCH.
github_ref: GH-1664
status: resolved
design_ref: lib/letflow/design/iss0767-non-skippable-gate-rehearsal-blocked-state.md
resolution:
  resolved_at: "2026-09-21T10:10:41Z"
  pr: GH-1679
  branch: feature/WF03-ISS0767-20260921
  commit: 37639583
  summary: >
    NonSkippableApprovalGate.tsx now surfaces all four rehearsal-gate
    blocked states from apply_review/4's assertion-run gate as distinct UI
    states instead of one generic error. Adds classifyApplyRehearsalError
    (exact-string-match on the RFC 9457 `detail` string, modeled on the
    existing classifyRollbackError), one RehearsalGateError block per
    reason (:assertion_run_missing, :assertion_run_digest_mismatch,
    :assertion_run_in_progress, :assertion_run_failed), inserted in
    handleApply's catch chain AHEAD of the pre-existing bare status===409
    digest-mismatch fallback -- a critical handler-ordering fix, since all
    five 409 cases (the four new ones plus the pre-existing
    :digest_mismatch) share identical status/type/title and are
    disambiguated only by `detail`; without this ordering the four new
    states would have been silently swallowed into the generic "Plan
    digest mismatch" message. Confirms the CORRECTION already recorded
    above in fix_direction: the issue's original filing guessed a single,
    wrongly-named error reason
    (:assertion_run_required/:assertions_failed); the actual shipped shape
    is the four reasons listed above, all HTTP 409, disambiguated only by
    `detail`, matching the linked design (see design §0 and §2).
  evidence: >
    5 new component tests (one per blocked state plus an explicit
    digest_mismatch/invalid_transition regression guard) + 6 classifier
    unit tests, all passing. TEST-RUNNER: 739/739 full frontend suite +
    48/48 targeted rehearsal-gate/classifier tests. REVIEWER independently
    reproduced the handler-ordering bug empirically (before the fix,
    confirmed the four new states rendered as the generic digest-mismatch
    message; after, confirmed each rendered its own distinct message) as
    part of its PASS. RELEASE-VALIDATOR independently re-ran the full
    suite and separately byte-verified all four `detail` strings used by
    the classifier against the actual backend source in
    lib/letflow/definitions/promotion.ex, rather than trusting the
    design doc's transcription.
  gates: >
    CODE-DESIGN-VALIDATOR PASSED, REVIEWER PASSED (including the empirical
    ordering-fix verification above), TEST-RUNNER PASSED (739/739 +
    48/48), RELEASE-VALIDATOR PASSED (independent full re-check, including
    the backend-source byte-verification above) -- all four gates passed
    independently, no rework cycles.
