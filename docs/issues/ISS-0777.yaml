id: ISS-0777
title: >
  Letflow.Platform.MigrationRollout.start_rollout/3 crashes with an unhandled
  ArgumentError (bare 500) when entity_type contains a hyphen or any other
  character rejected by DDL.valid_identifier?/1 -- no request-time format
  validation exists anywhere on the write path
discovered_by: UAT-RUNNER (live e2e run of REQ-375's
  platform-migration-partial-failure-resume.pipeline.e2e.spec.ts)
discovered_in_run: WF02-REQ375-20260921 (UAT-RUNNER step)
discovered_at: "2026-09-21T22:30:00Z"
severity: BLOCKER
tags:
  - backend
  - api
  - validation
  - crash
description: >
  Found while getting a genuine live run of REQ-375's e2e spec against a
  real, correctly-seeded backend (real Postgres, real Keycloak, real
  Chromium). `POST /api/v1/platform-migrations/rollouts`'s request schema
  (`lib/letflow/routers/platform_migrations.ex`, `@start_schema`) only
  checks that `entity_type` is a non-empty string of at most 255
  characters -- it never validates identifier format (no hyphens, must
  start with a lowercase letter, etc). `Letflow.TenantProvisioning.
  register_column_promotion/4` accepts the value too, with no format
  check at registration time either.

  The value is only ever validated when the rollout actually attempts to
  apply DDL: `Letflow.TenantProvisioning.checked_table_name/1` (around
  line 1461) calls `table_name_for_entity_type/1`, which requires
  `Letflow.Entities.Definition.DDL.valid_identifier?/1`'s
  `^[a-z][a-z0-9_]{0,63}$` pattern -- no hyphens permitted -- and RAISES
  an unhandled `ArgumentError` instead of returning `{:error, reason}`.
  This propagates all the way up through `Letflow.Platform.
  MigrationRollout.start_rollout/3`'s per-company apply loop as a bare,
  uncaught crash, surfacing to the operator only as a generic
  "Internal Server Error" (HTTP 500) with no actionable detail.

  `lib/letflow/tenant_provisioning.ex`'s own moduledoc/comment at the
  `checked_table_name/1` call site asserts "entity_type/column_name were
  already validated as safe identifiers at register_column_promotion/4
  time" -- this comment is factually incorrect; grepped the full write
  path and confirmed no such validation exists anywhere before the DDL
  step.

  Confirmed live and reproducibly: `entity_type: "pl-rollout-95a456dd"`
  (REQ-375's own e2e fixture naming convention, which legitimately
  contains hyphens) crashes every time with
  `** (ArgumentError) ColumnPromotion ... has an invalid entity_type:
  "pl-rollout-95a456dd"` in the backend log.
affected_files:
  - lib/letflow/routers/platform_migrations.ex
  - lib/letflow/tenant_provisioning.ex
  - lib/letflow/entities/definition/ddl.ex
related_requirements:
  - REQ-374
  - REQ-375
severity_rationale: >
  BLOCKER -- this directly blocks REQ-375's own AC5 (the e2e spec cannot
  pass while the backend it drives crashes on a plausible, non-malicious
  entity_type value), and represents a genuine unhandled-crash /
  input-validation gap on a real write path reachable by any
  platform-admin caller, not a contrived edge case.
fix_direction: >
  Add identifier-format validation for `entity_type` (and `attribute`,
  which likely has the identical gap -- verify) at the earliest
  reasonable point in the write path -- either in
  `platform_migrations.ex`'s `@start_schema` (a regex `pattern`
  constraint via the existing `Letflow.Api.Validation` mechanism, per
  this codebase's established convention) or inside
  `register_column_promotion/4` itself (benefits every caller, not just
  this router) -- returning a clean, actionable 422-class error instead
  of ever reaching `checked_table_name/1`'s raise. Also correct the
  stale/incorrect comment at `checked_table_name/1`'s call site once the
  real validation exists. Needs a regression test proving a
  hyphenated/invalid entity_type is rejected cleanly at the API layer,
  never reaching DDL execution.
