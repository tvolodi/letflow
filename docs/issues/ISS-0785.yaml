id: ISS-0785
title: >
  Cross-instance-same-tenant attachment-content denial is timing-distinguishable
  from cross-tenant/never-issued denial via an unconditional artifact-blob read
discovered_by: SECURITY-REVIEWER
discovered_in_run: WF02-REQ388-20260923
discovered_at: "2026-09-23T02:00:00Z"
severity: MINOR
tags:
  - backend
  - security
  - timing-side-channel
  - attachments
description: >
  Found while SECURITY-REVIEWER reviewed REQ-388 (audit-log entry for denied
  instance-attachment access), which flagged this pre-existing gap for
  SECURITY-REVIEWER's explicit sign-off judgment rather than fixing it
  in-scope. Confirmed real and independently re-derived by both
  CODE-DESIGN-VALIDATOR (during REQ-388's design review) and SECURITY-REVIEWER.

  `Letflow.Repository.Attachments.get_content/2` (lib/letflow/repository/attachments.ex
  ~362-445) has no concept of `instance_id` in its lookup chain: `get/2` ->
  `check_scan_status_clean/1` -> `Repo.get(Artifact, attachment.content_hash,
  prefix: prefix)`. This second `Repo.get` -- a full read of the
  `repository_artifacts.content` blob -- fires unconditionally whenever the
  attachment metadata row exists at all, regardless of which instance it
  belongs to.

  `fetch_scoped_attachment_content/4` in lib/letflow/routers/instances.ex
  (~1156) only compares `attachment.instance_id` against the requested
  instance_id AFTER `get_content/2` has already returned. This means:

  - A cross-instance-same-tenant denial (attachment exists, belongs to a
    different instance in the same tenant) costs 2 Repo round-trips, the
    second reading a full artifact byte blob that is then discarded.
  - A cross-tenant or never-issued denial costs 1 Repo round-trip (a `nil`
    result), with no blob read at all.

  This is a genuine, already-measurable timing distinguisher between two
  denied-response classes that REQ-211/212's own design explicitly intends
  to be indistinguishable (same status/headers/body, matching EO-001/EO-002
  of test/uat-reports/gui-review-2026-09-20-attachment-cross-tenant-probe.md).
  It predates REQ-388 and is not introduced or worsened by it -- REQ-388's
  own audit write happens only after get_content/2 has already returned,
  with uniform added cost across both denied branches.
affected_files:
  - lib/letflow/repository/attachments.ex
related_requirements:
  - REQ-211
  - REQ-212
  - REQ-388
severity_rationale: >
  MINOR -- requires an attacker to already hold a valid session and probe
  attachment ids with fine-grained timing measurement to distinguish
  "exists in my tenant, wrong instance" from "doesn't exist / wrong tenant",
  a narrower and more resource-scoped variant of standard existence-leak
  concerns already largely closed by REQ-211/212's response-shape work.
  Not exploitable to read cross-tenant content directly.
suggested_fix: >
  Reorder Attachments.get_content/2's lookup so the instance-match check
  happens before the artifact blob read, or thread instance_id into
  get_content/2 itself so it can fold the cross-instance case into the
  same single-round-trip nil path as the cross-tenant/never-issued case.
  This touches REQ-211/212's own module and its existing test surface --
  size accordingly (likely a CODE-DESIGNER + ELIXIR-DEV pass with its own
  design doc, given the timing-sensitivity of the fix itself needs care
  not to introduce a NEW asymmetry).
