resolution: >
  Fixed directly by ORCH (urgent CI-blocking defect, minimal well-precedented
  change -- same direct-action pattern as ISS-0786 and the handoff-lint fix)
  on branch fix/ISS-0787-storage-allowance-read-after-writes, commit
  2ab0b5e1, PR #1752. Added `read_after_writes: true` to
  Tenant.storage_allowance_bytes. Verified: mix compile
  --warnings-as-errors clean; test/letflow/identity_test.exs:783 passes
  (was failing before); full identity_test.exs run leaves only the
  pre-existing, unrelated ISS-0766 flake
  (resolve_tenant_by_realm/1/resolve_realm_by_tenant/1, confirmed via two
