id: ISS-0791
title: >
  UAT: the Groups admin surface has never been exercised against a real
  instance -- ISS-0765's prefix fix has no end-to-end evidence
discovered_by: ORCH
discovered_in_run: WF03-ISS0765-20260924
discovered_at: "2026-09-24T18:04:25Z"
tags:
  - uat
  - frontend
  - groups
severity: MAJOR
description: >
  Filed by ORCH at ISS-0765's close, on conditions raised independently
  by REVIEWER (step-03d) and TEST-DESIGNER (step-04) and left explicitly
  open by both. ISS-0765 corrected six groupsApi calls from a dead
  /api/v1/admin/groups/ prefix to the real /api/v1/identity/groups, and
  every gate passed -- but every test in that run exercises a vi.fn()
  spy whose Response the test itself constructs, so no HTTP ever left
  the process. FRONTEND-DEV attempted a live probe of
  http://localhost:4000/api/v1/identity/groups and got HTTP 000, no
  connection. The fix is sound BY CONSTRUCTION -- the six routes were
  read out of Letflow.Api.AuthorizedRouter.__authz_routes__/0, and
  SECURITY-REVIEWER independently re-derived them -- but construction is
  not execution. A route-macro-versus-actual-mount discrepancy is
  invisible to every check that run performed. This matters more than
  usual here: before ISS-0765 the entire Groups admin surface was
  non-functional in production and nobody noticed, which is itself
  evidence that nothing exercises it.
affected_files:
  - web/src/api/identity.ts
related:
  - ISS-0765  # this UAT gap was raised as an open condition during ISS-0765's own close
  - ISS-0811
  - ISS-0816
related_requirements: []
severity_rationale: >
  MAJOR -- inherits ISS-0765's own severity: if the route-macro-vs-mount
  assumption is wrong, the entire Groups admin surface (the thing
  ISS-0765 claims to have fixed) is still non-functional in production,
  and nothing in the current pipeline would catch it.
fix_direction: >
  Dispatch UAT-RUNNER against a real running instance with a real
  Keycloak realm once ISS-0765's actual fix (PR #1808) is merged --
  running this UAT before that merge would test the still-broken
  backend and produce a false negative. Exercise: list groups, open
  Manage members, add a member, remove a member, delete an empty group,
  each verified by real HTTP and real database state. Confirm the
  GET /api/v1/identity/groups/:id/members response is the paginated
  envelope {items, next_cursor, count} ISS-0765 retyped GroupMemberPage
  to, confirm each of the six group routes enforces :GroupsManage
  against a token lacking that permission, and record whether ISS-0811's
  (Members column reading 0) and ISS-0816's (members list truncating at
  50) symptoms are visible on the live surface.
status: resolved
resolution: >
  PR #1808 merged (dec06da7, 2026-09-24T20:21:34Z), then UAT-RUNNER ran a
  real, live end-to-end check against a real running instance (backend
  on port 4000, real Postgres, real Keycloak realm bpm-default, real
  password-grant tokens for admin-user/operator-user) -- no mocks.
  Verdict: PASS on all acceptance criteria, each backed by real HTTP
  and real DB evidence: list groups hits the real
  GET /api/v1/identity/groups (old dead /api/v1/admin/groups/ prefix
  independently confirmed 404); members envelope confirmed
  {items, next_cursor, count}, not a bare array; add/remove member and
  delete-empty-group each confirmed by a real response code AND a real
  row appearing/disappearing in the tenant schema's group_members/groups
  tables via direct psql query; all six routes confirmed to return 403
  RFC 9457 problem+json for a real operator token lacking GroupsManage.
  Full report: test/uat-reports/uat-2026-09-24-ISS0791-20260924.yaml.

  Diagnostic byproduct (not this issue's own defect, left for ISS-0811/
  ISS-0816 to carry): ISS-0811's is_system-missing symptom was live-
  reconfirmed; ISS-0816's 50-row-truncation risk was reconfirmed by code
  inspection (pagination.ex's default page size vs GroupsPage.tsx never
  reading next_cursor) but not independently reproduced with 51+ real
  members this run -- flagged as a caveat in the UAT report, not a gap
  in this issue's own scope.

  One honest gap: no real browser/Playwright session drove GroupsPage.tsx
  itself this run (no UAT-scenario fixture exists for Groups yet) -- the
  verification was real-HTTP-identical-to-what-the-SPA-issues, not a
  literal GUI walkthrough. Left open for whoever builds a Groups UAT
  fixture scenario, not blocking this issue's own resolution since the
  underlying route-prefix defect (the actual subject of ISS-0765/0791)
  is now conclusively proven fixed at the HTTP layer.
