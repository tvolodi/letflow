id: ISS-0816
title: >
  CursorPage<T>.has_more is never emitted by Letflow.Api.Pagination.Page --
  roughly 12 web/ call sites use the type and none has been audited
discovered_by: CODE-DESIGNER (partially verified by ORCH)
discovered_in_run: WF03-ISS0765-20260924
discovered_at: "2026-09-24T17:15:00Z"
severity: MINOR
tags:
  - frontend
  - api
  - pagination
  - type-safety
description: >
  Incidental finding from ISS-0765's Step 2 design, filed and forwarded rather
  than extending that run. CODE-DESIGNER did not verify all 12 call sites
  individually, so this needs its own audit rather than a blind edit -- that is
  reflected in the acceptance criteria.

  web/src/types/api.ts:17 declares CursorPage<T>.has_more: boolean, but
  Letflow.Api.Pagination.Page emits only items, next_cursor and count. No
  has_more.

  The gap is already half-known: api.ts:371 carries a comment acknowledging
  that "that shape's has_more field does not exist on this route's response",
  and lib/letflow/design/iss0711-tenant-count-field-mismatch.md:102 records the
  same family of mismatch for a different endpoint.

  CORRECTED 2026-09-24 by ISSUE-FIXER (WF03-ISS0816-20260925 Step 1). This
  record originally claimed: "has_more IS genuinely emitted by
  lib/letflow/audit.ex (:276, :295-297), so the field is real for the audit
  route and absent everywhere Pagination.Page is used. One type covering both
  cannot be correct for either." **That is false, and it was the record's
  central premise.**

  audit.ex:276/295-297 is the INTERNAL return of Letflow.Audit.list_entries/1.
  lib/letflow/routers/audit.ex:203-204 consumes it, passes has_more to the
  private next_cursor/2, and then page_body/2 (:308-320) hand-builds
  %{"items", "next_cursor", "count"} as an explicit INV-2 allowlist. has_more
  never crosses the HTTP boundary.

  So NO route in Letflow emits has_more. CursorPage<T>.has_more covers zero
  wire shapes, not two. Designing from the original text would have produced
  the wrong fix -- a split preserving has_more on one branch.

  The GroupsPage members-dialog truncation is real and was confirmed on current
  main -- groupsApi.members(id) takes no cursor and no page_size, GroupsPage.tsx
  calls it once and never reads next_cursor, and the real default page size is
  50 (pagination.ex:53 @default_page_size, reached via identity.ex:546-548).
  But its association with THIS type is now stale: ISS-0765 (merged dec06da7)
  retyped .members to GroupMemberPage, so it is no longer a CursorPage<T> site.
  AC3 still stands on its own merits; it is simply not evidence about
  CursorPage<T>.
affected_files:
  - web/src/types/api.ts
  - web/src/pages/admin/GroupsPage.tsx
  - lib/letflow/api/pagination.ex
  - lib/letflow/audit.ex
related:
  - ISS-0765  # the run this was discovered during
  - ISS-0711  # same family of wire-shape mismatch, different endpoint
  - ISS-0813
severity_rationale: >
  MINOR -- confirmed on measured grounds rather than inherited. ISSUE-FIXER
  audited all 15 sites: ZERO production sites read has_more, and the two that
  mention it (audit.ts:71, promotions.ts:265) FABRICATE it locally as
  Boolean(response.next_cursor). Every real pagination consumer reads
  next_cursor. So no site is silently taking a falsy path -- it is a pure,
  inert type lie. That is what holds this at MINOR and what makes the fix
  cheap. Note TimelineFeed.tsx's camelCase hasMore prop is unrelated and
  derived from next_cursor -- a trap for whoever implements this.
fix_direction: >
  SUPERSEDED by ISSUE-FIXER's Step 1 audit -- the original direction below
  assumed the refuted premise. The audit is done (see the handoff); the
  recommended fix is NOT the split this record proposed. Delete has_more from
  the shared type outright, then split on the axis the backend actually varies
  on: CursorPage<T> = {items, next_cursor} for 7 sites, and a new
  CountedCursorPage<T> = {items, next_cursor, count} for the rest.
  GroupMemberPage, RawAuditPage and ISS-0711's TenantListResponse are already
  that second shape and could collapse into it. Delete the two fabrication
  lines and the four test fixtures that hand-write has_more.

  Original direction, retained for the record: "Audit each CursorPage<T> call
  site and map it to the route it actually consumes, recording whether that
  route emits has_more (audit.ex) or not (Pagination.Page); split the type if
  that is the right answer. Make the
  GroupsPage members dialog either follow next_cursor or say plainly that the
  list is truncated. Record the route-to-shape mapping so a later reader does
  not re-derive it.
