resolution: >
  Root cause (ISSUE-FIXER, 40 total repro attempts, 0 failures on old code --
  genuinely low-probability race, mechanism fully explained by reading both
  effects): D1's blob-URL/iframe assertion waited only for the container div
  to render, not for the inner useEffect that sets objectUrl and mounts the
  iframe -- the container div commits to the DOM before that effect runs, so
  an unlucky scheduling window let the assertion run and pass/fail against a
  not-yet-mounted iframe. Fixed (FRONTEND-DEV) by making the waitFor in
  web/src/pages/instances/__tests__/AttachmentViewerPage.test.tsx poll for
  the actual iframe's presence instead of just the container div -- a real
  root-cause fix, not a timeout/retry band-aid. FRONTEND-DEV independently
  proved the fix closes the actual race via a temporary induced-delay stress
  test: the old assertion shape fails deterministically under a forced 50ms
  delay, the new shape passes 5/5 under the same forced delay; the induced
  delay was then reverted, confirmed via `git diff --stat` that only the test
  file remains changed.

  Validation chain: REVIEWER PASSed cleanly (diff is exactly one file,
  root-cause fix confirmed, no scope creep, independently re-ran
  `npm test` 890/890 and the fixed test file in isolation 8/8 clean).
  TEST-RUNNER PASSed (full backend 4829/4832, the 3 failures independently
  root-caused to pre-existing tracked unrelated flakes ISS-0766 and ISS-0426;
  full frontend 890/890 clean; fixed test file run 10x isolated, 10/10 clean,
  8/8 tests each run).

  DISCLOSED DEVIATION -- RELEASE-VALIDATOR did not deliver a full formal
  sign-off. It independently confirmed AC1 (58+ total clean runs across all
  agents, a real stated count, not assumed non-reproducibility) and AC2 (root
  cause genuinely explained: container div renders before the inner
  useEffect sets objectUrl/iframe), and was mid-way through its own fresh 5x
  isolated run (AC3) and a re-grep for createObjectURL (AC4) when it stopped
  responding productively after ~49 minutes -- well past a reasonable window
  for this scope -- and a status nudge went unanswered. DOC-UPDATER confirmed
  via `ps aux` that no test process was actually running/computing at that
  point, and proceeded to close this issue on that basis rather than wait
  further, given REVIEWER's and TEST-RUNNER's own independent, thorough
  confirmations of the exact same scope (both had already re-run the fixed
  test file in isolation multiple times with 0 flakes, and both independently
  confirmed the diff is test-file-only). Recorded honestly per this project's
  established norm of disclosing deviations rather than papering over them.

  Fixed on branch fix/ISS-0817-attachment-viewer-flake (commit d5ba6aab
  post-rebase), merged via PR.
