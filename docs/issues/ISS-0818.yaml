description: >
  This file and docs/issues/ISS-0791.yaml describe the same finding AND point
  at the same queue task and the same GitHub issue -- both were written with
  queue_ref Q-818 / github_ref GH-1807. One task, two on-disk records, authored
  concurrently on two hosts.

  How it happened: this host (orch-main-20260924) registered the UAT gap as
  queue task 818 at ISS-0765's close and named its record from the queue's own
  issue_ref, per TASK_QUEUE.md's numbering schema -- giving ISS-0818. The
  sibling host (ai-dala-orch) independently wrote a record for that same task
  using its own local next-free number, giving ISS-0791, then carried the work
  through: it ran the live UAT, resolved it, and merged it to main.

  ISS-0791 is the surviving record. It is not merely first-to-merge -- it holds
  the actual evidence (a real end-to-end UAT-RUNNER pass against a live backend,
  real Postgres, real Keycloak, no mocks) and is the id cited by the UAT report
  at test/uat-reports/uat-2026-09-24-ISS0791-20260924.yaml and by ISS-0765's
  own outstanding block.

  This file is retained as a tombstone rather than deleted, because ISS-0765's
  resolution text and this run's handoffs cite ISS-0818 by name, and a dangling
  reference is worse than a redirect.

  Deliberately NOT carrying queue_ref or github_ref: exactly one on-disk record
  may claim Q-818 / GH-1807, and that is ISS-0791. See the anti-patterns entry
  "Two hosts writing two differently-named issue records for one queue task".
