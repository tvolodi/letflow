severity_rationale: >
  MINOR -- no production bug; tests still exercise pagination logic. The risk is
  false confidence: tests can't catch has_more-related regressions they're actively
  fabricating.
fix_direction: >
  Fix CursorPage<T> to match the real wire shape {items, next_cursor, count?}. Remove
  has_more from all four fixture sites. Add a wire-shape test for CursorPage<T>.
