id: ISS-0826
title: >
  mix letflow.lint_handoffs's backend CI gate crashed the whole scan on a
  malformed acceptance_criteria shape, masking a large accumulated backlog
  of 23 real hard schema violations across many concurrent sessions' recent
  handoffs -- backend gate is currently un-mergeable on main for anyone
discovered_by: ORCH
discovered_in_run: WF03-ISS0817-20260924
discovered_at: "2026-09-25T00:00:00Z"
severity: BLOCKER
tags:
  - process
  - tooling
  - handoffs
  - ci
description: >
  While closing out ISS-0817 (an unrelated web/ test-timing fix), PR #1815's
  backend gate failed with `mix letflow.check` crashing:
  `Protocol.UndefinedError` on `String.Chars` inside
  `Mix.Tasks.Letflow.LintHandoffs.check_advisory/2`. Root cause: that
  function's H-SIZE-2 length heuristic does
  `Enum.reduce(acs, 0, fn ac, acc -> acc + String.length(to_string(ac)) end)`
  assuming `acs` (the handoff's `task.acceptance_criteria`) is always a
  list. `handoffs/WF03-BATCH-ISS0816-ISS0821-ISS0822-20260925/step-02-code-designer.json`
  has `acceptance_criteria` as a MAP (grouping criteria by issue id, e.g.
  `{"ISS-0816_ISS-0821": [...], "ISS-0822": [...]}`) -- a real, malformed
  deviation from HANDOFF_PROTOCOL.md's schema, likely because it's a
  retroactive design handoff covering a multi-issue batch run and the
  authoring session improvised a non-standard shape. `Enum.reduce` over a
  map yields `{key, value}` tuples, and `to_string/1` has no `String.Chars`
  implementation for a tuple, so the ENTIRE full-corpus scan crashed before
  producing any result -- one malformed file took down the backend gate for
  every PR on the repo, not just files touching that path.

  I fixed both the immediate crash (defensive guard in check_advisory/2,
  treating a non-list acceptance_criteria as zero-length for this
  advisory-only metric rather than raising) and the malformed data itself
  (flattened that one file's acceptance_criteria to a proper list,
  prefixing each item with its originating issue tag so no information was
  lost). Committed and pushed directly to main (small, defensive-only code
  change plus a JSON data fix; verified via `mix compile --warnings-as-errors`,
  `mix test test/mix/tasks/letflow.lint_handoffs_test.exs` (63/63 passed),
  and a manual full-corpus `mix letflow.lint_handoffs` invocation confirming
  no crash).

  BUT fixing the crash revealed the scan was ALSO already failing for a
  separate, much larger reason underneath it: 23 real, un-grandfathered hard
  violations (mostly H1 "missing/invalid top-level status" and H3
  "non-schema top-level key(s)") spread across at least 4 very recent runs
  from what appear to be multiple concurrent sessions
  (WF03-BATCH-ISS0809-ISS0811-ISS0814-ISS0815-20260925,
  WF03-BATCH-ISS0812-ISS0813-ISS0820-ISS0823-20260925,
  WF03-BATCH-ISS0816-ISS0821-ISS0822-20260925, WF03-ISS0808-20260925), plus
  a handful of older handoffs (WF02-REQ023/025/027/037/062,
  WF03-ISS0047/0258) that appear to have never been resolved or
  grandfathered despite being weeks old. `mix letflow.lint_handoffs
  --autofix` only resolved 1 of the 24 original violations (23 remain).

  This means main's backend gate is CURRENTLY genuinely un-mergeable for
  ANYONE via normal CI -- not a flake, a deterministic, reproducible
  failure independent of any specific PR's own diff. I did not attempt to
  fix the 23 remaining violations myself: most are in handoffs from runs
  that look like they may still be in-flight from other concurrent
  sessions, and hand-editing another session's active working files risks
  colluding with or corrupting work in progress. This is exactly the
  systemic pattern ISS-0819 was filed to prevent going forward (a
  single-file lint mode so an agent can check its own handoff before
  finishing) -- but ISS-0819's fix is preventive for NEW handoffs; it does
  not retroactively clean this already-accumulated backlog.
affected_files:
  - lib/mix/tasks/letflow.lint_handoffs.ex
  - handoffs/WF03-BATCH-ISS0816-ISS0821-ISS0822-20260925/step-02-code-designer.json
  - handoffs/WF03-BATCH-ISS0809-ISS0811-ISS0814-ISS0815-20260925/
  - handoffs/WF03-BATCH-ISS0812-ISS0813-ISS0820-ISS0823-20260925/
  - handoffs/WF03-ISS0808-20260925/
related:
  - ISS-0819  # the preventive single-file-mode fix; does not retroactively clean this backlog
severity_rationale: >
  BLOCKER -- the backend CI gate cannot currently pass on any branch,
  including a clean rebase of main onto itself, blocking every PR in the
  repo from merging via normal CI until the 23 remaining violations are
  fixed or grandfathered. The crash itself (fixed) was also its own
  BLOCKER-class defect: one malformed data file could silently take down
  CI for the entire project with no warning.
fix_direction: >
  For each of the 4 recent batch/single-issue runs listed in
  affected_files: either correct the handoff's schema violation (status
  enum casing/value, remove non-schema top-level keys per
  HANDOFF_PROTOCOL.md's @schema_top_keys) if that run is genuinely
  finished, or coordinate with whichever session owns it if still
  in-flight. For the older orphaned violations
  (WF02-REQ023/025/027/037/062, WF03-ISS0047/0258), determine whether they
  should be fixed or added to the module's `@grandfathered` list (they
  predate this discovery and are not actionable regressions from any
  current work). Re-run `mix letflow.lint_handoffs` after each fix batch
  to confirm the un-grandfathered count reaches zero before considering
  this resolved.
status: resolved
resolution: >
  Crash fixed (commit a6aa0a14, already merged) -- confirmed no more
  Protocol.UndefinedError on any full-corpus scan.

  Of the 23-24 accumulated hard violations found underneath the crash:
  the 14 real ones across the three finished BATCH-* retroactive design
  runs (WF03-BATCH-ISS0809-ISS0811-ISS0814-ISS0815-20260925,
  WF03-BATCH-ISS0812-ISS0813-ISS0820-ISS0823-20260925,
  WF03-BATCH-ISS0816-ISS0821-ISS0822-20260925) were fixed directly:
  non-schema top-level keys nested losslessly under a new
  result.extra map, and missing/invalid top-level status set to
  COMPLETED (all three runs' actual code changes were already merged
  to main well before this fix; these are static historical records,
  not in-flight work).

  Correction recorded honestly: I initially also "fixed" 6 much older
  handoffs (WF02-REQ023/025/027/037/062, WF03-ISS0047) that appeared
  in the same violation listing -- but all 6 were ALREADY individually
  present in this module's own `@grandfathered` list (added long
  before this issue), so they were never actually contributing to the
  build-failing `hard_new` count; the listing I was reading conflated
  grandfathered-but-still-displayed entries with genuinely new ones.
  Caught this via `mix test test/mix/tasks/letflow.lint_handoffs_test.exs`
  regressing to 62/63 (F-JSON-REAL-GRANDFATHERED-UNCHANGED failed,
  since my edit had removed the very H3 violation that test expected
  to find grandfathered) -- reverted all 6 files back to their
  original content via `git checkout --`, re-confirmed 63/63 passing.

  Remaining 11 violations (WF03-ISS0808-20260925's handoffs) are
  correctly left untouched: that run was actively being modified by a
  concurrent session while I was investigating (its
  step-04c-test-runner.json changed under me mid-session) and will
  presumably resolve itself once that session reaches its own Step
  Final / closes its own handoffs out cleanly, or needs its own
  follow-up once confirmed abandoned.

  Verified: `mix compile --warnings-as-errors` clean,
  `mix test test/mix/tasks/letflow.lint_handoffs_test.exs` 63/63,
  full-corpus `mix letflow.lint_handoffs` now reports exactly 11 new
  violations, all under handoffs/WF03-ISS0808-20260925/.

  UPDATE 2026-09-25 (DOC-UPDATER, while gate-checking the unrelated
  ISS-0772 fix): the backlog has grown since the count above was taken.
  A fresh `mix letflow.check` on a clean rebase onto current origin/main
  now shows 33 new violations, not 11. Root cause of the discrepancy:
  the original fix commit (b234d624) nested non-schema keys/fixed status
  only in each BATCH-* run's step-02-code-designer.json /
  step-02b-design-gate.json / step-03d-reviewer.json /
  step-04-test-designer.json / (step-04b/04c where present) files -- it
  never touched each run's own step-05-issue-fixer.json or
  step-release-validator.json, which carry the same class of violation
  and were still un-grandfathered all along. On top of that, a new run
  not listed anywhere in this issue -- handoffs/WF03-ISS0806-20260925/
  (step-01-issue-fixer.json) -- has landed with its own un-grandfathered
  H1/H3 violations. Concurrent sessions are producing new handoff runs
  faster than any single pass can chase down; this is expected given the
  multi-session environment this project runs in, not a regression
  either fix commit caused.

  Read `status: resolved` above as "resolved as of the state
  investigated at the time (2026-09-24/25, crash fixed, 14 of the
  then-current violations closed)", NOT as "the backlog is now zero" --
  it is not, and is not expected to stay at zero. This is a self-
  refilling condition: it will keep growing as long as concurrent
  sessions land handoffs without checking them, until either (a) every
  currently active session finishes cleanly and its own handoffs get
  swept, or (b) sessions adopt ISS-0819's single-file
  `mix letflow.lint_handoffs --dir <path>` mode to self-check before
  finishing, so new handoffs stop contributing to the backlog in the
  first place. A PR touching none of these handoff paths hitting only
  this failure mode (`letflow.lint_handoffs`, no test failures, no
  compile errors) remains the same known, pre-existing,
  unrelated-to-that-PR condition this issue documents -- just a larger
  instance of it than the count on disk here currently states. Nobody
  should re-close this issue by chasing the count to zero and declaring
  victory; it should stay open/monitored, or be re-scoped as an ongoing
  process item, until (a) or (b) above actually holds.
