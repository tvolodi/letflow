severity_rationale: >
  MAJOR -- a live defect remains in an admin surface (members past the 50th
  reappear as addable), and it is recorded as fixed, which is worse than
  recorded as open: nothing will route work to it again. The independent
  verification step exists precisely so a producing agent's claim is not
  self-certifying, and here the validator substituted another issue's evidence
  for this one's and the gate passed anyway.
fix_direction: >
  Satisfy AC3 for real: the members dialog follows next_cursor to completion
  or states plainly that the list is truncated, and the Add-member set
  difference is correct when the member list would have truncated. A gated,
  mutation-tested implementation of exactly this already exists on the
  abandoned branch feature/WF03-ISS0816-20260925 (groupsApi.listAllMembers, a
  bounded drain at 200 per page and max 20 requests returning
  {items, truncated}) -- port it rather than redesigning. Satisfy or
  explicitly re-scope AC1. Correct ISS-0816's record so it does not claim a
  resolution it did not deliver. Then address the sign-off pattern itself: a
  RELEASE-VALIDATOR verdict that justifies one issue by citing another
  issue's evidence should not be able to pass.
