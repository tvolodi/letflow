  - validation-gap
  - frontend
  - groups
description: >
  Found while reconciling a concurrent duplicate run. The sibling host's run
  WF03-BATCH-ISS0816-ISS0821-ISS0822-20260925 marked ISS-0816 resolved at
  2026-09-25T05:18Z.

  Its RELEASE-VALIDATOR handoff (commit bbc04507) records verdict PASS with
  this justification, verbatim:

    "ISS-0816": "PASS -- subsumed by ISS-0821 fix; no has_more in any mock
    data confirmed by global grep."

  ISS-0816 is not subsumed by ISS-0821. ISS-0821 is about four TEST FIXTURES
  fabricating has_more into mocks. ISS-0816 had four acceptance criteria, and
  the grep cited verifies none of them.

  WHAT SHIPPED: has_more removed from CursorPage<T>, count made optional, and
  a corrected docblock. That covers AC2, and it is a sound fix.

  WHAT DID NOT SHIP: AC3 -- "the GroupsPage members dialog either follows
  next_cursor or explicitly states the list is truncated". On current main,
  web/src/pages/admin/GroupsPage.tsx:49 still calls
  groupsApi.members(activeGroupId): one unpaginated request, no next_cursor
  handling, no members-side truncation notice. The default page size is 50
  (pagination.ex @default_page_size), so a group with more than 50 members
  still silently truncates -- and because GroupsPage derives its Add-member
  dropdown as a SET DIFFERENCE from that truncated member list, existing
  members past the 50th still reappear as addable.

  A trap worth naming: the SAME run correctly fixed the USERS side (ISS-0823,
  a userListTruncated warning at GroupsPage.tsx:64 and :206). A quick read of
  that file now shows truncation handling and looks covered. The members side
  is the one still missing.

  AC1 (audit every CursorPage<T> call site, record the route-to-shape mapping)
  is also unverified by that sign-off, though a partial mapping did land in
  the type docblock.
