id: ISS-0828
title: >
  ISS-0816 was closed with AC3 unmet and AC1 unverified, on a
  RELEASE-VALIDATOR sign-off that wrongly treated it as subsumed by ISS-0821
discovered_by: ORCH (orch-main-20260925)
discovered_in_run: WF03-ISS0816-20260925
discovered_at: "2026-09-25T02:58:20Z"
severity: MAJOR
tags:
