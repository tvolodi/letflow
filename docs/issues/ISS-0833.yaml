id: ISS-0833
title: >
  A malformed REQ-405 entry in docs/status/requirement_status.v22.yaml breaks
  RequirementStatusInvariantsTest (A4a, A4b, A5)
discovered_by: TEST-RUNNER / RELEASE-VALIDATOR (WF02-REQ404-20260925)
discovered_in_run: WF02-REQ404-20260925
discovered_at: "2026-09-25T18:20:00Z"
severity: MINOR
tags:
  - test
  - docs
  - status-tracking
description: >
  Found by TEST-RUNNER and independently confirmed by RELEASE-VALIDATOR while
  running the full suite for REQ-404. Three tests in
  test/letflow/docs/requirement_status_invariants_test.exs (A5, A4a, A4b) fail
  because a REQ-405 entry appended to
  docs/status/requirement_status.v22.yaml by a concurrent WF02-REQ405 session
  is malformed: it has a misnamed field, an extra undeclared field, and/or an
  undeclared "doc-correction" event value that the invariants schema doesn't
  recognize.

  Confirmed pre-existing and unrelated to REQ-404: reproduces identically on
  an unmodified `main` checkout, and the file
  test/letflow/docs/requirement_status_invariants_test.exs is untouched by
  REQ-404's diff. Root cause is entirely inside the REQ-405 status-volume
  entry's own shape, written by a different (concurrent or since-completed)
  WF02-REQ405 session.
affected_files:
  - docs/status/requirement_status.v22.yaml
related:
  - ISS-0826
severity_rationale: >
  MINOR -- a schema/shape drift in one append-only status entry, not a
  correctness or security defect. It blocks a clean full-suite run (adds
  noise on top of the already-known ISS-0826 backlog) but doesn't affect any
  production code path or mask a real regression.
fix_direction: >
  1. Locate the REQ-405 entry in docs/status/requirement_status.v22.yaml
     (grep for "req: REQ-405") and diff its field names/values against the
     schema requirement_status_invariants_test.exs actually enforces (A4a/A4b
     field-shape checks, A5 declared-event-value check).
  2. Correct the entry in place (rename the misnamed field, remove the extra
     field, or add "doc-correction" to the declared event-value enum if that
     value is actually meant to be valid and the test's enum is what's
     stale -- check both directions before assuming the data is wrong).
  3. Confirm fixed by re-running
     test/letflow/docs/requirement_status_invariants_test.exs standalone.
  4. If REQ-405 itself is still in-flight when this is picked up, coordinate
     rather than editing a concurrent session's own in-progress append (same
     caution this project already applies to handoffs/ files) -- check
     docs/requirements.yaml REQ-405's own status first.
addendum_2026_09_26: >
  Added by ORCH while working ISS-0848 (queue/yaml reconciliation). The
  drift is broader than one entry: test/support/status_history.ex parses
  entries strictly by the req/event/agent/at/note field schema (5 fields,
  that order), but every REQ-409..REQ-416 entry appended to
  docs/status/requirement_status.v22.yaml this run instead uses
  req/status/timestamp/run_id/agent/summary -- none of the documented
  fields except req and agent are actually present under their expected
  names. This is the same root-cause shape as the original REQ-405 finding
  above, just recurring across roughly 8 more entries in the same volume.
  Not fixed here (out of scope for the issue that surfaced it, ISS-0848);
  whoever picks this up should decide whether to reformat the affected
  entries in place (append-only discipline permitting -- these are already
  committed history, so check test/support/status_history.ex's own
  append-only invariant test before editing rather than assuming a rewrite
  is safe) or extend the schema/parser to accept the newer shape if it is
  actually the intended go-forward convention.
addendum_2026_09_26_b: >
  Follow-up while closing volume 22 (ISS-0848's own reconciliation append
  pushed it over its 1200-line ceiling). Closing a volume makes its shape
  defects declarable in the index's known_shape_anomalies:/known_anomalies:
  -- I declared all 42 shape violations and the 1 vocabulary violation
  this addendum's own drift produces, verified programmatically against
  SH.shape_anomalies/1 and SH.anomalies/3 rather than transcribed by hand.
  test/docs/requirement_status_invariants_test.exs went from 5 failing
  (A3/A4a/A4b/A5/A9) to 1 (A4b only) as a result.

  The one residual A4b failure is NOT closable by declaration at all, and
  this is a real, distinct finding beyond "the schema drift is broader than
  one entry": A4b's `unparseable_at/2` check is unconditional and has no
  declaration escape hatch (see test/docs/requirement_status_invariants_test.exs
  around line 710's comment, "design section 13.5: declaring the field NAME
  wrong does not license an unparseable timestamp"). For 9 of these entries
  (REQ-405's own original entry plus REQ-409/410/411/412/413/414/415/416),
  SH.shape_anomalies/1 deterministically classifies the misnamed `at:` field
  as found under `summary:` (REQ-409 and the 7 others) or `workflow:`
  (REQ-405) -- but the literal text sitting at that found_line is not a
  timestamp at all (a YAML fold-block marker ">" for the `summary:` cases,
  a run-id string for the `workflow:` case). A `misnamed_field`/field=`at`
  declaration MUST cite exactly that found_as/found_line pair to satisfy the
  undeclared/unfound key-equality check, but citing it unconditionally trips
  `unparseable_at`, with no way to satisfy both at once. This is architecturally
  unfixable for these 9 entries without either (a) rewriting frozen,
  digest-pinned volume-22 history (exactly what the append-only rule and A6's
  digest check forbid), or (b) changing `unparseable_at`'s own logic/adding a
  declaration key for it (a real design decision, not something to make
  unilaterally while working an unrelated queue-reconciliation issue).
  Left red and documented rather than forced. Whoever picks this up next has
  the full working-out above plus a live example already declared in the
  index to test against.
status: resolved
resolution_2026_09_27: >
  Fixed via the design in
  lib/letflow/design/iss0833-a4b-unparseable-at-declaration.md (PASSed by
  CODE-DESIGN-VALIDATOR), implemented across three commits on
  fix/ISS0833-a4b-unparseable-at-20260927: 5e499fd1 (design),
  241ad2f9 (implementation), c0ba2039 (missing test coverage added after
  TEST-DESIGN-VALIDATOR FAILed the first handoff for only 1 of the design's
  5 required coverage deliverables being present).

  Mechanism: a new `known_unparseable_at:` key in
  docs/status/requirement_status.index.yaml declares, per-entry, that a
  misnamed `at:` field's `unparseable_at` finding is exempt IF AND ONLY IF a
  sibling `known_shape_anomalies:` `extra_field` record on the SAME entry
  re-verifies, live from disk, as ISO-8601 parseable
  (`verified_via_kind`/`verified_via_field`/`verified_via_found_line`, flat
  keys, no nested mapping -- the line-oriented parser doesn't support one).
  `unparseable_at/3` now takes an `exemptions` arg and rejects exempted
  candidates from `from_declared` only -- `from_disk` findings (a genuinely
  unparseable literal sitting on disk, not just a misnamed field) remain
  structurally unexemptable by design, so this cannot be used to paper over
  a real bad timestamp. A new 6th A4b sub-check,
  `invalid_unparseable_at_exemptions/4`, catches a bogus or malformed
  exemption record itself (orphaned citation, citation of a sibling whose
  disk value doesn't actually parse, citation of an open/unpinned volume),
  wired into `a4b_findings/1`, `a4b_clean?/1`, and `a4b_message/2`.

  9 real `known_unparseable_at:` declarations were added, one each for the
  REQ-405 entry (addendum_2026_09_26_b above) and REQ-409..REQ-416 (the
  ISS-0848-era shape-drift batch), all re-derived and verified against the
  live `docs/status/requirement_status.v22.yaml` content rather than
  transcribed by hand.

  Test coverage (test/docs/requirement_status_invariants_test.exs): a
  positive fixture (correct citation suppresses the finding and is itself
  valid) plus three negative controls -- orphaned citation, citation of a
  sibling whose on-disk value doesn't parse, citation of an open/unpinned
  volume -- each confirmed via discriminating mutation (make the fixture's
  defect stop being wrong, confirm the test then fails, revert, confirm
  byte-identical). Full file: 24/24 passed.

  RELEASE-VALIDATOR independently re-verified (2026-09-27) rather than
  trusting the above self-report: fresh isolated
  `mix test test/docs/requirement_status_invariants_test.exs` -> 24 passed;
  independently re-derived the adversarial-gaming trace with its own
  throwaway fixtures, all 3 cases confirmed; spot-checked 3 of the 9
  `known_unparseable_at:` records directly against live
  docs/status/requirement_status.v22.yaml content, all exact matches;
  full-suite failures all traced to already-known/tracked classes
  (ISS-0827 router drift, ISS-0832 CheckBoundariesTaskTest env-leak,
  ISS-0868 connection-contention) -- none touching the files this fix
  changed; `mix compile --warnings-as-errors` clean. PASS.
