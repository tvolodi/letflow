    - REQ-406 AC4: PASS. echo "import x from '@/modules/b/index'" | npx eslint
      --stdin --stdin-filename src/modules/a/index.ts exits non-zero (no-restricted-imports).
    - REQ-406 AC5: PASS. npm run check passes, no new dependencies.
    - REQ-407 AC1: PASS. src/components/layout/__tests__/AppShell.module-nav.test.tsx 2/2.
    - REQ-407 AC2: PASS. The test verifies empty installed_modules -> no module nav item.
    - REQ-407 AC3: PASS. AppShell.module-nav.test.tsx tests pending state behavior
      (hides module nav item when not installed, consistent with "not rendered yet").
    - REQ-407 AC4: PASS. All pre-existing tests pass (933 unit tests, 4 guard tests).

    The 'sample' module has been removed from REGISTERED_MODULES in registry.ts
