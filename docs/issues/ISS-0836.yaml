    - REQ-406 AC2: FIXED. Added web/src/hooks/__tests__/useInstalledModules.test.ts
      (2 tests, both pass). Previously missing from the shipped code.
    - REQ-406 AC3: FIXED. Added overrides entry to web/.eslintrc.json exempting
      src/modules/registry.ts from no-restricted-imports. Previously the rule
      blocked imports in registry.ts too (gap from b6a45852 implementation).
