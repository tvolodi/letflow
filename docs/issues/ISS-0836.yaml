severity_rationale: >
  MAJOR -- not a live production defect (nothing user-facing is broken;
  main's shipped version is internally self-consistent and its own tests
  pass), but it is a genuine content-level collision between two
  independently-gated pipeline runs, it left REQ-406's fully-PASSed branch
  unmergeable without a design decision, and it indicates a process gap
  (a requirement's commit shipping materially more than its own scope,
  unreviewed under the correct requirement identity) that could recur.
fix_direction: >
  Needs a CODE-DESIGNER or ISSUE-FIXER pass (not DOC-UPDATER) to decide,
  with REVIEWER sign-off, one of:
  (a) Treat REQ-404's already-shipped frontend work as the de facto
  implementation of REQ-406 (and part of REQ-407): formally re-scope
  REQ-406 to "superseded by REQ-404" in docs/requirements.yaml, verify
  REQ-406's own acceptance criteria against main's ACTUAL shipped
  registry.ts/types.ts/me.ts/useInstalledModules.ts (note: as shipped,
  main's registry.ts already contains a non-empty 'sample' module wired to
  live routes, which does not match REQ-406's explicit "empty in P1"
  requirement text -- that gap needs its own resolution, e.g. removing the
  sample entry or re-justifying it), then close out REQ-406 referencing
  REQ-404's commit rather than merging its own branch; discard or archive
  feature/WF02-REQ406-20260925.
  OR
  (b) Reconcile properly: bring REQ-406's branch content (cleaner P1-empty
  registry, AGENT_RUNNER role, REQ-406's own naming) to main, and update
  every already-landed dependent (AppShell.tsx's
  getInstalledModuleNavItems call and its own test, exam.ex if it
  references these names, REQ-409's backfill migration/test if relevant)
  to the reconciled names/shapes, re-running the full suite before merge.
  Either direction should also examine WHY b6a45852 bundled unrelated
  handoffs/, docs/issues/, and exam.ex changes under a REQ-404-labeled
  commit, and whether that indicates a squash/rebase mechanism defect
  worth its own follow-up (possibly a process anti-pattern entry).
addendum_2026_09_26: >
  Added by ORCH during ADHOC-20260926-S11-AUDIT. Three facts change the
  decision space above.

  (1) Both REQ-406 AND REQ-407 were flipped to status done inside b6a45852
  itself (verified by reading docs/requirements.yaml at 875f8cfd, where both
  are pending, and at b6a45852, where both are done). docs/status/ holds no
  status-history event for either requirement, and no RELEASE-VALIDATOR run
  exists for either. Their done status is unvalidated.

  (2) The branch feature/WF02-REQ406-20260925 no longer exists: `git
  ls-remote origin 'refs/heads/*406*'` is empty and no local branch or
  worktree carries it. Option (b) above now needs the branch recovered from
  the reflog of whichever host ran it; if it cannot be recovered, option (a)
  is the only path.

  (3) main's frontend contract is now load-bearing for REQ-412 (exam screens)
  and web/src/components/layout/AppShell.tsx. A follow-up issue (frontend
  module contract not reusable for a second module) depends on this issue's
  decision and will reshape registry.ts/types.ts; decide the contract here,
  implement the reshaping there.
acceptance_criteria:
  - one of options (a)/(b) chosen and recorded in this file with REVIEWER sign-off
  - the fake 'sample' module is removed from web/src/modules/registry.ts (and its test fixtures moved to test-only data), or re-justified in writing with REVIEWER sign-off
  - RELEASE-VALIDATOR re-verifies every acceptance criterion of REQ-406 and REQ-407 against main, each quoted with real output; any unmet criterion is either fixed or the requirement is flipped back from done
  - the current status-history volume carries a verified (or revised) event for REQ-406 and REQ-407 with real UTC timestamps
  - the letflow-queue task for REQ-407 is closed only after that verification
  decision: >
    Option (a) chosen: REQ-404's already-shipped frontend work is treated as the
    de facto implementation of REQ-406 (and part of REQ-407). The REQ-406 branch
    no longer exists (per addendum (2)), so option (b) is not recoverable.

    AC verification against main (2026-09-26):
