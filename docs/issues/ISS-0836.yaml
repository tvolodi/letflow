    AppShell.module-nav.test.tsx updated to use a local fixture definition instead.

    NOTE: REQ-406 and REQ-407 have no status-history events (done status was set
    directly in b6a45852 without going through the pipeline). Adding them to the
    current volume is deferred to a separate DOC-UPDATER pass to avoid further
