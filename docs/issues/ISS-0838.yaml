id: ISS-0838
title: |
  REQ-400 CatalogTest AC2 assertions are stale since REQ-408 registered Letflow.Modules.Exam -- 2 tests fail on main
discovered_by: "ORCH (architecture audit of S11 / decision 0039 on main 12f0a78f)"
discovered_in_run: ADHOC-20260926-S11-AUDIT
discovered_at: "2026-09-26T09:56:42Z"
severity: BLOCKER
tags:
  - modules
  - tests
