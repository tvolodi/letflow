id: ISS-0844
title: |
  Frontend module contract is not reusable for a second module: exam's route table and ModuleGuard sit in core's web/src/modules/ root, ModuleDefinition.routes is a dead parallel mechanism, and registry.ts hand-maintains two lists
discovered_by: "ORCH (architecture audit of S11 / decision 0039 on main 12f0a78f)"
discovered_in_run: ADHOC-20260926-S11-AUDIT
discovered_at: "2026-09-26T09:56:42Z"
severity: MAJOR
tags:
  - frontend
  - modules
  - architecture
  - S11
  - decision-0039
description: |
  State on main 12f0a78f:
  - web/src/modules/examRoutes.tsx lives at the modules ROOT (core per 0039 D3) and imports five exam
    page components directly (./exam/ExamListPage, ./exam/ExamSessionPage, ...). That is exam-specific
    code outside web/src/modules/exam/, and a second core file importing module internals besides
    registry.ts, which D3 names as the only sanctioned importer.
  - web/src/modules/ModuleGuard.tsx is generic core infrastructure but also sits at the modules root;
    its doc comment says it is only used from examRoutes.tsx.
  - web/src/modules/types.ts ModuleDefinition.routes: ModuleRoute[] with `element?: string` (string
    names). router.tsx does NOT render these; it spreads REGISTERED_MODULE_ROUTE_OBJECTS
    (registry.ts:20-22). getInstalledModuleRoutes() appears to have no non-test caller (verify with
    git grep). Two parallel route mechanisms: a new module author cannot tell which one is real.
  - registry.ts maintains REGISTERED_MODULES and REGISTERED_MODULE_ROUTE_OBJECTS as two separate
    hand-edited lists; adding a module means editing both and adding a <id>Routes.tsx to core.
  - The fake 'sample' module in registry.ts is tracked by ISS-0836 -- resolve it there, not here.

  0039 D8 expects further modules (HR, WMS, ...) to be built later by agents from requirements; the
  current shape makes each one copy the exam workaround.
affected_files:
  - "web/src/modules/registry.ts"
  - "web/src/modules/types.ts"
  - "web/src/modules/examRoutes.tsx"
  - "web/src/modules/ModuleGuard.tsx"
  - "web/src/modules/exam/index.ts"
  - "web/src/router.tsx"
depends_on:  # resolve these first; queue depends_on carries the same edges
  - ISS-0836
fix_direction: |
  CODE-DESIGNER confirms the target, taking ISS-0836's resolution as input:
  - each module's web/src/modules/<id>/index.ts exports ONE ModuleDefinition: id, depends_on, navItems,
    routeObjects (RouteObject[]);
  - registry.ts holds ONE list and derives both nav items and route objects from it, wrapping each
    module's routes in ModuleGuard itself (modules never import ModuleGuard);
  - ModuleGuard moves to a core location outside web/src/modules/ (e.g.
    web/src/components/routing/ModuleGuard.tsx);
  - examRoutes.tsx content moves into web/src/modules/exam/; the string-element ModuleRoute mechanism
    and any dead helpers are removed;
  - SPA paths unchanged (exam, exam/:examId/session, exam/sessions/:sessionId/result, admin/bilimbaga,
    admin/bilimbaga/:entityType).
acceptance_criteria:
  - "`git ls-files web/src/modules` shows at the root only registry.ts, types.ts, __tests__/ and <id>/ directories (output quoted)"
  - "registry.ts contains exactly one module list; a unit test proves nav items and route objects are both derived from it"
  - "`git grep -n -i exam -- web/src/router.tsx web/src/components/layout/AppShell.tsx` returns nothing (output quoted)"
  - "for a tenant with exam installed all five exam SPA paths render; for a tenant without it each renders NotFound -- existing tests plus any missing case, output quoted"
  - "`npm run check` in web/ passes, output quoted"
status: done
resolved_at: "2026-09-26T20:15:00Z"
resolved_by: ORCH (session-A)
resolution: |
  Changes (all in web/):
  1. src/components/routing/ModuleGuard.tsx - new location for ModuleGuard
     (moved from web/src/modules/ModuleGuard.tsx per ISS-0844 fix direction)
  2. src/modules/ModuleGuard.tsx - DELETED
  3. src/modules/examRoutes.tsx - DELETED (content moved inside exam module)
  4. src/modules/exam/examRoutes.tsx - NEW: exam's RouteObjects (JSX), no guard
  5. src/modules/exam/index.ts - updated: routeObjects replaces routes (strings)
  6. src/modules/types.ts - updated: ModuleDefinition.routeObjects: RouteObject[]
     instead of routes: ModuleRoute[]; added AGENT_RUNNER to ModuleRole;
     removed ModuleRoute interface
  7. src/modules/registry.ts - ONE list (REGISTERED_MODULES); derives both
     REGISTERED_MODULE_ROUTE_OBJECTS and nav items from it; registry wraps
     each module's routeObjects in ModuleGuard via createElement
  8. src/modules/__tests__/registry.test.ts - updated to use routeObjects;
     added third test proving single-list derivation
  9. src/modules/exam/__tests__/examModule.nav.test.tsx - updated import path
     for ModuleGuard
  10. src/router.tsx - removed 'exam' from comment (AC3)

  AC verification:
  - AC1: git ls-files web/src/modules at root: registry.ts, types.ts, __tests__/,
    exam/ (output: see git ls-files src/modules grep above)
  - AC2: registry.ts has ONE list; registry.test.ts third test verifies it
  - AC3: git grep -n -i exam -- web/src/router.tsx web/src/components/layout/AppShell.tsx
    returns nothing (verified)
  - AC4: existing exam nav tests in AppShell.module-nav.test.tsx cover install/no-install;
    examModule.nav.test.tsx covers the 5 exam paths for installed/uninstalled
  - AC5: npm run check passes (137 test files, 934 tests)
