id: ISS-0846
title: |
  No 'how to add an application module' guide -- the S11 contract is only reconstructable from decision 0039 plus seventeen requirement texts
discovered_by: "ORCH (architecture audit of S11 / decision 0039 on main 12f0a78f)"
discovered_in_run: ADHOC-20260926-S11-AUDIT
discovered_at: "2026-09-26T09:56:42Z"
severity: MINOR
tags:
  - docs
  - modules
  - guide
  - decision-0039
description: |
  0039 D8 says new modules (HR, WMS, ERP, ...) are extracted when a client needs them; they will be
  built by pipeline agents from requirements. No doc in docs/guides/ explains the module contract end to
  end. An implementer must reverse-engineer: layout (lib/letflow/modules/<id>/, priv/modules/<id>/,
  web/src/modules/<id>/); Letflow.Modules.Module callbacks and defmanifest; permissions / role_grants /
  route_policies rules and the Catalog fallback in Letflow.Api.Authorization; router mounting under
  /api/v1/modules/<id>/ and the 404 gate; pack location and on_install/2; registration in
  config/config.exs AND config/test.exs (and updating test/letflow/modules/catalog_test.exs -- the
  root cause of ISS-0838); tenant_modules backfill migrations for existing tenants;
  settings_schema and the settings write route; solution manifests priv/solutions/<id>.json; frontend
  ModuleDefinition/registry; boundary checks (mix letflow.check_boundaries, the ESLint rule); and what
  is explicitly out of scope (uninstall, client scripts, CANDIDATE role).
