description: |
  The done flips for REQ-409..REQ-416 were committed while CI on each backend commit failed or was
  cancelled (see ISS-0840 and ISS-0841). A full local `mix test` on 12f0a78f
  with a fresh test DB shows failures:
  - CatalogTest x2 (ISS-0838)
  - Mix.Tasks.Letflow.Seed.ExamFixturesTest x5 (ISS-0839)
  - Letflow.RouterTest REQ-070 AC5 x2 (ISS-0827)
  - Letflow.Docs.RequirementStatusInvariantsTest A3/A4a/A4b/A5 (ISS-0833)
  - Mix.Tasks.Letflow.LintHandoffsTest ISS-0819 single-file mode (ISS-0834)
  The run was cut off by a 50-minute timeout before ExUnit's summary, so the total is unknown.

  What IS verified (2026-09-26): 0039's three measurements hold -- `mix letflow.check_boundaries`: OK,
  911 edges, 0 violations; no exam permission atom in authorization.ex code (doc text only);
  lib/letflow/exam/, lib/letflow/packs/bilimbaga.ex, lib/letflow/routers/exam_sessions.ex,
  web/src/pages/exam/ are gone. web/: tsc clean, eslint clean, vitest src/modules + src/router 58/58.
  What is NOT verified: stage-11 P2's "full backend suite and the S10 Playwright specs green", and P3's
  end-to-end claim, on a completed run.
