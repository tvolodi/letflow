description: >
  ISS-0848 built mix letflow.check_queue_reconciliation, a new check
  comparing docs/requirements.yaml + docs/issues/*.yaml status against the
  live letflow-queue's own status. Its first live run (after fixing a
  genuine issue-status-vocabulary design gap that produced ~40 false
  positives, since corrected in the same fix) found 42 real findings, split
  into several distinct classes -- some already reconciled directly, most
  requiring individual review this fix could not respons ibly perform in bulk.

  **Already reconciled (queue-side, high confidence, same session):**
  14 issues (ISS-0109/0114/0115/0116/0214/0456 "instrumented";
  ISS-0200/0266/0409/0410/0416/0419/0432/0433 "no_defect") had their queue
  task force-released from "done" back to "blocked". This direction was high
  confidence because docs/agents/protocols/ISSUE_QUEUE.md is explicit and
  unambiguous: an instrumented/no_defect outcome MUST be released
  `status: "blocked"`, never `"done"` -- a `"done"` release best-effort
  closes the linked GitHub issue, falsely asserting the underlying defect
  was fixed when these records explicitly say it was not (the exact failure
  mode TASK_QUEUE.md's own account of ISS-0277/#360/#366/#367 already
  documents). No case-by-case judgment was needed; the rule has no
  exceptions.

  **NOT reconciled -- genuinely needs individual review, direction unclear:**

  1. 14 issues whose yaml `status: open` disagrees with a queue status of
     `done` or `blocked`: ISS-0108, ISS-0112, ISS-0285, ISS-0423, ISS-0447,
     ISS-0453, ISS-0678, ISS-0734, ISS-0745, ISS-0764, ISS-0776, ISS-0783,
     ISS-0786, ISS-0789. Spot-checked two (ISS-0108, ISS-0285) in full: BOTH
     are genuinely still-open, unresolved issues whose own yaml text
     explicitly says so ("Left open, not instrumented -- no diagnostic
     capability was shipped" for ISS-0108; "No code change made (root cause
     not conclusively localized)" for ISS-0285) -- meaning for at least
     these two, the QUEUE is wrong (something incorrectly released these as
     done), not the yaml. This is the OPPOSITE direction from what the
     original ISS-0848 reconciliation (12 requirement tasks) needed, so it
     cannot be assumed to generalize to all 14 without checking each one
     individually -- some may instead be the mirror case (yaml genuinely
     stale, issue actually resolved, same shape as ISS-0588/ISS-0593 fixed
     during ISS-0848's own work).
  2. 2 requirements whose yaml `status: pending` disagrees with a queue
     status of `done`/`blocked`: REQ-222, REQ-294. Not investigated at all
     this pass.
  3. 8 real, on-disk issue-status values with no documented meaning in
     ISSUE_QUEUE.md's vocabulary, currently reported as
     `:unrecognized_yaml_status` rather than silently mapped:
     `reopened` (2 files), `fixed`, `declined` (2 files),
     `closed_not_applicable`, `resolved_via_duplicate`,
     `resolved_not_applicable`, plus one issue file using the
     requirements-vocabulary value `done` where an issue-vocabulary value
     was expected. Whoever picks this up should decide, with REVIEWER
     sign-off, whether each is a legitimate vocabulary extension
     ISSUE_QUEUE.md should document (and what queue-status it maps to) or a
     one-off typo/legacy spelling that should be corrected to a real value
     instead.

  **A real, pre-existing parser bug, unmasked (not caused) by this fix:**
  `Mix.Tasks.Letflow.CheckIssueRefs.capture/2` (around line 219-227)
  `String.trim`s each line BEFORE regex-matching for a `key: value` field,
  so an indented line inside a YAML folded block scalar (`description: >`,
  `resolution: >`) that happens to start with something matching
  `^\s*status:` gets misread as a real top-level `status:` field.
  `Enum.find_value` then returns whichever "field" is found FIRST in file
  order, which is sometimes the prose fragment, not the real field. Found
  via 4 misparsed files: ISS-0033 (captured
  "BLOCKED and no released_lock/lock_released_at fields, but" as its
  status), ISS-0064 (captured a parenthetical clause from its own prose),
  ISS-0278 (captured the literal string "open:" -- a colon inside a prose
  sentence), ISS-0631 (captured an Elixir code snippet quoted inside its own
  description text: `String.to_existing_atom(fv(session, "status"))`). This
  bug predates ISS-0848 entirely and was invisible before because every
  misparse happened to land in the old, undifferentiated
  `mix letflow.check_issue_refs` output as a different kind of finding (or
  wasn't checked against at all) -- it is now visible specifically because
  check_queue_reconciliation's new `:unrecognized_yaml_status` finding kind
  reports the exact (wrong) captured value, making the parser defect
  self-evident. Real files' actual `status:` fields (verified by direct
  `grep -n '^status:'` on all four) are: ISS-0033 `open`, ISS-0064
  `resolved`, ISS-0278 `open`, ISS-0631 (not yet verified -- flagged for
  whoever fixes this to confirm).
