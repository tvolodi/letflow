severity_rationale: >
  MAJOR -- not because any single item is severe, but because the parser
  bug means mix letflow.check_issue_refs (an existing, already-relied-on
  check) has been silently misreporting status for at least 4 files, and
  the 14+2 genuine status-disagreement backlog represents real,
  currently-undetected drift between the queue (which gates future
  get_next_task claims) and the yaml (which humans/agents read as ground
  truth) -- exactly the class of problem ISS-0848 itself was filed to catch,
  just at a scale too large to safely bulk-resolve in one pass without
  individually verifying each item's true state.
fix_direction: >
  1. Fix `CheckIssueRefs.capture/2`'s line-matching to only consider
     column-0 (non-indented) lines as real top-level fields, or use a real
     YAML parser instead of line-by-line regex matching, so a folded block
     scalar's contents can never be misread as a sibling field.
  2. For each of the 14 open-vs-done/blocked issues: read the file in full,
     determine the TRUE current state (genuinely resolved but yaml never
     updated -- back-fill yaml per the ISS-0588/ISS-0593 precedent; or
     genuinely still open/unresolved -- force-release the queue task back
     to open or blocked per TASK_QUEUE.md's own release-status rules), one
     at a time, citing real evidence for each decision.
  3. Investigate REQ-222 and REQ-294 individually the same way.
  4. Decide the 8 undocumented issue-status values' fate (document as real
     vocabulary extensions with queue-status mappings, or correct as
     typos/legacy spellings) with REVIEWER sign-off, then update
     mix letflow.check_queue_reconciliation's issue-status mapping table
     (§3.3b of its design doc) to match the decision.
  5. Re-run mix letflow.check_queue_reconciliation after each batch of
     fixes to confirm convergence toward zero findings.
