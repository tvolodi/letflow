id: ISS-0849
title: >
  mix letflow.check_queue_reconciliation's first live run surfaced a large
  pre-existing backlog (~28 items) and a real parser bug -- both out of
  ISS-0848's own scope, tracked here for individual case-by-case review
discovered_by: ELIXIR-DEV / ORCH (fix/ISS0848-queue-reconciliation-20260926)
discovered_in_run: fix/ISS0848-queue-reconciliation-20260926
discovered_at: "2026-09-26T13:05:00Z"
severity: MAJOR
tags:
