fix_direction: >
  1. Run test/docs/requirement_status_invariants_test.exs A4b in isolation
     and read its failure output for the exact file/line of each of the 9
     unparseable timestamps.
  2. For each, determine whether it's pre-existing history in an already
     closed-and-pinned volume (in which case declare it in the index's
     known_shape_anomalies:/known_anomalies: per the established mechanism,
     same as ISS-0833's own entries -- never rewrite frozen history) or a
