resolution_2026_09_27: >
  Fixed on branch fix/ISS0869-playwright-timeout-flake-20260927 (commit e844b072).
  Root cause confirmed exactly as filed: `page.getByTestId('data-table').isVisible({
  timeout: 10_000 }).catch(() => false)` does not poll/retry -- `Locator.isVisible({
  timeout })` is a single, immediate DOM check, so the generous-looking 10s timeout
  never actually waited for the EntityCrudPage table to finish rendering. Replaced
  with the genuinely auto-retrying `expect(page.getByTestId('data-table')).toBeVisible({
  timeout: 10_000 })`, matching the idiom already used by the adjacent
  `examRow(...).toBeVisible({ timeout: 10_000 })` assertion in the same file. Exactly
  one file changed: web/tests/e2e/exam-lifecycle.e2e.spec.ts (+10/-2).
  RELEASE-VALIDATOR independently re-verified: 5/5 standalone reruns of the target
  test with `--retries=0` all passed (previously flaky under these exact conditions);
  full-file regression run of all 6 tests in exam-lifecycle.e2e.spec.ts, 6/6 passed;
  diff independently confirmed as the single file/+10/-2 described above; root-cause
  fix confirmed technically correct (non-retrying `isVisible({ timeout })` swapped for
  retrying `expect(...).toBeVisible({ timeout })`, the same idiom already in use
  elsewhere in this file). PASSed. A non-blocking anti-patterns.md entry was added in
  the same PR per REVIEWER's suggestion during this fix's review, documenting that
  `Locator.isVisible({ timeout })` does not poll despite the `timeout`-looking option.
