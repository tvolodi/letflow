description: >
  Flagged for investigation alongside ISS-0766 (same `Ecto.NoResultsError`
  shape reported against the shared "bpm-default" realm binding, this time
  surfacing in
  test/letflow/plugs/iss0778_platform_role_seeding_e2e_test.exs's T4
  describe block rather than test/letflow/identity_test.exs). Confirmed,
  not merely suspected, to share ISS-0766's exact mechanism: T4's own
  moduledoc ("Fixture mechanics for a freshly-onboarded tenant's OIDC
  realm", lines 25-52) states it calls
  `Letflow.Support.BpmDefaultRealmDisplacement.displace!/0` directly, the
  same function whose interrupted-restoration failure mode ISS-0766's
  2026-09-27 root-cause pass identified: `displace!/0`'s `nil ->` branch
  treats "no tenant currently holds the bpm-default binding" as an
  already-correct state and never re-seeds it, so once any caller's
  on_exit-based restoration fails to run (an abnormally-killed test
  process -- SIGKILL, OOM-kill, CI cancellation/timeout, or an orphaned
  stray process, the exact class ISS-0829's TEST-RUNNER report caught
  live), the migration-seeded singleton row is permanently gone from that
  physical database and EVERY later caller of `displace!/0` (T4 included)
  or `with_lock/1` (identity_test.exs's `insert_default_tenant!()`)
  against that same database fails identically and deterministically, with
  no live race or parallelism required. See docs/issues/ISS-0766.yaml's
  `fix_direction` for the full root-cause writeup and reproduction
  evidence (live repro: killing a `scripts/test_parallel.sh` run mid-flight
  orphaned partition 1's bpm-default row; a direct SQL check confirmed
  zero matching rows; both identity_test.exs and auth_pipeline_test.exs
  then failed/no-op'd against that same corrupted database with no
  concurrency at all).
