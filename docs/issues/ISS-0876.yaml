severity_rationale: >
  MAJOR, matching ISS-0426's own original severity: the root cause is the
  identical production mechanism ISS-0426 was filed against (the unmitigated
  Task.yield wall-clock race), confirmed still live and reachable from 7
  tests/9 call sites via a call shape (bare execute_with_manifest/2) ISS-0426's
  own enumeration never covered. Not flagged as a "recurrence" of ISS-0426 per
  WF-03 Step 0.5's rule (that rule applies when "the same root cause has
  recurred" from a fix that didn't hold for the call sites it targeted) --
  ISS-0426's fix holds perfectly for all 14 call sites it targeted; this is a
  genuinely separate, never-covered call-site class, which is why this is
  filed as its own record per core-directives.md's structural-attribution
  rule, exactly as the filer required.

recommended_next_step: >
