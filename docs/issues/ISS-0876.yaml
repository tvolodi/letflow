      - "the file contains exactly 31 run_script_sync/3 or run_with_heap_limit_sync/4 call sites"
  - path: test/letflow/engine/lua/executor_test.exs
    describe: "ISS-0426: seam equivalence (property a)"
    tests:
      - "run_script_sync/3 returns the same manifest_hash as execute_with_manifest/3 for a non-empty manifest"
      - "run_script_sync/3 returns the same {:error, _} shape as execute_with_manifest/3 for a Lua syntax error"

