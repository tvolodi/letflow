resolution_summary: >
  ELIXIR-DEV repointed all 9 at-risk bare 2-arity
  Executor.execute_with_manifest/2 call sites this diagnosis identified
  (test/letflow/engine/lua/executor_test.exs, originally lines 64/73/88/93/
  188/192/209/225/228) onto Executor.run_script_sync/3 or
  run_with_heap_limit_sync/4, per the design at
  lib/letflow/design/iss876-wallclock-2arity-gap.md (commit 5867633c on
  branch feature/WF03-ISS0876-20260928). REVIEWER and SECURITY-REVIEWER
  both PASSed. TEST-DESIGNER added 4 tests to the same file (169 insertions,
  committed at WF-03 Step Final): 2 behavioral-equivalence tests in the
  "ISS-0426: seam equivalence (property a)" describe block --
  "run_script_sync/3 returns the same manifest_hash as
  execute_with_manifest/3 for a non-empty manifest" (line 1346) and
  "run_script_sync/3 returns the same {:error, _} shape as
  execute_with_manifest/3 for a Lua syntax error" (line 1375) -- plus 2
  AST-based structural/regression-guard tests in the new "ISS-0876: bare
  2-arity execute_with_manifest/2 elimination" describe block (line 1600):
  "no bare 2-arity Executor.execute_with_manifest/2 call remains except the
  3 short-circuit exclusions" (line 1629, pins the count of remaining bare
  2-arity calls to exactly 3 -- the legitimately-excluded
  normalize_script_ref/1 short-circuit sites) and "the file contains
  exactly 31 run_script_sync/3 or run_with_heap_limit_sync/4 call sites"
  (line 1675, regression guard against a future revert back onto the
  racing path). TEST-DESIGN-VALIDATOR independently applied a mutant
  (reverting one conversion back to bare 2-arity) and confirmed both
  structural tests fail correctly, then confirmed a clean revert.
  TEST-RUNNER: this file's own scope is 49 passed/11 excluded/0 failures;
  the full mix letflow.check.test run has 3 failures, all in files this
  branch never touches (ServiceTaskWiringTest, RequirementStatusInvariantsTest,
  RetentionOperationsTest) -- unrelated, pre-existing, already being filed
  separately. RELEASE-VALIDATOR independently re-derived the root-cause
  removal from source (grep confirmed exactly 3 remaining bare 2-arity
  calls, all at the 3 legitimately-excluded sites), re-ran the test file
  clean, re-ran the full suite and confirmed the same 3 unrelated failures
  are flaky/pre-existing (2 of 3 passed on isolated re-run), and PASSed
  release-readiness.

regression_tests:
