  for a COMPLETELY UNRELATED issue (a REQ-421/MOB-2 AC3 test-coverage gap)
  and its own queue_ref field also reads "Q-880" -- i.e. two distinct,
  unrelated issue records both claim queue task id 880. Per
  docs/agents/protocols/TASK_QUEUE.md's own documented history ("the id
  equality this bullet used to assert is SUPERSEDED... 27 contradict it"),
