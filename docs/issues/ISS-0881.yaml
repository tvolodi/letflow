filename_numbering_anomaly: >
  This record is filed as ISS-0881 rather than ISS-0880 despite being
  registered via letflow-queue as task id 880 (queue_ref: Q-880,
  github_issue_number 1958) -- letflow-queue's own /tasks response
  confirmed this task genuinely was freshly created at registration time
  (2026-09-29T00:17:20Z, status: open, previously nonexistent), NOT a
  duplicate or a stale read. However, docs/issues/ISS-0880.yaml already
  exists on main (merged via PR #1955, commit df437035, status: resolved)
  for a COMPLETELY UNRELATED issue (a REQ-421/MOB-2 AC3 test-coverage gap)
  and its own queue_ref field also reads "Q-880" -- i.e. two distinct,
  unrelated issue records both claim queue task id 880. Per
  docs/agents/protocols/TASK_QUEUE.md's own documented history ("the id
  equality this bullet used to assert is SUPERSEDED... 27 contradict it"),
  filename-to-queue-id equality was never a reliable invariant in this
  project, so this is treated as a known-tolerated anomaly rather than a
  blocking one -- ORCH picked the next unused ISS-NNNN filename (ISS-0881)
  instead of overwriting the existing, already-closed ISS-0880.yaml record.
  Root cause of the underlying id collision (why two unrelated
  register_task calls both produced/recorded queue task id 880) is NOT
  investigated here -- flagged for a future session or for
  letflow-queue's own maintainers to look into if it recurs.

