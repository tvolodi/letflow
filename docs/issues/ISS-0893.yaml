id: ISS-0893
title: "Seeded swiftroute Shipment Approval v1.0 definition has null key/process_key/process_id: scenario key proc-swiftroute-shipment-approval does not resolve (KEY_MISMATCH)"
discovered_by: ORCH
discovered_in_run: ai-dala-infra 2026-09-29-provision-letflow-qa-uat-corpus-001 (T-0150), filed by ORCH
discovered_at: "2026-09-29T19:45:00Z"
severity: MAJOR
description: "On QA, definition 'Shipment Approval' v1.0 (id 498deba9-3036-4287-80d4-ba37679d2662), deployed by scripts/seed_swiftroute_definition.sh from test/fixtures/qa/swiftroute_process_definition.json, returns key, process_key and process_id all null from GET /api/v1/definitions?name=Shipment+Approval&status=active. The swiftroute scenario preconditions reference proc-swiftroute-shipment-approval, so lookup fails (KEY_MISMATCH). Diagnose whether the definition API/schema has a key field the seed payload fails to set, or the scenarios should reference the display name/id; fix the fixture, script, or scenarios so the key resolves, and make the seed script print/verify the key. Provenance: ai-dala-infra run 2026-09-29-provision-letflow-qa-uat-corpus-001 (T-0150), step-04 P5/D2/D6/R9 and step-06. Filed by ORCH. QA now has realms+tenants swiftroute/meridian/vortex and 22 actor accounts (realm-qualified secrets via ai-dala-infra scripts/qa-uat-env.sh)."
affected_files:
  - scripts/seed_swiftroute_definition.sh
  - test/fixtures/qa/swiftroute_process_definition.json
  - test/fixtures/uat/scenarios/swiftroute/
queue_ref: Q-893
github_ref: GH-2002
status: resolved
resolved_in_run: fix/ISS-0893-swiftroute-definition-key-mismatch-20260929
resolved_at: "2026-09-29T21:40:12Z"
resolution: >
  Resolved fixture/tooling-side (Option 2 of
  lib/letflow/design/iss0893-swiftroute-definition-key-mismatch.md), not by
  adding an app-side key/slug column: process_definitions has no key/slug
  column, and Letflow.Definitions.get_active_by_name/2 (GET
  /definitions/active/:name) already resolves by the free-text `name` field,
  which is the deployed definition's real identifier ("Shipment Approval").
  A new additive sidecar,
  test/fixtures/uat/process-definition-aliases/proc-swiftroute-shipment-approval.yaml,
  maps the UAT scenario corpus's synthetic process_id
  (proc-swiftroute-shipment-approval) to that real definition name, deliberately
  outside both `mix letflow.check_uat_scenario_schema`'s and
  scripts/uat_preflight.sh's own scenario-file globs so the three affected
  ported/byte-identical scenario files
  (shipment-ops-timeout-escalation.yaml, shipment-high-value-happy.yaml,
  shipment-attach-delivery-note.yaml) remain untouched. scripts/uat_preflight.sh's
  `definitions` check (added by ISS-0894) now consults this alias sidecar to
  resolve a proc-* scenario's process_id to the real name before calling
  GET /definitions/active/:name. scripts/seed_swiftroute_definition.sh now
  echoes the resolved name/key explicitly after seeding, so a future
  mismatch is visible at seed time rather than only at preflight time.
  docs/agents/uat-scenario-schema.md's scenario-reading paragraph updated to
  document the alias-sidecar mechanism. CODE-DESIGN-VALIDATOR, REVIEWER, and
  RELEASE-VALIDATOR all PASSed. Merged via PR #2011 (fix/ISS-0893-swiftroute-
  definition-key-mismatch), squash-merged to main.
