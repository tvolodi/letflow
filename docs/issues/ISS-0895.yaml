id: ISS-0895
title: "Swiftroute tenant-onboarding-happy needs slug 'swiftroute' unregistered but other swiftroute scenarios need it registered: redesign scenario to onboard a different slug"
discovered_by: ORCH
discovered_in_run: ai-dala-infra 2026-09-29-provision-letflow-qa-uat-corpus-001 (T-0150), filed by ORCH
discovered_at: "2026-09-29T19:45:00Z"
severity: MINOR
description: "test/fixtures/uat/scenarios/swiftroute/tenant-onboarding-happy precondition requires slug swiftroute to be UNREGISTERED and registers it (driving a Keycloak realm-creation saga needing master access). The other swiftroute scenarios and cross-tenant probes require the swiftroute tenant/realm to exist, and QA now has it registered (T-0150), so the onboarding scenario is permanently precondition-blocked on QA (tenants are deactivate-only, immutable idp_realm_id). Decide and implement: re-point the scenario at a throwaway slug (e.g. swiftroute-uat, with unique-per-run suffix so reruns do not collide), or mark it env-scoped/expected-unrunnable on shared QA. Note a throwaway-slug onboarding also needs a master-realm credential (see the admin/admin hard-code issue and ISS-0888) and leaves undeletable tenant rows and schemas. Provenance: ai-dala-infra run 2026-09-29-provision-letflow-qa-uat-corpus-001 (T-0150), step-04 P5/D2/D6/R9 and step-06. Filed by ORCH. QA now has realms+tenants swiftroute/meridian/vortex and 22 actor accounts (realm-qualified secrets via ai-dala-infra scripts/qa-uat-env.sh)."
affected_files:
  - test/fixtures/uat/scenarios/swiftroute/
queue_ref: Q-895
github_ref: GH-2004
status: resolved
resolved_in_run: fix/ISS0895-swiftroute-uat-scenario-env-limitation-20260929
resolved_at: "2026-09-29T21:30:00Z"
resolution: >
  Chose the "mark env-scoped/expected-unrunnable" option rather than
  re-pointing the scenario at a throwaway slug (the throwaway-slug option was
  rejected: it needs a master-realm credential per ISS-0888 and leaves
  undeletable tenant rows/schemas behind on every run). Added a new, additive
  sidecar mechanism: test/fixtures/uat/scenario-env-limitations/<scenario_id>.yaml
  files, deliberately outside scripts/uat_preflight.sh's scenario-file glob (so
  `mix letflow.check_uat_scenario_schema` never sees them as scenario files),
  each declaring scenario_id, classification (ENV_NOT_SUPPORTED), applies_to_environments,
  issue_ref, recorded_by/recorded_at, and a free-text reason. scripts/uat_preflight.sh
  gained a new independent `env_limitation` preflight check column (alongside
  spec/local_deps/feature/tenant/realm/actors) that looks up the running
  scenario's id in this sidecar directory and reports GAP with the sidecar's
  classification/reason when the current --environment matches
  applies_to_environments, else OK. docs/agents/workflows/WF-05_uat_run.md Step 0
  and .claude/agents/uat-runner.md updated to document the new "environment-
  structural (permanent)" GAP category so UAT-RUNNER stops re-attempting this
  scenario against QA on every future preflight run and instead reports it as a
  permanent structural gap. docs/anti-patterns.md gained an entry documenting the
  scripts/uat_preflight.sh `tenant` check's underlying polarity-assumption bug
  (assumes every scenario sharing a company_id directory wants the same
  tenant-existence polarity) that this fix works around additively without
  correcting, so a future onboarding-shaped scenario will hit the same blind
  spot unless it also gets its own sidecar. test/fixtures/uat/scenarios/swiftroute/
  tenant-onboarding-happy.yaml itself was NOT modified (diff-confirmed empty
  against main) -- it is still a valid, runnable scenario on any environment
  where swiftroute is genuinely unregistered (e.g. local); only QA is
  permanently precondition-blocked, and that is now what the sidecar records.
  Scope confirmed to exactly 6 files: scripts/uat_preflight.sh,
  test/fixtures/uat/scenario-env-limitations/swiftroute-tenant-onboarding-happy.yaml,
  .claude/agents/uat-runner.md, docs/agents/workflows/WF-05_uat_run.md,
  docs/anti-patterns.md, and
  lib/letflow/design/iss0895-swiftroute-uat-scenario-slug-conflict.md.
  Full gate history: CODE-DESIGNER -> CODE-DESIGN-VALIDATOR PASS (independently
  verified 3 load-bearing facts) -> ELIXIR-DEV implement (one self-flagged,
  well-justified deviation from the design's pseudocode, to avoid a script
  crash) -> REVIEWER PASS (live execution proof) -> RELEASE-VALIDATOR PASS,
  independently re-verifying: scope confirmed to exactly the 6 files above; the
  ported scenario file confirmed byte-for-byte untouched; live execution
  reproduced independently (`scripts/uat_preflight.sh --environment qa` ->
  env_limitation: GAP/ENV_NOT_SUPPORTED for tenant-onboarding-happy;
  `--environment local` -> env_limitation: OK); glob-invisibility of the new
  sidecar directory confirmed via both `mix letflow.check_uat_scenario_schema`
  (32 scenario files, 0 violations, unchanged count from before this fix) and a
  direct glob-pattern trace; docs/anti-patterns.md entry confirmed accurate.
  This fix means the scenario will now be correctly and permanently reported as
  a structural GAP on QA (not attempted/failed) on every future QA UAT
  preflight run, rather than silently reporting a false tenant: OK the way it
  did before ISS-0895 was filed.
