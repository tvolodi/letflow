id: ISS-0896
title: "E2E specs hard-code Keycloak master admin-cli + admin/admin: cannot run against QA (master admin is qa-admin with a generated password)"
discovered_by: ORCH
discovered_in_run: ai-dala-infra 2026-09-29-provision-letflow-qa-uat-corpus-001 (T-0150), filed by ORCH
