description: >
  Found in platform/renderer-permission-denied-surface (WF05-FULL2-20260930, QA).
  Steps 1-4 pass. At step 5, after the operator's group membership is revoked,
  the My Tasks page also renders the permission-denied message; the scenario
  expects My Tasks to be unaffected (or to show its own empty/permission state as
  specified). Confirm the intended behaviour against the scenario and REQ-378,
  then fix either the page or the scenario expectation.
