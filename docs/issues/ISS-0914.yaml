queue_ref: null  # discovered directly by REVIEWER during PR gate review, not queue-originated; ORCH to register if/when prioritized
github_ref: null  # not yet mirrored to GitHub
status: open
suggested_fix: >
  Root-cause the actual DOM/event condition that makes a second dblclick
  dispatch fail to register with xyflow's edge click handler after a
  save/re-layout cycle (candidate suspects: a stale node/edge element
  reference held past a re-render, an event listener detached and not
  re-attached by xyflow's internal reconciliation, or a z-index/hit-testing
  regression introduced by the auto-layout step). ISSUE-FIXER should
  reproduce directly (a minimal Playwright repro outside the full pipeline
  spec) before proposing a fix, per this project's diagnosis-before-fix
  convention.
