resolution: >
  All 16 onClick handlers in ServicesPage.tsx (row actions incl. Publish/Retire,
  Create, dialog Cancel/confirm/submit buttons) now run via deferClickState.
  Regression test ServicesPage.iss0916.test.tsx. Root cause still unidentified
  (workaround, per ISS-0662 convention).
