description: >
  Found by WF02-REQ432-20260930 step-02b-rework1 (live Playwright run against the real SPA,
  FRONTEND-DEV): on /admin/services every trusted click that performs a synchronous setState
  hung the tab, including pre-existing handlers (Edit scope, Create cancel, Delete) that
  were NOT touched by REQ-432. REQ-432 wrapped only its own new handlers
  (openPublish/openRetire/confirm/submit, rebind dialog) with
  web/src/utils/deferClickState.ts per the project convention (ISS-0662/0737/0739 family).
  The remaining handlers in web/src/pages/admin/services/ServicesPage.tsx still freeze; the
  underlying root cause of the freeze is still not identified (deferClickState is a
  documented workaround). Fix: apply deferClickState to the remaining handlers and add a
  click-through regression test; ideally root-cause. Owner FRONTEND-DEV. Severity MINOR.
