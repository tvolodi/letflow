description: >
  Found in WF03-ISS0917-20261001 (design OQ-3). ServiceCatalog.delete/1 only checks ACTIVE process
  definitions. After ISS-0917 a pinned catalog SERVICE_TASK resolves its endpoint from the live row or
  service_catalog_versions; deleting the entry makes pinned in-flight instances go ERROR with
  service_task_catalog_unresolved/:version_not_found. Decide: block delete while non-terminal
  instances pin the service, or document. Severity MINOR. Owner ELIXIR-DEV (via CODE-DESIGNER).
