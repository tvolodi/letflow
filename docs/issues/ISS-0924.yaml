description: >
  Found by CODE-DESIGN-VALIDATOR in WF03-ISS0917-20261001. Sibling pipeline specs (attachment-cross-
  tenant, platform-definition-promotion-approved, -conflict-rejected, -rollback) use assignee_type
  'user' (lowercase) with a literal ref; Letflow.Tasks.apply_completion_authz/3 only has clauses
  nil/USER/GROUP/ROLE, so completing such a task would fail wherever those specs complete a task. Use
  uppercase USER with the admin token's JWT sub (see platform-instance-pin-survives-catalog-change
  spec, ISS-0917). Severity MINOR. Owner FRONTEND-DEV.
