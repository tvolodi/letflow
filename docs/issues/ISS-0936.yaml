resolution: >
  Root cause removed: fetch_credential in scripts/uat_preflight.sh now accepts a bare JWT
  line (three dot-separated base64url segments) from the qa-uat-env credential source's
  `token <user>` as well as the legacy `Token: <jwt>` form, so actor logins no longer
  report NO_PASSWORD. Queue ref Q-919 / GH-2070 (GitHub issue is closed by the queue's
  release_lock(done) sync after merge, not by this run). Design:
  lib/letflow/design/iss0936-uat-preflight-bare-jwt.md. Fail-first regression test:
  test/scripts/uat_preflight_bare_jwt_test.exs (8/8 pass, see
  handoffs/WF03-ISS0936-20261001/step-04-run-test-runner.json).
