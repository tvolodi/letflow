description: >
  Found incidentally while independently re-verifying PR #2061 (ISS-0920). After
  a real, naturally-occurring too_many_connections Postgres exhaustion killed one
  partition mid-build (no Result: line for that partition), running
  `mix letflow.check.test` on top of the already-completed scripts/test_parallel.sh
  invocation caused report_partition_failures/1
  (lib/mix/tasks/letflow.check.test.ex:345) to hang indefinitely -- observed
  ~0% CPU, zero output growth, for 26+ minutes before being killed by hand.
  Suspected trigger: very large partition logs (tens of MB, from debug-level
  Ecto query logging) and/or the missing-Result:-line crash case confusing the
  report-formatting step. Reproduced live, not theoretical. This is pre-existing
  code, untouched by PR #2061/ISS-0920's own changes (which only touch
  scripts/test_parallel.sh and test/test_helper.exs) -- filed separately rather
  than folded into that closure.
