description: >
  Engine writes no audit event for the outbound SERVICE_TASK HTTP
  request/body (found in ISS-0926 run WF03-Q926-20261001). sla_breach_30_days
  is visible only inside the SERVICE_TASK_COMPLETED payload decoded_body, and
  only for echoing endpoints (httpbin). Scenario
  regulatory-compliance-review-bafin.yaml EO-002 (verification method
  audit_event) stays unmet as worded. Options: audit an outbound-request
  event with a redacted/size-capped body, or BA reword EO-002 to read the
  completed payload. Do not log variable values beyond what rendered_url
  exposes without a SECURITY-REVIEWER pass.
acceptance_criteria:
  - "Decision recorded: audit outbound request vs reword EO-002"
  - "If audit: event emitted with capped body, SECURITY-REVIEWER PASS, test"
  - "EO-002 verifiable"
