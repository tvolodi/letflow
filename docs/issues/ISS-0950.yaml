id: ISS-0950
title: "Catalog service endpoint_url is not URL-validated at registration/publish time (decision 0027 gap)"
discovered_by: SECURITY-REVIEWER
discovered_in_run: WF03-ISS0917-20261001 (filed by ORCH)
discovered_at: "2026-10-01T14:06:29Z"
severity: MINOR
owner: "ELIXIR-DEV"
description: >
  Found by SECURITY-REVIEWER in WF03-ISS0917-20261001. POST /service-catalog and publish do no
  UrlValidator check on endpoint_url; the only control is the dispatch-time INV-9 gate in
  ServiceTaskDispatcher.http_transport/3. ISS-0917's fix makes catalog endpoints reachable by the
  dispatcher for the first time, so add fast-feedback syntactic validation (https scheme, host not
  private/loopback literal) at register/publish time in Letflow.ServiceCatalog /
  Routers.AdminServices. Defense in depth; dispatch gate stays binding. Severity MINOR (hardening).
  Owner ELIXIR-DEV (via CODE-DESIGNER).
affected_files:
  - lib/letflow/service_catalog.ex
  - lib/letflow/routers/admin_services.ex
queue_ref: Q-921  # queue issue_ref ISS-0921 collides with an existing local file; local filename ISS-0950
github_ref: GH-2095
status: resolved
resolved_in_run: WF03-ISS0950-20261001
resolved_at: "2026-10-01T15:41:53Z"
regression_tests:
  - test/letflow/service_catalog/endpoint_url_validation_test.exs
resolution_note: >
  Register/publish-time syntactic endpoint_url validation added in Letflow.ServiceCatalog /
  Routers.AdminServices; dispatch-time INV-9 gate remains the binding control. Gates in run
  WF03-ISS0950-20261001: RELEASE-VALIDATOR PASS (step 04d). GitHub issue GH-2095 is closed by
  ORCH after the merge lands, not by this run; the close comment cites the regression test above.
followup_notes:
  # Notes only; deliberately NOT filed as separate issue files (per step-05 handoff).
  - severity: MINOR
    note: >
      0.0.0.0/8 appears to be missing from UrlValidator blocked_ipv4? (pre-existing):
      https://0/ passes both register-time validation and the dispatch gate.
  - severity: MINOR
    note: >
      UrlValidator.validate(url, :no_dns) footgun: the :no_dns mode skips resolution-based
      checks, so callers can silently get a weaker validation than the dispatch gate applies.
  - severity: MINOR
    note: >
      Webhooks router possibly lacks a {:error, :target_url_not_allowed} clause for
      UrlValidator failures (unverified; flagged by review, not reproduced in this run).
