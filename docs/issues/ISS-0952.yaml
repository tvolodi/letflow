id: ISS-0952
title: "Stale HUMAN_TASK escalation timer is not cancelled when the task completes normally (fires later against whatever node the token is on)"
discovered_by: CODE-DESIGNER/ISSUE-FIXER
discovered_in_run: WF03-Q915-20261001 (ISS-0932)
severity: MAJOR
owner: "ELIXIR-DEV"
description: >
  Only TaskActivation.cancel_pending_timers (instance completion/cancel) cancelled
  timers; a normally-completed HUMAN_TASK left its escalation timer pending. If the
  instance was still active when it fired, the escalation acted on whatever node the
  token was then at (cancelled that HUMAN_TASK, followed its first edge) or errored.
affected_files:
  - lib/letflow/engine.ex
  - lib/letflow/engine/task_activation.ex
queue_ref: Q-925  # queue issue_ref ISS-0925; local number ISS-0952 (next free on origin/main and all open PRs)
github_ref: GH-2105
status: resolved
resolved_in_run: fix/ISS-0952-stale-escalation-timer
resolved_at: "2026-10-01T17:30:00Z"
resolution: >
  (1) Engine.complete_task now runs a :cancel_escalation_timers Multi step
  (TaskActivation.cancel_pending_escalation_timers/6, scoped to the task's
  token+node, cancel_reason "task_completed"). (2) advance_after_escalation_timer_fired/3
  treats a timer whose node_id differs from its token's current node as a no-op
  (escalation_timer_stale?/2). Two regression tests in
  human_task_escalation_test.exs both fail without the fix; 74 related tests pass.
