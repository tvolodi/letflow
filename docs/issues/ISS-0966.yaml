id: ISS-0966
title: "Meridian loan committee 2-of-3 quorum vote not modelled in Loan Origination definition (BA-MERIDIAN-003)"
discovered_by: BA-MERIDIAN
discovered_in_run: WF05-FULL3-20261001 (filed by ORCH)
