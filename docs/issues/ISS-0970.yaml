description: >
  vortex/supplier-quality-deviation-critical EO-004 and swiftroute: the
  quarantine-batch SERVICE_TASK_COMPLETED history event is stamped
  17:49:35.635Z but the next severity-classification task was created
  17:49:35.631Z (about 4ms earlier); no task-created history event and no
  audit row for the service task. History event timestamp appears to be
  insert time, after the following task insert in the same transaction, so
  ordering is only provable by sequence number, not timestamp. Decide: stamp
  events with the transaction's logical time / emit task-created events, or
  define ordering by seq and amend the scenario.
