id: ISS-0972
title: "test/support/simulation/runner.ex's :audit_event_ordering verification method shares ISS-0970's timestamp-only fragility and may exercise dead/unreachable logic"
discovered_by: REVIEWER
discovered_in_run: WF03-ISS0970-20261002
discovered_at: "2026-10-02T04:30:00Z"
severity: MINOR
owner: "ISSUE-FIXER (diagnosis first)"
description: >
  Flagged during ISS-0970's review (history event ordering only provable
  via sequence_number/global_seq, not timestamp, for events written in the
  same transaction as a following task row). test/support/simulation/
  runner.ex implements a separate :audit_event_ordering verification
  method (see its handle_verification/2 clause around line 661 and the
  shared resource_type helper around line 694) that compares events by
  timestamp the same way ISS-0970's EO-004 did before its fix -- same
  fragility, different fixture family. Not yet confirmed whether any
  live-run scenario still calls this method (it may be dead/unreachable
  code at this point), so this needs ISSUE-FIXER's diagnosis before
  deciding between a timestamp->sequence_number rewrite and removal.
acceptance_criteria:
  - "Confirm whether any scenario still invokes :audit_event_ordering; if live, rework it to order via sequence_number/global_seq per ISS-0970's precedent; if dead, remove it"
source_reports:
  - docs/issues/ISS-0970.yaml
related:
  - ISS-0970
status: resolved
resolved_in_run: fix/ISS-0972-audit-chain-ordering
resolved_at: "2026-10-02T16:14:01Z"
resolution:
  root_cause: >
    test/support/simulation/runner.ex's :audit_event_ordering verification
    compared two audit entries via DateTime.compare/2 -- the same
    timestamp-only fragility ISS-0970 found and fixed for events (which has
    sequence_number/global_seq). ISSUE-FIXER confirmed this was live,
    load-bearing code (consumed by
    test/fixtures/simulation/vortex/scenarios/supplier-quality-deviation-critical.yaml's
    EO-001-ordering scenario), not dead code.
  design: >
    lib/letflow/design/iss0972-audit-ordering-rework.md, 2
    CODE-DESIGN-VALIDATOR cycles (1st FAILed only on a mechanical issue --
    literal implementation code present in the design doc instead of
    specs/prose; substance was correct both times). CODE-DESIGNER confirmed
    audit_entries has no sequence-equivalent column but its
    chain_hash/prev_chain_hash hash-chain linkage (already used by
    verify_chain/2) is a genuine structural ordering primitive.
  fix: >
    New public Letflow.Audit.chain_precedes?/3 (walks prev_chain_hash
    backward, bounded by @max_chain_walk_hops = 10_000, returns
    {:ok, boolean()} | {:error, {:max_hops_exceeded, n} | {:broken_chain_link, hash}}).
    runner.ex's :audit_event_ordering clause reworked to delegate to it via
    new require_same_prefix/2/ordering_outcome/3 helpers.
    req207_vortex_test.exs's EO-001-ordering check now calls
    chain_precedes?/3 directly. New unit tests cover true-precedes,
    reversed/false, same-entry, broken-link, and max-hops-exceeded cases.
  reviewer: >
    PASSed; confirmed idiom consistency with verify_chain/2's house style,
    confirmed same-entry handling was genuinely specified by the design
    (not invented), noted ISS-0970's own resolution had already anticipated
    this exact follow-up.
  test_runner: >
    Full suite clean (5378/5378); flagged a tooling gap
    (test_parallel.sh watchdog orphan processes) filed separately as
    ISS-0978.
  release_validator: >
    Exhaustive independent re-verification -- hand-traced the walk logic's
    termination/correctness, constructed its OWN adversarial tests beyond
    the shipped suite (a 3-entry CYCLE in the chain, correctly caught by the
    hop-bound rather than infinite-looping; a mid-chain GAP, correctly
    producing broken_chain_link rather than crashing), confirmed the EO-001
    business claim genuinely holds (chain-insertion order coincides with
    real causal order for this scenario's sequential-engine-instance
    shape), confirmed docs/requirements.yaml untouched, independently
    re-ran the full suite (5378/5378). Flagged one NON-BLOCKING observation
    for future tracking: fetch_chain_tail/2's tail-selection query has no
    row lock, so under true concurrent writers to the same tenant chain,
    two inserts could theoretically race and fork the chain -- pre-existing
    insert_entry/3 behavior, untouched by this PR, out of scope for
    ISS-0972's own acceptance criteria.
  pr: "#2163"
  final_commit: 1f3ccd4b
queue_ref: null  # ISSUE closure, not a REQ; no letflow-queue task to release (owner: ISSUE-FIXER (diagnosis first), filed directly during ISS-0970's own closure; queue_ref: null per that precedent)
