  - lib/letflow/engine.ex (persist_escalation_timer_fired_advance/7)
  - lib/letflow/engine.ex (do_persist_service_task_advance/10)
  - test/letflow/iss0974_join_dispatch_id_map_test.exs
acceptance_criteria:
  - "A new regression test fixture drives a same-hop-chain PARALLEL_GATEWAY join whose next hop advances via persist_timer_fired_advance/7 into a SERVICE_TASK or TIMER-start node, fails pre-fix (reverting site 2 alone) with a real Ecto.UUID cast error, and passes post-fix"
  - "A new regression test fixture drives the same shape through persist_escalation_timer_fired_advance/7 (site 3), fails pre-fix (reverting site 3 alone), passes post-fix"
  - "A new regression test fixture drives the same shape through do_persist_service_task_advance/10 (site 4), fails pre-fix (reverting site 4 alone), passes post-fix"
  - "A mutation test reverting sites 2-4 together (mirroring RELEASE-VALIDATOR's own ISS-0974 mutation test) now fails the regression suite, closing the coverage gap RELEASE-VALIDATOR found"
related:
