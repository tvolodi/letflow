      clean; did a full-arc meta-check confirming ISS-0946/0969/0980/0981/
      0983 are all genuinely resolved on `origin/main` with the `tasks.ex`
      exclusion consistently documented across all of them.
  arc_closure: >
    This closes the entire 6-round audit-rescue-hardening arc: ISS-0946 ->
    ISS-0969 -> ISS-0980 -> ISS-0981 -> ISS-0983 -> ISS-0984, all now
    resolved on `origin/main`. Every `Audit.append_multi/4`/
    `Audit.insert_entry/3` call site reachable from a router boundary across
    `Letflow.Engine`, `Letflow.Identity`, `Letflow.Repository.Activation`,
    and `Letflow.PublicRead` now rescues a same-transaction raise into a
    typed `{:error, {:transaction_failed, exception}}` return. The one
    standing, deliberate exception is `lib/letflow/tasks.ex`'s
    `assign_task/3`/`reassign_task/4`, tracked as a separate, out-of-scope
    decision per ISS-0983 and consistently documented as such across
    ISS-0981/ISS-0983/ISS-0984 -- not a gap this arc left open by oversight.
