      confirmed zero-diff on `routers/` and `instances.ex`.
    REVIEWER: >
      PASS. Rescue shape matches `run_complete_task/6`'s precedent
      byte-for-byte; zero-diff claims confirmed; genuine DROP-TABLE test with
      rollback assertion verified; independently re-ran the FULL arc's grep
      sweep and confirmed it is genuinely clean modulo the known,
      ISS-0983-documented `tasks.ex` exclusion -- this is the arc's actual
      final clean sweep. Noted one minor non-blocking doc-accuracy gap:
      `engine.ex`'s `create_error()`/`complete_error()` types never got the
      documentation-parity treatment ISS-0981 proposed for them -- not
      blocking, not acted on in this round.
    TEST-RUNNER: >
      PASS. Independently confirmed 5398/5398 full suite clean plus the new
      regression test passing by name.
    RELEASE-VALIDATOR: >
      PASS. Independently re-traced the full call chain and re-ran the full
      grep sweep plus an adversarial scenario (confirmed
      `check_cancel_eligibility/1`'s legitimate error path is untouched by
