resolution:
  resolved_at: "2026-10-03T08:45:00Z"
  resolved_by: ELIXIR-DEV
  branch: fix/ISS-0984-cancel-instance-audit-rescue
  commit: c7fb7f14
  pr: 2176
  root_cause: >
    `Letflow.Engine.run_cancel_instance/5` (the private delegate behind
    `cancel_instance/3`, reached via `POST /instances/:id/cancel`) built its
    cancellation `Ecto.Multi` -- open-task/timer/service-task-dispatch/token
    cancellations, the instance-projection update, the cancellation event --
    and folded in its own audit entry via `Multi.merge(fn changes ->
    record_instance_cancel_audit(changes, instance_id, actor_id, prefix)
    end)`, where `record_instance_cancel_audit/4` calls
    `Audit.append_multi/4` exactly like every other site this arc has fixed.
    The combined Multi ran via `Repo.transaction/1` with no enclosing
    `try/rescue` anywhere in either `cancel_instance/3` or
    `run_cancel_instance/5` -- confirmed by direct read of both function
    bodies and `grep -n "rescue" lib/letflow/engine.ex` showing no match in
    either range. A genuine Postgres-level audit-write failure raised
    straight out of `Repo.transaction/1`, past `Plug.ErrorHandler`'s
    cleanup-only boundary, never reaching `render_cancel/2`'s existing
    `{:error, _internal} -> Response.internal_error(conn)` catch-all,
    because that clause only ever sees a *returned* `{:error, _}` tuple, not
    a raised exception. This is the same class of gap ISS-0969/ISS-0980/
    ISS-0981/ISS-0983 closed at every other `Audit.append_multi/4`/
    `Audit.insert_entry/3` call site; `cancel_instance/3`'s boundary was
    missed by all four prior rounds and surfaced only by REVIEWER's own
    sweep during the ISS-0983 PR review.
  fix: >
    Wrapped `run_cancel_instance/5`'s entire Multi/`Repo.transaction/1` pipe
    in a function-level `try/rescue -> {:error, {:transaction_failed,
    exception}}`, matching `run_complete_task/6`'s ISS-0981 precedent
    exactly. Added `{:error, {:transaction_failed, Exception.t()}}` to
    `cancel_error()`'s `@spec` union for documentation parity;
    `run_cancel_instance/5` itself stays un-spec'd, matching ISS-0981's
    precedent for sibling private functions. No router change was needed --
    `render_cancel/2`'s existing `{:error, _internal}` catch-all already
    matches the new typed-error shape, confirmed zero-diff on
    `lib/letflow/routers/instances.ex`. New regression test
    (`engine_cancel_instance_test.exs`, ISS-0984 describe block) drops
    `audit_entries` mid-test and asserts both the typed
    `{:error, {:transaction_failed, %Postgrex.Error{}}}` return and full
    pre-cancel-state rollback (tasks, tokens, projection, events all
    unchanged).
  design_doc: lib/letflow/design/iss0984-cancel-instance-audit-rescue.md
  gates:
