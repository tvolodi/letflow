resolved_in_run: WF03-ISS0999-Q981-20261006
resolved_at: "2026-10-06T08:00:00Z"
resolution: >
  Per-event-type payload allowlist on GET /promotions/platform-events (non-operator view); actor_id,
  source_definition_id, review_id and teardown error omitted for non-operators, own tenant id
  retained, unknown event type gets payload {}. REVIEWER and SECURITY-REVIEWER PASSED the design
  and change. Follow-up (the /context key-suffix limitation) tracked as Q-1003 / GH #2291 / ISS-1021.
