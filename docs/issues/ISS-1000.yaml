description: >
  Audit finding PA-VORTEX-001 (checklist A1): in
  test/fixtures/qa/vortex_production_order_release_process_definition.json the capacity-review reject
  edge e2 went to notify-planner, which is shared with the approve path (assign-line -> e9 ->
  notify-planner) and exits via e10 to end-released, so a declined production order was closed as
  released. The simulation copy test/fixtures/simulation/vortex/process_quality_check.yaml had the same
  branch. PA-VORTEX-009 F1 (a declined matter must end rejected/declined, as in swiftroute and meridian)
  is merged here as acceptance criterion 4.

  Fix (fixture v1.3): new SERVICE_TASK notify-planner-rejected (same webhook notify endpoint as
  notify-planner); e2 now targets it (id and condition kept); new edge e12 notify-planner-rejected ->
  end-rejected. The approve path is untouched. Same change in the simulation copy. Seed script header
  comment bumped to v1.3. New test
  test/letflow/definitions/vortex_production_order_release_fixture_test.exs walks the graph from the
  reject edges of capacity-review and budget-approval and asserts only 'rejected' END nodes are reached.
