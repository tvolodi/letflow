resolution: >
  Fixture v1.6: fallback-l2-approval now targets decline-application (an unrecognised, missing or
  timed-out l2_decision declines instead of creating the facility); fallback-l1-approval ->
  l2-approval unchanged; the simulation copy test/fixtures/simulation/meridian/process_claim_intake.yaml
  carried the same edge and is fixed the same way. Drift test extended: no default-style edge
  (is_default, or an unconditioned edge beside conditioned siblings) may target an irreversible
  action node (create-/disburse-/release-/...); fail-first on the old fixture. Graph-walk test: a
  missing/unrecognised l2_decision never reaches create-facility.
