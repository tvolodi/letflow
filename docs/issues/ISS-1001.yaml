id: ISS-1001
title: "[BLOCKER] Meridian Loan Origination: l2-approval has an unconditional fallback to create-facility (missing/unknown l2_decision creates the loan)"
discovered_by: PROCESS-AUDITOR run WF05-BASELINE2-20261006 (REQ-458 baseline / Q-975; filed by ORCH)
discovered_in_run: WF05-BASELINE2-20261006
discovered_at: "2026-10-06T06:32:35Z"
severity: BLOCKER
failure_class: defect
occurrence: 1
owner: "letflow-3 (author of the fixtures, Q-928/Q-980); ELIXIR-DEV or CODE-DESIGNER for the definition change"
process_audit_report: test/uat-reports/process-audit-meridian-WF05-BASELINE2-20261006.yaml
process_audit_finding: PA-MERIDIAN-008
checklist_item: F1
scope: meridian
description: >
  Severity BLOCKER (BA reclassified from MAJOR PA-MERIDIAN-008, l2 part only). Scope meridian. Checklist F1 (consistent handling of unanswered or unrecognised approvals). Audit: test/uat-reports/process-audit-meridian-WF05-BASELINE2-20261006.yaml finding PA-MERIDIAN-008.

  In test/fixtures/qa/meridian_loan_origination_process_definition.json, task l2-approval has edge e21 (variables.l2_decision == 'approve' -> create-facility), edge e22 (== 'reject' -> decline-application) and edge fallback-l2-approval (l2-approval -> create-facility) with NO condition. Any missing or unrecognised l2_decision value (including a timeout) therefore creates the loan facility: approval by default.

  Business consequence: a loan above the first-level threshold can be set up without the credit director's second-level approval. This violates the principle that defaults route toward more scrutiny (BA decision 0047 / Q-972 note; same principle as ISS-0998 / Q-980 for kyc).

  Fix direction: make fallback-l2-approval target decline-application, or a manual-review / escalation node (more scrutiny), never create-facility. Keep fallback-l1-approval -> l2-approval (that escalation is acceptable: more scrutiny). Observation, not part of this issue: fallback-ceo-override in test/fixtures/qa/meridian_regulatory_compliance_review_process_definition.json also moves forward by default; BA decided to treat l2 only here.

  Add a definition-level drift/validator test so an unconditional default edge can never lead to a facility-creating or disbursing node.

  Re-seed note: a changed definition needs a new version seeded on QA (no QA writes from this filing).



  Audit artefact: test/uat-reports/process-audit-meridian-WF05-BASELINE2-20261006.yaml; finding PA-MERIDIAN-008 (l2 part, reclassified MAJOR -> BLOCKER by BA); checklist item F1; scope meridian; severity BLOCKER. Discovered by PROCESS-AUDITOR run WF05-BASELINE2-20261006 (REQ-458 baseline, Q-975 / GH #2247). Suggested owner: letflow-3 (author of the fixtures, Q-928/Q-980); ELIXIR-DEV or CODE-DESIGNER for the definition change.
