description: >
  Scope vortex. Checklist A4 (every human task has a time limit and an escalation, or a stated reason none is needed). Audit: test/uat-reports/process-audit-vortex-WF05-BASELINE2-20261006.yaml finding PA-VORTEX-002.

  None of the human tasks capacity-review, escalate-to-ceo, budget-approval (test/fixtures/qa/vortex_production_order_release_process_definition.json), severity-classification (test/fixtures/qa/vortex_supplier_quality_deviation_process_definition.json) or corrective-action-8d (test/fixtures/qa/vortex_8d_corrective_action_definition.json) carries an escalation timer duration or escalation role; the edges named timeout-... exist but have no duration (compare ops-review in test/fixtures/qa/swiftroute_process_definition.json).

  Business consequence: an order or a quality deviation can sit open indefinitely; the CEO escalation and automatic rejection the process promises never start; a suspect batch could stay quarantined unnoticed.

  Fix direction: add a timer duration and an escalation role (or explicit description saying waiting is intended) to each of the five tasks, following the ops-review pattern in the swiftroute definition. BA-VORTEX supplies the durations.



  Audit artefact: test/uat-reports/process-audit-vortex-WF05-BASELINE2-20261006.yaml; finding PA-VORTEX-002; checklist item A4; scope vortex; severity MAJOR. Discovered by PROCESS-AUDITOR run WF05-BASELINE2-20261006 (REQ-458 baseline, Q-975 / GH #2247). Suggested owner: ELIXIR-DEV / CODE-DESIGNER (definition); BA-VORTEX confirms durations.
