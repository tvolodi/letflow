resolved_at: "2026-10-06T14:20:00Z"
resolution: >
  BA ruling option B: the severity-classification timeout default is CRITICAL, set explicitly.
  Fixture v1.4: node default-to-major renamed default-to-critical; its QA stub endpoint is now
  httpbin /response-headers?severity=critical (httpbin echoes the query as JSON keys, which the
  engine merges into the variables -- the same pattern as the Meridian kyc-timeout and
  kyc-aml-check stubs; an https:// endpoint outside the httpbin.org/anything base is left
  untouched by the seed rewrite, so no SSRF/INV-9 change). The definition description now says an
  unclassified deviation is handled as critical (8D corrective action) until a human classifies
  it. severity-routing and the critical path are unchanged. Simulation copy process_work_order.yaml
  renamed to match. New test file drives the real Transition gateway dispatch from the timeout
  step's echoed variables: severity == 'critical', only e6 fires, ends in
  corrective-action-subprocess, and the description/name/no-'major' guards; fail-first on the v1.3
  fixture (6 of 8 fail).
follow_ups:
  - "QA needs a re-seed of Vortex Supplier Quality Deviation v1.4 (scripts/seed_vortex_definition.sh creates and activates it; the platform deprecates v1.3)."
  - "The major and minor severity branches (supplier-warning, supplier-notification) are still reachable only by a human classification; nothing automatic sends a deviation there. Unchanged by this fix."
