id: ISS-1003
title: "Vortex Supplier Quality Deviation: severity-classification timeout (default-to-major) never sets severity, so routing falls to the critical 8D path"
discovered_by: PROCESS-AUDITOR run WF05-BASELINE2-20261006 (REQ-458 baseline / Q-975; filed by ORCH)
discovered_in_run: WF05-BASELINE2-20261006
discovered_at: "2026-10-06T06:32:46Z"
severity: MAJOR
failure_class: defect
occurrence: 1
owner: "ELIXIR-DEV / CODE-DESIGNER (definition); BA-VORTEX decides the severity default"
process_audit_report: test/uat-reports/process-audit-vortex-WF05-BASELINE2-20261006.yaml
process_audit_finding: PA-VORTEX-003
checklist_item: C1
scope: vortex
description: >
  Scope vortex. Checklist C1 (every variable a gateway reads is collected on every path). Audit: test/uat-reports/process-audit-vortex-WF05-BASELINE2-20261006.yaml finding PA-VORTEX-003.

  In test/fixtures/qa/vortex_supplier_quality_deviation_process_definition.json, the timeout edge of severity-classification goes through the node default-to-major to severity-routing, which reads the severity variable. Nothing on that path sets severity, so severity-routing takes its default edge, which leads to the critical-severity 8D sub-process.

  Business consequence: a deviation that was not classified in time is meant to be treated as major but is handled as critical, tying up procurement and the supplier.

  Fix direction: make default-to-major actually set severity to 'major' (a set-variable/assignment step or equivalent supported by the engine), or route default-to-major directly to the major handling.



  Audit artefact: test/uat-reports/process-audit-vortex-WF05-BASELINE2-20261006.yaml; finding PA-VORTEX-003; checklist item C1; scope vortex; severity MAJOR. Discovered by PROCESS-AUDITOR run WF05-BASELINE2-20261006 (REQ-458 baseline, Q-975 / GH #2247). Suggested owner: ELIXIR-DEV / CODE-DESIGNER (definition); BA-VORTEX decides the severity default.
acceptance_criteria:
  # AMENDED by the BA ruling (option B, letflow-2, 2026-10-06; GH #2272 comment). The original 'major' AC is
  # SUPERSEDED: defaulting an unclassified deviation to major would DOWNGRADE today's accidental critical 8D
  # handling, against the principle that defaults route toward more scrutiny (decision 0047 / Q-972).
  - "After the severity-classification timeout, severity equals 'critical', set EXPLICITLY, when severity-routing evaluates it (never unset, never 'major')"
  - "The default step is named default-to-critical and the definition description notes that an unclassified deviation is handled as critical until a human classifies it"
  - "The timeout path ends in the critical 8D handling (corrective-action-subprocess) exactly as before; the critical path itself is unchanged"
  - "A definition-level test (real Letflow.Engine.Transition gateway dispatch) covers the timeout path and fails against the v1.3 fixture"
  - "The process validator reports status OK"
