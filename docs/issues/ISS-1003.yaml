description: >
  Scope vortex. Checklist C1 (every variable a gateway reads is collected on every path). Audit: test/uat-reports/process-audit-vortex-WF05-BASELINE2-20261006.yaml finding PA-VORTEX-003.

  In test/fixtures/qa/vortex_supplier_quality_deviation_process_definition.json, the timeout edge of severity-classification goes through the node default-to-major to severity-routing, which reads the severity variable. Nothing on that path sets severity, so severity-routing takes its default edge, which leads to the critical-severity 8D sub-process.

  Business consequence: a deviation that was not classified in time is meant to be treated as major but is handled as critical, tying up procurement and the supplier.

  Fix direction: make default-to-major actually set severity to 'major' (a set-variable/assignment step or equivalent supported by the engine), or route default-to-major directly to the major handling.



  Audit artefact: test/uat-reports/process-audit-vortex-WF05-BASELINE2-20261006.yaml; finding PA-VORTEX-003; checklist item C1; scope vortex; severity MAJOR. Discovered by PROCESS-AUDITOR run WF05-BASELINE2-20261006 (REQ-458 baseline, Q-975 / GH #2247). Suggested owner: ELIXIR-DEV / CODE-DESIGNER (definition); BA-VORTEX decides the severity default.
