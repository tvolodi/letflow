description: >
  Scope vortex. Checklist D1 (scenario steps match the definition steps they claim to cover). Audit: test/uat-reports/process-audit-vortex-WF05-BASELINE2-20261006.yaml finding PA-VORTEX-004.

  test/fixtures/uat/scenarios/vortex/entity-list-filter-and-page.yaml names process proc-vortex-quality-deviation, but all six steps are list filtering and paging steps over batch records and match no step of that process (its own sidecar says so).

  Business consequence: a reader assumes the quality-deviation process is covered by this scenario; it is not.

  Fix direction: either detach the scenario from the process id (declare it an entity-list scenario with no process) or replace its steps with real quality-deviation steps; document the choice in the scenario.



