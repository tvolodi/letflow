description: >
  Scope swiftroute. Checklist A4. Audit: test/uat-reports/process-audit-swiftroute-WF05-BASELINE2-20261006.yaml finding PA-SWIFTROUTE-001.

  The CEO co-sign task ceo-approval in test/fixtures/qa/swiftroute_process_definition.json and the two incident tasks (operations assessment, finance estimate) in test/fixtures/simulation/swiftroute/process_shipment_dispatch.yaml have no escalation timer or route. Business consequence: a high-value shipment can wait for the CEO indefinitely and an incident can stay unassessed with nobody reminded.

  Fix direction: add timer duration and escalation role to the three tasks, following ops-review (which has one), or document why waiting is intended.



