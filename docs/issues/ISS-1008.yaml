description: >
  Scope swiftroute. Checklist C1. Audit: test/uat-reports/process-audit-swiftroute-WF05-BASELINE2-20261006.yaml finding PA-SWIFTROUTE-002.

  In test/fixtures/qa/swiftroute_process_definition.json, routing depends on the manager decision, the CEO decision and the declared value, but tasks ops-review and ceo-approval have no form and the value gateway reads a declared value supplied only at submission. A task completed without a decision silently goes to the CEO (after the manager) or to automatic rejection (after the CEO).

  Business consequence: a request can be released or rejected without anyone having decided it.

  Fix direction: add a form (required decision field with enumerated approve/reject) to ops-review and ceo-approval, and a required declared-value field on the start form; confirm gateways read exactly those field names.



  Audit artefact: test/uat-reports/process-audit-swiftroute-WF05-BASELINE2-20261006.yaml; finding PA-SWIFTROUTE-002; checklist item C1; scope swiftroute; severity MAJOR. Discovered by PROCESS-AUDITOR run WF05-BASELINE2-20261006 (REQ-458 baseline, Q-975 / GH #2247). Suggested owner: ELIXIR-DEV / CODE-DESIGNER (definition); BA-SWIFTROUTE.
