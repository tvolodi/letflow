  - "AC3 (completion without a decision is rejected) is not achievable fixture-only: variable_schemas validates only submitted keys (lib/letflow/engine/variable_schema.ex variable_validations/5), form_schema required is UI-only (REQ-273); needs a lib change - completion-time required-output check in Letflow.Engine.run_complete_task - via CODE-DESIGNER + SECURITY-REVIEWER; not done here. When it lands, the two KNOWN LIMITATION tests in swiftroute_decision_forms_fixture_test.exs must flip."
  - "No start-form node model: a required declared_value at instance start would need a start-form capability (or the same completion-time/required-input check at Engine.create); not done here."
