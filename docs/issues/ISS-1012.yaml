  Scope swiftroute (compared with meridian and vortex). Checklist F1. Audit: test/uat-reports/process-audit-swiftroute-WF05-BASELINE2-20261006.yaml finding PA-SWIFTROUTE-011.

  ops-review in test/fixtures/qa/swiftroute_process_definition.json hands an unanswered review to the CEO after a set time; the comparable approvals in test/fixtures/qa/vortex_production_order_release_process_definition.json and test/fixtures/qa/meridian_loan_origination_process_definition.json only name a timeout path without a duration or receiving role. The same business idea is handled differently and nothing explains why.

  Fix direction: BA records a decision (one shared escalation pattern, or a documented per-company difference) in the process descriptions; the vortex and meridian timer work is tracked by the A4 issues of those scopes.



