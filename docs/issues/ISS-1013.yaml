description: >
  Scope meridian. Checklist A4. Audit: test/uat-reports/process-audit-meridian-WF05-BASELINE2-20261006.yaml finding PA-MERIDIAN-001.

  Tasks l1-approval, l2-approval and disburse-loan in test/fixtures/qa/meridian_loan_origination_process_definition.json and ceo-override in test/fixtures/qa/meridian_regulatory_compliance_review_process_definition.json have no escalation timer or owner; the timeout paths on other tasks exist without a duration. Business consequence: loans and regulatory reviews can stall silently. (Where a timer is added, the target of its fallback must follow the more-scrutiny principle; see the BLOCKER issue on fallback-l2-approval.)

  Fix direction: add duration + escalation role to the four tasks and durations to the existing timeout paths.



