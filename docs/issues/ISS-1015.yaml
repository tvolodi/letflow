resolution: >
  Loan Origination v1.9, Regulatory Compliance Review v1.7. (1) A timeout before eligibility-gate no
  longer skips the value the gate reads: credit-memo-timeout (e5) now leads to the new HUMAN_TASK
  credit-memo-escalation-review (role-credit-director) and risk-assessment-timeout (e7) to the new
  HUMAN_TASK risk-assessment-escalation-review (role-cro); each is completed with the missing
  credit_decision / risk_rating and then rejoins assessment-join (new edges e5-escalation-reviewed,
  e7-escalation-reviewed). The direction is more scrutiny, not a silent decline. Both roles already
  exist (actors.yaml; no role invented). The review tasks have no timeout edge of their own, so an
  unanswered review waits for a person rather than declining. The gate itself is unchanged:
  eligibility-gate-default -> decline-application stays the fail-closed fallback if a review is
  completed without the value, and Q-1002's kyc contract and the kyc_status 'clear' fast path are
  intact. (2) Every HUMAN_TASK in both definitions has a form_schema with required decision fields
  whose enums are the values the edge conditions compare against: credit_decision pass|fail;
  risk_rating low|medium|high|unacceptable; kyc_outcome cleared|rejected (BA criterion);
  l1_decision approve|escalate|reject; l2_decision approve|reject; committee_vote_cro / _director /
  _ceo approve|reject; highest_severity none|low|medium|high|critical; remediation_status
  resolved|unresolved; cro_decision and ceo_decision sign_off|reject_and_reopen; plus two free-text
  audit fields no gateway reads (disbursement_reference on disburse-loan, evidence_summary on
  evidence-collection). The simulation YAML copies (process_claim_intake.yaml,
  process_policy_binding.yaml) mirror the new nodes, edges and forms (a test compares them).

  CAVEAT: form_schema is a UI RENDERING PAYLOAD ONLY (REQ-273, Letflow.Engine.TaskActivation
  moduledoc). The engine does not reject a completion that violates it; the required list is
  enforced by the form UI, not the server. Server-side authority would be a variable_schemas row
  (REQ-109); none is bound by these definitions. What actually protects the process is the
  fail-closed gateway defaults (the eligibility gate's default, the Q-1002 kyc edges, l2 / tally /
  post-remediation defaults), so a completion that skips a field declines or escalates, never
  approves.
follow_ups:
