description: >
  Scope meridian. Checklist C1. Audit: test/uat-reports/process-audit-meridian-WF05-BASELINE2-20261006.yaml finding PA-MERIDIAN-003.

  Gateway eligibility-gate in test/fixtures/qa/meridian_loan_origination_process_definition.json reads the credit decision and risk rating; after credit-memo-timeout or risk-assessment-timeout those values are never collected, the gateway falls to its default (edges e5, e7) and the loan is declined without anyone judging it. Also no task in either meridian definition (test/fixtures/qa/meridian_loan_origination_process_definition.json, test/fixtures/qa/meridian_regulatory_compliance_review_process_definition.json) has a form stating what must be recorded.

  Fix direction: send timeouts to a manual-review or escalation node rather than letting an unset value reach the gateway (more scrutiny, not silent decline), and add forms with required decision fields to the tasks.



  Audit artefact: test/uat-reports/process-audit-meridian-WF05-BASELINE2-20261006.yaml; finding PA-MERIDIAN-003; checklist item C1; scope meridian; severity MAJOR. Discovered by PROCESS-AUDITOR run WF05-BASELINE2-20261006 (REQ-458 baseline, Q-975 / GH #2247). Suggested owner: ELIXIR-DEV / CODE-DESIGNER (definition); BA-MERIDIAN.
