resolved_at: "2026-10-06T07:02:59Z"
resolution: >
  Fixture v1.7. kyc-manual-review is completed with output variable kyc_outcome = cleared |
  rejected; the kyc-timeout service task now records kyc_outcome = unresolved (its QA stub is
  httpbin /response-headers?kyc_outcome=unresolved, like kyc-aml-check's kyc_status stub).
  eligibility-gate approves only via e15 (kyc_status == 'clear', the UAT fast path) or the new
  e15-kyc-cleared (kyc_outcome == 'cleared'); a rejected / unresolved / missing outcome falls to
  eligibility-gate-default -> decline-application. Two edges rather than one OR condition: a
  missing variable makes the evaluator return false for the whole condition (no short-circuit),
  which would have declined the fast path. Both approval edges also require a present, non-empty
  risk_rating that is not 'unacceptable' (null and '' used to pass). Simulation copy
  process_claim_intake.yaml gets the same gate edges. New test file: definition-level reachability
  (removing every KYC-clear edge makes authority-routing/create-facility/disburse-loan unreachable
  from kyc-manual-review and kyc-timeout), real-evaluator graph walk, and real
  Letflow.Engine.Transition gateway dispatch; fail-first on the v1.6 fixture (9 of 16 fail).
follow_ups:
  - "QA needs a re-seed of Meridian Loan Origination v1.7 (scripts/seed_meridian_definition.sh creates and activates it; the platform deprecates v1.6)."
  - "Operators completing kyc-manual-review must supply output variable kyc_outcome (cleared | rejected); there is no form definition for this task, so the contract lives in the definition description and this issue. BA decision (letflow-2): accepted as is for QA/demo; the proper kyc-manual-review form with a required kyc_outcome field (cleared | rejected) is tracked as an explicit acceptance criterion of Q-997 / ISS-1015 (GH #2284) -- no new issue."
