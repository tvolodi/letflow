queue_ref: Q-1003
github_ref: GH-2291
status: resolved
resolved_in_run: WF03-ISS1021-Q1003-20261006
resolved_at: "2026-10-06T16:00:00Z"
resolution: >
  Top-level key ALLOWLIST on GET /promotions/:id/context (non-operator view): process_key and
  base_version (scalars), own tenant ids, own-side definition ids, entries as stored; every other
  key and every non-map plan omitted or replaced by {"entries": []}. Operators see everything
  unchanged. REVIEWER and SECURITY-REVIEWER PASSED the design and change. Residual R1 (entries
  content for a review naming foreign tenants) tracked as Q-1005 / GH #2297 / ISS-1023.
