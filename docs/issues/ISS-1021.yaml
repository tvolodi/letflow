follow_ups:
  - >
    R1 (standing TRACKED exception, INV-10): the plan's entries graph JSON is returned as stored.
    For an operator-created review naming foreign tenants B and C, held in the platform tenant's
    schema, entries carries B's and C's definition content (build_entries fills it from both the
    source and the target graphs), readable by a non-operator holding :PromotionsRead there and by
    readers of legacy rows. No worse than before this change (the old walk did not descend into
    entries either). Tracked as Q-1005 / GH #2297 / ISS-1023 (its issue file ships with that fix PR).
# The queue's own issue_ref for Q-1003 came back ISS-1003, which clashes with the local numbering
