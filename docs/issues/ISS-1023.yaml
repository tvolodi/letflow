follow_ups:
  - >
    R1b (accepted): when BOTH stored tenant ids are the caller's own, `entries` is returned exactly
    as stored and not scanned; any id a tenant author typed into the caller's OWN graphs goes back
    to that same tenant. Not a cross-tenant disclosure.
  - >
    R3 (unchanged, other routes): teardown_error text on the review routes.
  - >
    R4/R8 (accepted): process_key, base_version and the envelope's def_id are still returned for a
    review naming foreign tenants (tenant-authored names, not graph content).
  - >
    R5 (accepted): requested_by stays in the envelope. R6 (accepted): plan_digest covers the
    unshaped plan. R9 (intended): entries == [] tells a non-operator the review names another tenant.
  - >
    R10 (TRACKED): approve/reject do not gate on the stored tenant ids. Tracked as
    Q-1008 / GH #2305 / ISS-1026 (MINOR, depends on this issue; its issue file ships with that fix PR).
  - >
    NOT tracked: the optional approve/reject stored-id hardening beyond R10 named in the design
    (section 3.2) is not filed here.
  - >
    REQ-447 ordering note: this fix should land before TENANT_ADMIN / TENANT_AUDITOR receive
    :PromotionsRead. The AC5 tripwire test (non_admin_core_roles_in_the_platform_tenant_are_denied_promotions_read)
    fails when that matrix changes. The note in docs/requirements.yaml is added in a separate docs change.
