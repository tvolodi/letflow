resolution: >
  `entries` on GET /promotions/:id/context is returned to a non-operator only when both stored
  tenant ids are the caller's own (case-insensitive); otherwise []. Operators unchanged. Closes
  ISS-1021 residual R1 for plans naming a foreign tenant. REVIEWER and SECURITY-REVIEWER PASSED
  the design and change. Residuals R1b, R3, R4/R8, R5, R6, R9 accepted and not tracked; R10
  tracked as Q-1008 / GH #2305 / ISS-1026.
