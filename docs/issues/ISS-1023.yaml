id: ISS-1023
title: "GET /promotions/:id/context returns the plan's entries (definition diff of BOTH sides' graphs) as stored to a non-operator even when the plan names a foreign tenant (INV-10)"
discovered_by: SECURITY-REVIEWER (ISS-1021, Q-1003)
discovered_in_run: WF03-ISS1021-Q1003-20261006
discovered_at: "2026-10-06T16:00:00Z"
severity: MAJOR
failure_class: defect
occurrence: 1
owner: ELIXIR-DEV
description: >
  After ISS-1021 the /context serialised_plan of a non-operator is a top-level key allowlist, but
  `entries` was still copied as stored whenever it is a list. `entries` is the plan's definition
  diff: build_entries fills it from BOTH the source graph and the target graph (nodes, edges,
  variable schemas, SERVICE_TASK service_id bindings, SUB_PROCESS module_ref). An operator-created
  review naming foreign tenants B and C is stored in the platform tenant P's schema, so `entries`
  there holds B's and C's definition content, and the route reads only the caller's own schema:
  any non-operator holding :PromotionsRead in P (or in the schema of a legacy row naming foreign
  tenants) received it. This was the standing TRACKED residual R1 of ISS-1021.

  Fix (lib/letflow/routers/promotions.ex, design lib/letflow/design/iss1023-context-entries-own-sides.md):
  a new `entries_gate` list in @plan_allowlist (source_tenant_id, target_tenant_id) and a private
  predicate entries_visible?/2. For a non-operator `entries` is returned as stored only when it is
  a list AND both stored tenant ids pass own_tenant_value?/2 (own id, case-insensitive); in every
  other case (foreign id on either side, missing, null, non-binary, empty or padded id) it is [].
  All-or-nothing, no per-entry shaping. Operators see the plan unchanged; no other key, status or
  envelope key changes.

  AC5 (established from code, pinned by a test): today only PLATFORM_ADMIN holds :PromotionsRead;
  TENANT_ADMIN / TENANT_AUDITOR exist only as planned columns (REQ-447, pending). The exposure is
  latent for a correctly pinned platform tenant but reachable with the pin unset, through legacy
  rows, and once REQ-447 grants the permission; this fix is a prerequisite of that grant.

  Tests: T-13 (promotion_context_entries_scope_test.exs, the regression test), T-8 and T-11
  updated, T-12 pins entries_gate. Mutation results are in test/specs/ISS-1023.md.
  SECURITY-REVIEWER and REVIEWER PASSED the design and the change.
