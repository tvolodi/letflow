  - "No actor in actors.yaml holds the routing roles of two different vote tasks"
  - "The above-threshold scenario still runs: steps 4-6 are performed by thomas, julia and eva respectively and the fixture version is bumped"
  - "Process-audit re-run no longer reports PA-MERIDIAN-004 (checklist B2)"
