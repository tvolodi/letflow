id: ISS-1024
title: "Meridian Loan Origination: the three committee votes route to one shared role (role-committee-member), so nothing requires three different people to cast them"
discovered_by: PROCESS-AUDITOR run WF05-BASELINE3-20261006 (finding PA-MERIDIAN-004, checklist B2); filed by BA (letflow-2)
