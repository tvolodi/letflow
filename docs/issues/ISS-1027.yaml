resolution: >
  Fixtures v1.9/1.7/1.3/1.4/1.4 carry a top-level variable_schemas array (see design_note for the
  variable-to-enum table). No lib/ change. New tests: shipped_definitions_variable_schemas_test.exs
  (table-driven over every QA process fixture: enum coverage, REQ-372 clean, well-formed, stub/form
  and UAT-scenario supersets), shipped_definition_variable_schemas_engine_test.exs (real fixtures
  through create_with_variable_schemas + activate + complete_task: out-of-enum rejected, valid routed)
  and seed_variable_schemas_payload_test.exs (seed scripts deliver the fixture unmodified; the
  rewrite helper preserves variable_schemas). Version pins in the existing fixture tests updated.
  This constrains VALUES a task may set; it does not verify who completes the task.
follow_ups:
  - "QA needs a re-seed of all five definitions (scripts/seed_meridian_definition.sh, seed_vortex_definition.sh, seed_swiftroute_definition.sh create and activate the new versions; the platform deprecates the old ones)."
  - "Rebase note: Q-997 (loan 1.9 / regulatory 1.7) and Q-985 (SQD 1.4) must renumber on rebase."
  - "Out-of-enum completion puts the instance in ERROR (REQ-061 behaviour), not a retryable task rejection: a typo by a human operator needs the ERROR-recovery path. Not changed here."
regression_test: test/letflow/scripts/shipped_definitions_variable_schemas_test.exs
