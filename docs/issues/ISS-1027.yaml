id: ISS-1027
title: "Shipped definition seed payloads (meridian, vortex, swiftroute) send no variable_schemas: the engine enforces no output-variable enums server-side; form_schema is rendering only"
discovered_by: Q-997 investigation (ISS-1015); filed by letflow-3 ORCH
discovered_in_run: WF03-ISS1015-Q997-20261006
discovered_at: "2026-10-06T12:00:00Z"
severity: MAJOR
failure_class: defect
occurrence: 1
owner: "letflow-3 (fixture lane); no lib/ change"
scope: meridian, vortex, swiftroute
description: >
  variable_schemas (REQ-109) are written via Definitions.register_variable_schemas/3, reached by
  POST/PUT /definitions (variable_schemas array of {variable_key, json_schema}), import and
  solution-pack install. The seed scripts post the fixture file as the request body, and no shipped
  QA fixture carried the key, so the engine enforced no constraint on the decision/outcome variables
  human tasks set: form_schema is rendering only (REQ-273). A task could complete with a typo or
  unexpected value (kyc_outcome, l1_decision, ceo_decision, remediation_status, committee votes,
  severity ...) and the process took a default edge silently instead of the completion being
  rejected. A MISSING key is still only covered by the fail-closed gateway defaults.
design_note: >
  (a) WHICH variables. Every variable read by a gateway edge condition, because declaring ANY schema
  switches REQ-372's SemanticValidation on at activation (field-existence + type-compatibility for
  every gateway condition): string decision variables get a string enum equal to the union of every
  literal the conditions compare them to, the values the fixture's own human tasks/stubs/timeouts can
  set, and the values the shipped UAT scenarios submit; numeric (requested_amount_eur, declared_value,
  order_value_eur) and boolean (false_positive) gateway inputs are declared with their type.
  Enums (superset rule): kyc_status [clear, hit, inconclusive]; kyc_outcome [cleared, rejected,
  unresolved] ('unresolved' is what the kyc-timeout stub echoes); credit_decision [pass, fail];
  risk_rating [low, medium, high, acceptable, unacceptable] (the open rating scale, incl. 'acceptable'
  which the req208 simulation submits; only 'unacceptable' is special to the gateway);
  l1_decision [approve, escalate, reject]; l2_decision [approve, reject] (no escalate edge at L2);
  committee_vote_cro/director/ceo [approve, reject]; highest_severity [none, low, medium, high,
  critical]; remediation_status [resolved, unresolved]; cro_decision/ceo_decision (regulatory)
  [sign_off, reject_and_reopen]; ops_decision/ceo_decision (swiftroute), capacity_decision,
  budget_decision [approve, reject]; severity [critical, major, minor]. Vortex 8D has no conditioned
  edge and no decision variable: no schemas (asserted by the test, not silently omitted).
  Engine facts read, not assumed: human-task completion validates every incoming key against the
  schemas (Engine.merge_output_variables -> VariableSchema.variable_validations); SERVICE_TASK result
  merges pass nil validations (Engine.advance_service_task_dispatch), so stub/timeout echoes are never
  rejected at runtime; a rejected completion puts the INSTANCE in ERROR (REQ-061), it is not a
  retryable 4xx on the task.
  (b) HOW. The seed scripts POST the fixture file (through rewrite_service_task_base, a jq helper that
  rewrites only SERVICE_TASK endpoints and keeps every other key), so the fixture IS the payload: a
  top-level variable_schemas key is appended AFTER the graph (end of file, rebase-friendly). No
  script logic change.
  (c) IDEMPOTENCY. The version-aware seed skips an ACTIVE fixture version, so a fixture whose
  content changed without a version bump would never reach an already-seeded QA. Versions bumped +1
  from origin/main: loan 1.8->1.9, regulatory 1.6->1.7, swiftroute 1.2->1.3, vortex production order
  1.3->1.4, vortex supplier quality deviation 1.3->1.4. Collision plan: the in-flight Q-997 branch
  also claims loan 1.9 / regulatory 1.7 and the Q-985 branch SQD 1.4; whichever merges later must
  renumber (+1) on rebase. Vortex 8D stays 1.0 (unchanged).
acceptance_criteria:
  - "The seed payloads of every shipped QA definition (meridian loan, regulatory, vortex x3, swiftroute) include variable_schemas with enums for each decision/outcome variable read by an edge condition (vortex 8D has none and is asserted to have no conditioned edge)"
  - "A definition-level test fails if an edge condition reads a decision variable that has no variable_schema enum covering every compared literal"
  - "An engine-level test proves a task completion with an out-of-enum value is rejected (not silently routed to a default edge) and a valid value routes correctly"
  - "The seed scripts post the schemas idempotently; the QA definitions are re-seeded when the next definition versions are seeded (noted)"
  - "Fixture versions bumped; validator output stays valid (REQ-372 semantic check clean at activation); SECURITY-REVIEWER n/a (definitions/seed, no new data path)"
