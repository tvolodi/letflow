# free one: ISS-1037 (origin/main's highest was ISS-1036; checked against remote branches and PRs
# on 2026-10-07).
queue_ref: Q-1020
github_ref: GH-2332
status: resolved
resolved_in_run: WF03-ISS1037-Q1020
resolved_at: "2026-10-07T00:00:00Z"
resolution: >
  New hard rule H7 (shape, never grandfathered) reports a non-object top level, a non-object
  task/context, and wrongly typed task.description, context.artifacts_in, result.artifacts_out and
  created_at, naming file and field. check_advisory/2 no longer uses get_in and is shape-safe;
  --autofix skips a non-object file; registry coverage tolerates a malformed runs list. Deviation
  from the report's wording: `result: null` is NOT a violation (it is the legitimate pre-completion
  state, 175 corpus handoffs); a non-null non-object result is an advisory WARN (H7-RESULT) because
  historical handoffs carry a bare string. Corpus run unchanged: 0 new violations, 25 grandfathered.
