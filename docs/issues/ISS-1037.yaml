id: ISS-1037
title: "mix letflow.lint_handoffs crashes with FunctionClauseError (Access.get/3) on a handoff whose task is a string, instead of reporting the malformed file"
discovered_by: ORCH (dispatch handoff with a string task)
discovered_in_run: WF03-ISS1037-Q1020
discovered_at: "2026-10-07T00:00:00Z"
severity: MINOR
failure_class: defect
occurrence: 1
owner: "ELIXIR-DEV (lib/mix/tasks/letflow.lint_handoffs.ex); dev tooling, no tenant-data path"
scope: tooling
description: >
  A dispatch handoff with a string `task` (instead of the object {description,
  acceptance_criteria}) made `mix letflow.lint_handoffs` abort with `** (FunctionClauseError) no
  function clause matching in Access.get/3` at check_advisory/2 (called from lint_file/2). The run
  exited 1 without naming the file or the reason, which looked like an unrelated build failure.
  The same class of crash existed for a top-level non-object (BadMapError in H1/H3 and --autofix),
  non-string task.description / created_at, and non-list or non-string-element artifacts_in /
  artifacts_out.
acceptance_criteria:
  - "lint_handoffs does not crash on a handoff whose task or context is a string, number, list or null, or whose top level is not an object; it reports a violation naming the file and field"
  - "A unit test covers the malformed shapes (string task, null result, non-object context)"
  - "Valid handoffs lint exactly as before: 0 new violations, same grandfathered count (25, ISS-0190) on the corpus"
affected_files:
  - lib/mix/tasks/letflow.lint_handoffs.ex
  - test/mix/tasks/letflow.lint_handoffs_test.exs
  - docs/agents/shared/HANDOFF_PROTOCOL.md
