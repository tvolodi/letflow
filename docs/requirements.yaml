  - id: REQ-082
    title: Definition routes 2/2 -- write and lifecycle path (definitions.zig Create/Put/Patch/Delete/Activate/Deprecate/Archive/Import)
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 149  # letflow-queue task id
    description: >
      Port the write half of src/api/routes/definitions.zig: handleCreate
      (L309), handlePut (L362), handlePatch (L458), handleDelete (L546),
      handleActivate (L633), handleDeprecate (L721), handleArchive (L759) and
      handleImport (L1126). Eight handlers, all state-changing, over REQ-030's
      Letflow.Definitions and REQ-028/029's graph validators.
      The lifecycle transitions (activate, deprecate, archive) are ordered
      state changes, not idempotent writes: activating an archived definition,
      deprecating an already-archived one, or archiving an already-archived one
      must each return a deterministic 409-class problem document rather than
      silently succeeding or raising. Read REQ-030's context module for the
      actual permitted transitions and enforce exactly those -- do not invent a
      second state machine in the route layer.
      A create/put/import carries a definition graph, so REQ-028/029's
      validators run before persistence and their structured errors render as
      REQ-066 field-level problem details rather than a bare 500. handleImport
      accepts a whole document from an untrusted caller -- it is the largest
      untrusted-input surface in S4 and must hold to REQ-068's body limit and
      typed-rejection rules (INV-8).
      REQ-030's process_definitions is per-tenant (decision 0006), so activate
      and archive act only within the caller's schema -- an activate that
      touched another tenant's active definition would be a cross-tenant write,
      the most severe failure mode in this batch.
      VARIABLE_SCHEMAS REGISTRATION (obligation added by REQ-109 -- do not drop
      it). handleImport (L1126), and handleCreate/handlePut where the submitted
      document carries them, is ONE OF THE TWO WRITE PATHS that must POPULATE
      the `variable_schemas` table REQ-109 ports. REQ-109 deliberately ports the
      table, the Ecto schema and the merge-time lookup ONLY, deferring every
      INSERT path to this requirement and REQ-078. If this obligation is
      dropped, the table ships EMPTY and REQ-061's variable-schema rejection
      branch stays exactly as unreachable as it is today -- the entire failure
      mode REQ-109 exists to fix (ISS-0063 / GH#212).
      ONE SHARED PATH, NOT TWO: the registration logic lives in a SINGLE
      function on REQ-030's Letflow.Definitions, called by both this
      requirement's import and REQ-078's solution-pack install. Whichever of the
      two lands FIRST builds that function; the second CALLS it and adds no
      second implementation. Rows are scoped to the `definition_id` being
      written, so re-importing under a NEW version produces a new definition_id
      and a disjoint row set rather than mutating an existing one; a re-import
      onto the SAME definition_id must REPLACE that definition's rows inside the
      same transaction rather than accumulating duplicates against
      UNIQUE (definition_id, variable_key).
      WELL-FORMEDNESS, NOT JUST PRESENCE (obligation added by ISS-0089/GH#306
      and ISS-0088/GH#305 -- do not drop it either; mirrored verbatim in
      REQ-078 since either requirement may land first and build the shared
      registration function). Whichever of this requirement or REQ-078 builds
      that function is the FIRST requirement that can write a
      `variable_schemas` row -- the precondition both issues are latent
      behind. See REQ-078's own "WELL-FORMEDNESS, NOT JUST PRESENCE" paragraph
      for the full defect description; in short, the shared registration
      function must choose (a) validate `json_schema` well-formed at every
      level before insert, making the two read-side defensive branches
      genuinely dead code to delete, or (b) accept a malformed row can still
      land and instead fix `variable_schema.ex`'s `fetch_schemas/3` (ISS-0089)
      and `JsonSchema.properties_violations/3`'s recursion (ISS-0088)
      directly. Do NOT do neither. Whichever requirement lands first records
      the choice in `Letflow.Engine.VariableSchema`'s moduledoc (closing
      design sec 11.3 OQ-3) and closes GH#306/GH#305 accordingly.
      SECURITY (INV-1, INV-5, INV-8).
      HANDLEACTIVATE AND THE SERVICE-EXISTENCE ORACLE (obligation added by
      ISS-0037/GH#112 -- read that file before designing this handler's 422
      body). `Letflow.Definitions.activate/2` (REQ-030, `definitions.ex:1085`)
      returns `{:error, {:service_scope_violation, %ServiceScopeValidator.Violation{}}}`
      when a `:SERVICE_TASK` node references a `service_id` the validator
      rejects. `Violation.reason` is, by REQ-031's own AC3, one of two
      distinct closed-set atoms: `:service_not_registered` (the service_id
      exists nowhere) vs. `:service_not_available_to_tenant` (it exists,
      scoped to a different tenant) -- and `Violation.message` independently
      encodes the same distinction in prose ("is not registered" vs. "is not
      available to this tenant" / "scope data is inconsistent"). That
      distinction is REQUIRED at the `validate/3` API level (REQ-031 AC3) and
      must stay exactly as it is in `service_scope_validator.ex` -- it is the
      handler rendering the 422 body that must NOT expose it. If handleActivate
      naively serializes `reason` or `message` into the response, an external
      caller can use process-definition activation as an oracle to learn
      whether an arbitrary `service_id` string is registered ANYWHERE in the
      system, independent of which tenant owns it or whether the caller's own
      tenant can use it -- the same class of leak REQ-066/REQ-072's byte-
      identical-404 guarantee exists to close for resource ids, applied here to
      a referenced service_id instead of a resource id. Resolution: collapse
      both `Violation.reason` values into ONE generic external-facing 422
      `detail` string via `Letflow.Api.Error` (REQ-066) -- e.g. "a referenced
      service is not usable by this tenant" -- for every `service_scope_violation`
      regardless of which internal reason produced it; the distinct internal
      `reason`/`message` remain available for server-side logging/telemetry
      only, never in the response body. This is option (a) from ISS-0037's own
      two named options, chosen because it is the only one consistent with
      every other INV-5 obligation already written into this and every other
      S4 requirement in this file -- do not re-litigate it as if it were still
      open. Close GH#112 / mark ISS-0037.yaml resolved when this lands.
    acceptance_criteria:
      - "each of the eight handlers has an end-to-end test through the real router asserting status and, for writes, the resulting persisted state rather than only the status code"
      - "activating an archived definition, deprecating an archived one, and archiving an archived one each return a 409-class problem document and leave the row unchanged -- three explicit tests"
      - "a create with a structurally invalid graph returns a problem document carrying the per-field validation errors from REQ-028/029's validator, not a 500 and not a generic message (INV-8)"
      - "handleImport with a malformed document, an oversized document, and a document whose JSON is valid but whose graph is invalid each return a typed rejection with no unhandled exception -- three explicit tests"
      - "activating a definition in tenant A leaves tenant B's same-named active definition untouched, verified by reading both tenants' rows after the operation (INV-1)"
      - "a definition id belonging to another tenant returns the same response as a nonexistent id on every write verb, and no write occurs -- verified by reading the target row (INV-5)"
      - "a caller without DefinitionsWrite receives 403 on all eight endpoints with no state change in any case"
      - "importing a definition document carrying variable_schemas entries writes the corresponding rows into the calling tenant's variable_schemas table (REQ-109's table), and re-importing onto the SAME definition_id replaces those rows inside one transaction rather than failing on UNIQUE (definition_id, variable_key) or accumulating duplicates -- both verified by reading the rows back; and that write goes through the single shared Letflow.Definitions registration function REQ-078's install also calls, with grep confirming no second insert path into variable_schemas anywhere in the route layer"
      - "a re-import onto the SAME definition_id whose document OMITS a previously-registered variable_key leaves no row for that key -- verified by reading the rows back and asserting the omitted key is absent, not merely that the remaining keys are correct. A key removed from the document must stop being validated against; an upsert that leaves the stale row behind would keep REQ-109's merge rejecting values the definition no longer constrains"
      - "activating a definition referencing an unregistered service_id and activating one referencing a service_id registered to a different tenant each return byte-identical 422 problem-detail bodies -- same status, same detail string -- demonstrated by a test comparing the two serialised responses directly, not merely asserting both are 422 (ISS-0037/GH#112, INV-5)"
      - "the two 422 bodies from the criterion above do not contain the literal words \"registered\" or \"available to this tenant\", and do not echo the raw service_id substring distinguishably between the two cases, verified by asserting on the actual response body rather than by inspecting the handler source"
      - "the handler's own logs or telemetry for each of the two cases above still record the distinct internal Violation.reason atom, verified by capturing the log/telemetry output in the test -- the collapse is external-response-only, not a loss of internal diagnosability"
    depends_on: [REQ-081, REQ-109]

