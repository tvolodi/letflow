  - id: REQ-115
    title: Single fail-fast frontend check command (mix letflow.check equivalent for web/)
    owner: FRONTEND-DEV
    status: pending
    stage: S8
    impl_order: 241  # letflow-queue task id
    description: >
      web/ has four separate quality commands (type-check, lint, test,
      guards) and no single entry point that runs them fail-fast, so
      there is nothing for a gate to invoke and nothing an agent can
      quote one result from. The backend solved this with
      `mix letflow.check`; the frontend needs its counterpart.
      Add an `npm run check` script to web/package.json that runs
      type-check, lint, test, and guards in that order, stopping at the
      first failure, and document it in web/README.md's script table.
      Order matters: type-check is the cheapest and catches the most,
      guards is the most expensive because bundle-scan runs a full
      `vite build`.
      This requirement does NOT create .github/workflows/ -- that
      directory does not exist in this repository at all, and no
      CI-as-a-service requirement had been written for it either. S0's
      REQ-013 is done, but what it delivered was a LOCAL single-command
      gate (`mix letflow.check`); it never covered GitHub Actions, and
      being done it will not reopen to cover it. That gap is now split
      across two requirements: REQ-136 ("Introduce GitHub Actions CI
      running the backend gate") owns the backend job and wires `mix
      letflow.check`, and REQ-138 ("Add the frontend gate job to GitHub
      Actions CI") owns wiring this requirement's `npm run check`.
      REQ-138, not REQ-136, is this requirement's consumer -- REQ-136 is
      backend-only and carries an acceptance criterion requiring
      web/package.json to be unchanged entirely.
      Do not create a workflow file here: this requirement delivers the
      command REQ-138 will invoke, nothing more.
    acceptance_criteria:
      - "`npm run check` exists in web/package.json and runs type-check, lint, test, and guards in that order"
      - "the command exits non-zero on the first failing step and does not run subsequent steps, demonstrated by temporarily introducing a type error and quoting the actual output showing lint/test/guards did not run"
      - "a clean run of `npm run check` is quoted in full in the result -- real output, not a claim that it passes"
      - "web/README.md's script table lists `check` with a one-line description"
      - "no .github/workflows/ file is created by this requirement, confirmed by git diff, and the result names REQ-138 as the requirement that wires this command into CI (REQ-136 owns the backend job only)"
    depends_on: []

  - id: REQ-116
    title: API-contract gap inventory -- drive the migrated SPA against Letflow and record what breaks
    owner: FRONTEND-DEV
    status: pending
    stage: S8
    impl_order: 242  # letflow-queue task id; depends_on translated to queue task ids [138, 234]
    description: >
      stage-8-frontend-cutover.md says the contract gaps are "where
      undocumented behavior the earlier stages' route-by-route port
      missed will actually surface." Nobody has looked yet. Before any
      gap can be closed, the gaps have to be enumerated against a
      running system rather than guessed at by reading route modules.
      Start Letflow (LETFLOW_DEV_DB_CONFIRMED=1 mix run --no-halt), the
      Keycloak REQ-128 adds (docker compose up -d), and web/ (npm run
      dev -- the proxy already defaults to :4000). LOG IN FIRST, then
      load every route in web/src/router.tsx and record for each one
      what the SPA requested, what Letflow returned, and what the SPA
      expected.
      Logging in is not optional and is why this requirement depends on
      REQ-128. REQ-071 mounted Letflow.Plugs.AuthPipeline, so every
      /api/v1 route now demands a bearer token; without an identity
      provider (docker-compose.yml declares only postgres today, and
      config/dev.exs, config/test.exs and config/prod.exs all point at
      https://placeholder-keycloak.invalid/...), an unauthenticated
      sweep records one identical 401 per route and collapses the
      NOT-YET-IMPLEMENTED versus SHAPE-MISMATCH distinction this
      requirement exists to draw. Record the authenticated response for
      every route; if a route is genuinely unreachable even
      authenticated, say which and why rather than logging a bare 401.
      Produce docs/frontend/contract-gaps.md: one row per gap, with the
      failing request, the expected shape (cited from
      web/src/types/api.ts or the calling module in web/src/api/), the
      actual response, and the S4 requirement that owns the route if one
      exists.
      This requirement produces an INVENTORY, not fixes. Do not change
      lib/ and do not change web/src/ to work around anything found -- a
      gap closed while cataloguing is a gap nobody sized. Many routes
      will fail simply because S4 is incomplete (REQ-071..085 still
      pending); "not implemented yet" is a valid and expected row, and
      distinguishing it from "implemented but shaped wrong" is the
      substance of this requirement.
    acceptance_criteria:
      - "docs/frontend/contract-gaps.md has one row per route declared in web/src/router.tsx, including the routes that worked; the row count is reconciled against `grep -c \"path:\" web/src/router.tsx` (26 at the time of drafting -- 24 content routes plus /auth/callback plus the / layout route), and any route deliberately excluded (a layout or callback route that issues no API request) is listed by path with a one-line reason rather than treated as a count discrepancy"
      - "each gap row cites the actual observed response (status code and body), not a predicted one"
      - "each gap row is classified as either NOT-YET-IMPLEMENTED (the route is pending S4 work, with the owning REQ id named) or SHAPE-MISMATCH (the route exists but returns something the SPA cannot consume), and the classification is derived from an AUTHENTICATED response -- no row may be classified from a 401"
      - "the SHAPE-MISMATCH rows each cite the specific field/status/cursor the SPA expects and the file in web/src/ that expects it"
      - "git diff shows no change to lib/ or web/src/ -- this requirement is read-only against both"
      - "the result states which Letflow commit the inventory was taken against, since it goes stale as S4 lands"
      - "the result names the seeded user the sweep was authenticated as and quotes one request showing the bearer token was accepted, so a reader can tell an authenticated sweep from an anonymous one"
    depends_on: [REQ-071, REQ-128]

  - id: REQ-117
    title: Wire web/ to Letflow's API -- base URL, auth token, and the login path
    owner: FRONTEND-DEV
    status: pending
    stage: S8
    impl_order: 246  # letflow-queue task id; depends_on translated to queue task id [242]
    description: >
      The migration set web/vite.config.ts's dev-proxy default to
      http://localhost:4000 and wrote web/.env.example, and that is all
      that is wired. The SPA's auth path still assumes R-Co's Keycloak
      realm (web/src/auth/OidcManager.ts and tenantConfig.ts both
      default to http://localhost:8081/realms/bpm-default) and its token
      handling was built against the Zig backend's contract.
      SCOPE NARROWED 2026-08-22 (WF-01 rework). REQ-133 (S4) is now the
      single owner of the SPA's OIDC authority configuration --
      web/src/auth/OidcManager.ts, web/src/auth/tenantConfig.ts and
      web/.env.example. Both requirements previously set those same
      defaults from the same R-Co value, which meant whichever ran first
      did the other's work and left the second unable to report honestly
      against its own criteria. REQ-133 owns it because REQ-128, the
      requirement that actually picks Keycloak's host port, is S4;
      leaving it here would have stranded an S4 login proof behind S7
      and S8. Do NOT re-set those defaults here. Read them as given.
      This requirement's remaining S8 scope is the non-overlapping
      part: verify, from S8's own vantage after the cutover, that the
      authority REQ-133 set is still the one Letflow's S1 position calls
      for (read docs/migration/stage-1-identity.md and
      docs/migration/decisions/0002-oidc-integration.md -- do not assume
      the R-Co realm carries over), and that the SPA's token handling
      still satisfies FNFR-06 against the post-cutover build. Report a
      divergence as a finding routed through ORCH rather than editing
      the authority files here.
      Use web/'s EXISTING token storage and injection pattern. Do not
      introduce a new one -- FNFR-06 in
      docs/frontend/frontend-requirements.md forbids
      localStorage/sessionStorage for tokens, and swapping the mechanism
      silently is exactly the kind of change this project's review chain
      exists to catch.
      Verify by loading the running app in a browser and confirming real
      data flows. A build that compiles is not evidence.
      Supersedes REQ-106 ("Point web/ at the running Letflow API using
      the dev bootstrap token"), which was cancelled with the MVP-1
      milestone and assumed web/ still lived in R-Co. Read it for the
      dev bootstrap-token pattern it described; do not treat its
      narrower scope as this requirement's.
    acceptance_criteria:
      - "a real login against a running Letflow instance produces a token that an authenticated API call accepts, evidenced by a quoted request/response pair"
      - "the authority and client-id REQ-133 set are read back and checked against Letflow's own S1/decision-0002 position, cited by name; agreement is asserted, and a divergence is reported as a finding rather than fixed here"
      - "git diff shows web/src/auth/OidcManager.ts, web/src/auth/tenantConfig.ts and web/.env.example unchanged by this requirement -- REQ-133 owns them"
      - "web/'s existing token storage mechanism is unchanged, confirmed by git diff over web/src/auth/"
      - "no token is written to localStorage or sessionStorage, confirmed by grep over web/src/ and by inspecting browser storage after a real login"
      - "`npm run check` passes against the post-cutover tree, with the real output quoted"
    depends_on: [REQ-116]

  - id: REQ-118
    title: CORS support on the Letflow side for the browser-origin SPA
    owner: ELIXIR-DEV
    status: pending
    stage: S8
    impl_order: 235  # letflow-queue task id; depends_on translated to queue task id [138]
    description: >
      In development the SPA runs on :5173 and Letflow on :4000. The
      Vite dev proxy hides this for `npm run dev`, but it does not hide
      it for a built SPA served from any origin other than Letflow's
      own, and it does not hide it from the Playwright e2e suite
      (web/playwright.config.ts serves the app on :4173).
      Add CORS handling to Letflow's Plug pipeline -- allowed origins
      configurable, not hardcoded, following the same config pattern as
      :problems_base_uri (REQ-066). Decide and record whether
      credentials and preflight are needed for the SPA's actual auth
      mechanism rather than enabling everything by default.
      Fix this on the Letflow side only.
      docs/guides/frontend_developer_guide.md's rule stands: a CORS
      problem is never worked around inside web/.
      Scope note: this is a tenant-data path change -- it decides which
      origins may call authenticated routes -- so it needs
      SECURITY-REVIEWER per
      docs/agents/instructions/security-invariants.md. A wildcard
      allowed-origin is not acceptable as a default.
    acceptance_criteria:
      - "CORS headers are emitted for cross-origin requests to the API, with the allowed-origin list read from application config rather than hardcoded"
      - "the default configuration does NOT include a wildcard origin, and a test asserts that an unlisted origin is rejected"
      - "preflight (OPTIONS) handling is either implemented with a test, or explicitly documented as unnecessary with the reason stated -- not left ambiguous"
      - "a test exercises a cross-origin request end-to-end through the router rather than unit-testing the plug in isolation"
      - "no change is made under web/ -- confirmed by git diff"
    depends_on: [REQ-071]

  - id: REQ-119
