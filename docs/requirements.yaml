      req061-execution-error-handling.md:714 with
      execution_error.ex:5 (the error-code table), service_task.md:68/408/578,
      promotion_plan.md:437/664, req041-pack-update-diff-schema.md:706,
      req018-jit-provisioning.md:492, req052-instance-cancellation.md:581,
      sub_process.ex:37. (req050-exclusive-gateway-cel.md:19/:490 WOULD have
      been the sharpest CLASS B candidate; it is excluded here only because
      REQ-111 now audits it directly.)
      TIEBREAKER -- WHEN IN DOUBT, CLASS B. The A/B boundary is a bounded
      judgment call and the two errors are NOT symmetric. Misclassifying a
      CLASS B as CLASS A does the real damage: an unanswered question about
      shipped behaviour is rewritten into settled-looking prose, and the next
      reader has no signal that anything was ever open. Misclassifying a
      CLASS A as CLASS B costs one surplus issue file that a later triage
