    acceptance_criteria:
      - "each of the six route modules has at least one end-to-end test through the real router asserting status and response shape, with promotion_review.zig's five handlers each covered individually"
      - "POSTing the same assertion-run idempotency key twice produces one run and two identical successful responses, demonstrated by a test asserting the row count is 1 (REQ-040's contract)"
      - "two different tenants submitting a promotion with the same plan_digest each get their own review, demonstrated by a test seeding both tenants (REQ-064's per-tenant uniqueness)"
      - "approving a review that has already been applied returns a 409-class problem document and does not re-apply, verified by asserting the review's state and the target definition are unchanged"
      - "a review id belonging to another tenant returns the same response as a nonexistent review id on every one of get, approve, reject and apply -- four explicit tests (INV-5)"
      - "no route module contains an Ecto query or Repo call -- every handler delegates to a promotion context module, confirmed by grep for Repo. in lib/letflow/api/ returning no hit in these modules"
    depends_on: [REQ-072]

  - id: REQ-078
    title: Supporting routes -- audit, definition validation, tenant config, solution packs, pin rebind, metrics
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 145  # letflow-queue task id
    description: >
      Port the six small route modules whose backing subsystems are all
      `done`, as one requirement (1,356 lines total, but every module is a
      one-to-three-handler surface over existing context functions):
      - audit.zig (146, handleList) over REQ-026's event read paths.
      - validation.zig (173, handleValidate) over REQ-028/029's graph
      validators -- note this is routes/validation.zig, the definition-graph
      validation ENDPOINT, and is distinct from src/api/validation.zig, the
      request-body validator REQ-068 ports; name the distinction in the
      moduledoc so a later reader does not conflate them.
      - tenant_config.zig (207, handleTenantConfig) over REQ-015/019's tenant
      and realm binding.
      - solution_packs.zig (550, handleExport L29 / handleInstall L110) over
      REQ-041's pack-update three-way diff.
      - pin_rebind.zig (221) over REQ-060's PIN-05 explicit rebind.
      - metrics.zig (59, thin) -- port the endpoint shape only. It pairs with
      S6 observability, so it exposes whatever counters exist today rather
      than building a metrics subsystem; say so in the moduledoc.
      NOT IN THIS REQUIREMENT: sandbox_access.zig (181). It exports no handle*
      entry point -- its three public functions are checkPrincipalBound (L41),
      checkProbeRate (L82) and writeSentinelAudit (L152), i.e. guards a route
      calls rather than a route -- and `grep -rln sandbox_access src/` returns
      exactly one consumer, routes/agent_sandboxes.zig, which its own header
      names as the module it was extracted from. agent_sandboxes.zig is the
      runtime-agent subsystem, owning stage post-S6, so porting these guards in
      S4 would ship a guard with no S4 caller to guard -- a partial backing
      subsystem, the REQ-056 failure mode. checkProbeRate is additionally rate
      limiting (probe_threshold 20 per probe_window_secs 60), which needs the
      per-tenant counter storage REQ-068's SCOPE BOUNDARY paragraph explicitly
      defers; porting it here would smuggle in the mechanism this batch defers
      elsewhere. It moves with agent_sandboxes.zig to post-S6 -- see the group
      (b) table in docs/migration/stage-4-api-surface.md.
      VARIABLE_SCHEMAS REGISTRATION (obligation added by REQ-109 -- do not drop
      it). solution_packs.zig's handleInstall (L110) is ONE OF THE TWO WRITE
      PATHS that must POPULATE the `variable_schemas` table REQ-109 ports:
      R-Co's own pack document carries a `variable_schemas` array
      (R-Co src/api/routes/solution_packs.zig:299) and its install is what
      writes those rows. REQ-109 deliberately ports the table, the Ecto schema
      and the merge-time lookup ONLY, and defers every INSERT path to this
      requirement and REQ-082. If this obligation is dropped, the table ships
      EMPTY and REQ-061's variable-schema rejection branch stays exactly as
      unreachable as it is today -- which is the entire failure mode REQ-109
      exists to fix (ISS-0063 / GH#212).
      ONE SHARED PATH, NOT TWO: the registration logic lives in a SINGLE
      function on REQ-030's Letflow.Definitions, called by both this
      requirement's install and REQ-082's import. Whichever of the two lands
      FIRST builds that function; the second CALLS it and adds no second
      implementation -- the same "one resolution path, not two that can
      disagree" rule REQ-085 applies to membership resolution. Rows are scoped
      to the `definition_id` being written, so a pack carrying N definitions
      writes N disjoint row sets and cannot collide with REQ-082 importing a
      different definition.
      WELL-FORMEDNESS, NOT JUST PRESENCE (obligation added by ISS-0089/GH#306
      and ISS-0088/GH#305 -- do not drop it either). Whichever of this
      requirement or REQ-082 builds the shared registration function is also
      the FIRST requirement that can write a `variable_schemas` row, which is
      the precondition both issues are latent behind. REQ-109's read side
      carries two now-reachable-for-the-first-time defects once a row exists:
      (i) ISS-0089 -- `variable_schema.ex`'s `fetch_schemas/3` selects
      `json_schema` as a typed `:map` field, so a top-level non-object jsonb
      value (array/string/number/boolean -- the column is NOT NULL jsonb, not
      NOT NULL json-OBJECT) raises `ArgumentError` at Ecto's load time, inside
      the open completion transaction, before `validations_for/3`'s own
      `{:ok, _not_a_map}` guard ever runs; (ii) ISS-0088 -- a well-formed
      top-level object whose value at some property is itself a non-map
      subschema passes that same loader and then raises
      `FunctionClauseError` deeper in
      `Letflow.EventStore.Registry.JsonSchema.properties_violations/3`. THE
      SHARED REGISTRATION FUNCTION MUST CHOOSE ONE OF: (a) validate the
      submitted `json_schema` document is well-formed (every level, not just
      top level) BEFORE insert and reject a malformed one with a typed error
      at import/install time -- the two read-side defects then become
      genuinely unreachable and their defensive branches may be deleted as
      dead code; or (b) accept that a malformed row can still be written and
      instead fix the two read-side defects directly (ISS-0089's own
      candidate fix: select `json_schema` untyped/raw so
      `validations_for/3`'s existing guard is what actually sees it first,
      widening `error_reason()` accordingly; ISS-0088 needs the equivalent
      guard added inside `properties_violations/3`'s recursion). Do NOT do
      neither -- landing registration with no well-formedness answer ships
      the exact failure mode both issues describe, now reachable in
      production for the first time. Whichever requirement lands first
      records the choice in `Letflow.Engine.VariableSchema`'s moduledoc
      (closing design sec 11.3 OQ-3) and closes GH#306/GH#305 accordingly.
      SECURITY: audit.zig is the sharpest INV-1 case in this group -- an audit
      list that escapes tenant scoping discloses another tenant's entire
      activity history in one response, and audit reads additionally require
      REQ-069's AuditRead permission. solution_packs.zig's export produces a
      document derived from tenant data and its install writes tenant data, so
      both directions need scoping. metrics.zig must not expose per-tenant
      counters to a caller of another tenant, or must expose only aggregate
      platform counters to MetricsRead holders -- state which and enforce it.
    acceptance_criteria:
      - "each of the six modules has at least one end-to-end test through the real router asserting status and response shape"
      - "an audit list request returns only the calling tenant's events when both tenants are seeded with events in the same time window, demonstrated by a test, and a caller without AuditRead receives 403 (INV-1)"
      - "a solution-pack export as a tenant A caller contains no tenant B artefact, and an install as tenant A writes only into tenant A's schema, verified by querying both schemas after the operation (INV-1)"
      - "the definition-validation endpoint returns the same validation outcome as calling REQ-028/029's validator directly for the same graph, demonstrated by a test comparing both paths -- proving the route adds no second validation rule"
      - "the metrics endpoint's tenant-exposure rule is stated in the moduledoc (aggregate-only or per-tenant-scoped) and enforced by a test that a tenant A caller sees no tenant B figure"
      - "the moduledoc distinguishes routes/validation.zig (definition-graph validation endpoint, ported here) from src/api/validation.zig (request-body validator, ported by REQ-068), so the two are not conflated"
      - "metrics.zig's moduledoc states that no metrics subsystem is built here and names S6 observability as its owner"
      - "installing a solution pack whose document carries variable_schemas entries writes the corresponding rows into the CALLING tenant's variable_schemas table (REQ-109's table) and none into any other tenant's schema, verified by reading both schemas back; and that write goes through the single shared Letflow.Definitions registration function REQ-082's import also calls, with grep confirming no second insert path into variable_schemas anywhere in the route layer"
    depends_on: [REQ-072, REQ-030, REQ-109]

  - id: REQ-079
    title: Instance routes 1/2 -- write path (instances.zig handleCreate/handleCancel/handleReconstruct)
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 146  # letflow-queue task id
    description: >
