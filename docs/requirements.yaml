      READ THIS FIRST -- THE GREP PATTERN IN ISS-0076 IS TOO NARROW, AND ITS
      FILE LIST IS INCOMPLETE BECAUSE OF IT. The wording of this claim varies
      so widely that an exact-phrase grep finds ZERO. ISS-0076 warns about
      this and supplies a loose pattern, but that pattern is itself too
      narrow. Measured this run:
      `-iE "no R-Co source|R-Co source tree|unreachable R-Co|without R-Co source"`
      returns 21 hits in 11 files, which is where ISS-0076's "11 files" came
      from. Broadening it to
      `-iE "no R-Co source|R-Co source tree|unreachable R-Co|without R-Co source|R-Co source (was|is) not|unreachable in this environment|unverifiable without R-Co"`
      returns 29 hits in 15 files. The FOUR files only the broader pattern
      finds are lib/letflow/design/req050-exclusive-gateway-cel.md,
      lib/letflow/design/req052-instance-cancellation.md,
      lib/letflow/design/req061-execution-error-handling.md and --
      the one that matters most -- lib/letflow/engine/execution_error.ex, a
      SHIPPED moduledoc (REQ-061) whose line 5 calls R-Co's
      `setInstanceError()` at ~L3078 and its error-code table at ~L4067
      "unreachable in this environment." Neither ISS-0076's affected_files nor
      its narrower pattern names any of these four. START by re-deriving the
      hit list with the broadened pattern and stating the count; do NOT trust
      21, 29, or ISS-0076's "30" as given. If a still-wider phrasing surfaces
      further hits, they are in scope too -- the number is an output of this
      requirement, not an input.
      TRIAGE BEFORE SWEEPING -- THIS IS THE LOAD-BEARING PART. Every
      occurrence is exactly one of two classes, and they get OPPOSITE
      treatment:
      CLASS A -- pure environment claim. The sentence only says R-Co could not
      be read; nothing downstream of it is an unresolved question about
      shipped behaviour. Restate it factually (what was and was not verified,
      and when) or drop it. This is the docs sweep.
      CLASS B -- the claim DEFERS A SUBSTANTIVE QUESTION about shipped code,
      the way REQ-059 OQ-1 and REQ-060 OQ-4 do. These must NOT be swept.
      Rewriting the caveat on a Class B occurrence converts an open question
      into settled-looking prose without anyone having answered it -- strictly
      worse than leaving it, and precisely the failure mode this requirement
      must avoid. Each Class B occurrence is instead filed as its own
      `docs/issues/ISS-NNNN.yaml` (plus GitHub issue) naming the question, the
