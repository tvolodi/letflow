      - "lib/letflow/engine/variable_merge.ex, lib/letflow/design/req060-pin-rebind.md:134, lib/letflow/design/req062-sub-process-runtime.md:11, and lib/letflow/design/req050-exclusive-gateway-cel.md:19 and :490 are all unchanged by this run, verified by git diff showing no modification to the first file and no modification to those four specific locations. The req050 pair is the most behaviourally sensitive of the exclusions -- it sits on a shipped S3 gateway path and is audited by REQ-111 -- so it needs the same git-diff guard as the others, not prose alone"
