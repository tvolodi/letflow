    impl_order: 54  # letflow-queue task id
    description: >
      Port the promotion_reviews state-machine transition functions
      (src/definition/promotion_review.zig, PRM-04, per
      src/design/prm-04-promotion-review-state-machine.md's "Public
      interface"/"State machine diagram" sections) operating on REQ-035's
      promotion_reviews table, plus src/definition/promotion.zig's
      underlying promoteDefinition() (ENV-03) which the apply transition
      wraps (per prm-batch1's "Files NOT to change" table: "promoteDefinition()
      unchanged; apply pipeline wraps it" -- port promoteDefinition() itself
      here since nothing in this S2 batch has ported it yet, then have the
      apply transition call it):
      - insert_review/1: creates a pending_review row from REQ-036's
      PromotionPlan + digest (serialised_plan, plan_digest, requested_by,
      row_version: 1); the partial unique index (REQ-035) rejects a
      duplicate (tenant_id, plan_digest) while one is still
      pending_review/approved -- surface this as a distinct duplicate-review
      error.
      - approve_review/4 (review_id, actor_id, plan_digest, ...):
      pending_review -> approved. Gates (per prm-05's
      non-skippable-approval-gate design, read alongside prm-04 since PRM-05
      enforces these same gates): reviewer != requested_by (self-approval
      forbidden), status == pending_review, plan_digest matches the stored
      value exactly. Every UPDATE includes WHERE row_version = $expected --
      zero rows affected means the transition failed (invalid-transition
      error), not a silent no-op.
      - reject_review/2: pending_review -> rejected. No digest check, no
      self-rejection restriction (prm-05: "Reject does NOT have the same
      restriction" as approve).
      - mark_review_applied/1, mark_review_failed/1: approved -> applied /
      approved -> failed (driven by REQ-040's assertion re-run outcome,
      called from there, not invoked directly by an HTTP layer in this
      batch).
      - supersede_review/2: applied|failed|rejected -> superseded (the 3
      supersession edges named in prm-04's permitted-edges table, including
      the "NEW" rejected->superseded edge prm-04 explicitly adds to fix a
      prior BLOCKER-vs-RELEASED conflict -- port this edge, don't silently
      drop it as if rejected were terminal).
      - promote_definition/N (src/definition/promotion.zig, ENV-03): the
      underlying version-pointer-move + event-append operation
      mark_review_applied's caller invokes; port its existing role-check
      pattern (reused by REQ-036's compute_promotion_plan/5, cited above)
      and its tenant-type check (reused by REQ-036 as the
      invalid-promotion-source check).
      Exactly 7 permitted state edges total (prm-04's table) -- no other
      transition is reachable; every non-edge attempt returns the same
      invalid-transition error regardless of which specific illegal edge was
      attempted.
    acceptance_criteria:
      - "insert_review/1 followed by a second insert_review/1 with the identical (tenant_id, plan_digest) while the first is still pending_review returns the duplicate-review error, not a second row"
      - "approve_review/4 called by the same principal recorded as requested_by is rejected with a self-approval error before any row is updated"
      - "approve_review/4 with a plan_digest not matching the stored value is rejected with a digest-mismatch error, distinct from the self-approval and invalid-transition errors"
      - "two concurrent approve_review/4 calls on the same review_id: exactly one succeeds (row_version optimistic-lock check), the other gets the invalid-transition error from the zero-rows-affected WHERE row_version = $expected clause"
      - "a rejected review can be transitioned to superseded via supersede_review/2 (the NEW edge prm-04 adds), demonstrated explicitly, not left untested as if rejected were terminal"
      - "every one of the 7 permitted edges in prm-04's table has an explicit passing test, and at least 2 non-edges (e.g. rejected -> approved, pending_review -> applied) have explicit rejecting tests"
    depends_on: [REQ-035, REQ-036]

  - id: REQ-038
    title: Promotion rollback (rollback.zig, PRM-08)
    owner: ELIXIR-DEV
    status: pending
    stage: S2
    impl_order: 55  # letflow-queue task id
    description: >
      Port src/definition/rollback.zig's rollbackDefinitionVersion() (per
      prm-batch1's "PRM-08 design" section) as
      Letflow.Definitions.rollback_definition_version/4, operating on
      REQ-027's process_definitions and REQ-035/037's promotion_reviews
      tables:
      - Permission guard: caller must hold a platform.admin-equivalent
      permission (port the check SHAPE, same open-question note as REQ-036
      about mapping onto REQ-020's role registry if it doesn't fit cleanly
      -- flag rather than invent a new permission model silently).
      - Single serializable transaction: lock process_definitions rows for
      the process_key (FOR UPDATE); identify the current ACTIVE row and the
      target row (status must be ACTIVE or SUPERSEDED -- prm-batch1's "Why
      status IN ('ACTIVE','SUPERSEDED') proves prior activation" reasoning:
      SUPERSEDED necessarily passed through ACTIVE at some prior point, no
      separate history table needed). Guard cases: process_key not found at
      all (not-found error); target_version not in {ACTIVE, SUPERSEDED} for
      this process_key (version-never-active error); target_version equals
      the current ACTIVE version (already-active error, nothing to do).
      - Version pointer swap: current ACTIVE -> SUPERSEDED, target row ->
      ACTIVE, both in the same transaction.
      - Append a DEFINITION_VERSION_ROLLED_BACK event via REQ-025's append
      (payload: process_key, from_version, to_version, actor_id) -- capture
      the resulting event_id.
      - Update any promotion_reviews row for the now-former-active
      definition whose status is applied or approved to superseded, with
      superseded_by set to the rollback's event_id (zero matching rows is
      acceptable, not an error).
      Returns definition_id (of the now-active version), version,
      rolled_back_from_version, superseded_review_id (nullable), event_id.
    acceptance_criteria:
      - "rolling back to a version with status SUPERSEDED (that was previously ACTIVE) succeeds and flips the pointer: the target becomes ACTIVE and the former ACTIVE becomes SUPERSEDED"
      - "rolling back to a version whose status has never been ACTIVE or SUPERSEDED for this process_key returns the version-never-active error, no rows changed"
      - "rolling back to the currently-ACTIVE version returns the already-active error, no rows changed, no event appended"
      - "a successful rollback appends exactly one DEFINITION_VERSION_ROLLED_BACK event and updates any applied/approved promotion_reviews row for the former-active definition to superseded"
      - "a caller lacking the platform.admin-equivalent permission is rejected before any row is read or locked"
    depends_on: [REQ-030, REQ-037]

  - id: REQ-039
    title: Sandbox pool and fixture loader (sandbox_pool.zig + fixture_loader.zig, PRM-06 section 3)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 42  # letflow-queue task id
    description: >
      Port src/definition/sandbox_pool.zig's SandboxPool (claim/release,
      on-demand Postgres-schema provisioning) and
      src/definition/fixture_loader.zig's loadFixturesOnly (per
      prm-batch1's "PRM-06 design" sections 1/3), reusing REQ-022's CREATE
      SCHEMA/DROP SCHEMA provisioning primitive:
      - claim/1 (max_wait_ms): provisions a fresh ephemeral Postgres schema
      (CREATE SCHEMA), enforcing a configurable max_concurrent_sandboxes
      quota; returns SandboxUnavailable if no slot frees within the wait
      window (60s per prm-batch1 PRM-06 AC5). Records every active claim so
      a later release/reaper pass can find it.
      - release/1: drops the schema (DROP SCHEMA CASCADE) and removes the
      active-claim record.
      - load_fixtures_only/3 (sandbox_schema, fixtures): validates each
      fixture's target table name against a hardcoded allowlist BEFORE
      issuing any SQL (prm-batch1: "This is the SQL-injection boundary -- no
      string interpolation on table names reaches the DB" -- an unlisted
      table name returns InvalidTableName, never reaches a query); TRUNCATEs
      each distinct target table (schema-qualified) before inserting;
      inserts rows via a parameterized jsonb_populate_record-equivalent
      pattern, never string-interpolating the row content.
      OPEN QUESTION -- flagged explicitly per this stage's own
      "process-per-instance vs row-based state" finding
      (docs/migration/stage-2-event-store-definitions.md's Early findings
      section): sandbox_pool.zig's own header states "The pool records
      every active claim in a process-local table" -- in-memory claim
      tracking plus a hard concurrency quota (max_concurrent_sandboxes) is
      exactly the kind of state stage-2-event-store-definitions.md flags as
      "plausibly needing a supervised process" rather than a plain Ecto row
      (no expensive-to-reconstruct state here, but the in-memory claim
      tracking + quota-enforcement shape leans toward a GenServer or
      DynamicSupervisor-backed pool rather than a bare DB table or a
      stateless module). Do NOT silently assume either a
      GenServer/DynamicSupervisor design or a plain-row design here -- this
      requirement ports the claim/release/load_fixtures_only CONTRACT
      (function signatures + behavior), and leaves the concrete
      process-vs-row implementation choice as an explicit open question for
      CODE-DESIGNER to resolve at WF-02 design time, citing this note.
    acceptance_criteria:
      - "claim/1 against an empty pool immediately succeeds and returns a sandbox_id + schema_name for a real, freshly-created Postgres schema"
      - "claim/1 when max_concurrent_sandboxes slots are all in use blocks until either a slot frees or the wait window elapses, returning SandboxUnavailable in the latter case"
      - "release/1 on a claimed sandbox drops its schema (verified: the schema no longer appears in information_schema.schemata after release) and frees its quota slot for a subsequent claim/1"
      - "load_fixtures_only/3 with a table_name not in the allowlist returns InvalidTableName without issuing any SQL against that table name"
      - "load_fixtures_only/3 loading the same fixtures twice against the same sandbox_schema (simulating a retry) leaves the same final row set both times, via the TRUNCATE-before-insert step"
      - "the moduledoc names the process-per-instance-vs-row-based-state open question explicitly and states it is left for CODE-DESIGNER, per this requirement's description and stage-2-event-store-definitions.md's Early findings"
    depends_on: [REQ-022]

  - id: REQ-040
    title: Promotion assertion re-run orchestration (assertion_rerun.zig, PRM-06/07 + promotion_assertion_runs schema)
    owner: ELIXIR-DEV
    status: pending
    stage: S2
    impl_order: 56  # letflow-queue task id
    description: >
      Port src/definition/assertion_rerun.zig's applyPromotionAssertionRerun()
      (per prm-batch1's "PRM-06 design" section 2 and "PRM-07 design"
      sections in full) as
      Letflow.Definitions.apply_promotion_assertion_rerun/6, plus the
      promotion_assertion_runs migration (prm-batch1's "1.
      promotion_assertion_runs table schema" -- schema-per-tenant, per
      REQ-022, with an FK to REQ-035/037's promotion_reviews). Depends on
      REQ-039's SandboxPool + fixture loader.
      - Idempotency: compute key = "promotion_rerun:<review_id>:<plan_digest>";
      INSERT ... ON CONFLICT (tenant_id, idempotency_key) DO NOTHING; on
      conflict, return the cached row's outcome (AlreadyRecorded-equivalent)
      without claiming a new sandbox.
      - On a fresh insert: claim a sandbox (REQ-039), load ONLY the
      artifact's fixtures[] into it (REQ-039's load_fixtures_only, never
      organic tenant data), replay the artifact's assertions under a frozen
      clock (derived from the upper 32 bits of rng_seed per prm-batch1's
      FrozenClockProvider note -- flagged there as Open question 1, an
      artifact could later carry an explicit frozen_clock_ms field instead;
      keep the injection interface stable regardless) and a seeded RNG
      (wraps the RNG with rng_seed), stripping non_deterministic_fields
      dot-paths from both expected/actual results before byte-level
      comparison.
      - Record the outcome (passed/failed/teardown_failed,
      assertions_passed/failed counts, failing_assertion_ids) in
      promotion_assertion_runs.
      - The apply pipeline (REQ-037's mark_review_applied path) evaluates
      assertions_failed == 0 to decide whether to proceed, NOT status ==
      "passed" -- a teardown_failed row with assertions_failed == 0 is a
      green gate per prm-batch1's explicit note; state this distinction
      explicitly in the moduledoc since it's easy to get backwards.
      OPEN QUESTION -- flagged explicitly (this is the second of the two
      files stage-2-event-store-definitions.md's Early findings section
      names as most likely to need a supervised process rather than a plain
      row): sandbox teardown must run on EVERY exit path -- normal
      completion, assertion failure, infrastructure failure, AND
      panic/crash (assertion_rerun.zig's own header: "Teardown ... runs
      through a single defer so it covers every exit path ... including
      panic unwind"). Elixir has no direct defer-on-panic equivalent the
      way Zig does; the closest idiomatic mechanisms are try/after (covers
      normal and raised-exception exits, not a hard process kill) or a
      supervised process whose terminate/2 callback fires on more exit
      conditions including certain crashes. Do NOT silently assume
      try/after is sufficient, and do NOT silently assume a GenServer is
      required -- this requirement ports the guaranteed-teardown CONTRACT (a
      teardown failure records PROMOTION_ASSERTION_TEARDOWN_FAILED and sets
      status = teardown_failed, but never converts a passing run into a
      failure) and leaves the concrete crash-safety mechanism as an
      explicit open question for CODE-DESIGNER, same as REQ-039's note.
    acceptance_criteria:
      - "calling apply_promotion_assertion_rerun/6 twice with the same (review_id, plan_digest) returns the cached outcome on the second call and claims no second sandbox, verified by sandbox claim count"
      - "a sandbox loaded via REQ-039 receives ONLY the artifact's fixtures[] rows, demonstrated by confirming no pre-existing tenant data appears in the sandbox schema"
      - "an assertion replay that fails records status = failed with a non-empty failing_assertion_ids list; a passing replay whose teardown itself fails records status = teardown_failed with assertions_failed = 0 -- both distinct outcomes tested explicitly"
      - "the moduledoc explicitly states the apply pipeline gate condition is assertions_failed == 0, not status == passed, citing the teardown_failed green-gate case"
      - "a simulated teardown failure appends a PROMOTION_ASSERTION_TEARDOWN_FAILED event via REQ-025's append and does not change a passing run's outcome from green to failed"
      - "the moduledoc names the crash-safety/guaranteed-teardown open question explicitly, per this requirement's description and stage-2-event-store-definitions.md's Early findings"
    depends_on: [REQ-039, REQ-037]

  - id: REQ-041
    title: Solution-pack update three-way diff (pack_update.zig, PRM-09)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 43  # letflow-queue task id
    description: >
      Port src/definition/pack_update.zig's computePackUpdatePlan() (per
      prm-batch1's "PRM-09 design" section) as
      Letflow.Definitions.compute_pack_update_plan/5, plus its three
      migration tables (prm-batch1's "4. solution_pack_* table schemas" --
      solution_pack_installs, solution_pack_artefact_bases,
      pack_update_resolutions; PRM-09's own migration creates all three
      itself, so this does NOT depend on the separate SOL-01/02/03
      solution-pack export/install module (src/solution/, a different
      directory not among this stage's 16 src/definition/ files -- SOL-01/02/03
      isn't scoped to any stage yet; note explicitly that this requirement's
      tables have no real installs to compare against until whichever
      future requirement builds SOL-01/02/03's install path, but the diff
      algorithm itself is fully testable today via directly-inserted
      fixture rows). Unlike every other table this S2 batch adds,
      prm-batch1 explicitly classifies these three tables as GLOBAL
      (public/default schema, no :prefix) -- "install records are
      cross-tenant infrastructure" -- so this requirement does NOT use
      REQ-022's schema-per-tenant mechanism; since both these tables and
      REQ-015's tenants table live in the same public/default schema, a
      real DB-level FK from solution_pack_installs.tenant_id to tenants.id
      (matching R-Co's own `REFERENCES tenant(id)`) is possible here, unlike
      the deliberate no-cross-schema-FK omission this batch's other
      per-tenant tables use.
      - Classification algorithm (byte-level canonical-JSON comparison,
      same normalization as REQ-036's plan digest): for each artefact,
      compare base (installed-at-Vb content, from
      solution_pack_artefact_bases), theirs (current tenant content), and
      incoming (offered Vn content) -- unchanged (all three match),
      clean_update (base==theirs, base!=incoming), local_only
      (base==incoming, base!=theirs), or conflict (both sides changed, OR
      base is NULL/no install record -- prm-batch1 PRM-09 AC5: "cannot
      prove no modification" is itself a conflict case, not an error).
      - has_unresolved_conflicts on the returned plan is true iff any
      conflict-classified artefact lacks a resolution; a plan with
      unresolved conflicts is rejected at apply time (a later requirement's
      job to enforce -- this requirement computes and exposes the flag).
      OPEN QUESTION (flag, do not silently resolve): neither 0003 nor any
      other Letflow decision record states a general rule for when a table
      gets this GLOBAL exception versus Decision B's schema-per-tenant
      default (the same kind of R-Co-internal GLOBAL classification
      service_catalog carries, per svc-01-04-service-scope.md: "service_catalog
      is a public-schema routing/registry table (TNT-01 confirmed)"). This
      requirement follows prm-batch1's stated classification for these
      three tables specifically, but flags the underlying general question
      as unresolved and worth a REVIEWER/decision-record follow-up rather
      than something each future requirement re-derives ad hoc.
    acceptance_criteria:
      - "priv/repo/migrations gains solution_pack_installs, solution_pack_artefact_bases, and pack_update_resolutions migrations in the public/default schema (not :prefix-scoped), applying cleanly"
      - "compute_pack_update_plan/5 against an artefact with no matching solution_pack_artefact_bases row classifies it as conflict, not unchanged or an error, per PRM-09 AC5"
      - "compute_pack_update_plan/5 against base==theirs!=incoming classifies clean_update; base==incoming!=theirs classifies local_only; base==theirs==incoming classifies unchanged -- each with an explicit test"
      - "has_unresolved_conflicts is true when at least one conflict-classified artefact has no matching pack_update_resolutions row, and false once every conflict artefact has one"
      - "the moduledoc explicitly flags the GLOBAL-vs-PER_TENANT classification question as unresolved beyond this requirement's own scope, per this requirement's description"
    depends_on: [REQ-015]

  - id: REQ-042
    title: Definition full-text search (store.zig's search, PD-10)
    owner: ELIXIR-DEV
    status: pending
    stage: S2
    impl_order: 53  # letflow-queue task id
    description: >
      Port src/definition/store.zig's Store.search() (per
      src/design/definition.md's PD-10 section) as
      Letflow.Definitions.search/1, operating on REQ-027's process_definitions
      table (including its stage column, since PD-10's own SQL SELECT list
      includes it). definition.md is explicit that "Search lives inside the
      existing store.zig... No new Zig source file or SQL migration is
      required" -- this requirement adds no new table, reusing REQ-027's
      schema as-is.
      - SearchOptions-equivalent input: query (string, non-empty and <=512
      chars -- QueryEmpty/QueryTooLong errors, validated both here as
      belt-and-suspenders and, later, at the S4 HTTP handler layer per
      PD-10's own validation-rules table), limit (default 20, max 100 --
      values above 100 are the HTTP handler's job to reject with a 422
      before calling this function, per definition.md's handleSearch step
      3; this function itself does not need to reject an out-of-range
      limit, only apply the default), offset (default 0).
      - Matching: ILIKE against name and description (definition.md's
      "Why ILIKE instead of tsvector/to_tsquery" rationale: no dictionary
      config dependency, no GIN index required, sufficient for a COULD-priority
      requirement, satisfies the partial-word-matching SHOULD criterion via
      a '%query%' pattern) -- bound as pg/Ecto parameters, the '%' wildcard
      characters composed into the bound parameter value itself, never
      string-interpolated into the query text (definition.md's explicit
      SQL-injection-safety note).
      - Ranking: exact name match (case-insensitive) scores 3.0; partial
      name match scores 2.0; description-only match scores 1.0 (definition.md's
      CASE expression); results ordered by rank DESC, then created_at DESC
      for deterministic sub-ordering among equal ranks.
      - Returns an empty list (not an error) when nothing matches
      (definition.md: "no-match -> HTTP 200 with empty array" -- this
      function returns the empty list, the S4 HTTP layer owns the 200
      mapping).
      This requirement is domain logic only -- the HTTP endpoint (GET
      /api/v1/definitions/search) is S4 (api-surface) scope, not built here,
      matching REQ-036's own established boundary note for the promotion
      pipeline (context-module function, not a Plug route handler).
    acceptance_criteria:
      - "search/1 with query \"invoice\" returns a definition named exactly \"invoice\" ranked above one named \"invoice-approval\" (partial name match), which in turn ranks above one matched only via its description containing \"invoice\""
      - "search/1 with an empty query string returns a QueryEmpty-equivalent error, not an empty result list"
      - "search/1 with a query longer than 512 characters returns a QueryTooLong-equivalent error"
      - "search/1 against a query with no matching name or description anywhere returns an empty list, not an error"
      - "search/1 respects limit (default 20) and offset for pagination, demonstrated with more matching rows than fit in one page across two successive calls"
      - "the moduledoc states no new migration/table was added, explicitly citing definition.md's PD-10 section for that boundary"
    depends_on: [REQ-030]
