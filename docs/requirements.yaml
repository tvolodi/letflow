  - id: REQ-033
    title: Definition snapshot store (snapshot.zig, PD-08)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 46  # letflow-queue task id
    description: >
      Port src/definition/snapshot.zig's SnapshotStore (per
      src/design/definition.md's PD-08 section) as a
      Letflow.Definitions.SnapshotStore module operating on REQ-027's
      instance_definition_snapshots and process_definitions tables:
      - create/2 (instance_id, definition_id): reads the definition row
      under a shared lock (SELECT ... FOR SHARE, per definition.md's
      "Atomicity guarantee" -- prevents a concurrent delete or
      exclusive-lock write from racing the snapshot capture) and inserts the
      snapshot row, both in one transaction; ON CONFLICT (instance_id) DO
      NOTHING semantics for idempotency (a retry of the same instance_id's
      snapshot creation is a no-op, not a second row); not-found error if
      definition_id doesn't exist; SnapshotAlreadyExists-equivalent (not a
      generic conflict) if instance_id already has a snapshot.
      - get_by_instance_id/1: reads the snapshot row for an instance_id;
      not-found error if absent.
      No update path is exposed anywhere on this module -- snapshots are
      immutable after creation (definition.md: "Snapshots read-only after
      creation; no API endpoint permits modification").
      BOUNDARY NOTE (name explicitly, do not silently assume): per
      definition.md's PD-08 section and stage-2-event-store-definitions.md's
      own grounding for this file, the engine calling create/2 "at
      instance-start time (EE-01), BEFORE any event is appended" is S3's job
      (the engine doesn't exist in Letflow yet) -- this requirement builds
      only the store's create/retrieve operations in isolation, fully
      testable without any engine code, per definition.md's own "Stage 2
      boundary" rationale for why this file lives in the definition module
      rather than src/engine/.
    acceptance_criteria:
      - "create/2 against a valid definition_id inserts a snapshot row whose graph matches the source process_definitions row's graph at the moment of the call"
      - "create/2 called twice with the same instance_id is idempotent (no error, no second row) OR returns a distinct SnapshotAlreadyExists-equivalent error -- pick one behavior and state which in the moduledoc, since definition.md's own text supports the idempotent reading for an EE-01 retry"
      - "get_by_instance_id/1 against an instance_id with no snapshot returns a not-found error, not nil silently"
      - "deleting a process_definitions row that an instance_definition_snapshots row references is rejected by the database (foreign_key_violation), and the snapshot row remains present and unmodified -- per PD-08's no-ON-DELETE-CASCADE design (REQ-027); a snapshot is never removed as a side effect of deleting its source definition"
      - "the moduledoc explicitly states the EE-01 instance-start integration point is S3 scope, not built here"
    depends_on: [REQ-027]

  - id: REQ-034
    title: Definition export/import (export_import.zig, PD-09)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 52  # letflow-queue task id
    description: >
      Port src/definition/export_import.zig's ExportImportStore (per
      src/design/definition.md's PD-09 section) as a
      Letflow.Definitions.ExportImport module, calling REQ-030's Store
      functions (definition.md: "export/import logic ... belongs alongside
      store.zig, graph.zig, and snapshot.zig ... imports store.zig and
      graph.zig"):
      - EXPORT_SCHEMA_VERSION constant: "bpm/definition/v1" (stable
      identifier embedded in every exported document, checked on import --
      enables future forward-compatible version detection without
      misinterpreting an incompatible future document).
      - export/1: serializes a process_definitions row into an
      ExportDocument (per definition.md's struct: bpm_export_schema_version,
      id [informational only, NOT reused as the imported row's primary key],
      name, version, description, graph [full DefinitionGraph], exported_at
      [ISO8601 UTC]) -- name/version/description preserved exactly.
      - import/1: given an ExportDocument, generates a NEW id for the
      imported definition (never reuses the source id), preserves
      name/version/description/graph exactly, and re-runs REQ-028/029's
