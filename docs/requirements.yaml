  - id: REQ-022
    title: Schema-per-tenant provisioning mechanism (tenant_schemas registry + provisioning function)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 36  # letflow-queue task id
    description: >
      Build the multi-schema provisioning mechanism docs/migration/decisions/
      0003-ecto-schema-strategy.md Decision B named but explicitly deferred out
      of REQ-015's scope (see lib/letflow/design/identity-schema.md section 1's
      "Follow-up work this creates," and 0003's own Dimension B Reasoning: "a
      tenant_schemas-equivalent registry and a provisioning path... are needed
      at S2/S3 execution time"). Confirmed by inspection: priv/repo/migrations/
      currently has zero tenant_schemas/provisioning migrations as of REQ-021
      (all S1 tables live in Ecto's single default public schema). Add:
      (a) a tenant_schemas registry table/migration (public/default schema --
      this table, like REQ-015's tenants table, is a global lookup that must be
      queryable before a tenant's own schema context is known, so it does not
      itself live inside a tenant schema) recording at minimum tenant_id,
      schema_name, and a provisioned-at timestamp;
      (b) a schema-provisioning function (Letflow.TenantProvisioning.provision_tenant_schema/1
      or similar), mirroring R-Co's public.bpm_provision_tenant_schema(p_tenant_id UUID)
      from migrations/060_schema_per_tenant_bootstrap.sql (cited in 0003's
      Reasoning), that issues CREATE SCHEMA for a real Postgres schema and
      records the mapping in tenant_schemas;
      (c) a migration-replay mechanism mirroring R-Co's src/db/migrations.zig's
      runForSchema, which re-applies priv/repo/migrations/ (or a designated
      per-tenant subset of it) against a specific tenant schema using Ecto's
      :prefix option on Ecto.Migration's create table (0003's "Concrete
      Ecto/Postgres mechanics" paragraph names this as the relevant primitive)
      -- demonstrated by provisioning at least one non-default tenant schema
      and confirming its tables exist under that schema's own search_path.
      Every S2 requirement building an event-store or definition table
      (REQ-023 onward) depends on this requirement and uses :prefix-based
      schema-per-tenant from its first migration, per 0003 Decision C's
      explicit statement that event-store tables get no special-cased
      tenant-isolation treatment.
      OPEN QUESTION (flag, do not silently resolve): REQ-015's users/groups/
      tenant_role tables currently live in the public default schema (per
      identity-schema.md section 1's deferral). This requirement does not
      retrofit those three tables to live under each tenant's own schema --
      only tenants and this requirement's own tenant_schemas registry are
      structurally global (a realm->tenant lookup must run before any tenant
      schema is known, so they cannot live inside a tenant schema). Whether
      users/groups/tenant_role should eventually be retrofitted behind
      :prefix (matching R-Co's own migration history, where identity tables
      also moved behind schema-per-tenant post-migration-060) is left open
      for a future requirement to decide explicitly, not assumed here either
      way.
    acceptance_criteria:
      - "priv/repo/migrations gains a tenant_schemas migration (public/default schema) that applies cleanly via mix ecto.migrate, with columns for at minimum tenant_id and schema_name"
      - "a provision_tenant_schema/1-equivalent function exists that issues a real CREATE SCHEMA and records the mapping in tenant_schemas, demonstrated against at least one non-default tenant schema name"
      - "a migration-replay function exists that re-applies priv/repo/migrations/ against a specific tenant schema via Ecto's prefix: option, demonstrated by confirming at least one table exists under the provisioned schema's own information_schema, not just under public"
      - "the moduledoc/description explicitly states, as an open question rather than a silent decision, whether REQ-015's users/groups/tenant_role migrations are retrofitted to use :prefix now or remain in public schema"
    depends_on: [REQ-015]

  - id: REQ-023
    title: Event-store schema/migrations (events, instance_sequence, event_payload_store, events_archive, idempotency sidecar, instance_projections)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 38  # letflow-queue task id
    description: >
      Add priv/repo/migrations and corresponding Ecto.Schema modules for the
      event-store tables R-Co's src/design/event_store.md documents (Covers:
      ES-01..ES-08), following docs/migration/decisions/0003-ecto-schema-strategy.md
      Decision C exactly (read in full before starting) and REQ-022's
      schema-per-tenant provisioning mechanism (every table below uses Ecto's
      :prefix option, none targets the public default schema):
      - events: event_id (binary_id), instance_id (binary_id, indexed),
      event_type (string), payload (text/jsonb -- inline; per event_store.md's
      Payload size boundary, values over 4096 bytes get a {"$ref": "<uuid>"}
      pointer into event_payload_store instead of raw storage, enforced at the
      append logic layer in REQ-025, not the migration layer), actor_id
      (binary_id, not null), created_at (utc_datetime_usec -- microsecond
      precision per ES-01), sequence_number (bigint), idempotency_key (string),
      metadata (jsonb, default "{}"), global_seq (bigint). Per 0003 Decision C
      point 2(a) (the partitioning point's first lettered sub-point): primary
      key is (event_id, created_at), NOT a bare event_id PK, even though
      partitioning itself is deferred -- this is so a future partitioning
      retrofit (mirroring R-Co's 1147_par01_events_partitioning.sql) never
      forces a breaking PK-shape change. No update path is exposed on the
      Ecto.Schema module for this table (no update_changeset/2) -- state this
      explicitly in the schema moduledoc per Decision C point 1
      (append-only/immutability, the decision's first top-level numbered
      point); this is an application/schema-module-layer invariant, not
      something the migration file can enforce.
      - instance_sequence: instance_id (binary_id, primary key), next_seq
      (bigint, default 1) -- the per-instance sequence-lock row event_store.md's
      Concurrency design section describes (SELECT ... FOR UPDATE / increment
      protocol, implemented in REQ-025).
      - event_payload_store: event_id (binary_id, unique), payload
      (text/bytea), byte_size (integer) -- the side table for payloads over
      4096 bytes (event_store.md's Payload size boundary invariant).
      - events_archive: same column shape as events, plus archived_at
      (utc_datetime_usec) -- destination table for Store.archive() (REQ-026).
      - a dedicated idempotency sidecar table (naming: event_idempotency, or
      preserve R-Co's own plat_event_idempotency name -- ELIXIR-DEV's choice,
      cite either), keyed on idempotency_key with a unique index, built from
      day one per 0003 Decision C point 2(b) (the partitioning point's second
      lettered sub-point, distinct from 2(a)'s PK-shape concern above):
      "Letflow adopts the sidecar-table approach for idempotency from the
      start (not deferred to partitioning time)." This sidecar table is
      itself schema-per-tenant too (0003's own
      closing paragraph: "a cross-tenant-shared sidecar table would
      reintroduce exactly the shared-table blast-radius risk Decision B
      rejected"). Note explicitly in the moduledoc that this sidecar supersedes
      event_store.md's own "Open Question #1" recommendation (a two-phase
      events-then-events_archive check) -- 0003 already resolved that open
      question in favor of the sidecar table, so REQ-025/REQ-026's
      append/archive logic checks/writes this sidecar table for idempotency,
      not a raw unique index scattered across events and events_archive
      separately.
      - instance_projections: instance_id (binary_id, primary key), status
      (string/Ecto.Enum -- at minimum ACTIVE/CANCELLED/COMPLETED per
      event_store.md's Store.append() active-instance guard), last_event_seq
      (bigint), updated_at. Note explicitly in the moduledoc: this table's
      *schema* is event-store's own responsibility (event_store.md's DB
      tables per operation section shows Store.append() reads/writes it
      directly for the ES-01 active-instance guard), but *populating it
      meaningfully at instance-start* is EE-01/S3 territory (src/engine/, not
      built yet) -- do not read this migration as instance-engine work
      landing early.
      All tables use binary_id primary keys per Decision A except where noted
      above (events' composite PK, instance_sequence/instance_projections'
      natural PK).
    acceptance_criteria:
      - "priv/repo/migrations gains migrations for events, instance_sequence, event_payload_store, events_archive, the idempotency sidecar table, and instance_projections, all using Ecto's :prefix option and applying cleanly against at least one provisioned tenant schema via REQ-022's migration-replay mechanism"
      - "events' migration defines the primary key as (event_id, created_at), not a bare event_id, per 0003 Decision C point 2(a)"
      - "the events Ecto.Schema module has no update_changeset/2 or any function that issues an UPDATE against a committed row; the moduledoc states this is a deliberate immutability invariant per 0003 Decision C point 1"
      - "the idempotency sidecar table has a unique index on idempotency_key and its own moduledoc states it supersedes event_store.md's Open Question #1 two-phase-check recommendation per 0003's resolution"
      - "instance_projections' moduledoc explicitly states its schema is event-store scope (this requirement) while its meaningful population is EE-01/S3 scope, not built here"
    depends_on: [REQ-022]

  - id: REQ-024
    title: Event type registry (registry.zig, ES-05 -- schema + registerType/validatePayload/getType)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 39  # letflow-queue task id
    description: >
      Port src/event_store/registry.zig (ES-05) as a Letflow.EventStore.Registry
      context module, per R-Co's src/design/event_store.md's registry.zig
      section. Add:
      - event_type_registry migration/schema (:prefix schema-per-tenant, per
      REQ-022's mechanism): id (binary_id), name (string, 1..128 chars),
      schema_version (integer), json_schema (text/jsonb), description (text,
      nullable), created_at, updated_at.
      - register_type/2 (or /3): validates name (non-empty, <=128 chars) and
      schema_version (integer > all existing versions for this name; 0
      invalid) before insert; returns {:error, :duplicate_event_type_version}
      on a (name, schema_version) collision (event_store.md's
      DuplicateEventTypeVersion).
      - validate_payload/2: fetches the named event type's most recent (or
      exact, per ELIXIR-DEV's interface choice -- state which in the
      moduledoc) json_schema and validates payload bytes against it; on
      failure, records field-level ValidationFailure detail (field_path as a
      JSON Pointer, constraint, actual value) retrievable via a
      last_validation_failures/1-equivalent, matching event_store.md's
      lastValidationFailures() contract (owned by the Registry
      process/struct, valid until the next Registry call -- port this
      ownership contract faithfully, e.g. via a struct returned alongside the
      error rather than hidden mutable state, since Elixir has no implicit
      "valid until next call" memory model the way Zig's slice-ownership
      does).
      - get_type/1: returns the most recent schema_version record for a name;
      error tuple if unregistered.
      OPEN QUESTION (flag, do not silently pick): no docs/migration/decisions/*.md
      record covers JSON Schema validation library choice for Elixir. R-Co
      hand-rolls its own validator (src/tools/json_schema.zig). Candidates for
      Letflow include the ex_json_schema hex package (draft-04/06/07 support)
      or a hand-rolled minimal validator matching R-Co's own supported
      keyword subset (per src/design/spc-01-sub-process-interface-contract.md's
      "JSON Schema well-formedness rule" table, which documents R-Co's actual
      supported keyword set: type, minimum/maximum, minLength/maxLength,
      enum, required, properties, items, additionalProperties). This
      requirement does not pick one -- CODE-DESIGNER decides at WF-02 design
      time and records the choice, escalating to a new
      docs/migration/decisions/ record if it's a genuinely new library
      dependency (matching 0002/0003's own precedent of recording library
      adoptions).
      OPEN QUESTION (flag): is event_type_registry itself a per-tenant table
      (each tenant defines its own event vocabulary) or a platform-wide
      global catalog shared across tenants? Neither 0003 nor event_store.md
      states this explicitly (event_store.md documents the table's
      columns/behavior but not its tenant-schema classification, unlike
      1147_par01's explicit PER_TENANT classification of events/events_archive
      cited in 0003). This requirement defaults to schema-per-tenant
      (matching Decision B's general rule for business tables, absent a
      stated exception), but flags this as worth CODE-DESIGNER/REVIEWER
      re-confirming rather than treating as definitively settled by this
      requirement alone.
    acceptance_criteria:
      - "priv/repo/migrations gains an event_type_registry migration (schema-per-tenant per REQ-022) applying cleanly"
      - "register_type/2 rejects a second registration with the same (name, schema_version) with a distinct, testable error, not a generic changeset failure"
      - "validate_payload/2 against a payload missing a required field returns a failure result whose detail names the specific field_path (JSON Pointer form) and constraint, not just a boolean false"
      - "get_type/1 against an unregistered name returns an explicit :unknown_event_type-shaped error rather than nil or an exception"
      - "the moduledoc names the JSON Schema validation library choice as an explicit open question for CODE-DESIGNER, not a silently made decision"
    depends_on: [REQ-022]

  - id: REQ-025
    title: Event append (store.zig's append, ES-01/02/03/05/08/DB-03)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 45  # letflow-queue task id
    description: >
      Port src/event_store/store.zig's Store.append() (per
      src/design/event_store.md's full "append" section: Key invariants 1-2,
      4, 6-10; DB tables per operation's "append" row) as
      Letflow.EventStore.append/1 (or /2), operating on REQ-023's
      events/instance_sequence/event_payload_store/instance_projections/
      idempotency-sidecar tables and REQ-024's Registry. One atomic operation
      (Ecto.Multi or Repo.transaction) performs, in order:
      1. Active-instance guard: read instance_projections.status for the
      target instance; if CANCELLED or COMPLETED, abort with no rows written
      (event_store.md invariant 10).
      2. Per-instance sequence assignment: lock instance_sequence's row for
      the instance (or insert-if-absent per event_store.md's "First append to
      a new instance" SQL pattern) and assign sequence_number from the locked
      value, incrementing atomically (invariant 2).
      3. Registry-first validation: call REQ-024's validate_payload/2 before
      any write; zero rows written on failure (invariant 8).
      4. Idempotency: check/insert into REQ-023's idempotency sidecar table
      keyed on idempotency_key; a pre-existing key returns the original
      record with is_duplicate: true (the HTTP layer, S4, maps this to 200 vs
      201 -- this requirement returns the boolean, it does not decide the
      HTTP status) rather than a fresh insert (invariant 4, using the sidecar
      table per REQ-023's note, not events' own uniqueness alone).
      5. Payload side-table: payloads over 4096 bytes get inserted into
      event_payload_store, with events.payload storing the {"$ref":
      "<uuid>"} pointer form (invariant 7).
      6. Metadata validation pre-DB: reject (no DB round-trip) metadata with
      >50 entries, any key >128 chars, any value >1024 chars, or any
      non-string value, before the transaction opens (invariant 9, ES-08).
      7. instance_projections update: last_event_seq and updated_at updated
      in the same transaction (invariant 6, DB-03).
      Validation-error cases (unknown event type, payload schema failure,
      metadata invalid, missing/too-long idempotency key, invalid/missing
      payload, missing actor_id) each need a distinct, pattern-matchable
      error return per event_store.md's StoreError enum -- port the full
      error set as Elixir tagged tuples/exceptions, not a single generic
      :error.
      TENANT_ID (per 0003's 2026-08-17 addendum, resolving ISS-0025/GH#83):
      events/instance_sequence/instance_projections/the idempotency sidecar
      all carry a NOT NULL tenant_id column with no DB default. append/1(2)
      must NOT accept tenant_id as a plain caller-supplied field -- derive it
      from the Ecto :prefix (tenant schema) the write is already targeting,
      by reversing REQ-022's Letflow.TenantProvisioning.schema_name_for_tenant/1
      encoding, so the column can never disagree with the schema the rows
      physically land in.
    acceptance_criteria:
      - "appending to a terminated instance (status CANCELLED or COMPLETED in instance_projections) returns an error and writes zero rows across all five involved tables, demonstrated by an actual test or iex session against a real Postgres, not just described"
      - "two concurrent appends to the same instance_id never receive the same sequence_number -- demonstrated with an actual concurrent test (e.g. Task.async_stream racing two appends) or, if concurrency can't be exercised in this environment, the FOR UPDATE-equivalent locking code path is cited explicitly"
      - "appending twice with the same idempotency_key returns is_duplicate: true on the second call and does not insert a second events row, verified against the idempotency sidecar table REQ-023 defines"
      - "a payload that fails REQ-024's validate_payload/2 results in zero rows written to events, instance_sequence, or instance_projections -- no partial state"
      - "a payload over 4096 bytes is split into events.payload's $ref pointer form plus an event_payload_store row, verified by reading both rows back after append"
      - "every row append/1(2) writes (events, instance_sequence, instance_projections, the idempotency sidecar) has tenant_id equal to the tenant whose schema the write targeted, derived internally -- not equal to a caller-supplied tenant_id when the two are deliberately made to disagree in a test, which must fail loudly (not silently attribute to the wrong tenant) rather than succeed"
    depends_on: [REQ-023, REQ-024]

  - id: REQ-026
    title: Event read paths, archive, and platform sentinels (store.zig's read/readGlobal/pointInTime/archive + platform.zig)
    owner: ELIXIR-DEV
    status: pending
    stage: S2
    impl_order: 49  # letflow-queue task id
    description: >
      Port src/event_store/store.zig's Store.read(), Store.readGlobal(),
      Store.pointInTime(), and Store.archive() (per
      src/design/event_store.md's respective sections: ES-02/06 for
      read/pointInTime, ES-04 for readGlobal, ES-07 for archive), plus
      src/event_store/platform.zig's three sentinel constants
      (PLATFORM_INSTANCE_ID, PLATFORM_ACTOR_ID, PLATFORM_TENANT_ID -- a
      12-line file; port as module attributes/constants on the same context
      module, no separate file needed unless ELIXIR-DEV judges otherwise)
      verbatim, since platform.zig's own header states "no LLM, HTTP, or
      external service dependencies in this file" -- these are just fixed
      UUID-shaped strings used by non-instance-scoped scheduler events (a
      later stage's concern to actually emit; this requirement only needs the
      constants to exist).
      - read/2: events for an instance_id in ascending sequence_number order;
      supports up_to_sequence/up_to_timestamp filters (up_to_sequence takes
      precedence if both given, per ES-06); transparently resolves any $ref
      payload pointer via event_payload_store before returning; returns an
      explicit not-found error (not an empty list) when instance_id has no
      instance_sequence row, matching event_store.md's InstanceNotFound.
      - read_global/1: cursor-based pagination via after_global_seq (null =
      from the beginning), limit clamped to 1..1000 (0 treated as default 100
      per GlobalReadOpts), ordered by global_seq ascending across all
      instances.
      - point_in_time/3: convenience wrapper over read/2 with up_to_timestamp
      set.
      - archive/1: moves events past retention_days (a global fallback;
      per-event-type policies from event_retention_policies take precedence,
      0 retention_days means only explicit policies apply) into REQ-023's
      events_archive via an idempotent insert-then-delete-confirmed pattern
      (event_store.md invariant 11: running twice produces the same final
      state), without locking instance_projections or instance_sequence
      (invariant 12 -- archival must not block active instances). Returns the
      count of rows moved.
      EVENT_RETENTION_POLICIES (per ISS-0013/GH#69, resolved 2026-08-17):
      this requirement ALSO creates event_retention_policies via its own
      migration + Ecto schema module -- no earlier requirement creates it
      (REQ-023's acceptance criteria enumerate exactly six other tables, this
      is deliberately not a seventh). Columns/constraints match R-Co's
      current 003_event_archive.sql shape: id (uuid pk), event_type
      (unique), policy (default "keep_forever", one of "keep_forever" |
      "keep_days" | "keep_count"), keep_days, keep_count, created_at,
      updated_at, plus chk_retention_policy/chk_keep_days/chk_keep_count
      CHECK constraints. Deliberately NOT porting 037_adp11_replay_safe_
      retention_policy.sql's later hard_delete_days/hard_delete_count
      extension: those policy values exist to interact with PAR-03's
      partition-routing mechanism (event_type_registry.retention_class,
      events_ephemeral -- confirmed by reading 1149_par03_retention_class.sql
      directly), which Letflow does not have per 0003 Decision C's deliberate
      partitioning deferral -- porting them now would add policy values with
      no consuming mechanism.
      ARCHIVE/1 SOURCING (per ISS-0014/GH#70, resolved 2026-08-17): R-Co
      retired Store.archive() under PAR-03 (src/event_store/store.zig
      ~line 1288: "REMOVED... superseded by
      PartitionRetention.runArchivalAging()/runEphemeralDrop(), which operate
      at whole-PARTITION granularity via DETACH/ATTACH/DROP rather than
      row-level DELETE"). That replacement mechanism only works on a
      partitioned table, which Letflow deliberately does not have yet (0003
      Decision C point 2: "unpartitioned first... rather than speculatively
      partitioning a table with no rows yet"). Porting archive/1 as a
      row-level move (this requirement's existing acceptance criteria below,
      unchanged) is therefore the deliberately CHOSEN resolution (option (a)
      of the three ISS-0014 recorded), not an oversight of the retirement --
      it is correct for Letflow's current unpartitioned architecture, mirrors
      what R-Co itself ran before PAR-03 existed, and is the same
      build-for-the-current-architecture pattern 0003 Decision C already
      established elsewhere in this stage. It is expected to need reworking
      if/when Letflow ever partitions events, exactly as it did in R-Co --
      that is an accepted, documented future cost, not a defect now. Options
      (b) (defer archive/1 entirely) and (c) (port partition-granularity
      retention now) were considered and rejected: (b) would leave REQ-023's
      already-shipped events_archive table with nothing writing to it
      indefinitely; (c) would force partitioning early, contradicting 0003
      Decision C and requiring REVIEWER sign-off/a new decision record this
      is not.
    acceptance_criteria:
      - "read/2 against an instance with N appended events (via REQ-025) returns exactly those N events in ascending sequence_number order, with any large payload transparently resolved from event_payload_store"
      - "read/2 against an instance_id with no events returns an explicit not-found error, not an empty list"
      - "read_global/1 with after_global_seq set returns only events with a strictly greater global_seq, demonstrated across at least two instances' interleaved events"
      - "calling archive/1 twice in a row moves the same rows the first time and zero additional rows the second time (idempotent), verified by row counts before/after each call"
      - "event_retention_policies exists (via this requirement's own migration) with columns id/event_type(unique)/policy(default keep_forever)/keep_days/keep_count/created_at/updated_at and the chk_retention_policy/chk_keep_days/chk_keep_count CHECK constraints, matching R-Co's 003_event_archive.sql shape"
      - "archive/1 against an event_type with an explicit event_retention_policies row uses that policy's keep_days/keep_count instead of the global retention_days fallback, demonstrated with a policy row that would move a different set of rows than the global default would"
      - "the three platform sentinel constants exist and are accessible from the context module, each documented as citing src/event_store/platform.zig"
    depends_on: [REQ-025]

  - id: REQ-027
    title: Definition core schema (process_definitions + instance_definition_snapshots)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 40  # letflow-queue task id
    description: >
      Add priv/repo/migrations and Ecto.Schema modules for the two core
      definition tables R-Co's src/design/definition.md documents (module
      purpose section: "store.zig owns all DB-backed CRUD... against
      process_definitions and instance_definition_snapshots"), using
      REQ-022's schema-per-tenant :prefix mechanism (process_definitions is a
      business table under Decision B's general rule, same as every other
      tenant-owned table this stage adds):
      - process_definitions: id (binary_id), name (string, <=255 chars),
      version (string), description (text, nullable), status (Ecto.Enum:
      draft/active/deprecated/archived, default draft -- PD-04's
      DefinitionStatus), stage (string, nullable -- PD-07's free-text stage
      label column, per definition.md's PD-07 section and its
      migrations/014_definition_stage.sql: "The process_definitions table has
      no stage column... The column is nullable so that existing rows are
      unaffected (no back-fill required)"; no enum validation, stage labels
      are open-ended text per PD-07), graph (jsonb, default
      {"nodes":[],"edges":[]} -- definition.md's DefinitionGraph shape:
      {"nodes": [...], "edges": [...]}), created_by (binary_id), archived_at
      (utc_datetime_usec, nullable), timestamps(). Indexes: a unique index on
      (name, version) (definition.md's uq_definition_version), a partial
      unique index on name WHERE status = 'active' (uq_active_definition,
      PD-03's single-active-per-name invariant -- needed even though
      activate() itself is REQ-030's job, since the index is a
      migration-level constraint), and a partial index on stage WHERE stage
      IS NOT NULL (definition.md's idx_def_stage, PD-07 -- keeps the index
      compact by not indexing NULL entries).
      - instance_definition_snapshots: instance_id (binary_id, primary key),
      definition_id (binary_id, references process_definitions -- NO ON
      DELETE CASCADE, per PD-08's explicit "FK without ON DELETE CASCADE"
      design: a hard-deleted DRAFT definition must not take its snapshot rows
      with it), definition_name (string), definition_ver (string), graph
      (jsonb), snapshotted_at (utc_datetime_usec). No updated_at/timestamps()
      beyond snapshotted_at -- the table is write-once per PD-08 (no UPDATE
      path is exposed at the schema-module layer, enforced in REQ-033, not
      this migration).
      Note explicitly in both moduledocs: this requirement builds schema
      only. graph/node/edge structural validation (REQ-028/029), CRUD
      operations (REQ-030), and the snapshot create/retrieve functions
      (REQ-033) are separate requirements building on these tables.
    acceptance_criteria:
      - "priv/repo/migrations gains process_definitions and instance_definition_snapshots migrations, both schema-per-tenant via REQ-022's :prefix mechanism, applying cleanly"
      - "process_definitions has a unique index on (name, version) and a partial unique index on name WHERE status = 'active'"
      - "process_definitions has a nullable stage column and a partial index on stage WHERE stage IS NOT NULL, per definition.md's PD-07 section (migrations/014_definition_stage.sql)"
      - "instance_definition_snapshots.definition_id references process_definitions.id with no ON DELETE CASCADE, and the moduledoc states this is deliberate per PD-08"
      - "both Ecto.Schema modules' @moduledoc cite R-Co src/design/definition.md (PD-01/PD-07/PD-08 sections) as the ported source"
    depends_on: [REQ-022]

  - id: REQ-028
    title: Graph structural validator (graph.zig, PD-02)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 37  # letflow-queue task id
    description: >
      Port src/definition/graph.zig's validateGraph() (per
      src/design/definition.md's graph.zig section, "Named validation checks
      (PD-02)" table) as a pure Letflow function -- no Ecto.Repo call, no I/O
      of any kind, matching graph.zig's own documented purity ("no I/O, no DB
      calls, no logging, no clock reads"). Implement the shared types
      (GraphNode: id/node_type/label/attributes; GraphEdge:
      id/source/target/condition/is_default; DefinitionGraph: nodes+edges) as
      plain structs/maps, and NodeType as the 7-variant set definition.md's
      PD-05 section documents as authoritative (START, END, HUMAN_TASK,
      SERVICE_TASK, EXCLUSIVE_GATEWAY, PARALLEL_GATEWAY, TIMER -- NOT the
      superseded USER_TASK/SCRIPT_TASK names definition.md explicitly flags
      as wrong). Implement all 8 named checks (CHK-01 through CHK-08 in
      definition.md's table): exactly one START node; at least one END node;
      no dangling edges; no isolated nodes; no duplicate node IDs; no cycles
      outside a gateway node (DFS-based, per the algorithm outline in
      definition.md); node count <=500; edge count <=2000. ALL checks run and
      ALL violations collect before returning -- never short-circuit on the
      first failure (Key invariant 5). Each violation carries a
      machine-readable code (one of the CHK-XX codes) and a human-readable
      message naming the offending node/edge ID.
      Per stage-2-event-store-definitions.md's "Static-typing gap" finding,
      this is exactly the kind of larger validation surface where a single
      property test is not sufficient coverage on its own -- the acceptance
      criteria below require explicit example coverage of every named check,
      not just a generic property test.
    acceptance_criteria:
      - "a graph satisfying all 8 checks returns {valid: true, violations: []}"
      - "each of the 8 named checks (CHK-01 through CHK-08) has at least one explicit failing-example test demonstrating its specific violation code is returned, not just a generic invalid-graph test"
      - "a graph violating 3 of the 8 checks simultaneously returns all 3 violations in one call, not just the first encountered (Key invariant 5)"
      - "a cycle that passes through an EXCLUSIVE_GATEWAY or PARALLEL_GATEWAY node is explicitly permitted (not flagged as CYCLE_WITHOUT_GATEWAY), and a self-loop is explicitly rejected, each with its own test"
      - "the function signature and its call sites confirm zero Repo/database calls anywhere in its call graph"
    depends_on: []

  - id: REQ-029
    title: Node-attribute and edge-condition validators (graph.zig, PD-05/PD-06)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 44  # letflow-queue task id
    description: >
      Extend REQ-028's graph module with src/definition/graph.zig's
      validateNodeAttributes() (PD-05) and the edge-condition rules (PD-06),
      per src/design/definition.md's respective sections. Both are pure
      functions, same purity contract as REQ-028 (no I/O), and run only after
      REQ-028's validateGraph() passes (definition.md: "If validateGraph()
      fails, validateNodeAttributes() is NOT called").
      - validateNodeAttributes/1: per-node-type required-attribute rules from
      definition.md's "Attribute validation rules (all 7 node types)" table
      -- HUMAN_TASK requires non-empty role; SERVICE_TASK requires non-empty
      endpoint plus timeout_ms in [1, 300000]; TIMER requires a valid ISO
      8601 duration_iso8601 (P0D explicitly permitted as a zero-delay timer;
      fractional components rejected; the scan-forward parser
      definition.md's "Implementation guidance" describes is sufficient, no
      external library needed); START/END/EXCLUSIVE_GATEWAY/PARALLEL_GATEWAY
      require nothing. Undeclared extra attributes on any node are silently
      ignored (forward-compatibility, PD-05 edge case). All violations
      across all nodes collect before returning, same never-short-circuit
      contract as PD-02.
      - Edge condition rules (PD-06, no separate function name given in
      definition.md beyond the validateGraph() extension -- ELIXIR-DEV folds
      this into REQ-028/029's check set, noting which function owns it in the
      moduledoc): condition MUST be present (non-null, non-empty) on every
      non-default outgoing edge from an EXCLUSIVE_GATEWAY, MUST be null on
      every other edge; is_default MUST NOT coexist with a non-null
      condition; at most one outgoing edge per EXCLUSIVE_GATEWAY may be
      default. Also port isValidCelSyntax's minimal structural CEL check
      (definition.md's "CEL syntax validation" section) as a pure
      syntax-only validator (no evaluation) -- R-Co's own comment notes
      vendor/cel/cel.zig is a stub, so this is a minimal subset check, not a
      full CEL implementation; do not attempt to build a real CEL evaluator
      here.
      Both validateNodeAttributes and the edge-condition checks reuse
      GraphError.OutOfMemory's Elixir-idiomatic equivalent only where
      genuinely relevant (Elixir doesn't need an explicit allocator-failure
      error the way Zig does -- note this divergence explicitly in the
      moduledoc rather than silently dropping or silently keeping an
      inapplicable error case).
    acceptance_criteria:
      - "each of the 7 node types has at least one explicit test: HUMAN_TASK missing role, SERVICE_TASK missing endpoint, SERVICE_TASK invalid timeout (0 and >300000), TIMER missing/invalid duration, TIMER P0D explicitly accepted, and START/END/gateway types accepting no attributes"
      - "an EXCLUSIVE_GATEWAY edge with both a non-null condition and is_default: true is rejected"
      - "an EXCLUSIVE_GATEWAY with two edges both marked is_default: true is rejected"
      - "isValidCelSyntax-equivalent rejects at least one structurally invalid expression and accepts at least one structurally valid one, with an explicit test noting it performs no evaluation"
      - "extra undeclared attributes on a node do not cause a violation, demonstrated by an explicit test"
    depends_on: [REQ-028]

  - id: REQ-030
    title: Definition store CRUD (store.zig, PD-01/PD-03/PD-04/PD-07)
    owner: ELIXIR-DEV
    status: pending
    stage: S2
    impl_order: 48  # letflow-queue task id
    description: >
      Port src/definition/store.zig's core Store operations (per
      src/design/definition.md's respective PD sections) as a
      Letflow.Definitions context module, operating on REQ-027's
      process_definitions table and calling REQ-028/029's validators before
      every write that touches the graph column (Key invariant 1: "no bypass
      path exists"):
      - create/1 (PD-01): validates name (non-empty, <=255 chars) and
      version (non-empty) before calling REQ-028's validateGraph() then
      REQ-029's validateNodeAttributes(); on either failure, returns the
      violations (GraphValidationFailed-equivalent) without writing;
      hard-codes status: draft (caller cannot override, no status field on
      the create params); ON CONFLICT (name, version) DO NOTHING semantics
      for the (name, version) race (definition.md's Concurrency safety note
      -- exactly one of two concurrent identical creates succeeds, the other
      gets a duplicate error, neither leaks which one "won").
      - get_by_id/1: not-found error if id is absent.
      - get_active_by_name/1 (PD-07, per definition.md's PD-07 section "New
      public function: Store.getActiveByName"): retrieves the single
      definition whose status = active and name matches exactly; returns a
      not-found error if none exists. Because REQ-027's uq_active_definition
      partial unique index guarantees at most one active row per name, this
      query always returns exactly zero or one row -- if the DB somehow ever
      returned more than one row, definition.md's own defensive behaviour
      (return the first row) should be ported rather than raising, since the
      index already makes that case structurally impossible in practice.
      - list/1: filters by name/status/stage (stage per PD-07's `?stage=`
      filter, definition.md's ListOpts.stage -- an exact-match filter against
      REQ-027's nullable stage column, combinable with the name/status
      filters via AND, null stage = no stage filtering), cursor-based
      pagination via after_created + limit (default 50, max 200), returns an
      empty list (not an error) when nothing matches.
      - activate/1 (PD-03): atomic two-step swap in one transaction --
      deprecate any existing ACTIVE version for the same name, then activate
      the target (Step-3-before-Step-4 ordering is load-bearing per
      definition.md's "Ordering rationale," it prevents transiently
      violating the partial unique index REQ-027 defines). DRAFT->activate
      succeeds; ACTIVE->activate is an idempotent no-op (AlreadyActive-equivalent,
      not an error the caller should treat as failure); DEPRECATED/ARCHIVED->activate
      is rejected (NotDraft-equivalent); not-found is its own case. Use
      row-level locking (SELECT ... FOR UPDATE, matching definition.md's SQL
      transaction outline) to serialize concurrent activations of the same
      definition and of different definitions sharing a name.
      - deprecate/1, archive/1 (PD-04): enforce the authoritative state
      transition table (definition.md: DRAFT->ACTIVE, ACTIVE->DEPRECATED,
      DEPRECATED->ARCHIVED are the only permitted edges; every other
      transition, including the ACTIVE->ARCHIVED shortcut and any
      self-transition, is rejected as an invalid-transition error).
      archive/1 sets archived_at.
      This requirement does NOT include the SVC-03 service-scope-validation
      hook inside activate() (REQ-031's job -- R-Co's own design makes this
      hook an injectable optional field, `service_scope_validator:
      ?*ServiceScopeValidator = null`, so activate/1 here should accept an
      equivalent optional/nil-able hook parameter or module callback that
      REQ-031 later wires in, rather than activate/1 needing to be rewritten
      once REQ-031 lands).
      TENANT_ID (per 0003's 2026-08-17 addendum, resolving ISS-0025/GH#83 and
      req027-definition-core-schema.md's OQ-1): process_definitions.tenant_id
      is NOT NULL with no DB default. create/1's params must NOT include a
      caller-supplied tenant_id field -- derive it from the Ecto :prefix
      (tenant schema) create/1 is already writing into, by reversing REQ-022's
      Letflow.TenantProvisioning.schema_name_for_tenant/1 encoding, so the
      column can never disagree with the schema the row physically lands in.
    acceptance_criteria:
      - "create/1 with a graph that fails REQ-028's validateGraph() writes zero rows and returns the collected violations, not a generic error"
      - "two concurrent create/1 calls with identical (name, version) result in exactly one success and one duplicate-error, demonstrated with an actual concurrent test or the ON CONFLICT code path cited explicitly if concurrency can't be exercised"
      - "activate/1 on a DRAFT definition atomically deprecates any prior ACTIVE version of the same name in the same transaction, verified by reading both rows after the call"
      - "activate/1 called twice on the same already-ACTIVE definition returns the no-op/AlreadyActive result both times, never an error"
      - "every one of the 4 forbidden-transition cells in definition.md's authoritative state transition table (e.g. ACTIVE->ARCHIVED directly, DRAFT->ARCHIVED directly) is tested and rejected"
      - "activate/1's signature includes a nil-able/optional service-scope-validation hook parameter that REQ-031 wires in, documented explicitly in the moduledoc as the SVC-03 integration point"
      - "get_active_by_name/1 against a name with an ACTIVE version returns that definition; against a name with only DRAFT/DEPRECATED/ARCHIVED versions (no ACTIVE row) returns a not-found error, not the most recent non-active row"
      - "list/1 with a stage filter returns only rows whose stage column exactly matches the filter value, combinable with a simultaneous name and/or status filter in the same call (verified with an explicit test using all three filters together)"
      - "a row written by create/1 has tenant_id equal to the tenant whose schema the write targeted, derived internally -- not equal to a caller-supplied tenant_id when the two are deliberately made to disagree in a test, which must fail loudly (not silently attribute to the wrong tenant) rather than succeed"
    depends_on: [REQ-027, REQ-028, REQ-029]

  - id: REQ-031
    title: Service scope activation validator (service_scope_validator.zig, SVC-03)
    owner: ELIXIR-DEV
    status: pending
    stage: S2
    impl_order: 51  # letflow-queue task id
    description: >
      Port src/definition/service_scope_validator.zig's ServiceScopeValidator
      (per src/design/svc-01-04-service-scope.md section 2.5's public
      interface and section 3.3's data flow) as the hook REQ-030's
      activate/1 calls after graph/attribute validation passes and before
      the SQL transition transaction opens (svc-01-04-service-scope.md
      section 3.3): walk every SERVICE_TASK node in the graph, and for each
      service_id / plugin_handler attribute reference, check whether the
      activating tenant is permitted to use it (global scope always passes;
      tenant scope passes only if owner_tenant_id matches the activating
      tenant; unregistered references fail). Return on the first violation
      (atomic rejection per svc-01-04-service-scope.md), with enough detail
      (node_id, kind: service|plugin, ref_id, reason) for a future S4 HTTP
      layer to render a 422 body.
      IMPORTANT SCOPE GAP (flag, do not silently paper over):
      svc-01-04-service-scope.md's own design depends on two lookups this
      validator needs -- a ServiceCatalog (src/repository/service_catalog.zig,
      tenant-scoped service registry) and a PluginRegistry
      (src/engine/plugin_registry.zig, in-process plugin dispatch table) --
      NEITHER of which exists in Letflow yet: service_catalog.zig belongs to
      the repository layer (not yet ported, likely S6
      operational-cross-cutting) and plugin_registry.zig belongs to
      src/engine/ (S3 instance-engine, not yet ported). This requirement
      therefore scopes ServiceScopeValidator's OWN logic (the graph-walk +
      scope-comparison algorithm) against an injectable lookup interface
      (e.g. two behaviour callbacks or a struct of functions the validator
      calls rather than a concrete ServiceCatalog/PluginRegistry module) so
      the validator is testable and correct in isolation now, with real
      catalog/registry wiring deferred explicitly to whichever later stage
      actually builds those two dependencies -- this mirrors R-Co's own
      design, which already makes the validator an optional injectable field
      on Store (service_scope_validator: ?*ServiceScopeValidator = null), so
      nothing about this deferral is a new invention, just carrying R-Co's
      own optionality pattern through.
    acceptance_criteria:
      - "given an injected lookup returning a global-scope service, a SERVICE_TASK referencing it passes validation for any tenant_id"
      - "given an injected lookup returning a tenant-scoped service owned by tenant A, a SERVICE_TASK referencing it fails validation when activated by tenant B, with a violation detail naming the node_id and the service ref_id"
      - "given an injected lookup returning 'not registered' for a service_id, validation fails with a distinct not-registered violation reason, distinguishable from the owned-by-another-tenant case"
      - "REQ-030's activate/1 is demonstrated calling this validator via its nil-able hook when a lookup implementation is supplied, and skipping the check entirely when the hook is nil (matching R-Co's own optional-field default)"
      - "the moduledoc explicitly names the ServiceCatalog/PluginRegistry dependency gap and which future stage each belongs to, rather than implying real catalog integration exists today"
    depends_on: [REQ-030]

