  - id: REQ-124
    title: Unauthenticated tenant-config endpoint for slug-based mobile bootstrap (MOB-2 gate)
    owner: ELIXIR-DEV
    status: pending
    stage: S9
    impl_order: 236  # letflow-queue task id; depends_on translated to queue task id [145]
    description: >
      MOB-2 (docs/mobile/requirements.md) needs GET /tenant-config to
      return { realm_url, locales, default_locale, branding,
      environment_kind } WITHOUT a bearer token: the mobile app calls it
      to discover which realm to authenticate against, so by definition
      it has no token yet.
      Verified against lib/ on 2026-08-21, this is two gaps, not one:
      (a) Letflow.Routers.TenantConfig is a stub whose routes land in
      REQ-078; and (b) Letflow.Plugs.ApiPipeline mounts it behind
      Letflow.Plugs.AuthPipeline, so implementing the route is not
      sufficient -- it would still demand the token the caller cannot
      have.
      Resolve (b) explicitly: either an unauthenticated variant mounted
      ahead of AuthPipeline, or a documented exemption inside it. Pick
      one and record why in the moduledoc.
      This is the gate for the entire mobile tier -- without it the app
      cannot reach a login screen -- which is why it is sequenced first
      in docs/mobile/build-order.md phase M-0.
      Security scope: an unauthenticated endpoint returning per-tenant
      data is a tenant-data path by definition and needs
      SECURITY-REVIEWER. The response must expose only what bootstrap
      requires. Check the shape field-by-field against
      docs/agents/instructions/security-invariants.md -- in particular
      whether an unauthenticated caller enumerating slugs can learn
      which tenants exist, and what the answer should be for a slug that
      does not exist.
    acceptance_criteria:
      - "GET /tenant-config returns the five specified fields for a known tenant slug with no Authorization header, demonstrated by a test that sends no token"
      - "the auth-pipeline placement question is resolved explicitly and the chosen mechanism is stated in the moduledoc with its reason"
      - "a test asserts that the endpoint exposes no field beyond the five specified -- an exact-shape assertion, not a subset check"
      - "the behaviour for an unknown tenant slug is decided, tested, and justified against tenant-enumeration risk in the moduledoc"
      - "every other route under Letflow.Plugs.ApiPipeline still requires authentication, proven by a test that would fail if the exemption were pipeline-wide"
    depends_on: [REQ-078]

  - id: REQ-125
    title: Definition delta-sync endpoint (MOB-3 offline cache)
    owner: ELIXIR-DEV
    status: pending
    stage: S9
    impl_order: 237  # letflow-queue task id; depends_on translated to queue task id [148]
    description: >
      MOB-3 needs GET /definitions/delta?since=<cursor> returning only
      the definitions changed since that point, so a device can warm an
      offline cache on first run and refresh incrementally instead of
      re-fetching everything on every launch.
      Verified 2026-08-21: absent. There is no delta route under
      Letflow.Routers.Definitions. R-Co flagged this one "may be new" in
      its own spec -- it is genuinely new work, not a port, so there is
      no Zig source to read for the intended semantics.
      Decide the semantics deliberately, because a delta endpoint has
      several answers that all look reasonable until a device is offline
      across one of them: what `since` is compared against (event
      timestamp vs. definition version vs. a monotonic cursor); whether
      deletions and deprecations are represented (a cache that never
      learns about a deleted definition serves it forever); and what
      happens when `since` is older than any retained history.
      Prefer a monotonic cursor over a wall-clock timestamp if the event
      store supports it -- clock skew between a device and the server is
      exactly the condition this endpoint runs under.
      This is a tenant-scoped read path and needs SECURITY-REVIEWER: a
      delta must never leak a definition from another tenant, and the
      cursor must not be usable to probe another tenant's change volume.
    acceptance_criteria:
      - "the delta endpoint returns only definitions changed after the supplied cursor, tested with at least three definitions where exactly one changed"
      - "the choice between timestamp and monotonic cursor is stated in the moduledoc with its reasoning, and clock skew is addressed explicitly"
      - "deletion/deprecation representation is decided and tested -- a cache consuming the delta can learn that a definition is gone"
      - "the behaviour when the cursor predates retained history is defined and tested, rather than silently returning an incomplete delta"
      - "a test asserts that a delta request from tenant A never returns a definition belonging to tenant B"
    depends_on: [REQ-081]

  - id: REQ-126
    title: Version-pinned form references on task payloads (MOB-3 pinning)
    owner: ELIXIR-DEV
    status: pending
    stage: S9
    impl_order: 238  # letflow-queue task id; depends_on translated to queue task id [150]
    description: >
      MOB-3 requires that a task payload carry { form_id, form_version }
      so a client renders the exact pinned form version and never
      silently falls back to the active version. Silent substitution is
      the specific failure the requirement exists to prevent: a worker
      completing a task against a form that has changed since the task
      was created is filling in a different document than the one the
      process pinned.
      Verified 2026-08-21: neither form_id nor form_version appears
      anywhere in lib/. Note carefully what does exist and is NOT this:
      Letflow.Engine.PinResolver pins DEFINITION versions, a different
      contract. Read that module first -- its pinning machinery and
      INSTANCE_PINS_REBOUND semantics are the prior art this should be
      consistent with, not duplicate.
      Emit the pinned form reference on the task read path so both
      clients (the SPA and the mobile app) can consume it. The SPA does
      not use it today; adding it must not change the SPA's current
      behaviour, and a test should confirm that.
    acceptance_criteria:
      - "task payloads returned by the task read routes carry form_id and form_version, asserted by a test against the actual response body"
      - "the relationship to Letflow.Engine.PinResolver's definition-level pinning is stated in the moduledoc -- reusing its mechanism where it applies, and saying why where it does not"
      - "the pinned version reflects the version pinned when the task was created, proven by a test that changes the form after task creation and asserts the payload still names the original version"
      - "the SPA's existing behaviour is unchanged -- web/'s test suite passes unmodified against the new payload shape"
      - "a test asserts the field is present rather than null for a task whose definition pins a form, so an unimplemented path cannot pass as a satisfied one"
    depends_on: [REQ-083]

  - id: REQ-127
    title: State the platform locale policy (MOB-7 prerequisite, frontend-owned)
    owner: FRONTEND-DEV
    status: pending
    stage: S9
    impl_order: 233  # letflow-queue task id
    description: >
      MOB-7 says mobile i18n must match "the platform's web locale
      policy", and R-Co's own text said to VERIFY the SPA's configured
      locales and reuse them rather than assume a set.
      That verification has not been done, and the reason is that there
      may be nothing to verify: the migrated web/ declares no obvious
      locale configuration, and docs/frontend/frontend-requirements.md
      states only that dates and times render in the browser locale
      while stored/transmitted values are UTC ISO 8601. There is no
      stated locale set and no stated fallback chain.
      Determine what the SPA actually does today -- read web/src/, do
      not infer from the doc -- and then state the policy: the supported
      locale set, the fallback chain, and how tenant-authored content
      (the {locale: value} map MOB-7 refers to) resolves against a
      session locale. Record it in docs/frontend/.
      If the finding is that the SPA has no locale policy at all and is
      effectively English-only with browser-locale date formatting, that
      IS the answer -- record it as such, with what adopting one would
      require. Do not invent a locale set to make the mobile requirement
      satisfiable; a fabricated policy is worse than a recorded absence,
      because the mobile tier would then be built against it.
      Owned by FRONTEND-DEV, not a mobile role: this is a question about
      web/, and it stays answerable whether or not the mobile tier is
      ever built.
    acceptance_criteria:
      - "the current behaviour is established by reading web/src/ and quoting the specific files and lines that determine locale handling, not by citing the requirements doc"
      - "docs/frontend/ gains a stated locale policy -- supported set, fallback chain, tenant-content resolution -- or an explicit recorded finding that none exists today"
      - "if no policy exists, the record names what adopting one would require, concretely (which libraries, which files, roughly how many strings), counted rather than estimated"
      - "docs/mobile/requirements.md's MOB-7 Letflow note is updated to point at the finding instead of describing the verification as outstanding"
      - "no locale set is asserted as supported unless something in web/ actually supports it"
    depends_on: []

  # ---------------------------------------------------------------
  # S4 (continued) -- identity infrastructure and authorization
  #
  # Added 2026-08-22 (user-directed), after a gap analysis of what S1
  # actually delivered versus what a working login requires.
  #
  # WHY THESE ARE S4 AND NOT A REOPENED S1. S1 is done and stays done:
  # it delivered the identity *logic* -- token verification, claim
  # mapping, JIT provisioning, tenant<->realm binding, the auth plug --
  # and stage-1-identity.md is explicit that no real Keycloak or realm
  # provisioning existed yet, calling that a deliberate scope narrowing
  # rather than a deviation. What is missing is the identity
  # *infrastructure* that logic runs against. Every requirement below is
  # a precondition for S4's own goal (an API surface that serves an
  # authenticated, authorized request), so S4 owns them.
  #
  # THE STATE THAT MOTIVATES THEM, verified against the tree 2026-08-22:
  #   - docker-compose.yml declares exactly one service: postgres. There
  #     is no identity provider in this system.
  #   - config/dev.exs AND config/prod.exs both set
  #     issuer: "https://placeholder-keycloak.invalid/realms/bpm-default".
  #   - application.ex starts Oidcc.ProviderConfiguration.Worker against
  #     that issuer unconditionally with backoff_type: :random, so a
  #     running Letflow retries a non-existent host forever and
  #     TokenVerifier.Oidcc can never verify a token.
  #   - config/test.exs points at Letflow.Oidc.TokenVerifierDouble, so
  #     the whole suite passes without an IdP. No test in this repo has
  #     ever exercised a real token. That is why none of the above has
  #     surfaced as a failure.
  #   - Letflow.Api.Authorization (REQ-069, done) was believed to be
  #     referenced by nothing. CORRECTED 2026-08-22 (WF01-REQ115-139-20260822):
  #     lib/letflow/routers/identity.ex wires it into all 11 identity
  #     routes via with_authorized_scope/4 (lines 187-213), landed by
  #     REQ-073 (329c6f0) and REQ-074 (b2ef518). What is actually true is
  #     narrower: the other NINE sub-routers (audit, definitions,
  #     instances, metrics, onboarding, promotion, tasks, tenant_config,
  #     validation) have zero Authorization references -- they are 12-line
  #     stubs whose routes arrive with REQ-077..085. REQ-130/131 are
  #     scoped to that real gap, not to a wholly-unreachable matrix.
  #
  # impl_order: REQ-128..139 were registered in letflow-queue on
  # 2026-08-22 along with the rest of the batch -- see the S8 note above.
  # ---------------------------------------------------------------

  - id: REQ-128
    title: Add Keycloak to the dev stack with a Letflow realm and a real issuer
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 234  # letflow-queue task id
    description: >
      Give Letflow an identity provider to run against. Add a Keycloak
      service to docker-compose.yml with realm import from a tracked
      realm file, and replace the placeholder issuer in config/dev.exs
      and config/test.exs with the real local one.
      R-Co's equivalent is infrastructure/keycloak/realms/bpm-default.json
      (175 lines) plus a keycloak service on quay.io/keycloak/keycloak:26.2
      running `start-dev --import-realm`. Read it as prior art, but do NOT
      copy it unchanged -- two things in it are wrong for Letflow:
      (a) its realm defines only four roles, omitting PROCESS_OPERATOR,
      and seeds an operator account with PLATFORM_ADMIN instead. Per
      decisions/0013-authorization-role-set.md the realm defines all FIVE
      roles from Letflow.Api.Authorization and the operator account holds
      PROCESS_OPERATOR. Do not carry the PLATFORM_ADMIN grant across; it
      is a privilege escalation baked into a seed value.
      (b) R-Co fronts Keycloak with an nginx gateway purely to raise
      large_client_header_buffers to 32k, because service-account JWTs
      carrying many roles exceed nginx's 8k default and 400. Letflow has
      no reason to introduce nginx -- expose Keycloak directly, and only
      revisit this if a real header-size failure appears.
      The realm MUST carry a protocol mapper that projects realm roles
      onto a flat top-level `roles` claim (R-Co's is named `realm-roles`,
      claim.name `roles`). This is not optional polish. The SPA reads the
      flat claim directly in two files -- web/src/auth/AuthProvider.tsx
      at lines 87 and 114, and web/src/pages/OidcCallbackPage.tsx at
      lines 39 and 64, all four reading payload.roles -- and both files
      treat an absent or empty roles array as "no roles" rather than as
      an error. Do NOT look in web/src/auth/tokenUtils.ts: an earlier
      draft of this requirement cited it, and it contains no roles
      reference at all. So without the mapper the SPA gets an
      authenticated session with zero roles and an empty nav, with no
      error anywhere. Letflow.Oidc.ClaimMapping
      already accepts both "realm_access.roles" and "roles", so the
      backend will not catch this for you.
      Port selection: pick a host port that does not collide with R-Co's
      own stack (it uses 8081 for its Keycloak gateway) and follow this
      repo's existing per-workspace .env pattern (LETFLOW_DB_PORT in
      docker-compose.yml + config/db_port.exs) rather than hardcoding
      one -- the same multi-workspace constraint applies.
      Leave config/prod.exs's placeholder alone and say so in the result.
      A real production issuer is a deployment concern, and inventing one
      here would put a fictional hostname in a file that reads as
      authoritative.
    acceptance_criteria:
      - "docker compose up -d starts Keycloak and it reaches a healthy state, with the actual healthcheck output quoted"
      - "the realm's discovery document is fetched successfully over HTTP from the configured issuer, quoted in the result -- proving the issuer is real and reachable, not merely written down"
      - "the realm defines all five roles from Letflow.Api.Authorization (PLATFORM_ADMIN, PROCESS_DESIGNER, PROCESS_OPERATOR, TASK_WORKER, AGENT_RUNNER), verified by reading them back from the running Keycloak rather than from the JSON file"
      - "the seeded operator account holds PROCESS_OPERATOR and NOT PLATFORM_ADMIN, asserted explicitly"
      - "a token obtained from the running Keycloak carries a flat top-level `roles` claim, demonstrated by decoding a real token and quoting the payload"
      - "Oidcc.ProviderConfiguration.Worker starts against the real issuer and reaches a ready state instead of retrying, evidenced from a running node"
      - "the Keycloak host port follows the repo's per-workspace .env pattern rather than being hardcoded"
      - "the chosen default host port is not 8081 and is not any port already mapped in R-Co's docker-compose.yml, verified by reading that file and quoting its ports: entries -- not by checking whether R-Co happens to be running"
      - "config/prod.exs is unchanged and the result states why"
    depends_on: []

  - id: REQ-129
    title: Prove the role set agrees across the matrix, the realm, and the SPA
    owner: TEST-DESIGNER
    status: pending
    stage: S4
    impl_order: 240  # letflow-queue task id; depends_on translated to queue task id [234]
    description: >
      decisions/0013-authorization-role-set.md settles WHAT the role set
      is. This requirement makes a future divergence fail loudly.
      Three sources name roles independently: Letflow.Api.Authorization's
      role/0 type, the realm file REQ-128 creates, and
      web/src/components/layout/AppShell.tsx's nav gating. Nothing
      connects them. A role removed from one is invisible at compile time
      in both Elixir and TypeScript and silent at runtime -- the role
      simply never appears in a token, the user sees a short nav, and no
      error is raised anywhere. That is exactly how R-Co ended up shipping
      a realm missing a role its backend referenced 48 times.
      Add a test that reads the realm file's role list and asserts it
      equals Letflow.Api.Authorization.roles/0. Add the SPA-side
      equivalent: a check that AppShell's Role union contains no role the
      matrix does not define. AGENT_RUNNER is expected to be in the matrix
      and the realm but NOT in the SPA's union -- it is a machine role for
      the deferred runtime-agent subsystem -- so the SPA check is
      one-directional (no unknown roles in the SPA) rather than an
      equality check, and that asymmetry must be stated in the test's own
      name or docstring so the next reader does not "fix" it into
      equality.
      Do not change the role set here. If the sources disagree when you
      wire this up, that is a finding to report, not a discrepancy to
      silently resolve in whichever direction makes the test green.
    acceptance_criteria:
      - "a test asserts the realm file's role list equals Letflow.Api.Authorization.roles/0 exactly, and fails if a role is added to either side alone -- demonstrated by temporarily removing one and quoting the failure"
      - "a frontend-side check asserts AppShell's Role union contains no role absent from the matrix, deliberately one-directional to allow AGENT_RUNNER"
      - "the AGENT_RUNNER asymmetry is explained in the test name or docstring, not left for a reader to infer"
      - "no role is added to or removed from any of the three sources by this requirement"
      - "the Elixir-side check runs under `mix test` in the default suite, and the SPA-side check runs under web/'s `npm run guards` script -- named explicitly because web/package.json carries several commands and the default `npm run test` excludes tests/guards/**, where tests/guards/source-scan.spec.ts already lives; neither check is a standalone script someone must remember to run"
    depends_on: [REQ-128]

  - id: REQ-130
    title: Design how per-route authorization generalizes to the nine unwired sub-routers
    owner: CODE-DESIGNER
    status: pending
    stage: S4
    impl_order: 243  # letflow-queue task id; depends_on translated to queue task ids [137, 140, 141]
    description: >
      Letflow.Api.Authorization (REQ-069, done) is a pure matrix that
      answers "is this action allowed" given an AccessContext and an
      endpoint_policy_key. It is already reachable, but only from ONE of
      the ten sub-routers.
      Current state, verified 2026-08-22 by grep over lib/letflow/routers/:
      lib/letflow/routers/identity.ex holds 7 references to
      Letflow.Api.Authorization and calls roles_from_strings/1,
      endpoint_policy_key/2 and evaluate_access/2 through a private
      helper, with_authorized_scope/4 (identity.ex:187-213), which wraps
      all 11 identity routes and converts a :Deny403 decision into
      Response.forbidden/2. That wiring shipped with REQ-073 (329c6f0)
      and REQ-074 (b2ef518), both done and both gated. The other NINE
      sub-routers -- audit.ex, definitions.ex, instances.ex, metrics.ex,
      onboarding.ex, promotion.ex, tasks.ex, tenant_config.ex and
      validation.ex -- contain ZERO references to Authorization. So the
      matrix is load-bearing for identity and inert everywhere else.
      This requirement designs how that pattern generalizes to the nine.
      It is not "make an unreachable module reachable"; that framing was
      wrong and cost a validation cycle.
      The central decision. The incumbent convention passes the path
      template as a LITERAL STRING CONSTANT at each call site, and
      with_authorized_scope/4's own in-code comment states the reason:
      "never derived from conn.request_path, so a handler's own policy
      key can never accidentally vary with the literal path matched."
      That property is what makes the incumbent safe, and it is why
      Plug's forward/2 rewriting conn.path_info is not a problem for it.
      Decide explicitly and with reasoning whether that convention
      SCALES to the remaining nine sub-routers as-is, or should be
      replaced by a plug that recovers the template some other way
      (a route table consulted before forwarding, Plug.Router private
      route metadata, per-sub-router scoped keys, or something else).
      Name the incumbent, weigh it, and pick one -- do not present the
      question as open. If the design picks a plug, this requirement's
      scope INCLUDES migrating the 11 existing identity call sites off
      with_authorized_scope/4 onto it, and the design must say so and
      say how, because leaving two authorization mechanisms in the same
      router tree is the outcome this requirement exists to prevent.
      Design for the no-matching-policy-key case, and state its real
      semantics rather than an idealised one. endpoint_policy_key/2 is a
      function-head-per-route dispatch whose final clause returns
      :Unknown, and evaluate_access/2 (lib/letflow/api/authorization.ex:
      257-262) branches on :Unknown FIRST: it returns Allow when the
      caller holds PLATFORM_ADMIN and Deny403 for everyone else. That is
      a deliberate port of R-Co's evaluateAccess and this requirement
      does not change it. So the guarantee is fail-closed-EXCEPT-ADMIN,
      not fail-closed. State it that way, and state the consequence: a
      route added without a policy key is unguarded for PLATFORM_ADMIN
      and denied to everyone else -- name the mechanism (a test, a
      compile-time check, a review rule) that makes such a route
      visible rather than silently accepted.
      INV-5 boundary: this answers "is this action allowed", never "does
      this resource exist". A cross-tenant lookup is REQ-072's 404, not
      a 403 -- Api.Authorization's own moduledoc is explicit that
      routing a cross-tenant lookup through it would let a prober
      distinguish "exists, not yours" from "never existed". The design
      must state the ordering that keeps that true.
      Design only. No implementation code.
    acceptance_criteria:
      - "a design artefact exists under lib/letflow/design/ that states the current state accurately: identity.ex authorized via with_authorized_scope/4 from REQ-073/REQ-074, and the nine unwired sub-routers named individually (audit, definitions, instances, metrics, onboarding, promotion, tasks, tenant_config, validation)"
      - "the design picks ONE mechanism for the nine -- extend the literal-string-per-call-site convention, or replace it with a plug -- names the incumbent convention and its stated safety property (the template is never derived from conn.request_path) in the reasoning, and does not leave the choice open as a list of options"
      - "if the design picks a plug, it explicitly owns migrating identity.ex's 11 existing with_authorized_scope/4 call sites onto it and says how; if it keeps the incumbent, it states why the convention scales to nine more sub-routers without a per-route reviewer catching each one -- noting that those nine are currently 12-line stubs with ZERO routes (their routes arrive with REQ-077..REQ-085, all pending), so the design reasons about the mechanism they will adopt, not about routes that exist today"
      - "the unmatched-(method, path) semantics are stated as fail-closed-except-PLATFORM_ADMIN, citing evaluate_access/2's :Unknown branch at lib/letflow/api/authorization.ex:257-262, not as unconditional fail-closed"
      - "the design names the mechanism that makes a route added without a policy key visible, given that such a route is allowed for PLATFORM_ADMIN rather than denied outright"
      - "the INV-5 ordering (cross-tenant resolves to 404 before a 403 can be returned) is stated explicitly"
      - "the design says how AllowWithRowFilter is surfaced to a route handler, without specifying any single route's implementation -- REQ-132 applies it"
      - "no implementation code appears in the artefact"
    depends_on: [REQ-070, REQ-073, REQ-074]

  - id: REQ-131
    title: Implement REQ-130's authorization mechanism and make it mandatory router-wide
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 248  # letflow-queue task id; depends_on translated to queue task id [243]
    description: >
      Build REQ-130's chosen mechanism and make it the single, mandatory
      authorization path for the whole router tree.
      READ THIS BEFORE SCOPING THE WORK: the nine sub-routers are EMPTY.
      Verified 2026-08-22 by direct count over lib/letflow/routers/ --
      audit.ex, definitions.ex, instances.ex, metrics.ex, onboarding.ex,
      promotion.ex, tasks.ex, tenant_config.ex and validation.ex are each
      a 12-line stub with ZERO routes: a @moduledoc, plug(:match),
      plug(:dispatch), and a single `match _` returning
      Letflow.Api.Response.not_found/1. Every request to them 404s today.
      Their routes arrive with REQ-077..REQ-085, all pending. Only
      identity.ex has routes -- 11 of them, across 639 lines, already
      authorized through with_authorized_scope/4 (identity.ex:187-213) by
      REQ-073 and REQ-074.
      So this requirement CANNOT prove authorization per sub-router:
      there is nothing there to authorize. Doing so would require waiting
      on eight route requirements and is far past one agent turn. What it
      delivers instead is the MECHANISM: implement REQ-130's pick, prove
      it end-to-end on the routes that exist (identity's 11), and make it
      available and MANDATORY for the nine -- so that when each route
      requirement lands, its routes cannot be added unauthorized.
      Per-sub-router proof is deferred to those route requirements as
      they land; it is deliberately NOT an acceptance criterion here.
      "Mandatory" must be a real enforcement artefact, not a convention
      in prose -- a test that fails when a route reachable through
      lib/letflow/routers/ has no policy key, or an equivalent
      compile-time or CI check. Whichever REQ-130 named, build that.
      If REQ-130's design replaced the literal-string-per-call-site
      convention with a plug, this requirement also migrates identity.ex's
      11 existing call sites onto it, per that design -- the router tree
      must end with exactly one authorization mechanism, not two.
      Deny403 responses go through REQ-066's Letflow.Api.Error /
      Letflow.Api.Response contract -- one error shape across the whole
      surface, Content-Type application/problem+json. Do not invent a
      403 body here.
      Security scope: this is a tenant-data path and needs
      SECURITY-REVIEWER. The specific things to gate on, beyond the
      generic checklist: roles arrive as attacker-influenced strings from
      token claims, so the conversion must stay
      Api.Authorization.roles_from_strings/1 -- an unrecognized string is
      dropped, never widened, and String.to_existing_atom/1 is NOT used
      (an unbounded-atom-creation vector the module's own moduledoc calls
      out).
      Do not modify Letflow.Api.Authorization. It is a done, ported,
      tested module and this requirement consumes it. In particular its
      :Unknown branch (lib/letflow/api/authorization.ex:257-262) allows
      PLATFORM_ADMIN and denies every other role -- a deliberate port of
      R-Co's evaluateAccess. Match that behaviour; do not "fix" it into
      an unconditional deny while wiring the caller. If the matrix turns
      out to be wrong, that is a separate finding routed through ORCH.
    acceptance_criteria:
      - "a request with a valid token but insufficient role receives 403 as an RFC 9457 problem document via Letflow.Api.Response, asserted on both body shape and Content-Type, exercised against a real identity.ex route"
      - "REQ-130's mechanism guards all 11 existing identity.ex routes: for each, a sufficient role passes through and an insufficient role is denied -- proven against those real routes, not a test-only endpoint, and the test names the route it exercised"
      - "the mechanism is wired into the nine currently-empty sub-routers (audit, definitions, instances, metrics, onboarding, promotion, tasks, tenant_config, validation) such that a route added to any of them is authorized WITHOUT that route's author adding the mechanism themselves; the result quotes, for one of the nine, the diff that makes this true and states which of REQ-077..REQ-085 will be the first to exercise it"
      - "an enforcement artefact exists that FAILS when a route reachable through lib/letflow/routers/ carries no policy key -- demonstrated by temporarily adding one unguarded route to a stub sub-router, quoting the actual failure output, and reverting it before the requirement completes"
      - "an unmatched (method, path) denies for every role EXCEPT PLATFORM_ADMIN, matching evaluate_access/2's ported :Unknown branch, with a test asserting both halves -- the non-admin denial and the admin allow"
      - "a token carrying an unrecognized role string is treated as holding no role, not as holding an unknown-but-accepted one"
      - "git diff shows lib/letflow/api/authorization.ex unchanged"
      - "the mechanism's position in the pipeline matches REQ-130's design, and a test demonstrates it runs after AuthPipeline has populated auth_context"
      - "exactly one authorization mechanism remains in lib/letflow/routers/: either with_authorized_scope/4 extended to all ten sub-routers, or the plug REQ-130 chose with identity.ex's 11 call sites migrated onto it -- confirmed by grep over lib/letflow/routers/ quoted in the result"
      - "no acceptance criterion here is satisfied by asserting behaviour against a route in one of the nine stubs, because none exists yet -- per-sub-router proof belongs to REQ-077..REQ-085 as each lands"
    depends_on: [REQ-130]

  - id: REQ-132
    title: Apply AllowWithRowFilter row scoping on the task read path
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 253  # letflow-queue task id; depends_on translated to queue task ids [248, 150]
    description: >
      Letflow.Api.Authorization returns three decision kinds, and REQ-131
      only makes two of them real (allow, Deny403). The third,
      AllowWithRowFilter, means "allowed, but restricted to the scope the
      matrix computed" -- a TASK_WORKER may list tasks, but not all of
      them. Apply it on the task read path (REQ-083's
      handleList/handleInbox). A decision that is returned and then
      ignored is worse than one that was never computed: it reads as
      enforced.
      Follow the decision's task_scope TUPLE, not an intuition about what
      "own rows" means. For :TasksList with a task-worker-only role,
      evaluate_access/2 returns kind: :AllowWithRowFilter with
      task_scope: {:own_user_and_groups, ctx.user_id} -- the scope is
      GROUPS-INCLUSIVE, covering tasks assigned to the caller AND tasks
      assigned to groups the caller belongs to. Narrowing it to
      assignee_id == user_id would be a silent behaviour change to a
      done, ported module's semantics, made in the caller. Implement
      exactly what the tuple says; the other kinds (:Allow with
      task_scope :all, and :Deny403) keep their existing meaning.
      The row scope MUST come from that task_scope tuple, whose user_id
      the matrix took from the AccessContext, and from nothing else. Api.Authorization's moduledoc states this is
      structural, not merely tested -- evaluate_access/2 takes no third
      parameter through which a request-supplied assignee_id filter could
      reach it. Preserve that: a caller passing ?assignee_id=<someone
      else> must not widen their own scope. That is the single most
      likely way to get this wrong, because the query parameter and the
      row filter want to feed the same Ecto where clause.
      Needs SECURITY-REVIEWER (INV-2).
    acceptance_criteria:
      - "a TASK_WORKER listing tasks receives exactly the rows the decision's {:own_user_and_groups, user_id} scope permits -- tasks assigned to them AND tasks assigned to a group they belong to -- and no others, asserted against seeded data containing a third user's task, a group task the caller is a member of, and a group task the caller is NOT a member of"
      - "a caller supplying an assignee_id query parameter naming a different user does NOT receive that user's rows -- an explicit test, since this is the intended attack"
      - "a role whose decision is a plain allow (not AllowWithRowFilter) still sees the unfiltered set, so the filter is not applied indiscriminately"
      - "the row scope is derived from the AccessDecision's task_scope tuple in code, whose user_id the matrix took from the AccessContext, verifiable by reading the query construction -- never from any request-supplied value"
      - "the tenant scoping from REQ-072 still applies underneath the row filter, proven by a test where the other user's tasks belong to another tenant"
    depends_on: [REQ-131, REQ-083]

  - id: REQ-133
    title: End-to-end login -- SPA through Keycloak to an authorized API call
    owner: FRONTEND-DEV
    status: pending
    stage: S4
    impl_order: 254  # letflow-queue task id; depends_on translated to queue task ids [234, 248]
    description: >
      Make a human able to log in. This is the requirement that proves
      the whole chain: SPA redirect -> Keycloak -> callback -> token ->
      authenticated request -> AuthPipeline -> authorization plug ->
      route -> rendered data.
      The SPA side already exists and is migrated: ProtectedRoute
      redirects to OIDC, OidcCallbackPage handles the return,
      web/src/api/client.ts holds the token in memory only (never
      localStorage, per FNFR-06 -- keep it that way). What is missing is
      pointing it at the realm REQ-128 creates, and the redirect
      URI / webOrigins entries that let the browser complete the flow.
      THIS REQUIREMENT IS THE SINGLE OWNER of the SPA's OIDC authority
      configuration. web/src/auth/OidcManager.ts and
      web/src/auth/tenantConfig.ts both default to
      http://localhost:8081/realms/bpm-default -- that is R-Co's nginx
      gateway port, not Letflow's Keycloak. Set those defaults to the
      issuer and host port REQ-128 actually chose (read it back from
      docker-compose.yml and config/dev.exs rather than assuming a
      port), and update web/.env.example in the same change so all
      three agree.
      REQ-117 (S8) previously also claimed this file set. It has been
      narrowed to its S8 remainder and now defers to this requirement
      for the authority defaults; do not treat REQ-117 as a prerequisite
      and do not wait for it. Ownership was consolidated here because
      REQ-128 -- the requirement that picks the port -- is S4, and an S4
      login proof cannot depend on an S8 requirement without inverting
      the migration's stage order.
      Verify by actually logging in as each of the seeded users and
      confirming the nav differs by role -- a PLATFORM_ADMIN sees admin
      entries, a TASK_WORKER does not. A green build proves nothing here.
      Describe the browser session: who you logged in as, what you
      clicked, what you saw.
      Expect routes to 404 or error where S4 is incomplete (REQ-073..085
      are pending). That is fine and expected. What must work is login,
      session, role-gated nav, and at least one real authenticated data
      fetch. Say explicitly which routes worked and which did not rather
      than reporting a blanket success.
    acceptance_criteria:
      - "a real browser login as the seeded PLATFORM_ADMIN completes the full OIDC redirect/callback flow and lands on an authenticated view, described as an actual session"
      - "a real browser login as the seeded TASK_WORKER shows a demonstrably narrower nav than the admin, with both navs listed"
      - "at least one authenticated API call returns real data from Letflow, with the request and response quoted"
      - "an authenticated call to a route the caller's role does not permit returns REQ-131's 403 problem document, observed from the browser rather than from a unit test"
      - "no token is written to localStorage or sessionStorage, confirmed by inspecting browser storage after login"
      - "web/src/auth/OidcManager.ts, web/src/auth/tenantConfig.ts and web/.env.example all name the same authority, and that authority equals the issuer REQ-128 configured -- shown by quoting the value from each of the three files alongside the issuer line in config/dev.exs"
      - "the frontend gates that exist today pass, with the real output of each quoted: `npm run type-check`, `npm run lint` and `npm run test` run from web/. Do NOT use `npm run check` -- that script does not exist in web/package.json and is created by REQ-115, which is S8; depending on it from this S4 requirement would invert the migration stage order, which is exactly the defect this wording replaces"
      - "the result lists which routes worked and which 404'd due to pending S4 work, rather than claiming blanket success"
    depends_on: [REQ-128, REQ-131]

  - id: REQ-134
    title: Exercise a real Keycloak-issued token in the test suite
    owner: TEST-DESIGNER
    status: pending
    stage: S4
    impl_order: 255  # letflow-queue task id; depends_on translated to queue task ids [234, 248]
    description: >
      config/test.exs sets token_verifier: Letflow.Oidc.TokenVerifierDouble,
      so the entire suite passes with no identity provider running. That
      was correct while none existed. Its consequence is that no test in
      this repository has ever exercised a real token, which is why a
      placeholder issuer and an unmountable authorization matrix both
      survived to 2026-08-22 without a single failure.
      Add an integration path that obtains a real token from the running
      Keycloak (direct-access grant against the seeded users) and drives
      it through AuthPipeline for real: signature verification against
      the live JWKS, issuer/realm resolution, claim mapping, JIT
      provisioning, and the authorization plug.
      Keep TokenVerifierDouble as the default for the unit suite. Do NOT
      make the whole suite depend on a running Keycloak -- that would
      trade a blind spot for a flaky, infrastructure-coupled suite, and
      this project already runs partitioned parallel test processes
      (scripts/test_parallel.sh) that a shared external service would
      serialize. The real-token path should be a tagged/excluded-by-
      default set that a human or CI can run deliberately, with a clear
      skip message naming what has to be running -- follow the pattern
      web/tests/e2e/onboarding/ already uses ("Ensure docker-compose
      services are running").
      State in the result how a developer runs it, and confirm that
      mix test with Keycloak stopped still passes.
    acceptance_criteria:
      - "a test obtains a genuine token from the running Keycloak and drives it through Letflow.Plugs.AuthPipeline end to end, with the real assertion output quoted"
      - "the token's signature is verified against the live JWKS via the real verifier, not TokenVerifierDouble -- demonstrated by the test failing if pointed at a tampered token"
      - "JIT provisioning creates a real user row on first authentication and reuses it on the second, asserted across two calls"
      - "the default mix test run still passes with Keycloak stopped, quoted as evidence"
      - "the real-token tests skip with a message naming exactly what must be running, rather than failing obscurely"
      - "the result states the exact command a developer runs to execute them"
    depends_on: [REQ-128, REQ-131]

  - id: REQ-135
    title: Survey R-Co's Keycloak provider adapter and fix the port boundary
    owner: CODE-DESIGNER
    status: pending
    stage: S4
    impl_order: 244  # letflow-queue task id; depends_on translated to queue task id [234]
    description: >
      Letflow is multi-tenant and binds each tenant to an identity realm:
      tenants.idp_realm_id, with a real unique partial index, and
      Letflow.Identity.resolve_tenant_by_realm/1 driving tenant resolution
      from a token's issuer. Nothing creates a realm. Letflow.
      TenantProvisioning provisions database SCHEMAS only, and its own
      moduledoc is explicit that onboarding orchestration is not built
      there. So today a tenant can exist in the database with an
      idp_realm_id pointing at a realm that has never been created, and
      no code path would notice until a login failed.
      Before anyone can design the fix, someone has to read the prior art
      and decide what of it survives the port. That reading is this
      requirement, and it is deliberately split from the design (REQ-137)
      because it does not fit one turn alongside it: R-Co's
      src/identity/provider/ is 4,193 lines across 14 files, with
      provider.zig alone at 1,626, bootstrap.zig at 573 and manager.zig at
      169, plus a jwks_cache, a standards_verifier, and a stub adapter used
      for testing.
      Produce a port-boundary finding: for EACH of the 14 files, a verdict
      of PORT or DROP, its R-Co line count, and the reason. DROP is
      expected to be the common verdict and must be justified concretely --
      Letflow uses the oidcc library where R-Co hand-rolled verification
      and JWKS caching, so those files are likely already covered. Do not
      assume the whole adapter ports.
      Also decide, with reasoning, whether R-Co's interface/adapter split
      (keycloak + stub) is worth preserving in Letflow, given that REQ-128
      gives the test suite a real Keycloak to run against and
      config/test.exs already carries a TokenVerifierDouble seam.
      Finding only. No design of the provisioning flow itself and no
      implementation code -- REQ-137 owns both, and folding them in here is
      what made the original single requirement unsizable.
    acceptance_criteria:
      - "a finding artefact exists under lib/letflow/design/ containing a table with one row per file in R-Co's src/identity/provider/ -- 14 rows -- each carrying the file's R-Co line count, a PORT or DROP verdict, and a one-sentence reason; a blanket per-directory judgement does not satisfy this"
      - "the row line counts sum to the total the quoted command reports, and the result states whether that total still equals the 4,193 this requirement was drafted against; the result quotes the command used to obtain the counts from R-Co's tree so the total is measured rather than copied from this requirement's text. A drift from 4,193 is a finding to report, not a failure of this criterion"
      - "every DROP verdict names the Letflow facility that already covers it (oidcc, a Letflow.Oidc.* module, REQ-128's realm file) or states an explicit reason it is not needed -- a bare 'not needed' fails this criterion"
      - "the finding states an expected total ported size in lines for the PORT rows as a single number, not a range and not an open estimate"
      - "the interface/adapter (keycloak + stub) question is answered with one decision and its reasoning, not listed as an open option"
      - "no design of the realm-creation flow, no partial-failure design, and no implementation code appear in the artefact -- those are REQ-137"
    depends_on: [REQ-128]

  - id: REQ-136
    title: Introduce GitHub Actions CI running the backend gate
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 245  # letflow-queue task id
    description: >
      This repository has no .github/workflows/ directory at all. Nothing
      runs on push or on a pull request, which is why
      docs/agents/protocols/GIT_MERGE.md still carries a precondition
      saying no CI exists and why agents merge on locally-quoted output
      alone.
      No existing requirement closes this. S0's REQ-013 is done, and what
      it delivered was a LOCAL single-command gate -- `mix letflow.check`
      running format-check, compile-with-warnings-as-errors and test. It
      never covered CI-as-a-service, and being done it does not reopen.
      SCOPE: the BACKEND job only. `mix letflow.check` exists today, so
      this requirement depends on nothing pending and can land
      immediately. The frontend job is REQ-138, which waits on REQ-115's
      `npm run check`. They are split deliberately: a repository with no
      CI at all gains more from the backend gate landing now than from
      both landing together, and pairing them would have parked the
      repository's only automated gate behind an S8 requirement.
      STAGE TAG: S4, per docs/migration/decisions/0008-cross-cutting-
      tooling-stage-and-doc-ownership.md Question 1, confirmed Option A
      -- cross-cutting tooling is tagged with whichever stage is active
      at draft time (S4 as of 2026-08-22), exactly as REQ-113 and
      REQ-114 are. Option C (tag with the downstream stage the tooling
      unblocks) was considered and REJECTED in that record as too vague
      for a requirement serving every future WF-02/03/04 run rather than
      one stage, which is precisely this requirement. Do not re-tag this
      S8 without a REVIEWER sign-off amending 0008.
      Add .github/workflows/ci.yml with a backend job running `mix
      letflow.check` against a postgres service whose image matches
      docker-compose.yml, triggered on push and on pull_request. Do not
      invent new check commands here -- CI invokes the one that already
      exists; if the gate is missing a step, that is a change to
      REQ-013's command and is filed as its own finding. Structure the
      workflow so REQ-138 adds its frontend job alongside rather than
      rewriting the file.
      The GIT_MERGE.md edit is REQ-138's sibling requirement's concern
      only insofar as it must stay accurate; it is owned HERE and by
      DOC-UPDATER, not by ELIXIR-DEV -- see the ownership note in
      REQ-139.
    acceptance_criteria:
      - ".github/workflows/ci.yml exists and declares a backend job invoking `mix letflow.check`, triggered on both push and pull_request"
      - "an actual CI run on this branch is quoted -- the run id and every job's conclusion from `gh run view <run-id> --json jobs` -- rather than a claim that the workflow is correct"
      - "the backend job's postgres service image matches the one in docker-compose.yml, verified by quoting both lines side by side"
      - "a deliberately introduced single formatting violation is shown to turn the backend job red, with the CI log line proving it quoted, and the violation is reverted before the requirement completes"
      - "no check command is newly invented -- git diff shows mix.exs's letflow.check alias unchanged, and web/package.json unchanged entirely"
      - "the workflow file is structured so a second job can be appended by REQ-138 without restructuring the existing job, stated in the result"
    depends_on: []

  - id: REQ-137
    title: Design per-tenant realm provisioning and its partial-failure path, and size the port
    owner: CODE-DESIGNER
    status: pending
    stage: S4
    impl_order: 249  # letflow-queue task id; depends_on translated to queue task id [244]
    description: >
      REQ-135 established WHAT of R-Co's src/identity/provider/ ports and
      what is dropped. This requirement designs the thing itself: how a
      realm gets created for a tenant, and what happens when half of it
      succeeds.
      Establish how realm creation composes with Letflow.
      TenantProvisioning's schema provisioning and with REQ-076's
      onboarding routes without either implicitly chaining the other --
      REQ-022's "No implicit chaining invariant" is deliberate and must not
      be quietly dropped.
      The partial-failure path is the substance, and a design that omits it
      has not designed the hard half. This is a distributed transaction
      across Postgres and Keycloak. R-Co handled it with compensating
      deletes plus a realm-existence guard on replay (onboarding.zig's
      realm_guard). Say what Letflow does, in both directions: realm
      created then schema provisioning fails, and schema provisioned then
      realm creation fails, plus what a retry of each does.
      Deliver a design plus a SIZED implementation plan. The implementation
      is its own batch; folding it into REQ-076's onboarding routes would
      hide a multi-thousand-line subsystem inside a route requirement.
      REQ-076 (identity routes 4/4 -- tokens/roles plus onboarding, still
      pending) is the requirement whose boundary this design CONSTRAINS.
      It is deliberately NOT a depends_on: both REQ-076-facing criteria
      below are design-time boundary statements -- how realm provisioning
      composes with TenantProvisioning, and what REQ-076 may call versus
      must not absorb -- and neither needs REQ-076's code to exist. The
      second is BETTER written before REQ-076 lands, since its whole
      purpose is to bound what REQ-076 is allowed to absorb; making this
      design wait on the implementation it constrains would invert the
      ordering, and REQ-135's own text says the implementation "is its
      own batch," which only holds if the design precedes it.
      Design only. No implementation code.
    acceptance_criteria:
      - "a design artefact exists under lib/letflow/design/ covering realm creation for a tenant, built on REQ-135's PORT/DROP table and citing that artefact by path rather than re-deriving it"
      - "the partial-failure path is designed explicitly in both directions -- realm created then schema provisioning fails, and schema provisioned then realm creation fails -- each naming its compensating action and what a retry of that same operation does"
      - "the design states how realm provisioning composes with TenantProvisioning without violating REQ-022's no-implicit-chaining invariant, naming which component calls which"
      - "the implementation plan is a numbered list of follow-on requirements where EACH entry states (i) an expected implementation size in lines as a single number, (ii) the named R-Co source files it ports or the named Letflow modules it adds or changes, and (iii) that it is sized to one agent turn -- an entry missing any of the three fails this criterion"
      - "the relationship to REQ-076 (onboarding routes) is stated -- what REQ-076 calls, and what it must not absorb"
      - "no implementation code appears in the artefact"
    depends_on: [REQ-135]

