  - id: REQ-036
    title: Promotion plan computation, conflict preflight, and plan digest (promotion_plan.zig PRM-01 + promotion_conflict.zig PRM-02 + promotion_digest.zig PRM-03)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 50  # letflow-queue task id
    description: >
      Port three tightly-coupled, read-only computation modules as one
      requirement (they share the same PlanEntry/PromotionPlan types and are
      consumed together by REQ-037's review insert), operating on REQ-027's
      process_definitions table. NOTE: this requirement is domain logic
      only -- the HTTP endpoint (POST /api/v1/promotions and friends) that
      will eventually call this logic is S4 (api-surface) scope, not built
      here; the functions below are Elixir context-module functions, not
      Plug route handlers.
      - compute_promotion_plan/5 (src/definition/promotion_plan.zig, PRM-01,
      per src/design/prm-01-promotion-plan-and-diff-report.md): given
      (actor_id, source_tenant_id, target_tenant_id, process_key), diffs the
      source's ACTIVE definition against the target's ACTIVE definition (or
      the empty set, if the target has none -- every entry then forced to
      change_kind: added) across 5 dimensions -- graph nodes/edges (by id:
      added/modified/removed), variable_schema, service-catalog bindings (a
      raw service_id string-value diff on SERVICE_TASK nodes, NOT a catalog
      version lookup -- prm-01's Scoping note explains why this doesn't need
      REPO-07/PLC-01 to exist), module_ref VALUES (a raw string diff on
      SUB_PROCESS nodes, same non-resolving treatment, flagged as Open
      question 2 in prm-01 itself for a future PRM-02 revisit if resolved
      module identity later turns out to be required) -- producing one
      PlanEntry per changed unit: {type, id, change_kind
      (added|modified|removed), before, after}. Returns an explicit
      forbidden error if the caller lacks a promotion.submit-equivalent
      permission (port the check SHAPE from src/definition/promotion.zig's
      existing role-check pattern, since Letflow doesn't have a permission
      system beyond REQ-020's role registry yet -- flag explicitly if
      promotion.submit doesn't map cleanly onto REQ-020's TenantRole model,
      rather than silently inventing a new permission mechanism), an
      explicit invalid-promotion-source error if source_tenant_id is itself
      a production tenant (not a test tenant), and an explicit empty-plan
      error (not a PromotionPlan with 0 entries) if every dimension produces
      zero entries after canonicalization.
      - reject_if_conflicts/4 (src/definition/promotion_conflict.zig, PRM-02,
      per src/design/prm-02-conflict-preflight-rejection.md): reads the
      target tenant's active version of process_key with NO lock (a plain
      read, no FOR UPDATE); conflict = target_active_version > base_version.
      On conflict, returns a rejection detail (naming each conflicting
      definition, per prm-02's Open question 2: support multiple process_key
      conflicts as a list, not just one) -- this requirement does NOT append
      an event on conflict (event-store event-type registration for
      DEFINITION_PROMOTION_REJECTED is left for whichever later requirement
      wires this into the real event store call site, since REQ-024/025
      exist but this function's own design doc leaves the exact event
      schema as an open question per prm-02's Open question 1 -- flag,
      don't silently invent the event payload shape).
      - compute_plan_digest/1 and verify_digest/2
      (src/definition/promotion_digest.zig, PRM-03, per
      src/design/prm-03-plan-digest.md): SHA-256 over the CANONICAL JSON
      serialization of a PromotionPlan's entries (object keys sorted
      lexicographically at every level, no insignificant whitespace, null
      values included not omitted), returned as a 64-char lowercase hex
      string. verify_digest/2 is a constant-time comparison (note
      explicitly: Elixir's :crypto.hash_equals/2 or an equivalent
      constant-time compare, not a bare ==, matching prm-03's own "avoid
      timing attacks" note). CRITICAL: Elixir's default JSON encoders do not
      guarantee sorted keys the way this needs -- the canonicalization step
      must explicitly sort keys before encoding (prm-03's Open question 2
      flags this exact pitfall for Zig's std.json.stringify; the Elixir
      equivalent risk is the same for Jason/JSON encoders that preserve map
      insertion order).
    acceptance_criteria:
      - "compute_promotion_plan/5 against a target tenant with no existing version of process_key marks every produced entry change_kind: added"
      - "compute_promotion_plan/5 against byte-identical source and target definitions returns the empty-plan error, not a PromotionPlan with an empty entries list"
      - "compute_promotion_plan/5 against a source_tenant_id that is itself a production tenant returns the invalid-promotion-source error before reading any process_definitions row"
      - "reject_if_conflicts/4 with target_active_version > base_version returns a rejection detail naming the conflicting definition; with target_active_version <= base_version (including the target having zero rows) returns no conflict"
      - "compute_plan_digest/1 called twice on plans with identical content but differently-ordered map keys produces the identical digest, demonstrated by an explicit test constructing the same entries in two different key orders"
      - "verify_digest/2 uses a constant-time comparison, not Kernel.==/2 or :erlang.=:=/2 directly on the two strings, and this choice is stated in the moduledoc"
    depends_on: [REQ-027, REQ-028]

  - id: REQ-037
    title: Promotion review state machine and base promote (promotion_review.zig PRM-04 + promotion.zig ENV-03)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 54  # letflow-queue task id
    description: >
      Port the promotion_reviews state-machine transition functions
      (src/definition/promotion_review.zig, PRM-04, per
      src/design/prm-04-promotion-review-state-machine.md's "Public
      interface"/"State machine diagram" sections) operating on REQ-035's
      promotion_reviews table, plus src/definition/promotion.zig's
      underlying promoteDefinition() (ENV-03) which the apply transition
      wraps (per prm-batch1's "Files NOT to change" table: "promoteDefinition()
      unchanged; apply pipeline wraps it" -- port promoteDefinition() itself
      here since nothing in this S2 batch has ported it yet, then have the
      apply transition call it):
      - insert_review/1: creates a pending_review row from REQ-036's
      PromotionPlan + digest (serialised_plan, plan_digest, requested_by,
      row_version: 1); the partial unique index (REQ-035) rejects a
      duplicate (tenant_id, plan_digest) while one is still
      pending_review/approved -- surface this as a distinct duplicate-review
      error.
      - approve_review/4 (review_id, actor_id, plan_digest, ...):
      pending_review -> approved. Gates (per prm-05's
      non-skippable-approval-gate design, read alongside prm-04 since PRM-05
      enforces these same gates): reviewer != requested_by (self-approval
      forbidden), status == pending_review, plan_digest matches the stored
      value exactly. Every UPDATE includes WHERE row_version = $expected --
      zero rows affected means the transition failed (invalid-transition
      error), not a silent no-op.
      - reject_review/2: pending_review -> rejected. No digest check, no
      self-rejection restriction (prm-05: "Reject does NOT have the same
      restriction" as approve).
      - mark_review_applied/1, mark_review_failed/1: approved -> applied /
      approved -> failed (driven by REQ-040's assertion re-run outcome,
      called from there, not invoked directly by an HTTP layer in this
      batch).
      - supersede_review/2: applied|failed|rejected -> superseded (the 3
      supersession edges named in prm-04's permitted-edges table, including
      the "NEW" rejected->superseded edge prm-04 explicitly adds to fix a
      prior BLOCKER-vs-RELEASED conflict -- port this edge, don't silently
      drop it as if rejected were terminal).
      - promote_definition/N (src/definition/promotion.zig, ENV-03): the
      underlying version-pointer-move + event-append operation
      mark_review_applied's caller invokes; port its existing role-check
      pattern (reused by REQ-036's compute_promotion_plan/5, cited above)
      and its tenant-type check (reused by REQ-036 as the
      invalid-promotion-source check).
      Exactly 7 permitted state edges total (prm-04's table) -- no other
      transition is reachable; every non-edge attempt returns the same
      invalid-transition error regardless of which specific illegal edge was
      attempted.
    acceptance_criteria:
      - "insert_review/1 followed by a second insert_review/1 with the identical (tenant_id, plan_digest) while the first is still pending_review returns the duplicate-review error, not a second row"
      - "approve_review/4 called by the same principal recorded as requested_by is rejected with a self-approval error before any row is updated"
      - "approve_review/4 with a plan_digest not matching the stored value is rejected with a digest-mismatch error, distinct from the self-approval and invalid-transition errors"
      - "two concurrent approve_review/4 calls on the same review_id: exactly one succeeds (row_version optimistic-lock check), the other gets the invalid-transition error from the zero-rows-affected WHERE row_version = $expected clause"
      - "a rejected review can be transitioned to superseded via supersede_review/2 (the NEW edge prm-04 adds), demonstrated explicitly, not left untested as if rejected were terminal"
      - "every one of the 7 permitted edges in prm-04's table has an explicit passing test, and at least 2 non-edges (e.g. rejected -> approved, pending_review -> applied) have explicit rejecting tests"
    depends_on: [REQ-035, REQ-036]

  - id: REQ-038
    title: Promotion rollback (rollback.zig, PRM-08)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 55  # letflow-queue task id
    description: >
      Port src/definition/rollback.zig's rollbackDefinitionVersion() (per
      prm-batch1's "PRM-08 design" section) as
      Letflow.Definitions.rollback_definition_version/4, operating on
      REQ-027's process_definitions and REQ-035/037's promotion_reviews
      tables:
      - Permission guard: caller must hold a platform.admin-equivalent
      permission (port the check SHAPE, same open-question note as REQ-036
      about mapping onto REQ-020's role registry if it doesn't fit cleanly
      -- flag rather than invent a new permission model silently).
      - Single serializable transaction: lock process_definitions rows for
      the process_key (FOR UPDATE); identify the current ACTIVE row and the
      target row (status must be ACTIVE or SUPERSEDED -- prm-batch1's "Why
      status IN ('ACTIVE','SUPERSEDED') proves prior activation" reasoning:
      SUPERSEDED necessarily passed through ACTIVE at some prior point, no
      separate history table needed). Guard cases: process_key not found at
      all (not-found error); target_version not in {ACTIVE, SUPERSEDED} for
      this process_key (version-never-active error); target_version equals
      the current ACTIVE version (already-active error, nothing to do).
      - Version pointer swap: current ACTIVE -> SUPERSEDED, target row ->
      ACTIVE, both in the same transaction.
      - Append a DEFINITION_VERSION_ROLLED_BACK event via REQ-025's append
      (payload: process_key, from_version, to_version, actor_id) -- capture
      the resulting event_id.
      - Update any promotion_reviews row for the now-former-active
      definition whose status is applied or approved to superseded, with
      superseded_by set to the rollback's event_id (zero matching rows is
      acceptable, not an error).
      Returns definition_id (of the now-active version), version,
      rolled_back_from_version, superseded_review_id (nullable), event_id.
    acceptance_criteria:
      - "rolling back to a version with status SUPERSEDED (that was previously ACTIVE) succeeds and flips the pointer: the target becomes ACTIVE and the former ACTIVE becomes SUPERSEDED"
      - "rolling back to a version whose status has never been ACTIVE or SUPERSEDED for this process_key returns the version-never-active error, no rows changed"
      - "rolling back to the currently-ACTIVE version returns the already-active error, no rows changed, no event appended"
      - "a successful rollback appends exactly one DEFINITION_VERSION_ROLLED_BACK event and updates any applied/approved promotion_reviews row for the former-active definition to superseded"
      - "a caller lacking the platform.admin-equivalent permission is rejected before any row is read or locked"
    depends_on: [REQ-030, REQ-037]

  - id: REQ-039
    title: Sandbox pool and fixture loader (sandbox_pool.zig + fixture_loader.zig, PRM-06 section 3)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 42  # letflow-queue task id
    description: >
      Port src/definition/sandbox_pool.zig's SandboxPool (claim/release,
      on-demand Postgres-schema provisioning) and
      src/definition/fixture_loader.zig's loadFixturesOnly (per
      prm-batch1's "PRM-06 design" sections 1/3), reusing REQ-022's CREATE
      SCHEMA/DROP SCHEMA provisioning primitive:
      - claim/1 (max_wait_ms): provisions a fresh ephemeral Postgres schema
      (CREATE SCHEMA), enforcing a configurable max_concurrent_sandboxes
      quota; returns SandboxUnavailable if no slot frees within the wait
      window (60s per prm-batch1 PRM-06 AC5). Records every active claim so
      a later release/reaper pass can find it.
      - release/1: drops the schema (DROP SCHEMA CASCADE) and removes the
      active-claim record.
      - load_fixtures_only/3 (sandbox_schema, fixtures): validates each
      fixture's target table name against a hardcoded allowlist BEFORE
      issuing any SQL (prm-batch1: "This is the SQL-injection boundary -- no
      string interpolation on table names reaches the DB" -- an unlisted
      table name returns InvalidTableName, never reaches a query); TRUNCATEs
      each distinct target table (schema-qualified) before inserting;
      inserts rows via a parameterized jsonb_populate_record-equivalent
      pattern, never string-interpolating the row content.
      OPEN QUESTION -- flagged explicitly per this stage's own
      "process-per-instance vs row-based state" finding
      (docs/migration/stage-2-event-store-definitions.md's Early findings
      section): sandbox_pool.zig's own header states "The pool records
      every active claim in a process-local table" -- in-memory claim
      tracking plus a hard concurrency quota (max_concurrent_sandboxes) is
      exactly the kind of state stage-2-event-store-definitions.md flags as
      "plausibly needing a supervised process" rather than a plain Ecto row
      (no expensive-to-reconstruct state here, but the in-memory claim
      tracking + quota-enforcement shape leans toward a GenServer or
      DynamicSupervisor-backed pool rather than a bare DB table or a
      stateless module). Do NOT silently assume either a
      GenServer/DynamicSupervisor design or a plain-row design here -- this
      requirement ports the claim/release/load_fixtures_only CONTRACT
      (function signatures + behavior), and leaves the concrete
      process-vs-row implementation choice as an explicit open question for
      CODE-DESIGNER to resolve at WF-02 design time, citing this note.
    acceptance_criteria:
      - "claim/1 against an empty pool immediately succeeds and returns a sandbox_id + schema_name for a real, freshly-created Postgres schema"
      - "claim/1 when max_concurrent_sandboxes slots are all in use blocks until either a slot frees or the wait window elapses, returning SandboxUnavailable in the latter case"
      - "release/1 on a claimed sandbox drops its schema (verified: the schema no longer appears in information_schema.schemata after release) and frees its quota slot for a subsequent claim/1"
      - "load_fixtures_only/3 with a table_name not in the allowlist returns InvalidTableName without issuing any SQL against that table name"
      - "load_fixtures_only/3 loading the same fixtures twice against the same sandbox_schema (simulating a retry) leaves the same final row set both times, via the TRUNCATE-before-insert step"
      - "the moduledoc names the process-per-instance-vs-row-based-state open question explicitly and states it is left for CODE-DESIGNER, per this requirement's description and stage-2-event-store-definitions.md's Early findings"
    depends_on: [REQ-022]

  - id: REQ-040
    title: Promotion assertion re-run orchestration (assertion_rerun.zig, PRM-06/07 + promotion_assertion_runs schema)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 56  # letflow-queue task id
    description: >
      Port src/definition/assertion_rerun.zig's applyPromotionAssertionRerun()
      (per prm-batch1's "PRM-06 design" section 2 and "PRM-07 design"
      sections in full) as
      Letflow.Definitions.apply_promotion_assertion_rerun/6, plus the
      promotion_assertion_runs migration (prm-batch1's "1.
      promotion_assertion_runs table schema" -- schema-per-tenant, per
      REQ-022, with an FK to REQ-035/037's promotion_reviews). Depends on
      REQ-039's SandboxPool + fixture loader.
      - Idempotency: compute key = "promotion_rerun:<review_id>:<plan_digest>";
      INSERT ... ON CONFLICT (tenant_id, idempotency_key) DO NOTHING; on
      conflict, return the cached row's outcome (AlreadyRecorded-equivalent)
      without claiming a new sandbox.
      - On a fresh insert: claim a sandbox (REQ-039), load ONLY the
      artifact's fixtures[] into it (REQ-039's load_fixtures_only, never
      organic tenant data), replay the artifact's assertions under a frozen
      clock (derived from the upper 32 bits of rng_seed per prm-batch1's
      FrozenClockProvider note -- flagged there as Open question 1, an
      artifact could later carry an explicit frozen_clock_ms field instead;
      keep the injection interface stable regardless) and a seeded RNG
      (wraps the RNG with rng_seed), stripping non_deterministic_fields
      dot-paths from both expected/actual results before byte-level
      comparison.
      - Record the outcome (passed/failed/teardown_failed,
      assertions_passed/failed counts, failing_assertion_ids) in
      promotion_assertion_runs.
      - The apply pipeline (REQ-037's mark_review_applied path) evaluates
      assertions_failed == 0 to decide whether to proceed, NOT status ==
      "passed" -- a teardown_failed row with assertions_failed == 0 is a
      green gate per prm-batch1's explicit note; state this distinction
      explicitly in the moduledoc since it's easy to get backwards.
      OPEN QUESTION -- flagged explicitly (this is the second of the two
      files stage-2-event-store-definitions.md's Early findings section
      names as most likely to need a supervised process rather than a plain
      row): sandbox teardown must run on EVERY exit path -- normal
      completion, assertion failure, infrastructure failure, AND
      panic/crash (assertion_rerun.zig's own header: "Teardown ... runs
      through a single defer so it covers every exit path ... including
      panic unwind"). Elixir has no direct defer-on-panic equivalent the
      way Zig does; the closest idiomatic mechanisms are try/after (covers
      normal and raised-exception exits, not a hard process kill) or a
      supervised process whose terminate/2 callback fires on more exit
      conditions including certain crashes. Do NOT silently assume
      try/after is sufficient, and do NOT silently assume a GenServer is
      required -- this requirement ports the guaranteed-teardown CONTRACT (a
      teardown failure records PROMOTION_ASSERTION_TEARDOWN_FAILED and sets
      status = teardown_failed, but never converts a passing run into a
      failure) and leaves the concrete crash-safety mechanism as an
      explicit open question for CODE-DESIGNER, same as REQ-039's note.
    acceptance_criteria:
      - "calling apply_promotion_assertion_rerun/6 twice with the same (review_id, plan_digest) returns the cached outcome on the second call and claims no second sandbox, verified by sandbox claim count"
      - "a sandbox loaded via REQ-039 receives ONLY the artifact's fixtures[] rows, demonstrated by confirming no pre-existing tenant data appears in the sandbox schema"
      - "an assertion replay that fails records status = failed with a non-empty failing_assertion_ids list; a passing replay whose teardown itself fails records status = teardown_failed with assertions_failed = 0 -- both distinct outcomes tested explicitly"
      - "the moduledoc explicitly states the apply pipeline gate condition is assertions_failed == 0, not status == passed, citing the teardown_failed green-gate case"
      - "a simulated teardown failure appends a PROMOTION_ASSERTION_TEARDOWN_FAILED event via REQ-025's append and does not change a passing run's outcome from green to failed"
      - "the moduledoc names the crash-safety/guaranteed-teardown open question explicitly, per this requirement's description and stage-2-event-store-definitions.md's Early findings"
    depends_on: [REQ-039, REQ-037]

  - id: REQ-041
    title: Solution-pack update three-way diff (pack_update.zig, PRM-09)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 43  # letflow-queue task id
    description: >
      Port src/definition/pack_update.zig's computePackUpdatePlan() (per
      prm-batch1's "PRM-09 design" section) as
      Letflow.Definitions.compute_pack_update_plan/5, plus its three
      migration tables (prm-batch1's "4. solution_pack_* table schemas" --
      solution_pack_installs, solution_pack_artefact_bases,
      pack_update_resolutions; PRM-09's own migration creates all three
      itself, so this does NOT depend on the separate SOL-01/02/03
      solution-pack export/install module (src/solution/, a different
      directory not among this stage's 16 src/definition/ files -- SOL-01/02/03
      isn't scoped to any stage yet; note explicitly that this requirement's
      tables have no real installs to compare against until whichever
      future requirement builds SOL-01/02/03's install path, but the diff
      algorithm itself is fully testable today via directly-inserted
      fixture rows). Unlike every other table this S2 batch adds,
      prm-batch1 explicitly classifies these three tables as GLOBAL
      (public/default schema, no :prefix) -- "install records are
      cross-tenant infrastructure" -- so this requirement does NOT use
      REQ-022's schema-per-tenant mechanism; since both these tables and
      REQ-015's tenants table live in the same public/default schema, a
      real DB-level FK from solution_pack_installs.tenant_id to tenants.id
      (matching R-Co's own `REFERENCES tenant(id)`) is possible here, unlike
      the deliberate no-cross-schema-FK omission this batch's other
      per-tenant tables use.
      - Classification algorithm (byte-level canonical-JSON comparison,
      same normalization as REQ-036's plan digest): for each artefact,
      compare base (installed-at-Vb content, from
      solution_pack_artefact_bases), theirs (current tenant content), and
      incoming (offered Vn content) -- unchanged (all three match),
      clean_update (base==theirs, base!=incoming), local_only
      (base==incoming, base!=theirs), or conflict (both sides changed, OR
      base is NULL/no install record -- prm-batch1 PRM-09 AC5: "cannot
      prove no modification" is itself a conflict case, not an error).
      - has_unresolved_conflicts on the returned plan is true iff any
      conflict-classified artefact lacks a resolution; a plan with
      unresolved conflicts is rejected at apply time (a later requirement's
      job to enforce -- this requirement computes and exposes the flag).
      OPEN QUESTION (flag, do not silently resolve): neither 0003 nor any
      other Letflow decision record states a general rule for when a table
      gets this GLOBAL exception versus Decision B's schema-per-tenant
      default (the same kind of R-Co-internal GLOBAL classification
      service_catalog carries, per svc-01-04-service-scope.md: "service_catalog
      is a public-schema routing/registry table (TNT-01 confirmed)"). This
      requirement follows prm-batch1's stated classification for these
      three tables specifically, but flags the underlying general question
      as unresolved and worth a REVIEWER/decision-record follow-up rather
      than something each future requirement re-derives ad hoc.
    acceptance_criteria:
      - "priv/repo/migrations gains solution_pack_installs, solution_pack_artefact_bases, and pack_update_resolutions migrations in the public/default schema (not :prefix-scoped), applying cleanly"
      - "compute_pack_update_plan/5 against an artefact with no matching solution_pack_artefact_bases row classifies it as conflict, not unchanged or an error, per PRM-09 AC5"
      - "compute_pack_update_plan/5 against base==theirs!=incoming classifies clean_update; base==incoming!=theirs classifies local_only; base==theirs==incoming classifies unchanged -- each with an explicit test"
      - "has_unresolved_conflicts is true when at least one conflict-classified artefact has no matching pack_update_resolutions row, and false once every conflict artefact has one"
      - "the moduledoc explicitly flags the GLOBAL-vs-PER_TENANT classification question as unresolved beyond this requirement's own scope, per this requirement's description"
    depends_on: [REQ-015]

  - id: REQ-042
    title: Definition full-text search (store.zig's search, PD-10)
    owner: ELIXIR-DEV
    status: done
    stage: S2
    impl_order: 53  # letflow-queue task id
    description: >
      Port src/definition/store.zig's Store.search() (per
      src/design/definition.md's PD-10 section) as
      Letflow.Definitions.search/1, operating on REQ-027's process_definitions
      table (including its stage column, since PD-10's own SQL SELECT list
      includes it). definition.md is explicit that "Search lives inside the
      existing store.zig... No new Zig source file or SQL migration is
      required" -- this requirement adds no new table, reusing REQ-027's
      schema as-is.
      - SearchOptions-equivalent input: query (string, non-empty and <=512
      chars -- QueryEmpty/QueryTooLong errors, validated both here as
      belt-and-suspenders and, later, at the S4 HTTP handler layer per
      PD-10's own validation-rules table), limit (default 20, max 100 --
      values above 100 are the HTTP handler's job to reject with a 422
      before calling this function, per definition.md's handleSearch step
      3; this function itself does not need to reject an out-of-range
      limit, only apply the default), offset (default 0).
      - Matching: ILIKE against name and description (definition.md's
      "Why ILIKE instead of tsvector/to_tsquery" rationale: no dictionary
      config dependency, no GIN index required, sufficient for a COULD-priority
      requirement, satisfies the partial-word-matching SHOULD criterion via
      a '%query%' pattern) -- bound as pg/Ecto parameters, the '%' wildcard
      characters composed into the bound parameter value itself, never
      string-interpolated into the query text (definition.md's explicit
      SQL-injection-safety note).
      - Ranking: exact name match (case-insensitive) scores 3.0; partial
      name match scores 2.0; description-only match scores 1.0 (definition.md's
      CASE expression); results ordered by rank DESC, then created_at DESC
      for deterministic sub-ordering among equal ranks.
      - Returns an empty list (not an error) when nothing matches
      (definition.md: "no-match -> HTTP 200 with empty array" -- this
      function returns the empty list, the S4 HTTP layer owns the 200
      mapping).
      This requirement is domain logic only -- the HTTP endpoint (GET
      /api/v1/definitions/search) is S4 (api-surface) scope, not built here,
      matching REQ-036's own established boundary note for the promotion
      pipeline (context-module function, not a Plug route handler).
    acceptance_criteria:
      - "search/1 with query \"invoice\" returns a definition named exactly \"invoice\" ranked above one named \"invoice-approval\" (partial name match), which in turn ranks above one matched only via its description containing \"invoice\""
      - "search/1 with an empty query string returns a QueryEmpty-equivalent error, not an empty result list"
      - "search/1 with a query longer than 512 characters returns a QueryTooLong-equivalent error"
      - "search/1 against a query with no matching name or description anywhere returns an empty list, not an error"
      - "search/1 respects limit (default 20) and offset for pagination, demonstrated with more matching rows than fit in one page across two successive calls"
      - "the moduledoc states no new migration/table was added, explicitly citing definition.md's PD-10 section for that boundary"
    depends_on: [REQ-030]


  # ---------------------------------------------------------------
  # S3 — instance-engine
  # Expanded once S2 (event-store-and-definitions) was fully done --
  # REQ-022..042 all `done`. Inherits docs/migration/decisions/
  # 0003-ecto-schema-strategy.md Decision A (Ecto-idiomatic redesign,
  # binary_id PKs, Ecto.Enum for status columns), Decision B
  # (schema-per-tenant via REQ-022's :prefix mechanism -- every table
  # this batch adds is tenant-scoped, none is GLOBAL), and Decision C
  # point 1 (event tables stay append-only).
  #
  # Real R-Co source ported: src/engine/ (11 files: instance.zig 5550
  # lines, transition.zig 3323, reconstruction.zig 1646,
  # pin_resolver.zig 967, service_task.zig 420, pin_rebind.zig 388,
  # snapshot_writer.zig 348, plugin_registry.zig 232,
  # lua_script_audit.zig 201, plugin_interface.zig 79,
  # transition_source_embed.zig 24), decomposed along R-Co's own
  # EE-01..EE-12 behavioural seams (src/design/engine.md's `## Section
  # EE-NN` headings map 1:1 to those requirement ids) rather than
  # 1:1 per file -- instance.zig and transition.zig each span many
  # EE-* requirements and cannot be one agent turn each.
  #
  # transition_source_embed.zig is DELIBERATELY NOT PORTED and gets no
  # requirement: its own header states it exists solely because Zig's
  # `@embedFile` cannot escape a module root, so
  # tests/differential/differential_test.zig needs a one-line shim
  # colocated beside transition.zig to read its raw source bytes at
  # compile time. Elixir has no equivalent constraint (a test can read
  # any file at runtime, and `File.read!/1` at compile time is
  # unrestricted), so porting it would produce a file with no purpose.
  # Named here explicitly rather than silently dropped from the
  # 11-file count.
  #
  # This stage GENERALIZES Letflow's existing early-pattern modules
  # rather than starting fresh, per
  # docs/migration/stage-3-instance-engine.md: REQ-045 supersedes
  # lib/letflow/process_instance.ex, REQ-052 supersedes
  # lib/letflow/parallel_approval.ex, and REQ-045 generalizes
  # lib/letflow/instance_supervisor.ex. Each of those three
  # requirements says concretely which module is replaced, extended,
  # or retired.
  #
  # Scope deliberately excludes (flagged inside the relevant
  # requirement's own description below, not silently dropped): all
  # HTTP routes/controllers (POST /instances, POST /tasks/:id/complete,
  # POST /instances/:id/cancel, POST /instances/:id/rebind-pins,
  # GET /instances/:id/pins, POST /instances/:id/reconstruct -- S4
  # api-surface; this batch ports domain logic as context-module
  # functions only), the Lua and WASM execution runtimes themselves
  # (src/lua/ 29 files, src/wasm/ 19 files -- S5
  # scripting-and-plugins, which needs its own build-vs-bind decision
  # record per stage-5-scripting-plugins.md; S3 ports only the
  # engine-side plugin REGISTRY CONTRACT in REQ-057 and the lua AUDIT
  # PERSISTENCE PATH in REQ-058, both against an injected executor
  # interface), the real outbound HTTP client for SERVICE_TASK
  # dispatch (REQ-056 ports config parsing/retry classification and
  # leaves the transport injectable), the DLQ and scheduler stores
  # (src/dlq/, src/scheduler/ -- S6 operational-cross-cutting), and
  # the service_catalog / PLC-01 module catalog that PIN-01's AC1/AC2
  # need (R-Co itself holds PIN-01/PIN-03 at TESTED rather than
  # RELEASED over exactly this gap, tracked there as ISS-0672/GH-306
  # -- REQ-059 carries the same scoping forward explicitly rather
  # than pretending the dependency exists).
  #
  # Several requirements below name a genuine open question no
  # existing docs/migration/decisions/*.md record settles, following
  # REQ-039/REQ-040/REQ-041's precedent: process-per-instance vs.
  # row-based state for the engine's own execution path (REQ-045,
  # REQ-052), for the plugin registry (REQ-057), and for the snapshot
  # cadence counter (REQ-054); and whether the instance-engine tables
  # are driven through a supervised :gen_statem at all or stay a
  # transactional context module (REQ-045, the stage's single largest
  # design question). These are left for CODE-DESIGNER/REVIEWER to
  # resolve at WF-02 design time, not silently decided here.
  #
  # REQ-052 and REQ-061 were one requirement (EE-08 + EE-10) in this
  # batch's first draft and were split on sizing review: together they
  # span 1,324 lines of engine.md against REQ-044's 644-line baseline,
  # and they differ in kind -- EE-08 cancellation is caller-initiated
  # and drives to a terminal CANCELLED, while EE-10 error handling is
  # engine-internal, driven by REQ-049/050/056/057/062's failure
  # paths, and halts NON-terminally at ERROR pending an S6 dead-letter
  # action. Their shared row-locking shape did not justify one agent
  # turn. REQ-051 (EE-06+EE-07) was reviewed for the same concern and
  # deliberately NOT split: at 661 lines it is at baseline, split and
  # join share the Token/JoinCounter model, and EE-07's
  # cancelled-branch-exclusion rule is unstateable without the split
  # half in the same requirement.
  #
  # Gateway condition evaluation (REQ-050) is deliberately NOT on that
  # list: R-Co has a real, working reference implementation to port --
  # src/engine/transition.zig's evaluateGatewayCondition() (~L1118)
  # translating CEL syntax to R-Co's src/expr/ module, per commit
  # 480b7dc5 which retired vendor/cel from production. The "cel.zig is
  # a stub" wording in src/design/definition.md and engine.md's own
  # EE-05 section is stale as a description of RUNTIME evaluation, and
  # REQ-029 quoted it correctly only for its own definition-time
  # syntax-check scope. REQ-050 records that distinction so it is not
  # re-propagated a third time.
  #
  # docs/migration/stage-3-instance-engine.md's two Early findings are
  # binding on this whole batch and are cited by id in the affected
  # requirements: (1) hold the generalized engine to real :gen_statem
  # per-state callbacks and real supervised isolation, never a
  # GenServer hand-simulating a state machine; (2) do NOT assume
  # process-per-instance by default -- its case is strongest for
  # service task dispatch, plugin registries, timers, backpressure,
  # and expensive-to-reconstruct in-memory state.
  # ---------------------------------------------------------------

  - id: REQ-043
    title: Instance-engine schema (instance_projections ALTER + tasks + tokens tables)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 87  # letflow-queue task id
    description: >
      Add the priv/repo/migrations and Ecto.Schema modules the instance engine
      needs but that S2 deliberately did not build, all schema-per-tenant via
      REQ-022's :prefix mechanism (Decision B's general rule for business
      tables -- none of these three is GLOBAL, and none needs REQ-041's
      GLOBAL-exception flagging, since R-Co's own 005_instances.sql tables are
      per-tenant like events/events_archive):
      (a) an ALTER TABLE migration on REQ-023's instance_projections adding
      exactly the columns REQ-023's own migration header
      (priv/repo/migrations/20260816120003_create_instance_projections.exs,
      "COLUMNS DELIBERATELY NOT CREATED HERE") names as S3/EE-01's job:
      definition_id (binary_id, not null), correlation_key (string, nullable),
      current_nodes (jsonb, default "[]" -- active token positions),
      variables (jsonb, default "{}" -- the merged variable map, seeded from
      EE-01's initial_variables per engine.md section EE-01 1a's "Note on
      initial_variables"), error_detail (jsonb, nullable -- set on ERROR
      status by EE-10), completed_at and cancelled_at (utc_datetime_usec,
      nullable), plus the two indexes REQ-023 names: uq_instance_correlation
      (UNIQUE on (definition_id, correlation_key) WHERE correlation_key IS NOT
      NULL -- the index that structurally enforces EE-01's correlation-key
      uniqueness acceptance criterion) and idx_proj_definition. The existing
      status Ecto.Enum already carries ERROR (REQ-023 included it
      deliberately, per that migration's header), so no enum migration is
      needed here -- confirm that rather than adding one.
      (b) a tasks table per engine.md section EE-03 1a
      (R-Co migrations/005_instances.sql): id (binary_id), instance_id
      (binary_id, not null, indexed), token_id (binary_id, not null), node_id
      (string, not null), node_name (string, not null), status (Ecto.Enum:
      PENDING/COMPLETED/CANCELLED, default PENDING), assignee_type (string,
      nullable -- USER|GROUP|ROLE), assignee_ref (string, nullable),
      form_schema (jsonb, nullable), output_variables (jsonb, nullable),
      completed_by (binary_id, nullable), completed_at/cancelled_at
      (utc_datetime_usec, nullable), timestamps(). R-Co's tasks logic lives in
      src/tasks/store.zig (1202 lines), a directory OUTSIDE this stage's
      src/engine/ scope -- this requirement builds only the table + schema
      module that src/engine/instance.zig writes into at EE-03 activation and
      EE-04 completion time; the standalone task query/list surface
      (src/tasks/store.zig's own list/filter operations) is NOT ported here
      and belongs with S4's tasks routes or its own later requirement. State
      that boundary in the moduledoc.
      (c) a tokens table: id (binary_id), instance_id (binary_id, not null),
      node_id (string), branch_id (string), plus whatever the EE-06/EE-07
      parallel token model needs -- tasks.token_id references it. Because
      engine.md section EE-02 2 defines Token as an in-memory value
      (node_id/branch_id/token_id/waiting_child_instance_id) and
      instance_projections.current_nodes already persists active token
      positions as jsonb, flag explicitly in the moduledoc whether a separate
      tokens TABLE is genuinely required in Letflow or whether current_nodes
      subsumes it -- R-Co has both, but R-Co's tasks.token_id FK is the only
      thing that forces the separate table there. Do NOT silently drop the
      table or silently keep it; state which and why, since REQ-051's join
      counters and REQ-044's tasks FK both depend on the answer.
      tenant_id on every table above is NOT NULL with no DB default and is
      derived from the Ecto :prefix the write targets by reversing REQ-022's
      Letflow.TenantProvisioning.schema_name_for_tenant/1, exactly as REQ-025
      and REQ-030 established for their own tables -- never a caller-supplied
      field.
    acceptance_criteria:
      - "an ALTER TABLE migration adds definition_id, correlation_key, current_nodes, variables, error_detail, completed_at and cancelled_at to instance_projections and applies cleanly against a provisioned tenant schema via REQ-022's migration-replay mechanism"
      - "the uq_instance_correlation partial unique index exists and is demonstrated rejecting a second instance_projections row with the same (definition_id, correlation_key) while permitting any number of rows whose correlation_key is NULL"
      - "priv/repo/migrations gains tasks and (if REQ-043 concludes it is needed) tokens migrations, schema-per-tenant per REQ-022, applying cleanly, with tasks.status as an Ecto.Enum over exactly PENDING/COMPLETED/CANCELLED"
      - "the tasks schema module's moduledoc explicitly states that src/tasks/store.zig's standalone task query surface is NOT ported by this requirement and names where it belongs instead"
      - "the moduledoc states explicitly, as a resolved-and-justified choice rather than an omission, whether a separate tokens table exists in Letflow or whether instance_projections.current_nodes subsumes it"
      - "a row written into tasks has tenant_id equal to the tenant whose schema the write targeted, derived internally; a test deliberately making a caller-supplied tenant_id disagree with the target schema fails loudly rather than silently attributing to the wrong tenant"
    depends_on: [REQ-023, REQ-027]

  - id: REQ-044
    title: Pure transition kernel core types and dispatch skeleton (transition.zig, EE-02)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 88  # letflow-queue task id
    description: >
      Port the core value types and top-level dispatch of
      src/engine/transition.zig's transition() (per src/design/engine.md
      "Section EE-02: Pure Transition Function", L442) as a pure Letflow
      module -- no Ecto.Repo call, no I/O of any kind, no clock read, matching
      transition.zig's own header contract ("All state is passed in; all
      output is returned. No DB, no network, no clock") and the same purity
      bar REQ-028 already established for the graph validator.
      This requirement builds the SKELETON and its non-gateway node
      transitions only. The gateway bodies are separate requirements
      (REQ-050 exclusive, REQ-051 parallel split/join) that plug into the
      dispatch this requirement defines -- transition.zig is 3323 lines and
      cannot be one agent turn.
      Port:
      - InstanceState (engine.md section EE-02 1): instance_id, status
      (ACTIVE/COMPLETED/CANCELLED/ERROR, reusing REQ-043's Ecto.Enum values),
      tokens, variables (a plain Elixir map -- Zig's std.json.ObjectMap and
      its explicit allocator-ownership contract have no Elixir equivalent;
      note that divergence in the moduledoc rather than silently inventing an
      ownership discipline, the same way REQ-029 handled GraphError.OutOfMemory).
      - Token (engine.md section EE-02 2): node_id, branch_id, token_id
      (stable identity, added by R-Co's ISS-105), waiting_child_instance_id.
      - TransitionEvent and PendingEvent (the tagged union transition.zig
      declares for EE-06/EE-07 split/join payloads) as tagged tuples or
      structs.
      - transition/3 itself: (definition_snapshot, instance_state, event) ->
      {:ok, new_instance_state, pending_events} | {:error, reason}. Determinism
      is the load-bearing property (EE-02 AC2, and XC-04 kernel determinism per
      transition.zig's header): identical inputs always produce identical
      outputs. An unknown event type returns an error state, never raises
      (EE-02 AC5). A token sitting on a node id absent from the snapshot graph
      returns an error state naming the inconsistency (EE-02 edge case).
      - The non-gateway node transitions: token entering a HUMAN_TASK node
      appends to pending_task_nodes (the signal REQ-047 turns into a tasks
      row -- engine.md section EE-03's "the signal itself is the guard"
      note: START/END/gateway nodes never appear there, so the persistence
      layer needs no node-type guard of its own); token entering an END node
      moves the instance toward COMPLETED.
      Reuses REQ-028's DefinitionGraph/GraphNode/GraphEdge/NodeType structs
      directly rather than redefining them (lib/letflow/definitions/graph.ex),
      since engine.md names src/definition/graph.zig as this module's
      dependency.
    acceptance_criteria:
      - "transition/3's function signature and its entire call graph contain zero Repo calls, zero HTTP/file access, and zero DateTime.utc_now/System.system_time reads, confirmed by inspection and stated in the moduledoc"
      - "calling transition/3 twice with the identical (snapshot, state, event) triple returns byte-identical results, demonstrated by an explicit test rather than asserted"
      - "an unknown/unrecognised event type returns an error result, and a state whose token sits on a node_id absent from the snapshot graph returns an error result naming the offending node_id -- neither raises or crashes"
      - "a token entering a HUMAN_TASK node adds that node to pending_task_nodes, while tokens entering START, END, EXCLUSIVE_GATEWAY and PARALLEL_GATEWAY nodes do not -- each of the five node-type cases has its own explicit test"
      - "the moduledoc states explicitly that Zig's std.json.ObjectMap allocator-ownership contract is deliberately not ported (Elixir maps are immutable values), rather than leaving the divergence unremarked"
      - "the module reuses REQ-028's existing graph structs from lib/letflow/definitions/graph.ex rather than defining a second copy of DefinitionGraph/GraphNode/GraphEdge/NodeType"
    depends_on: [REQ-028, REQ-029]

  - id: REQ-045
    title: Instance start and engine execution shell (instance.zig create, EE-01) -- supersedes lib/letflow/process_instance.ex
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 89  # letflow-queue task id
    description: >
      Port src/engine/instance.zig's InstanceStore.create() (per
      src/design/engine.md "Section EE-01: Start Instance", L18) as the
      instance-start entry point, operating on REQ-043's extended
      instance_projections and REQ-033's already-shipped
      Letflow.Definitions.SnapshotStore.
      This is the requirement that GENERALIZES Letflow's existing early
      pattern, per docs/migration/stage-3-instance-engine.md's Scope section.
      Concretely: lib/letflow/process_instance.ex (a hardcoded
      draft->submitted->approved/rejected :gen_statem with a four-atom state
      graph baked into function heads, persisting via
      Letflow.Events.TransitionEvent) is SUPERSEDED by this requirement --
      its hardcoded state graph becomes data (REQ-027's process_definitions
      graph column, snapshotted per instance by REQ-033), and its transition/5
      helper's job is taken over by REQ-044's pure transition/3 plus this
      requirement's persistence orchestration. lib/letflow/instance_supervisor.ex
      is GENERALIZED, not retired: its DynamicSupervisor shape stays, but
      start_instance/1 takes a definition-driven instance rather than a bare
      id string. State in the moduledoc, concretely, which of the two modules
      is replaced and which is extended, and whether
      Letflow.Events.TransitionEvent and its migration
      (20260814000001_create_transition_events.exs) are retired in favour of
      REQ-023's events table or deliberately left in place -- do not leave
      that dangling.
      create/1 behaviour (engine.md section EE-01 5's algorithm):
      - Accepts definition_id (or name+version, resolved via REQ-030's
      get_active_by_name/1), an optional correlation_key, and an
      initial_variables map. initial_variables must be a JSON object -- nil
      and lists are rejected with a distinct error (EE-01 edge case: "{}" is
      valid, null is not).
      - Rejects a definition whose status is not ACTIVE with a distinct
      not-active error (EE-01 AC5).
      - Calls REQ-033's SnapshotStore.create/2 to bind the definition graph
      snapshot to the instance -- this is the EE-01 integration point REQ-033's
      own moduledoc explicitly deferred to S3 ("the engine calling create/2 at
      instance-start time (EE-01), BEFORE any event is appended, is S3's job").
      Honour that ordering.
      - Inserts the instance_projections row seeded with variables =
      initial_variables and the token placed on the START node, and appends an
      INSTANCE_STARTED event via REQ-025's append/1 -- with the event append
      and the row insert atomic (Ecto.Multi or Repo.transaction).
      - A duplicate (definition_id, correlation_key) is rejected by REQ-043's
      uq_instance_correlation index and surfaced as a distinct
      duplicate-correlation error (EE-01 AC2); a nil correlation_key applies no
      uniqueness constraint at all (EE-01 AC3).
      - The first task activation fires immediately for the first non-START
      node (EE-01 AC7) -- via REQ-044's transition/3 and REQ-047's activation
      persistence.
      OPEN QUESTION (flag, do not silently resolve -- this is the stage's
      single largest design question, and stage-3-instance-engine.md's second
      Early finding is directly on point): whether a running instance is a
      supervised :gen_statem process (generalizing
      lib/letflow/process_instance.ex + instance_supervisor.ex) or a plain
      transactional context module writing instance_projections rows with no
      process per instance. The finding is explicit that process-per-instance
      "was operationally heavier than a plain Postgres row needed to be" for
      the earlier low-complexity approval feature and bought "a narrower
      guarantee than it sounds," while its case "gets stronger specifically
      where this stage's actual scope lives: service task dispatch, plugin
      registries, and anything with expensive-to-reconstruct in-memory state,
      timers, backpressure." EE-01's own path here is closer to the row side
      (every write is already transactional, and REQ-053's reconstruction
      makes state cheaply rebuildable from the log), while REQ-056's service
      task dispatch and REQ-057's registry are closer to the process side --
      so the answer may legitimately differ per subsystem rather than being
      one global choice. This requirement ports create/1's CONTRACT
      (signature + behaviour + atomicity) and leaves the process-vs-row
      choice to CODE-DESIGNER at WF-02 design time, citing this note.
      If CODE-DESIGNER does choose a process, the first Early finding binds
      it: real :gen_statem per-state callbacks and real supervised isolation
      (the bar lib/letflow/parallel_approval.ex already met), never a
      GenServer hand-simulating a state machine via a `case data.mode do`
      dispatch.
      SCOPE BOUNDARY: POST /api/v1/instances and every other HTTP route is S4
      (api-surface). This requirement builds a context-module function, not a
      Plug/Phoenix handler -- the same boundary REQ-036 and REQ-042 already
      established for their own S2 domain logic.
    acceptance_criteria:
      - "create/1 against an ACTIVE definition inserts an instance_projections row with status ACTIVE, variables seeded from initial_variables, a token on the START node, and an instance_definition_snapshots row created via REQ-033's SnapshotStore.create/2 -- with the snapshot demonstrably written before the INSTANCE_STARTED event is appended"
      - "create/1 against a definition whose status is draft, deprecated or archived returns a distinct not-active error and writes zero rows across instance_projections, instance_definition_snapshots and events"
      - "create/1 with initial_variables set to nil, or to a list, is rejected with a distinct error, while an empty map is accepted -- three explicit tests"
      - "a second create/1 with the same (definition_id, correlation_key) returns a distinct duplicate-correlation error and writes no second row, while two create/1 calls with correlation_key nil both succeed"
      - "the moduledoc states concretely which of lib/letflow/process_instance.ex and lib/letflow/instance_supervisor.ex is superseded and which is generalized, and states whether Letflow.Events.TransitionEvent is retired in favour of REQ-023's events table or deliberately kept"
      - "the moduledoc names the process-per-instance-vs-row-based-state open question explicitly and states it is left for CODE-DESIGNER, citing stage-3-instance-engine.md's second Early finding"
      - "the moduledoc states that POST /api/v1/instances is S4 scope and that this requirement builds a context-module function only"
    depends_on: [REQ-043, REQ-044, REQ-030, REQ-033, REQ-025]

  - id: REQ-046
    title: Retirement or generalization of lib/letflow/process_instance.ex and its supervision tree
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 90  # letflow-queue task id
    description: >
      Execute the supersession REQ-045 decides. REQ-045 ports EE-01's start
      path and states in its moduledoc which early module is replaced and
      which is generalized; this requirement carries that out in the codebase
      so the two engines do not coexist indefinitely as parallel, divergent
      implementations of "a running workflow instance."
      Concretely, based on REQ-045's recorded decision:
      - lib/letflow/process_instance.ex: either delete it and its
      Letflow.Events.TransitionEvent persistence (migrating any tests that
      exercise it onto REQ-045's definition-driven path), or keep it and
      document in its moduledoc exactly why it survives alongside the real
      engine and what it is now for. Do not leave it undocumented and
      unreferenced.
      - lib/letflow/instance_supervisor.ex: generalize start_instance/1 so it
      starts a definition-driven instance (whatever shape REQ-045's
      process-vs-row resolution produced) rather than
      Letflow.ProcessInstance.child_spec/1 with a bare id string. If REQ-045
      resolved to a row-based engine with no process per instance, this
      supervisor may have nothing left to supervise -- in that case retire it
      explicitly with a moduledoc-or-status-history record of why, rather
      than leaving a DynamicSupervisor in the tree with no children.
      - lib/letflow/application.ex's supervision tree and Letflow.Registry
      keys are updated to match whichever shape lands, with the first Early
      finding honoured: real supervised isolation via a DynamicSupervisor
      (the ApprovalSupervisor-vs-InstanceSupervisor separation
      lib/letflow/parallel_approval.ex's moduledoc describes as deliberate is
      the precedent), never a shared singleton process funnelling every
      instance's work.
      This requirement is deliberately separate from REQ-045 rather than
      folded into it: REQ-045 is already a large port, and deleting or
      rewiring modules that existing tests depend on is its own reviewable
      unit of work with its own regression risk.
    acceptance_criteria:
      - "lib/letflow/process_instance.ex is either deleted (with every test referencing it migrated or removed, and mix test passing) or retained with a moduledoc paragraph stating explicitly why it survives alongside REQ-045's engine and what its remaining role is"
      - "lib/letflow/instance_supervisor.ex either starts REQ-045's definition-driven instances or is retired explicitly with a recorded reason -- it is not left in the supervision tree supervising a superseded module"
      - "mix test passes with the actual output quoted, after the change -- no test is deleted merely to make the suite green without stating why in the commit or moduledoc"
      - "the resulting supervision tree preserves real supervised isolation (killing one instance's process, if processes are used, does not affect another), demonstrated by a test or explicitly stated as not-applicable if REQ-045 resolved to a row-based engine"
    depends_on: [REQ-045]

  - id: REQ-047
    title: Task activation persistence (instance.zig applyTransition, EE-03)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 91  # letflow-queue task id
    description: >
      Port src/engine/instance.zig's InstanceStore.applyTransition() (per
      src/design/engine.md "Section EE-03: Task Activation", L1086) as the
      persistence orchestration layer that turns REQ-044's pure transition
      output into committed rows. This is the seam between the I/O-free kernel
      and the database.
      - Given a transition result whose pending_task_nodes gained an entry,
      insert a REQ-043 tasks row with status PENDING, task id, instance_id,
      token_id, node_id, node_name, assignee_type and assignee_ref taken from
      the HUMAN_TASK node's attributes (REQ-029's PD-05 rules already
      guarantee a HUMAN_TASK carries a non-empty role).
      - The tasks row insert, the instance_projections state update, and the
      event append via REQ-025 all commit in ONE transaction (EE-03 AC2,
      DB-03). A task must never be visible to a reader before the transition
      that created it is committed (EE-03 AC5).
      - No node-type guard is written in this layer: engine.md section EE-03's
      module purpose is explicit that the transition function only ever
      appends HUMAN_TASK nodes to pending_task_nodes, so "the signal itself is
      the guard." Port that property rather than re-implementing a
      START/END/gateway exclusion check here -- but assert it with a test
      (EE-03 AC3/AC4) so the property is verified rather than assumed.
      - A HUMAN_TASK whose assignee_ref names a group with no current members
      still creates a PENDING task; assignment resolution is deferred to
      runtime (EE-03 edge case), not an activation-time failure.
      - A token entering an END node transitions the instance to COMPLETED and
      creates no task. R-Co's EE-03 edge case also fires SCH-03 timer
      cancellation at that point -- src/scheduler/ is S6
      (operational-cross-cutting) and does not exist in Letflow, so port the
      COMPLETED transition and leave a named, documented hook for timer
      cancellation rather than silently omitting it or inventing a scheduler.
      SCOPE BOUNDARY: GET /api/v1/tasks and the task list/query surface are S4
      (api-surface) plus R-Co's own src/tasks/store.zig, outside this stage's
      src/engine/ scope per REQ-043's note. This requirement writes tasks rows
      from the engine; it does not build the read side.
    acceptance_criteria:
      - "a transition that enters a HUMAN_TASK node results in exactly one tasks row with status PENDING carrying instance_id, node_id, node_name, assignee_type and assignee_ref, committed in the same transaction as the instance_projections update and the appended event"
      - "when the event append fails, zero tasks rows and zero instance_projections changes are committed -- demonstrated by forcing an append failure and reading all three tables back"
      - "transitions entering START, END, EXCLUSIVE_GATEWAY and PARALLEL_GATEWAY nodes create zero tasks rows, each with its own explicit test, verifying (not merely assuming) the transition function's pending_task_nodes guarantee"
      - "a HUMAN_TASK whose assignee_ref names a group with no members still produces a PENDING task rather than an activation error"
      - "a token entering an END node sets the instance to COMPLETED, creates no task, and leaves a documented named hook for SCH-03 timer cancellation with S6 identified as its owning stage"
    depends_on: [REQ-045]

  - id: REQ-048
    title: Task completion (instance.zig completeTask, EE-04)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 93  # letflow-queue task id
    description: >
      Port src/engine/instance.zig's InstanceStore.completeTask() (per
      src/design/engine.md "Section EE-04: Complete Task", L1632) as
      complete_task/N, operating on REQ-043's tasks table and REQ-044's
      transition/3.
      - Accepts a task_id and an output_variables map. output_variables may be
      an empty map (valid, EE-04 AC5); nil is rejected with a distinct error
      (EE-04 edge case: "use {} for no output").
      - A task_id that does not exist returns a distinct not-found error
      (EE-04 AC2). A task whose status is not PENDING (already COMPLETED or
      CANCELLED) returns a distinct conflict error (EE-04 AC3) -- these two are
      separately pattern-matchable, not one generic error.
      - In ONE transaction (EE-04 AC4): merge output variables per REQ-049's
      EE-09 merge, evaluate outgoing edge conditions via REQ-044/REQ-050,
      activate the next node(s) via REQ-047's activation path, flip the task
      to COMPLETED with completed_by/completed_at/output_variables set, and
      append a TASK_COMPLETED event via REQ-025.
      - Row-level locking (SELECT ... FOR UPDATE on the task or the instance)
      serialises two concurrent completions of the same task so exactly one
      wins -- this is the EE-12 concurrency property, exercised concretely
      here and stated generally in REQ-055.
      SCOPE BOUNDARY: POST /api/v1/tasks/:id/complete is S4 (api-surface).
      R-Co's EE-04 AC bullets are written as HTTP status codes (404/409/422);
      this requirement returns the corresponding tagged tuples and the S4
      layer owns the status mapping, exactly as REQ-025's is_duplicate boolean
      left the 200-vs-201 choice to S4. Likewise EE-04's edge case "TASK_WORKER
      completing a task assigned to a different user: HTTP 403 (per IDN-03
      role matrix)" is an authorization concern belonging to the S4 auth plug
      (REQ-021's precedent) -- name it explicitly as out of scope here rather
      than partially implementing a role check inside the engine.
    acceptance_criteria:
      - "complete_task on a PENDING task merges output_variables, flips the task to COMPLETED with completed_at and completed_by set, activates the next node, and appends exactly one TASK_COMPLETED event -- all verified by reading tasks, instance_projections and events back after one call"
      - "complete_task with output_variables set to an empty map succeeds; with nil it returns a distinct error -- two explicit tests"
      - "complete_task against a non-existent task_id and against an already-COMPLETED task return two distinct, separately pattern-matchable errors, not one shared generic error"
      - "two concurrent complete_task calls on the same task_id result in exactly one success and one conflict error, demonstrated with an actual concurrent test or the FOR UPDATE locking code path cited explicitly if concurrency cannot be exercised in this environment"
      - "the moduledoc states that HTTP status mapping and the IDN-03 assignee authorization check are S4 scope, not implemented here"
    depends_on: [REQ-047, REQ-049]

  - id: REQ-049
    title: Variable scoping and merge (instance.zig mergeVariables, EE-09)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 92  # letflow-queue task id
    description: >
      Port src/engine/instance.zig's InstanceStore.mergeVariables() (per
      src/design/engine.md "Section EE-09: Variable Scoping and Merge", L3957)
      as the variable-merge rule every task completion, service-task response
      and sub-process output flows through.
      - A key K absent from the instance variable map is inserted (EE-09 AC1).
      - A key K already present, whose new value is schema-compatible (or where
      no variable schema is registered), is overwritten AND a
      VARIABLE_OVERWRITTEN event is appended recording key, old value and new
      value (EE-09 AC2). This event append is not optional decoration -- it is
      the audit record the acceptance criterion requires.
      - A key K already present whose new value is REJECTED by a registered
      variable schema is NOT merged: the instance transitions to ERROR via
      REQ-061's EE-10 path and an EXECUTION_ERROR event is appended (EE-09
      AC3). The schema validation reuses REQ-024's validate_payload/3 rather
      than introducing a second JSON Schema validator -- REQ-024 already
      resolved the library choice open question at its own WF-02 design time,
      so follow whatever it settled on rather than re-deciding.
      - An empty output_variables map merges as a no-op with NO
      VARIABLE_OVERWRITTEN event appended (EE-09 edge case).
      - Merged variable state is immediately visible to subsequent CEL
      condition evaluations (EE-09 AC4) -- i.e. the merge commits before
      REQ-050's gateway evaluation reads variables, not after.
      Merge is a pure function over (current_variables, incoming_variables,
      optional_schema) returning the new map plus the list of events to
      append, with the actual appending done by the calling transaction --
      keeping it testable without a database, the same separation REQ-044
      establishes between the pure kernel and its persistence orchestration.
    acceptance_criteria:
      - "merging a key absent from the instance map inserts it with no VARIABLE_OVERWRITTEN event; merging a key already present overwrites it AND produces exactly one VARIABLE_OVERWRITTEN event carrying the key, the old value and the new value -- two explicit tests"
      - "merging an empty map is a no-op producing zero events and leaving the variable map unchanged"
      - "merging a value that a registered variable schema rejects leaves the variable map unchanged, transitions the instance to ERROR, and produces an EXECUTION_ERROR event -- verified by reading the variable map back and confirming it did not absorb the rejected value"
      - "schema validation goes through REQ-024's validate_payload/3 rather than a second JSON Schema implementation, confirmed by inspection and stated in the moduledoc"
      - "variables merged by a task completion are visible to a gateway condition evaluated later in the same completion, demonstrated by an explicit test rather than argued"
    depends_on: [REQ-044, REQ-024]

  - id: REQ-050
    title: Exclusive gateway evaluation and condition expressions (transition.zig, EE-05)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 94  # letflow-queue task id
    description: >
      Port src/engine/transition.zig's EXCLUSIVE_GATEWAY branch (per
      src/design/engine.md "Section EE-05: Exclusive Gateway/CEL", L2238) into
      REQ-044's transition dispatch. Pure, no I/O, same contract as REQ-044.
      - Outgoing edge conditions are evaluated in DECLARED edge order and the
      token follows the FIRST edge whose condition evaluates true (EE-05 AC1).
      - An edge with is_default true is evaluated LAST regardless of its
      declared position, and carries no condition expression (EE-05 AC2).
      REQ-029 already enforces at definition time that is_default and a
      non-null condition cannot coexist and that at most one default edge
      exists per gateway, so this requirement may rely on those invariants
      rather than re-validating them -- state that reliance explicitly.
      - Exactly one outgoing edge is followed per evaluation: never zero,
      never more than one (EE-05 AC5).
      - A condition that raises a runtime error (type mismatch, undefined
      variable) is treated as FALSE for that edge, not as an instance error
      (EE-05 AC4 and its edge case). This is easy to get backwards -- a
      condition erroring is different from no condition matching.
      - If no condition matches and no default edge exists, the instance
      transitions to ERROR per REQ-061's EE-10 path, with a structured reason
      naming the gateway node_id and the conditions that were evaluated
      (EE-05 AC3). The reason must carry enough detail for an operator to
      diagnose without replaying (EE-10 AC5), so record the evaluated
      conditions, not just the node id.
      CONDITION EVALUATION -- port against R-Co's real, working
      implementation, which is NOT vendor/cel/cel.zig. Read
      src/engine/transition.zig's evaluateGatewayCondition() (~line 1118,
      R-Co's EXP-102 adapter) as the reference: it translates the CEL-syntax
      condition string stored in definition graphs into expr syntax, then
      parses and evaluates via R-Co's src/expr/ module (7 files: lexer.zig,
      parser.zig, ast.zig, evaluator.zig, error.zig, mod.zig,
      benchmark.zig). Its own header states the contract this requirement
      needs: "Returns false on any translation, parse, or evaluation error --
      preserving the same `catch false` semantics as the previous cel.evaluate
      call," plus an explicit I/O-free guarantee ("expr.parse() and
      expr.evaluate() are pure computations"), which is exactly what REQ-044's
      purity contract requires. That catch-false rule IS EE-05 AC4's
      treat-errors-as-false behaviour -- port it as one rule, not two.
      The translation layer (translateCelToExpr) is small and fully specified
      in transition.zig: strip the `variables.` prefix, map `&&`->`and`,
      `||`->`or`, `!`->`not ` (with `!=` passing through unchanged), and
      return no-match for expressions using unsupported CEL features (macros,
      type-conversion functions, collection functions, the ternary operator)
      -- which, via catch-false, means those conditions evaluate false rather
      than erroring the instance. Port that supported/unsupported boundary
      explicitly rather than inferring it, and cite hasCelUnsupportedFeatures()
      as its source.
      Note on a stale citation, so it is not re-propagated: REQ-029's
      description states R-Co's vendor/cel/cel.zig is a stub. That wording
      comes from src/design/definition.md (and engine.md's own EE-05 section,
      lines 451/1005/1020, which the code has since superseded) and was
      correct for REQ-029's own scope -- DEFINITION-TIME syntax checking,
      where Letflow indeed ships only isValidCelSyntax with no evaluation. It
      does NOT describe runtime evaluation today: R-Co commit 480b7dc5 wired
      src/expr into transition.zig and retired vendor/cel from production, and
      vendor/cel/cel.zig is in any case a real 13,877-byte subset evaluator
      with a working evaluate() at line 391, not a stub. This requirement
      therefore has a real reference implementation to port and needs no
      build-vs-adopt decision record. Whatever lands must stay deterministic
      and I/O-free to preserve REQ-044's purity contract.
      SCOPE NOTE: R-Co reaches src/expr/ as a named module shared beyond the
      engine. Letflow has no expression evaluator yet, so this requirement
      builds the minimal evaluator the gateway path actually needs (the
      operators and comparisons translateCelToExpr can produce), not a port of
      all 7 src/expr/ files -- benchmark.zig in particular is a Zig
      benchmarking harness with no Elixir equivalent here. State in the
      moduledoc which subset landed and that a fuller expression surface, if a
      later stage needs one, extends this rather than replacing it.
    acceptance_criteria:
      - "a gateway whose second declared edge is the first to evaluate true routes the token down that edge, not the first or third -- an explicit ordering test, not a single-edge case"
      - "a gateway with a default edge declared FIRST and two non-default edges that both evaluate false routes the token down the default edge, proving the default is evaluated last regardless of declared position"
      - "a condition expression that raises a runtime error (undefined variable or type mismatch) is treated as false and evaluation continues to the next edge, rather than transitioning the instance to ERROR -- an explicit test distinguishing this from the no-match case"
      - "a gateway where no condition matches and no default edge exists transitions the instance to ERROR with a structured reason naming the gateway node_id AND the conditions that were evaluated"
      - "exactly one outgoing edge is followed in every passing case, asserted directly rather than inferred"
      - "a condition using an unsupported CEL feature (a macro, a type-conversion function, a collection function, or the ternary operator) evaluates to false via the catch-false rule rather than raising or erroring the instance, matching hasCelUnsupportedFeatures()'s boundary -- at least two such expressions tested explicitly"
      - "the CEL-to-expr translation is tested directly on each of its four documented rewrites (variables. prefix stripped, && -> and, || -> or, ! -> not with != passing through unchanged), rather than only end-to-end through gateway evaluation"
      - "the evaluator performs zero I/O and is deterministic, confirmed by inspection of its call graph and stated in the moduledoc, which cites src/engine/transition.zig's evaluateGatewayCondition() and src/expr/ as the ported reference and records which subset of the expression surface landed"
    depends_on: [REQ-044]

  - id: REQ-051
    title: Parallel gateway split and join (transition.zig, EE-06/EE-07)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 95  # letflow-queue task id
    description: >
      Port src/engine/transition.zig's PARALLEL_GATEWAY branches (per
      src/design/engine.md "Section EE-06: Parallel Split", L2638 and "Section
      EE-07: Parallel Join", L2898) into REQ-044's transition dispatch. Pure,
      no I/O, same contract as REQ-044. Split and join ship together because
      they share the Token/JoinCounter model and neither is independently
      meaningful.
      SPLIT (EE-06):
      - A token reaching a PARALLEL_GATEWAY with N outgoing edges produces N
      independent tokens simultaneously, one per edge, each with its own
      branch_id (EE-06 AC1).
      - Each token progresses independently: a task completion on one branch
      never blocks another (EE-06 AC2).
      - The split emits a PendingEvent recording the split (EE-06 AC3), and
      all N tokens are created in one transaction at the persistence layer
      (EE-06 AC4 / DB-03 -- the atomicity is REQ-047's orchestration job, the
      token production is this requirement's).
      JOIN (EE-07):
      - A PARALLEL_GATEWAY acting as a join waits until all ACTIVE incoming
      tokens have arrived before creating the single outgoing token (EE-07
      AC1), tracked via transition.zig's JoinCounter struct
      (received_count/expected_from_branches, added by R-Co's ISS-105).
      - "Active" EXCLUDES tokens on branches cancelled via REQ-052's EE-08
      path: a cancelled branch contributes no token and is excluded from the
      join count, so the join still fires when the remaining active branches
      arrive (EE-07 AC2/AC3). This exclusion is the single subtlest rule in
      the parallel model -- a naive implementation waits forever.
      - If ALL branches of a split are cancelled before any reaches the join,
      the join node is itself cancelled and the instance transitions to
      CANCELLED (EE-07 AC4).
      - The join fires EXACTLY ONCE regardless of concurrent token arrival
      order (EE-07 AC5).
      - Variable key collisions between branches merging at the join follow
      REQ-049's EE-09 collision policy (overwrite plus VARIABLE_OVERWRITTEN
      event) -- reuse it, do not write a second merge rule.
    acceptance_criteria:
      - "a PARALLEL_GATEWAY with 3 outgoing edges produces exactly 3 tokens with 3 distinct branch_ids in one transition call"
      - "a join with 3 expected branches does not fire when 2 tokens have arrived and does fire when the 3rd arrives, asserted at both points"
      - "a join whose branch count is 3 but where 1 branch was cancelled via the EE-08 path fires when the remaining 2 active tokens arrive -- it does not wait for the cancelled branch, demonstrated by an explicit test"
      - "when every branch of a split is cancelled before any reaches the join, the join node is cancelled and the instance status becomes CANCELLED"
      - "tokens arriving at a join in two different orders produce the identical post-join state, and the join fires exactly once in both orderings"
      - "a variable key produced with different values on two parallel branches resolves through REQ-049's merge policy with a VARIABLE_OVERWRITTEN event, not through a second collision rule defined in this module"
    depends_on: [REQ-044, REQ-049]

  - id: REQ-052
    title: Instance cancellation (instance.zig cancelInstance, EE-08) -- supersedes lib/letflow/parallel_approval.ex
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 96  # letflow-queue task id
    description: >
      Port src/engine/instance.zig's InstanceStore.cancelInstance() (per
      src/design/engine.md "Section EE-08: Cancellation", L3299) as
      cancel_instance/N. This is the caller-initiated path that drives a
      running instance to the terminal CANCELLED status.
      Split note: this requirement originally also carried EE-10 execution
      error handling. The two were separated because they are different in
      kind, not merely large together -- EE-08 is caller-initiated and
      terminal (CANCELLED admits no further operation), while EE-10 (REQ-061)
      is engine-internal, driven by REQ-049/050/056/057's failure paths, and
      halts NON-terminally at ERROR pending an operator retry/discard through
      S6's dead-letter path. Their shared row-locking shape was not sufficient
      justification to keep them in one agent turn.
      - Sets all open tasks to CANCELLED, appends an INSTANCE_CANCELLED event,
      and sets the instance status to CANCELLED -- all in ONE transaction
      (EE-08 AC3).
      - An instance already CANCELLED or COMPLETED returns a distinct conflict
      error (EE-08 AC2). Cancelled instances are terminal: no further task
      completion or event append is permitted (EE-08 AC4) -- and REQ-025's
      append/1 already enforces exactly this at the event-store layer via its
      active-instance guard on instance_projections.status, so verify that
      guard now actually fires for engine-driven appends rather than
      duplicating the check.
      - Cancelling an instance with no open tasks or timers still appends
      INSTANCE_CANCELLED (EE-08 edge case).
      - Concurrent cancellation racing a task completion: the first operation
      to acquire the row-level lock wins, the other gets a conflict error
      (EE-08 edge case) -- the same locking discipline REQ-048 uses and
      REQ-055 verifies globally.
      - R-Co's EE-08 also cancels pending timers atomically via SCH-03
      (src/scheduler/, S6) and abandons in-flight SERVICE_TASK HTTP calls
      best-effort (REQ-056's transport, whose real client is out of S3 scope).
      Neither dependency exists in Letflow yet: port the cancellation of what
      DOES exist (tasks, status, event) and leave named, documented hooks for
      both, identifying S6 and REQ-056 respectively -- do not silently omit
      them from the moduledoc as if EE-08 were fully covered.
      BRANCH CANCELLATION: REQ-051's parallel join excludes cancelled branches
      from its join count (EE-07 AC2/AC3), and cancelling every branch of a
      split cancels the join node and the instance (EE-07 AC4). That token-level
      rule lives in REQ-051's pure transition logic; this requirement owns the
      instance-level persistence of a cancellation. Confirm the two agree --
      an instance CANCELLED by the all-branches-cancelled path and one
      CANCELLED by a direct caller request must reach the same persisted state.
      SUPERSESSION: lib/letflow/parallel_approval.ex is superseded by this
      requirement together with REQ-051 -- its two-approver :gen_statem (a
      single :pending state holding approver progress as genuine gen_statem
      data, with Letflow.ApprovalSupervisor as a deliberately separate
      DynamicSupervisor) is the hand-written special case of what REQ-051's
      PARALLEL_GATEWAY split/join now expresses as definition data. State in
      the moduledoc whether it is deleted or retained-with-a-reason, and do
      the same for Letflow.ApprovalSupervisor, the same way REQ-046 handles
      ProcessInstance/InstanceSupervisor. Its first Early finding remains the
      quality bar for whatever replaces it: real per-state callbacks and real
      supervised isolation, never a GenServer simulating a state machine.
      OPEN QUESTION (flag, do not silently resolve): if REQ-045's
      process-vs-row resolution chose supervised processes, cancellation must
      terminate a live process, and killing a process is exactly the exit path
      that Elixir's try/after does not cover -- the same crash-safety question
      REQ-040 flagged for sandbox teardown. Leave the concrete mechanism to
      CODE-DESIGNER, citing REQ-040's precedent.
      SCOPE BOUNDARY: POST /api/v1/instances/:id/cancel is S4 (api-surface).
      This requirement returns tagged tuples; S4 owns the status mapping.
    acceptance_criteria:
      - "cancelling an ACTIVE instance sets every open task to CANCELLED, appends exactly one INSTANCE_CANCELLED event, and sets the instance status to CANCELLED -- all committed together, verified by reading tasks, instance_projections and events back"
      - "cancelling an already-CANCELLED or already-COMPLETED instance returns a distinct conflict error and changes nothing; cancelling an ACTIVE instance with zero open tasks still appends INSTANCE_CANCELLED"
      - "after cancellation, a further append via REQ-025's append/1 is rejected by its existing active-instance guard -- demonstrated against the real event store rather than asserted from the code"
      - "a cancellation racing a task completion on the same instance resolves with exactly one winner and a distinct conflict error for the loser, run concurrently rather than sequentially"
      - "an instance cancelled via REQ-051's all-branches-cancelled join path and one cancelled by a direct cancel_instance call reach the same persisted state (status, task statuses, appended event), compared explicitly"
      - "the moduledoc names the SCH-03 timer-cancellation hook (S6) and the in-flight SERVICE_TASK abandonment hook (REQ-056) as explicitly out of scope, rather than implying EE-08 is fully covered"
      - "the moduledoc states concretely whether lib/letflow/parallel_approval.ex and Letflow.ApprovalSupervisor are deleted or retained-with-a-stated-reason, and mix test passes with the actual output quoted after the change"
    depends_on: [REQ-048, REQ-051]

  - id: REQ-053
    title: State reconstruction by event replay (reconstruction.zig, EE-11)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 98  # letflow-queue task id
    description: >
      Port src/engine/reconstruction.zig's reconstructInstance() (per
      src/design/engine.md "Section EE-11: State Reconstruction", L5237) as
      Letflow.Engine.Reconstruction.reconstruct_instance/2. This is the
      requirement that proves REQ-044's kernel is genuinely pure and
      deterministic: it replays the whole ordered event log through
      transition/3 and must land on a state field-for-field equal to the
      persisted projection.
      - Reads every event for an instance in strict sequence_number order
      across BOTH REQ-023's events table and its events_archive table (EE-11
      AC5: reconstruction spanning archived events must produce identical
      results to pre-archival reconstruction). REQ-026's read/2 covers the
      live table; the archive half needs its own query, since REQ-026's read/2
      does not span events_archive -- confirm that against
      lib/letflow/event_store.ex rather than assuming either way, and extend
      or wrap it accordingly.
      - Replays them through REQ-044's transition/3 to produce an
      InstanceState (EE-11 AC1) equal to the persisted instance_projections
      row field-for-field: same tokens, same variable map, same task set, same
      status.
      - Works even when the projection row is corrupt or absent entirely
      (EE-11 AC3) -- the event log is ground truth. An instance with zero
      events reconstructs to the initial state (token on START, empty
      variables, ACTIVE); an event log containing an EXECUTION_ERROR event
      reconstructs to status ERROR (EE-11 edge cases).
      - Optional write-back (EE-11 AC4): when requested, the reconstructed
      state is written back to instance_projections under SELECT ... FOR
      UPDATE, with lock contention surfaced as a distinct error rather than a
      silent overwrite -- matching reconstruction.zig's own LockContention
      error. Write-back is OPT-IN, never the default: a read-only
      reconstruction must not mutate the read model.
      - Distinct, pattern-matchable errors per reconstruction.zig's own error
      set: instance-not-found (no events in either table), lock-contention,
      replay-failed (transition/3 errored mid-replay, indicating a corrupt or
      inconsistent log) -- not one generic error.
      R-Co's EE-11 AC2 sets a performance bound (NFR-04: 10,000 events in
      under 5 seconds). Letflow has no NFR requirement covering this and no
      benchmark harness; state the bound in the moduledoc as R-Co's documented
      target and note that Letflow has not adopted an NFR requirement for it,
      rather than either silently dropping the bound or inventing a
      performance requirement this stage never scoped.
      SCOPE BOUNDARY: POST /api/v1/instances/:id/reconstruct is S4
      (api-surface); this requirement builds the context-module function.
    acceptance_criteria:
      - "an instance with N appended events reconstructs to an InstanceState equal field-for-field (tokens, variables, task set, status) to its persisted instance_projections row, demonstrated by building a real multi-event instance and comparing both sides"
      - "deleting the instance_projections row entirely and then reconstructing still produces the correct state, proving reconstruction does not read the projection as an input"
      - "an instance whose events span both events and events_archive (some rows moved by REQ-026's archive/1) reconstructs to the identical state it had before archival"
      - "an instance with zero events reconstructs to token-on-START, empty variables, status ACTIVE; an instance whose log contains an EXECUTION_ERROR event reconstructs to status ERROR"
      - "reconstruction without write-back leaves instance_projections byte-identical (verified by reading the row before and after); reconstruction with write-back updates it, and a concurrent lock holder causes a distinct lock-contention error rather than a silent overwrite"
      - "instance-not-found, lock-contention and replay-failed are three separately pattern-matchable errors, each with its own test"
      - "the moduledoc records R-Co's NFR-04 bound (10,000 events under 5 seconds) as documented context and states explicitly that Letflow has not adopted an NFR requirement for it"
    depends_on: [REQ-052, REQ-061, REQ-026]

  - id: REQ-054
    title: Periodic instance state snapshots (snapshot_writer.zig, ISS-601)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 99  # letflow-queue task id
    description: >
      Port src/engine/snapshot_writer.zig (348 lines -- R-Co's ISS-601, design
      artefact src/design/iss601_state_snapshots.md) as
      Letflow.Engine.SnapshotWriter, plus its instance_state_snapshots
      migration and Ecto.Schema module (schema-per-tenant per REQ-022, same as
      every other table this stage adds).
      THIS REQUIREMENT EXTENDS REQ-053's already-shipped reconstruct path --
      it is not a standalone module. REQ-053 builds full-log replay from
      sequence 1; this requirement adds the snapshot table, the writer, and
      the replay-source selection that lets that same reconstruct function
      start from the latest snapshot instead. The deliverable is therefore a
      modification of REQ-053's function plus new supporting code, and the
      correctness bar below is that both paths agree.
      Purpose: reconstruction (REQ-053) replaying the FULL event log from
      sequence 1 is O(events) and gets slower forever. A periodic snapshot of
      the InstanceState as a jsonb blob lets reconstruction replay only the
      events SINCE the latest snapshot.
      - take_snapshot/N: serialises REQ-044's InstanceState (status, tokens,
      variables, pending task nodes, error_detail) plus the sequence_number it
      is current as of, into an instance_state_snapshots row.
      - maybe_take_snapshot/N: the cadence check -- snapshot every N events,
      default 1000 per snapshot_writer.zig's DEFAULT_SNAPSHOT_INTERVAL.
      Called after event appends and on instance completion.
      - REQ-053's replay-source selection: given a latest snapshot at
      sequence S, replay only events with sequence_number > S on top of the
      deserialised snapshot state, versus replaying from 1 when no snapshot
      exists (reconstruction.zig's determineReplaySourceForSnapshot()). This
      requirement extends REQ-053's reconstruct path to use snapshots when
      present -- and the correctness bar is that BOTH paths produce the
      identical state, since a snapshot that diverges from full replay is
      worse than no snapshot at all.
      - This table is NOT the same thing as REQ-027/REQ-033's
      instance_definition_snapshots (the immutable PD-08 DEFINITION graph
      bound to an instance at start). These are periodic EXECUTION STATE
      snapshots, mutable in the sense that new rows accumulate over an
      instance's life. Say so explicitly in the moduledoc -- the two names are
      one word apart and confusing them would be a silent data-model error.
      OPEN QUESTION (flag, do not silently resolve): where the
      events-since-last-snapshot counter lives. instance_projections.last_event_seq
      (REQ-023) already tracks the latest sequence per instance, which makes a
      pure row-based cadence check possible with no in-memory counter at all;
      R-Co's own SnapshotWriter is a struct holding a pool handle. If REQ-045
      resolved to supervised processes, an in-process counter is available but
      is exactly the kind of state stage-3-instance-engine.md's second Early
      finding warns is NOT automatically worth a process. Leave the choice to
      CODE-DESIGNER, citing that finding and REQ-045's resolution.
    acceptance_criteria:
      - "priv/repo/migrations gains an instance_state_snapshots migration, schema-per-tenant per REQ-022, applying cleanly against a provisioned tenant schema"
      - "take_snapshot writes a row whose deserialised state equals the InstanceState passed in, round-tripped field-for-field including tokens and variables"
      - "maybe_take_snapshot writes no row before the interval is reached and exactly one row when it is, with the interval configurable and defaulting to 1000"
      - "reconstructing an instance that has a snapshot at sequence S replays only events with sequence_number greater than S, and produces a state identical to the same instance reconstructed with snapshots ignored entirely -- an explicit both-paths-agree test, not just a faster-path test"
      - "the moduledoc explicitly distinguishes instance_state_snapshots (periodic execution state, this requirement) from instance_definition_snapshots (immutable PD-08 definition graph, REQ-027/REQ-033)"
      - "the moduledoc names the snapshot-cadence-counter placement as an open question left for CODE-DESIGNER, citing stage-3-instance-engine.md's second Early finding and REQ-045's process-vs-row resolution"
    depends_on: [REQ-053]

  - id: REQ-055
    title: Concurrent instance isolation guarantees (instance.zig locking, EE-12)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 100  # letflow-queue task id
    description: >
      Establish and verify the concurrency-safety property R-Co's EE-12 states
      (per src/design/engine.md "Section EE-12: Concurrent Instance Safety",
      L5771) across the engine paths REQ-045/047/048/052 build. EE-12 adds
      almost no new code of its own in R-Co (its implemented_in names
      src/engine/instance.zig and src/api/routes/tasks.zig, files other
      requirements already port); its deliverable is the guarantee, the
      locking discipline that produces it, and the tests that prove it.
      - Instance state is fully isolated: no instance's variable map, task
      set, event log or token positions can be corrupted by another instance's
      concurrent operation (EE-12 AC1).
      - Row-level locking serialises concurrent operations on the SAME
      instance; cross-instance contention must be ZERO -- no global lock is
      held across instance boundaries (EE-12 AC2). This is the specific
      failure this requirement exists to prevent: a single mutex, a singleton
      GenServer funnelling every instance's transitions, or a table-level lock
      would all pass a naive correctness test while destroying throughput and
      violating the isolation the first Early finding demands.
      - Two concurrent task completions on the SAME instance: exactly one
      succeeds, the other gets a conflict (EE-12 AC3) -- REQ-048 already
      implements this; this requirement verifies it holds under real
      concurrency rather than by code reading.
      - The load-shaped criterion (EE-12 AC4: 100 concurrent task completions
      across 100 distinct instances complete without deadlock or corruption)
      is portable as an ExUnit concurrent test against a real Postgres, using
      the Docker-based verification path docs/anti-patterns.md documents.
      If REQ-045 resolved to supervised processes, this requirement also
      verifies supervised isolation concretely: killing one instance's process
      must not affect any other instance, the property
      lib/letflow/process_instance.ex's moduledoc already claimed and
      lib/letflow/parallel_approval.ex's separate ApprovalSupervisor was
      structured to preserve. If REQ-045 resolved to row-based state, state
      that this half is not applicable rather than silently skipping it.
    acceptance_criteria:
      - "100 concurrent task completions across 100 distinct instances all succeed with no deadlock and no cross-instance corruption, run against a real Postgres with the actual test output quoted"
      - "two concurrent task completions on the SAME instance produce exactly one success and one conflict, run concurrently rather than sequentially"
      - "no global or table-level lock is held across instance boundaries anywhere in the engine's write paths -- confirmed by inspecting every lock acquisition in REQ-045/047/048/052's code and naming each one's scope in the moduledoc"
      - "after the concurrent run, every one of the 100 instances reconstructs (via REQ-053) to a state matching its own projection, proving no instance absorbed another's events or variables"
      - "if REQ-045 resolved to supervised processes, killing one instance's process leaves every other instance reachable and correct, demonstrated by a test; if it resolved to row-based state, the moduledoc states that explicitly instead"
    depends_on: [REQ-053]

  - id: REQ-056
    title: Service task configuration, retry classification and dispatch contract (service_task.zig, EXT-01)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 101  # letflow-queue task id
    description: >
      Port src/engine/service_task.zig (420 lines, R-Co's EXT-01) as
      Letflow.Engine.ServiceTask -- the engine-side half of SERVICE_TASK node
      execution.
      Port as pure functions (no I/O, testable without a network):
      - parse_config_from_node_attributes/1: builds a ServiceTaskConfig from a
      SERVICE_TASK node's attributes -- node_id, url_template, service_id,
      route_kind (inline_url | catalog_service), method (GET/POST/PUT/PATCH/
      DELETE), headers, timeout_ms (default 30000 per EXT-01, and REQ-029
      already validates the [1, 300000] range at definition time),
      retry_limit (default 3), body_template. When both a URL and a service_id
      are supplied, the URL is ignored and a
      BothUrlAndServiceIdProvidedUrlIgnored warning is recorded -- a warning,
      not an error.
      - validate_rendered_url/1: rejects a template that renders to an empty
      string (EXT-01 edge case: rejected at node activation, routed to
      REQ-061's EE-10 ERROR path).
      - classify_failure_kind/1 and is_retriable_failure/1: map an outcome to
      timeout | network | http_non_2xx | http_redirect_3xx | rate_limited_429
      | invalid_2xx_body | request_build_error. Two rules are easy to get
      wrong and are explicitly called out: a 3xx redirect is a FAILURE, never
      followed automatically (EXT-01 AC5), and a 429 is a failure that DOES
      retry (EXT-01 edge case).
      - compute_service_task_backoff_ms/3: exponential back-off with a base
      and a cap -- deterministic given (attempt_index, base, cap), so it is
      unit-testable without waiting.
      - decide_failure/3: given (kind, attempt_index, retry_limit), returns
      retry or give-up.
      - build_idempotency_key/N: so a retried dispatch is not a duplicate
      side effect.
      On an HTTP 2xx whose body is a JSON object, the body merges into
      instance variables via REQ-049's EE-09 merge; a 2xx body that is NOT a
      JSON object is NOT merged and routes to REQ-061's ERROR path (EXT-01
      AC1/AC2).
      SCOPE BOUNDARY -- state explicitly, do not paper over: the actual
      outbound HTTP transport is left INJECTABLE (a behaviour or a function
      passed in), not wired to a concrete client here. R-Co's
      executeHttpRequest() is the transport, and two of its downstream
      dependencies do not exist in Letflow: OBS-05's dead-letter queue
      (src/dlq/, S6 operational-cross-cutting -- EXT-01 AC4 requires an
      exhausted-retry invocation to land in the DLQ) and the service_catalog
      that route_kind catalog_service resolves against (src/repository/,
      S6 -- the same dependency REQ-031's moduledoc already flagged as
      missing). Port the classification/config/backoff logic against an
      injectable transport and injectable catalog lookup, exactly as REQ-031
      did for its ServiceCatalog/PluginRegistry gap, so this is testable and
      correct in isolation now, with real wiring deferred to the stage that
      builds those dependencies. Do NOT build a partial DLQ here.
    acceptance_criteria:
      - "parse_config_from_node_attributes returns a config with timeout_ms defaulting to 30000 and retry_limit defaulting to 3 when the node omits them, and records the BothUrlAndServiceIdProvidedUrlIgnored warning (not an error) when both url and service_id are present"
      - "an HTTP 3xx is classified as a failure and is never followed as a redirect, and an HTTP 429 is classified as a retriable failure -- two explicit tests, since both are easy to get backwards"
      - "each of the 7 failure kinds has an explicit test mapping an input condition to that kind, and is_retriable_failure/decide_failure are tested at attempt_index below, equal to, and above retry_limit"
      - "compute_service_task_backoff_ms grows exponentially with attempt_index and is clamped at the cap, verified across at least 4 successive attempt indices without any sleeping"
      - "a 2xx response whose body is a JSON object merges into instance variables via REQ-049's merge; a 2xx response whose body is a JSON array or a bare string does not merge and routes to REQ-061's ERROR path -- two explicit tests"
      - "a URL template rendering to an empty string is rejected at activation and routes to the ERROR path rather than dispatching a request"
      - "the moduledoc states explicitly that the HTTP transport and the service_catalog lookup are injectable interfaces, names OBS-05's DLQ (S6) as the unbuilt destination for exhausted retries, and confirms no partial DLQ was built here"
      - "an exhausted-retry outcome (decide_failure returning give-up) is demonstrated routing into REQ-061's set_instance_error rather than writing its own ERROR transition, confirmed by inspection and by test -- this closes REQ-061's own AC obligation, deferred forward because REQ-056 did not exist when REQ-061 was built"
    depends_on: [REQ-061]

  - id: REQ-057
    title: Plugin handler interface and registry contract (plugin_interface.zig + plugin_registry.zig, EXT-03)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 102  # letflow-queue task id
    description: >
      Port src/engine/plugin_interface.zig (79 lines, the stable handler type)
      and src/engine/plugin_registry.zig (232 lines, the registration and
      resolution table) as Letflow.Engine.PluginInterface and
      Letflow.Engine.PluginRegistry -- R-Co's EXT-03.
      - The handler contract: a handler receives a PluginExecutionContext
      (instance_id, definition_id, node_id, node_type, instance variables,
      node config, trace_id) and returns exactly one of two outcomes --
      COMPLETE (with optional output variables) or ERROR (with a reason
      string) (EXT-03 AC2). In Elixir this is a behaviour with a callback
      returning a tagged tuple, which is the idiomatic equivalent of R-Co's
      function-pointer union; note that mapping in the moduledoc.
      - A handler that CRASHES is treated as an ERROR outcome and routed to
      REQ-061's EE-10 path (EXT-03 AC3). R-Co catches a panic; on the BEAM the
      idiomatic equivalents are a try/rescue-and-catch around the call or
      running the handler in a monitored Task so an exit is observable rather
      than propagating. Do not silently assume a bare try/rescue is enough --
      it does not cover a process exit, the same gap REQ-040 already
      documented for sandbox teardown.
      - register_plugin_handler/1: rejects a duplicate node_type, an invalid
      node_type, a nil handler, an incompatible API version, and registration
      after the registry is frozen -- each a distinct, pattern-matchable
      error, matching plugin_registry.zig's PluginRegistrationError set.
      - Registration is startup-only with no dynamic loading at runtime
      (EXT-03 AC4): freeze_plugin_registry/1 makes the registry immutable, and
      any registration afterwards fails.
      - resolve_node_handler_kind: a plugin registered for a node_type that
      also has a built-in handler takes PRECEDENCE; the built-in is shadowed
      (EXT-03 edge case).
      - SVC-02 scoping: a registration carries scope global or tenant. A
      tenant-scoped registration REQUIRES an owner_tenant_id and a global one
      must NOT have one (plugin_registry.zig's
      TenantScopedPluginRequiresOwnerId / GlobalPluginMustNotHaveOwnerId
      errors), and resolve_plugin_handler_for_tenant/2 honours that scoping.
      This is also the PluginRegistry dependency REQ-031's moduledoc named as
      missing ("plugin_registry.zig belongs to src/engine/ (S3
      instance-engine, not yet ported)") -- so this requirement should also
      wire REQ-031's injectable plugin-lookup callback to this real registry,
      or state explicitly why it does not yet.
      SCOPE BOUNDARY -- state explicitly: this is the REGISTRY CONTRACT only.
      The WASM plugin host that would actually execute third-party plugin code
      (R-Co's src/wasm/, 19 files) is S5 (scripting-and-plugins) and needs its
      own build-vs-bind decision record first, per
      docs/migration/stage-5-scripting-plugins.md. S3 defines the behaviour
      and the registry; S5 supplies runtime-hosted implementations of it.
      In-process Elixir modules implementing the behaviour are the only
      handlers S3 supports.
      OPEN QUESTION (flag, do not silently resolve): where the registry lives.
      R-Co uses a process-local struct plus a global singleton
      (registerGlobalPluginHandler / resolveGlobalPluginHandler). A frozen,
      startup-populated, read-mostly lookup table is a textbook fit for
      :persistent_term or a compile-time module, and is also exactly one of
      the cases stage-3-instance-engine.md's second Early finding names as
      where a supervised process's value IS strongest ("service task dispatch,
      plugin registries"). Those two readings point different ways, so do not
      pre-decide: port the register/freeze/resolve CONTRACT and leave the
      concrete mechanism (GenServer, :persistent_term, ETS, Application env)
      to CODE-DESIGNER, citing that finding.
    acceptance_criteria:
      - "a registered handler is invoked with a context carrying instance_id, definition_id, node_id, node_type, instance variables, node config and trace_id, and returning COMPLETE with output variables merges them via REQ-049's merge"
      - "a handler returning ERROR routes the instance to REQ-061's EE-10 ERROR path with the handler's reason string preserved in the EXECUTION_ERROR event"
      - "a handler that raises, and a handler that exits, are BOTH treated as ERROR outcomes rather than propagating -- two explicit tests, since a bare try/rescue passes the first and fails the second"
      - "each of the registration errors (duplicate node_type, invalid node_type, nil handler, incompatible API version, registration after freeze) is a distinct pattern-matchable error with its own test"
      - "a tenant-scoped registration without an owner_tenant_id and a global registration with one are both rejected with their own distinct errors, and resolution for tenant B does not return tenant A's tenant-scoped handler"
      - "a plugin registered for a node_type that also has a built-in handler shadows the built-in, demonstrated by an explicit test"
      - "the moduledoc states that the WASM plugin host is S5 scope and that S3 supports only in-process Elixir behaviour implementations, and names the registry-storage mechanism as an open question left for CODE-DESIGNER"
      - "a handler ERROR outcome is demonstrated routing into REQ-061's set_instance_error rather than writing its own ERROR transition, confirmed by inspection and by test -- this closes REQ-061's own AC obligation, deferred forward because REQ-057 did not exist when REQ-061 was built"
    depends_on: [REQ-061]

  - id: REQ-058
    title: Lua script execution audit persistence path (lua_script_audit.zig, LUA-07 minimal path)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 103  # letflow-queue task id
    description: >
      Port src/engine/lua_script_audit.zig (201 lines, R-Co's ISS-0176/GH#504
      -- LUA-07's second acceptance criterion) as
      Letflow.Engine.LuaScriptAudit, plus its lua_script_execution_audit
      migration and Ecto.Schema module (schema-per-tenant per REQ-022).
      What this is: a MINIMAL, deliberately narrow engine-side call path that
      (a) invokes a script executor and (b) persists the resulting
      manifest_hash to a queryable audit record. R-Co's own file header is
      unusually explicit about the narrowness, and porting it without carrying
      that framing across would misrepresent what ships: "It is **not** the
      SERVICE_TASK script-execution handler and must not be called from
      processServiceTaskRuntimeInTx or any other normal process-execution
      flow... The general SERVICE_TASK-with-script integration described in
      src/design/lua-integration.md section 25 remains unbuilt; when it lands,
      that work supersedes this function rather than building on it." Carry
      that statement into the Elixir moduledoc verbatim in substance -- a
      future reader must not mistake this for the real scripting integration.
      - execute_script_for_audit/N: validates the instance_id BEFORE invoking
      the executor (R-Co's own ordering rationale: the function's entire
      purpose is producing an ATTRIBUTABLE audit row, so an unparseable
      instance_id is rejected up front rather than after a script has already
      run), invokes the executor, and writes the audit row carrying at minimum
      instance_id, manifest_hash, actor_id and a timestamp.
      - The registered_hash parameter versus the executed manifest's hash: a
      mismatch is a distinct, pattern-matchable error, not a silently-recorded
      row -- this is the whole point of persisting a manifest hash.
      SCOPE BOUNDARY -- state explicitly, this is the S3/S5 line: the LUA
      EXECUTION RUNTIME ITSELF is S5 (scripting-and-plugins). R-Co's file
      imports ../lua/executor.zig, ../lua/manifest.zig and ../lua/errors.zig
      -- all three are in src/lua/ (29 files), which
      docs/migration/stage-5-scripting-plugins.md scopes to S5 and which
      explicitly needs its own build-vs-bind decision record (Elixir NIF/Port
      wrapping a real Lua runtime vs. reimplementing) before its requirements
      are expanded. S3 therefore ports the AUDIT PERSISTENCE PATH against an
      INJECTED executor interface (a behaviour with an execute-with-manifest
      callback), exactly the injectable-lookup pattern REQ-031 established for
      its own missing dependencies -- so the audit path is testable and
      correct in isolation now with a test-double executor, and S5 supplies
      the real Lua host later. Do NOT add a Lua dependency to mix.exs in this
      requirement, and do NOT pre-empt S5's build-vs-bind decision by
      implicitly choosing a runtime.
    acceptance_criteria:
      - "priv/repo/migrations gains a lua_script_execution_audit migration, schema-per-tenant per REQ-022, applying cleanly against a provisioned tenant schema"
      - "execute_script_for_audit with a test-double executor writes exactly one audit row carrying instance_id, manifest_hash, actor_id and a timestamp, verified by reading the row back"
      - "an unparseable or absent instance_id is rejected BEFORE the injected executor is invoked, demonstrated by a test-double that records whether it was called at all"
      - "a manifest hash differing from the supplied registered_hash returns a distinct, pattern-matchable mismatch error and writes no audit row"
      - "mix.exs gains no Lua/NIF dependency, and the moduledoc states that the Lua execution runtime is S5 scope pending stage-5-scripting-plugins.md's build-vs-bind decision record"
      - "the moduledoc carries R-Co's own narrowness statement in substance: this is not the SERVICE_TASK script-execution handler, must not be called from normal process-execution flow, and will be superseded (not extended) by the real scripting integration when it lands"
      - "a missing, nil, or empty prefix fails closed with a distinct error and writes no audit row, demonstrated by a test-double executor confirmed not to have been called"
    depends_on: [REQ-045]

  - id: REQ-059
    title: Dependency pin resolution, recording and inheritance (pin_resolver.zig, PIN-01/02/03/04)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 104  # letflow-queue task id
    description: >
      Port src/engine/pin_resolver.zig (967 lines, R-Co's PIN-01..PIN-04) as
      Letflow.Engine.PinResolver -- the mechanism that freezes every versioned
      dependency an instance uses at start time, so a running instance is
      never silently upgraded by a catalog change underneath it.
      - resolve/N (PIN-01): enumerates every versioned reference in the
      definition snapshot and resolves each to a PinnedVersion entry
      {kind, ref, resolved_id, version, source} with kind in catalog_entry |
      variable_schema | module and source in resolved | override | inherited.
      Resolution completes BEFORE the instance row is written, so a failed
      resolution writes no partial instance (PIN-01 AC1/AC4). pinned_versions
      is ordered by kind then ref, so two starts of the same definition
      against the same catalog produce byte-identical payloads (PIN-01 AC5) --
      deterministic ordering is load-bearing, not cosmetic.
      - Initial variables violating the resolved variable_schema version are
      rejected with a distinct VariableSchemaViolation-equivalent listing each
      failing field (PIN-01 AC3), reusing REQ-024's validator.
      - Recording (PIN-02): the resolved pin set is written as the
      pinned_versions field of the INSTANCE_STARTED event payload, appended in
      the SAME transaction as REQ-045's instance row insert. The EVENT LOG is
      the record of record -- no side table stores pins (PIN-02 AC3). If the
      INSTANCE_STARTED append fails, the whole thing rolls back so no
      committed instance has an unrecorded pin set (PIN-02 AC2). A definition
      with zero catalog and zero module references still records exactly one
      variable_schema entry (PIN-02 AC4).
      - No fallback (PIN-03): a reference with no pin entry raises a distinct
      PinMissing error naming the reference, and NO code path substitutes the
      current active version for a missing or unresolvable pin (PIN-03 AC1/
      AC5). A newer catalog version published mid-flight does not affect an
      in-flight instance (PIN-03 AC2). R-Co's PIN-03 AC4 routes an exhausted
      PinMissing retry budget to the dead-letter queue -- OBS-05's DLQ is S6,
      the same gap REQ-056 flagged; leave a named hook rather than a partial
      DLQ.
      - Replay and inheritance (PIN-04): REQ-053's reconstruction reads the
      effective pin set from INSTANCE_STARTED plus the most recent
      INSTANCE_PINS_REBOUND event, NEVER from a live catalog (PIN-04 AC1/AC5)
      -- this is what makes replay deterministic. merge_effective_pins/N
      computes that effective set. A sub-process child instance inherits its
      parent's pin set and adds entries only for references the parent does
      not carry, with inherited entries marked source: inherited (PIN-04 AC2);
      a child reference resolving to a version differing from an inherited pin
      uses the INHERITED pin and records the conflict in the child's
      INSTANCE_STARTED payload (PIN-04 AC3) -- inheritance wins, which is easy
      to get backwards.
      SCOPE BOUNDARY: GET /api/v1/instances/{id}/pins (PIN-04 AC4) is S4
      (api-surface); this requirement exposes the effective-pin-set function
      the route will call, including the source event identifier per entry.
      SCOPE GAP -- carry R-Co's own scoping forward explicitly rather than
      re-discovering it: PIN-01 AC1 (service_catalog version resolution) and
      AC2 (module_ref resolution against PLC-01), and PIN-03 AC3 (execution
      proceeds on a pinned version after that version is DEPRECATED), are NOT
      satisfiable in Letflow, for the same reason they are unsatisfied in R-Co
      itself -- R-Co holds PIN-01 and PIN-03 at TESTED rather than RELEASED
      over exactly this, tracked there as ISS-0672/GH-306, because
      service_catalog has no version/status column and PLC-01 (the process
      module catalog) does not exist. In Letflow the gap is wider still:
      src/repository/ (service_catalog) is S6 and PLC-01 is unscoped to any
      stage. Scope this requirement to the variable_schema branch plus the
      resolution/ordering/recording/inheritance MACHINERY against an
      injectable catalog and module lookup -- the same pattern REQ-031 used
      for its identical missing-catalog gap -- and have unresolvable
      references return distinct UnresolvedCatalogRef / UnresolvedModuleRef
      errors rather than a silent no-op or a stub that pretends to resolve.
      Name this gap in the moduledoc, with the future stage each dependency
      belongs to.
    acceptance_criteria:
      - "resolve returns pinned_versions ordered by kind then ref, and two resolutions of the same definition against the same injected lookups produce byte-identical output, demonstrated by an explicit test comparing serialised payloads"
      - "a failed resolution writes zero rows -- no instance_projections row, no instance_definition_snapshots row, no events row -- verified by reading all three back after a deliberately unresolvable reference"
      - "initial variables violating the resolved variable_schema are rejected with an error listing each failing field, using REQ-024's validator rather than a second implementation"
      - "the INSTANCE_STARTED event payload carries the pinned_versions entries, and a definition with zero catalog and zero module references still records exactly one variable_schema entry; no separate pin table exists anywhere in priv/repo/migrations"
      - "a reference with no pin entry returns a distinct PinMissing error naming the reference, and no code path anywhere in the module queries a catalog for a current/latest version as a fallback -- confirmed by inspection and stated in the moduledoc"
      - "a child instance started from a parent inherits the parent's pins with source: inherited, and a child reference resolving to a different version than an inherited pin uses the INHERITED version while recording the conflict in the child's INSTANCE_STARTED payload"
      - "reconstruction via REQ-053 derives the effective pin set from INSTANCE_STARTED (plus INSTANCE_PINS_REBOUND when present) and issues zero reads against any catalog or module registry, demonstrated by an injected lookup that records whether it was called"
      - "the moduledoc names the service_catalog (S6) and PLC-01 (unscoped) dependency gap explicitly, cites R-Co's own ISS-0672/GH-306 precedent for holding PIN-01/PIN-03 partially unmet, and states that unresolvable references return typed errors rather than stubs"
    depends_on: [REQ-045, REQ-053]

  - id: REQ-060
    title: Explicit instance pin rebind (pin_rebind.zig, PIN-05)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 105  # letflow-queue task id
    description: >
      Port src/engine/pin_rebind.zig (388 lines, R-Co's PIN-05) as
      Letflow.Engine.PinRebind.rebind_pins/N -- the SOLE write path to an
      instance's effective pin set after INSTANCE_STARTED (PIN-05 AC5). Its
      whole reason to exist is that pins are otherwise immutable: no scheduled
      job, catalog publication or definition promotion may change a running
      instance's pins, so there is exactly one deliberate, audited, explicit
      way to change them.
      - Takes explicit {kind, ref, version} entries plus a MANDATORY reason.
      A request with no reason, an empty entries list, or a malformed entry is
      rejected with a distinct invalid-input error (PIN-05 AC4).
      - Validates every named ref exists in the instance's CURRENT effective
      pin set (via REQ-059's merge_effective_pins). A ref absent from that set
      returns a distinct UnknownPinRef error and applies NONE of the entries
      in the request (PIN-05 AC2) -- all-or-nothing, so a partially-applied
      rebind is impossible.
      - Rejects a terminal instance (COMPLETED, CANCELLED, or ERROR) with a
      distinct InstanceNotRebindable error (PIN-05 AC3). Note the naming
      mismatch R-Co's own file documents: PIN-05's requirement text says
      "FAILED" but instance.zig's InstanceStatus enum has no FAILED variant --
      the codebase's ERROR status is the one meant. Letflow's own status enum
      (REQ-023/REQ-043) likewise has ACTIVE/COMPLETED/CANCELLED/ERROR and no
      FAILED, so treat ERROR as terminal for rebind purposes and say so in the
      moduledoc rather than leaving a reader to wonder whether a status is
      missing.
      - On success, appends exactly one INSTANCE_PINS_REBOUND event carrying
      {ref, prior_version, new_version, actor, reason} per CHANGED entry,
      atomically (PIN-05 AC1). An entry whose requested version equals the
      current pinned version is not a change and contributes no payload entry.
      - Concurrency: R-Co uses SELECT FOR UPDATE NOWAIT and surfaces
      contention as a distinct ConcurrentModification error rather than
      blocking, matching its CompleteTaskError convention. Port that
      convention -- REQ-055's zero-cross-instance-contention rule applies here
      too.
      SCOPE BOUNDARY: POST /api/v1/instances/{id}/rebind-pins is S4
      (api-surface). R-Co's pin_rebind.zig maps its errors to HTTP 422/409/404
      in its own doc comments; this requirement returns the tagged tuples and
      S4 owns the status mapping, the same boundary REQ-048 and REQ-045 set.
    acceptance_criteria:
      - "a valid rebind on a running instance appends exactly one INSTANCE_PINS_REBOUND event carrying ref, prior_version, new_version, actor and reason for each CHANGED entry, and an entry whose requested version already matches contributes no payload entry"
      - "a rebind naming a ref absent from the current effective pin set returns a distinct UnknownPinRef error and applies NONE of the entries -- verified by reading the effective pin set back and confirming it is unchanged, including for the entries that were individually valid"
      - "a rebind against a COMPLETED, CANCELLED or ERROR instance returns a distinct InstanceNotRebindable error, with each of the three statuses tested"
      - "a rebind with a missing or empty reason, an empty entries list, and a malformed entry each return a distinct invalid-input error"
      - "after a rebind, REQ-059's effective pin set reflects the new versions and REQ-053's reconstruction derives the same set from INSTANCE_STARTED plus INSTANCE_PINS_REBOUND, with no catalog read"
      - "lock contention surfaces as a distinct ConcurrentModification error rather than blocking, and the moduledoc states that ERROR (not a non-existent FAILED status) is the terminal status PIN-05's text refers to"
    depends_on: [REQ-059]

  - id: REQ-061
    title: Execution error handling (instance.zig setInstanceError, EE-10)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 97  # letflow-queue task id
    description: >
      Port src/engine/instance.zig's InstanceStore.setInstanceError() (per
      src/design/engine.md "Section EE-10: Execution Error Handling", L4571)
      as set_instance_error/N -- the single, shared path every engine-internal
      failure funnels into. Split out of REQ-052 (which keeps EE-08
      cancellation): EE-08 is caller-initiated and drives to a terminal
      CANCELLED, while this requirement is engine-internal and halts the
      instance NON-terminally at ERROR, pending an operator retry or discard.
      - Sets status to ERROR and appends an EXECUTION_ERROR event atomically
      (EE-10 AC4), carrying error type, the affected node or field, a
      human-readable reason, AND the instance variable state at the time of
      the error (EE-10 AC1/AC5 -- an operator must be able to diagnose without
      replaying the instance, so the variable snapshot is load-bearing, not
      optional decoration).
      - This is deliberately a shared sink with several callers, which is why
      it is its own requirement rather than duplicated logic in each: REQ-050's
      no-matching-gateway-edge-and-no-default case, REQ-049's
      schema-violation-on-merge case, REQ-056's exhausted-service-task-retries
      case, REQ-057's plugin-ERROR-outcome case, and REQ-062's four SPC-01
      sub-process interface violations. Each caller supplies its own error
      type and affected node; the transition-to-ERROR, the event shape, and
      the atomicity are this requirement's. R-Co models exactly this as a
      single setInstanceError() with a SetInstanceErrorArgs struct and an
      error-code mapping (instance.zig ~L3078, with the code table at ~L4067)
      -- port that shape rather than scattering ad-hoc error writes.
      - An instance in ERROR rejects task completion with a distinct conflict
      error (EE-10 AC2) and STAYS in ERROR until an operator retries or
      discards it (EE-10 AC3). That operator retry/discard path is R-Co's
      OBS-05 dead-letter API (src/dlq/, S6 operational-cross-cutting plus S4's
      route layer) -- explicitly out of this stage's scope. Leave a named hook
      and state the boundary; do NOT build a partial DLQ.
      - Two concurrent operations that both trigger EE-10 on one instance: the
      first to commit wins, the second sees status ERROR and is rejected
      (EE-10 edge case).
      - ERROR is NOT terminal in the way CANCELLED and COMPLETED are: REQ-060's
      pin rebind treats it as non-rebindable and REQ-052's cancellation treats
      CANCELLED/COMPLETED as already-finished, but an operator action can
      still move an instance out of ERROR once S6 lands. State that
      distinction explicitly in the moduledoc -- reading ERROR as terminal is
      the easy mistake, and REQ-023's status enum already carries all four
      values.
    acceptance_criteria:
      - "an EXECUTION_ERROR event carries error type, affected node or field, a human-readable reason, and the instance variable map as it stood at the moment of the error -- all four verified by reading the event payload back"
      - "the status flip to ERROR and the EXECUTION_ERROR append commit together: forcing the append to fail leaves the instance status unchanged, verified by reading both back"
      - "an instance in ERROR rejects task completion with a distinct conflict error and remains in ERROR afterwards"
      - "both calling paths that already exist at this requirement's own build time (REQ-049 schema violation, REQ-050 gateway no-match) are demonstrated routing into this one function rather than writing their own ERROR transition, confirmed by inspection and by test"
      - "the moduledoc states explicitly that REQ-056 (exhausted retries), REQ-057 (plugin ERROR) and REQ-062 (sub-process interface violation) do not exist yet at this requirement's build time and so cannot be verified here, and that each of them -- all three depends_on this requirement -- MUST independently demonstrate its own routing into set_instance_error as part of its OWN acceptance criteria when it is later built; the obligation is deferred forward onto those requirements, not dropped"
      - "two concurrent operations both triggering EE-10 on the same instance result in exactly one committed EXECUTION_ERROR and one rejection, run concurrently rather than sequentially"
      - "the moduledoc names OBS-05's dead-letter retry/discard path (S6/S4) as the out-of-scope operator action, confirms no partial DLQ was built, and states that ERROR is non-terminal in a way CANCELLED and COMPLETED are not"
    depends_on: [REQ-048, REQ-050]

  - id: REQ-062
    title: Sub-process invocation runtime half (instance.zig SPC-01 -- child start, parent-token wait, completion propagation)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 106  # letflow-queue task id
    description: >
      Port SPC-01's RUNTIME half from src/engine/instance.zig -- the half
      shipped REQ-032 explicitly deferred to this stage. REQ-032's own
      description and acceptance criteria state that SPC-01 "belongs to S3
      (src/engine/ port) since it requires a running instance/token model that
      doesn't exist yet" and name src/engine/instance.zig as its future
      integration point; REQ-032 ported only the SPC-02 definition-time half
      (parse_interface, validate_schema_shape). This requirement closes that
      loop. Two requirements in this same batch already presuppose it:
      REQ-044 ports Token.waiting_child_instance_id, and REQ-059 AC6 requires
      child-instance pin inheritance -- neither has a child-creation path to
      hang off without this.
      Port (R-Co source paths verified directly against
      src/engine/instance.zig and src/engine/transition.zig):
      - Child instance creation: createWithParentInheritance() (~L562, whose
      own comment states it is "called only from
      startSubProcessesForPendingEventsInTx() -- never exposed on the public
      API surface"), driven by startSubProcessesForPendingEventsInTx()
      (~L4668). Port that same non-public shape: sub-process child creation is
      an internal engine path, not a second public start entry point
      alongside REQ-045's create/1.
      - The sub_process_start PendingEvent that REQ-044's transition kernel
      emits when a token enters a SUB_PROCESS node (transition.zig's
      processNodeEntry SUB_PROCESS branch, which returns early if the parent
      token is already waiting on a child), and its consumption here.
      - The parent-token wait: the token's waiting_child_instance_id is set
      while the child runs and cleared on the sub_process_completed event
      (transition.zig ~L897 handles that event; the token-copy note at ~L678
      records a real bug, R-Co's GH #428, where waiting_child_instance_id was
      dropped during token copying -- port the field preservation carefully,
      since losing it silently strands the parent forever).
      - buildSubProcessChildInitialVars() (~L4544): SPC-01's input filtering.
      When the SUB_PROCESS node declares an interface, ONLY the named inputs
      are copied into the child's initial variable map, each validated against
      its json_schema first; when it declares none, EXT-05 behaviour applies
      unchanged (the full parent variable map is copied). Use REQ-032's
      already-shipped parse/validate functions for the interface itself rather
      than re-parsing it.
      - Completion propagation: on child COMPLETED, only the variables named
      in interface.outputs merge into the parent per REQ-049's EE-09 merge;
      every other variable the child produced is DISCARDED, not merged. With
      no declared interface, the full child map merges back (EXT-05).
      - The four SPC-01 failure modes, each a distinct error routing into
      REQ-061's EE-10 path (instance.zig's error enum at L258-272 and the code
      mapping at L4147-4155): SUB_PROCESS_MISSING_REQUIRED_INPUT,
      SUB_PROCESS_INPUT_SCHEMA_VIOLATION (both at activation -- the parent
      goes to ERROR and NO child instance is created, so no orphan),
      SUB_PROCESS_MISSING_REQUIRED_OUTPUT, SUB_PROCESS_OUTPUT_SCHEMA_VIOLATION
      (both at completion -- the parent goes to ERROR and the merge is not
      applied, not partially applied).
      RELATIONSHIP TO REQ-059: a child instance inherits its parent's pin set
      (PIN-04 AC2/AC3), which REQ-059 already specifies -- and
      createWithParentInheritance() is the function that carries it. This
      requirement owns child creation and the interface contract; REQ-059 owns
      what the pin entries contain and how conflicts are recorded. Neither
      should re-implement the other's half; state the seam in the moduledoc.
      SCOPE BOUNDARY: R-Co's EE-08 documents that cancelling a parent does NOT
      cancel its child -- port that documented behaviour rather than inventing
      a cascade. No HTTP surface is added: sub-processes are started by the
      engine, never by a route. There is no public sub-process start endpoint
      to defer to S4 in the first place -- say so in the moduledoc, so a later
      reader does not go looking for one.
    acceptance_criteria:
      - "a token entering a SUB_PROCESS node with a declared interface creates exactly one child instance whose initial variable map contains ONLY the declared inputs -- a parent variable not named in inputs is demonstrably absent from the child"
      - "a SUB_PROCESS node with no declared interface copies the full parent variable map to the child (EXT-05 behaviour preserved), demonstrated by an explicit test alongside the filtered case"
      - "each of the four SPC-01 failure modes has its own test and its own distinct error: the two activation failures leave ZERO child instances created (verified by counting instance rows), and the two completion failures leave the parent's variable map unmodified (no partial merge)"
      - "on child completion with a declared interface.outputs, only the named outputs merge into the parent via REQ-049's merge, and a child variable not named in outputs is demonstrably absent from the parent afterwards"
      - "the parent token's waiting_child_instance_id is set while the child runs and cleared on completion, and it survives a transition that copies tokens for an unrelated reason -- an explicit regression test for R-Co's GH #428 field-dropping bug"
      - "child instance creation is not reachable through REQ-045's public create/1 path, matching R-Co's internal-only createWithParentInheritance shape, confirmed by inspection and stated in the moduledoc"
      - "cancelling a parent instance does not cancel its running child, matching R-Co's documented EE-08 behaviour, demonstrated by an explicit test rather than assumed"
      - "each of the four SPC-01 failure modes is demonstrated routing into REQ-061's set_instance_error rather than writing its own ERROR transition, confirmed by inspection and by test -- this closes REQ-061's own AC obligation, deferred forward because REQ-062 did not exist when REQ-061 was built"
    depends_on: [REQ-061, REQ-049, REQ-032]

  - id: REQ-063
    title: Move users/groups/tenant_role behind :prefix (identity tables schema-per-tenant)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 130  # letflow-queue task id
    description: >
      Execute Decision 0006's D1
      (docs/migration/decisions/0006-identity-tables-schema-per-tenant.md):
      relocate REQ-015's users, groups and tenant_role tables out of the public
      default schema and into each tenant's own Postgres schema, via the same
      :prefix mechanism and the same TenantProvisioning.tenant_scoped_migrations/0
      registry every business table already uses. This resolves the open question
      lib/letflow/design/req022-tenant-schema-provisioning.md section 7 has held
      open since REQ-022, and which identity-schema.md section 1 originally
      deferred.
      READ FIRST, IN FULL, BEFORE ANY CODE: decision 0006 (all of it, but
      section 3 especially), decision 0003 Dimension B plus its 2026-08-17
      Addendum, and req022-tenant-schema-provisioning.md sections 3.4/4/7.
      Section 4 of REQ-022's design is mandatory reading -- every migration this
      requirement writes MUST carry its prefix()-truthiness guard, or a plain
      mix ecto.migrate silently creates stray public-schema tables.
      THE SECURITY-SENSITIVE CORE is decision 0006 section 3: moving users
      per-schema changes the meaning of TWO shipped unique indexes.
      unique_index(:users, [:username]) becomes per-tenant rather than global
      (deliberate -- globally-unique usernames across tenants is a
      multi-tenancy defect, see 0006 section 3.1). The partial index
      users_external_identity_partial_index on (external_realm, external_id)
      likewise becomes per-tenant; 0006 section 3.2 argues the global
      one-OIDC-identity-per-user guarantee is RELOCATED to
      tenants_idp_realm_id_partial_index rather than lost, because a realm binds
      to exactly one tenant immutably. That argument must be independently
      re-derived by SECURITY-REVIEWER, not accepted on this requirement's say-so.
      Also record in the users migration header the pre-existing divergence 0006
      section 3.2 documents: 0003 line 132 and identity.ex:41 both describe the
      JIT upsert key as (tenant_id, external_realm, external_id) while the
      shipped index omits tenant_id -- this requirement closes that divergence
      rather than introducing a weakening.
      ORDERING IS NOT OPTIONAL (0006 section 4): register the three tables in
      tenant_scoped_migrations/0 with the section-4 guard; replay migrations
      across every registered tenant schema; copy each public row into the
      schema its tenant_id names (the last legitimate read of that column);
      drop the three public tables as a separate guarded step following
      GBL-112's precedent. Dropping tenant_id from users/groups is NOT this
      requirement -- it is REQ-064, and it must come after this one.
      tenant_role needs no constraint redesign: its own migration header
      (20260816000003) already anticipates this exact move and states its name
      index becomes unique-per-tenant-schema automatically.
      SCOPE BOUNDARY: this requirement does not touch AuthPipeline's step
      ordering -- 0006 section R5 verifies the existing realm -> tenant -> user
      order already resolves the tenant before any users query, so no pipeline
      rework is needed. It does not build 0006's D4 cross-tenant reporting
      mechanism. It does not drop any tenant_id column.
    acceptance_criteria:
      - "users, groups and tenant_role each exist inside at least two distinct provisioned tenant schemas, confirmed by querying information_schema.tables scoped to each schema name, and the same query returns false for the public schema after the cutover step"
      - "each of the three migrations carries REQ-022 section 4's prefix()-truthiness guard, demonstrated by running a plain mix ecto.migrate against a clean database and confirming ZERO of the three tables appears in the public schema"
      - "two users with the same username can be created in two different tenant schemas without a constraint violation, and a duplicate username within a single tenant schema still raises one -- both demonstrated by explicit tests"
      - "the same (external_realm, external_id) pair cannot be bound to two tenants, demonstrated by a test that attempts to bind one realm to a second tenant and is rejected by tenants_idp_realm_id_partial_index"
      - "existing public-schema rows are copied into the correct per-tenant schema before the public tables are dropped, verified by row-count equality per tenant plus a spot-check that a specific known user landed in the schema its tenant_id named"
      - "AuthPipeline's full flow (token -> realm -> tenant -> per-schema user lookup/JIT provisioning) passes end to end against a per-tenant users table, demonstrated by an existing-or-new test exercising the plug, not by inspection"
      - "mix test is green with no skipped or excluded identity tests, and the actual output is quoted in the completion report"
    depends_on: []

  - id: REQ-064
    title: Drop tenant_id from schema-isolated tables (Decision 0006 D2)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 131  # letflow-queue task id
    description: >
      Execute Decision 0006's D2
      (docs/migration/decisions/0006-identity-tables-schema-per-tenant.md):
      drop the tenant_id column from every table whose isolation boundary is the
      Postgres schema itself, and remove the write-path machinery that populates
      it. MUST run after REQ-063 -- users and groups are only eligible for the
      drop once they are per-schema tables.
      READ FIRST: decision 0006 in full (sections R1-R3 for why the column goes,
      section 5 for the consumer inventory, section 6 for exactly what of
      decision 0003 this supersedes and what it deliberately leaves standing).
      Decision 0003's Dimension B and its Addendum are the records being
      partially superseded -- read both so the moduledoc/migration comments this
      requirement writes describe the new state accurately rather than
      contradicting a record that still stands in part.
      TABLES LOSING THE COLUMN (ten): events, events_archive,
      instance_projections, process_definitions, tokens, tasks,
      promotion_reviews, promotion_assertion_runs (all already schema-isolated),
      plus users and groups (schema-isolated by REQ-063).
      TABLES THAT KEEP IT -- DO NOT TOUCH (decision 0006 D3): tenant_schemas,
      solution_pack_installs, solution_pack_artefact_bases,
      pack_update_resolutions. On these four, tenant_id is a real
      references(:tenants) foreign key on a structurally-global public-schema
      table and is the only scoping the row has. Dropping it there would be a
      data-model break, not a cleanup. tenant_role never had the column.
      TWO COMPOSITE INDEXES SIMPLIFY, and the second carries a contract:
      promotion_reviews' unique_index([:tenant_id, :plan_digest]) becomes
      unique_index([:plan_digest]), and promotion_assertion_runs'
      unique_index([:tenant_id, :idempotency_key]) becomes
      unique_index([:idempotency_key]). Both are semantically identical inside a
      per-tenant schema (a leading tenant_id has at most one distinct value
      there -- the shipped migration headers for events_archive and
      process_definitions say so themselves). The assertion-runs one backs an
      idempotency contract consumed via Repo.insert(on_conflict: :nothing,
      conflict_target: ...) -- restate that contract in the new migration's
      header and update every conflict_target that names tenant_id.
      CODE CONSUMERS (decision 0006 section 5, verified inventory): roughly 13
      TenantProvisioning.tenant_id_for_schema_name/1 call sites exist purely to
      stamp the column -- 8 in lib/letflow/definitions.ex, 4 in
      lib/letflow/event_store.ex, 1 in
      lib/letflow/definitions/promotion_review_store.ex. Sites that bind
      {:ok, _tenant_id} and discard it are validating the prefix string's shape,
      not stamping; decide per-site whether that validation is still wanted (a
      valid_prefix?/1-style guard) or removable, and say which in the moduledoc.
      DO NOT DELETE tenant_id_for_schema_name/1 itself -- REQ-063's data copy
      needs it and decision 0006 D4's future reporting mechanism may. Only its
      stamping call sites go.
      Ten schema modules drop field(:tenant_id, Ecto.UUID) and its
      cast/validate_required entries: Engine.Task, Engine.Token,
      EventStore.Event, EventStore.ArchivedEvent, EventStore.InstanceProjection,
      Definitions.ProcessDefinition, Definitions.PromotionReview,
      Definitions.PromotionAssertionRun, Identity.User, Identity.Group.
      Moduledoc blocks in Engine.Task and Engine.Token ("tenant_id is never
      caller-supplied") and Identity.User ("intra-schema column per Decision B")
      document a column that will no longer exist and must be removed with it,
      not left describing a field that is gone.
      SCOPE BOUNDARY: does not build decision 0006 D4's cross-tenant reporting
      mechanism (no consumer exists; a future requirement owns it). Does not
      revisit Decision B's schema-per-tenant isolation choice, which 0006
      section 6 explicitly leaves standing. Does not add a session-GUC tenant
      context.
    acceptance_criteria:
      - "none of the ten named tables has a tenant_id column, confirmed by querying information_schema.columns scoped to a provisioned tenant schema rather than by inspection"
      - "all four D3 tables (tenant_schemas, solution_pack_installs, solution_pack_artefact_bases, pack_update_resolutions) still have tenant_id WITH its references(:tenants) foreign key intact, confirmed by the same information_schema query plus a test that a bad tenant_id is still rejected by the FK"
      - "the promotion_assertion_runs idempotency contract still holds with the simplified single-column index: inserting the same idempotency_key twice within one tenant schema yields one row, and the same key in a different tenant schema yields a separate row -- both demonstrated by explicit tests"
      - "the promotion_reviews plan_digest uniqueness still holds per-tenant under the simplified index, demonstrated the same way"
      - "no lib/ module references a tenant_id field on any of the ten tables, confirmed by grep, and TenantProvisioning.tenant_id_for_schema_name/1 itself still exists and is still tested"
      - "every moduledoc that described tenant_id on a dropped-from table has been updated rather than left describing a nonexistent field, confirmed by grep for the phrase 'never caller-supplied' and 'intra-schema column'"
      - "mix test is green with no skipped or excluded tests, and the actual output is quoted in the completion report"
    depends_on: [REQ-063]


  # ---------------------------------------------------------------
  # S4 — api-surface
  # Expanded once S3 (instance-engine) was fully done -- REQ-043..064
  # all `done`. Ports R-Co's src/api/ (source inventory re-counted
  # against the live R-Co tree 2026-08-19 and re-verified during this
  # expansion: routes/ 31 modules / 15,083 lines, middleware/ 9 /
  # 3,342, shared conventions src/api/*.zig 9 / 1,843, openapi/ 7 /
  # 992, health/ 2 / 357). See docs/migration/stage-4-api-surface.md
  # for the per-module table. Note two corrections this expansion
  # found against that table: openapi/ has 7 modules totalling 992
  # lines (builder 235, mod 6, model 59, path_registry 46,
  # schema_registry 290, serialize 346, version_source 10), not
  # "6 / 1,286"; and routes/sandbox_access.zig exports no handle*
  # entry point at all (checkPrincipalBound/checkProbeRate/
  # writeSentinelAudit are guard helpers a route calls), so it is a
  # middleware-shaped concern, not a route. Its only consumer in the
  # whole R-Co tree is routes/agent_sandboxes.zig, a post-S6
  # runtime-agent route, so it is NOT ported in S4 by any requirement
  # here and moves to the group (b) deferred table in
  # stage-4-api-surface.md.
  #
  # ORDERING. The shared conventions (errors.zig RFC 9457 problem
  # details, response.zig, pagination.zig cursor contract,
  # validation.zig, authorization.zig role/permission matrix) are the
  # cross-cutting contract every route consumes and land FIRST
  # (REQ-066..069), ahead of any route requirement -- the same
  # ordering precedent S2 used for REQ-024's event-type registry
  # ahead of REQ-025's append. Router decomposition (REQ-070) lands
  # immediately after, because a single flat route table cannot carry
  # this surface and every later requirement mounts into it.
  #
  # THE FRAMEWORK CONTRADICTION IS REAL AND IS NOT RESOLVED HERE.
  # docs/migration/decisions/0001-web-framework.md is `decided` and
  # its Decision section says, in as many words, "Letflow migrates to
  # Phoenix (router scope/pipeline DSL, controllers) ... effective at
  # S4". Meanwhile lib/letflow/router.ex's moduledoc says
  # "Deliberately minimal -- Plug + Bandit, no Phoenix",
  # docs/migration/stage-4-api-surface.md's Decisions section says
  # this stage "Executes on 0001 (Plug + Bandit, no Phoenix)", and
  # mix.exs has no :phoenix dependency. Both readings cannot be
  # right, and S4 is the exact stage where the difference becomes
  # load-bearing (it changes what REQ-070's router is, what REQ-071's
  # middleware chain is composed with, and whether OQ-2's
  # open_api_spex is even on the table). Per CLAUDE.md's "Don't
  # silently re-decide what a decision record already settled", this
  # is escalated as REQ-065, a decision-record requirement gating the
  # whole batch -- not chosen inside a route requirement. Every other
  # S4 requirement below depends on REQ-065 transitively and is
  # written framework-neutrally: it names the behaviour and the
  # response contract, never `Plug.Router`-vs-`Phoenix.Router`
  # specifics.
  #
  # OQ-2 (OpenAPI spec generation -- hand-build like R-Co's
  # openapi/builder.zig + schema_registry.zig, adopt open_api_spex,
  # or defer to S6) is the second genuine unresolved choice, and it
  # is downstream of REQ-065 (open_api_spex is Phoenix-oriented). It
  # gets its own decision-record requirement, REQ-084, on the
  # REQ-010/REQ-014 precedent -- a decision record plus REVIEWER
  # sign-off as the deliverable, with the spec-serving route left to
  # whatever that record decides. R-Co's routes/openapi.zig (158
  # lines) is therefore NOT ported by any requirement in this batch.
  #
  # SECURITY. S4 is the first stage that exposes tenant data over
  # HTTP, which makes four of security-invariants.md's invariants go
  # live simultaneously: INV-2 (server-side field authorisation --
  # "no multi-tenant API surface exists (S4 not started)" stops being
  # true here), INV-5 (not-found/forbidden indistinguishability --
  # same), INV-1 (tenant isolation, already live but now reachable
  # from an untrusted network peer rather than only from a test), and
  # INV-6 (every new data-access path proves its scoping). Every
  # tenant-scoped route requirement below carries an explicit
  # cross-tenant acceptance criterion naming the invariant it
  # discharges. REQ-072 exists specifically so that discharge is a
  # shared, tested mechanism rather than 15 hand-written repetitions.
  #
  # ALREADY BUILT, DO NOT RE-PORT. REQ-021 ported the two hardest
  # middleware modules -- Letflow.Plugs.AuthPipeline
  # (src/api/middleware/auth.zig, 1,876 lines) and
  # Letflow.Plugs.TenantStatus (tenant_status.zig, 81). Both
  # moduledocs say they are "not mounted in front of any route today
  # ... left available for S4". MOUNTING them is REQ-071's job;
  # re-porting them is nobody's.
  #
  # SCOPE BOUNDARY FOR ROUTES WITHOUT A BACKING SUBSYSTEM. Eleven of
  # R-Co's 31 route modules front subsystems Letflow has not built:
  # dlq.zig (337, needs src/dlq/ -- S6), services.zig (417, needs
  # service_catalog -- S6), platform_migrations.zig (288 -- S6),
  # webhooks.zig (497 -- S6), simulation_test.zig (476 -- S7),
  # process_modules.zig (363 -- S5), entities.zig (328) and
  # entity_query.zig (559) (entity/data-model subsystem plus a query
  # compiler -- S5/S6), and agent_task_specs.zig (311),
  # agent_sandboxes.zig (501), agent_artifacts.zig (562)
  # (runtime-agent orchestration, which docs/migration/README.md's
  # "Two applications of the agent-pipeline principles" section
  # explicitly defers -- "Only (1) is built"). NONE of these gets a
  # requirement in this batch. Building a partial backing subsystem
  # inside a route requirement is exactly the failure REQ-056's own
  # SCOPE BOUNDARY paragraph exists to prevent, and a route against a
  # subsystem that does not exist has nothing to be tenant-scoped
  # against. They are named here so a later reader finds them
  # accounted for; REQ-070's router requirement carries the same list
  # in its moduledoc so the gap is visible at the code level too.
  # Also not ported: middleware/agent_auth.zig (65 lines, same
  # runtime-agent deferral) and middleware/outbox_cap.zig (236 -- the
  # outbox itself is S6, so the cap has nothing to cap).
  #
  # SIZING. Four routes are too large for one agent turn each and are
  # split by handler group with depends_on chaining, on REQ-052/061's
  # precedent: identity.zig (1,868 lines / 23 handlers) splits four
  # ways (REQ-073 users, REQ-074 groups, REQ-075 tenants, REQ-076 API
  # tokens + roles); instances.zig (1,535 / 8) splits two ways
  # (REQ-079 write path create/cancel/reconstruct, REQ-080 read path
  # get/list/history/timeline/pins); definitions.zig (1,276 / 13)
  # splits two ways (REQ-081 read/search, REQ-082 write/lifecycle);
  # tasks.zig (1,085 / 7) splits two ways (REQ-083 read/inbox,
  # REQ-085 complete/claim/assign/reassign). The split lines follow
  # R-Co's own handler boundaries, not arbitrary line counts.
  # ---------------------------------------------------------------

  - id: REQ-065
    title: Resolve the Phoenix-vs-Plug/Bandit contradiction between decision 0001 and the shipped router (gates all of S4)
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 132  # letflow-queue task id
    description: >
      Letflow currently holds two mutually exclusive positions on the S4 web
      framework, and S4 cannot start until one of them is retired in writing.
      THE CONTRADICTION, stated precisely so it is not re-litigated from
      memory:
      (a) docs/migration/decisions/0001-web-framework.md is Status: decided
      (REQ-010, `done`). Its Decision section reads "Letflow migrates to
      Phoenix (router scope/pipeline DSL, controllers) rather than continuing
      to hand-rolling on plain Plug/Bandit, effective at S4", and its Summary
      repeats "Dimensions A and B justify migrating to Phoenix at S4; the
      migration itself (adding {:phoenix, \"~>...\"} to mix.exs, rewriting
      lib/letflow/router.ex) is out of scope for this decision record and is
      S4 execution work".
      (b) lib/letflow/router.ex's moduledoc, shipped and `done` as of REQ-046,
      opens "Deliberately minimal -- Plug + Bandit, no Phoenix", and
      docs/migration/stage-4-api-surface.md's Decisions section states this
      stage "Executes on docs/migration/decisions/0001-web-framework.md (Plug
      + Bandit, no Phoenix) from S0" -- an inversion of what 0001 actually
      decided. mix.exs's deps list ([:ecto_sql, :postgrex, :plug, :bandit,
      :jason, :stream_data, :ueberauth_oidcc]) has no :phoenix entry, so the
      shipped code matches (b) and the decision record says (a).
      DELIVERABLE: an updated docs/migration/decisions/0001-web-framework.md
      (amended in place with a dated addendum, in the same style as decision
      0003's 2026-08-17 addendum and decision 0006's section 6 supersession
      notes -- do NOT delete the original reasoning, which is what makes the
      drift auditable) that states which of (a) or (b) now stands, why, and
      what concretely changes. If Phoenix stands, the addendum must name the
      mix.exs dependency additions and say that lib/letflow/router.ex's
      moduledoc sentence and stage-4-api-surface.md's Decisions section are
      both wrong and are corrected by this requirement. If Plug/Bandit stands,
      the addendum must answer 0001's own Dimension B argument on its merits
      -- that argument was the stated tie-breaker (a named, router-level
      pipeline declared once and reused via pipe_through, versus hand-building
      the same grouping from Plug.Builder primitives) and cannot be dismissed
      by silence; note that Plug.Builder plus Plug.Router.forward/2 is a real
      answer to it, but it must be written down as one.
      Also correct 0001's stale route/middleware counts while amending: it
      reasons against "24 route modules" and "7 middleware", both re-counted
      2026-08-19 as 31 and 9 (agent_auth.zig and outbox_cap.zig are the two
      middleware modules the 7 omits). The recount does not obviously flip the
      decision in either direction -- more routes strengthens Dimension A --
      but the record must not keep citing a number that is measurably wrong.
      SCOPE BOUNDARY: this requirement writes the decision record and gets
      REVIEWER sign-off on it. It does NOT add a dependency to mix.exs, does
      NOT rewrite lib/letflow/router.ex, and does NOT port any route -- that
      is REQ-070's and the route requirements' work, executing whatever this
      record settles. Same producer/deliverable shape as REQ-010 and REQ-014.
    acceptance_criteria:
      - "docs/migration/decisions/0001-web-framework.md contains a dated addendum naming exactly one surviving position (Phoenix or Plug/Bandit) in a single unambiguous sentence, with the pre-existing Decision and Reasoning sections left intact rather than deleted"
      - "the addendum explicitly addresses 0001's Dimension B tie-breaker argument on its merits -- either affirming it or naming the concrete Plug-side mechanism (Plug.Builder shared pipeline module plus Plug.Router.forward/2) that answers it -- rather than reversing the decision without engaging the reasoning"
      - "the addendum states the corrected counts (31 route modules, 9 middleware modules) and says whether the recount changes the conclusion, so the record no longer reasons against 24/7"
      - "lib/letflow/router.ex's moduledoc and docs/migration/stage-4-api-surface.md's Decisions section both agree with the surviving position after this requirement -- verified by grep for the string 'no Phoenix' in both files, which must either be gone or be consistent with the addendum"
      - "a REVIEWER sign-off exists recording that the surviving position was reviewed against 0001's original reasoning, appended to docs/migration/stage-4-api-surface.md's 'REVIEWER sign-off' section"
      - "no mix.exs dependency change and no lib/letflow/router.ex behavioural change is made by this requirement -- confirmed by git diff showing only docs/ files (plus, if Phoenix stands, the single corrected moduledoc sentence) touched"
    depends_on: [REQ-010, REQ-064]

  - id: REQ-066
    title: RFC 9457 problem-details error contract and response builder (errors.zig + response.zig)
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 133  # letflow-queue task id
    description: >
      Port src/api/errors.zig (272 lines) and src/api/response.zig (69) as
      Letflow.Api.Error and Letflow.Api.Response -- the single response/error
      contract every S4 route emits. Nothing in this batch renders a response
      body by hand once these exist.
      errors.zig is an RFC 9457 Problem Details builder. Port: the
      ProblemDetails shape (type as an absolute URI under a configured base,
      title, status, detail, plus the trace id field errors.zig carries with a
      "" default), the per-status constructors (problemNotFound and its
      siblings for 400/401/403/404/409/422/429/500 -- enumerate them from the
      Zig source rather than guessing which exist), and serialisation to a
      JSON body. Emit Content-Type: application/problem+json on error
      responses, per RFC 9457, and state in the moduledoc whether R-Co does
      the same or emits application/json (check response.zig's
      CONTENT_TYPE_JSON usage) -- if Letflow diverges, that divergence is
      deliberate and documented, not accidental.
      response.zig defines the canonical HandlerResult (status_code, body,
      content_type defaulting to JSON) and the typed success constructors that
      keep positive responses on correct status codes (200 vs 201 vs 202 vs
      204). In Elixir the conn IS the result carrier, so port these as
      functions that take and return a conn (send_json/3, created/2,
      no_content/1, and the error counterparts) rather than transliterating a
      HandlerResult struct -- Zig returns a value because it has no conn.
      State that translation in the moduledoc.
      SECURITY (INV-4, INV-5): an error body must never carry secret material,
      a raw Ecto/Postgrex error, or a stack trace -- detail is a
      caller-safe string chosen by the handler, and an unexpected internal
      error maps to a generic 500 problem document whose detail does not vary
      with the underlying exception. Separately, the not-found problem
      document is the exact response a cross-tenant probe receives (REQ-072
      enforces the routing; this requirement guarantees the two bodies are
      byte-identical by construction, because both go through one constructor).
    acceptance_criteria:
      - "Letflow.Api.Error produces a JSON body containing type, title, status and detail for every status constructor ported, with type an absolute URI, verified by a test per constructor"
      - "an error response carries Content-Type: application/problem+json and a success response carries application/json, each verified by asserting the response header rather than by inspection"
      - "a 500 produced from an unexpected exception has a detail string that is identical across two different underlying exception types, demonstrated by a test -- no exception message, module name, SQL fragment, or stack trace reaches the body (INV-4)"
      - "the 404 problem document produced for a resource that never existed and the one produced for a resource belonging to another tenant are byte-identical, demonstrated by a test comparing the two serialised bodies (INV-5)"
      - "Letflow.Api.Response's success helpers set 201 for creation and 204 with an empty body for deletion, each verified by a test asserting the status and (for 204) that the body is empty"
      - "the moduledoc states the Zig-to-Elixir translation explicitly: that response.zig's HandlerResult struct is replaced by conn-threading functions, and whether Letflow's problem+json content type diverges from R-Co's"
    depends_on: [REQ-065]

  - id: REQ-067
    title: Cursor pagination contract for every list endpoint (pagination.zig, API-06)
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 134  # letflow-queue task id
    description: >
      Port src/api/pagination.zig (406 lines, R-Co's API-06) as
      Letflow.Api.Pagination -- the shared cursor encode/decode, prefix
      validation, expiry checking, page-size validation, and standardised page
      response that every S4 list endpoint delegates to. pagination.zig's own
      header states the rule this requirement inherits: "All list endpoints
      SHALL delegate pagination concerns to this module, eliminating
      duplicated encode/decode/expiry code."
      Port the constants exactly as R-Co declares them rather than rounding:
      MAX_PAGE_SIZE 200, DEFAULT_PAGE_SIZE 50, MIN_PAGE_SIZE 1,
      CURSOR_EXPIRY_US 86_400_000_000 (24 hours). A requested page size above
      MAX_PAGE_SIZE, below MIN_PAGE_SIZE, or non-numeric is a 400 via
      REQ-066's problem document, not a silent clamp -- confirm against
      pagination.zig's own error set which of clamp-vs-reject R-Co does, and
      port R-Co's behaviour, stating it in the moduledoc either way.
      A cursor carries a type prefix so a cursor minted by one endpoint cannot
      be replayed against another; port that prefix validation. An expired
      cursor (older than CURSOR_EXPIRY_US) is rejected rather than honoured.
      SECURITY (INV-1, INV-5): a cursor is caller-supplied, tamperable input
      that decodes into query parameters. It must NOT be able to carry a
      tenant identity, schema prefix, or any value that widens the query's
      scope -- tenant scoping comes exclusively from REQ-072's resolved
      request context, never from the cursor. State this as an explicit
      invariant in the moduledoc, and make it structurally true (the decoded
      cursor struct has no tenant field to set). A cursor minted in tenant A
      and replayed against tenant B must return tenant B's page or an error,
      never tenant A's rows.
      The page response shape (items plus next-cursor, per pagination.zig's
      PageResponse(T)) is the shape every list route in this batch returns.
    acceptance_criteria:
      - "MAX_PAGE_SIZE is 200, DEFAULT_PAGE_SIZE is 50, MIN_PAGE_SIZE is 1 and the cursor expiry window is 86_400_000_000 microseconds, each asserted against a named module attribute rather than a literal buried in a function"
      - "a page-size request of 201, of 0, and of a non-numeric string each produce the behaviour R-Co's pagination.zig produces (reject-with-400 or clamp, whichever the port confirms), with all three cases covered by explicit tests and the chosen behaviour named in the moduledoc"
      - "a cursor minted by one endpoint and submitted to a different endpoint is rejected on prefix mismatch, demonstrated by a test"
      - "a cursor whose timestamp is older than the 24-hour expiry window is rejected, demonstrated by a test that constructs an old cursor rather than by waiting"
      - "the decoded cursor struct has no tenant_id, schema, or prefix field -- confirmed by inspection and stated in the moduledoc -- and a test replays a cursor minted while scoped to tenant A against a request scoped to tenant B and asserts that no tenant A row appears in the response (INV-1)"
      - "paging through more rows than one page holds returns every row exactly once with no duplicate and no gap across at least three successive pages, demonstrated by a test"
    depends_on: [REQ-066]

  - id: REQ-068
    title: Request-body validation and typed rejection contract (validation.zig + middleware/validate.zig + middleware/content_type.zig)
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 135  # letflow-queue task id
    description: >
      Port src/api/validation.zig (592 lines) plus the two thin middleware
      modules that front it -- src/api/middleware/content_type.zig (119) and
      src/api/middleware/validate.zig (86) -- as Letflow.Api.Validation and
      the plugs that run it. This is the layer that turns malformed
      caller input into a REQ-066 problem document before any handler or Repo
      call runs.
      content_type.zig: a request carrying a body (POST/PUT/PATCH) without
      Content-Type: application/json is rejected with 415 before parsing;
      GET/HEAD/DELETE pass through untouched. Confirm R-Co's exact status code
      and its treatment of a charset parameter (application/json;
      charset=utf-8) against the Zig source rather than assuming.
      validation.zig: port the per-field validators and their typed error set
      -- required-field presence, type checks, string length bounds, UUID
      shape, enum membership -- returning a structured list of field errors
      that REQ-066 renders into one 400/422 problem document with per-field
      detail, rather than aborting on the first bad field.
      SECURITY (INV-8, INV-7): validation runs on untrusted network input and
      must never raise on any byte sequence. A body that is not valid JSON, a
      body that is valid JSON but not an object, a deeply nested body, a
      body far larger than any endpoint expects, and a body containing SQL
      metacharacters or a NUL byte in a string field all produce a typed
      rejection, never a 500 and never an unhandled crash. Enforce a maximum
      request body size (Plug.Parsers' :length option or equivalent) and state
      the chosen limit as a named constant with its justification -- an
      unbounded body is a memory-exhaustion vector against a shared node.
      SCOPE BOUNDARY: this requirement does NOT port
      src/api/middleware/rate_limit.zig (236) or quota_enforcement.zig (412).
      Both are real S4 middleware and both are named in decision 0001's
      Dimension B, but they need per-tenant counter storage that no Letflow
      requirement has built, and bolting a counter store onto a validation
      requirement is the partial-subsystem failure REQ-056's boundary
      paragraph exists to prevent. They belong to their own later requirement
      or to S6 alongside the rest of the operational cross-cutting work; say
      so in the moduledoc rather than leaving the omission unremarked.
    acceptance_criteria:
      - "a POST with a body and no Content-Type header, and a POST with Content-Type: text/plain, are both rejected with the status R-Co's content_type.zig uses, before Plug.Parsers attempts to decode -- two explicit tests; a GET with no Content-Type is unaffected"
      - "a request body containing invalid JSON, a JSON array where an object is required, a 10-level-nested object, and a string field containing a NUL byte each return a typed 400/422 problem document, with each of the four cases covered by its own test and none producing a 500 or an unhandled exception (INV-8)"
      - "a request body exceeding the configured maximum size is rejected with 413 rather than being buffered, and the maximum is a named module attribute with a comment justifying the value"
      - "a body with three simultaneously invalid fields produces one problem document naming all three fields, not a document naming only the first -- demonstrated by a test asserting all three field names appear"
      - "the moduledoc states explicitly that rate_limit.zig and quota_enforcement.zig are NOT ported here, names the per-tenant counter storage they need as the reason, and names where they belong instead"
    depends_on: [REQ-066]

  - id: REQ-069
    title: Role/permission authorization matrix and 403 decision contract (authorization.zig)
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 136  # letflow-queue task id
    description: >
      Port src/api/authorization.zig (280 lines) as Letflow.Api.Authorization
      -- the role-to-permission matrix every route consults before doing work.
      Port R-Co's enums exactly, not a renamed approximation: Role is
      PLATFORM_ADMIN | PROCESS_DESIGNER | PROCESS_OPERATOR | TASK_WORKER |
      AGENT_RUNNER, and Permission is DefinitionsWrite | DefinitionsRead |
      InstancesStart | InstancesCancel | InstancesRead | TasksRead |
      TasksComplete | TasksAssign | UsersGroupsRolesManage | TokensManage |
      AuditRead | DlqOperate | MetricsRead | WebhooksManage. AGENT_RUNNER,
      DlqOperate and WebhooksManage have no S4 route that consumes them
      (runtime-agent orchestration, the DLQ and webhook dispatch are all
      deferred subsystems) -- port them anyway so the matrix matches R-Co's,
      and note in the moduledoc which entries are currently unreachable rather
      than dropping them and leaving a later reader to rediscover the gap.
      Port the AccessDecisionKind outcome exactly as authorization.zig L28-32
      defines it -- three variants, Allow | Deny403 | AllowWithRowFilter -- and
      the decision function that maps (roles, permission) to an outcome.
      AllowWithRowFilter is not a stylistic third case: it is a tenant-data
      row-visibility mechanism and must be ported as one. evaluateAccess
      (L114-139) returns it in exactly one situation -- endpoint TasksList when
      isTaskWorkerOnly(roles) is true, i.e. the caller holds TASK_WORKER and
      holds none of PLATFORM_ADMIN, PROCESS_DESIGNER or PROCESS_OPERATOR
      (L124-130, L139-143) -- and pairs it with task_scope
      OwnUserAndGroups(ctx.user_id) rather than the All scope every other
      allow carries. routes/tasks.zig L148-152 is the only consumer: on
      AllowWithRowFilter it overrides the caller-supplied assignee filter with
      the caller's own user_id and sets include_group_membership_for_user, so
      a TASK_WORKER-only caller sees only tasks assigned to them or to a group
      they belong to, and cannot widen that by passing assignee_id. Port that
      override as a decision the authorization layer hands the task-list query,
      not as an optional hint a handler may ignore. REQ-083 consumes this
      when it ports tasks.zig's read path. The roles come from
      conn.assigns[:auth_context][:roles], which Letflow.Plugs.AuthPipeline
      (REQ-021, built) already populates -- read that module's actual assign
      shape rather than inventing one.
      SECURITY (INV-2, INV-5): authorization is a server-side gate that runs
      BEFORE the handler queries anything, and a Deny403 must not itself leak
      existence. Where R-Co returns 403 for an unauthorised action on a
      resource the caller can legitimately know exists (wrong role, right
      tenant) that is correct; where the resource belongs to another tenant
      the answer is REQ-072's 404, never a 403 -- a 403 there would tell the
      prober the id is real. State that distinction explicitly in the
      moduledoc, because getting it backwards is the single easiest way to
      violate INV-5.
    acceptance_criteria:
      - "all five Role values and all fourteen Permission values from authorization.zig exist with R-Co's exact names, verified by a test enumerating each list against the expected set"
      - "the role-to-permission decision function has a test per role covering at least one permission it grants and one it denies, so no role's row is untested"
      - "all three AccessDecisionKind variants exist with R-Co's exact names (Allow, Deny403, AllowWithRowFilter), and each is returned by at least one decision-function test"
      - "the decision for the task-list endpoint returns AllowWithRowFilter carrying a row scope of the caller's own user id when the caller holds TASK_WORKER and none of PLATFORM_ADMIN, PROCESS_DESIGNER or PROCESS_OPERATOR, and returns a plain Allow with the unrestricted scope when the caller additionally holds any one of those three -- four tests, one per widening role plus the TASK_WORKER-only case"
      - "the row scope AllowWithRowFilter carries is a value the caller cannot influence: a task-list decision for a TASK_WORKER-only caller who supplied an assignee filter naming a different user still yields the caller's own user id as the scope, proving the filter is authorization-derived and not request-derived (INV-2)"
      - "a request whose auth_context carries no role at all is denied, not defaulted to any role -- an explicit test, since a missing-roles default-allow is the classic form of this bug"
      - "the moduledoc names AGENT_RUNNER, DlqOperate and WebhooksManage as ported-but-currently-unreachable, with the deferred subsystem that would consume each"
      - "the moduledoc states the 403-vs-404 rule explicitly: wrong role within the caller's own tenant is 403, any resource outside the caller's tenant is 404 via REQ-072, never 403 (INV-5)"
      - "the module reads roles from the assign key Letflow.Plugs.AuthPipeline actually sets, confirmed by a test that runs the real plug and then the authorization check rather than by hand-constructing an assigns map"
    depends_on: [REQ-066]

  - id: REQ-070
    title: Router decomposition into per-subsystem sub-routers (OQ-1), replacing the single flat route table
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 137  # letflow-queue task id
    description: >
      Replace lib/letflow/router.ex's single flat route table -- today GET
      /health plus a 404 catch-all, per its own moduledoc -- with the
      decomposed structure the rest of S4 mounts into. This resolves
      stage-4-api-surface.md's OQ-1.
      The shape is per-subsystem sub-routers under an /api/v1 prefix, one
      module per R-Co route file group, delegated to from a top-level router:
      identity, instances, definitions, tasks, promotion, onboarding, audit,
      tenant_config, validation, health, metrics. Under Plug that is
      Plug.Router.forward/2 to a sub-router module per subsystem; under
      Phoenix it is scope plus a controller per subsystem. REQ-065 settles
      which -- this requirement executes whichever survives and MUST NOT
      re-open it. What is framework-independent, and is what this requirement
      is actually accountable for, is: one module per subsystem, no subsystem
      declaring another's paths, a single place where the shared middleware
      chain is declared (not repeated per sub-router), and the existing GET
      /health preserved byte-compatibly.
      GET /health MUST keep its current contract exactly -- 200 with
      {"status":"ok"}, no auth, no DB dependency -- because
      deploy/redeploy-test.sh's post-deploy check consumes it and a change
      breaks deployment, not just a test. R-Co's routes/health.zig (221 lines,
      handleLive/handleReady) adds a readiness endpoint backed by
      src/api/health/readiness.zig (245) and subsystems.zig (112); porting
      readiness is NOT this requirement (it needs subsystem health probes that
      pair with S6 observability) -- keep liveness, name readiness as deferred.
      The unmatched-route response becomes REQ-066's 404 problem document
      rather than today's ad-hoc {"error":"not_found"} map, so a caller sees
      one error shape across the whole surface.
      The moduledoc MUST carry the deferred-route list so the gap is visible
      in code and not only in docs: dlq, services, platform_migrations,
      webhooks (S6), simulation_test (S7), process_modules (S5), entities and
      entity_query (S5/S6), and the three agent_* routes (runtime-agent
      orchestration, deferred per docs/migration/README.md), each with its
      owning stage.
    acceptance_criteria:
      - "GET /health still returns 200 with a body equal to {\"status\":\"ok\"} and still requires no auth and no database connection, demonstrated by a test that runs with the Repo unavailable"
      - "the router is decomposed into at least one module per subsystem with no subsystem's paths declared inside another's, confirmed by inspection and by a test that mounts a sub-router in isolation and exercises one of its paths without the top-level router"
      - "a request to an unrouted path returns REQ-066's RFC 9457 404 problem document with Content-Type: application/problem+json, not the previous {\"error\":\"not_found\"} body -- an explicit test asserting both body shape and header"
      - "the shared middleware chain is declared in exactly one place and applied to every tenant-scoped sub-router, verified by grep showing a single declaration site rather than a repetition per sub-router"
      - "the moduledoc lists all eleven deferred route modules with their owning stage, and states that readiness (routes/health.zig handleReady, api/health/readiness.zig) is deliberately not ported here"
      - "the router change introduces no framework choice of its own -- it implements whichever position REQ-065's addendum settled, cited by name in the moduledoc"
    depends_on: [REQ-065, REQ-066]

  - id: REQ-071
    title: Mount the built auth and tenant-status plugs in front of the tenant-scoped pipeline
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 138  # letflow-queue task id
    description: >
      Mount Letflow.Plugs.AuthPipeline and Letflow.Plugs.TenantStatus (both
      built, compiled and tested by REQ-021, both explicitly "not mounted in
      front of any route today ... left available for S4" per their own
      moduledocs) in front of REQ-070's tenant-scoped sub-routers, and update
      both moduledocs so they no longer say they are unmounted.
      DO NOT RE-PORT EITHER PLUG. src/api/middleware/auth.zig (1,876 lines)
      and tenant_status.zig (81) are already ported; this requirement is
      wiring plus the ordering guarantees, nothing else. If a behavioural gap
      is found in either plug while wiring, record it as an issue rather than
      widening this requirement.
      ORDERING is the substance here, and it is the same order decision 0001's
      Dimension B lists and R-Co's auth.zig enforces: AuthPipeline first
      (nothing downstream has a tenant or principal until it runs), then
      TenantStatus (needs auth's resolved tenant_id), then REQ-069's
      authorization check, then the handler. GET /health and any other
      non-tenant-scoped path must stay OUTSIDE this chain -- health must
      answer while auth's OIDC provider is unreachable.
      TenantStatus's documented fail-closed divergence (REQ-021 chose to let a
      tenant-status lookup failure crash the request process rather than
      fail open like tenant_status.zig does, per
      lib/letflow/design/req021-auth-plug-pipeline.md section 6.4 OQ-14, and
      that moduledoc says "REVIEWER should confirm") becomes reachable from
      the network for the first time here. Confirm the divergence explicitly
      with REVIEWER as part of this requirement rather than inheriting it
      silently, and verify the crash is contained to the one request (INV-8):
      a lookup failure on tenant A's request must not affect a concurrent
      tenant B request.
      SECURITY (INV-6): this is the requirement that makes every downstream
      route's tenant scoping possible, so it must demonstrate the chain cannot
      be bypassed -- a tenant-scoped path reached without a valid bearer token
      returns 401 before any Repo call, and no tenant-scoped path exists that
      the chain does not front.
    acceptance_criteria:
      - "a request to a tenant-scoped path with no Authorization header returns 401 and executes zero Repo queries, demonstrated by a test that asserts on query telemetry or a Repo sandbox with no checkout rather than by inspection"
      - "a request to a tenant-scoped path with a valid token reaches the handler with conn.assigns[:auth_context] populated with user_id, tenant_id and roles, demonstrated end-to-end through the real router rather than by unit-testing the plug alone"
      - "GET /health returns 200 while the OIDC provider configuration worker is unavailable, demonstrated by a test -- proving health sits outside the auth chain"
      - "a POST against a tenant whose status is :migrating returns 503 with a Retry-After header, and the equivalent GET returns 200, through the mounted chain -- two explicit tests"
      - "a tenant-status lookup failure on one request does not affect a concurrent request for a different tenant, demonstrated by a test running both concurrently (INV-8)"
      - "both plugs' moduledocs no longer contain the phrase 'Not mounted in front of any route today', confirmed by grep, and instead name the pipeline they are mounted in"
      - "the REQ-021 OQ-14 fail-closed divergence is explicitly confirmed by REVIEWER in this requirement's review, recorded in docs/migration/stage-4-api-surface.md's REVIEWER sign-off section"
    depends_on: [REQ-069, REQ-070]

  - id: REQ-072
    title: Tenant-scoped request context and the cross-tenant 404 mechanism (tenant_context.zig + trace_context.zig)
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 139  # letflow-queue task id
    description: >
      Port src/api/tenant_context.zig (104 lines) and src/api/trace_context.zig
      (55) as the per-request context every tenant-scoped handler reads, and
      build the single shared mechanism that turns a cross-tenant access into
      an indistinguishable 404. This requirement exists so INV-5 is discharged
      once, structurally, instead of being re-implemented and re-tested in
      each of the fifteen route requirements that follow.
      IDIOM TRANSLATION, mandatory: trace_context.zig and pipeline_context.zig
      (45) use Zig `threadlocal` storage for the per-request correlation id.
      That is not the Elixir/OTP shape. Carry the trace id explicitly on
      conn.assigns (and mirror it into Logger.metadata/1 for log correlation
      only) -- do NOT port a process-dictionary or ETS global standing in for
      a thread-local. stage-4-api-surface.md names this as an idiom
      translation REVIEWER confirms, not a behaviour change. pipeline_context.zig
      itself has no separate Letflow module: its content folds into this one,
      stated in the moduledoc rather than silently dropped.
      THE SCOPING MECHANISM (this is the load-bearing half). Provide one
      function -- call it whatever the design settles on, e.g.
      Letflow.Api.Context.scoped_repo_opts/1 or fetch_scoped/3 -- that derives
      the Ecto :prefix from conn.assigns[:auth_context][:tenant_id] via
      Letflow.TenantProvisioning.schema_name_for_tenant/1 (REQ-022's existing
      mechanism, per decision 0003 Dimension B and decision 0006, which
      removed tenant_id from the schema-isolated tables entirely -- so the
      Postgres schema IS the only scoping these rows have, and a query issued
      without the prefix is not merely unfiltered, it hits the wrong schema).
      Handlers obtain their prefix ONLY from this function; no handler
      constructs a schema name itself and no handler accepts a tenant
      identifier from the request path, query string, body, or a header.
      Because the prefix comes from the authenticated token rather than the
      request, a lookup for a resource belonging to another tenant simply
      finds nothing in the caller's schema -- which is what makes the 404
      identical to a never-existed 404 by construction, with no separate
      existence check to leak timing. State that reasoning in the moduledoc:
      it is the INV-5 argument, and it is why no handler may add a
      cross-tenant existence check "for a better error message".
      SECURITY (INV-1, INV-5, INV-6): this module is where all three are
      discharged for the whole stage.
    acceptance_criteria:
      - "the trace id is carried on conn.assigns and no module in lib/letflow/api/ uses Process.put/Process.get or an ETS table for per-request context, confirmed by grep and stated in the moduledoc as the deliberate translation of Zig's threadlocal"
      - "the same trace id appears on the response header and in a log line emitted during the request, demonstrated by a test capturing both"
      - "the scoping function derives its Ecto :prefix solely from conn.assigns[:auth_context][:tenant_id]; a test supplying a conflicting tenant id in the request path, in a query parameter, and in an X-Tenant-Id header confirms all three are ignored and the token's tenant is used (INV-1)"
      - "a GET for a resource id that exists in tenant B, issued by a caller authenticated for tenant A, returns a response byte-identical to a GET for a randomly generated id that exists nowhere -- same status, same body, demonstrated by a test comparing the two responses directly (INV-5)"
      - "the cross-tenant path and the never-existed path execute the same number of database queries, demonstrated by counting queries via telemetry in both cases, so no early-exit timing signal distinguishes them (INV-5)"
      - "no function in this module accepts a tenant id, schema name, or prefix as a caller-supplied argument -- confirmed by inspection of every public function's signature and stated in the moduledoc"
      - "the moduledoc explains why a cross-tenant existence check is prohibited even to improve an error message, citing INV-5"
    depends_on: [REQ-071]

  - id: REQ-073
