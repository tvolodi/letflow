      seam): handleCreate (L55, EE-01, POST /api/v1/instances), handleCancel
      (L233, EE-08, POST /api/v1/instances/:id/cancel) and handleReconstruct
      (L309, EE-11, POST /api/v1/instances/:id/reconstruct).
      These are the routes S3 deliberately deferred: REQ-045's, REQ-052's and
      REQ-059's descriptions each state their HTTP endpoint is S4 scope. The
      backing domain functions are `done` -- read Letflow.Engine's actual
      public API and route to it. This requirement adds no engine behaviour.
      lib/letflow/router.ex's own moduledoc names this requirement's job: the
      pilot-slice POST /instances routes were removed with REQ-046 and "S4
      (api-surface) is expected to add the real /api/v1/instances routes
      against Letflow.Engine.create/2, not a revival of this pilot contract."
      Do not resurrect the pilot route shapes; port R-Co's.
      REQ-045's EE-01 correlation-key uniqueness is enforced structurally by
      the uq_instance_correlation partial unique index (REQ-043). A create
      that violates it must surface as a 409-class problem document, not a
      500 from a raw constraint error (INV-8) -- and because the index is
