  - id: REQ-084
    title: OpenAPI spec strategy decision record (OQ-2) -- hand-build vs. open_api_spex vs. defer to S6
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 151  # letflow-queue task id
    description: >
      Write a decision record settling stage-4-api-surface.md's OQ-2, which
      that document explicitly flags as "Flag to REVIEWER before building; do
      not decide it inside a route requirement." Deliverable shape follows
      REQ-010 and REQ-014: a docs/migration/decisions/000N-*.md record plus
      REVIEWER sign-off, not an implementation.
      THE QUESTION. R-Co hand-builds its OpenAPI spec across src/api/openapi/
      -- 7 modules, 992 lines re-counted during this expansion (builder.zig
      235, mod.zig 6, model.zig 59, path_registry.zig 46, schema_registry.zig
      290, serialize.zig 346, version_source.zig 10; note
      stage-4-api-surface.md's table says 6 modules / 1,286 lines, which this
      record should correct) -- and serves it from routes/openapi.zig (158).
      Letflow's three candidates are: hand-build the equivalent; adopt
      open_api_spex; or defer spec generation to S6 and serve no spec in S4.
      WHY THIS IS NOT A FREE CHOICE. open_api_spex is Phoenix-oriented, so
      this decision is downstream of REQ-065's resolution of the
      Phoenix-vs-Plug/Bandit contradiction -- adopting it under a Plug/Bandit
      outcome would mean either fighting the library or reversing REQ-065.
      The record must state that dependency explicitly rather than evaluating
      the three options as if the framework question were settled
      independently.
      WHAT THE RECORD MUST WEIGH, concretely: (a) whether any consumer needs
      the spec today -- web/ is the only client and S8 owns its integration,
      so a spec no one reads is 992 lines of ported cost with no reader; (b)
      drift risk, since a hand-built spec that is not generated from the
      routes goes stale silently, which is the failure mode R-Co's
      path_registry.zig exists to mitigate; (c) whether R-Co's schema_registry
      shape has any Elixir equivalent worth adopting.
      SCOPE BOUNDARY: this requirement writes a decision record. It does NOT
      port src/api/openapi/, does NOT port routes/openapi.zig, and does NOT
      add a dependency to mix.exs. No other requirement in this S4 batch ports
      the OpenAPI surface -- whichever option this record selects, the
      execution work is a later requirement written against the record, in the
      stage the record names.
    acceptance_criteria:
      - "a numbered record exists under docs/migration/decisions/ selecting exactly one of hand-build, open_api_spex, or defer-to-S6, stated as an explicit decision sentence rather than a pros-and-cons list"
      - "the record states how the choice depends on REQ-065's framework resolution, and if open_api_spex is selected it explicitly reconciles that with whichever position REQ-065's addendum left standing"
      - "the record names the actual R-Co source it reasons against with correct counts (7 modules, 992 lines under src/api/openapi/, plus routes/openapi.zig at 158) and notes the correction to stage-4-api-surface.md's table"
      - "the record addresses spec-drift risk explicitly, naming what keeps the spec in sync with the routes under the selected option"
      - "the record names which stage and which future requirement owns the execution, so the selected option has an owner rather than being decided and dropped"
      - "REVIEWER sign-off is recorded in docs/migration/stage-4-api-surface.md's REVIEWER sign-off section, and no mix.exs change and no lib/ code change is made by this requirement -- confirmed by git diff showing only docs/ files touched"
    depends_on: [REQ-065]

  - id: REQ-085
    title: Task routes 2/2 -- write path (tasks.zig handleComplete/handleClaim/handleAssign/handleReassign)
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 152  # letflow-queue task id
    description: >
      Port the write half of src/api/routes/tasks.zig: handleComplete (L341,
      EE-04), handleClaim (L551), handleAssign (L628) and handleReassign
      (L736). Four state-changing handlers over REQ-047/048's task domain
      logic.
      COMPLETION IS THE ENGINE ENTRY POINT, not a status update. REQ-048's
      EE-04 completion advances the instance -- output variables merge into
      instance variables and the token moves on -- so handleComplete routes to
      the engine's completion function and must not write the tasks row
      directly. A handler that flips status to COMPLETED without driving the
      transition would leave the instance permanently stalled, which is the
      most damaging way to get this route wrong; state that explicitly in the
      moduledoc.
      Completing an already-completed or already-cancelled task must return a
      deterministic 409-class problem document, not a second transition.
      Claim/assign/reassign are authorisation-sensitive beyond REQ-069's
      TasksAssign permission: claiming a task assigned to a different user or
      to a group the caller does not belong to must fail even within the same
      tenant. Resolve group and role membership through Letflow.Identity
      (REQ-015..021), the same resolution REQ-083's inbox uses -- one
      resolution path, not two that can disagree.
      Concurrency matters here in a way it does not elsewhere in S4: two
      simultaneous claims of the same task must result in exactly one winner,
      and two simultaneous completions in exactly one transition. Read
      REQ-047/048's row-locking approach and route through it rather than
      adding a second locking scheme in the route layer.
      SECURITY (INV-1, INV-5, INV-8).
    acceptance_criteria:
      - "completing a task advances the owning instance -- the output variables appear in the instance's variables and the token has moved -- demonstrated end-to-end through the real router by asserting instance state, not only the 200"
      - "handleComplete contains no direct write to the tasks table; it routes to REQ-048's engine completion function, confirmed by grep for Repo. in the module returning no hit and stated in the moduledoc"
      - "completing an already-completed task and completing an already-cancelled task each return a 409-class problem document and produce no second transition, verified by asserting the instance state is unchanged -- two explicit tests"
      - "two concurrent claims of the same task produce exactly one success and one deterministic non-500 rejection, demonstrated by a test running both concurrently"
      - "claiming a task assigned to a different user in the same tenant, and claiming one assigned to a group the caller does not belong to, are both rejected with no state change -- two explicit tests"
      - "a task id belonging to another tenant returns the same response as a nonexistent id on all four verbs, with no state change in any case -- verified by reading the target row (INV-1, INV-5)"
      - "a caller without TasksComplete cannot complete and a caller without TasksAssign cannot assign or reassign, with the absence of state change verified in each case"
    depends_on: [REQ-083]

  - id: REQ-109
    title: Port R-Co variable_schemas storage and wire per-key output-variable validation into merge_output_variables/7 (closes ISS-0063 / GH#212)
    owner: ELIXIR-DEV
    status: done
    stage: S3
    impl_order: 153  # NOT a letflow-queue task id -- see ISS-0092/GH#314
    # This value was derived as file-max+1 and was never returned by
    # register_task; using it in a /tasks/<id>/ URL addresses an UNRELATED
    # live task -- acting on it (as queue task 153) wrongly closed GH#304,
    # which actually belonged to ISS-0087. Do not lock/release against it.
    # REQ-109 is `done` and merged -- deliberately left unregistered rather
    # than backfilled, since a completed requirement has no remaining claim
    # to make; there is nothing for get_next_task to hand out.
    description: >
      Port R-Co's `variable_schemas` table and the per-key lookup that feeds
      it into REQ-049's merge, so that REQ-049's schema-rejection branch --
      built, tested in isolation, and currently UNREACHABLE through the real
      completion path -- actually fires. Closes ISS-0063 / GH#212.
      THIS IS A PORT, NOT AN INVENTION. The source DDL exists
      (R-Co migrations/012_event_retention.sql:32), the source algorithm
      exists (R-Co src/engine/instance.zig:2318, `mergeVariables`), the
      consumer call sequence is already specified
      (lib/letflow/design/req049-variable-merge.md section 8, FIVE numbered
      steps -- the fifth is the `{:rejected, ...}` branch this requirement
      exists to make reachable, so do not stop at step 4 -- plus sections
      7.2/7.3). Read section 8 and follow it rather than re-specifying the
      sequence.
      NOT A BUG FIX. lib/letflow/engine.ex:1543 hardcoding `nil` for
      `VariableMerge.merge/3`'s `variable_validations` argument conforms to
      its own design contract -- req049-variable-merge.md section 7.3 states
      outright that "until that requirement exists, every real caller of
      `merge/3` legitimately passes `variable_validations: nil`." REQ-109 IS
      that requirement. State this in `lib/letflow/engine.ex`'s moduledoc so
      the hardcoded `nil` is not re-filed as a regression a third time.
      THREE THINGS IN R-Co CARRY THE WORD "SCHEMA" AND A PRIOR INVESTIGATION
      CONFLATED THEM (ISS-0063's superseded_scoping_note is the record of
      that mistake). Name all three in the NEW `Letflow.Engine.VariableSchema`
      moduledoc (Deliverable 3), stating which is in scope:
      (1) `tasks.form_schema` -- populated at activation from
      `node.attributes["form_schema"]` (R-Co src/engine/instance.zig:5490,
      `extractFormSchemaJson`) and served in the task-detail response
      (R-Co src/api/routes/tasks.zig:896). A UI form-RENDERING payload;
      R-Co NEVER validates submitted output against it. OUT OF SCOPE, and
      REQ-047's OQ-3 stays open -- answering it would not close ISS-0063.
      (2) `variable_schemas` -- `(definition_id, variable_key) -> json_schema`.
      IN SCOPE; this requirement is about this table and nothing else.
      (3) `form_schema_registry` -- R-Co migrations/047_repository_form_schemas.sql,
      REPO-05, a field-level search/discovery index over form artifacts keyed
      to `artifact_versions`. OUT OF SCOPE; named explicitly because grepping
      "form schema" lands here first and would build the wrong mechanism.
      DELIVERABLE 1 -- the migration. A new tenant-scoped migration creating
      `variable_schemas`, porting R-Co migrations/012_event_retention.sql:32
      column for column: `id` (binary_id PK), `definition_id` (NOT NULL, FK to
      `process_definitions(id)`), `variable_key` (text, NOT NULL),
      `json_schema` (jsonb, NOT NULL), `description` (text, nullable),
      `created_at`; UNIQUE (definition_id, variable_key); index on
      `definition_id` (Postgres does not index the referencing side of an FK).
      SCHEMA-PER-TENANT, like every other Letflow engine table: the
      `if prefix() do` guard is MANDATORY and the migration MUST also be
      registered in `@tenant_scoped_migration_manifest`
      (lib/letflow/tenant_provisioning.ex:295) -- both halves, per
      20260818110003_create_tasks.exs's header. R-Co's own DDL comment agrees
      ("ISS-0641 / GH-637: PER_TENANT ... FKs to tenant-schema
      process_definitions(id)"), as does R-Co src/definition/sandbox_pool.zig:126,
      which clones `variable_schemas` per tenant schema. Follow
      20260818110003_create_tasks.exs's `on_delete:` reasoning explicitly:
      R-Co uses ON DELETE CASCADE, but every Letflow FK onto an engine table so
      far chose `:restrict` because no delete path exists; pick one, and state
      the reason in the MIGRATION FILE HEADER rather than copying either
      silently.
      DELIVERABLE 2 -- decision: a DEDICATED TABLE, not `event_type_registry`.
      req049-variable-merge.md section 7.3 left this open ("whether a variable
      schema is registered in the existing `event_type_registry` table under a
      name derived from the variable key, or in a new dedicated table"). This
      requirement SETTLES it as the dedicated table, on R-Co precedent: R-Co
      has a distinct `variable_schemas` table keyed by
      `(definition_id, variable_key)`, and reusing `event_type_registry` would
      mean inventing a variable-key-to-event-type name mangling with no source
      counterpart and would pollute the event-type namespace with
      non-event-type rows. Record this resolution in the
      `Letflow.Engine.VariableSchema` moduledoc, citing section 7.3 as the
      question it closes. Do NOT re-open it.
      DELIVERABLE 3 -- the Ecto schema, the per-key lookup, and the wiring.
      Add `Letflow.Engine.VariableSchema` (lib/letflow/engine/variable_schema.ex)
      as the table's Ecto schema and the home of the lookup function; it is
      also the home of every storage-side moduledoc obligation this
      requirement names. Then replace the hardcoded `nil` at
      lib/letflow/engine.ex:1543 with a real `variable_validations` map, built
      inside the same already-open transaction and already-locked projection
      that `merge_output_variables/7` runs in. The lookup key is
      `projection.definition_id`
      (lib/letflow/event_store/instance_projection.ex:113) -- already carried
      on the locked projection, so no new plumbing is needed to obtain it.
      One SELECT of `variable_key, json_schema` for that `definition_id`, per
      R-Co's own "Issues one SELECT on `variable_schemas`; no writes"
      (src/engine/instance.zig:2318 doc comment) -- not one query per key.
      ONLY OVERWRITE CANDIDATES ARE VALIDATED -- keys present in BOTH the
      current variable map and the incoming output map. Brand-new keys are
      NEVER validated (req049-variable-merge.md section 3.1 step 3, section 8
      step 2). Keys with no `variable_schemas` row are simply OMITTED from
      `variable_validations`; `merge/3`'s existing `Map.get(..., K, :ok)`
      default already handles the omission. The validate-all-then-apply
      two-phase property (R-Co's ISS-202 two-phase merge) is ALREADY
      `merge/3`'s behaviour -- do not re-implement it in the caller.
      VALIDATOR -- `Letflow.EventStore.Registry.JsonSchema.validate/2`, called
      directly. Do NOT add a JSON Schema dependency to mix.exs and do NOT
      write a second validator. This is a deliberate, stated deviation from
      REQ-049's AC4 wording ("goes through REQ-024's `validate_payload/3`")
      whose substance it still satisfies: `JsonSchema.validate/2` IS
      `validate_payload/3`'s own internal pure delegate
      (lib/letflow/event_store/registry.ex:147 is literally
      `case JsonSchema.validate(decoded, schema) do`), so no second JSON
      Schema implementation is introduced, while `validate_payload/3` itself
      is bound to the `event_type_registry` lookups Deliverable 2 has just
      decided against. THREE ARTEFACTS ARE SUPERSEDED BY THIS CHOICE AND ALL
      THREE MUST BE CORRECTED, NOT MERELY NOTED:
      (a) req049-variable-merge.md section 7.1's `{"value": <raw>}` wrapper
      convention -- replaced by the `%{key => value}` /
      `%{"type" => "object", "properties" => %{key => json_schema},
      "required" => [key]}` wrapping already proven at
      lib/letflow/engine/sub_process.ex:180-185, which exists because
      `JsonSchema.validate/2` requires both arguments to be maps.
      (b) section 7.2's mapping row `{:error, :unknown_event_type} -> :ok`,
      which no longer applies: "not registered" is now "no row for that
      variable_key" rather than an event-type miss. Section 7.2's two
      UNRESOLVED rows (`{:error, :tenant_not_provisioned}` and
      `{:error, term()}`, carried as design section 13.2's open question) do
      not merely change mapping -- they DISSOLVE, because
      `JsonSchema.validate/2` is pure, performs no `get_type/2` lookup and no
      tenant resolution, so neither error surface exists at all. That CLOSES
      design section 13.2 rather than leaving it dangling; say so explicitly.
      (c) THE SHIPPED CODE COMMENT, which is the one most likely to be missed:
      `lib/letflow/engine/variable_merge.ex`'s moduledoc, lines 24-29, today
      asserts that the caller resolves outcomes "by calling
      `Letflow.EventStore.Registry.validate_payload/3` (REQ-024) before
      invoking `merge/3`, not a second JSON Schema implementation." That
      sentence IS REQ-049 AC4's own required artifact, and it becomes FALSE
      about shipped code the moment this requirement lands. Correct it IN
      PLACE to point at REQ-109's rationale (same substance: still not a
      second implementation, now via the pure delegate directly) -- do not
      delete it, and do not leave it stale for REVIEWER's
      decision-record-consistency check to catch.
      A non-empty `[ValidationFailure.t()]` return becomes
      `{:rejected, failures}`, which is what `merge/3` already consumes.
      WHILE IN THAT MODULEDOC, ALSO CLOSE ISS-0075 / GH#296, which records two
      further stale claims in the SAME docstring. Repairing them here costs two
      sentences and avoids a second agent editing the same file. (i) The
      "Dependency ordering" section (lines 31-46) asserts REQ-061 "is `status:
      pending` and unimplemented"; REQ-061 is `done`. Restate that in the PAST
      tense as the condition that held at this module's implementation time --
      the surrounding rationale (that VariableMerge does not and should not
      depend on REQ-061, signalling rejection purely through its own return
      value) is CORRECT and must be preserved, not deleted. (ii) Lines 18-20
      qualify design section 3.2's abort-the-entire-batch semantic as "a
      reasoned reconstruction, not verified against `instance.zig`'s literal
      source, since no R-Co source tree is reachable in this environment." The
      tree IS reachable and the reconstruction is CORRECT: R-Co's own
      `mergeVariables` doc comment at src/engine/instance.zig:2300-2304
      documents the ISS-202 two-phase merge -- "Phase 1: Validate ALL output
      variables ... with NO state change. On any failure, return early with
      violation. Phase 2: Apply all validated keys ... only if Phase 1
      succeeds. On failure, leave variables untouched." REPLACE the caveat with
      a positive citation of those lines rather than merely deleting it: that
      upgrades a documented guess into a verified port, and REQ-109 is exactly
      what makes the semantic observable in production for the first time.
      ISS-0075 explicitly EXCLUDES the lines 24-29 sentence -- that one stays
      under this requirement's own supersession item (c) above, corrected in
      place because it is REQ-049 AC4's evidence artifact.
      REGISTRATION (the INSERT path) IS OUT OF SCOPE, DEFERRED -- BUT NAMED.
      This requirement builds the table, the Ecto schema, the lookup, and the
      wiring. It does NOT build a path that WRITES `variable_schemas` rows.
      R-Co scoped it the same way -- its own merge design says variable
      schemas are "created during process definition loading (existing
      mechanism, not part of ISS-202)" (R-Co src/design/engine-merge.md:173),
      with the actual write path living in
      R-Co src/api/routes/solution_packs.zig:299 (solution-pack import) and
      R-Co src/definition/fixture_loader.zig:32. Those two R-Co write paths
      map onto two ALREADY-PENDING S4 requirements, so the follow-up is a real
      queue item rather than "somewhere in S4": `solution_packs.zig`'s
      handleInstall is REQ-078's (its description names
      "solution_packs.zig (550, handleExport L29 / handleInstall L110)"), and
      definition import is REQ-082's (its description names
      "handleImport (L1126)"). NEITHER description currently mentions
      `variable_schemas` registration, so name both ids as the carriers AND
      state that the registration obligation must be added to whichever of the
      two is implemented first. Because an unpopulated table would leave the
      rejection branch exactly as unreachable as it is today, this
      requirement's acceptance criteria prove the path end-to-end with rows
      seeded directly via `Repo.insert` against a provisioned tenant schema.
      DO NOT WIRE THE OTHER TWO WAITING CONSUMERS. Two further Letflow call
      sites hold placeholder `variable_schemas` lookups whose BEHAVIOUR must
      not change here -- wiring them turns this into three requirements:
      `default_variable_schema_fetcher/2`
      (lib/letflow/definitions/promotion_plan.ex:196), which returns `nil`;
      and `default_lookup/0`'s `variable_schema_lookup`
      (lib/letflow/engine/pin_resolver.ex:235-237, REQ-059), which returns
      `{:ok, %{version: "unversioned", json_schema: nil}}` -- a populated
      tuple whose `json_schema` is nil, NOT a nil return; do not describe it
      as null-returning. Name both in the `Letflow.Engine.VariableSchema`
      moduledoc as the known remaining consumers. ONE edit to them is
      permitted and required: promotion_plan.ex:191's comment ("there is no
      `variable_schemas` table or `process_definitions` column in Letflow
      today") becomes false when Deliverable 1 lands and must be corrected to
      cite REQ-109. That is a comment edit, not wiring -- the function's
      return value stays `nil`.
      OPEN QUESTION -- FLAGGED, NOT RESOLVED HERE (do not settle it in code).
      REQ-059 (PIN-01/PIN-03, `done`) freezes exactly one `:variable_schema`
      pin per instance at start time and forbids any code path from
      substituting a current version for a pinned one, so that "a newer
      catalog version published mid-flight does not affect an in-flight
      instance." A merge-time LIVE read of `variable_schemas` can therefore
      expose an in-flight instance to a schema edited after it started. R-Co
      itself does the live read at merge time (src/engine/instance.zig:2318)
      while pinning a digest over the same rows at start
      (R-Co src/engine/pin_resolver.zig:428/490), so PORT THE LIVE READ. The
      conflict is LATENT, NOT LIVE, and lib/letflow/engine.ex's moduledoc must
      say why, so REVIEWER
      disposes of it in one pass instead of re-deriving it: `default_lookup/0`
      returns `json_schema: nil` (pin_resolver.ex:235-237), so the one
      `:variable_schema` pin every instance records today carries NO schema
      content; REQ-059 AC5's no-fallback guarantee is scoped to `PinResolver`,
      which this requirement does not touch; and the conflict activates only
      when pin_resolver.ex's lookup is wired to the real table, which this
      requirement explicitly defers. No `docs/migration/decisions/` record is
      being re-decided (none of the six covers variable schemas). Record it in
      `lib/letflow/engine.ex`'s moduledoc as an open question for REVIEWER,
      with that latency reasoning attached; if REVIEWER nonetheless judges it
      a live conflict with REQ-059, route it to a decision record rather than
      deciding it inside this requirement.
      DEPENDS_ON NOTE: REQ-047 is omitted because REQ-048 already carries it
      transitively and the wired call site is completion, not activation.
      REQ-024 is likewise omitted because REQ-049 -- which IS listed -- already
      carries it (`depends_on: [REQ-044, REQ-024]`, both `done`); stated here
      for symmetry rather than left silent, since this requirement calls
      `JsonSchema.validate/2` directly rather than through `merge/3`.
      STAGE NOTE: this is S3 (`src/engine/instance.zig`, EE-09 -- the same
      source function REQ-049 ported), but
      docs/migration/stage-3-instance-engine.md line 3 currently reads
      "Status: done -- all Stage 3 requirements shipped." That contradiction
      is LIVE the moment this entry exists, not only when it lands. Amending
      that file is an ACCEPTANCE CRITERION below, not advisory prose.
      SECURITY (INV-1): `variable_schemas` is a tenant-data path -- the table
      is tenant-schema-scoped and every read MUST carry an explicit `prefix:`.
      A missing, nil or empty prefix must fail closed, matching the
      fail-closed treatment already established elsewhere in the engine.
    acceptance_criteria:
      - "priv/repo/migrations gains a variable_schemas migration guarded by `if prefix() do` AND registered in lib/letflow/tenant_provisioning.ex's @tenant_scoped_migration_manifest, applying cleanly against a freshly provisioned tenant schema -- both halves verified, the manifest entry by inspection and the apply by provisioning a tenant and reading the table back"
      - "the created table carries definition_id (FK to process_definitions(id)), variable_key, json_schema, description and created_at, and inserting a second row with the same (definition_id, variable_key) pair is rejected by the UNIQUE constraint -- demonstrated by an actual failing insert, not by reading the migration source"
      - "with a variable_schemas row seeded for an overwrite candidate key, completing a task through the real Letflow.Engine.complete_task/3 with a value that violates that schema leaves the instance variable map WITHOUT the rejected value, sets the instance status to ERROR, and appends exactly one EXECUTION_ERROR event whose payload names the offending variable_key -- driven through complete_task/3, NOT through Engine.set_instance_error/2, which is the shortcut test/letflow/engine_execution_error_test.exs's AC4b had to take precisely because this path was unreachable"
      - "with the same seeded schema, completing a task with a value that CONFORMS overwrites the key, leaves the instance status unchanged, records the overwrite in the TASK_COMPLETED event's payload.merged_variable_events, with no separate VARIABLE_OVERWRITTEN event appended (REQ-048 INV-EE48-5), and advances the token -- verified by reading instance_projections and events back"
      - "an overwrite candidate key with NO variable_schemas row merges untouched with no EXECUTION_ERROR, and a brand-new key (absent from the instance's current variables) whose value violates a seeded schema for that same key is REJECTED exactly as an overwrite would be -- unmerged, instance in ERROR, one EXECUTION_ERROR naming the key -- two explicit tests (revised 2026-08-20, GH#300/ISS-0077/decision 0007: previously this criterion required the brand-new key be inserted unvalidated, matching req049-variable-merge.md section 3.1's then-overwrite-candidates-only rule; that rule was an unverified divergence from R-Co, not a considered one, and is now corrected to validate every key)"
      - "a variable_schemas row belonging to tenant A has zero effect on a completion running in tenant B: the identical (definition_id, variable_key, violating value) completion that is REJECTED in tenant A SUCCEEDS in tenant B, demonstrated with two provisioned tenant schemas (INV-1)"
      - "a lookup invoked with a missing, nil or empty prefix fails closed with a distinct, pattern-matchable error and issues no query, demonstrated by a test rather than argued"
      - "mix.exs gains no new JSON Schema dependency and grep shows the validation calling Letflow.EventStore.Registry.JsonSchema.validate/2, with lib/letflow/engine.ex's moduledoc stating why that rather than REQ-024's validate_payload/3, and stating that req049-variable-merge.md sections 7.1 and 7.2 are superseded (wrapper shape; :unknown_event_type row) and that section 13.2's open question is CLOSED because the pure delegate has no tenant-resolution error surface"
      - "lib/letflow/engine/variable_merge.ex's moduledoc is corrected IN PLACE on three counts, each verified by reading THAT file directly rather than inferring it from lib/letflow/engine.ex: (a) the paragraph at lines 24-29, which today asserts the caller resolves outcomes by calling Letflow.EventStore.Registry.validate_payload/3, cites REQ-109's rationale instead and no longer names validate_payload/3 as the caller's mechanism; (b) ISS-0075 claim 1 -- the Dependency ordering section (lines 31-46) no longer asserts REQ-061 is status pending and unimplemented, restating it in the past tense as the condition that held at implementation time, with the surrounding does-not-depend-on-REQ-061 rationale preserved rather than deleted; (c) ISS-0075 claim 2 -- the lines 18-20 caveat calling design section 3.2 an unverified reconstruction because no R-Co source tree is reachable is REPLACED, not merely deleted, by a positive citation of R-Co src/engine/instance.zig:2300-2304's ISS-202 two-phase merge doc comment confirming the reconstruction was correct. Landing (b) and (c) closes ISS-0075 / GH#296"
      - "the new lib/letflow/engine/variable_schema.ex's Letflow.Engine.VariableSchema moduledoc carries four things, each verified by reading that file: all three R-Co 'schema' concepts (tasks.form_schema, variable_schemas, form_schema_registry) with which is in scope; the dedicated-table resolution of req049-variable-merge.md section 7.3; REQ-078 and REQ-082 named as the carriers of the deferred registration path, with the note that neither currently mentions it; and promotion_plan.ex plus pin_resolver.ex named as the two remaining unwired consumers"
      - "lib/letflow/engine.ex's moduledoc states that the former hardcoded nil at the merge call site was design-sanctioned by req049-variable-merge.md section 7.3 rather than a defect, and records the REQ-059 pinning-vs-live-read tension as an open question for REVIEWER together with the reason it is latent (pin_resolver.ex's default lookup carries json_schema: nil) -- both verified by reading that file"
      - "docs/migration/stage-3-instance-engine.md's Status: line no longer claims all Stage 3 requirements shipped, and the stage's requirement list includes REQ-109 -- verified by reading the file"
      - "lib/letflow/definitions/promotion_plan.ex:191's comment no longer asserts that there is no variable_schemas table in Letflow today and cites REQ-109 instead, while default_variable_schema_fetcher/2's return value is unchanged at nil -- both verified by reading the function back"
    depends_on: [REQ-027, REQ-048, REQ-049, REQ-061]

  - id: REQ-110
    title: Verify REQ-059/REQ-060's R-Co-deferred open questions against the now-readable pin sources (ISS-0076 item 1)
    owner: ISSUE-FIXER
    status: done
    stage: S3
    impl_order: 167  # letflow-queue task id -- registered 2026-08-20 per ISS-0092/GH#314
    # (superseding the invented 154, which addressed an unrelated live task
    # and was never returned by register_task). Mirrored to GH#315.
    description: >
      REQ-059 (PIN-01..04) and REQ-060 (PIN-05) are both `done` and SHIPPED.
      Their gate-approved design docs deferred several questions specifically
      and only because the R-Co source tree could not be read at design time.
      It CAN be read now (verified this run: R-Co/src/engine/pin_resolver.zig
      967 lines, R-Co/src/engine/pin_rebind.zig 388 lines,
      R-Co/src/api/routes/pin_rebind.zig 221 lines all present and readable).
      This requirement resolves those deferrals against the real sources and
      RECORDS what it finds. Part of ISS-0076 / GH#297.
      THIS IS AN AUDIT. ITS DELIVERABLE IS FINDINGS, NOT A FIX. Read
      "NON-NEGOTIABLE" below before starting -- the single way to get this
      requirement wrong is to quietly repair shipped engine behaviour instead
      of reporting that it needs repair.
      NO PRIOR, IN EITHER DIRECTION. ISS-0075 checked one such reconstruction
      (REQ-049's abort-entire-batch semantic) and it turned out CORRECT. That
      is evidence about one guess, not about the method that produced it. Do
      NOT approach these expecting them to be fine, and do NOT approach them
      expecting breakage. The honest prior is unknown, and the acceptance
      criteria below are deliberately written so this requirement PASSES
      whether every location confirms or every location diverges.
      LOCATIONS IN SCOPE -- SIX, all verified present this run:
      (1) lib/letflow/design/req059-pin-resolver.md:538 -- OQ-1, which
      self-describes as "this design's single largest unverified inference":
      REQ-059's requirement text names `:override` as a valid `source` value
      but never says what PRODUCES it, and the OQ states outright that if
      R-Co's actual mechanism "differs materially from section 4.1's design,
      ELIXIR-DEV/REVIEWER must correct this design before building against
      it." REQ-059 was built against it. Source: pin_resolver.zig.
      (2) lib/letflow/engine/pin_resolver.ex:106 -- the SHIPPED moduledoc,
      which propagates that same uncertainty into production code ("OQ-1..OQ-6:
      no R-Co source available to verify `source: :override`'s exact origin",
      plus five more). Whatever (1) resolves to must be reflected here; the
      design doc and the shipped moduledoc must not disagree afterwards.
      (3) lib/letflow/design/req060-pin-rebind.md:541 -- OQ-4, a genuine
      BEHAVIOURAL fork, not a documentation question. The design's `NOWAIT`
      lock on `instance_projections` makes `rebind_pins/3` surface
      `ConcurrentModification` against ANY concurrent holder of that row's
      lock, including `complete_task/3` and `cancel_instance/3` mid-
      transaction, not merely a second concurrent rebind. The OQ says a
      narrower rebind-vs-rebind scope "would need a different,
      non-`instance_projections` lock target (e.g. a rebind-specific advisory
      lock) to achieve." Sources: pin_rebind.zig plus routes/pin_rebind.zig.
      req060-pin-rebind.md:464 is the same question stated at the call site
      ("unverifiable without R-Co source access") and resolves with it.
      (4) lib/letflow/design/req060-pin-rebind.md:551 -- OQ-5, the blanket
      "no R-Co source available" caveat covering every claim in that document.
      (5) lib/letflow/design/req060-pin-rebind.md:100 -- OQ-1, event-type
      self-registration. NOTE: this one states R-Co CANNOT settle it ("not
      something R-Co source could settle"), because it is a Letflow
      caller-responsibility choice. It is in scope so the location is
      formally dispositioned, NOT because R-Co is expected to answer it --
      see the `unsettled_by_source` disposition below, which exists for
      exactly this case.
      (6) lib/letflow/design/req060-pin-rebind.md:134 -- SECOND-ORDER, and the
      reason ISS-0076 says to fix it regardless of what else is decided. It
      does not merely carry the caveat; it PRESCRIBES it as required moduledoc
      content for implementations written against this design, so left alone
      it keeps minting fresh stale claims in files that do not exist yet.
      That is exactly how ISS-0075's defect was created. Remove the
      prescription. (ISS-0076 recommends this as a DOC-UPDATER docs-only item;
      it is folded here instead because this requirement already opens and
      edits that same file for (3)/(4), the same reasoning that folded
      ISS-0075's repairs into REQ-109's AC9 rather than routing a second agent
      into one docstring. REQ-112's sweep therefore EXCLUDES req060:134.)
      DISPOSITIONS -- a CLOSED set of four. Every location above must end as
      exactly one of these, recorded inline at that location:
      `confirmed` (R-Co matches the inference; cite the R-Co file:line that
      shows it); `divergent_doc_only` (R-Co differs, but shipped Letflow
      behaviour is unaffected -- correct the design doc, cite the R-Co
      file:line); `divergent_behavioural` (R-Co differs in a way that affects
      shipped behaviour -- see NON-NEGOTIABLE); `unsettled_by_source` (the
      source genuinely does not answer it -- cite the R-Co file:line actually
      read and state why it does not settle the question). The fourth exists
      because location (5) is known in advance not to be answerable by R-Co; a
      three-way set would make this requirement unsatisfiable through no fault
      of the auditor.
      NON-NEGOTIABLE -- a `divergent_behavioural` finding is NOT fixed here.
      File it as its own `docs/issues/ISS-NNNN.yaml` per
      docs/agents/protocols/ISSUE_QUEUE.md, file the matching GitHub issue,
      and route it through WF-03. This requirement makes ZERO changes to
      engine behaviour: no change to any function body, guard, spec, lock
      mode, or return value anywhere under lib/letflow/. Moduledoc and
      design-doc prose are the only permitted edits. An audit that silently
      "fixes" what it finds destroys the record of what was wrong and bypasses
      SECURITY-REVIEWER and REVIEWER on a shipped engine path.
      A NIL RESULT IS ALSO A FINDING. If nothing diverges behaviourally, say
      so explicitly and per-location. "No issues filed" must never be
      ambiguous between "looked and found none" and "did not look."
    acceptance_criteria:
      - "all SIX named locations (req059-pin-resolver.md:538; pin_resolver.ex:106; req060-pin-rebind.md:541 with :464; req060-pin-rebind.md:551; req060-pin-rebind.md:100; req060-pin-rebind.md:134) are each dispositioned as exactly one of confirmed | divergent_doc_only | divergent_behavioural | unsettled_by_source, the disposition recorded inline at that location, and the handoff result states the count per disposition summing to six -- a location left unaddressed is a FAIL regardless of what the others concluded"
      - "every confirmed, divergent_doc_only and divergent_behavioural disposition cites a specific R-Co file:line (in src/engine/pin_resolver.zig, src/engine/pin_rebind.zig or src/api/routes/pin_rebind.zig) that was actually read this run, and every unsettled_by_source disposition cites the R-Co file:line consulted plus why it does not settle the question -- no disposition rests on REQ-059's or REQ-060's own requirement text, which is the exact second-hand sourcing this audit exists to replace"
      - "git diff shows ZERO changes under lib/letflow/ outside @moduledoc/comment prose -- no function body, guard, @spec, lock mode or return value altered -- verified by inspecting the diff, so that a behavioural finding cannot have been silently repaired instead of reported"
      - "every divergent_behavioural finding (if any) has a corresponding docs/issues/ISS-NNNN.yaml naming the R-Co file:line, the Letflow file:line, and the behavioural delta, plus a filed GitHub issue or an explicit `github_issue: null # gh unavailable` note; and if there are ZERO such findings the handoff states that explicitly as a result rather than leaving it inferred from the absence of issue files"
      - "req060-pin-rebind.md:134 no longer prescribes the no-R-Co-source caveat as required moduledoc content for future implementations, verified by reading that section back"
      - "NEITHER lib/letflow/engine/pin_resolver.ex:106's shipped moduledoc NOR req059-pin-resolver.md:538's OQ-1 still asserts that R-Co is unavailable to verify source: :override, and the two agree with each other afterwards -- this holds under ALL FOUR dispositions including unsettled_by_source, because once the source has been read the claim that it is unavailable is false even when it failed to answer the question; verified by reading both files"
      - "no acceptance criterion above was satisfied by asserting a global verdict over the six locations: each disposition is justified at its own location with its own citation, confirmed by inspection"
    depends_on: [REQ-059, REQ-060]

  - id: REQ-111
    title: Verify REQ-050's CEL translation rules against transition.zig, and close out REQ-062's standing R-Co disclaimer (ISS-0076 item 3)
    owner: ISSUE-FIXER
    status: done
    stage: S3
    impl_order: 168  # letflow-queue task id -- registered 2026-08-20 per ISS-0092/GH#314
    # (superseding the invented 155, which addressed an unrelated live task
    # and was never returned by register_task). Mirrored to GH#316, closed
    # 2026-08-20 -- audit landed in 29676de, queue task released status:done.
    description: >
      Two shipped S3 designs carry deferrals that exist only because the R-Co
      source tree could not be read at design time. It can be read now. This
      requirement resolves both against the real sources and RECORDS what it
      finds. Part of ISS-0076 / GH#297.
      THIS IS AN AUDIT. ITS DELIVERABLE IS FINDINGS, NOT A FIX. The dispositions,
      the NON-NEGOTIABLE clause and the no-prior caution below are identical in
      force to REQ-110's; read that entry's equivalents if anything here is
      ambiguous.
      NO PRIOR, IN EITHER DIRECTION. ISS-0075 checked one reconstruction of this
      family and it turned out CORRECT. That is evidence about one guess, not
      about the method. Do not approach these expecting them to be fine, and do
      not approach them expecting breakage. The acceptance criteria are written
      so this requirement PASSES whether every location confirms or every
      location diverges.
      PART 1 -- REQ-050's CEL TRANSLATION RULES. This is the substantive half
      and the higher-risk one. lib/letflow/design/req050-exclusive-gateway-cel.md
      is `done` and SHIPPED, and its section 0 (line 19) states that
      `evaluateGatewayCondition()`'s and `translateCelToExpr()`'s literal
      rewrite/boundary rules were taken verbatim from REQ-050's own requirement
      text "since R-Co source is not reachable on this host." Its line 490 adds
      that the `hasCelUnsupportedFeatures()` detection algorithm is "not verified
      against `transition.zig`'s literal ... source", and flags it explicitly
      "for REVIEWER/RELEASE-VALIDATOR re-check if R-Co source access becomes
      available" -- a precondition that is now met.
      WHY THIS RISK IS SILENT, which is what makes it worth a turn: rewrite and
      boundary rules decide how a gateway CONDITION EVALUATES. A wrong rule
      routes a token down the wrong outgoing edge. Letflow's own test suite
      cannot catch that class of error, because those tests assert Letflow's
      semantics -- they would agree with a wrong rule just as readily as with a
      right one. Absence of test signal is precisely when source verification is
      load-bearing rather than decorative.
      SOURCES, all located and confirmed readable this run:
      R-Co/src/engine/transition.zig:1118 (`evaluateGatewayCondition`), :1164
      (`translateCelToExpr`), :1210 (`hasCelUnsupportedFeatures` -- the exact
      function req050:490 names), plus
      R-Co/src/design/iss602_cel_expr_differential.md, a 627-line design doc
      dedicated to the CEL/Expr differential.
      PART 2 -- REQ-062's STANDING DISCLAIMER. lib/letflow/design/
      req062-sub-process-runtime.md:11 states that every `instance.zig`/
      `transition.zig` line citation in that document came verbatim from handoff
      text rather than a direct read.
      MEASURED FACT, VERIFY IT FIRST AND DO NOT BE SURPRISED BY IT: that document
      contains ZERO R-Co line citations.
      `grep -oE "(instance|transition)\.zig:[0-9]+" lib/letflow/design/req062-sub-process-runtime.md`
      returns no matches; the two R-Co files are named in prose only (lines 3, 4
      and 12). Line 11 is therefore a STANDING DISCLAIMER guarding citations the
      document never made -- not a warning over real ones. Recording that,
      with the grep output, IS the legitimate finding for this scope item.
      Do NOT go looking for a different pattern that yields a non-zero count.
      Reaching for a looser grep until the number stops being zero is exactly
      the failure mode ISS-0076 exists to stop, and it would be the third
      recursion of it in this family.
      THE 55 OTHER CITATIONS IN THAT FILE ARE OUT OF SCOPE. Measured this run,
      req062-sub-process-runtime.md carries 55 `file:line` citations and every
      one points at a LETFLOW file -- sub_process.ex (16), engine.ex (11),
      execution_error.ex (5), task_activation.ex (3), transition.ex (2),
      token.ex (2), reconstruction.ex, service_task.ex, plugin_interface.ex and
      several `_test.exs` files. None is an R-Co citation and none is in scope.
      `transition.ex` and `transition.zig` differ by one character and are
      different trees; do not audit Letflow citations against R-Co sources or
      vice versa. Re-derive that count rather than trusting 55.
      SCOPE -- THREE DISPOSITIONED LOCATIONS plus one measurement and one edit:
      (a) MEASUREMENT, not a disposition: the zero-R-Co-citation finding above,
      recorded with the command and its output.
      (b) DISPOSITIONED -- req050-exclusive-gateway-cel.md:19's rewrite and
      boundary rules, checked against transition.zig:1118/:1164 and the
      iss602 differential doc. Check EACH rule individually; a single
      block verdict over the rule set is not acceptable (same reason REQ-110
      forbids a global verdict over its six locations -- one wrong rule inside
      four right ones is exactly what a block verdict hides).
      (c) DISPOSITIONED -- req050-exclusive-gateway-cel.md:490's
      `hasCelUnsupportedFeatures()` detection, and the four unsupported
      categories it enumerates (macros, type-conversion functions, collection
      functions, ternary), checked against transition.zig:1210. Note what
      req050:490 itself concedes: the exact detection ALGORITHM (regex vs.
      scanner, string-literal span tracking) was deliberately left to
      ELIXIR-DEV and is not pinned by that design -- so an algorithmic
      difference from R-Co is not automatically a divergence. What must match
      is the SET of categories detected and the boundary behaviour, not the
      implementation strategy.
      (d) DISPOSITIONED -- req062-sub-process-runtime.md:674, a substantive
      assumption rather than a citation: the design ASSUMES, but explicitly
      "does not verify against unreachable R-Co source", a
      `node.attributes["definition_name"]` string attribute resolved via
      `Letflow.Definitions.get_active_by_name/2`, chosen purely for internal
      consistency with `Engine.create/2`, and itself notes no such attribute is
      validated anywhere in the shipped codebase. Ask R-Co what its own SPC-01
      actually keys a child definition on.
      (e) EDIT, not a disposition: req062-sub-process-runtime.md:11 is restated
      to say what this audit established -- that the document makes no R-Co
      line citations and the disclaimer guarded nothing -- rather than deleted.
      DISPOSITIONS -- the SAME CLOSED FOUR-WAY SET REQ-110 uses, applied to
      locations (b), (c) and (d) alike: `confirmed` (R-Co matches; cite the R-Co
      file:line showing it); `divergent_doc_only` (R-Co differs, but shipped
      Letflow behaviour is unaffected -- correct the design doc, cite the R-Co
      file:line); `divergent_behavioural` (R-Co differs in a way that affects
      shipped behaviour -- see NON-NEGOTIABLE); `unsettled_by_source` (the
      source genuinely does not answer it -- cite the R-Co file:line actually
      read and say why it does not settle the question).
      `divergent_doc_only` is load-bearing here and its absence would break this
      requirement. Location (d) is the likely case: R-Co may well key the child
      definition on something other than a `definition_name` string attribute
      while shipped Letflow behaviour remains perfectly defensible. Without
      `divergent_doc_only` that outcome has nowhere to go -- `confirmed` is
      false, `unsettled_by_source` is false since the answer WAS found, and
      `divergent_behavioural` would overstate a documentation difference into a
      filed issue and a WF-03 route. The same applies to any CEL rule that
      differs in wording without differing in effect.
      NON-NEGOTIABLE -- a `divergent_behavioural` finding is NOT fixed here.
      File it as its own `docs/issues/ISS-NNNN.yaml` per
      docs/agents/protocols/ISSUE_QUEUE.md, file the matching GitHub issue, and
      route it through WF-03. This requirement makes ZERO changes to engine
      behaviour: no change to any function body, guard, spec, or return value
      anywhere under lib/letflow/. Moduledoc and design-doc prose are the only
      permitted edits. This matters more for the CEL half than anywhere else in
      this family -- "fixing" a translation rule in place would alter how every
      shipped gateway condition evaluates, with no SECURITY-REVIEWER, no
      REVIEWER, and no test that would notice.
      A NIL RESULT IS ALSO A FINDING. If nothing diverges behaviourally, say so
      explicitly and per-location, so "no issues filed" is never ambiguous
      between "looked and found none" and "did not look."
    acceptance_criteria:
      - "the zero-R-Co-citation measurement is recorded with the actual command run and its actual output, and the count of Letflow file:line citations in req062-sub-process-runtime.md is separately re-derived and stated as OUT of scope -- neither the zero nor the 55 may be reported from this requirement's text without re-running the greps, and no alternative pattern is substituted to make the zero non-zero"
      - "all THREE dispositioned locations (req050-exclusive-gateway-cel.md:19; req050-exclusive-gateway-cel.md:490; req062-sub-process-runtime.md:674) are each dispositioned as exactly one of confirmed | divergent_doc_only | divergent_behavioural | unsettled_by_source, recorded inline at that location, with the count per disposition stated and summing to three -- a location left unaddressed is a FAIL regardless of what the others concluded. ROLLUP RULE, since AC3 requires req050:19 be dispositioned rule-by-rule and :490 category-by-category: a location's single disposition is the MOST SEVERE of its per-rule or per-category dispositions, ordered confirmed < divergent_doc_only < unsettled_by_source < divergent_behavioural, and BOTH levels are reported -- the per-item breakdown and the rolled-up location disposition. Reporting only the rollup loses the detail AC3 exists to force; reporting only the breakdown leaves this AC's arithmetic with nothing to count"
      - "req050:19's rewrite and boundary rules are dispositioned RULE BY RULE, and req050:490's four unsupported categories (macros, type-conversion functions, collection functions, ternary) CATEGORY BY CATEGORY, each with its own R-Co citation -- a single block verdict covering a whole rule set or category set is a FAIL even if that verdict is correct"
      - "every confirmed, divergent_doc_only and divergent_behavioural disposition cites a specific R-Co file:line actually read this run (in src/engine/transition.zig or src/design/iss602_cel_expr_differential.md for locations (b)/(c), or the relevant SPC-01 source for (d)), and every unsettled_by_source disposition cites the R-Co file:line consulted plus why it does not settle the question -- no disposition rests on REQ-050's or REQ-062's own requirement text, which is the second-hand sourcing this audit exists to replace"
      - "a difference between Letflow's and R-Co's hasCelUnsupportedFeatures DETECTION ALGORITHM (regex vs. scanner, the MECHANISM by which string-literal spans are tracked) is not by itself recorded as a divergence, since req050:490 explicitly left the algorithm to ELIXIR-DEV -- the disposition turns on the SET of categories detected and the boundary behaviour, and the finding states which of the two it is assessing. CRITICAL BOUNDARY, do not conflate: the span-tracking MECHANISM is out of scope, but the OUTCOME it produces -- whether a literal '?' inside a quoted CEL string is detected as the ternary operator -- is BOUNDARY BEHAVIOUR and IS in scope. If Letflow and R-Co disagree on that outcome, record it as a divergence; dismissing it as an algorithm difference would be a FALSE NEGATIVE on gateway routing, the exact path this requirement states the test suite cannot catch"
      - "git diff shows ZERO changes under lib/letflow/ outside @moduledoc/comment prose -- no function body, guard, @spec or return value altered, and in particular no CEL translation or boundary rule changed -- verified by inspecting the diff, so that a behavioural finding cannot have been silently repaired instead of reported"
      - "every divergent_behavioural finding (if any) has a docs/issues/ISS-NNNN.yaml naming the R-Co file:line, the Letflow file:line and the behavioural delta, plus a filed GitHub issue or an explicit github_issue: null note; and if there are ZERO such findings the handoff states that explicitly as a result rather than leaving it inferred from the absence of issue files"
      - "req062-sub-process-runtime.md:11 no longer asserts the R-Co source tree is unreachable and instead states what this audit established -- that the document makes no R-Co line citations, so the disclaimer guarded none -- and req050-exclusive-gateway-cel.md:19 and :490 no longer assert R-Co is unreachable; all three verified by reading the lines back, and all three hold under every disposition including unsettled_by_source, because once the source has been read the unavailability claim is false regardless of what it answered"
      - "no acceptance criterion above was satisfied by asserting a global verdict across locations: each disposition is justified at its own location with its own citation, confirmed by inspection"
    depends_on: [REQ-050, REQ-062]

  - id: REQ-112
    title: Triage and sweep the remaining "R-Co source unavailable" claims across design docs and shipped moduledocs (ISS-0076 item 2)
    owner: DOC-UPDATER
