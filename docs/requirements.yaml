      - "every occurrence in that re-derived list, minus the FOUR excluded locations (lib/letflow/engine/variable_merge.ex as a whole file; req060-pin-rebind.md:134; req062-sub-process-runtime.md:11; req050-exclusive-gateway-cel.md:19 and :490), is classified as exactly one of CLASS A or CLASS B, the counts are stated and sum to the total, and no occurrence is left unclassified. NOTE 'excluded LOCATIONS', not 'excluded files' -- every OTHER occurrence inside req060-pin-rebind.md, req062-sub-process-runtime.md and req050-exclusive-gateway-cel.md IS in scope; excluding those whole files would silently under-sweep"
