    acceptance_criteria:
      - "export/1 on an existing definition produces a document whose graph field round-trips byte-for-byte comparable back through import/1's graph field"
      - "import/1 always assigns a new id distinct from the source document's id field, even when the source id happens to already exist as a definition in the target tenant"
      - "import/1 on a document with a graph that fails REQ-028's validateGraph() is rejected the same way REQ-030's create/1 rejects an invalid graph directly -- no bypass path"
      - "import/1 on a document whose bpm_export_schema_version is not \"bpm/definition/v1\" is rejected with a distinct unknown-schema-version error"
    depends_on: [REQ-030]

  - id: REQ-035
    title: Promotion reviews schema (promotion_reviews table, PRM-04 Type C part)
