    acceptance_criteria:
      - "priv/repo/migrations gains a promotion_reviews migration (schema-per-tenant per REQ-022) applying cleanly, with status as an Ecto.Enum over exactly the 6 named values"
      - "the partial unique index on (tenant_id, plan_digest) WHERE status IN ('pending_review', 'approved') exists and is demonstrated to reject a second pending_review insert with the same (tenant_id, plan_digest) while a first is still pending_review or approved"
