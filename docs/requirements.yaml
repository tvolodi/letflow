      - "a deliberately introduced single type error under web/src/ is shown to turn the frontend job red, with the CI log line proving it quoted, and the error is reverted before the requirement completes"
      - "no check command is newly invented -- git diff shows web/package.json's check script unchanged from what REQ-115 delivered"
