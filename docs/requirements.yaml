  - id: REQ-122
    title: Establish which Playwright e2e specs can run against Letflow, and what each needs
    owner: TEST-DESIGNER
    status: pending
    stage: S8
    impl_order: 252  # letflow-queue task id; depends_on translated to queue task id [246]
    description: >
      37 *.e2e.spec.ts files plus two shared helpers came over intact
      and none has ever run against Letflow. They need a live backend
      and a Keycloak realm, and several bootstrap tenants through
      docker-compose (see the skip guards in
      web/tests/e2e/onboarding/onb-ui-0*.e2e.spec.ts, which already
      abort with "Ensure docker-compose services are running").
      Produce an inventory: for each spec, which backend routes it
      exercises, which of those Letflow serves today, and therefore
      whether it is RUNNABLE-NOW, BLOCKED-ON-S4 (naming the pending REQ)
      or BLOCKED-ON-INFRA (naming what has to be running).
      Then actually run the RUNNABLE-NOW set and quote the result.
      An inventory that predicts which specs pass without running them
      is not this requirement's deliverable -- the whole point is to
      replace a guess with a measurement. If the RUNNABLE-NOW set turns
      out to be empty, that is a legitimate finding; say so with the
      evidence rather than stretching a spec to make the number
      non-zero.
      Do not modify the specs to make them pass. A spec that fails
      because Letflow's contract differs is REQ-116 inventory material,
      not a spec bug.
    acceptance_criteria:
      - "an inventory covering all 37 e2e spec files exists, each classified RUNNABLE-NOW / BLOCKED-ON-S4 / BLOCKED-ON-INFRA with the specific reason"
      - "every BLOCKED-ON-S4 entry names the pending REQ id that would unblock it"
      - "the RUNNABLE-NOW set is actually executed and its real output is quoted, including the case where that set is empty"
      - "git diff shows no modification to any file under web/tests/e2e/"
      - "the result names what infrastructure (Letflow instance, Keycloak realm, seeded tenants) the run required, concretely enough to repeat"
    depends_on: [REQ-117]

  - id: REQ-123
    title: Cutover strategy decision record -- big-bang vs. gradual dual-running
    owner: REVIEWER
    status: pending
    stage: S8
    impl_order: 256  # letflow-queue task id; depends_on translated to queue task id [252]
    description: >
      docs/migration/stage-8-frontend-cutover.md records this as the
      stage's one remaining open decision, and deliberately does not
      pre-answer it: the choice needs a real correctness signal from S7
      (simulation and UAT parity) to decide from, and recording a
      preference before that signal exists would be guessing.
      Write docs/migration/decisions/0014-cutover-strategy.md with an
      explicit decision -- big-bang, or gradual/dual-running -- plus what
      happens to the Zig backend and when it is deprecated.
      (This requirement originally reserved 0013. That number went to
      decisions/0013-authorization-role-set.md on 2026-08-22, which was
      actually decided; records are numbered in decision order, not
      reservation order. See that record's "Note on numbering".)
      Reason from S7's actual output. Cite the specific parity results
      that support the choice; if S7's signal is weaker than the choice
      requires, the honest decision is to say so and name what further
      evidence would settle it, not to pick one and defend it.
      This requirement is blocked until S7 completes. It is drafted now
      so the open question has an owner and an id, not so it can be
      started early.
    acceptance_criteria:
      - "docs/migration/decisions/0014-cutover-strategy.md exists with an explicit decision, not a pros/cons list"
      - "the decision cites concrete S7 parity results by name, rather than reasoning from first principles about migration strategies in general"
      - "the fate of the Zig backend is stated with a condition for deprecation, not a date"
      - "docs/migration/stage-8-frontend-cutover.md's Decisions section is updated to link the record and no longer list the question as open"
      - "if S7's signal is judged insufficient, that verdict is the recorded decision and it names the specific missing evidence"
    depends_on: [REQ-122]

