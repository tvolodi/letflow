  - id: REQ-120
    title: Settle the design-token question -- one token source, or a recorded decision not to have one
    owner: CODE-DESIGNER
    status: pending
    stage: S8
    impl_order: 239  # letflow-queue task id; depends_on translated to queue task id [232]
    description: >
      The frontend currently holds THREE unreconciled positions on
      colour:
      (1) docs/frontend/design-system.md defines a --color-neutral-*
      scale and says it lives in web/src/styles/tokens.css;
      (2) design-tokens/letflow.tokens.json (migrated from R-Co's
      r-co.tokens.json) defines a different, smaller palette and is read
      by no source file, test, or build step;
      (3) the components themselves use inline style objects with
      literal hex values, which the `literal-colour` guard pattern does
      not catch because it only matches CSS-style declarations ending in
      a semicolon.
      Produce a design artefact under lib/letflow/design/ that picks ONE
      and says why: build tokens.css and migrate components to it; adopt
      the JSON token file as the source and generate from it; or record
      that inline styles are the accepted approach and correct both
      documents plus the guard's stated rationale to match.
      This is a design requirement -- it produces the artefact and the
      decision, not the component migration. If the chosen path implies
      touching many components, that implementation is a follow-on
      requirement this one names and sizes.
      Whichever path is chosen must close the guard gap: today the
      design system claims enforcement in exactly the place it has none.
      Either the guard starts catching inline literals, or the doc stops
      claiming it is enforced.
    acceptance_criteria:
      - "a design artefact exists under lib/letflow/design/ naming one chosen approach explicitly, not a pros/cons list"
      - "the decision reasons about all three current positions by name, including why design-tokens/letflow.tokens.json is or is not adopted"
      - "the decision states what happens to the `literal-colour` guard pattern in web/tests/guards/forbidlist.ts under the chosen approach"
      - "if the chosen approach implies component changes, a follow-on requirement is drafted with its scope and a count of how many files it touches, from a real grep rather than an estimate"
      - "no component under web/src/components/ is modified by this requirement"
    depends_on: [REQ-119]

