  # not apply: get_next_task only returns tasks whose depends_on are
  # satisfied, and each requirement's depends_on was translated to queue
  # task ids at registration. Stage gates remain ORCH's to enforce
  # (ORCHESTRATOR.md Section 8); the queue enforces dependencies, not stages.
  #
  # See ISS-0231 for the remediation gap this surfaced: ISS-0221 closed
