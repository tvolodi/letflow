      SECURITY (INV-1, INV-5, INV-8).
    acceptance_criteria:
      - "POST /api/v1/instances creates an instance via Letflow.Engine and returns 201 with the instance id, demonstrated end-to-end through the real router"
      - "a create whose correlation key duplicates an existing active instance in the same tenant returns a 409-class problem document, not a 500 and not an unhandled constraint error (INV-8); the same correlation key used in a different tenant succeeds -- two explicit tests"
      - "cancel and reconstruct against an instance id belonging to another tenant each return the same response as a nonexistent id, and leave the target instance's state unchanged, verified by reading the row afterwards (INV-5)"
