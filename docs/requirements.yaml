      Read lib/letflow/identity.ex's actual public functions and route to
      them; if a handler needs a domain function that does not exist, add the
      thin function there rather than inlining a Repo query in the handler,
      and say so in the completion report.
      Every response goes through REQ-066's builders, every list through
      REQ-067's cursor pagination, every body through REQ-068's validation,
      every action through REQ-069's UsersGroupsRolesManage permission check,
      and every query through REQ-072's scoped prefix.
      SECURITY (INV-2): a user representation must never serialise password
