  - id: REQ-075
    title: Identity routes 3/4 -- tenant administration (identity.zig 6 tenant handlers)
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 142  # letflow-queue task id
    description: >
      Port the tenant-administration handler group of
      src/api/routes/identity.zig: handleCreateTenant (L222), handleListTenants
      (L674), handleGetTenant (L695), handlePatchTenant (L713),
      handleDeactivateTenant (L822), handleReactivateTenant (L851).
      THIS GROUP IS DIFFERENT FROM EVERY OTHER ROUTE REQUIREMENT IN THIS BATCH
      AND MUST NOT BE TREATED AS ROUTINE. Tenants are the isolation boundary
      itself, so these handlers operate on the public/global schema
      (tenant_schemas per REQ-022, and decision 0006 D3's list of tables that
      legitimately keep a tenant_id foreign key) rather than inside a single
      tenant's schema. REQ-072's prefix-scoping therefore does NOT protect
      them -- a bug here is a platform-wide cross-tenant leak, not a
      single-tenant one.
      The gate is REQ-069's PLATFORM_ADMIN role: listing, reading, patching,
      deactivating or reactivating any tenant requires it. A caller with any
      other role -- including a tenant's own administrator -- must not be able
      to enumerate tenants or read another tenant's record. Whether a tenant
      admin may read or patch their OWN tenant record is a real question R-Co's
      handlers answer; read handleGetTenant and handlePatchTenant and port
      R-Co's actual rule, stating it explicitly in the moduledoc.
      Tenant creation overlaps REQ-022's Letflow.TenantProvisioning (schema
      creation plus migration replay) and REQ-076's onboarding flow. This
      requirement routes to TenantProvisioning; it does NOT reimplement
      provisioning, and it must state in the moduledoc how handleCreateTenant
      relates to the onboarding endpoint so the two are not two divergent
      creation paths.
      Deactivation interacts with Letflow.Plugs.TenantStatus (REQ-021,
      mounted by REQ-071): confirm what a deactivated tenant's subsequent
      requests receive and that the answer is consistent with that plug's
      :migrating handling rather than a second, conflicting status rule.
      SECURITY (INV-1, INV-2, INV-6): this is the highest-risk requirement in
      the batch.
    acceptance_criteria:
      - "listing tenants as a non-PLATFORM_ADMIN caller returns 403 and no tenant data whatsoever, including no count and no total, demonstrated by asserting the full response body"
      - "reading, patching, deactivating and reactivating another tenant's record as a caller authenticated for a different tenant is rejected, with each of the four verbs covered by its own test and each verified to leave the target tenant's row unchanged (INV-1)"
      - "the moduledoc states R-Co's actual rule on whether a tenant admin may read or patch their own tenant record, and a test covers that rule in both the allowed and denied direction"
      - "tenant creation routes to Letflow.TenantProvisioning and results in a provisioned schema with REQ-022's migrations replayed, demonstrated by querying information_schema for a table in the new schema -- not by trusting the 201"
      - "a deactivated tenant's subsequent authenticated request receives a response consistent with Letflow.Plugs.TenantStatus's behaviour, with the expected status named in the moduledoc and asserted by a test"
      - "the moduledoc states explicitly that these handlers operate outside REQ-072's per-tenant prefix scoping, names PLATFORM_ADMIN as the only protection, and explains why that makes this group higher-risk than the rest of S4"
      - "the moduledoc states how handleCreateTenant relates to REQ-076's onboarding endpoint, so the platform has one provisioning path rather than two"
    depends_on: [REQ-073]

  - id: REQ-076
    title: Identity routes 4/4 -- API tokens, role registry, and tenant onboarding (identity.zig tokens/roles + onboarding.zig)
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 143  # letflow-queue task id
    description: >
      Port the final identity handler group plus the onboarding route:
      identity.zig's handleCreateToken (L570), handleListTokens (L634),
      handleRevokeToken (L651), handleListRoles (L1169), handleUpsertRole
      (L1203); and src/api/routes/onboarding.zig (920 lines / 3 handlers:
      handleOnboarding L47, handleGetOnboarding L283,
      handleGetOnboardingByHostname L379), whose backing subsystem is REQ-022's
      Letflow.TenantProvisioning.
      SECURITY -- API TOKENS ARE SECRET MATERIAL (INV-4), and this is the one
      route group in S4 where a response legitimately contains a secret. The
      rules, all mandatory: the token plaintext is returned exactly once, in
      the 201 response to creation, and is never retrievable afterwards;
      storage is a hash, never the plaintext; handleListTokens returns
      metadata only (id, name, created_at, last_used_at, revoked_at) and never
      the token or its hash; the plaintext is never logged, never included in
      an error detail, and never written into a trace. Confirm each of these
      against R-Co's handleCreateToken rather than assuming, and if R-Co
      diverges from any of them, that divergence is NOT ported -- record it as
      a deliberate hardening in the moduledoc, since INV-4 sits above a port's
      fidelity to source.
      Token revocation must take effect on the next request, not on a cache
      expiry -- state and test the propagation guarantee, since a revoked
      credential that keeps working is the failure mode that matters.
      The role registry (handleListRoles/handleUpsertRole) writes the
      role-to-permission data REQ-069's matrix reads; confirm whether R-Co's
      upsert can define a role outside authorization.zig's five-value Role
      enum and port the actual constraint.
      Onboarding: handleGetOnboardingByHostname is reachable by hostname
      rather than by an authenticated tenant, so it is a pre-authentication
      lookup -- establish exactly what it may disclose about a tenant that
      does or does not exist, and hold it to INV-5's indistinguishability
      standard for an unknown hostname.
      SCOPE BOUNDARY: does not build a new tenant-provisioning mechanism;
      routes to REQ-022's Letflow.TenantProvisioning, the same one REQ-075's
      handleCreateTenant uses.
    acceptance_criteria:
      - "creating an API token returns the plaintext exactly once in the 201 body, and a subsequent GET of that token returns metadata with no token field, demonstrated by two tests (INV-4)"
      - "the persisted token record does not contain the plaintext in any column, verified by querying the row and asserting no column equals the returned plaintext (INV-4)"
      - "the token plaintext appears in no log line and no error body, verified by capturing logs across a successful creation and a deliberately failed one (INV-4)"
      - "a revoked token is rejected with 401 on the very next request, demonstrated by a test that revokes and immediately retries with no sleep or cache flush"
      - "a token created in tenant A cannot authenticate a request for tenant B's resources, demonstrated by a test (INV-1)"
      - "handleUpsertRole's constraint on role names matches R-Co's actual behaviour, with the observed constraint named in the moduledoc and a test covering both an accepted and a rejected role name"
      - "GET onboarding by an unknown hostname returns a response indistinguishable from one for a hostname whose tenant exists but is not the caller's, demonstrated by comparing the two responses (INV-5)"
      - "onboarding creates a tenant via Letflow.TenantProvisioning rather than a second provisioning path, confirmed by inspection and stated in the moduledoc"
    depends_on: [REQ-075]

  - id: REQ-077
    title: Promotion pipeline routes (promotion_review.zig, promotions.zig, promotion_read.zig, promotion_assertion.zig, promotion.zig, definition_rollback.zig)
    owner: ELIXIR-DEV
    status: pending
    stage: S4
    impl_order: 144  # letflow-queue task id
    description: >
      Port the six promotion-pipeline route modules as one requirement --
      they total 1,844 lines but 1,140 of that is promotion_review.zig's five
      handlers, and the other five modules are thin single-purpose routes over
      domain logic S2/S3 already built:
      - promotion_review.zig (940 / 5 handlers: handleSubmitPromotion L72,
      handleGetPromotionContext L264, handleApproveReview L371,
      handleRejectReview L482, handleApplyReview L580) over REQ-035/037's
      PromotionReview store.
      - promotions.zig (288) and promotion.zig (111) over REQ-036/037's
      promotion plan and ENV-03 base promote.
      - promotion_read.zig (169) over REQ-036's plan/conflict/digest reads.
      - promotion_assertion.zig (203) over REQ-040's assertion re-run.
      - definition_rollback.zig (133) over REQ-038's PRM-08 rollback.
      All six are thin HTTP surfaces over `done` context modules. Read those
      modules' actual public functions before writing a handler; if a handler
      needs logic that does not exist, add it to the context module, never
      inline in the route.
      Two contracts already established in S2/S3 must be preserved through the
      HTTP layer rather than re-derived: REQ-040's assertion-run idempotency
      (backed by the unique index on idempotency_key that REQ-064 simplified,
      consumed via on_conflict: :nothing) means a repeated POST with the same
      idempotency key must not produce a second run; and REQ-064 confirmed
      promotion_reviews' plan_digest uniqueness is per-tenant, so two tenants
      submitting the same digest are two independent reviews.
      Approve/reject/apply are state transitions on a review, so a stale or
      out-of-order transition (approving an already-applied review) must be
      rejected with a 409-class problem document rather than silently
      re-applying.
      SECURITY (INV-1, INV-5): every handler scopes through REQ-072; a review
