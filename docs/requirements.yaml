      - get_by_instance_id/1: reads the snapshot row for an instance_id;
      not-found error if absent.
      No update path is exposed anywhere on this module -- snapshots are
      immutable after creation (definition.md: "Snapshots read-only after
      creation; no API endpoint permits modification").
      BOUNDARY NOTE (name explicitly, do not silently assume): per
      definition.md's PD-08 section and stage-2-event-store-definitions.md's
      own grounding for this file, the engine calling create/2 "at
      instance-start time (EE-01), BEFORE any event is appended" is S3's job
      (the engine doesn't exist in Letflow yet) -- this requirement builds
      only the store's create/retrieve operations in isolation, fully
      testable without any engine code, per definition.md's own "Stage 2
      boundary" rationale for why this file lives in the definition module
      rather than src/engine/.
    acceptance_criteria:
      - "create/2 against a valid definition_id inserts a snapshot row whose graph matches the source process_definitions row's graph at the moment of the call"
      - "create/2 called twice with the same instance_id is idempotent (no error, no second row) OR returns a distinct SnapshotAlreadyExists-equivalent error -- pick one behavior and state which in the moduledoc, since definition.md's own text supports the idempotent reading for an EE-01 retry"
      - "get_by_instance_id/1 against an instance_id with no snapshot returns a not-found error, not nil silently"
      - "deleting a process_definitions row that an instance_definition_snapshots row references is rejected by the database (foreign_key_violation), and the snapshot row remains present and unmodified -- per PD-08's no-ON-DELETE-CASCADE design (REQ-027); a snapshot is never removed as a side effect of deleting its source definition"
      - "the moduledoc explicitly states the EE-01 instance-start integration point is S3 scope, not built here"
    depends_on: [REQ-027]

