  - id: REQ-113
    title: Parallel test-runner script (scripts/test_parallel.sh) via Elixir's native --partitions
    owner: ELIXIR-DEV
    status: done
    stage: S4
    impl_order: 188  # letflow-queue task id (registered 2026-08-21, mirrors GH#376)
    description: >
      Not a port of any R-Co source path -- this is dev-pipeline tooling for
      Letflow's own build/test loop, sized and gated the same way REQ-013's
      single-command check gate was (see that entry's rationale for why a
      non-porting tooling item still belongs in this schema).
      Tagged stage: S4 per
      docs/migration/decisions/0008-cross-cutting-tooling-stage-and-doc-ownership.md's
      Option A (the currently active stage at draft time, since this doesn't
      port an R-Co source path the way S0-S8 are otherwise defined -- not a
      claim of S4 subsystem lineage).
      Measured on hetzner-prod 2026-08-21 (~/workspace/letflow-1, 8 vCPU,
      single shared postgres:16 container): 43 of 44 `async: false` test
      files under `Letflow.DataCase` are sync because they provision real
      tenant Postgres schemas via `Ecto.Migrator`, which cannot run inside a
      single sandboxed connection -- so they flip `Letflow.Repo` to
      `Sandbox.mode(:auto)` for the duration, forcibly checking in every
      other currently-checked-out sandboxed connection in the pool.
      `async: false` is what makes this safe (ExUnit guarantees no other test
      is running when the switch happens), not schema-name uniqueness -- the
      constraint is a single process-global Repo/pool/mode switch, not a
      Postgres-level conflict between differently-named schemas.
      `config/test.exs` (line 21) already supports per-partition databases:
      `database: "letflow_test#{System.get_env("MIX_TEST_PARTITION")}"` --
      exactly the mechanism Elixir's native `mix test --partitions N` flag
      uses. Each partition runs as a SEPARATE OS process with its own Repo
      pool and independent sandbox-mode state, so the global-switch
      constraint above does not apply across partitions, only within one.
      Confirmed empirically: `MIX_TEST_PARTITION=N mix test --partitions 4`
      (4 parallel background processes, one `mix compile` run first to avoid
      a concurrent-compile race across the 4 processes) completed in 80s
      wall-clock vs. the known single-process baseline of 608.7s
      (test/reports/report-20260820-WF02-REQ066-20260820.yaml) -- 7.6x
      speedup, combined partition test counts (315+381+262+267 tests +
      1+4 properties = 1230) matching the baseline's total exactly, zero
      failures in any partition that run. NOTE: the baseline's 14
      pre-existing environmental failures (ISS-0048/0050/0060/0062/0064
      class) did not reproduce in that run, but this is NOT evidence that
      class is fixed -- it is known-flaky under contention and this
      requirement's acceptance criteria must not assert those failures are
      gone.
      BUILD: a script (scripts/test_parallel.sh, or equivalent -- exact
      structure is this requirement's own implementation detail, not
      prescribed here) that: (1) pre-compiles MIX_ENV=test once before
      launching any partition, to avoid the concurrent-compile race the
      measurement above worked around by hand; (2) launches N
      `MIX_TEST_PARTITION=<i> mix test --partitions N` background processes
      against the shared Postgres instance, where N is derived from
      `nproc` (or the platform equivalent) or a configured default -- never
      hardcoded to 4; (3) waits for all N processes to finish; (4)
      aggregates each partition's own reported pass/fail/failure counts into
      one combined total (not merely "the script exited"); (5) exits
      non-zero if any partition failed, zero only if all partitions passed.
      This does NOT include wiring the script into TEST-RUNNER/RELEASE-
      VALIDATOR's workflow steps or editing any docs/agents/workflows/*.md
      file -- that is REQ-114, which depends on this one.
      FILE PLACEMENT NOTE (flag for REQ-VALIDATOR, not resolved here):
      `docs/agents/instructions/core-directives.md`'s "File Placement
      Rules" table and `docs/agents/AGENT_SYSTEM.md`'s "Artifact locations"
      table do not currently list `scripts/` as a row, even though
      `scripts/` already exists in the repo (currently empty) and
      `docs/migration/decisions/timed_test.sh` is an existing precedent for
      shell tooling living outside `lib/`/`test/`. This requirement does not
      add that row itself (not this role's file to hand-maintain per
      AGENT_SYSTEM.md section 9) -- REQ-VALIDATOR or ORCH should decide
      whether it's worth a follow-up doc fix.
    acceptance_criteria:
      - "the script produces the same combined pass/fail/property totals as a single-process `mix test` run against the same commit, demonstrated by running both and quoting both actual outputs side by side -- not asserted from the 2026-08-21 measurement above, which is background, not a substitute for this run's own verification"
      - "the aggregation step actually sums/cross-checks each partition's own reported counts (parsed from each partition's real output) rather than only checking that the script process exited -- demonstrated by showing the per-partition counts and the combined total together"
      - "the script exits non-zero when at least one partition fails, demonstrated by deliberately introducing one failing test, running the script, and quoting its actual exit code and output; the script exits zero when all partitions pass, demonstrated the same way on a clean run"
      - "N (partition count) is derived from `nproc`/platform equivalent or an explicit configured default, verified by reading the script -- not hardcoded to a fixed number anywhere in the script body"
      - "the script pre-compiles MIX_ENV=test exactly once before launching any partition process, verified by reading the script and by the demonstrated run showing no concurrent-compile race"
      - "the script lives under scripts/ (per this repo's existing convention for tooling outside lib/letflow/, e.g. docs/migration/decisions/timed_test.sh), not under lib/ or test/"
    depends_on: []

