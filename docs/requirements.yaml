  - id: REQ-033
    title: Definition snapshot store (snapshot.zig, PD-08)
    owner: ELIXIR-DEV
    status: pending
    stage: S2
    impl_order: 46  # letflow-queue task id
    description: >
      Port src/definition/snapshot.zig's SnapshotStore (per
      src/design/definition.md's PD-08 section) as a
      Letflow.Definitions.SnapshotStore module operating on REQ-027's
      instance_definition_snapshots and process_definitions tables:
      - create/2 (instance_id, definition_id): reads the definition row
      under a shared lock (SELECT ... FOR SHARE, per definition.md's
      "Atomicity guarantee" -- prevents a concurrent delete or
      exclusive-lock write from racing the snapshot capture) and inserts the
      snapshot row, both in one transaction; ON CONFLICT (instance_id) DO
      NOTHING semantics for idempotency (a retry of the same instance_id's
      snapshot creation is a no-op, not a second row); not-found error if
