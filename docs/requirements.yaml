# Letflow — Requirements
#
# Source of truth for work packages fed to agents (see CLAUDE.md and
# .claude/agents/*.md). Each requirement is sized to one agent turn:
# one owner, one deliverable, acceptance criteria an agent can check
# itself before reporting done.
#
# Status values: pending | in_progress | done | blocked
#
# Early development produced a handful of one-off findings (idiomatic
# OTP usage, dev-loop feel, process-per-instance design, static-typing
# gap) via a goals/evaluation_goal mechanism that has since been
# retired now that Letflow is a committed migration rather than an
# evaluation — see docs/status/requirement_status.yaml for the removal
# record and the condensed verdicts folded into
# docs/migration/stage-2-event-store-definitions.md and
# stage-3-instance-engine.md, the two places that still needed them.

# ---------------------------------------------------------------------
# Stages — full R-Co -> Elixir migration
#
# Letflow is the target of a full migration of R-Co
# (c:\Users\tvolo\dev\ai-dala\R-Co\) to Elixir, staged rather than
# attempted in one pass. See docs/migration/README.md for the full
# rationale and R-Co source-path grounding behind each stage.
#
# Only Stage 0 is broken into requirements today. Stages 1-8 stay as
# scoped descriptions until the stage before them lands — writing their
# requirements now would mean guessing at interfaces Stage 0 hasn't
# decided yet. Expand each stage into REQ-xxx entries (same schema as
# below, "one agent turn per requirement") when it becomes the active
# stage.
# ---------------------------------------------------------------------

stages:
  - id: S0
    name: foundation-and-scaffolding
    description: >
      Elixir project shape, Phoenix adoption decision, Ecto schema
      strategy for the 146-migration data model this eventually needs
      to cover, CI equivalent to `zig build check`, and a decision
      record on hand-rolled vs. library-backed for major subsystems
      (starting with OIDC). Everything else depends on this.
    depends_on: []
    detail_file: docs/migration/stage-0-foundation.md

  - id: S1
    name: identity-and-multi-tenancy
    description: >
      Port src/identity/ (18 files) and src/oidc/ (13 files): Keycloak
      OIDC login, JIT user provisioning, tenant resolution/binding,
      role registry. Everything downstream is tenant-scoped, so this
      must be real before S2.
    depends_on: [S0]
    detail_file: docs/migration/stage-1-identity.md

  - id: S2
    name: event-store-and-definitions
    description: >
      Port src/event_store/ (3 files: store, platform, registry) and
      src/definition/ (12 files: graph, promotion, rollback, sandbox,
      export/import, service-scope validation). See
      docs/migration/stage-2-event-store-definitions.md's "Early
      findings" section before designing the event log and data
      shapes.
    depends_on: [S1]
    detail_file: docs/migration/stage-2-event-store-definitions.md

  - id: S3
    name: instance-engine
    description: >
      Port src/engine/ (11 files: instance execution/transition,
      snapshot + reconstruction, service task dispatch, plugin
      registry, Lua script audit). Generalizes Letflow's existing
      ProcessInstance / ParallelApproval / InstanceSupervisor pattern
      rather than starting fresh.
    depends_on: [S2]
    detail_file: docs/migration/stage-3-instance-engine.md

  - id: S4
    name: api-surface
    description: >
      Port src/api/routes/ (22 modules: definitions, instances, tasks,
      promotions, onboarding, audit, tenant_config, webhooks, dlq,
      solution_packs, metrics/health/openapi, ...) and
      src/api/middleware/ (auth, rate_limit, quota_enforcement,
      tenant_status, trace, validate) as Phoenix controllers/plugs.
    depends_on: [S3]
    detail_file: docs/migration/stage-4-api-surface.md

  - id: S5
    name: scripting-and-plugins
    description: >
      Port src/lua/ (29 files, service-task scripting host) and
      src/wasm/ (19 files, plugin host API). Needs an explicit
      build-vs-bind decision (Elixir NIFs/Ports to existing Lua/WASM
      runtimes vs. reimplementing) before work starts.
    depends_on: [S3]
    detail_file: docs/migration/stage-5-scripting-plugins.md

  - id: S6
    name: operational-cross-cutting
    description: >
      Port src/scheduler, src/secrets (+ integration), src/obs,
      src/webhook, src/dlq, src/repository, src/expr, src/ordering.
    depends_on: [S4]
    detail_file: docs/migration/stage-6-operational-cross-cutting.md

  - id: S7
    name: simulation-and-uat-parity
    description: >
      Port what's portable from tests/simulation, tests/differential,
      tests/uat-reports — enough to re-run R-Co's existing business
      scenarios (SwiftRoute/Vortex/Meridian) against the Elixir
      backend as a correctness gate.
    depends_on: [S4, S5, S6]
    detail_file: docs/migration/stage-7-simulation-uat-parity.md

  - id: S8
    name: frontend-integration-and-cutover
    description: >
      Point web/ (or a compatible surface) at the Elixir backend,
      close API gaps found in practice, decide on cutover/deprecation
      of the Zig backend.
    depends_on: [S7]
    detail_file: docs/migration/stage-8-frontend-cutover.md

requirements:
  # ---------------------------------------------------------------
  # S0 — foundation-and-scaffolding
  # Full-migration mission starts here. Nothing in S1+ can be sized
  # correctly until S0's decisions (Phoenix or not, OIDC library or
  # hand-rolled, Ecto schema strategy) actually land.
  # ---------------------------------------------------------------

  - id: REQ-010
    title: Write a decision record for Phoenix vs. plain Plug/Bandit
    owner: ELIXIR-DEV
    status: done
    stage: S0
    impl_order: 4  # letflow-queue task id (registered retroactively, already done)
    description: >
      Letflow currently uses plain Plug + Bandit for 3 routes
      (lib/letflow/router.ex). R-Co's src/api/routes/ has 24 route
      modules plus a 7-module middleware chain
      (src/api/middleware/: auth, rate_limit, quota_enforcement,
      tenant_status, trace, validate, content_type). Write
      docs/migration/decisions/0001-web-framework.md recording
      whether Letflow migrates to Phoenix (router pipelines, plugs,
      controllers) or continues hand-rolling on Plug/Bandit at this
      scale, with the concrete reasoning (route count, middleware
      chain composition, community/library support for OIDC
      integration). This is a decision record, not a rewrite of
      lib/letflow/router.ex itself — that migration happens under S4.
    acceptance_criteria:
      - "docs/migration/decisions/0001-web-framework.md exists with an explicit decision (Phoenix | Plug/Bandit), not just a pros/cons list"
      - "decision explicitly reasons about src/api/middleware/'s 6 modules and how each maps to the chosen framework's mechanism (Phoenix plug pipeline vs. hand-rolled Plug.Builder chain)"
      - "decision references the actual route count (24, from src/api/routes/) as part of the reasoning, not a rounded/guessed number"
    depends_on: []

  - id: REQ-011
    title: Write a decision record for OIDC/Keycloak integration approach
    owner: ELIXIR-DEV
    status: done
    stage: S0
    impl_order: 5  # letflow-queue task id
    description: >
      R-Co hand-rolls OIDC in src/oidc/ (13 files) and src/identity/
      (18 files: JIT provisioning, JWKS cache, role registry, tenant
      binding). Write
      docs/migration/decisions/0002-oidc-integration.md evaluating
      hand-rolling the equivalent in Elixir vs. adopting an existing
      library (e.g. assent, ueberauth + an OIDC strategy) against
      R-Co's actual requirements: multi-realm/multi-tenant Keycloak,
      JIT user provisioning, JWKS caching, custom role registry. State
      which specific R-Co behaviors (name the file, e.g.
      src/oidc/jit_provisioning.zig's JIT provisioning orchestration)
      a library would or wouldn't cover out of the box.
    acceptance_criteria:
      - "docs/migration/decisions/0002-oidc-integration.md exists with an explicit decision, not just a pros/cons list"
      - "decision names at least 2 real R-Co identity behaviors (from src/identity/ or src/oidc/, by filename) and states whether the chosen approach covers each"
      - "if a library is chosen, decision names the specific library and version constraint"
    depends_on: []

  - id: REQ-012
    title: Design the Ecto schema/migration strategy for the target data model
    owner: ELIXIR-DEV
    status: done
    stage: S0
    impl_order: 6  # letflow-queue task id
    description: >
      R-Co has 146 Postgres migrations under migrations/. Write
      docs/migration/decisions/0003-ecto-schema-strategy.md covering:
      whether Letflow ports the existing SQL schema as Ecto migrations
      1:1 (preserving table/column names for easier cross-referencing
      during the port) or redesigns it Ecto-idiomatically; how
      multi-tenancy is represented at the schema level (tenant_id
      column vs. schema-per-tenant vs. database-per-tenant — R-Co's
      adp-01..04 design docs under R-Co's src/design/ describe its own
      tenant-column approach, read those first rather than
      re-deriving from scratch); and how the event-sourced tables
      (event_store) differ in migration strategy from regular CRUD
      tables. Do not write actual migrations yet — this is the
      strategy doc S2/S3 requirements will follow.
    acceptance_criteria:
      - "docs/migration/decisions/0003-ecto-schema-strategy.md exists with an explicit decision on 1:1 port vs. redesign"
      - "doc explicitly addresses R-Co's tenant-column approach (cite the specific adp-0x design doc(s) read under R-Co's src/design/) and states whether Letflow adopts or diverges from it, with reasoning"
      - "doc distinguishes event-store migration strategy from regular table migration strategy"
    depends_on: []

  - id: REQ-013
    title: Set up CI/local-check equivalent to `zig build check`
    owner: ELIXIR-DEV
    status: done
    stage: S0
    impl_order: 7  # letflow-queue task id
    description: >
      R-Co's `zig build check` (see R-Co's README.md "Development
      commands" table) runs build-with-error-sets-fail-via-exit-code
      plus `zig fmt --check` scoped to changed files, as a single gate
      command. Add an equivalent single-command gate for Letflow — a
      `mix letflow.check` alias or plain shell script (learn from the
      documented failure mode in docs/status/requirement_status.yaml's
      REQ-003 history: a custom Mix task under lib/ forces a full
      project compile just to be discovered, which previously broke
      timing capture — decide here whether that same problem applies
      to a check gate, and pick alias vs. script accordingly) running
      `mix format --check-formatted`, `mix compile --warnings-as-errors`,
      and `mix test`.
    acceptance_criteria:
      - "a single command runs format-check + compile-with-warnings-as-errors + test, exits non-zero on any failure"
      - "the command's location (Mix alias vs. standalone script) has an explicit one-line justification referencing whether task-discovery compile overhead applies here, same concern documented in requirement_status.yaml's REQ-003 history"
      - "running it against a clean checkout is demonstrated (actual output quoted, or explicit note if no toolchain available per CLAUDE.md's No Speculation rule)"
    depends_on: []

  - id: REQ-014
    title: Add REVIEWER verdict on S0's four decision records before S1 starts
    owner: REVIEWER
    status: done
    stage: S0
    impl_order: 9  # letflow-queue task id; depends_on translated to queue task ids [4,5,6,7]
    description: >
      Once REQ-010..013 land, review the four decision records
      (0001-web-framework, 0002-oidc-integration,
      0003-ecto-schema-strategy, and the check-gate choice from
      REQ-013) together for internal consistency — e.g. does the OIDC
      approach chosen in 0002 actually fit the web framework chosen in
      0001; does the tenant-modeling choice in 0003 match what 0002
      assumes about tenant resolution. Flag any contradiction before
      S1 (identity-and-multi-tenancy) begins, since S1 is the first
      stage that depends on all of S0.
    acceptance_criteria:
      - "docs/migration/stage-0-foundation.md gains a dated REVIEWER section citing all four S0 decisions by file"
      - "verdict explicitly states go/no-go for starting S1, and if no-go, exactly which decision needs revisiting"
    depends_on: [REQ-010, REQ-011, REQ-012, REQ-013]

  # ---------------------------------------------------------------
  # MVP-1 — minimum visible-GUI vertical slice (milestone, not a
  # stage). See docs/migration/mvp-1-vertical-slice.md. Each
  # requirement below carries the real stage it narrowly front-runs
  # (stage:) plus milestone: MVP-1, so this slice being done is never
  # confused with that stage itself being done. Deliberately narrow —
  # skips real OIDC/Keycloak, full Ecto schema parity, and the full
  # definition-driven engine; see the detail file's "Relationship to
  # S0-S8" section for exactly what's deferred and why each shortcut
  # is safe (mainly: web/'s own frontend spec already documents a
  # dev-mode bootstrap-token path, so MVP-1 isn't inventing one).
  # ---------------------------------------------------------------

  - id: REQ-101
    title: Record a provisional MVP-1 web-framework note (not a full S0 decision)
    owner: ELIXIR-DEV
    status: cancelled  # MVP-1 milestone dropped by user, commit d41beb0 deleted
      # docs/migration/mvp-1-vertical-slice.md (this and REQ-102..108's target file)
      # with no replacement; see docs/status/requirement_status.yaml
    stage: S0
    milestone: MVP-1
    impl_order: 8  # letflow-queue task id
    description: >
      MVP-1 needs only 3-4 routes. Rather than blocking on the full
      Phoenix-vs-Plug/Bandit decision (REQ-010, still pending), add a
      short provisional note to
      docs/migration/mvp-1-vertical-slice.md's Decisions section
      confirming the existing lib/letflow/router.ex (plain Plug +
      Bandit) is sufficient for MVP-1's route count, and explicitly
      state this note is superseded by whatever
      docs/migration/decisions/0001-web-framework.md eventually
      decides for the real S4 — this is not that decision record and
      must not be confused with one.
    acceptance_criteria:
      - "docs/migration/mvp-1-vertical-slice.md's Decisions section states the provisional choice (continue on Plug/Bandit) with a one-line reason (route count)"
      - "the note explicitly says it is provisional and will be superseded by REQ-010/0001-web-framework.md, not a replacement for it"
      - "no docs/migration/decisions/*.md file is created or edited by this requirement"
    depends_on: []

  - id: REQ-102
    title: Minimal Ecto schema for MVP-1 (workflow_definitions + instances)
    owner: ELIXIR-DEV
    status: cancelled  # MVP-1 milestone dropped, see REQ-101's note
    stage: S0
    milestone: MVP-1
    impl_order: 10  # letflow-queue task id; depends_on translated to queue task id [8]
    description: >
      Add priv/repo/migrations for two tables scoped to MVP-1 only:
      workflow_definitions (id, name, and the static 4-state
      draft/submitted/approved/rejected graph shape already
      hardcoded in lib/letflow/process_instance.ex, now stored as
      data instead) and instances (id, definition reference, current
      state, plus a transition log — either a JSON column or a child
      table, whichever is less code for this narrow scope). No
      tenant_id column (MVP-1 assumes a single implicit tenant), no
      event-sourced replay, no attempt at parity with R-Co's 143
      migrations. Explicitly out of scope: anything
      docs/migration/decisions/0003-ecto-schema-strategy.md (REQ-012,
      still pending) will eventually decide for the real S2/S3 —
      note in the migration files' module docs that this schema is a
      throwaway-compatible MVP-1 slice, not the target schema.
    acceptance_criteria:
      - "priv/repo/migrations gains workflow_definitions and instances tables, both applied cleanly via mix ecto.migrate"
      - "a seed or fixture inserts the existing draft/submitted/approved/rejected workflow shape as a workflow_definitions row"
      - "migration file moduledocs state this is an MVP-1-scoped schema, explicitly not the eventual S2/S3 target schema"
    depends_on: [REQ-101]

  - id: REQ-103
    title: Static dev bearer-token auth plug (not real S1/OIDC)
    owner: ELIXIR-DEV
    status: cancelled  # MVP-1 milestone dropped, see REQ-101's note
    stage: S1
    milestone: MVP-1
    impl_order: 11  # letflow-queue task id; depends_on translated to queue task id [8]
    description: >
      Add a Plug that checks incoming requests for one hardcoded/
      config-seeded bearer token (e.g. via config/dev.exs or an env
      var, not committed as a literal secret) mapped to one dev user
      with unrestricted access. No Keycloak, no OIDC protocol
      handling, no JIT provisioning, no JWKS caching, no role
      registry — matches the dev-mode "bootstrap token" path already
      documented in R-Co's web/ frontend spec
      (BPM_Platform_Frontend_Requirements.md, Constraints &
      Assumptions section), so this is a real path the frontend
      expects to support, not an invented shortcut. Explicitly not
      real S1 (docs/migration/stage-1-identity.md) — must not be
      reported as S1 being done.
    acceptance_criteria:
      - "a request with the correct bearer token reaches the route handler; a request with a missing/wrong token gets 401"
      - "the token is read from config/env, not hardcoded as a literal string in a committed .ex file"
      - "the plug's moduledoc explicitly states this is MVP-1 dev-mode auth, not real S1, and names what real S1 still needs to add (Keycloak OIDC, JIT provisioning, JWKS caching, role registry)"
    depends_on: [REQ-101]

  - id: REQ-104
    title: Generalize ProcessInstance to run from a stored workflow_definitions row
    owner: ELIXIR-DEV
    status: cancelled  # MVP-1 milestone dropped, see REQ-101's note
    stage: S3
    milestone: MVP-1
    impl_order: 12  # letflow-queue task id; depends_on translated to queue task ids [10,11]
    description: >
      Generalize lib/letflow/process_instance.ex and
      lib/letflow/instance_supervisor.ex just enough to start an
      instance from a workflow_definitions row (REQ-102) instead of
      the currently hardcoded 4-state module, for exactly the one
      workflow shape REQ-102 seeded — not a generic definition-driven
      engine. Each transition still gets logged the same way the
      existing TransitionEvent/instances-log mechanism already does.
      Explicitly out of scope: service task dispatch, plugin
      registry, Lua script audit, or any other src/engine/ (S3)
      capability beyond running this one static shape from stored
      data.
    acceptance_criteria:
      - "starting an instance reads its state graph from the workflow_definitions row rather than a hardcoded module"
      - "the existing 4 states/transitions (draft/submitted/approved/rejected, submit/approve/reject/resubmit) still behave identically to today's hardcoded version"
      - "moduledoc states this is a narrow MVP-1 generalization, not the full S3 definition-driven engine, and names what S3 still needs (service task dispatch, plugin registry, Lua script audit)"
    depends_on: [REQ-102, REQ-103]

  - id: REQ-105
    title: 3-4 Plug routes for MVP-1 (list/create/get/transition), token-gated
    owner: ELIXIR-DEV
    status: cancelled  # MVP-1 milestone dropped, see REQ-101's note
    stage: S4
    milestone: MVP-1
    impl_order: 13  # letflow-queue task id; depends_on translated to queue task id [12]
    description: >
      Extend lib/letflow/router.ex with routes to list workflow
      definitions, create an instance, get an instance (current state
      + transition history), and post an action/transition — all
      gated by REQ-103's auth plug. Reuses the existing 3-route
      pattern already in router.ex rather than introducing a new
      routing library. Explicitly out of scope: the other ~18 R-Co
      route modules and 7 middleware modules (rate_limit,
      quota_enforcement, tenant_status, trace, validate,
      content_type) — note in the router moduledoc that these routes
      are an MVP-1 slice of the real S4 API surface, not S4 itself.
    acceptance_criteria:
      - "GET list-definitions, POST create-instance, GET instance-by-id, and POST transition all work end-to-end via curl against a running mix run --no-halt, demonstrated with actual request/response output quoted"
      - "all 4 routes reject requests without REQ-103's valid bearer token with 401"
      - "router moduledoc states these routes are an MVP-1 slice, not the full S4 API surface, and names the remaining route/middleware modules S4 still needs to port"
    depends_on: [REQ-104]

  - id: REQ-106
    title: Point web/ at the running Letflow API using the dev bootstrap token
    owner: ELIXIR-DEV
    status: cancelled  # MVP-1 milestone dropped, see REQ-101's note
    stage: S8
    milestone: MVP-1
    impl_order: 14  # letflow-queue task id; depends_on translated to queue task id [13]
    description: >
      Configure R-Co's existing web/ (React 19 + TypeScript SPA) to
      target the running Letflow API's base URL instead of the Zig
      backend, add CORS support to the MVP-1 routes if the browser
      requires it, and confirm the Application Shell plus at least
      one real view (Instance Board or Task Inbox) renders against
      Letflow using REQ-103's dev bootstrap token pasted into web/'s
      existing token-paste login field. Per S8's existing scope
      framing (docs/migration/stage-8-frontend-cutover.md), this is
      integration/config wiring only — no code changes inside web/
      itself are expected; if one turns out to be unavoidable, name
      it explicitly and keep it minimal.
    acceptance_criteria:
      - "web/ successfully loads workflow_definitions and/or instances from the running Letflow API, confirmed by an actual screenshot or described browser session, not just a curl check"
      - "the dev bootstrap token from REQ-103 is what authenticates the session, pasted through web/'s existing token field — no Keycloak/OIDC login flow involved"
      - "any change made inside web/ itself (vs. pure config/CORS) is called out explicitly with a one-line reason"
    depends_on: [REQ-105]

  - id: REQ-107
    title: End-to-end MVP-1 smoke test (HTTP + manual GUI walkthrough)
    owner: TEST-RUNNER
    status: cancelled  # MVP-1 milestone dropped, see REQ-101's note
    stage: S4
    milestone: MVP-1
    impl_order: 15  # letflow-queue task id; depends_on translated to queue task id [14]
    description: >
      Write an automated test exercising the full create-instance ->
      transition -> get-instance loop over HTTP against REQ-105's
      routes (extending the existing test/letflow/ suite), then
      separately perform and document a manual walkthrough of the
      same loop by driving REQ-106's running web/ GUI in a real
      browser end to end (per CLAUDE.md's UI-testing rule: type
      checks and automated tests alone don't confirm the feature
      works for a user) — create a workflow instance, drive at least
      one transition, and observe the updated state, all from the
      GUI, not curl.
    acceptance_criteria:
      - "mix test output is quoted showing the new HTTP-level MVP-1 test(s) passing alongside the existing suite"
      - "a written note (in this requirement's requirement_status.yaml entry) describes the actual manual GUI walkthrough performed — what was clicked, what was seen — not just 'it should work'"
      - "any bug found during either pass is either fixed with a quoted re-run, or filed as a blocker with the specific repro steps"
    depends_on: [REQ-106]

  - id: REQ-108
    title: REVIEWER sign-off gating MVP-1 as done
    owner: REVIEWER
    status: cancelled  # MVP-1 milestone dropped, see REQ-101's note
    stage: S1
    milestone: MVP-1
    impl_order: 16  # letflow-queue task id; depends_on translated to queue task id [15]
    description: >
      Once REQ-101..107 land, review all MVP-1 deliverables together
      and append a dated REVIEWER section to
      docs/migration/mvp-1-vertical-slice.md. Confirm each
      deliverable is honestly labeled provisional/narrow where it
      diverges from its real stage's eventual scope (no MVP-1 code or
      note quietly getting reported elsewhere as "S1 done" or "S4
      done"), and confirm nothing added contradicts an existing
      decision record under docs/migration/decisions/ (none are
      expected to exist yet at REQ-101/102's provisional-note level,
      but check REQ-010/011/012's status directly rather than
      assuming).
    acceptance_criteria:
      - "docs/migration/mvp-1-vertical-slice.md gains a dated REVIEWER section"
      - "verdict explicitly confirms each of REQ-101..106's deliverables carries honest provisional/narrow framing, citing the specific moduledoc/note in each"
      - "verdict explicitly checks REQ-010/011/012's current status in docs/requirements.yaml and states whether any MVP-1 deliverable conflicts with a decision recorded there"
    depends_on: [REQ-107]

  # ---------------------------------------------------------------
  # S1 — identity-and-multi-tenancy
  # Expanded once S0's four decision records were REVIEWER-gated GO
  # for S1 (docs/migration/stage-0-foundation.md's dated 2026-08-15
  # REVIEWER section). Inherits docs/migration/decisions/
  # 0002-oidc-integration.md (ueberauth_oidcc for token-verification/
  # JWKS-caching only; JIT provisioning, tenant<->realm binding, role
  # registry, and Keycloak Admin REST API provisioning are ALL
  # hand-rolled regardless of library choice) and
  # 0003-ecto-schema-strategy.md Decision B (schema-per-tenant via
  # Ecto :prefix/dynamic-repo, tenant_id retained intra-schema — NOT
  # a tenant-column-only model). Real R-Co source ported:
  # src/identity/ (18 files) + src/oidc/ (13 files) + the identity
  # half of src/api/middleware/ (auth.zig, tenant_status.zig).
  #
  # Scope deliberately excludes (flagged as future work, not silently
  # dropped): OIDC-14's full realm-provisioning profile (token
  # lifetimes/password policy/MFA — realm_provisioning.zig),
  # OIDC-15's two-phase realm deletion (realm_deletion.zig),
  # realm_seed.zig's seed-artifact validation, migration_helper.zig's
  # bulk internal-to-OIDC user migration tooling,
  # verification_benchmark.zig, test_token_helper.zig, and
  # agent_lifecycle.zig's IdP-scope model for non-human actors — none
  # of these block a real OIDC login + JIT provisioning + tenant
  # resolution + role lookup working end to end, which is what
  # "S1 must be real before S2" (docs/migration/README.md) requires.
  # Onboarding's tenant-creation admin flow (onboarding.zig) and the
  # Keycloak Admin REST API adapter itself
  # (provider/adapters/keycloak/provider.zig) are also deferred past
  # this batch — see REQ-016's description for why realm provisioning
  # can be stubbed for S1's first pass.
  # ---------------------------------------------------------------

  - id: REQ-015
    title: Ecto schema/migrations for tenants, users, and tenant_role (Decision B)
    owner: ELIXIR-DEV
    status: done
    stage: S1
    impl_order: 28  # letflow-queue task id
    description: >
      Add priv/repo/migrations and corresponding lib/letflow/ Ecto schema
      modules for the three identity tables S1's later requirements build on,
      following docs/migration/decisions/0003-ecto-schema-strategy.md Decision
      B (schema-per-tenant via Ecto :prefix/dynamic-repo, tenant_id retained
      as an intra-schema column) and Decision A (Ecto-idiomatic: binary_id PK,
      Ecto.Enum for status columns, names preserved where R-Co's carry
      meaning). Port the column shapes from R-Co's src/design/adp-04-user-tenant-binding.md,
      adp-04a-external-identity-linkage-user.md, and adp-04b-tenant-realm-binding.md
      (all three read in full for this stage's expansion):
      - tenants: id (binary_id), slug (unique), display_name, status
        (Ecto.Enum, e.g. active/migrating per src/api/middleware/tenant_status.zig's
        MIGRATING check), idp_realm_id (string, nullable at the column level but
        enforced non-null-for-non-default-tenant by application logic per
        adp-04b — do not enforce that conditional rule via a DB CHECK
        constraint, it depends on runtime OIDC-mode config), plus a unique
        index on idp_realm_id (partial: WHERE idp_realm_id IS NOT NULL, per
        adp-04b's Open Question OQ-2 resolved in favor of partial — R-Co's own
        adp-04b leaves this open, so name the choice explicitly in the
        migration's moduledoc rather than silently picking one).
      - users: id (binary_id), tenant_id (binary_id, NOT NULL — no
        default-tenant-UUID backfill needed since Letflow has no legacy rows),
        username, display_name, email, password_hash, status (Ecto.Enum:
        active/inactive), auth_source (Ecto.Enum: internal/oidc, default
        internal), external_id (string, nullable), external_realm (string,
        nullable), inserted_at/updated_at. Add a partial unique index on
        (external_realm, external_id) WHERE external_id IS NOT NULL (adp-04a's
        NULL-collision-safe form, not a plain unique constraint) and an index
        on (tenant_id, status, inserted_at) per adp-04's
        idx_users_tenant_status_created. Do NOT add a CHECK constraint
        enforcing auth_source-vs-external-fields consistency (adp-04a's rule 2)
        at the DB level for this requirement — note in the schema moduledoc
        that this is an application-level (changeset) invariant, ported in
        REQ-018/REQ-019, not a migration-level one.
      - tenant_role: id (binary_id), name (string, unique per tenant schema),
        group_id (binary_id — references a groups table; if no groups table
        exists yet in Letflow, add a minimal groups table too: id, tenant_id,
        name — src/identity/role_registry.zig's upsertRole checks group
        existence before writing), inserted_at. Schema module should expose
        the same shape as src/identity/role_registry.zig's TenantRoleStore
        will need in REQ-020 (list, upsert-by-name).
      Per Decision B, all three tables are created via Ecto's :prefix option
      (or documented as pending the tenant-schema-provisioning mechanism if
      that mechanism itself isn't built yet — state explicitly in the
      migration moduledoc whether this requirement also builds the minimal
      tenant-schema-provisioning function/registry, or targets a single
      default schema for now with the multi-schema provisioning path flagged
      as a follow-up; either is acceptable but must be stated, not left
      ambiguous, since REQ-016..021 build on top of whichever choice is made
      here).
    acceptance_criteria:
      - "priv/repo/migrations gains migrations for tenants, users, groups, and tenant_role, all applying cleanly via mix ecto.migrate"
      - "corresponding lib/letflow/ Ecto.Schema modules exist for all four tables with @moduledoc citing the R-Co adp-04/04a/04b design doc each table's shape is ported from"
      - "the migration moduledoc explicitly states whether Ecto :prefix/schema-per-tenant provisioning is built in this requirement or deferred, per this requirement's own description"
      - "users has a partial unique index on (external_realm, external_id) WHERE external_id IS NOT NULL, not a plain unique constraint"
      - "no DB-level CHECK constraint enforces auth_source-vs-external-fields consistency; the schema moduledoc states this is deferred to application-level changesets"
    depends_on: []

