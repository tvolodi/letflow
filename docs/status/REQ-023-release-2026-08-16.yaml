    - id: ISS-0018
      severity: MINOR
      disposition: correctly incidental
      note: >
        security-invariants.md INV-4's verification greps use --include=*.ex
        and so cannot match config/*.exs. A defect in a gate's own instructions,
        not in REQ-023's code; SECURITY-REVIEWER reached its Step 2c verdict by
        other means.
    - id: ISS-0019
      severity: MINOR
      disposition: correctly incidental — but adjacent to criterion 1, so checked closely
      note: >
        replay_migrations/2's default argument is evaluated outside its own
