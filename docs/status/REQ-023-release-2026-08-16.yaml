forwarded_issue_set_review:
  scope: >
    ISS-0012 through ISS-0020 (filed this run), plus in-run UPDATE blocks on
    ISS-0011, ISS-0015 and ISS-0017. Reviewed specifically for a blocker on
    REQ-023's own five acceptance criteria that was mis-classified as
    incidental — treated as a real check, since the volume forwarded this run
    is unusually large and mis-classification is exactly the failure mode that
    would let a broken requirement merge.
  conclusion: >
    No mis-classified blocker found. Every one of the nine is either about a
    DIFFERENT requirement's scope (REQ-025/REQ-026), about project tooling and
    docs rather than REQ-023's shipped tables, or about rationale text that no
    acceptance criterion constrains. The one issue that genuinely DID block a
    criterion (ISS-0017's code half) was correctly fixed in-run rather than
    forwarded, and this validator independently confirmed the fix works.
  issues:
    - id: ISS-0012
      severity: MINOR
      disposition: correctly incidental
      note: >
        README's `mix letflow.check` warning still describes ISS-0008 as an
        open blocker. Documentation-only, about a resolved earlier issue.
        Touches no REQ-023 criterion.
    - id: ISS-0013
      severity: MAJOR
      disposition: correctly incidental — checked specifically
      note: >
        event_retention_policies has no owning requirement. Confirmed
        independently that this does NOT affect any of REQ-023's five
        criteria: criterion 1 enumerates exactly six tables (events,
        instance_sequence, event_payload_store, events_archive, the
        idempotency sidecar, instance_projections) and
        event_retention_policies is not among them; criteria 2-5 name only
        events, the sidecar and instance_projections. All six required tables
        were verified present in the live catalog. The consuming function is
        REQ-026's archive/1, which this requirement does not build — there is
        no code in lib/letflow/event_store/ that reads the missing table, so
        nothing REQ-023 ships can fail on its absence. Adding it here would
        have been scope creep against REQ-023's own explicit criteria. Its
        real deadline is REQ-026, and it is filed with a suggested WF-01
        resolution.
    - id: ISS-0014
      severity: MAJOR
      disposition: correctly incidental
      note: >
        REQ-026 ports Store.archive(), which R-Co retired under PAR-03.
        Entirely about REQ-026's scope. REQ-023's criterion 1 requires only
        that events_archive exist as a migration applying cleanly under
        :prefix — verified — and explicitly nothing in REQ-023 writes to it.
        A shipped-but-unwritten destination table is the documented intent,
        not a defect.
    - id: ISS-0015
      severity: MAJOR
      disposition: correctly incidental — environmental
      note: >
        Bandit's port 4000 is not partitioned by MIX_TEST_PARTITION, so two
        concurrent `mix test` runs on one host can collide with :eaddrinuse.
        Real, and a genuine multi-worktree hazard, but it is a test-harness /
        supervision-tree concern touching none of REQ-023's five criteria. No
        :eaddrinuse abort occurred in any of this validator's 17 runs.
    - id: ISS-0016
      severity: MINOR
      disposition: correctly incidental — re-derived independently
      note: >
        .formatter.exs excludes priv/repo/migrations/** and lacks
        import_deps: [:ecto_sql]. This validator confirmed both halves
        directly and went one step further (see other_gates_rerun_by_this_
        validator): under a scratch config with import_deps: [:ecto_sql] all
        six REQ-023 migrations format clean, exit 0. So no REQ-023 criterion
