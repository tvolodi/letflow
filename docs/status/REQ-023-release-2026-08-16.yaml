acceptance_criteria:
  - n: 1
    text: >
      priv/repo/migrations gains migrations for events, instance_sequence,
      event_payload_store, events_archive, the idempotency sidecar table, and
      instance_projections, all using Ecto's :prefix option and applying
      cleanly against at least one provisioned tenant schema via REQ-022's
      migration-replay mechanism
    independent_verdict: PASS
    method: >
      Not verified by reading migration source alone. A real tenant row was
      inserted and a real tenant schema provisioned via
      Letflow.TenantProvisioning.provision_tenant_schema/1, then
      replay_migrations/1 (REQ-022's own mechanism, the one the criterion
      names) was invoked, and the resulting Postgres catalog was inspected
      from a SEPARATE psql process (docker exec letflow-postgres-1 psql -U
      letflow -d letflow_test2) so the evidence does not depend on the same
      BEAM process that wrote it.
    evidence:
      - "All six files exist: priv/repo/migrations/20260816120001_create_events.exs, ..120002_create_instance_sequence.exs, ..120003_create_instance_projections.exs, ..120004_create_event_payload_store.exs, ..120005_create_events_archive.exs, ..120006_create_event_idempotency.exs"
      - "Every one of the six passes `prefix: prefix()` on its create table/1 call and on every create index/unique_index call — read directly from each file"
      - "All six are registered in Letflow.TenantProvisioning's @tenant_scoped_migration_manifest (versions 20260816120001..120006); registration is the mandatory second half of the guard pattern, and an unregistered guarded migration would be inert"
      - "Provisioned schema tenant_f10f992c6da64fdea7e395e99429193c; replay_migrations/1 returned {:ok, [20260816120001, 20260816120002, 20260816120003, 20260816120004, 20260816120005, 20260816120006]} — all six applied, none skipped, no exception"
      - "information_schema.tables for that schema lists exactly: event_idempotency, event_payload_store, events, events_archive, instance_projections, instance_sequence, schema_migrations — all six required tables present inside the tenant schema"
      - "Negative control: information_schema.tables for 'public' after the replay lists only approvals, groups, schema_migrations, tenant_role, tenant_schemas, tenants, transition_events, users — NO event-store table leaked into public, confirming the `if prefix() do` guard behaves as documented"
      - "Created schema and its registration/tenant rows were dropped afterwards (DROP SCHEMA ... CASCADE + DELETE from tenant_schemas and tenants); post-cleanup `\\dn` shows only `public` and both leftover counts are 0 — the shared DB was returned to its baseline"

  - n: 2
    text: >
      events' migration defines the primary key as (event_id, created_at),
      not a bare event_id, per 0003 Decision C point 2(a)
    independent_verdict: PASS
    method: >
      Verified against the live Postgres catalog, not against the migration
      file's `primary_key: true` annotations.
    evidence:
      - "information_schema.table_constraints JOIN key_column_usage for the provisioned schema returns constraint events_pkey with ordinal_position 1 = event_id and ordinal_position 2 = created_at — a genuine two-column composite PK"
      - "pg_indexes confirms: CREATE UNIQUE INDEX events_pkey ON <tenant_schema>.events USING btree (event_id, created_at)"
      - "events_archive independently carries the same composite shape (events_archive_pkey: event_id pos 1, created_at pos 2), consistent with the migration header's stated intent that the archive mirror events' PK shape"
      - "Letflow.EventStore.Event's schema block declares @primary_key false with both event_id and created_at marked primary_key: true, so the Ecto schema module agrees with the database"

  - n: 3
    text: >
      the events Ecto.Schema module has no update_changeset/2 or any function
      that issues an UPDATE against a committed row; the moduledoc states this
      is a deliberate immutability invariant per 0003 Decision C point 1
    independent_verdict: PASS
    method: >
      Verified by BEAM module reflection (the module's actual export table),
      not by grepping for the absence of a string and not by trusting the
      moduledoc's own assertion about itself.
    evidence:
      - "Letflow.EventStore.Event.__info__(:functions), with Ecto-generated __-prefixed entries filtered out, is exactly [insert_changeset: 2] — one function, insert-only"
      - "function_exported?(Letflow.EventStore.Event, :update_changeset, 2) => false; function_exported?(Letflow.EventStore.Event, :changeset, 2) => false"
      - "grep over lib/letflow/event_store/ for Repo.|update_changeset|update_all|force_change|update( finds no executable UPDATE path in event.ex — its only two hits are inside doc text (moduledoc line 10 and the @doc's mention of Repo.insert/2). The module makes no Repo call at all."
      - "Moduledoc requirement met verbatim: event.ex's '## Immutability (REQ-023 acceptance criterion 3)' section states it 'deliberately exposes no update_changeset/2, no generic changeset/2, and no other function that can issue an UPDATE against a committed events row — this is a deliberate immutability invariant, per docs/migration/decisions/0003-ecto-schema-strategy.md Decision C point 1', and explains that the invariant is enforced at the schema-module layer because the migration cannot enforce it"
    note: >
      Letflow.EventStore.InstanceProjection DOES export update_changeset/2.
      Checked deliberately rather than waved past: criterion 3 constrains the
      events schema module only, and instance_projections is by design a
      mutable projection (last_event_seq / status are updated as events are
      appended). Its moduledoc calls out the exception explicitly. Not a
      violation. The other four modules (ArchivedEvent, IdempotencyRecord,
      InstanceSequence, StoredPayload) each export insert_changeset/2 only.

  - n: 4
    text: >
      the idempotency sidecar table has a unique index on idempotency_key and
      its own moduledoc states it supersedes event_store.md's Open Question #1
      two-phase-check recommendation per 0003's resolution
    independent_verdict: PASS
    method: >
      Index half verified from pg_indexes against the real provisioned schema;
      moduledoc half read directly from the shipped module.
    evidence:
      - "pg_indexes: CREATE UNIQUE INDEX uq_event_idempotency_key ON <tenant_schema>.event_idempotency USING btree (idempotency_key) — genuinely UNIQUE and genuinely single-column on idempotency_key"
      - "Single-enforcement-point claim independently confirmed: no index on events or events_archive in the catalog covers idempotency_key (events has events_pkey, idx_events_global_seq, idx_events_instance_time, idx_events_type, uq_event_sequence; events_archive has events_archive_pkey, idx_archive_instance, idx_archive_time, idx_archive_type)"
      - "Letflow.EventStore.IdempotencyRecord's moduledoc section '## What this table is, and what it supersedes (REQ-023 acceptance criterion 4)' states it 'supersedes R-Co's src/design/event_store.md \"Open Question #1\" recommendation of a two-phase deduplication check (INSERT into events with ON CONFLICT (idempotency_key) DO NOTHING, then a fallback SELECT against events_archive)' and cites 0003 Decision C point 2(b) for the resolution"
      - "Sidecar naming choice (event_idempotency, not R-Co's plat_event_idempotency) is cited as the criterion's parent requirement permits, in both the migration header and the moduledoc"
      - "IdempotencyRecord.insert_changeset/2 carries unique_constraint(:idempotency_key, name: :uq_event_idempotency_key), so the DB index and the changeset agree on the constraint name"

  - n: 5
    text: >
      instance_projections' moduledoc explicitly states its schema is
      event-store scope (this requirement) while its meaningful population is
      EE-01/S3 scope, not built here
    independent_verdict: PASS
    evidence:
      - "Letflow.EventStore.InstanceProjection's moduledoc has a '## Scope (REQ-023 acceptance criterion 5)' section stating: \"This table's *schema* is event-store scope — this requirement (REQ-023) owns it\" and \"Its *meaningful population at instance start* is EE-01 / S3 territory (src/engine/, not built yet). Do not read this migration as instance-engine work landing early.\""
      - "It further enumerates the engine-owned columns deliberately not created here (definition_id, correlation_key, current_nodes, variables, error_detail, completed_at, cancelled_at, and the uq_instance_correlation / idx_proj_definition indexes), which is consistent with the shipped migration: the live catalog shows instance_projections carrying only instance_id, tenant_id, status, last_event_seq, started_at, updated_at, with a single idx_proj_status partial index"
      - "The same scope statement is duplicated in the migration file header (20260816120003_create_instance_projections.exs), so a reader arriving from either direction meets it"

