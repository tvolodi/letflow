live_catalog_method: >
  A real tenants row was inserted, a real tenant schema provisioned via
  Letflow.TenantProvisioning.provision_tenant_schema/1, and
  replay_migrations/1 (REQ-022's own mechanism, the one criterion 1 names)
  invoked. Every structural claim below was then read out of pg_indexes,
  pg_constraint and information_schema for that live schema, and the two
  silent-correctness properties were additionally exercised BEHAVIOURALLY with
  real INSERT/UPDATE/DELETE statements. Provisioned schema:
  tenant_781572b14d9c4d58a740461bcce33f2b. It was dropped afterwards along
  with its tenant_schemas registration and its tenants row — see
  database_hygiene.

acceptance_criteria:
  - n: 1
    text: >
      priv/repo/migrations gains process_definitions and
      instance_definition_snapshots migrations, both schema-per-tenant via
      REQ-022's :prefix mechanism, applying cleanly
    independent_verdict: PASS
    method: >
      Not verified by reading migration source. Verified by running REQ-022's
      replay against a real tenant schema and reading the resulting catalog,
      plus an independent MUTATION of the :prefix guard to prove the guard
      property is genuinely detected somewhere (see the ISS-0029 entry under
      forwarded_issue_set_review).
    evidence:
      - "Both files exist: priv/repo/migrations/20260816193001_create_process_definitions.exs and priv/repo/migrations/20260816193002_create_instance_definition_snapshots.exs, sorting in FK-safe order (…193001 before …193002)"
      - "Both are registered in Letflow.TenantProvisioning's @tenant_scoped_migration_manifest (versions 20260816193001, 20260816193002) — registration is the mandatory second half of the guard pattern; a guarded-but-unregistered migration is inert forever"
      - "replay_migrations/1 returned {:ok, [20260816120001, 20260816120002, 20260816120003, 20260816120004, 20260816120005, 20260816120006, 20260816163103, 20260816193001, 20260816193002]} — nine versions, including REQ-027's two, no exception, nothing skipped"
      - "information_schema.tables for the tenant schema lists exactly: event_idempotency, event_payload_store, event_type_registry, events, events_archive, instance_definition_snapshots, instance_projections, instance_sequence, process_definitions, schema_migrations — both REQ-027 tables present INSIDE the tenant schema"
      - "<tenant_schema>.schema_migrations records all nine versions, so the replay was genuinely applied and recorded per-tenant rather than against public"
      - "NEGATIVE CONTROL: SELECT from information_schema.tables WHERE table_schema='public' AND table_name IN ('process_definitions','instance_definition_snapshots') returned [] — neither table leaked into public"
      - "MUTATION (run by this validator, reverted immediately): changing `if prefix() do` to `if true do` in 20260816193001 makes test/letflow/event_store/migrations_test.exs:493 FAIL with 'a registered tenant-scoped migration created something in public when run with no :prefix', listing CreateProcessDefinitions among the candidates — 12/13 passed. So the schema-per-tenant property has real detection. Reverted via git checkout; git status confirms the tree unmodified and no stray public table was left behind."
    note: >
      The negative control above is, on its own, the vacuous assertion
      ISS-0029 correctly identifies: under replay_migrations/2 Ecto injects
      the run's prefix regardless of what the migration author wrote, so
      "not in public after a prefixed replay" cannot fail. It is recorded here
      as a consistency check only. The load-bearing evidence for this
      criterion is the mutation result, which exercises the no-prefix path.

  - n: 2
    text: >
      process_definitions has a unique index on (name, version) and a partial
      unique index on name WHERE status = 'active'
    independent_verdict: PASS
    method: Read out of pg_indexes for the live tenant schema, then exercised behaviourally.
    evidence:
      - "pg_indexes: CREATE UNIQUE INDEX uq_definition_version ON <tenant_schema>.process_definitions USING btree (name, version) — genuinely UNIQUE, genuinely the two-column (name, version) pair"
      - "pg_indexes: CREATE UNIQUE INDEX uq_active_definition ON <tenant_schema>.process_definitions USING btree (name) WHERE ((status)::text = 'active'::text) — genuinely UNIQUE, single-column on name, genuinely PARTIAL on the active predicate"
      - "Letflow.Definitions.ProcessDefinition's changesets declare unique_constraint([:name, :version], name: :uq_definition_version) and unique_constraint(:name, name: :uq_active_definition), so the schema module and the database agree on both index names"
      - "Also present, beyond the criterion but R-Co-sourced (004:39) and declared in the migration header: idx_def_status on (status). Plus process_definitions_pkey on (id). No unexpected index."
    silent_correctness_check:
      property: >
        The stored `status` enum value must be lowercase, or
        uq_active_definition's predicate matches zero rows and PD-03's
        single-active-per-name invariant is silently unenforced — the index
        would exist, be reported by every structural check, and enforce
        nothing. This is the criterion's real risk, and it cannot be settled
        by looking at the index alone.
      verdict: PASS — verified behaviourally, not by inspection
      evidence:
        - "Two rows inserted into the live tenant schema with the same name ('shared-name') and different versions ('1.0.0', '2.0.0'), letting the column default supply status. SELECT returned status = \"draft\" for both — lowercase, matching the predicate's case"
        - "UPDATE …SET status = 'active' on the first row: ACCEPTED"
        - "UPDATE …SET status = 'active' on the second row: REJECTED — {:rejected, :unique_violation, \"uq_active_definition\", \"duplicate key value violates unique constraint \\\"uq_active_definition\\\"\"}. The index is live and enforcing PD-03, by constraint name."
        - "SELECT count(*) … WHERE status = 'active' returned 1 — the predicate matches a real row, so the partial index is populated rather than inert"
        - "Postgres normalized the predicate to WHERE ((status)::text = 'active'::text), exactly as the migration header anticipates. Dump value and predicate literal agree."

  - n: 3
    text: >
      process_definitions has a nullable stage column and a partial index on
      stage WHERE stage IS NOT NULL, per definition.md's PD-07 section
      (migrations/014_definition_stage.sql)
    independent_verdict: PASS
    method: information_schema.columns and pg_indexes for the live tenant schema.
    evidence:
      - "information_schema.columns: stage | character varying | is_nullable = YES | column_default = NULL — nullable, with no default, so an omitted stage genuinely lands as NULL (which idx_def_stage's predicate depends on)"
      - "pg_indexes: CREATE INDEX idx_def_stage ON <tenant_schema>.process_definitions USING btree (stage) WHERE (stage IS NOT NULL) — a partial, NON-unique index, which is the correct shape (PD-07's stage labels are open-ended and shared)"
      - "Confirmed by insertion: both definitions inserted without a stage value read back stage = nil, so the NULL path is real and not defeated by a default"
      - "No CHECK constraint and no enum on stage — pg_constraint for the table carries only the pkey; consistent with PD-07's 'no enum validation, stage labels are open-ended text'. Letflow.Definitions.ProcessDefinition bounds it only with validate_length(:stage, max: 255)."

  - n: 4
    text: >
      instance_definition_snapshots.definition_id references
      process_definitions.id with no ON DELETE CASCADE, and the moduledoc
      states this is deliberate per PD-08
    independent_verdict: PASS
    method: >
      pg_constraint's confdeltype read directly — the one field that
      distinguishes NO ACTION from CASCADE and cannot be faked by a
      well-worded comment — then exercised behaviourally, then the moduledoc
      half checked against the COMPILED docs chunk rather than the source
      file.
    silent_correctness_check:
      property: "pg_constraint.confdeltype must be 'a' (NO ACTION), not 'c' (CASCADE)"
      verdict: PASS
    evidence:
      - "pg_constraint row: conname = instance_definition_snapshots_definition_id_fkey, contype = 'f', confdeltype = 'a', confupdtype = 'a' — 'a' is NO ACTION. Not 'c' (CASCADE), not 'n' (SET NULL), not 'd' (SET DEFAULT)"
      - "pg_get_constraintdef: FOREIGN KEY (definition_id) REFERENCES <tenant_schema>.process_definitions(id) — no ON DELETE clause emitted at all, and the reference resolves INSIDE the tenant schema (ref_schema = the tenant schema, ref_table = process_definitions), confirming the %Reference{} prefix fallback works as the migration header claims"
      - "The only two constraints on the table are that FK and instance_definition_snapshots_pkey (PRIMARY KEY (instance_id)) — no second, cascading FK hiding elsewhere"
      - "BEHAVIOURAL: a snapshot row was inserted referencing an existing definition, then DELETE of that definition was attempted. Result: {:rejected, :foreign_key_violation, \"instance_definition_snapshots_definition_id_fkey\", \"update or delete on table \\\"process_definitions\\\" violates foreign key constraint …\"}. Snapshot count after the rejected delete: 1. Parent definition count: 1. Nothing cascaded; nothing was lost."
      - "Moduledoc half, verified through Code.fetch_docs/1 (the compiled BEAM docs chunk, not the .ex source — so this is the doc that actually shipped): Letflow.Definitions.InstanceDefinitionSnapshot's @moduledoc is present (4512 bytes) and carries the section '## No `ON DELETE CASCADE` on `definition_id` (REQ-027 acceptance criterion 4)', stating 'This is deliberate, per PD-08's \"FK without `ON DELETE CASCADE`\" paragraph' and quoting PD-08's guarantee that snapshot rows persist regardless of what happens to the source definition"
      - "The same moduledoc records that R-Co's own later 1106_iss0125 migration replaced this FK with a CASCADE variant for a test-harness reason, and that Letflow deliberately does not port it — a warning a future agent cross-checking against R-Co's live schema needs, since 'fixing' it would cause exactly the data loss this table exists to prevent"
    note: >
      Behavioural consequence worth restating because it shapes REQ-033:
      under NO ACTION no delete of a referenced definition succeeds at all,
      DRAFT or otherwise. The snapshot survives a fortiori. The moduledoc
      already states this and ISS-0024 tracks the REQ-033 criterion that is
      worded as though a permitted-delete case exists.

  - n: 5
    text: >
      both Ecto.Schema modules' @moduledoc cite R-Co src/design/definition.md
      (PD-01/PD-07/PD-08 sections) as the ported source
    independent_verdict: PASS
    method: >
      Code.fetch_docs/1 against the compiled modules — proving the text is a
      real @moduledoc attribute that survived compilation into the docs
      chunk, not a stripped comment — with token containment checked
      programmatically rather than by eye.
    evidence:
      - "Letflow.Definitions.ProcessDefinition: @moduledoc present in the compiled docs chunk, 4329 bytes. Contains 'src/design/definition.md': true; 'PD-01': true; 'PD-07': true; 'PD-08': true"
      - "Letflow.Definitions.InstanceDefinitionSnapshot: @moduledoc present, 4512 bytes. Contains 'src/design/definition.md': true; 'PD-01': true; 'PD-07': true; 'PD-08': true"
      - "The citations are substantive, not keyword-stuffed: ProcessDefinition's '## Ported source (REQ-027 acceptance criterion 5)' section names which PD-01 sub-sections were ported (module purpose, Store.create, the Definition↔process_definitions mapping, the uq_definition_version/uq_active_definition constraints table) and attributes stage + idx_def_stage to PD-07 with its SQL source (migrations/014_definition_stage.sql). InstanceDefinitionSnapshot's names PD-08's SnapshotStore, the Snapshot struct's column mapping and the Atomicity guarantee section, with DDL from migrations/004_definitions.sql. Each module also points at the other, so a reader arriving at either finds the whole PD-01/PD-07/PD-08 set."
      - "requirements.yaml's separate 'note explicitly in both moduledocs' scope instruction is also satisfied: both carry a '## Scope — this requirement builds schema only' section naming REQ-028/029 (graph validation), REQ-030 (CRUD) and REQ-033 (snapshot functions) as the separate requirements building on these tables"
    note: >
      Public export surface, read from each module's __info__(:functions)
      rather than from the moduledoc's claim about itself:
      ProcessDefinition exports [create_changeset: 2, update_changeset: 2];
      InstanceDefinitionSnapshot exports [create_changeset: 2] only — no
      update_changeset/2, no generic changeset/2, no delete path, which is
      what its write-once moduledoc section asserts. No acceptance criterion
      requires this, but it was checked because the moduledoc makes the claim.

