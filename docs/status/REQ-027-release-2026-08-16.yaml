forwarded_issue_set_review:
  scope: >
    ISS-0024 through ISS-0029 (filed this run), plus in-run UPDATE blocks on
    ISS-0011, ISS-0018 and ISS-0025. Reviewed specifically for an issue that
    actually blocks one of REQ-027's OWN five acceptance criteria but was
    classified as incidental — treated as a real check rather than a
    formality, since mis-classification is the failure mode that would let a
    broken requirement merge under a humanless pipeline.
  conclusion: >
    No mis-classified blocker found. Each of the six is either about a
    DIFFERENT requirement's scope (REQ-033, REQ-030/REQ-025), about agent
    tooling and role files rather than REQ-027's shipped tables, or about a
    test/spec claim whose underlying property this validator independently
    confirmed is covered elsewhere. The two flagged for specific attention
    (ISS-0025 and ISS-0029) were each re-derived from primary evidence rather
    than from the earlier gates' verdicts, and both hold up.
  issues:
    - id: ISS-0024
      severity: MAJOR
      disposition: correctly incidental — about REQ-033's criterion, not REQ-027's
      note: >
        REQ-033's AC 4 presumes a class of process_definitions row whose
        deletion the FK permits while a snapshot references it ("where FK
        rules permit, e.g. a DRAFT definition"). No such class exists.
        Independently confirmed here behaviourally, not argued: the DELETE of
        a referenced definition was rejected with 23503
        foreign_key_violation, and the definition's status was `active`, i.e.
        the constraint plainly does not consult the status column. So the
        issue's diagnosis is right. It touches none of REQ-027's five
        criteria — criterion 4 is worded correctly ("references … with no ON
        DELETE CASCADE, and the moduledoc states this is deliberate") and was
        fully satisfied above. Should be resolved before REQ-033 is claimed;
        the risk the issue names (an implementer "fixing" the schema by
        adding CASCADE) would invert PD-08 and destroy snapshot data.
    - id: ISS-0025
      severity: MAJOR
      disposition: correctly incidental for REQ-027 — genuinely blocking for REQ-030/REQ-025
      independent_view: >
        Agreed with both prior gates, on independently re-derived grounds
        rather than by deferring to them. Four points:

        (1) No acceptance criterion is touched. REQ-027's five criteria
        concern the two migrations applying under :prefix, three index
        shapes, the FK's referential action plus a moduledoc statement, and
        two moduledoc citations. None mentions tenant_id, and all five were
        verified PASS above with the column in place.

        (2) The column does not impede anything REQ-027 ships. The migration
        applied cleanly, and rows were inserted, updated and constraint-tested
        against the live table in this validation by supplying tenant_id
        explicitly — the column is usable, it simply has no designated
        supplier yet.

        (3) The precedent claim was checked, not accepted. events,
        events_archive and instance_projections each carry
        `add :tenant_id, :binary_id, null: false` with no DB default —
        read directly from priv/repo/migrations/20260816120001, …120003 and
        …120005. So REQ-023 shipped this exact pattern, it merged, and
        treating REQ-027 as a blocker would apply a standard REQ-023 was not
        held to. Consistency argues for forwarding, and the issue's own text
        correctly notes the resolution must serve REQ-025 and REQ-030 both.

        (4) The failure mode is loud, not silent — which is the dispositive
        point for a release gate. An insert omitting tenant_id raises
        not_null_violation (23502) immediately; it cannot produce a
        mis-attributed row. That is strictly safer than R-Co's session-GUC
        DEFAULT, which silently stamps whatever tenant the connection last
        carried. Nothing can ship broken-but-quiet on this path.

        Where this validator would go slightly further than the record: the
        SECURITY-REVIEWER UPDATE's attribution-integrity argument for option
        (c) is the strongest reasoning in the issue, and it is currently
        buried in an UPDATE block below three options presented as equals. If
        this is picked up by a weak model reading top-down, it may not reach
        it. That is a presentation concern about the issue record, not a
        defect in REQ-027, and it is not re-filed.
    - id: ISS-0026
      severity: MAJOR
      disposition: correctly incidental — agent role-file staleness, not shipped code
      note: >
        .claude/agents/security-reviewer.md still calls INV-1 "almost always
        NOT-APPLICABLE" while the authoritative security-invariants.md makes
        it checkable once 0003 lands and S2 migrations exist — both true since
        before REQ-023. Real, and correctly rated MAJOR under the
        weak-model-tolerance constraint. But it constrains no REQ-027
        acceptance criterion, and it did not cause a miss here: Step 2c
        determined INV-1 APPLIES and passed on that basis. Tenant isolation
        for REQ-027's own tables was independently re-confirmed by this
        validator anyway — both tables live inside the tenant schema, neither
        appears in public, and the FK resolves within the tenant schema.
    - id: ISS-0027
      severity: MINOR
      disposition: correctly incidental — defence-in-depth on REQ-022's module
      note: >
        Registration.changeset/2 has no validate_format on schema_name, so
        the DDL-identifier guarantee is positional (call-graph-shaped) rather
        than intrinsic. Not exploitable today and REQ-027 adds no new call
        site into schema_name_for_tenant/1. Independently corroborated in
        passing: the schema this validator provisioned was named
        tenant_781572b14d9c4d58a740461bcce33f2b, matching
        ^tenant_[0-9a-f]{32}$ exactly. Belongs to REQ-022's module and
        constrains no REQ-027 criterion; adding a validation to another
        requirement's module mid-run would be the quiet scope expansion the
        gates exist to catch.
    - id: ISS-0028
      severity: MINOR
      disposition: correctly incidental — and incidentally CONFIRMED accurate this run
      note: >
        The §4 guard test's stray-table cleanup is hand-maintained and omits
        REQ-024's event_type_registry. Confirmed accurate as a side effect of
        this validator's criterion-1 mutation: that mutation deliberately
        broke CreateProcessDefinitions' guard, the guard test failed as
        designed, and afterwards no stray public.process_definitions remained
        — because process_definitions IS in @later_tenant_scoped_tables. The
        same run therefore demonstrates both that the cleanup works for
        REQ-027's tables and that the list is the hand-maintained one whose
        gap ISS-0028 describes for REQ-024's table. Concerns REQ-024's table,
        blocks no REQ-027 criterion, correctly forwarded.
    - id: ISS-0029
      severity: MINOR
      disposition: correctly incidental — the property it claims IS covered elsewhere, verified by mutation
      note: >
        The specific check ORCH asked for. ISS-0029 says
        `refute table_exists_in_schema?("public", …)` in
        test/letflow/definitions/migrations_test.exs is vacuous under
        replay_migrations/2, because Ecto injects the run's prefix regardless
        of what the migration wrote — so the assertion cannot fail and the
        :prefix property is not verified there. This validator reproduced the
        vacuity independently (the same negative control run against the live
        catalog returned [], as it must) and then went to the question that
        actually matters: is the property covered ANYWHERE, or is criterion 1
        left genuinely unverified?

        It is covered. test/letflow/event_store/migrations_test.exs:493 (the
        §4 guard test) iterates tenant_scoped_migrations/0 — which this
        validator confirmed contains both REQ-027 modules, since the replay
        returned both their versions — runs each migration with NO :prefix
        under synthetic never-before-applied probe versions (so each change/0
        genuinely executes rather than being skipped as already-applied), and
        asserts the full public table set is unchanged.

