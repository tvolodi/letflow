  - id: REQ-021
    title: Wire identity into the Plug request pipeline (auth.zig/tenant_status.zig equivalent)
    status_in_requirements_yaml: done
    independent_verdict: PASS
    evidence:
      - "lib/letflow/plugs/auth_pipeline.ex's call/2 is one with chain in the exact documented order: extract_bearer_token -> verify_token -> extract_realm -> resolve_tenant -> guard_realm_ownership -> map_claims -> provision_user -> attach_auth_context; a missing/malformed Authorization header fails at the first clause, before any DB or claim-mapping work runs -- confirmed by reading the chain and by test/letflow/plugs/auth_pipeline_test.exs's 'none of the above rejected requests write any user row anywhere' test, re-run and passed"
      - "lib/letflow/plugs/tenant_status.ex's call/2 pattern-matches @write_methods (POST/PUT/PATCH/DELETE) for the write-pause check; a :migrating tenant gets 503 + retry-after: 30 header; GET/HEAD hit the fallback call/2 clause with zero DB query -- confirmed both by reading the code and by test/letflow/plugs/tenant_status_test.exs's telemetry-handler test (asserts no [:letflow, :repo, :query] event fires for a GET), re-run and passed"
      - "a token whose realm does not match the resolved tenant's bound realm is rejected via guard_realm_ownership/2 -> Identity.verify_realm_ownership/2, called before provision_user/3 in the with chain -- confirmed by chain ordering and by test/letflow/plugs/auth_pipeline_test.exs's realm-ownership-guard tests, re-run and passed"
      - "both auth_pipeline.ex and tenant_status.ex moduledocs state this supersedes the never-built REQ-103 plug and name all 3 of Letflow.Router's existing routes (POST /instances, POST /instances/:id/actions, GET /instances/:id) as not currently mounted behind either plug"
    findings: []

