    independent_verdict: PASS
    evidence:
      - "lib/letflow/identity.ex's provision_oidc_user/3 -> upsert_by_external_identity/3 -> insert_or_fetch/3 implements select-first / Repo.insert(on_conflict: :nothing, conflict_target: {:unsafe_fragment, \"(external_realm, external_id) WHERE external_id IS NOT NULL\"}) / re-select-on-conflict -- not Ecto.Multi, not insert-then-rescue"
      - "User.jit_changeset/2 (lib/letflow/identity/user.ex) sets password_hash to the literal \"__OIDC_ONLY__\" and auth_source: :oidc via put_change/3 unconditionally, after cast/3 -- IdentityContext has no such fields, so no caller input can override them"
