    status_in_requirements_yaml: done
    independent_verdict: PASS
    evidence:
      - "resolve_tenant_by_realm/1 and resolve_realm_by_tenant/1 (lib/letflow/identity.ex) confirmed against Letflow.Identity.Tenant via Repo.get_by/2 and Repo.get/2"
      - "one-to-one invariant enforced by a real unique partial index, tenants_idp_realm_id_partial_index (CreateTenants migration), not just changeset-level validation -- confirmed by reading the migration"
      - "idp_realm_id immutability: Tenant.update_changeset/2's cast/3 field list is [:display_name, :status] only -- :idp_realm_id is structurally absent, confirmed by reading the schema file directly; no rotation function exists anywhere in tenant.ex, stated explicitly in its moduledoc"
