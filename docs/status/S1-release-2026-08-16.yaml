      role_registry.zig instead -- but REQ-015's own description explicitly
      names role_registry.zig, not any adp-0x doc, as tenant_role's shape source.
      Not a defect; the requirement's own scoping text overrides the acceptance
      criterion's generic phrasing here. Filed as an observation, not a finding.

