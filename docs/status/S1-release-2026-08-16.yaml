      - "users migration has unique_index(:users, [:external_realm, :external_id], where: \"external_id IS NOT NULL\", name: :users_external_identity_partial_index) -- confirmed partial, not plain unique"
      - "no DB CHECK constraint for auth_source-vs-external-fields consistency in either the migration or the schema; both explicitly state this is an application-level (changeset) invariant"
      - "CreateTenants migration header explicitly states schema-per-tenant provisioning (Ecto :prefix/dynamic-repo) is NOT built in this migration -- all four tables target Ecto's single default schema, deferral stated verbatim"
    findings: []
