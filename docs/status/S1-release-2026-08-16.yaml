      - "upsert_role/2 -> do_upsert_role/2 checks Repo.get(Group, group_id) inside Repo.transaction/1 before writing, Repo.rollback(:group_not_found) on a missing group -- confirmed by reading the transaction body"
      - "a second upsert_role/2 call with the same name and a different group_id hits on_conflict: [set: [group_id: group_id]] keyed on conflict_target: :name -- update, not duplicate-insert, confirmed by reading insert_or_update_role/2"
      - "resolve_role_in_tx/1 wraps its Repo.get_by/2 call in rescue _ -> nil; test/letflow/role_registry_test.exs's CastError-forcing test (passing a non-string name) re-run by this validator: passed, returned nil rather than raising"
      - "@moduledoc states no alias/call to any Letflow.Oidc.* module or to Letflow.Identity's OIDC-pipeline functions -- confirmed true by inspection of role_registry.ex's own alias list (Group, TenantRole, Repo only)"
    findings: []

