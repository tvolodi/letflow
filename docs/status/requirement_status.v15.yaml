      S10 gap 6 designed -- a pattern for exposing a read-only resource to
      an unauthenticated caller, the last unowned bucket-B gap and the one
      deliberate hole in Letflow's auth pipeline. Design-only; produced
      lib/letflow/design/req323-unauthenticated-read-pattern.md and
      decision record 0028. SECURITY-REVIEWER PASS, REVIEWER PASS after one
