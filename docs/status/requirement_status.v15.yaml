      The crux: with no token there is no auth_context, so INV-1's usual
      mechanism (Api.Context.scoped_repo_opts/1) is unavailable. The design
      resolves tenant via a 256-bit CSPRNG capability handle stored as
      SHA-256 in a global registry, whose row's tenant_id then feeds the
      SAME TenantProvisioning.schema_name_for_tenant/1 derivation -- only
      the source of tenant_id differs, the storage mechanism is unchanged.
      Anti-enumeration rests on a named property (drawn-and-stored, never
      derived; no collection or index route exists) rather than an
      assurance. INV-5 is held on both halves including timing: exactly one
      round-trip before any refusal, with a syntactic short-circuit on a
      malformed handle explicitly forbidden because it is precisely the
      signal INV-5 names.
      Two judgement calls worth recording. Mounting TenantStatus was
      REJECTED as worse than useless -- with no auth context it is a silent
      no-op (tenant_status.ex:71-81) that would look like protection; the
      design folds tenants.status into the existing round-trip and returns
      404, never that plug's 403, which would disclose two facts at once.
      And assign_trace_id/1 was rejected because it reflects a
      caller-supplied x-trace-id verbatim with no validation, which is a
      surface a world-reachable endpoint should not have.
