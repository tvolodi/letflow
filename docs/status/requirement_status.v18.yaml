      cleanly -- 21 passed, 0 failures, deterministic, no retries -- ruling
      out a defect in the new test code itself.

      Root-causing the ORIGINAL stall (and three further apparent "hangs"
      during this recovery's own verification attempts) consumed most of
      this session. Findings, in order: (1) `mix letflow.check.test`'s
      16-way test_parallel.sh froze system-wide before any partition
      reached poller_test.exs, with Postgres showing zero blocking queries
      -- host/infra, not this branch. (2) A subsequent plain `mix test` run
      genuinely DID shell out to a real recursive `bash
      scripts/test_parallel.sh` (confirmed via a new /tmp/letflow_test_
      parallel.* directory appearing mid-run with real partition logs) --
      a separate, real, pre-existing defect in
      test/mix/tasks/letflow_check_test_test.exs's Windows fake-bash
      interception, filed as ISS-0697 (queue task 697, GH#1462), not fixed
      here. That run also exhausted Postgres's connection limit, requiring
      a container restart (twice, over the course of this session). (3)
      Manually backgrounding `mix test` via `nohup ... & disown` produced
      a THIRD apparent hang that turned out to be a local-tooling artifact
      -- the log itself showed "Writer crashed (:\"The pipe is being
      closed.\")" once the launching tool call's own process boundary
      ended, explaining why CPU usage kept climbing with no further log
      output across all of this session's nohup-backed attempts. Switching
      to the Bash tool's own `run_in_background` mechanism (the same one
      that worked cleanly for the isolated poller_test.exs run) fixed the
      pipe-crash class, but two further full local runs each stopped
      cleanly (no crash trace, no attributable failure, exit code 127)
      around ~94k lines of output at a consistent point, days apart from
      each other only in output volume, not wall-clock -- consistent with
      a background-process output-volume limitation of this session's own
      tooling given this repo's verbose :debug-level SQL logging, not a
      defect in the branch (every partial run's visible content showed
      zero failures throughout).

