        # Signing in

        When you open Letflow, you're taken to a secure sign-in page to enter
        your username and password. This page is provided by Letflow's
        identity provider, not by Letflow itself — you may notice the page
        looks a little different from the rest of the app.

        After you sign in successfully, you're brought straight back into
        Letflow automatically. There's nothing else you need to do — no
        separate "continue" step, no extra click.

        ## Where you land after signing in

        Once you're signed in, you'll see your workspace dashboard, showing
        your processes and instances.

        - If you're a **regular user or tenant administrator**, this
          dashboard is scoped to your own organization.
        - If you're a **platform administrator**, you land on the same kind
          of starting page, but you'll also see extra menu items — like
          **Tenants** — that only platform administrators can see and use.

        ## If something goes wrong

        If your sign-in doesn't succeed, or your session has expired, you're
        sent back to the sign-in page automatically so you can try again. You
        never need to manually type in a web address or hunt for a login
        link — Letflow always routes you to the right place on its own.

