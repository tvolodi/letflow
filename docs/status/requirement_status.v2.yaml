      inferred: at max_wait_ms 200 a waiter overshot by 263-320 ms against a
      control of 4-11 ms, and in every defect run the waiter's reply latency
      equalled the concurrent provisioning's latency to the millisecond. Stated
      honestly, one provisioning here is 411-1460 ms, so at max_wait_ms 1000 there
      is no violation at all on a quiet host -- the defect is not that the
      overshoot is always large, it is that it is bounded by nothing the contract
      names. Fix moves all pool-side Repo work -- provisioning AND drop_schema/1 --
      into one serialized Task.Supervisor.async_nolink worker behind a db_queue
      FIFO with at most one op in flight, leaving no Repo call in any pool
      callback; slots are reserved and owners monitored before any DB work starts,
      closing the window in which a claim-in-progress had no monitor. Serializing
      BOTH op kinds rather than only provisioning is load-bearing and came from the
      design gate: moving provisioning alone makes the pool a third concurrent DB
      actor (peak demand 3 vs the synchronous module's 2) and fails at pool_size 2,
