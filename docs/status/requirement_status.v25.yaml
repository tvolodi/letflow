      orphan erl.exe/beam.smp processes). PR #2061, branch
      fix/ISS-0917-test-parallel-template-contention, commit TBD-at-merge.
      Root cause: N simultaneous partitions all launching full migration
      replays (ensure_template!) with no stagger, causing a Postgres
      server-side CPU/IO burst that exceeded Ecto's 15s connection-checkout
      timeout at high N, leaving partitions stuck/aborted and orphaned
      processes behind, while the aggregator's own reporting logic could not
      distinguish "partition failed" from "partition never reported" and
      printed a misleadingly-clean summary. Fix: (1) capped-concurrency
      admission-control stagger limiting concurrent in-flight template
      builds to 4 regardless of N (reusing the existing Step 1.7 idiom); (2)
      a reporting_count == N structural invariant that hard-fails loudly
      when fewer than N partitions report; (3) process-group-scoped
      partition launch with a watchdog timeout and extended EXIT trap so
      timed-out/killed partitions' full process tree gets reaped, eliminating
      orphans. Full gate chain: CODE-DESIGN-VALIDATOR, ELIXIR-DEV
      implementation, REVIEWER PASS (built a standalone process-tree harness
      to independently verify kill/reap logic), TEST-RUNNER PASS (N=8 clean
      5079/5079; N=16 all 16 partitions reported, admission cap correctly
      logging 4-concurrent, no orphans), and RELEASE-VALIDATOR PASS via
      independent diff read, a real fake-mix harness proving the
      reporting-count hard-fail works, a clean mutation-kill test proving the
      admission-control stagger is load-bearing (peak concurrent builds 4
      unmodified vs 12 with the gate removed), and a REAL natural
      reproduction -- a genuine too_many_connections exhaustion killed a
      partition mid-run and the reporting-count invariant correctly caught it
