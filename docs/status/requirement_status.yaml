      and both independently re-verified by REVIEWER against actual Ecto
      source rather than taken on ELIXIR-DEV's word: (1) conflict_target:
      syntax — the design's anticipated forms (a named-constraint reference,
      and a plain column-list [:external_realm, :external_id]) both failed
      against the installed Ecto 3.14/ecto_sql 3.14 and Postgres's partial-
      index semantics, since the unique index is partial (WHERE external_id IS
      NOT NULL) and Postgres's ON CONFLICT target-inference requires the
      literal partial-index predicate to be restated at the call site, which
      neither anticipated form expresses — {:unsafe_fragment, ...} restating
      the exact index expression was the only form that matched the actual
      index definition; REVIEWER independently confirmed this against
      ecto_sql's on_conflict handling in source, not just ELIXIR-DEV's test
      run. (2) insert-vs-conflict-suppressed disambiguation — the design
      anticipated reading the returned struct's id: nil as the "conflict
      suppressed the insert" signal, but that signal never fires: users.id is
      a client-generated binary_id primary key (Ecto.UUID autogenerate), so
      Ecto populates id on the struct before the INSERT is even sent,
      regardless of whether the row actually landed. Replaced with a
