      has already forced the real compile as a side effect of
      finding itself — the inner subprocess again finds nothing to
      do. Confirmed numerically: raw `mix compile` after `rm -rf
      _build/test/lib/roco` took 8561ms measured directly, but the
      exact same scenario run through `mix roco.timed_test` produced
      compile_ms=1501 (below the no-op noise floor of ~1.6-1.9s) —
      because the outer process already ate the real compile cost.
      This is structural: no code living inside lib/mix/tasks/ of
      this project can ever time this project's own compile step,
      regardless of subprocess/in-process design. Correct fix (user
      confirmed): move the actual timing logic to a wrapper script
      outside lib/ (e.g. scripts/timed_test.sh or .ps1) that runs
      `mix compile` as its FIRST mix invocation — genuinely the first
      compile in a fresh BEAM/build state — then `mix test`, then
      appends the CSV row; keep `mix roco.timed_test` as a thin
      pass-through to the script for ergonomics. Sending back to
