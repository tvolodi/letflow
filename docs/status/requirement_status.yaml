      (parallel_approval.ex:39-45); :transient restarts on ABNORMAL
      termination only, and Process.exit(pid, :kill) delivers :kill,
      reported to monitors as :killed (asserted directly via
      Process.monitor/1 + assert_receive in the test) — abnormal, so
      the DynamicSupervisor restarts the child from its stored spec,
      which bakes in the same id, so the same Registry key comes back
      under a brand-new pid. Test asserts new_pid != victim_pid and
      that the restarted instance is back at :pending with
      approved_by: [] (fresh init/1, not a resume — gen_statem data was
      never persisted, so approved-state progress is lost across the
