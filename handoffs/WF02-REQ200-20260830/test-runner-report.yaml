diagnosis: >
  Both failures are the documented rustc-absent CheckToolchainTest baseline flake
  class (named explicitly in this run's dispatch instructions and consistent with
  docs/anti-patterns.md's toolchain-drift guidance). running_rust_raw/0
  (test/mix/tasks/letflow_check_toolchain_test.exs:68-73) shells out to
  `System.cmd("rustc", ["--version"], ...)`; when rustc is not on PATH this raises
  :enoent before the test's own rescue path (exercised deliberately only in the
  separate "F9 rustc not found on PATH" test, line ~320) is reached. Confirmed
  `which rustc` returns nothing in this sandbox -- rustc genuinely is not
  installed/on PATH here, not a code defect. Cross-checked against
  `git diff main...HEAD --stat`: this branch touches only
  lib/letflow/instances.ex, lib/letflow/routers/instances.ex,
  test/letflow/routers/instances_test.exs, docs/status/*, and files under
  lib/letflow/design/ and handoffs/ -- nothing in
  test/mix/tasks/letflow_check_toolchain_test.exs or any Rust-toolchain-adjacent
  code. Per "Failure Attribution Is Structural, Never By Count-Matching"
  (core-directives.md), attribution here is structural: the failing test's own
  logic path (a live `System.cmd("rustc", ...)` call) is independently
  reproducible as an environment fact (`which rustc` -> not found), not inferred
  from the diff not touching that file.
  Excluded from this branch's pass/fail determination as a pre-existing,
  environment-caused failure unrelated to REQ-200.

