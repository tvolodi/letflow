# Letflow — Escalation records
#
# Written when a handoff hits rework_count >= max_rework (see
# docs/agents/ORCHESTRATOR.md §5). ESCALATED does not mean "wait for a
# human" — there is none in this pipeline — it means "the next session
# picks this up fresh, reads this record, and either finds a genuinely
# different approach or narrows the requirement's scope before retrying."
#
# Append one entry per escalation. Never rewrite past entries.
#
# Entry shape:
#   - run_id: <WF-run-id>
#     requirement_ids: [REQ-XXX]
#     escalated_at: <UTC timestamp from the clock, not memory>
#     escalated_by: AGENT_ID
#     step: <the step that hit max_rework>
#     rework_count: N
#     status: <PARTIAL | FAIL, as last reported>
#     queue_task_id: <letflow-queue task id, if any>
#     queue_agent_id: <agent_id holding the queue lock, if still held>
#     branch: <branch name, pushed or local>
#     diagnosis: >
#       what was tried, why it kept failing the same way, what's known to
#       work, what a fresh session should try differently
#     next_step: >
#       concrete recommendation for the resuming session

