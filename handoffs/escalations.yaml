      ExecutionError event path (DBConnection.ConnectionError /
      "transaction rolling back") -- the same class of bug iteration 2
      fixed for the INSTANCE_STARTED/SUB_PROCESS_COMPLETED event paths
      apparently was not (or could not be, without further diagnosis)
      applied to the ExecutionError event path -- affects the two
      output-side interface-violation tests (AC3/AC8, 2 tests).
      (iii) a pre-existing-within-this-branch bug (present since before
