# Synthetic — R-Co's tests/simulation/scenarios/regulatory-compliance-review-bafin.yaml
# is unreachable from this sandbox (see
# lib/letflow/design/req208-meridian-scenario-execution.md §0.3; tracked by ISS-0393,
# not a new issue); structurally faithful to REQ-208's own requirement-text
# field-by-field account, not a byte-for-byte port.
#
# Process: process_policy_binding.yaml ("Regulatory Compliance Review"), test-local
# simplified graph (@simple_regulatory_review_graph, design §3.2). Steps 1/2 run for
# real against real queried state; step 3 (the timer-advance step) is recorded
# BLOCKED, citing ISS-0389 (POST /api/v1/instances/:id/advance-timer does not exist
# -- the SAME gap REQ-206 already found), not filed as a duplicate. Unlike REQ-206's
# shipment-timeout-escalation scenario, this scenario's own YAML documents no
# SKIP/MINOR fallback for the missing endpoint -- BaFin regulatory-notice filing on
# SLA breach is this scenario's entire point and is unreachable without it. Recorded
# BLOCKED, not SKIP (design §2.1's rationale).
id: meridian-regulatory-compliance-review-bafin
company_id: meridian
process_id: DEFINITION_NAME

actors:
  actor-meridian-claudia: {}

preconditions:
  - check: process_definition_active
    args:
      name: DEFINITION_NAME
      prefix: "TENANT_PREFIX"

steps:
  # Step 1 — compliance officer starts the periodic BaFin-mandated review
  - via: api
    action: "POST /api/v1/instances"
    params:
      definition_name: DEFINITION_NAME
      initial_variables: {}
    produces: instance
    actor: actor-meridian-claudia

  # Step 2a — look up the pending evidence-collection task
  - via: api
    action: "GET /api/v1/tasks?instance_id={{produces.instance.instance_id}}&status=PENDING"
    produces: evidence_task_list
    actor: actor-meridian-claudia

  # Step 2b — compliance officer collects evidence, real transition to
  # risk-evaluation (edge e1)
  - via: api
    action: "POST /api/v1/tasks/{{produces.evidence_task_list.items.0.id}}/complete"
    params:
      output_variables: {}
    produces: evidence_result
    actor: actor-meridian-claudia

  # Step 3 — UAT-RUNNER would advance the timer boundary on the risk-evaluation
  # node (POST /api/v1/instances/{instance_id}/advance-timer) to trigger the BaFin
  # regulatory-notice filing on SLA breach. That endpoint does not exist.
  - via: blocked
    blocked_by: "ISS-0389"
    note: >
      POST /api/v1/instances/:id/advance-timer does not exist -- grep of
      lib/letflow/router.ex and lib/letflow/routers/*.ex, zero matches, per
      lib/letflow/design/req208-meridian-scenario-execution.md §0.4. Unlike
      REQ-206's shipment-timeout-escalation scenario, this scenario's own YAML
      documents no SKIP/MINOR fallback for the missing endpoint -- BaFin
      regulatory-notice filing on SLA breach is this scenario's entire point and
      is unreachable without it. Recorded BLOCKED, not SKIP.

expected_outcomes:
  # EO-001-support: TEST-DESIGNER coverage-verification addition (this session).
  # The :no_task_of_type verification method (design §2.2, EO-002's own negative-
  # assertion primitive) was implemented by ELIXIR-DEV but never actually exercised
  # by either loan-origination scenario -- both were truncated before EO-002 could
  # run, per the join_counters BLOCKER (see test module moduledoc). Exercising it
  # here, on real queried state that is NOT blocked by that defect (this scenario
  # has no PARALLEL_GATEWAY), closes that coverage gap without fabricating a pass
  # on the loan scenarios' own unreachable claim.
  #
  # This first check is a genuine, real absence: findings-sign-off is never
  # reached by this scenario's exercised path (blocked at step 3, before
  # severity-routing) -- verified as :pass.
  - id: EO-NO-TASK-001
    description: "No findings-sign-off task exists at any point on this scenario's exercised path"
    verification:
      method: no_task_of_type
      args:
        prefix: "TENANT_PREFIX"
        instance_ref: "{{produces.instance.instance_id}}"
        node_id: findings-sign-off

  # This second check is the real negative control proving the first isn't
  # vacuous: evidence-collection DOES exist (step 2b completes it, so it is
  # COMPLETED rather than PENDING -- deliberately checked with no status filter,
  # per design §2.2's "absence must hold regardless of status" rule) -- verified
  # as :fail. If :no_task_of_type were buggy (e.g. always returning :pass, or
  # only checking PENDING-status tasks), EO-NO-TASK-002 below would wrongly
  # report :pass instead of :fail.
  - id: EO-NO-TASK-002
    description: "evidence-collection DOES exist (COMPLETED) -- negative control proving EO-NO-TASK-001 is not vacuous"
    verification:
      method: no_task_of_type
      args:
        prefix: "TENANT_PREFIX"
        instance_ref: "{{produces.instance.instance_id}}"
        node_id: evidence-collection
