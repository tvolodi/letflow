# Synthetic — R-Co's tests/simulation/scenarios/swiftroute-shipment-ops-timeout-escalation.yaml is
# unreachable from this sandbox (see lib/letflow/design/req206-swiftroute-scenario-execution.md §0);
# structurally faithful to REQ-206's own requirement-text field-by-field account,
# not a byte-for-byte port.
#
# Process: process_shipment_dispatch.yaml ("Driver Incident Report") — the ops-assessment
# HUMAN_TASK with timeout-ops-assessment fallback edge is the escalation shape this scenario
# needs; no new process fixture required (design §3.3).
#
# Step 1: start instance (real api)
# Step 2: advance timer (SKIP/MINOR — advance-timer endpoint absent, grep-confirmed, design §0)
# Step 3: verify instance still ACTIVE (real api — proves harness coherence despite step 2 skip)
id: swiftroute-shipment-ops-timeout-escalation
company_id: swiftroute
process_id: DEFINITION_NAME

actors:
  actor-swiftroute-lena: {}
  actor-swiftroute-marco: {}

preconditions:
  - check: process_definition_active
    args:
      name: DEFINITION_NAME
      prefix: "TENANT_PREFIX"

steps:
  # Step 1 — dispatcher starts incident report (injury_involved: false → parallel-fork path)
  - via: api
    action: "POST /api/v1/instances"
    params:
      definition_name: DEFINITION_NAME
      initial_variables:
        injury_involved: false
    produces: instance
    actor: actor-swiftroute-lena

  # Step 2 — SKIP: advance-timer endpoint absent (grep evidence in design §0 and test)
  - via: skip
    severity: MINOR
    action: "POST /api/v1/instances/{{produces.instance.instance_id}}/advance-timer"
    note: "POST /api/v1/instances/:id/advance-timer does not exist in Letflow.Router -- grep -rn \"advance-timer|advance_timer\" lib/letflow/router.ex lib/letflow/routers/*.ex -> zero matches (lib/letflow/design/req206-swiftroute-scenario-execution.md §0). Scenario's own documented fallback: mark SKIP severity MINOR."

  # Step 3 — verify instance is still ACTIVE (no error, no premature completion)
  - via: api
    action: "GET /api/v1/instances/{{produces.instance.instance_id}}"
    produces: instance_state_check
    actor: actor-swiftroute-marco

expected_outcomes:
  - id: EO-001
    description: "Instance started successfully (step 1 PASS)"
    verification:
      method: instance_state
      args:
        prefix: "TENANT_PREFIX"
        instance_ref: "{{produces.instance.instance_id}}"
        status: "ACTIVE"

  - id: EO-002
    description: "Instance still ACTIVE after SKIP of timer-advance step (step 3 PASS)"
    verification:
      method: instance_state
      args:
        prefix: "TENANT_PREFIX"
        instance_ref: "{{produces.instance.instance_id}}"
        status: "ACTIVE"
