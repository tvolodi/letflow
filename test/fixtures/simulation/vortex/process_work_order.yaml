# Ported from R-Co tests/simulation/companies/vortex/process_supplier_quality_deviation.yaml (ISS-0388).
# Filename kept as process_work_order.yaml to avoid breaking test references.
name: Supplier Quality Deviation
version: "1.0"
description: >
  Raised when incoming goods fail inspection. Quality Manager classifies severity.
  For CRITICAL a sub-process is spawned. Exercises: sub-process spawn,
  severity-driven branching, compensation.
  Escalation follows D-ESC: timer -> higher role -> fail closed (ISS-1002 / Q-984):
  severity-classification -> escalate-severity-classification-to-ceo -> stalled:
  default-to-critical. The stalled level repeats its own role as escalation_role
  (co-required attribute only; no third level).
graph:
  nodes:
    - id: start
      node_type: START
    - id: quarantine-batch
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /mes/batches/{batch_ref}/quarantine
        timeout_ms: 300000
    - id: severity-classification
      node_type: HUMAN_TASK
      attributes:
        role: role-quality-manager
        escalation_timer_duration: PT4H
        escalation_role: role-ceo
    - id: escalate-severity-classification-to-ceo
      node_type: HUMAN_TASK
      attributes:
        role: role-ceo
        description: "top of chain: escalation_role is nominal; stalled = fail closed"
        escalation_timer_duration: PT4H
        escalation_role: role-ceo
    - id: false-positive-check
      node_type: EXCLUSIVE_GATEWAY
    - id: release-quarantine
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /mes/batches/{batch_ref}/release
        timeout_ms: 300000
    - id: severity-routing
      node_type: EXCLUSIVE_GATEWAY
    - id: corrective-action-subprocess
      node_type: SUB_PROCESS
      attributes:
        definition_name: 8D Corrective Action
    - id: default-to-critical
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /response-headers?severity=critical
        timeout_ms: 300000
    - id: supplier-warning
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /webhooks/supplier-warning
        timeout_ms: 300000
    - id: supplier-notification
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /webhooks/supplier-notify
        timeout_ms: 300000
    - id: close-deviation
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /quality/deviations/{deviation_id}/close
        timeout_ms: 300000
    - id: end-closed
      node_type: END
    - id: end-false-positive
      node_type: END
  edges:
    - id: e0
      source: start
      target: quarantine-batch
    - id: e1
      source: quarantine-batch
      target: severity-classification
    - id: e2
      source: severity-classification
      target: false-positive-check
      condition: "true"
    # on_timeout: escalate to the CEO (the node's only unconditioned edge)
    - id: timeout-severity-classification
      source: severity-classification
      target: escalate-severity-classification-to-ceo
    - id: e2-escalated
      source: escalate-severity-classification-to-ceo
      target: false-positive-check
      condition: "true"
    - id: timeout-escalate-severity-classification-to-ceo
      source: escalate-severity-classification-to-ceo
      target: default-to-critical
    - id: e3
      source: false-positive-check
      target: release-quarantine
      condition: "variables.false_positive == true"
    - id: e4
      source: false-positive-check
      target: severity-routing
      condition: "variables.false_positive == false"
    - id: false-positive-check-default
      source: false-positive-check
      target: severity-routing
      is_default: true
    - id: e5
      source: default-to-critical
      target: severity-routing
    - id: e6
      source: severity-routing
      target: corrective-action-subprocess
      condition: "variables.severity == 'critical'"
    - id: e7
      source: severity-routing
      target: supplier-warning
      condition: "variables.severity == 'major'"
    - id: e8
      source: severity-routing
      target: supplier-notification
      condition: "variables.severity == 'minor'"
    - id: severity-routing-default
      source: severity-routing
      target: corrective-action-subprocess
      is_default: true
    - id: e9
      source: corrective-action-subprocess
      target: close-deviation
    - id: e10
      source: supplier-warning
      target: close-deviation
    - id: e11
      source: supplier-notification
      target: close-deviation
    - id: e12
      source: release-quarantine
      target: end-false-positive
    - id: e13
      source: close-deviation
      target: end-closed
