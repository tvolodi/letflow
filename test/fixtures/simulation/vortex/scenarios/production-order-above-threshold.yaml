# Synthetic — R-Co's tests/simulation/scenarios/production-order-above-threshold.yaml is
# unreachable from this sandbox (see lib/letflow/design/req207-vortex-scenario-execution.md §0.2);
# structurally faithful to REQ-207's own requirement-text field-by-field account,
# not a byte-for-byte port.
#
# Process: process_quality_check.yaml ("Production Order Release"), test-local simplified
# graph (@simple_production_order_graph, design §2.1 -- SERVICE_TASK nodes elided/replaced).
# order_value_eur: 15000 (EUR 15,000) exercises REQ-050's EXCLUSIVE_GATEWAY edge e5
# (order_value_eur > 10000 -> budget-approval, not straight to end-released).
# 5 via: api steps (3 business steps + 2 task-lookup plumbing steps per design §3.1):
#   1  — planner submits order (anna)
#   2a — capacity-review task lookup (sabine)
#   2b — capacity-review approve (sabine)
#   3a — budget-approval task lookup (stefan)
#   3b — budget-approval approve (stefan)
# actors map is populated with real token/slug values at test setup time.
id: vortex-production-order-above-threshold
company_id: vortex
process_id: DEFINITION_NAME

actors:
  actor-vortex-anna: {}
  actor-vortex-sabine: {}
  actor-vortex-stefan: {}

preconditions:
  - check: process_definition_active
    args:
      name: DEFINITION_NAME
      prefix: "TENANT_PREFIX"

steps:
  # Step 1 — planner submits production order (order_value_eur: 15000 > 10000 threshold)
  - via: api
    action: "POST /api/v1/instances"
    params:
      definition_name: DEFINITION_NAME
      initial_variables:
        order_value_eur: 15000
    produces: instance
    actor: actor-vortex-anna

  # Step 2a — look up the pending capacity-review task
  - via: api
    action: "GET /api/v1/tasks?instance_id={{produces.instance.instance_id}}&status=PENDING"
    produces: capacity_task_list
    actor: actor-vortex-sabine

  # Step 2b — production manager approves capacity
  - via: api
    action: "POST /api/v1/tasks/{{produces.capacity_task_list.items.0.id}}/complete"
    params:
      capacity_decision: approve
    produces: capacity_task_result
    actor: actor-vortex-sabine

  # Step 3a — look up the pending budget-approval task
  - via: api
    action: "GET /api/v1/tasks?instance_id={{produces.instance.instance_id}}&status=PENDING"
    produces: budget_task_list
    actor: actor-vortex-stefan

  # Step 3b — controller approves budget
  - via: api
    action: "POST /api/v1/tasks/{{produces.budget_task_list.items.0.id}}/complete"
    params:
      budget_decision: approve
    produces: budget_task_result
    actor: actor-vortex-stefan

expected_outcomes:
  # EO-1: task_assigned — budget-approval HUMAN_TASK was created (proves edge e5,
  # order_value_eur > 10000, was taken -- not a direct skip to end-released).
  # Note: assignee_type is nil for ROLE-attributed tasks (§0.4); the verifier checks
  # assignee_type == "user", so outcome is :fail for ROLE tasks. observed still carries
  # assignee_ref: "role-controller" as evidence.
  - id: EO-001
    description: "Budget-approval task was created and is assigned to role-controller (proves budget-gate edge order_value_eur > 10000 was taken, routed to controller approval rather than skipping straight to line assignment)"
    verification:
      method: task_assigned
      args:
        prefix: "TENANT_PREFIX"
        task_ref: "{{produces.budget_task_list.items.0.id}}"
        expected_assignee_user_id: "role-controller"

  # EO-2: instance is COMPLETED, reaching end-released
  - id: EO-002
    description: "Instance status is COMPLETED after capacity-review + budget-approval, reaching end-released"
    verification:
      method: instance_state
      args:
        prefix: "TENANT_PREFIX"
        instance_ref: "{{produces.instance.instance_id}}"
        status: "COMPLETED"

  # EO-3: instance variables include both decisions
  - id: EO-003
    description: "Instance variables include capacity_decision and budget_decision"
    verification:
      method: instance_state
      args:
        prefix: "TENANT_PREFIX"
        instance_ref: "{{produces.instance.instance_id}}"
        status: "COMPLETED"
        variables:
          order_value_eur: 15000
          capacity_decision: approve
          budget_decision: approve

  # EO-4: audit event confirms budget-approval task was completed
  - id: EO-004
    description: "Audit trail records budget-approval task completion"
    verification:
      method: audit_event
      args:
        prefix: "TENANT_PREFIX"
        resource_type: task
        resource_id: "{{produces.budget_task_list.items.0.id}}"
        event_type: "task.complete"
