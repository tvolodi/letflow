# Permanent corpus (REQ-360). Not the REQ-358 throwaway validation fixture --
# see test/fixtures/uat/scenarios/_throwaway/login-routing-example.yaml for
# that file's own scope note. This is the first real REQ-ANALYST-authored
# platform-scope scenario using REQ-358's branching construct as permanent
# scope.
#
# REAL-BEHAVIOR NOTE (finding filed by ORCH per
# lib/letflow/design/req360-platform-login-routing-uat-scenario.md Section 5,
# updated by REQ-369 which closed the platform-admin-landing-surface gap this
# note originally documented):
# this scenario documents the ACTUAL observed routing behavior. As of
# REQ-369, PLATFORM_ADMIN now lands on a distinct platform-wide dashboard
# (PlatformDashboardPage, route "/platform-dashboard") rather than the
# tenant-dashboard root -- see branch 1 below and
# lib/letflow/design/req369-platform-dashboard-page.md. Tenant-scoped roles
# still land on the shared workspace root ("/", TenantDashboardPage) -- see
# branch 2, unchanged by REQ-369.
---
id: platform-login-routing-by-role
scope: platform
company_id: platform
process_id: n/a
title: Post-login landing surface by authenticated role (real QA routing behavior)
version: "1.0"
tags: [auth, routing, platform]

description: >
  A user opens the QA login URL. Real observed behavior as of 2026-09-17
  (see design doc Section 0), updated by REQ-369: authenticated
  PLATFORM_ADMIN users now land on a distinct platform-wide dashboard
  ("/platform-dashboard", PlatformDashboardPage) that shows platform-scoped
  content (tenant count, quick links to admin pages) and no tenant branding.
  Tenant-scoped roles continue to land on the shared workspace route (the
  tenant-dashboard root, "/", TenantDashboardPage); PLATFORM_ADMIN's extra
  capabilities also still surface as additional navigation entries within
  the authenticated shell. An unauthenticated visitor is redirected to
  Keycloak's own externally-hosted login page -- Letflow's own frontend
  renders no in-app login form and shows only a brief "Redirecting to
  login..." placeholder first. This scenario verifies the REAL behavior in
  both respects, not the idealized distinct-dashboards/in-app-form
  description this requirement's own Why-section originally anticipated.

pipeline_test: web/tests/e2e/pipelines/platform-login-routing-by-role.pipeline.e2e.spec.ts

actors:
  viewer: actor-any

preconditions:
  - description: The instance is reachable at the configured environment target
    check: instance_reachable

branches:
  - name: platform_admin_lands_on_platform_dashboard
    when:
      fact: role
      op: eq
      value: PLATFORM_ADMIN
    steps:
      - step: 1
        actor: viewer
        action: >
          Signs in as a platform administrator (PLATFORM_ADMIN role) via the
          QA environment's seeded admin credentials and reaches the post-login
          screen
        via: gui
    expected_outcomes:
      - id: EO-001
        description: >
          Platform admin lands on the distinct platform-wide dashboard
          introduced by REQ-369 -- NOT the tenant-dashboard workspace root
        verification:
          method: gui_screen
          detail: >
            Route is "/platform-dashboard" (rendering PlatformDashboardPage,
            not TenantDashboardPage); the page shows the
            data-testid="platform-dashboard-heading" "Platform Overview"
            heading, a data-testid="tile-tenant-count" tile populated from
            the real GET /api/v1/tenants endpoint's "total" field, and a
            data-testid="platform-quick-links" nav with links to Tenants,
            Services, Health, Metrics, and Users; the authenticated shell's
            navigation also shows the PLATFORM_ADMIN-only entries alongside
        on_fail:
          severity: BLOCKER
          business_impact: Platform admins cannot reach their workspace after login.
          suggested_action: route_to_wf03

  - name: tenant_scoped_role_lands_on_workspace_root
    when:
      fact: role
      op: in
      value: [PROCESS_DESIGNER, PROCESS_OPERATOR, TASK_WORKER]
    steps:
      - step: 1
        actor: viewer
        action: >
          Signs in as a tenant-scoped user via the QA environment's seeded
          operator credentials and reaches the post-login screen
        via: gui
    expected_outcomes:
      - id: EO-001
        description: Tenant-scoped user lands on the same workspace root
        verification:
          method: gui_screen
          detail: >
            Route is "/" (the workspace root, rendering TenantDashboardPage);
            the authenticated shell's navigation shows only this role's
            permitted entries (no PLATFORM_ADMIN-only items); dashboard tiles
            reflect this tenant's own data only
        on_fail:
          severity: BLOCKER
          business_impact: Tenant users cannot reach their workspace after login.
          suggested_action: route_to_wf03

  - name: unauthenticated_redirects_to_external_login
    when: else
    steps:
      - step: 1
        actor: viewer
        action: >
          Opens the QA login URL without any prior session (no token, no
          cookie)
        via: gui
    expected_outcomes:
      - id: EO-001
        description: >
          Visitor is redirected toward Keycloak's hosted login page --
          Letflow renders no in-app login form of its own
        verification:
          method: gui_screen
          detail: >
            Immediately after navigation, the app briefly shows the
            data-testid="auth-loading" "Redirecting to login..." placeholder,
            then the browser is redirected off-origin to the configured OIDC
            authority's own hosted login page (outside Letflow's own
            frontend -- there is no Letflow-rendered field set to describe;
            the fields shown, if any, are Keycloak's, not this
            application's)
        on_fail:
          severity: BLOCKER
          business_impact: Unauthenticated visitors cannot reach a way to sign in.
          suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: false
  description: No process instance created; no cleanup required.
