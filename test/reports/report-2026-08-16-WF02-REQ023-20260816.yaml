# ---------------------------------------------------------------------------
# Failure attribution — every failure read, none waved through
# ---------------------------------------------------------------------------
failure_attribution:
  distinct_failing_tests_across_all_40_runs: 1
  method: >
    All 40 logs were grepped together for ExUnit's failure-header pattern
    (`^ +[0-9]+\) test `) and the unique results sorted. Exactly ONE distinct
    failure header exists across the entire 40-run corpus — quoted verbatim below.
    No other test failed in any run. Each of the 3 failing runs was independently
    confirmed to contain exactly one failure header and a "Failed: 1 test" trailer.

  failure_1:
    occurrences: 3
    occurred_in_runs: [8, 25, 30]
    seeds: [157649, 603595, 0]
    exit_code_each_time: 2
    verbatim_output: |
      1) test method short-circuit — no DB query at all for a non-write method a GET request issues no Ecto query at all (method short-circuit, no DB round-trip) (Letflow.Plugs.TenantStatusTest)
         test/letflow/plugs/tenant_status_test.exs:121
         expected no Ecto query for a GET request
         code: refute_received :query_fired, "expected no Ecto query for a GET request"
         stacktrace:
           test/letflow/plugs/tenant_status_test.exs:136: (test)
    attributed_root_cause: "ISS-0011 / GitHub issue #65 — open, pre-existing, introduced by REQ-021"
    attribution_evidence:
      - >
        Signature matches ISS-0011 exactly and character-for-character: same module
        (Letflow.Plugs.TenantStatusTest), same file:line (tenant_status_test.exs:121),
        same assertion (`refute_received :query_fired`), same stacktrace line (:136).
      - >
        Mechanism re-verified directly from source in this run (not taken on trust
        from ISS-0011's write-up): test/letflow/plugs/tenant_status_test.exs lines
        127-132 call `:telemetry.attach(handler_id, [:letflow, :repo, :query], ...,
        test_pid)` — a GLOBAL handler on the event name, not scoped to this test's own
        sandboxed connection — inside a module declared `async: true`. Any concurrently
        running async test's Letflow.Repo query therefore delivers :query_fired to this
        test's mailbox, and `refute_received` at line 136 fails on an event this test
        never caused.
      - >
        Run 08's log shows this concurrency directly: the debug lines immediately
        preceding the failure block are foreign queries from other modules' tests
        (`SELECT ... FROM "tenants"`, `SELECT ... FROM "approvals"`), and the lines
        immediately after it are more foreign queries (`SELECT ... FROM "users"`,
        `INSERT INTO "tenants"`) — i.e. other async tests were actively issuing Repo
        queries in the exact window between this test's attach and its refute_received.
        That is the ISS-0011 race observed in the act, not inferred.
    caused_by_req_023: false
    not_caused_by_req_023_evidence: >
      REQ-023's only new `async: true` module is
      test/letflow/event_store/schemas_test.exs (line 24: `use ExUnit.Case, async: true`).
      Grepped independently in this run for `telemetry` and `Repo.`: the single match is
      a moduledoc comment at line 11 explaining that the module "attaches no global
      `:telemetry` handler". There are zero real Repo calls and zero telemetry attaches
      in it — it reads module docs via Code.fetch_docs/1 and does no database I/O, which
      is why it does not use Letflow.DataCase. REQ-023's other new module
      (test/letflow/event_store/migrations_test.exs, line 29) is
      `use Letflow.DataCase, async: false` for the whole module. So REQ-023 emits none of
      the query telemetry this flake trips on. It does add 37 tests (24 async + 13 sync)
      to the suite, which perturbs BEAM scheduling and plausibly changes the observed
      rate — exposure of an existing defect, not a new one.
    action_taken: >
      Forwarded, NOT fixed. Per WF-02 Step 4's own rule ("Failures unrelated to this
      run's own acceptance criteria (pre-existing) are filed and forwarded per
      ISSUE_QUEUE.md — not fixed here, don't block this step's own PASS verdict") and
      core-directives.md's Unblock-Everything scope boundary. ISS-0011 is already
      registered and already filed on GitHub as #65; ORCH already updated it earlier in
      this run, so it was NOT re-filed. No test or application code was modified by this
      step.
    blocks_this_step: false

  no_other_failures: >
    Zero other failing tests across 40 runs. No new failure, no regression, no
    unattributed failure. Nothing was dismissed as "probably flaky" — the only
    failure mode observed was read in full and matched to a named, pre-existing,
    already-registered root cause with source-level and log-level evidence.

