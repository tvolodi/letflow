# ---------------------------------------------------------------------------
# Findings that refine ISS-0011 (data only — record not edited by this step)
# ---------------------------------------------------------------------------
observations_for_iss_0011:
  - >
    CONFIRMS Step 3b's headline correction with independent evidence: the flake DOES
    reproduce under `--seed 0` (run 30 of this session, exit code 2). A pinned seed is
    therefore definitively not a safe deterministic baseline. This is the second
    independent observation of a seed-0 reproduction, from a different agent, on a
    different set of runs.
  - >
    REFINES the frequency estimate, with a substantially larger sample than either prior
    estimate. ISS-0011 originally recorded ~20% (1 of 5 runs); Step 3b revised it to ~33%
    (3 of ~9 runs). This session observed 3 of 40 = 7.5% overall, splitting as 1/26 =
    3.8% under `--seed 0` and 2/14 = 14.3% under unpinned random seeds. All three figures
    are samples of the same scheduling race; the earlier ones came from single-digit
    sample sizes where one extra hit swings the percentage enormously. The 40-run figure
    is the better-supported estimate, and it does NOT contradict Step 3b's substantive
    point — it sharpens the rate while confirming the seed-0 reproduction that mattered.
  - >
    NOTE ON DIRECTION, stated as an observation and not as a claim of significance: the
    unpinned rate (2/14) ran higher than the pinned rate (1/26) in this sample. With only
    3 events total this is far too small to establish that seed 0 is genuinely less
    prone, and it must NOT be read as reinstating the falsified "seed 0 is safe"
    assumption — run 30 disproves that outright. Recorded so a later run has the raw
    numbers rather than re-deriving them.

