# ---------------------------------------------------------------------------
# Methodology — deliberate deviation from prior Step 4 practice
# ---------------------------------------------------------------------------
methodology:
  deviation_from_prior_practice: >
    Every prior WF-02 Step 4 in this project ran `mix test --seed 0` (usually twice)
    and treated a clean result as proof the suite was deterministically green. That
    assumption was falsified at Step 3b of THIS run (see docs/issues/ISS-0011.yaml's
    UPDATE block): the flake was observed at ~33% across ~9 runs, and reproduced
    under `--seed 0` on a freshly dropped/recreated database. ExUnit's seed controls
    test *ordering*, not the concurrent execution timing that decides this race, so
    seed pinning shifts probability without conferring determinism. This report
    therefore does NOT rest on a single seed-0 run.
  design: >
    40 independent full-suite runs (not just the new tests) on the current HEAD,
    split across pinned (`mix test --seed 0`) and unpinned (`mix test`, ExUnit
    picking a fresh random seed each time) invocations. Each run's stdout+stderr was
    redirected to its own log file under scratch/req023/, the shell exit code
    captured explicitly, and the seed, Result line, Finished line and any failure
    block extracted programmatically from the log rather than eyeballed.
  runner_script: scratch/req023/run_suite.sh  # git-ignored scratch, per core-directives.md
  logs: scratch/req023/run01-seed0.log … run40-pinned.log  # git-ignored scratch

