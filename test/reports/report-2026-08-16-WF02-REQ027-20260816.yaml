# ---------------------------------------------------------------------------
# Findings that refine ISS-0011 (data only — record NOT edited by this step)
# ---------------------------------------------------------------------------
observations_for_iss_0011:
  - >
    THIRD independent seed-0 reproduction. Run 04 of this session failed under
    `mix test --seed 0` (exit code 2). ISS-0011's seed-0 claim has now been confirmed
    by three different agents across three different run sets: TEST-DESIGN-VALIDATOR
    at REQ-023 Step 3b, TEST-RUNNER at REQ-023 Step 4 (run 30), and TEST-RUNNER at
    REQ-027 Step 4 (run 04, this report). `--seed 0` is definitively not a
    deterministic baseline for this suite.
  - >
    THE PINNED-VS-UNPINNED SPLIT DID NOT REPRODUCE. REQ-023's 40-run sample observed
    3.8% pinned vs 14.3% unpinned and recorded that direction as "directionally
    consistent" with the root cause. This session observed 1/6 pinned and 1/6
    unpinned — identical rates, no split at all. Stated as an observation, not a
    claim: with 2 events here and 3 events there, neither sample can establish a real
    difference between the modes, and this session is evidence that the earlier
    directional split was most likely sampling noise rather than a property of the
    defect. The practical guidance is unchanged and if anything reinforced: pinning
    the seed buys nothing.
  - >
    Observed rate this session was 2/12 = 16.7%, versus REQ-023's better-supported
    3/40 = 7.5%. Explicitly NOT proposed as a new headline rate — 2 events in 12 runs
    is exactly the small-sample situation ISS-0011's own UPDATE block cautions about,
    where one occurrence swings the percentage enormously. Recorded so a later run has
    the raw numbers. One mechanism that could genuinely raise the rate is worth noting
    without asserting it: REQ-027 adds 22 async tests, and the async phase grew from
    0.7s (REQ-023) to 0.8-1.1s here, so there is modestly more concurrent async work
    in flight per run — more opportunity for a foreign query to interleave. That would
    be further exposure of the existing defect, not a new one. This step did not run
    enough trials to test that hypothesis and does not claim it.
  - >
    Suggested to ORCH: append these three observations to docs/issues/ISS-0011.yaml.
    This step deliberately did not edit that record, because its handoff scoped it to
    running and reporting and to committing only its report plus its handoff file.

