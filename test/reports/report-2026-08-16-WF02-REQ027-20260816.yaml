# ---------------------------------------------------------------------------
# Failure attribution — every failure read, none waved through
# ---------------------------------------------------------------------------
failure_attribution:
  distinct_failing_tests_across_all_12_runs: 1
  method: >
    All 12 logs were grepped together for ExUnit's failure-header pattern
    (`^ +[0-9]+\) test `) and the unique results sorted. Exactly ONE distinct failure
    header exists across the entire 12-run corpus — quoted verbatim below. A per-log
    header count was also produced: 10 logs contain 0 headers, and runs 04 and 10
    contain exactly 1 each, each with a "Failed: 1 test" trailer. Nothing was
    dismissed as "probably flaky"; both failing runs' blocks were read in full.

  failure_1:
    occurrences: 2
    occurred_in_runs: [4, 10]
    seeds: [0, 446139]
    exit_code_each_time: 2
    verbatim_output: |
      1) test method short-circuit — no DB query at all for a non-write method a GET request issues no Ecto query at all (method short-circuit, no DB round-trip) (Letflow.Plugs.TenantStatusTest)
         test/letflow/plugs/tenant_status_test.exs:121
         expected no Ecto query for a GET request
         code: refute_received :query_fired, "expected no Ecto query for a GET request"
         stacktrace:
           test/letflow/plugs/tenant_status_test.exs:136: (test)
    attributed_root_cause: "ISS-0011 / GitHub issue #65 — open, pre-existing, introduced by REQ-021"
    attribution_evidence:
      - >
        Signature matches ISS-0011 character-for-character in both failing runs: same
        module (Letflow.Plugs.TenantStatusTest), same file:line
        (tenant_status_test.exs:121), same assertion (`refute_received :query_fired`),
        same stacktrace line (:136), same "Failed: 1 test" trailer.
      - >
        Mechanism as recorded in ISS-0011: the module is `async: true` and the test
        attaches a GLOBAL `:telemetry` handler on [:letflow, :repo, :query] rather than
        one scoped to its own sandboxed connection, so any concurrently running async
        test's Letflow.Repo query delivers :query_fired into this test's mailbox and
        `refute_received` fails on an event this test never caused.
      - >
        Run 04's log captures the race in the act, read directly rather than inferred.
        The debug lines IMMEDIATELY BEFORE the failure block are foreign queries from
        other modules' tests — `SELECT ... FROM "approvals"`, `INSERT INTO "tenants"`
        for slug "bpm-default-tenant-40", `INSERT INTO "users"` for "someone-6599" —
        and the lines IMMEDIATELY AFTER it are more foreign queries (`SELECT ... FROM
        "groups"`, `SELECT count(*) FROM "users"`, `INSERT INTO "tenant_role"`,
        `INSERT INTO "tenants"`). Other async tests were actively issuing Repo queries
        inside the exact window between this test's attach and its refute_received.
    caused_by_req_027: false
    not_caused_by_req_027_evidence: >
      Re-verified structurally in this step rather than taken on trust from Step 3b.
      REQ-027's only new `async: true` module is test/letflow/definitions/schemas_test.exs
      (line 28: `use ExUnit.Case, async: true`). Grepping it for
      `telemetry|attach|Repo\.|DataCase` yields exactly three hits, ALL of them prose:
      lines 12 and 14 are moduledoc text stating the module attaches no global
      `:telemetry` handler and does not use Letflow.DataCase, and line 205 is a code
      comment inside a test mentioning `Repo.preload/2` (the test body itself is
      `assert InstanceDefinitionSnapshot.__schema__(:associations) == []`, pure
      reflection, no I/O). There are zero real Repo calls and zero telemetry attaches
      in it. REQ-027's other new module,
      test/letflow/definitions/migrations_test.exs, is `use Letflow.DataCase,
      async: false` for the whole module (line 37). So REQ-027 emits none of the query
      telemetry this flake trips on, and its DB-touching tests cannot run concurrently
      with the flaky test at all.
    action_taken: >
      Forwarded, NOT fixed. Per WF-02 Step 4's own rule ("Failures unrelated to this
      run's own acceptance criteria (pre-existing) are filed and forwarded per
      ISSUE_QUEUE.md — not fixed here, don't block this step's own PASS verdict") and
      core-directives.md's Unblock-Everything scope boundary. ISS-0011 already exists
      and is already filed on GitHub as #65, so it was NOT re-filed. No test code,
      application code, migration or design artefact was modified by this step.
    blocks_this_step: false

  no_other_failures: >
    Zero other failing tests across 12 runs. No new failure, no regression, no
    unattributed failure. The only failure mode observed was read in full in both
    occurrences and matched to a named, pre-existing, already-registered root cause
    with source-level and log-level evidence.

