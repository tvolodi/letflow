# ---------------------------------------------------------------------------
# Methodology
# ---------------------------------------------------------------------------
methodology:
  deviation_from_pre_req_023_practice: >
    Pre-REQ-023 Step 4 practice was a single `mix test --seed 0` treated as proof the
    suite was deterministically green. That assumption is falsified and must not be
    used: per docs/issues/ISS-0011.yaml's UPDATE blocks, the flake reproduces UNDER
    `--seed 0`, because ExUnit's seed controls test *ordering*, not the concurrent
    BEAM scheduling that actually decides the race. This report therefore does NOT
    rest on a single seed-0 run.
  design: >
    12 independent full-suite runs (the whole suite, not just REQ-027's new tests) on
    the current HEAD, split evenly 6 pinned (`mix test --seed 0`) / 6 unpinned
    (`mix test`, ExUnit picking a fresh random seed). Modes were INTERLEAVED
    (p,p,u,p,u,p,u,u,p,u,p,u) rather than run as two contiguous blocks, so the
    distribution is not an artefact of ordering or of machine state drifting over the
    session. Each run's stdout+stderr went to its own log file; the shell exit code
    was captured explicitly; and the seed, Result line, Finished line, eaddrinuse count
    and any failure block were extracted programmatically from the log rather than
    eyeballed.
  run_count_rationale: >
    12 runs, not 40. REQ-023's Step 4 already characterised ISS-0011 on a 40-run
    sample; the purpose here is to establish REQ-027's own suite status and to detect
    any NEW failure mode, not to re-characterise a defect that already has a larger
    sample on record. 12 runs across both modes is enough to do that and to report a
    real distribution.
  runner_script: scratch/req027/run_suite.sh   # git-ignored scratch (.gitignore line 38)
  logs: scratch/req027/run01-pinned.log … run12-unpinned.log   # git-ignored scratch

