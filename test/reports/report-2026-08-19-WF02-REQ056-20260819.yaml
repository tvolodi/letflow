unresolved_failure_this_run_must_own:
  description: >
    All 4 tests in test/letflow/engine/service_task_routing_test.exs now fail
    identically: Engine.create/2 (called via the test's own start_instance!/2 helper)
    returns {:error, {:activation_failed, {:node_type_not_yet_implemented, :SERVICE_TASK,
    "svc"}}} instead of {:ok, result}.
  root_cause: >
    lib/letflow/engine/transition.ex's dispatch_node/4 has a documented, deliberate
    catch-all (lines 256-268) for :SERVICE_TASK, :TIMER, :SUB_PROCESS and any unknown
    node_type -- "the 3 remaining variants ... not part of this requirement's 5-way
    dispatch". No dispatch clause exists for :SERVICE_TASK (unlike :START, :END,
    :HUMAN_TASK, :EXCLUSIVE_GATEWAY, :PARALLEL_GATEWAY, which all park/advance
    correctly). Because Engine.create/2 auto-advances a fresh token along the hop
    chain from START, any graph containing a SERVICE_TASK node fails immediately at
    instance-creation time -- there is no way to reach "a real, running instance"
    whose token sits at a SERVICE_TASK node under the engine's current dispatch table.
  spec_vs_reality_gap: >
    test/specs/REQ-056.md itself states "no dispatch-orchestration loop exists yet"
    and that Letflow.Engine.ServiceTask is "deliberately caller-less" -- consistent
    with lib/letflow/engine/service_task.ex being pure helpers only. But the routing
    test's own fixture comment (service_task_routing_test.exs lines 130-133) assumes
    the graph "just needs to be a structurally valid, activatable definition to reach
    a real instance" -- i.e. it assumed SERVICE_TASK could sit parked like HUMAN_TASK
    once reached. That assumption does not hold against the current transition.ex
    dispatch table, and this mismatch was not caught before this test-runner turn
    (the routing tests were apparently never actually executed against a real engine
    before being handed off here).
  affected_tests:
    - "AC5(b) -- a JSON array body -> :invalid_2xx_body -> give_up -> instance lands in :error"
    - "AC5(b) -- a bare JSON string body -> :invalid_2xx_body -> give_up -> instance lands in :error"
    - "AC6 -- validate_rendered_url rejects the empty render, and the build attrs land the instance in :error"
    - "AC8 -- a retriable kind at attempt_index == retry_limit gives up and lands the instance in :error"
  not_fixed_by_test_runner_because: >
    Closing this gap means either (a) ELIXIR-DEV adding a minimal SERVICE_TASK
    dispatch_node/4 clause to transition.ex that parks the token (mirroring
    dispatch_human_task) so an instance can legitimately sit at a SERVICE_TASK node
    pending external completion/error, or (b) TEST-DESIGNER redesigning these 4
    fixtures to construct/seed instance state directly (bypassing Engine.create's
    auto-hop through the unimplemented node type), matching how other suites test
    node-level behavior without full engine dispatch. Both are scope/design decisions
    outside TEST-RUNNER's remit -- risk of silently expanding this run or picking the
    wrong fix shape is too high to decide unilaterally.
  next_action: Route back to ELIXIR-DEV (most likely fix: add SERVICE_TASK park
    dispatch to transition.ex) with TEST-DESIGNER looped in to confirm/adjust the
    4 fixtures once the dispatch behavior lands; re-run WF-02 Step 4 after.

