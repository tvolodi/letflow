  docker_compose_up: |
    NOT run this invocation. `docker compose up -d` was not attempted directly
    against a fresh daemon start because the host's shared dockerd was found in
    the same broken state a prior TEST-RUNNER run on this host already hit (see
    test/reports/report-2026-08-26-WF02-REQ151-20260826.yaml's identical note):
    `docker ps`/`docker compose ps` failed with "Cannot connect to the Docker
    daemon at unix:///var/run/docker.sock". Diagnosed before touching anything
    further: `/var/run/docker.pid` pointed at PID 3925615, a dockerd process
    still alive (cwd = this workspace) and still holding an open LISTEN fd on
    a /var/run/docker.sock inode -- but `stat`/`lsof -U` showed the *path*
    /var/run/docker.sock now resolves to a different, newer inode created by
    systemd's docker.socket unit, which was itself in a failed
    (start-limit-hit) state. I.e. the daemon that owns this workspace's
    containers is alive and undisturbed, but its API socket path had been
    reclaimed by systemd's competing socket unit, orphaning CLI access -- not
    something safe to fix further without risking other unrelated services on
    this shared host (penpot, immich postgres processes observed still running
    under the same dockerd). Did not force-kill or otherwise touch dockerd
    3925615.
    Confirmed instead, without going through the docker CLI/API, that this
    checkout's own Postgres container was already up: `ss -tlnp` showed
    `docker-proxy` processes forwarding 127.0.0.1:5462->172.17.0.2:5432 and
    0.0.0.0:5463/[::]:5463->172.27.0.2:5432; the untracked .env at the project
    root sets LETFLOW_DB_PORT=5463, which config/db_port.exs resolves to for
    both dev and test. A raw `/dev/tcp` probe confirmed 127.0.0.1:5463 accepts
    connections. So `docker compose up -d` was unnecessary here (the container
    this checkout uses was already running) and Ecto could reach it directly.
  mix_test_alias: "mix.exs's `test` alias ran ecto.create/ecto.migrate --quiet automatically inside each of the 8 partition processes, as scripts/test_parallel.sh's own design expects -- no separate DB-setup step taken."

