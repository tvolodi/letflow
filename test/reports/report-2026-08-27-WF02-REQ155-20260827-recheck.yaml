failures:
  - test: "AC-5: the running script is a child of Letflow.Engine.Lua.TaskSupervisor while in flight (Letflow.Engine.Lua.ExecutorTest)"
    location: test/letflow/engine/lua/executor_test.exs:388 (assertion at :407)
    partition: 5 (run_2 only)
    raw: |
      1) test wall-clock timeout (REQ-155) AC-5: the running script is a child of Letflow.Engine.Lua.TaskSupervisor while in flight (Letflow.Engine.Lua.ExecutorTest)
         test/letflow/engine/lua/executor_test.exs:388
         expected at least one in-flight child while the script is running
         code: assert children != [], "expected at least one in-flight child while the script is running"
         stacktrace:
           test/letflow/engine/lua/executor_test.exs:407: (test)
    scrutiny: >
      Given this exact file/area (executor.ex, executor_test.exs,
      config/test.exs) just had a real bug, this was NOT waved off as
      "probably the known ISS-0340/ISS-0350 flake" -- it is a
      structurally different test than both of those (ISS-0340 is
      Letflow.Api.ContextTest's scoped_repo_opts/1; ISS-0350 is a
      different ExecutorTest scenario) and it IS in a file this
      branch's diff touches, so route (a) diff-exclusion does not
      clear it, and route (b) merge-base reproduction is unavailable
      because this test does not exist at merge-base
      (67e29432e3911bff666c0cc3799ac7da85fb6605) at all -- it was added
      new by this branch's TEST-DESIGNER work for REQ-155 AC-5. Applied
      route (c) instead, with actual measurement:
        1. Read the test: it sends :started, sleeps a fixed
           `Process.sleep(50)`, then makes one single, non-retrying
           check of `Task.Supervisor.children/1`. This is a one-shot
           fixed-wait assertion, not a poll/retry -- structurally the
           same fragile-under-contention pattern documented for
           ISS-0340/ISS-0350 (a hardcoded sleep assumed to always be
           enough scheduling headroom).
        2. Measured host state near the failure: `cat /proc/loadavg`
           immediately after read "2.70 7.06 7.79" on an 8-core box
           (`nproc`=8) -- i.e. 1-and-5-minute load at or above the
           full core count, from this shared host's other, unrelated
           docker workloads (immich, wms, penpot, ai-qadam, forgejo,
           etc. -- all confirmed present via `docker ps` before this
           run). Partition 5's own log at the failure timestamp also
           shows Ecto queries queuing 52ms+ (`queue=52.4ms`) at that
           moment, corroborating scheduler/IO contention external to
           this branch's own code.
        3. Reproduced `mix test test/letflow/engine/lua/executor_test.exs
           --seed 0` standalone (no other partitions competing for the
           scheduler) 3 times in a row: "Result: 24 passed" all 3
           times, this AC-5 test included, 0 failures. The test only
           failed once, under full 8-way parallel load, never in
           isolation.
      Conclusion: this is a genuine, newly-surfaced (not pre-existing --
      the test is new to this branch) flaky-test bug, distinct from
      both ISS-0340 and the wallclock_timeout config value this recheck
      was scoped to verify. Its root cause is the test's own
      one-shot-fixed-sleep synchronization design, not a regression in
      lib/letflow/engine/lua/executor.ex's supervision logic (which
      calls Task.Supervisor.async_nolink/2 synchronously and
      immediately inside execute_with_manifest/3 -- there is no
      plausible app-code reason the child would take >50ms to register
      except host scheduler contention). Recommend: file a new
      test-hardening item (replace the fixed
      `Process.sleep(50)` + single check with a short
      poll/retry loop, e.g. retrying `Task.Supervisor.children/1` for
      up to ~300ms) rather than looping this recheck further -- fixing
      it is outside this recheck task's scope (verifying the
      lua_wallclock_timeout_ms change) and outside TEST-RUNNER's
      write-ownership of executor_test.exs (owned by TEST-DESIGNER).
      Not filed as a numbered ISS by this agent; flagged for ORCH to
      route.

verdict: PARTIAL
verdict_reasoning: >
  The specific issue this recheck was scoped to verify -- RELEASE-
  VALIDATOR's FAIL on lua_wallclock_timeout_ms:200 being too tight --
  is confirmed resolved: across 4 independent scripts/test_parallel.sh
  runs performed here (on top of ELIXIR-DEV's 4 and ORCH's 1, i.e. 9
  total, now 10 with this report), zero runs show a wallclock-timeout-
  related failure, and 3 of these 4 runs were fully green at
  2147/2147. ELIXIR-DEV's rework (200ms -> 5000ms) is well-supported.

  However, one run (run_2) surfaced a genuinely new, distinct flake
  (AC-5's Task.Supervisor.children/1 check) in the same recently-
  touched executor_test.exs file, structurally attributed via route
  (c) (see failures section) to a fragile fixed-sleep synchronization
  pattern in that specific test, triggered by measured host contention
  (loadavg ~7-8 on 8 cores from unrelated containers), not by this
  branch's application code or by the lua_wallclock_timeout_ms value.
  Because it is a NEW test (added by this branch) rather than a
  pre-existing one, it cannot be waved off as "known" -- it needs its
  own fix (a poll/retry loop instead of one fixed sleep) before REQ-155
  can be considered fully flake-free. Recommend ORCH route a small
  follow-up to TEST-DESIGNER to harden that one assertion; do not
  block re-verifying the wallclock_timeout fix itself, which this
  report confirms.
