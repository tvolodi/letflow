    ":telemetry.attach/4"-based test ("no Repo.get/3 (no [:letflow, :repo,
    :query] telemetry event) fires for a same-tenant sibling id", line
    677). Inspected the test body directly: it attaches with a handler_id
    built from {__MODULE__, :get_instance_state_query_counter,
    make_ref()} -- unique per test invocation, no risk of colliding with
