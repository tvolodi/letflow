failures:
  - test: "Letflow.TenantSchemaReaperTest \"sweep_orphans/2 schema_name format guard skips an old row with a malformed schema_name instead of attempting a drop\""
    location: test/support/tenant_schema_reaper_test.exs:212
    partition: 8 (run 1 only)
    raw: |
      Assertion with >= failed
      code:  assert skipped >= 1
      left:  0
      right: 1
  - test: "Letflow.TenantSchemaReaperTest \"sweep_orphans/2 reclaims an old, well-formed orphaned row drops the real schema and deletes both rows\""
    location: test/support/tenant_schema_reaper_test.exs:124
    partition: 8 (run 1 only)
    raw: |
      Assertion with >= failed
      code:  assert reclaimed >= 1
      left:  0
      right: 1
      (log immediately above shows: Postgrex.Protocol failed to connect: FATAL 53300 (too_many_connections) sorry, too many clients already)
  - test: "Letflow.TenantSchemaReaperTest \"sweep_orphans/2 concurrent-invocation liveness guard (ISS-0110) spares an old row while another invocation's connection is open, reclaims it once that connection closes\""
    location: test/support/tenant_schema_reaper_test.exs:273
    partition: 8 (run 1 only)
    raw: |
      ** (DBConnection.ConnectionError) [] connection not available and request was dropped from queue after 4000ms.
      code: Postgrex.query!(
      stacktrace: test/support/tenant_schema_reaper_test.exs:315: (test)
    attribution: >
      PRE-EXISTING / environmental, not caused by REQ-165. Structural evidence,
      not count-matching:
        route 1 (diff-exclusion): `git diff --stat main...HEAD` for this branch
          touches only .github/workflows/ci.yml, .tool-versions,
          lib/letflow/engine/wasm/plugin_handler.ex, lib/mix/tasks/letflow.check_toolchain.ex,
          mix.exs, mix.lock, priv/wasm_fixtures/*, test/letflow/engine/wasm/plugin_handler_test.exs,
          test/mix/tasks/letflow_check_toolchain_test.exs, and design/spec/handoff docs.
          test/support/tenant_schema_reaper_test.exs and its dependency
          lib/letflow/tenant_schema_reaper.ex are both untouched by this branch.
          The only mix.exs change is adding `{:wasmex, "~> 0.15.1"}` to deps --
          no pool-sizing/config change; scripts/test_parallel.sh itself is
          untouched by this branch (confirmed via the same diff --stat).
        route 3 (demonstrated mechanism, measured not asserted): the failing
          partition's own log shows the actual Postgres error --
          "FATAL 53300 (too_many_connections) sorry, too many clients already"
          and a DBConnection checkout timeout after 4000ms -- i.e. real
          connection-pool exhaustion at runtime, not a logic assertion failure
          in the reaper code itself.
      This exact mechanism/file pair (test/support/tenant_schema_reaper_test.exs
      hitting FATAL 53300 too_many_connections mid-run) is already documented in
      docs/issues/ISS-0287.yaml ("Mid-run Postgres connection-pool exhaustion at
      documented TEST_PARALLEL_N=4 remedy"), which records status: resolved
      (fix commit 39c7364, adding TEST_SUPERUSER_RESERVED/TEST_NONPOOL_CONNECTION_RESERVE
      knobs to scripts/test_parallel.sh's pool-headroom clamp). This run's
      reproduction, on a branch that does not touch scripts/test_parallel.sh or
      any pool-sizing config, indicates ISS-0287's fix does not fully eliminate
      the underlying pool-pressure race at N=8 -- it recurred here despite being
      marked resolved, structurally identical to the ISS-0340 recurrence pattern
      TEST-RUNNER has previously documented (see ISS-0340.yaml's own reopen
      history). Two immediate re-runs (run 2, run 3) on the identical commit,
      unchanged environment, reproduced 0/2296 failures each -- consistent with
      intermittent, load-dependent pool pressure rather than a deterministic
      defect in this branch's own code.
      Not filed as a new issue by this agent directly (per
      docs/agents/instructions/core-directives.md's "No Issue Left Local-Only" --
      filing/registration is ORCH's job via letflow-queue's register_task).
      Recommend to ORCH: reopen ISS-0287 (status contradicted by this
      reproduction) rather than opening a fresh issue, same precedent as
      ISS-0340's reopen.

