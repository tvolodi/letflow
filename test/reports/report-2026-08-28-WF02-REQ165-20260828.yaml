ci_yaml_caveat: >
  This run touches .github/workflows/ci.yml (Rust-toolchain-pin mechanism for
  wasmex). Local test_parallel.sh/mix compile runs above verify the Elixir/Rust
  build and test code paths in THIS sandbox only. They do NOT and cannot prove
  the CI YAML changes themselves are correct -- only a real GitHub Actions run
  on the eventual PR, in GitHub's actual runner environment (different image,
  different pre-installed toolchain state, different caching behavior than this
  sandbox), is the true verification of the CI config mechanism. This report
  makes no claim that CI is proven correct; that remains open until the PR's
  Actions run completes.

verdict: PASS
verdict_reasoning: >
  Full suite run 3 times consecutively via scripts/test_parallel.sh with
  WASMEX_BUILD=true: run 1 had 3 failures (2293/2296), runs 2 and 3 were both
  fully clean (2296/2296). All 3 failures were isolated to
  test/support/tenant_schema_reaper_test.exs in a single partition and carry a
  measured Postgres "too_many_connections" (FATAL 53300) / DBConnection
  checkout-timeout signature -- structurally attributed as environmental
  connection-pool exhaustion (ISS-0287's documented mechanism recurring),
  independently verified via diff-exclusion (neither the failing test file nor
  scripts/test_parallel.sh appear in this branch's diff) and via the measured
  Postgres error itself, not by assertion or by count-matching against any
  prior run. `mix compile --force --warnings-as-errors` is clean (0 warnings).
  No failure touches REQ-165's own new code
  (lib/letflow/engine/wasm/plugin_handler.ex,
  lib/mix/tasks/letflow.check_toolchain.ex,
  test/letflow/engine/wasm/plugin_handler_test.exs,
  test/mix/tasks/letflow_check_toolchain_test.exs) in any of the 3 runs -- all
  231 plugin_handler tests and all check_toolchain tests passed cleanly every
  time. No rework required for ELIXIR-DEV. Flagging ISS-0287 recurrence to ORCH
  as a new_finding, not blocking this PASS verdict per the same precedent as
  ISS-0340's prior reopen. The CI YAML mechanism itself (.github/workflows/ci.yml)
  remains unverified by this report -- see ci_yaml_caveat above; only a real
  GitHub Actions PR run proves that piece.
