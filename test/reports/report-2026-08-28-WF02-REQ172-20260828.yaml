new_finding_for_orch:
  title: "Malformed handoff file (string `context` instead of object) breaks mix letflow.lint_handoffs's H6 corpus scan"
  severity: MAJOR
  affected_files:
    - handoffs/WF02-REQ172-20260828/step-01-code-designer-rework1.json
    - lib/mix/tasks/letflow.lint_handoffs.ex
  recommend: >
    Either fix step-01-code-designer-rework1.json's `context` field to match
    HANDOFF_PROTOCOL.md's object schema, or make
    Mix.Tasks.Letflow.LintHandoffs.check_advisory/2 defensive against a
    non-map `context` (mirroring the existing `is_map(r)`/`is_binary(s)`
    guards already present a few lines below it for `result`/`summary`), or
    both. This is a MAJOR severity finding because it makes the full test
    suite genuinely red on this branch -- not the pre-existing/environmental
    noise it was previously assessed as -- and therefore currently blocks a
    clean acceptance-criterion #8 ("mix test ... pass with real output
    quoted") for REQ-172.
  action_taken: "Reported here for ORCH to register via letflow-queue per ISSUE_QUEUE.md; not filed directly by TEST-RUNNER, and not fixed directly since it falls outside this role's ownership (test/ and test/support/ only)."

verdict: FAIL
verdict_reasoning: >
  `mix compile --force --warnings-as-errors` is clean (0 warnings). The
  isolated `:wasm_hang` stage is clean (7 passed, 0 failures). But the main
  `mix test` stage has 4 real failures (2433/2437 passed), and this run's
  own independent re-verification -- explicitly requested by the dispatching
  handoff -- refutes one of the two prior assessments carried forward from
  earlier steps. The RequirementStatusInvariantsTest (A9) and both
  CheckToolchainTest rust-pin failures are confirmed genuinely
  pre-existing/environmental by direct reproduction against a `main`
  worktree (identical failures, identical signatures, files untouched by
  this branch's diff). The LintHandoffsTest H6 failure is NOT pre-existing:
  it is caused by this branch's own handoff artifact
  (handoffs/WF02-REQ172-20260828/step-01-code-designer-rework1.json) using a
  bare string for `context` where the handoff schema and every other handoff
  file in the repo use an object -- confirmed absent on `main` and confirmed
  passing on `main` for the exact same test file. Acceptance criterion #8
  ("mix test and mix compile --warnings-as-errors both pass with real output
  quoted") is therefore not met as of this branch's current state.
  REQ-172's own application code and tests (lib/letflow/engine/wasm/*,
  priv/wasm_fixtures/req172_*, test/letflow/engine/wasm/host_api_write_test.exs,
  test/letflow/engine/wasm/capability_gate_test.exs, test/support/
  host_api_parity.ex) are not implicated in any of the 4 failures -- the
  325+7 wasm/lua-scoped tests referenced in this run's own dispatch context
  are not among the failures list above. This is a workflow-bookkeeping
  defect in a handoff JSON file, not a defect in REQ-172's implementation,
  but it still makes the suite red and must be fixed (see
  new_finding_for_orch) before this can be reported PASS.
