failures:
  - test: "test H6 -- zero new violations on the real corpus post-fix T-H6-ZERO-NEW (Mix.Tasks.Letflow.LintHandoffsTest)"
    location: test/mix/tasks/letflow.lint_handoffs_test.exs:377
    raw: |
      ** (FunctionClauseError) no function clause matching in Access.get/3
      # 1: "Queue task 324, GH#624, stage S5. CODE-DESIGN-VALIDATOR FAILED this
           design (commit bbc9af9) with a specific, live-verified defect..."
      # 2: "artifacts_in"
      # 3: nil
      code: results = Enum.map(files, &LintHandoffs.lint_file(&1, schema))
      lib/mix/tasks/letflow.lint_handoffs.ex:544: Mix.Tasks.Letflow.LintHandoffs.check_advisory/2
    attribution: >
      REGRESSION -- caused by this branch's own diff, NOT pre-existing/environmental.
      This directly contradicts the assessment quoted in this run's own handoff
      (step-04-test-runner.json), which claimed all 4 full-suite failures were
      "structurally cleared as pre-existing/environmental (none of the failing
      files/modules appear in git diff --name-only main...HEAD)". That check used
      the wrong lens: it looked for the *test file* in the diff, not the *data
      file the test scans*. Root cause, verified directly:
        1. `grep -rl "CODE-DESIGN-VALIDATOR FAILED this design (commit bbc9af9)"
           handoffs/` finds exactly one file:
           handoffs/WF02-REQ172-20260828/step-01-code-designer-rework1.json --
           which IS in this branch's `git diff --name-only main...HEAD`.
        2. That file's `"context"` field is a bare string. `docs/agents/shared/
           HANDOFF_PROTOCOL.md` section 2's schema defines `context` as an
           OBJECT (with `stage`, `requirement_ids`, `artifacts_in`, etc. keys),
           never a string. Every other handoff file checked (`git ls-tree -r
           main -- handoffs/` piped through a JSON check) has `context` as a
           dict; this file is the only string-context handoff anywhere in the
           repo, on main or on this branch.
        3. `lib/mix/tasks/letflow.lint_handoffs.ex:544` does
           `get_in(data, ["context", "artifacts_in"])`, which calls
           `Access.get(context_value, "artifacts_in", nil)`. When `context` is
           a string rather than a map, `Access.get/3` has no matching clause
           for a binary container, hence the `FunctionClauseError`.
      Reproduced against `main`: created a `git worktree` of `main`
      (merge-base b49fd7f), ran `mix deps.get` (network available) and
      `mix test test/mix/tasks/letflow.lint_handoffs_test.exs
      test/mix/tasks/letflow_check_toolchain_test.exs` there directly.
      Result: LintHandoffsTest passed cleanly on main (0 failures in that
      file); only the two rust-pin CheckToolchainTest cases failed on main
      (same ENOENT signature as failures #3/#4 below) -- proving H6 is a new
      failure introduced by this branch's own handoff artifact, not a
      pre-existing condition.
      This is a workflow-bookkeeping defect (a malformed handoff file this
      run itself produced), not a defect in REQ-172's application code
      (lib/letflow/engine/wasm/*, priv/wasm_fixtures/*, or the new test files)
      -- none of which this failure touches. Recommend: ORCH (or whichever
      agent authored step-01-code-designer-rework1.json's dispatch) fix that
      file's `context` field to the schema-required object shape, or
      alternatively lib/mix/tasks/letflow.lint_handoffs.ex's check_advisory/2
      should defensively guard against a non-map `context` value rather than
      crash the whole lint run on one malformed file -- either fix (or both)
      needed before this can be a clean PASS.

