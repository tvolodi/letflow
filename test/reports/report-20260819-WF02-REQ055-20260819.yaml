  engine_concurrency_test_new_file:
    result: "2/3 PASS, 1/3 FAIL — reproduced consistently across 3 separate runs
      (once inside the full suite, twice in isolated re-runs of just this file)"
    tests:
      - name: "AC1 -- 100 concurrent task completions across 100 distinct
          instances / every completion succeeds, no cross-instance
          corruption, no global serialization"
        result: FAIL
        location: "test/letflow/engine_concurrency_test.exs:265 (assertion at
          line 299)"
        assertion_verbatim: "assert concurrent_micros < baseline_micros * 30"
        observed_values:
          run_1_full_suite: "left (concurrent_micros): 971275, right (baseline_micros * 30): 264150"
          run_2_isolated: "left: 1142294, right: 288570"
        functional_assertions_in_same_test: >
          All PASS every run — every one of the 100 Task.async completions
          returns {:ok, %{instance_status: :completed}}, and every instance's
          reconstructed InstanceProjection has status :completed and the
          correct per-instance variables["instance_seed"]. Only the trailing
          wall-clock proxy assertion fails. No cross-instance corruption or
          deadlock was observed in any run.
        diagnosis: >
          Test-code fragility, not an application bug in lib/letflow/engine.ex.
          The comment at engine_concurrency_test.exs:271-280 documents this as
          a "loose wall-clock proxy... deliberately loose, catches only gross
          regressions like an accidentally-reintroduced global mutex/singleton
          serializer" — but the :timer.tc block being measured
          (provision_and_complete_all!, line 283) wraps BOTH the sequential
          creation of all 100 instances (start_n_instances!, line 220-230,
          explicitly sequential per its own comment: "starts `n` instances...
          sequentially — the concurrency under test is the subsequent
          task-completion step, not this setup") AND the concurrent
          completions, while baseline_micros times only a single
          Engine.complete_task call with no instance-creation cost at all. So
          concurrent_micros is inflated by ~100x a single Engine.create call's
          cost (unrelated to the lock-contention property under test) before
          it's ever compared against baseline_micros. In this environment a
          single Engine.create appears to cost several ms, so 100 sequential
          creates alone can exceed the 30x-single-completion threshold
          regardless of how well engine.ex's per-row locking scales — the
          measurement window is the bug, not the app.
        routing: >
          Routed back to TEST-DESIGNER: the timed block in
          provision_and_complete_all! (or the AC1 test itself) needs to time
          only the concurrent completion phase (the Task.async/await_many
          span), not the sequential provisioning phase, so the proxy assertion
          measures what its own comment says it's measuring. Not loosened or
          skipped here per the "no speculation" / "never edit a test purely to
          make a red suite go green" rules — left as a genuine FAIL.
      - name: "AC2 -- two concurrent task completions on the SAME instance /
          exactly one commits :completed, the other observes
          {:task_not_pending, :completed}"
        result: PASS
      - name: "AC4 -- reconstruction matches projection for all instances
          after the concurrent run / each instance's reconstructed
          status/variables/token positions match its own projection"
