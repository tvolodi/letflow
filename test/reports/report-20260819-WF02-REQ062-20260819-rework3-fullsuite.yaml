  failure_1_req062_own_reconstruction_test:
    result: FAIL
    classification: "REQ-062's OWN test coverage failing — BLOCKING this run.
      test/specs/REQ-062.md explicitly names this test as this requirement's owned
      coverage (\"reconstruction_test.exs's new test is REQ-053's own replay contract
      (EE-11) extended to a 5th persisted event type this requirement introduces...
      explicitly named in the design doc's moduledoc-finding list as this branch's own
      rework-1 fix\"), and lib/letflow/engine/reconstruction.ex's SUB_PROCESS_COMPLETED
      replay clause is listed as part of REQ-062's own real executable surface."
    test: "test req062 -- SUB_PROCESS_COMPLETED replay reconstructs the same state the
      live completion path produced reconstructing a parent past its completed
      SUB_PROCESS child matches the live projection (Letflow.Engine.ReconstructionTest)"
    location: "test/letflow/engine/reconstruction_test.exs:675 (assertion at line 708)"
    assertion_output_verbatim: |
      match (=) failed
      code:  assert {:ok, result} = Reconstruction.reconstruct_instance(created.instance_id, prefix: schema_name)
      left:  {:ok, result}
      right: {:error,
              {:replay_failed,
               {:ambiguous_sub_process_completion,
                "47d853ee-966b-4db9-97cc-0bc8cfb97d38"}}}
      stacktrace:
        test/letflow/engine/reconstruction_test.exs:708: (test)
    root_cause_diagnosis: >
      lib/letflow/engine/reconstruction.ex has a pre-existing, self-documented gap
      (its own comment at the drop_pending_events/1 clause, ~lines 619-630): "This
      module still has no replay-time consumer for a {:sub_process_start, ...}
      pending event (activating a *new* child during replay) -- that remains a real,
      named gap for a future requirement". When apply_event/3 replays INSTANCE_STARTED
      and Engine.advance_until_stable/4 drives the seed token to the SUB_PROCESS node,
      Transition.transition/3 produces a {:sub_process_start, ...} pending_event (real
      child activation requires a DB write, which live-path SubProcess does but replay
      cannot/does not attempt) -- drop_pending_events/1 silently discards it instead of
      setting the in-memory token's waiting_child_instance_id. By the time apply_event/3
      later replays the SUB_PROCESS_COMPLETED event and calls
      find_sub_process_completion_token/2 (matching by
      token.waiting_child_instance_id == child_instance_id, reconstruction.ex:578), no
      live token has that field set, so the zero-match branch fires
      {:error, {:ambiguous_sub_process_completion, child_instance_id}}.

      This gap is NOT in this rework cycle's own uncommitted diff
      (lib/letflow/engine/task_activation.ex, lib/letflow/engine/sub_process.ex,
      lib/letflow/engine/execution_error.ex) -- reconstruction.ex is unmodified in the
      current working-tree diff. But it was newly EXPOSED as a hard test failure by
      this rework cycle's task_activation.ex fix: confirmed via \`git stash\` (still on
      feature/WF02-REQ062-20260819 throughout, stash popped immediately after) +
      isolated rerun of test/letflow/engine/reconstruction_test.exs alone. Without the
      rework-3 diff (i.e. on this branch's last committed state, HEAD
      5f267077f1105d2b8e297f74e584d765eb2728ad), the SAME test fails earlier and
      differently:
        \`\`\` (RuntimeError) cannot merge Multi; the following operations were found
        in both Ecto.Multi: [:task_records]
        code: Engine.complete_task(...)
        (ecto 3.14.1) lib/ecto/multi.ex:952: Ecto.Multi.merge_results/3
        ...
        (letflow 0.1.0) lib/letflow/engine.ex:1153: Letflow.Engine.run_complete_task/6
        test/letflow/engine/reconstruction_test.exs:697: (test)
        \`\`\`
      That earlier crash is exactly the :task_records Multi-key collision bug this
      rework cycle's task_activation.ex change fixes (namespacing the step key by
      instance_id, per its own docstring addition). So the test has never actually
      passed on this branch -- it previously died in its own DB setup (completing the
      child task, before ever calling Reconstruction.reconstruct_instance/2) on a bug
      this rework fixed, and now runs far enough to hit the separate, pre-existing
      reconstruction.ex gap described above. This rework's OWN changes are confirmed
      NOT the proximate cause of the ambiguous_sub_process_completion failure (they
      contain no waiting_child_instance_id / SUB_PROCESS_COMPLETED replay logic at
      all), but they are what unmasked it, and reconstruction_test.exs is squarely
      REQ-062's own claimed test coverage per test/specs/REQ-062.md -- so this
      blocks the requirement, it is not filed-and-forwarded as unrelated/out-of-scope.
    routing: "ELIXIR-DEV (real application bug in lib/letflow/engine/reconstruction.ex,
      not a test-code issue -- reconstruction_test.exs's assertion is correct per
      REQ-062's own design doc/test spec; the gap is reconstruction.ex's
      drop_pending_events/1 silently discarding the {:sub_process_start, ...}
      pending_event instead of deriving/replaying the child link so
      waiting_child_instance_id is set to match what SUB_PROCESS_COMPLETED's payload
      will later reference). Per TEST-RUNNER's own role file, not fixed here."

