  cause_2_sub_process_node_type_not_registered_in_graph_parser:
    failure_count: 8
    severity: blocking
    owner_to_fix: ELIXIR-DEV
    diagnosis: >
      lib/letflow/definitions/graph.ex's @node_type_map (the "node_type" string ->
      atom table build_graph_node/1 uses) lists START/END/HUMAN_TASK/SERVICE_TASK/
      EXCLUSIVE_GATEWAY/PARALLEL_GATEWAY/TIMER but has no "SUB_PROCESS" => :SUB_PROCESS
      entry. Any graph definition containing a node with "node_type" => "SUB_PROCESS"
      (every REQ-062 fixture) parses that node's node_type as the fallback
      :unknown_node_type instead of :SUB_PROCESS, so Engine.create/2's activation loop
      hits Transition's generic catch-all and returns
      {:error, {:activation_failed, {:node_type_not_yet_implemented, :unknown_node_type, "sp"}}}
      before any SUB_PROCESS-specific code (lib/letflow/engine/sub_process.ex,
      transition.ex's dispatch_sub_process_entry/completion) is ever reached.
    representative_error: |
      match (=) failed
      code:  assert {:ok, created} = Engine.create(start_attrs(parent_def, ...), prefix: schema_name)
      right: {:error, {:activation_failed, {:node_type_not_yet_implemented, :unknown_node_type, "sp"}}}
    affected_tests:
      - "test/letflow/engine_sub_process_test.exs: AC3/AC8 SUB_PROCESS_OUTPUT_SCHEMA_VIOLATION, AC4, AC3/AC8 SUB_PROCESS_MISSING_REQUIRED_OUTPUT, AC2 (no declared interface), AC1 (declared interface filters inputs), AC5 (waiting_child_instance_id set/cleared), AC7 (cancel doesn't cancel child)"
      - "test/letflow/engine/reconstruction_test.exs: \"req062 -- SUB_PROCESS_COMPLETED replay reconstructs the same state the live completion path produced\""
    fix_direction: >
      Add "SUB_PROCESS" => :SUB_PROCESS to @node_type_map in
      lib/letflow/definitions/graph.ex.

  cause_3_test_expectation_contradicts_modules_own_single_hop_contract:
    failure_count: 1
    severity: non_blocking_but_needs_TEST-DESIGNER_rework
    owner_to_fix: TEST-DESIGNER
    diagnosis: >
      test/letflow/engine/transition_test.exs "transition/3 -- {:sub_process_completed,
      token_id} clears the wait and advances (design doc §2.4)" / "clears
      waiting_child_instance_id (struct-update) and moves the token off its single
      outgoing edge" asserts that ONE Transition.transition(g, state,
      {:sub_process_completed, "t1"}) call against a token on a :SUB_PROCESS node whose
      single outgoing edge leads to an :END node produces new_state.tokens == [] (i.e.
      fully completes through :END) in a single call.
      This contradicts lib/letflow/engine/transition.ex's own documented "Single hop per
      call" contract (module @moduledoc: "One transition/3 call processes exactly one
      token through exactly one node-type dispatch and returns -- it never recursively
      cascades a token through a chain of nodes within one call... requires two separate
      transition/3 calls"), which dispatch_task_completion/4 (the exact precedent
      dispatch_sub_process_completion/4 is deliberately written to mirror) already
      obeys, and which lib/letflow/design/req062-sub-process-runtime.md §2.4 explicitly
      specifies for the SUB_PROCESS case too ("dispatch_sub_process_completion/4's only
      job is then: clear the wait, evaluate outgoing edges, advance" -- no mention of
      cascading into :END). The implementation (transition.ex's
      dispatch_sub_process_completion/4 -> advance_off_completed_node/4 -> advance_token/3)
      correctly moves the token onto "after" and leaves it there for a second
      {:advance_token, "t1"} call to process the :END entry -- this matches both the
      module's documented contract and the design doc. The test's expectation of
      single-call completion into an empty token list appears to be the actual defect,
      not the implementation.
    representative_error: |
      Assertion with == failed
      code:  assert new_state.tokens == []
      left:  [%Letflow.Engine.Token{node_id: "after", token_id: "t1", branch_id: nil, waiting_child_instance_id: nil}]
      right: []
    fix_direction: >
      Not fixed here per role scope (diagnosis only, no implementation-code changes
      made this run). Needs TEST-DESIGNER rework: either the test should issue a second
      Transition.transition(g, new_state, {:advance_token, "t1"}) call before asserting
      tokens == [] (matching the module's single-hop contract and the HUMAN_TASK
      precedent), or -- if single-call full completion through :END really is the
      intended REQ-062 behavior for SUB_PROCESS completion specifically -- the design
      doc and dispatch_sub_process_completion/4's contract need to be revisited, which
      is a design-level decision this report does not make unilaterally.

