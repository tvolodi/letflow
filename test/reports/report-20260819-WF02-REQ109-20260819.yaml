        test/letflow/identity_migration_test.exs:242: Letflow.IdentityMigrationTest.restore_orphaned_guard_backup_rows!/0
        test/letflow/identity_migration_test.exs:1: Letflow.IdentityMigrationTest.__ex_unit__/2
    uniformity: >
      All 10 failures share the byte-identical root error above and the identical
      stacktrace through restore_orphaned_guard_backup_rows!/0 at line 242 -- verified
      by extracting the error line from each of the 10 numbered failure blocks. This is
      one root cause failing the module's shared setup, not 10 independent defects.
    failing_tests:
      - "copies groups/users/tenant_role from public into the tenant's own schema, preserving id, ordering tenant_role after groups (FK dependency)"
      - "DropLegacyPublicIdentityTables guard -- skip-on-uncopied-row: a tenant schema missing one identity table makes the guard SKIP the drop, not raise 42P01"
      - "DropLegacyPublicIdentityTables guard -- once the copy is completed for every registered tenant, the guard PROCEEDS and drops all three public tables"
      - "DropLegacyPublicIdentityTables guard -- idempotency: re-running after it already succeeded is a no-op"
      - "copy_tenant/2 is idempotent: re-running after a successful copy re-copies nothing (on_conflict: :nothing)"
      - "an uncopied row makes the guard SKIP the drop entirely -- all three public tables survive"
      - "ISS-0060: restore_orphaned_guard_backup_rows!/0 restores the stale row"
      - "ISS-0060: with_only_this_tenant_visible!/2 hides the racer tenant, flips guard SKIP into PROCEED"
      - "an orphaned tenant_role aborts that tenant's copy with {:error, {:orphaned_tenant_role, id}}"
      - "copy_all_tenants/0 processes every registered tenant and aggregates counts"
    mechanism: >
      restore_orphaned_guard_backup_rows!/0 is ISS-0060's self-heal hook. It moves every
      row out of the crash-durable table public.iss060_tenant_schemas_guard_backup back
      into public.tenant_schemas via a data-modifying CTE. That backup table persisted
      rows from an earlier interrupted run in this SHARED database, but the matching
      parent rows in public.tenants had since been deleted by another run's teardown
      (teardown does DELETE FROM tenant_schemas then DELETE FROM tenants -- visible in the
      run log). Restoring the orphaned child row therefore violates
      tenant_schemas_tenant_id_fkey. This is cross-run / cross-agent shared-database
      contamination in a leftover backup table.
