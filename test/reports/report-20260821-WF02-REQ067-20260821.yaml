attribution_method: >
  Per core-directives.md's "Failure Attribution Is Structural, Never By
  Count-Matching". All three failures are ONE group (same file, same root cause),
  attributed via Route 1 (structurally absent from `git diff --name-only main...HEAD`,
  listed above) AND Route 3 (a demonstrated mechanism, measured directly on this host
  during this same step -- not cited from a prior report, and not assumed from the
  ISS-0110 log line alone).

failures:
  - group: Letflow.TenantSchemaReaperTest
    count: 3
    file: test/support/tenant_schema_reaper_test.exs
    failing_tests:
      - line: 273
        name: "sweep_orphans/2 concurrent-invocation liveness guard (ISS-0110) spares an old row while another invocation's connection is open, reclaims it once that connection closes"
        symptom: "Assertion with >= failed -- code: assert reclaimed >= 1, left: 0, right: 1"
      - line: 124
        name: "sweep_orphans/2 reclaims an old, well-formed orphaned row drops the real schema and deletes both rows"
        symptom: "Assertion with >= failed -- code: assert reclaimed >= 1, left: 0, right: 1"
      - line: 212
        name: "sweep_orphans/2 schema_name format guard skips an old row with a malformed schema_name instead of attempting a drop"
        symptom: "Assertion with >= failed -- code: assert skipped >= 1, left: 0, right: 1"
    determination: >
      PRE-EXISTING / ENVIRONMENTAL, an emergent interaction between
      scripts/test_parallel.sh's own concurrency model (N independent `mix test`
      OS processes against one shared Postgres) and ISS-0110's own shipped fix
      (TenantSchemaReaper.sweep_orphans/2 defers its ENTIRE sweep whenever
      pg_stat_activity shows any OTHER `letflow_mixtest_%`-tagged connection, since
      it cannot distinguish a live sibling invocation's row from a genuinely dead
      one without per-row ownership tracking -- see docs/issues/ISS-0110.yaml's
      resolution_note). NOT caused by this branch.
    evidence:
      - method: "Route 1 -- structural, branch diff"
        detail: >
          Neither test/support/tenant_schema_reaper_test.exs nor
          test/support/tenant_schema_reaper.ex appears in
          `git diff --name-only main...HEAD` (the 8-item list above). Both are
          byte-identical to main on this branch.
      - method: "Route 3 -- demonstrated mechanism, measured live on this host in this step"
        detail: >
          Every one of the 3 failures' surrounding log lines (partition-1.log,
          lines immediately preceding each failing assertion) show
          `TenantSchemaReaper.sweep_orphans/2: deferring this sweep entirely --
          another mix test invocation (application_name != "letflow_mixtest_31028")
          is currently connected to this database` logged right at the point the
          test's own reclaimed/skipped counter would otherwise have incremented --
          i.e. partition 1's reaper test sees partitions 2/3/4's own real,
          concurrently-running `mix test` OS processes as "another invocation" and
          the ISS-0110 guard (correctly, per its own design) defers the sweep
          entirely rather than reclaiming anything, so `reclaimed`/`skipped` stay 0.
          Reproduced directly to confirm causation rather than assert it: ran
          `mix test test/support/tenant_schema_reaper_test.exs` alone (no other
          concurrent mix test invocation) -- Result: 6 passed, 0 failed. The same
          3 tests that failed inside the 4-way parallel run pass cleanly in
          isolation, isolating the variable to "another mix test invocation is
          connected" exactly as the guard's own log line states, not to anything in
          this branch's diff.
      - method: "cross-check against ISS-0110's own resolution note"
        detail: >
          docs/issues/ISS-0110.yaml (status: resolved) states its fix's own tradeoff
          explicitly: "if one is present, the sweep defers entirely (not just that
          invocation's own rows... ) and retries on the next boundary call" -- this
          is that exact deferral firing, just triggered by test_parallel.sh's own
          sibling partitions rather than a nested nested-nested nested Mix.Tasks
          invocation as ISS-0110's own filing scenario described. Same mechanism,
          new triggering context (parallel test runner siblings, not a nested
          `mix letflow.check.test`).
    searched_existing_issues: >
      Grepped docs/issues/*.yaml and docs/anti-patterns.md for
      "test_parallel"/"TenantSchemaReaperTest"/"reaper.*partition" -- no existing
      record covers this specific interaction (test_parallel.sh's own sibling
      partitions vs the ISS-0110 guard). ISS-0194/ISS-0212 cover a different
      test_parallel.sh defect (connection-pool exhaustion at ecto.create, already
      resolved). ISS-0064/ISS-0068/ISS-0110 reference this same test file for
      unrelated reasons (formatter drift, the original orphan-reap fix). Not
      covered by count-matching against any prior run either -- this is the first
      time this exact 3-failure set has been observed and reported, per this
      run's own measurement above.
    action: >
      NOT fixed in this run (Unblock-Everything does not apply -- this failure does
      not block REQ-067's own acceptance criteria, and it is not this branch's own
      defect to fix). Reported to ORCH in result.issues, MAJOR severity, for
      register_task filing per ISSUE_QUEUE.md (TEST-RUNNER does not call
      letflow-queue or `gh` itself).

