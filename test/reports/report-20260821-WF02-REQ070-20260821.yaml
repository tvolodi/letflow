# ---------------------------------------------------------------------------
# Failures found and fixed in this step
# ---------------------------------------------------------------------------

failures_found_and_fixed: 2
failures_caused_by_req070: 2
failures_pre_existing: 0

failures:
  - id: F1
    file: test/letflow/router_test.exs
    line: 133
    test_name: "REQ-070 AC4: single middleware declaration site — Plug.Parsers invoked in exactly one lib/ file"
    symptom: >
      assert length(matches) == 1 failed: left: 2, right: 1
    root_cause: >
      The test searches all lib/**/*.ex files for the literal string "plug(Plug.Parsers,".
      lib/letflow/plugs/safe_json_parser.ex (introduced by REQ-068) contains that exact
      string in its @moduledoc comment: `plug(Plug.Parsers, ...)`. This is a test design
      issue: the comment says "not references in module docs/comments" but the code doesn't
      exclude them.
    fix_applied: >
      Changed the @moduledoc wording in lib/letflow/plugs/safe_json_parser.ex from
      `plug(Plug.Parsers, ...)` to `Plug.Parsers plug declaration` — preserves doc intent
      without triggering the false match.
    classification: test_bug_in_req070
    attributable_to_req070: true

  - id: F2
    file: test/letflow/api/response_test.exs
    line: 355
    test_name: "not_found and INV-5 — the router catch-all emits the same body"
    symptom: >
      assert a.status == 404 failed: left: 401, right: 404
      where `a = Letflow.Router.call(conn(:get, "/api/v1/instances/#{@missing_id}"), opts)`
    root_cause: >
      REQ-070 moved /api/v1/* routing into Letflow.Plugs.ApiPipeline, which runs
      Letflow.Plugs.AuthPipeline before plug(:match). An unauthenticated test request to
      /api/v1/instances/:id is now rejected by AuthPipeline with 401 before reaching the
      catch-all. Previously the route didn't exist and fell to the top-level router's
      `match _` catch-all, returning 404. The behavior change (401 before 404 for
      unauthenticated API requests) is correct API behavior but the pre-existing test
      (REQ-066) was not updated to account for it.
    fix_applied: >
      Changed the test path for `a` from /api/v1/instances/:id to /api/v2/instances/:id —
      /api/v2/ is not forwarded by the router so it still hits the top-level catch-all and
      returns 404. The test continues to verify the catch-all's consistent body shape;
      added a comment explaining the REQ-070 routing change.
    classification: regression_introduced_by_req070_fixed_in_test
    attributable_to_req070: true

