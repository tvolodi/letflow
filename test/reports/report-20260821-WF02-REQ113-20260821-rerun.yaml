environment_finding:
  title: "Postgres connection exhaustion + Mix build-lock serialization at N=8 (nproc default) on this host -- not a REQ-113 AC failure, flagged for follow-up"
  detail: >
    Two independent real N=8 (nproc-derived, no env override) runs of
    scripts/test_parallel.sh on this host each produced real, non-injected
    ExUnit failures/aborts that do NOT reproduce the baseline's clean 1274-pass
    result: run A had 17 real failures (partitions 6 and 7, matching their raw
    logs exactly -- confirms AC2's parser is correct, not broken, on real
    content); run B had partition 8 abort entirely with no Result: line at all,
    root-caused via its raw log to
    "FATAL 53300 (too_many_connections) sorry, too many clients already" during
    `ecto.create`/`ecto.migrate`, plus repeated
    "Waiting for lock on the build directory (held by process ...)" lines
    showing Mix's own build-directory lock still serializes each partition's
    process startup post-precompile (a no-op read under the lock, per design
    §4.2, but still lock-contended, which bunches the 8 partitions' DB-pool
    acquisition into a burst rather than spreading it out). config/test.exs
    line 25 sets `pool_size: System.schedulers_online() * 2` (16 per partition
    on this 8-core host), so 8 concurrent partitions can request up to 128
    connections against a Postgres instance whose configured max_connections
    this session could not directly confirm (no docker exec access in this
    sandbox) but is very plausibly at or near the traditional default of 100,
    consistent with the observed FATAL 53300. This is a real host-capacity
    constraint, independent of and not fixable by scripts/test_parallel.sh's
    parsing/exit logic (which handled both anomalies correctly per its own
    contract: run A's real failures were summed and reported non-zero exit;
    run B's no-Result-line partition was correctly treated as a failure per
    §4.5's cross-check). AC1/AC2/AC3's demonstrations above therefore use
    TEST_PARALLEL_N=2 (an explicitly supported override, not a workaround
    outside the design) to produce clean, reproducible evidence, while N=8's
    real behavior is reported here rather than silently discarded.
  recommendation: >
    Not a blocker for REQ-113 (none of AC1-AC6 require N=nproc to be
    collision-free on every host's Postgres config). Recommend a follow-up
    requirement or decision record considering either a lower pool_size for
    partitioned test runs or a documented recommended max TEST_PARALLEL_N per
    host's Postgres max_connections -- surfaced here so it is not lost, per this
    role's mandate to report real outcomes rather than silently smoothing over
    an anomaly the demonstration procedure had to route around.

