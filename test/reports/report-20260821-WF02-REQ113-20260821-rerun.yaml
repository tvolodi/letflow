summary: >
  Reworked scripts/test_parallel.sh (dc93092/cf28a46) plus reworked design doc
  §4.5/§4.6 (376bb81/df5b2a9) now correctly parses this toolchain's real
  "Result: N[/M] passed (...)" / "Failed: N tests" output and uses parsed
  failures_i as the authoritative exit signal. All six ACs independently
  re-verified against the actual current code and real executions (not against
  the prior report's narrative). One environment-capacity finding surfaced during
  re-verification, not attributable to script logic: running at the host's real
  nproc=8 (the default N derivation) triggers Postgres "too_many_connections"
  under this repo's config/test.exs pool_size (schedulers_online()*2 = 16 per
  partition, i.e. up to 128 concurrent connections requested across 8 partitions)
  and, separately, Mix's own per-invocation build-directory lock serializes each
  partition's startup even post-precompile -- both real, reproducible, and
  independent of the parsing/aggregation logic under test. This is why the AC1/AC3
  demonstrations below use TEST_PARALLEL_N=2 (a supported, documented override
  per AC4/§3, not a special-cased workaround) for the side-by-side/exit-contract
  evidence, while the N=8/nproc path is exercised separately to confirm AC4's
  derivation and AC2's parsing/summing correctness under real (non-injected)
  partition failures. See "environment_finding" below -- recommend a follow-up
  requirement/decision record for the pool_size vs max-partition-count tension;
  not a REQ-113 AC failure.

