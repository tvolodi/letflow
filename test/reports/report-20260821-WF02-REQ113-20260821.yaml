root_cause: >
  scripts/test_parallel.sh's aggregation regex
  (^[0-9]+ (propert(y|ies)|tests?), .*[0-9]+ failures?) was written against an
  ExUnit CLIFormatter output shape this pinned toolchain (Elixir 1.20.3/OTP 29)
  does not produce. The actual installed formatter prints
  "Result: <passed>[/<total>] passed (<type breakdown>)" and, only when failures
  exist, a separate "Failed: <n> tests" line -- neither of which contains the
  literal substring "failures" the regex requires. This is a design-doc research
  error (design §2 claims to have read the installed cli_formatter.ex and describes
  a different, non-matching format) that propagated unchanged into the
  implementation and was never caught because Steps 2a/2c/2d were all static
  review and Step 3/4 were skipped (TEST-DESIGNER's NO-execution-surface verdict),
  making this Step 5 run the first point anyone actually executed the script
  against real `mix test` output.

