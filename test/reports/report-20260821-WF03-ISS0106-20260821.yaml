# ---------------------------------------------------------------------------
# The cwd-mutation interaction risk (handoff's specific caution #2)
# ---------------------------------------------------------------------------

cwd_interaction_risk:
  question: >
    letflow_check_toolchain_test.exs moves the VM-wide working directory
    (File.cd!/2) around each call to the task under test. The full run is the
    first time that is exercised alongside everything else. Could any failure in
    this suite stem from another test observing a changed cwd?
  verdict: "NO -- not plausibly attributable to any of the 13 failures. This is not a defect introduced by this branch."
  evidence:
    - method: "structural -- ExUnit cannot overlap this module with anything"
      detail: >
        Read from the installed ExUnit 1.20.3 source on this host,
        'C:/Program Files/Elixir/lib/ex_unit/lib/ex_unit/runner.ex' lines 108-137,
        not from memory: async_loop/4 keeps taking async modules while any remain;
        only when take_async_modules/1 is exhausted does it call
        take_sync_modules/0, and it then asserts `0 = ...map_size()` after waiting
        out every running async module before entering `for pair <- sync_modules`,
        which spawns sync modules ONE AT A TIME. The test file is `async: false`.
        So it can overlap neither an async module (all finished by then) nor
        another sync module (strictly serialised). The window is additionally
        scoped to a single run/1 call by File.cd!/2, which restores the previous
        directory when the function returns.
    - method: "structural -- nothing else in the repo touches the cwd"
      detail: >
        `grep -rn 'File.cd' lib/ test/` returns hits in
        test/mix/tasks/letflow_check_toolchain_test.exs and nowhere else. No
        file-backed Logger handler is configured in config/ either, so no
        background process is writing to a relative path during the window.
    - method: "positive evidence at the most cwd-sensitive point in the suite"
      detail: >
        The one thing in this suite that would break loudest on a leaked cwd is
        Mix.Tasks.Letflow.Check.Test.run/1's Port.open({:spawn_executable, ...}),
        which inherits the VM's working directory at spawn time: launched from a
        temp dir it would die immediately with "Could not find a Mix.Project".
        It did not. Measured live with Get-CimInstance during this run, three
        child erl.exe processes were running the project's real `mix test` from
        the project directory (PIDs 28220, 9356, 31352, created 8:12:36, 8:12:43,
        8:13:36 local), and they went on to open 65 connections to letflow_test.
        A child that had inherited a deleted temp cwd could not have done that.
        `grep -c 'Could not find a Mix.Project'` over the run log = 0.
    - method: "symptom shape"
      detail: >
        A cwd leak surfaces as :enoent/:eacces on a relative path, or as a Mix
        project-not-found error. All 13 failures are one of two shapes instead:
        a Postgrex 23503 foreign_key_violation, or an ExUnit 60s timeout inside
        Mix.Tasks.Letflow.Check.Test.collect/2 waiting on a subprocess. Neither
        is a path error, and both are fully explained by causes that predate this
        branch (below).
    - method: "the module's own 30 tests all passed"
      detail: >
        Including T-F7, the test that deliberately deletes its own working
        directory. A corrupted or unrestored cwd would have failed that module
        first and loudest.

