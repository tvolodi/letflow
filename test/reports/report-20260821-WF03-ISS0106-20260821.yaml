    action: "FORWARDED to ISS-0107. No test edited, no application code touched."

# ---------------------------------------------------------------------------
# Load-dependence: honoured, not assumed away
# ---------------------------------------------------------------------------

load_dependence:
  handoff_caution: >
    "Do not treat 'matches the previously-reported set' as proof of pre-existence,
    and do not treat a count that differs by one or two as proof of regression."
  demonstrated_first_hand_in_this_step: >
    This step did not have to take load-dependence on faith: it ran the full suite
    TWICE on the same commit, ten minutes apart, and got different failure sets.
      * Run 1 -- `mix test`, seed 928451: 1247/1260 passed, 13 failed, 495.1s.
      * Run 2 -- the nested full suite inside `mix letflow.check`, seed 613644:
        1245/1260 passed, 15 failed, 501.7s.
    Same commit (ec32dcd), same database, same host, no code change between them.
    Run 2 added exactly two failures that Run 1 did not have:
    Letflow.Definitions.MigrationsTest (migrations_test.exs:662) and
    Letflow.Engine.PinRebindTest (pin_rebind_test.exs:351) -- both with
    invalid_schema_name on a tenant schema the test itself had just provisioned.
    Run 2 was the more contended of the two by construction: it is a child process
    of the gate, and its own Check.TestTest spawned three more nested suites
    against the same database. That is the load-dependence, measured here rather
    than quoted.
  the_pin_rebind_failure_deserved_extra_scrutiny_and_got_it: >
    Letflow.Engine.PinRebindTest is the one failing module whose FILE IS IN THIS
    BRANCH'S DIFF, so "not in the diff" was not available as an argument and was
    not used. Derivation instead: (1) the branch's only hunk in
    test/letflow/engine/pin_rebind_test.exs re-wraps a single `"entries" => [...]`
    list literal across lines 513-517 inside an event payload -- whitespace only,
    verified by reading `git diff main...HEAD` on that file; the token stream is
    unchanged. (2) The failure is at line 351, in provisioned_tenant/0 called from
    line 78 -- a different test, several hundred lines away from the hunk.
    (3) The symptom is a Postgres schema vanishing mid-test
    (3F000 invalid_schema_name, "schema tenant_2d2b... does not exist") during
    TenantProvisioning.replay_migrations/1. Re-wrapping a list literal cannot drop
    a Postgres schema. (4) It did NOT occur in Run 1 on the same code, only in the
    contended Run 2. Determination: same full-suite-only tenant-schema teardown
    race as ISS-0109, NOT caused by this branch's edit to that file.
  contrast_with_the_previously_recorded_run: >
    Read after the derivations above, purely as a cross-check, the prior record
    (report-20260820-WF02-REQ066-20260820.yaml) also does not match: 14 failures
    there vs 13 in Run 1; TWO Check.TestTest failures there (lines 105, 126, with
    147 passing) vs THREE in both runs here; and its two
    Letflow.Definitions.Promotion* failures recur in neither run here. Had
    "matches the previously-reported set" been the criterion, Run 1 would have
    been mis-scored as both a regression and a fix. It was not used as one.
  newly_uncovered_failures: >
    NONE that lacks an existing issue record, but ONE gap in an existing record is
    called out rather than glossed. The 13 failures of the measured run all fall
    inside ISS-0107's documented cascade (its description names both the
    timeout/exit-1 failures in letflow_check_test_test.exs AND the
    IdentityMigrationTest foreign_key_violation on stale
    iss060_tenant_schemas_guard_backup rows as one consequence chain). The two
    EXTRA failures seen only in Run 2 are the class ISS-0109 covers -- but
    ISS-0109's title enumerates the modules it was filed for
    (Letflow.Definitions.PromotionTest, Letflow.Definitions.PromotionAssertionRerunTest),
    and Letflow.Definitions.MigrationsTest and Letflow.Engine.PinRebindTest are
    not among them, exactly as those modules were not among ISS-0048/0050/0060/
    0062/0064's either. Stated here as an observation for ORCH (see
    findings_for_orch); no new issue was filed, because the class already has an
    open record and filing a fourth ID for the same race would repeat the
    ISS-numbering collision docs/anti-patterns.md warns about.

# ---------------------------------------------------------------------------
# Did this branch's new alias step change Mix.Tasks.Letflow.Check.TestTest?
# ---------------------------------------------------------------------------

alias_step_analysis:
  question: >
    This branch prepends "letflow.check_toolchain" to the letflow.check alias. Did
    that change Mix.Tasks.Letflow.Check.TestTest's behaviour, or is its failure the
    same timeout as before?
  answer: "NO. The new step is not on that test's execution path at all. Answered from mix.exs and lib/mix/tasks/letflow.check.test.ex, not assumed."
  derivation:
    - "mix.exs defines TWO separate aliases. `test: [\"ecto.create --quiet\", \"ecto.migrate --quiet\", \"test\"]` is untouched by this branch (the diff on mix.exs adds only a comment block and the one line \"letflow.check_toolchain\" inside the OTHER alias)."
    - "lib/mix/tasks/letflow.check.test.ex:63 calls stream_and_capture(\"mix\", [\"test\"]) -- argument list [\"test\"], so the child resolves the `test` alias. It never invokes `letflow.check`, and that file is byte-identical to main on this branch."
    - "Confirmed against the live children: all three spawned command lines end in `mix test`, with no `letflow.check` anywhere. `grep -c 'letflow.check_toolchain' <run log>` = 0 -- the new task's name never appears in the suite's output, in a run where it would have printed had it executed."
  second_order_effect_considered_and_excluded: >
    The branch does enlarge the nested child's workload by 30 tests. That is a
    change of roughly ten seconds against a child suite that takes ~500 seconds
    versus a 60-second parent timeout -- it cannot convert a passing test into a
    timing-out one, and the timeout predates the branch (it is the failure mode
    ISS-0107 was filed on, on 2026-08-20, from a checkout without these commits).
    Failure 13's non-timeout shape is likewise explained by the child returning a
    real nonzero exit, which the 60s window happened to admit this time.
  conclusion: >
    Same pre-existing POSIX-only-fixture failure as before, expressing itself with
    a different per-test subset because of load. Not affected by the new alias step.

