    root_cause_rederived_from_source: >
      Read from test/mix/tasks/letflow_check_test_test.exs directly. install_fake_mix/2
      (lines 81-102) writes an EXTENSIONLESS file named `mix` containing `#!/bin/sh`
      and prepends its directory onto PATH with a ":" separator
      (`System.put_env("PATH", dir <> ":" <> ...)`). On Windows the PATH separator is
      ";", so that produces one malformed entry rather than a new first entry, and
      System.find_executable/1 will not resolve an extensionless file (PATHEXT wants
      .bat/.cmd/.exe). The fake is therefore never used and
      Mix.Tasks.Letflow.Check.Test.run/1 shells out to the REAL mix, recursing the
      suite into a full nested `mix test` that cannot finish inside ExUnit's 60s
      default. Failure 13 is the same cause showing its other face: the nested real
      run returned a genuine nonzero exit, and its message
      ("underlying `mix test` run exited 1") is proof on its own that the fake was
      not in the exec path.
