          alias, which nothing in this path invokes.
    orphaned_processes_finding:
      severity: "MAJOR -- already filed as ISS-0107, re-observed first-hand here"
      detail: |
        All three nested `mix test` children OUTLIVED the parent suite. After `mix test`
        had exited (exit code 2), PIDs 28220, 9356 and 31352 were still alive and still
