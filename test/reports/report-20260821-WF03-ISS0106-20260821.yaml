findings_for_orch:
  - severity: MINOR
    finding: >
      ISS-0107 is now self-reinforcing at the gate level, which its record does not
      yet say: `mix letflow.check` -> `letflow.check.test` -> a nested `mix test`
      whose Check.TestTest spawns yet another `mix test`. Until ISS-0107 is fixed,
      `mix letflow.check` cannot exit 0 on Windows regardless of code quality, and
      each invocation leaves three orphaned BEAMs on the host. Worth adding to
      ISS-0107 as an observation. Not filed as a new issue -- it is the same defect.
  - severity: MINOR
    finding: >
      SIX orphaned nested BEAMs were killed by this step as environment hygiene --
      three from the measured run (PIDs 28220, 9356, 31352, holding 65 letflow_test
      connections, dropping to 1 once killed) and three more from the gate run
      (PIDs 34288, 38716, 23920, holding 97 connections, again dropping to 1).
      Two invocations, six orphans, ~160 leaked connections: that rate is worth
      adding to ISS-0107 as measured impact. The host was left clean (zero erl.exe
      running, 1 connection). Four stale rows in
      public.iss060_tenant_schemas_guard_backup were deliberately LEFT so
      RELEASE-VALIDATOR can re-derive the IdentityMigrationTest attribution from the
      same evidence. If RELEASE-VALIDATOR's re-run shows those 10 failures again,
      that is expected and confirms this attribution rather than contradicting it.
  - severity: MINOR
    finding: >
      ISS-0109 covers the full-suite-only tenant-schema teardown race, but names only
      Letflow.Definitions.PromotionTest and
      Letflow.Definitions.PromotionAssertionRerunTest. This step observed the same
      race in two further modules: Letflow.Definitions.MigrationsTest
      (migrations_test.exs:662) and Letflow.Engine.PinRebindTest
      (pin_rebind_test.exs:351), both 3F000 invalid_schema_name inside
      TenantProvisioning.replay_migrations/1, both only in the contended run.
      ISS-0109's affected-module list should be extended rather than a fourth ID
      allocated for the same race. Not edited here -- ISS-0109 is not this step's
      artefact and a concurrent edit would risk the add/add collision class
      docs/anti-patterns.md records.

