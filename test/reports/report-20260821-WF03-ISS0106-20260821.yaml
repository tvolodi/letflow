          select count(*) from pg_stat_activity where datname='letflow_test';  -->  65
        After `Stop-Process -Id 28220,9356,31352 -Force`:
          select count(*) from pg_stat_activity where datname='letflow_test';  -->   1
        This is the mechanism behind this suite's documented load-dependence: every run
        of this module leaves long-lived BEAMs hammering the shared test database, which
        is what makes the environmental failure set vary run to run rather than being a
