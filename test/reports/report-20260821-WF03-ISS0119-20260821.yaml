causal_analysis:
  question: "Is there any mechanism by which this branch could produce B1 or B2?"
  change_surface:
    method: "git diff --name-status be74d62..HEAD, then narrowed to compiled paths"
    production_code_changed: >
      NONE. `git diff --stat be74d62..HEAD -- lib/ priv/ config/ mix.exs` returns exactly one path
      and it is a markdown design document: lib/letflow/design/iss-0119-status-file-readability.md.
      No .ex file under lib/, no migration under priv/repo/migrations/, no config, no mix.exs change.
    compiled_code_added_by_the_branch:
      - "test/support/status_history.ex (new, 522 lines -- compiled in MIX_ENV=test)"
      - "test/docs/requirement_status_invariants_test.exs (new, 739 lines, 13 tests, async: true)"
    data_files_added_or_changed:
      - "docs/status/requirement_status.index.yaml (new)"
      - "docs/status/requirement_status.v2.yaml (new)"
      - "docs/status/requirement_status.yaml (modified)"
    everything_else: >
      handoff JSONs, .claude/agents/*.md, docs/agents/*.md, docs/anti-patterns.md,
      test/specs/ISS-0119.md, handoffs/registry.json -- none compiled, none read by any test.
  the_decisive_check: >
    REVIEWER's Step 3d proof (zero compiled code changed, therefore no causal path) has expired and is
    NOT relied on here. It is replaced with a narrower proof re-derived from the two new files' own
    content. The ISS-0109/ISS-0116 family is entirely DATABASE-MEDIATED: every member is a tenant
    schema, a table inside one, or a tenant_schemas registration row being absent at query time. So the
    question reduces to whether the branch's new compiled code touches that machinery at all.
    IT DOES NOT. `grep -nE 'Repo|Ecto|Postgrex|Sandbox|tenant|prefix:|SQL'` over
    test/support/status_history.ex returns ZERO matches. The same grep over
    test/docs/requirement_status_invariants_test.exs returns ZERO matches -- it does not even
    `use Letflow.DataCase`; it is `use ExUnit.Case, async: true`. Both files are pure filesystem/YAML
    readers over docs/status/. Neither opens a database connection, checks out a sandbox connection,
    provisions a tenant, or issues any SQL.
    Reach is likewise bounded: `grep -rln 'StatusHistory|status_history'` over test/ and lib/ returns
    the new support module, the new test module, and two markdown files -- and nothing else. No
    pre-existing test module references the new code. The changed docs/status/*.yaml data files are read
    by those same two new files and by nothing else in the suite.
    Neither Letflow.Identity.RoleRegistryTest (B1) nor Letflow.Definitions.PromotionAssertionRerunTest
    (B2) references the new module, and both talk to Postgres through code paths byte-identical to main.
  the_one_non_zero_path_stated_honestly: >
    There is exactly one channel that is not literally zero, and it is stated rather than dismissed: the
    13 new tests run `async: true`, so they add marginal scheduler and BEAM-process load to a suite whose
    failure family is timing-sensitive. That is a LOAD path, not a code path -- it cannot introduce a new
    failure MODE, only in principle perturb the odds of an existing race. Two pieces of evidence bound it.
    First, measured async time did not rise on the branch: 6.0s and 5.7s async on branch1/branch2 versus
    6.6s and 6.5s on main1/main2 -- the branch side is LOWER on both runs, and the 13 added tests are pure
    file I/O with no DB connection to contend for. Second, `too_many_connections` is 0 in all four logs,
    so the pool was not near saturation in any run. There is no evidence this channel was active, and it
    cannot be excluded absolutely from four runs; see limits_of_this_evidence.
  symmetry_evidence: >
    The strongest single argument is the shape of the data rather than any one failure. Across two runs
    per side, EACH side produced exactly TWO singleton extras beyond the shared 12-13 core, and on each
    side neither singleton reproduced in that side's own second run. Branch: B1 in run 1, B2 in run 2.
    Main: M1 and M2, both in run 1, neither in run 2. All four sit in the same tenant-schema-provisioning
    family, and three of the four (B2, M1, M2) are four-axis matches to the ISS-0109/ISS-0116 signature
    while the fourth (B1) is a partial match on the same assertion. Same count, same character, same
    family, both sides. That is the signature of a shared environmental condition sampled twice per side,
    not of a branch introducing something.

verdict:
  central_question: "Does this branch add any failure that main does not already have?"
  answer: "NO"
  confidence: "HIGH for the reproducible failure set; MODERATE for the singleton tail -- stated explicitly under limits_of_this_evidence"
  evidence_summary: >
    The reproducible failure set is IDENTICAL on both sides: the same 12 failures in all four runs
    (10 Letflow.IdentityMigrationTest, 2 Mix.Tasks.Letflow.Check.TestTest), plus a 13th
    Check.TestTest timeout present in 3 of 4 runs -- and that 13th appears on main TWICE and on the
    branch ONCE, i.e. the branch ran FEWER of it, not more. No failure that repeats is branch-only.
    The two branch-only singletons are each single observations that did not reproduce in the
    branch's own second run. B2 is a four-axis match to ISS-0109's own enumerated failure 14 -- same
    module ISS-0109 is filed about, same promotion_assertion_runs table, same 42P01, same
    transaction_failed wrapper. B1 is a partial match, deliberately NOT attributed to the class, and
    forwarded as a new variant. Main produced its own two singletons of the same family in the same
    way. And the branch has no mechanism: its entire new compiled surface -- two files -- contains
    zero references to Repo, Ecto, Postgrex, Sandbox, tenant, prefix: or SQL, is referenced by no
    pre-existing test module, and the failure family is exclusively database-mediated.
  merge_recommendation: >
    NOT BLOCKED by this step. No branch-only failure survives as a repeated observation, none has a
    causal path from the branch, and the 13 new invariant assertions pass 13/13 in full-suite
    concurrent context in both branch runs. The pipeline is red on both sides for the same
    pre-existing reasons and this branch does not make it redder.
  what_this_step_does_NOT_claim: >
    It does not claim the suite is green -- it is red, on both sides, exit 1 in all four runs. It does
    not claim ISS-0109/ISS-0116 is fixed; ISS-0109 remains `instrumented` and ISS-0116 open, and this
    evidence set adds four more observations of that family in four new modules. It does not claim
    B1 belongs to that class -- B1 is a variant with a stated gap.

limits_of_this_evidence:
  - "Two runs per side. A singleton observed once cannot be classified as 'stable' or 'flaky' on that basis; B1, B2, M1 and M2 are each recorded as OBSERVED ONCE, NOT REPRODUCED IN THAT SIDE'S SECOND RUN, which is a statement of observation and not a flakiness verdict. In particular M1 and M2 are main-only on ONE observation each and this report does not call them stable main failures."
  - "This step ran nothing. Every figure is read from a prior attempt's logs. The runs were not re-executed and the analysis could not probe anything the logs do not already contain -- for example no fresh isolation run of role_registry_test.exs was possible to see whether B1 reproduces alone."
  - "The four runs were sequential, not interleaved, over 08:06-08:41Z: branch1, main1, branch2, main2. Ordering is alternated, which is good practice and limits monotonic drift, but a slow environmental trend across the 35-minute window would still not be fully controlled."
  - "Seeds differ across all four runs (926440 / 122451 / 478380 / 67556), so test ORDER differs in every run. This cuts both ways: it means the shared 12-failure core is robust to ordering, and it also means the singleton tail is partly a function of which orderings were sampled."
  - "The async-load channel described in causal_analysis cannot be excluded absolutely from four runs, only bounded by the measured async times and the zero connection saturation."

