# ---------------------------------------------------------------------------
# Per-failure attribution -- re-derived, not inherited
# ---------------------------------------------------------------------------

attribution_method: >
  Per core-directives.md's "Failure Attribution Is Structural, Never By
  Count-Matching". Both failures are ONE group (same file, same root cause),
  attributed via Route 1 (structurally absent from this branch's diff -- the
  failing file is not test/letflow/identity_migration_test.exs, the one file
  this branch changes) AND Route 3 (a demonstrated, previously-documented
  mechanism, re-confirmed live on this host during this step rather than only
  cited from a prior report).

failures:
  - group: Mix.Tasks.Letflow.Check.TestTest
    count: 2
    file: test/mix/tasks/letflow_check_test_test.exs
    failing_tests:
      - line: 105
        name: "detects a recurrence of ISS-0069's own warning class raises and reports the offending line when the target substring is present, even though the underlying subprocess exited 0"
        symptom: "** (ExUnit.TimeoutError) test timed out after 60000ms, stuck inside Mix.Tasks.Letflow.Check.Test.collect/2"
      - line: 126
        name: "detects a recurrence of ISS-0069's own warning class passes (no raise) when the subprocess exits 0 and the target substring is absent, even with unrelated warnings present"
        symptom: "** (Mix.Error) mix letflow.check.test: FAILED -- underlying `mix test` run exited 1 (real test failure/error)."
    determination: "PRE-EXISTING, POSIX-only test fixture failing on Windows. NOT caused by this branch, and NOT in the module this branch changed. Covered by ISS-0107 (open, MAJOR, filed 2026-08-20)."
    evidence:
      - method: "Route 1 -- structural, branch diff"
        detail: >
          Neither test/mix/tasks/letflow_check_test_test.exs nor
          lib/mix/tasks/letflow.check.test.ex appears in `git diff --name-only
          main...feature/WF03-ISS0179-20260821` (the 7-path list above, which
          contains only handoffs, one design doc, and
          test/letflow/identity_migration_test.exs). Both files are
          byte-identical to main on this branch.
      - method: "matches ISS-0107's own filed description exactly, same host class"
        detail: >
          docs/issues/ISS-0107.yaml (status: open, MAJOR) names this exact
          file, describes install_fake_mix/2 writing an extensionless
          `#!/bin/sh` file named `mix` and prepending its dir onto PATH with
          ":" -- both POSIX-only mechanisms (Windows uses ";" as the PATH
          separator, and System.find_executable/1 will not resolve an
          extensionless file without a PATHEXT-registered extension) -- so
          Mix.Tasks.Letflow.Check.Test.run/1 shells out to the REAL mix
          instead of the fixture's fake, recursing the suite into a nested
          `mix test`. The exact symptom pair filed there (a 60000ms
          ExUnit.TimeoutError at collect/2, plus a second test getting the
          real subprocess's "exited 1" Mix.Error instead of the expected
          substring-match message) is exactly what this run reproduced,
          same two test names, same line numbers.
      - method: "Route 3 -- orphaned-process mechanism directly observed on this host during this step"
        detail: >
          After the parallel run completed, `tasklist /FI "IMAGENAME eq
          erl.exe"` on this host showed one still-running erl.exe (PID
          14552). `Get-CimInstance Win32_Process -Filter "ProcessId=14552"`
          showed its command line as `erl.exe -noshell ... -extra
          "...\mix" test` -- i.e. exactly the orphaned nested `mix test`
          child ISS-0107 documents (the outer ExUnit test's 60000ms timeout
          fires but does not kill the Port-spawned subprocess). Killed via
          `Stop-Process -Id 14552 -Force`; confirmed gone afterward
          (Get-Process for that PID returned nothing). This directly
          reproduces ISS-0107's documented mechanism on this host during
          this run, rather than only citing its record.
    action: "FORWARDED (already open as ISS-0107, no new issue filed). No test edited, no application code touched. Orphaned process cleaned up as environment hygiene."

