failures:
  - group: Mix.Tasks.Letflow.Check.TestTest
    count: 2
    file: test/mix/tasks/letflow_check_test_test.exs
    failing_tests:
      - line: 126
        name: "detects a recurrence of ISS-0069's own warning class passes (no raise) when the subprocess exits 0 and the target substring is absent, even with unrelated warnings present"
        symptom: "** (Mix.Error) mix letflow.check.test: FAILED -- underlying `mix test` run exited 1 (real test failure/error)."
      - line: 105
        name: "detects a recurrence of ISS-0069's own warning class raises and reports the offending line when the target substring is present, even though the underlying subprocess exited 0"
        symptom: |
          Wrong message for Mix.Error
          expected: ~r/default\ values\ for\ the\ optional\ arguments/
          actual:   "mix letflow.check.test: FAILED -- underlying `mix test` run exited 1 (real test failure/error)."
    determination: "PRE-EXISTING, POSIX-only test fixture failing on Windows. NOT caused by this branch. Covered by ISS-0107 (open, MAJOR, filed 2026-08-20)."
    evidence:
      - method: "Route 1 -- structural, branch diff"
        detail: >
          Neither test/mix/tasks/letflow_check_test_test.exs nor
          lib/mix/tasks/letflow.check.test.ex appears in
          `git diff --name-only main...feature/WF03-ISS0193-20260821` (the
          3-file list above). Both are byte-identical to main on this branch.
      - method: "Route 3 -- demonstrated mechanism, measured live on this host in this step"
        detail: >
          Re-ran test/mix/tasks/letflow_check_test_test.exs in isolation
          (`mix test test/mix/tasks/letflow_check_test_test.exs`) to check
          reproducibility outside the parallel run: 1/3 passed, 2 failed --
          same two tests, same symptoms. install_fake_mix/2 (that file's own
          helper) writes an extensionless POSIX `#!/bin/sh` file named `mix`
          and prepends its dir onto PATH with ":" -- both POSIX-only
          mechanisms (Windows uses ";" as the PATH separator and won't
          resolve an extensionless executable via PATHEXT), so
          `Mix.Tasks.Letflow.Check.Test.run/1` shells out to the REAL mix
          instead of the fixture's fake, recursing the suite. Measured
          directly: `Get-CimInstance Win32_Process -Filter "Name='erl.exe'"`
          during and after this isolated run showed real nested `erl.exe ...
          mix test` children (PIDs 28296, 40396, 30324) that outlived the
          parent test and kept running after it exited -- exactly ISS-0107's
          documented mechanism, reproduced here rather than cited from its
          record. `docker exec letflow-postgres-1 psql ... pg_stat_activity`
          went from 6 to "too many clients already" while these orphans were
          alive, and back to 6 immediately after `Stop-Process -Force` on
          all three PIDs.
      - method: "matches ISS-0107's own filed description exactly"
        detail: >
          docs/issues/ISS-0107.yaml's description names this exact file,
          this exact PATH/extensionless mechanism, and this exact pair of
          symptom shapes (timeout / "exited 1" message mismatch), discovered
          2026-08-20 on a Windows host -- independent of and prior to this
          branch's first commit (c756b82, 2026-08-21).
    orphaned_processes_finding: >
      MAJOR, already filed as ISS-0107, re-observed and cleaned up as
      environment hygiene during this step (not this branch's product): the
      three nested `mix test` children spawned by this step's own isolated
      re-run of the fixture outlived it and held enough connections to push
      pg_stat_activity into "too many clients already" again. Killed via
      Stop-Process; confirmed pg_stat_activity back to 6 afterward. Host left
      clean: `tasklist | grep erl` empty, `pg_stat_activity` = 6 at the end
      of this step.
    action: "FORWARDED (already open as ISS-0107). No test edited, no application code touched."

