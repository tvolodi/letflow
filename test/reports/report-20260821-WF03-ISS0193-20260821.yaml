  pool_saturation_encountered: >
    YES, twice, both TRANSIENT and both recovered from -- see runs below. The
    default N=16 (from nproc on this 16-core host) launches 16 partitions, each
    an independent BEAM with pool_size = System.schedulers_online()*2 = 32
    (config/test.exs:25), so 16 simultaneous `ecto.create`/`ecto.migrate` bursts
    against a 100-connection Postgres (`show max_connections` = 100) collided.
    Confirmed via `docker exec letflow-postgres-1 psql -U letflow -d letflow_dev
    -c 'select count(*) from pg_stat_activity'` (6, quiet, both before and after)
    and by reading partition logs showing
    "FATAL 53300 (too_many_connections) sorry, too many clients already" during
    `mix ecto.create`, not during test execution -- i.e. a startup burst, not a
    leak from this branch's code. Not this branch's defect: N=16 vs
    max_connections=100 is a structural property of this host's core count and
    the project's own pool_size formula, unrelated to anything in the diff.
  recovery_action: >
    Per the handoff's explicit guidance (retry once after a short wait,
    never spin up a second Postgres container), retried at default N=16 once
    (still saturated -- 6/16 partitions crashed with no Result: line both times),
    then used the script's own documented TEST_PARALLEL_N override
    (scripts/test_parallel.sh's own "Overridable knob") to drop to N=4, which
    completed cleanly with zero crashed partitions. This is the standard
    mechanism with a smaller partition count, not an equivalent invocation of
    a different tool.

