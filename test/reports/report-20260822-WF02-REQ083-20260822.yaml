failure_1:
  test: >
    Letflow.EngineConcurrencyTest "AC1 -- 100 concurrent task completions across 100
    distinct instances every completion succeeds, no cross-instance corruption, no
    global serialization" (test/letflow/engine_concurrency_test.exs:266, assertion at
    :306)
  partition: 4
  error: >
    Assertion with < failed
    code:  assert concurrent_micros < baseline_micros * 30
    left:  1103564
    right: 973800
  nature: >
    A wall-clock timing assertion (deliberately loose 30x multiplier per the test's own
    comment, "catches only gross regressions like an accidentally-reintroduced global
    mutex/singleton serializer") comparing measured microseconds for 100 concurrent
    Task.async completions against a single-instance baseline x30. Not a correctness
    assertion -- both the baseline call and the concurrent batch completed successfully
    (all {:ok, %{instance_status: :completed}} assertions above it passed); only the
    timing ratio tripped.
  attribution: >
    ROUTE 1 (structural -- branch cannot have caused it). git diff --name-only
    origin/main...HEAD (full list reproduced below) does not include
    test/letflow/engine_concurrency_test.exs, lib/letflow/engine.ex, or any module the
    test exercises (Letflow.Engine, Letflow.InstanceProjection). The one lib/ file this
    branch DOES touch that is anywhere near "task" naming -- lib/letflow/tasks.ex -- was
    checked directly: `grep -rn "Letflow.Tasks" lib/letflow/engine.ex` returns no match,
    so Engine.complete_task/3 (what this test calls) does not call through the changed
    module at all. No causal path from this branch's diff to this failure exists.
    Additionally, and consistent with route 1 rather than substituting for it: this is a
    wall-clock-sensitive assertion running as one of 16 concurrent `mix test --partitions`
    processes sharing one Postgres instance and this host's CPU -- exactly the load
    profile scripts/test_parallel.sh's own header comments (ISS-0219, ISS-0222) already
    document as a source of timing variance on this host, though that is offered as
    plausible mechanism, not as the attribution itself; the diff-absence check above is
    what actually clears it.
  existing_issue_record: >
    Searched docs/issues/*.yaml for "EngineConcurrencyTest", "engine_concurrency_test",
    "concurrent_micros", "baseline_micros" -- five files reference
    Letflow.EngineConcurrencyTest (ISS-0073, ISS-0078, ISS-0110, ISS-0112, ISS-0114), but
    all five describe a DIFFERENT failure signature: a 42P01 undefined_table /
    tenant-schema-provisioning race (ISS-0109/ISS-0110/ISS-0114 family) or the
    copy-pasted-fixture consolidation tracked by ISS-0112. None mention a timing/
    concurrent_micros assertion failure. NO EXISTING ISSUE RECORD COVERS THIS FAILURE --
    reported here for ORCH to file per ISSUE_QUEUE.md; TEST-RUNNER does not call the
    queue or gh directly.
  disposition: >
    Filed for tracking, not fixed on this branch (Unblock-Everything's scope boundary:
    structurally cleared as unrelated, so it is reported and forwarded, not a blocker
    for REQ-083's own acceptance criteria).

