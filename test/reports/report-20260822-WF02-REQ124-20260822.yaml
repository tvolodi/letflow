failures:
  - id: "identity_test.exs:807 (partition 4)"
    test: >
      "get_tenant_by_slug/1 itself (unwrapped) DOES raise for the same bad input --
      proves the rescue in safe_get_tenant_by_slug/2 is load-bearing, not a no-op"
      (Letflow.IdentityTest)
    location: test/letflow/identity_test.exs:807-811
    error: >
      Expected exception Ecto.QueryError but got Ecto.Query.CastError
      (deps/ecto/lib/ecto/repo/queryable.ex:504: value `12345` in `where` cannot
      be cast to type :string in query: from t0 in Letflow.Identity.Tenant,
      where: t0.slug == ^12345, select: t0)
      code: assert_raise Ecto.QueryError, fn -> Identity.get_tenant_by_slug(12_345) end
    diff_scope: >
      test/letflow/identity_test.exs is one of this branch's own artifacts_in
      (TEST-DESIGNER's new file for REQ-124 AC5) -- directly in scope, not
      pre-existing.
    root_cause: >
      The test's own comment (lines 792-802) claims the exception type was
      "confirmed against this project's vendored Ecto dependency" as
      Ecto.QueryError, but the actual vendored Ecto (ecto 3.14.1, per this
      run's stacktrace) raises Ecto.Query.CastError for a non-string value
      compared against a :string-typed column -- a different, more specific
      exception module than the one hardcoded in the `assert_raise` pin. The
      companion wrapped-call test (line 803-804, `safe_get_tenant_by_slug(12_345, ...)`)
      passes, because `safe_get_tenant_by_slug/2`'s `rescue _exception ->` clause
      is a bare rescue that catches any exception class -- so REQ-124 AC5's
      actual behavior (the wrapper swallows the raise into
      `{:error, :lookup_failed}`) is NOT broken. Only this one pinning
      assertion, which names the wrong specific exception module for the
      *unwrapped* call, is wrong.
      verdict: BRANCH-OWNED, real failure -- test-code defect, not an app-code
      bug. `Identity.safe_get_tenant_by_slug/2`'s rescue behavior is correct as
      implemented; the test's exception-class assumption is stale/wrong.
    attribution_form: "in-diff, root-caused directly (test asserts wrong exception module against the real, current Ecto version)"
    disposition: "REWORK -- route to TEST-DESIGNER to correct the asserted exception type (Ecto.Query.CastError, or assert on a shared ancestor / just `assert_raise` without a specific module) in test/letflow/identity_test.exs:808."

  - id: "lint_handoffs_test.exs x3 (partition 1: F-H6-CONTENT-NEVER-READ, F-H6-FIRES-NEW; T-NEW-AFTER-FLOOR-HARD-FAILS)"
    test: >
      Mix.Tasks.Letflow.LintHandoffsTest -- "lint_file/2 -- H6 fires on the
      non-JSON fixture (un-grandfathered)" (2 tests) and "pre_floor_file?/2 --
      commit-boundary ancestry, real repo history" (1 test)
    location: test/mix/tasks/letflow.lint_handoffs_test.exs:106, :127, :297
    error: >
      All three: `assert [violation] = result.hard_new` (or `[%{rule: "H6"}]`),
      `left: [violation]`, `right: []` -- the fixture file
      (test/fixtures/lint_handoffs/h6/step-01-fixture-non-json.md) is being
      classified as hard_grandfathered instead of hard_new.
    diff_scope: >
      Neither this test file nor its module under test
      (lib/mix/tasks/letflow.lint_handoffs.ex) appears in
      `git diff --name-only main...HEAD` for this branch -- confirmed: this
      branch's diff is docs/requirements.yaml, docs/status/*, handoffs/WF02-REQ124-*,
      lib/letflow/design/req124-mobile-tenant-config.md, lib/letflow/identity.ex,
      lib/letflow/router.ex, lib/letflow/routers/mobile_tenant_config.ex,
      lib/letflow/routers/tenant_config.ex, test/letflow/identity_test.exs,
      test/letflow/routers/mobile_tenant_config_test.exs, test/specs/REQ-124.md.
    merge_base_repro: >
      Reproduced identically at merge-base (git merge-base main HEAD =
      e5cce4794524401e77e7993a2cd3027c03feb8d1) via a throwaway `git worktree add`
      (deps/build isolated via MIX_DEPS_PATH pointed at the main checkout's
      deps/, MIX_BUILD_PATH pointed at a scratch _build dir so the shared cache
      was untouched) -> `mix test test/mix/tasks/letflow.lint_handoffs_test.exs`
      gave "Result: 17/20 passed", "Failed: 3 tests" -- same 3 tests, same
      assertion shapes (`left: [violation]`/`right: []`), same line numbers.
      Worktree removed via `git worktree remove --force` immediately after;
      `git worktree list` afterward shows only the main checkout.
    root_cause_diagnosed: >
      `lib/mix/tasks/letflow.lint_handoffs.ex`'s `@h6_floor_commit "BOOTSTRAP"`
      (line 133) resolves dynamically via `git merge-base HEAD origin/main`
      (`resolve_h6_floor_commit/0`, line ~197) every time the task or its tests
      run, per its own moduledoc comment: "Step Final has not yet run on this
      branch, so the real pre-merge origin/main tip is not yet known... MUST
      edit this literal... each attempt, until one succeeds." Because the fixture
      file (test/fixtures/lint_handoffs/h6/step-01-fixture-non-json.md) is a
      real, already-committed file in this repo's history (per its own
      moduledoc: "a permanent, committed... fixture"), as `origin/main` advances
      past the fixture's own commit, the dynamically-resolved floor moves later
      than the fixture's first-appearance commit -- so `pre_floor_file?/2` now
      classifies it as pre-floor (grandfathered) instead of new, inverting the
      test's premise that this fixture proves the "un-grandfathered" case. This
      is a time/git-state-dependent defect in ISS-0262's own floor-commit
      mechanism (status: resolved, resolved_at 2026-08-22T08:30:00Z) that has
      regressed since resolution as `main` advanced -- unrelated to REQ-124.
    attribution_form: "not in diff (a), AND reproduced identically at merge-base (b)"
    existing_issue_check: >
      Searched docs/issues/*.yaml for H6/lint_handoffs/hard_new/floor_commit/
      pre_floor_file? -- ISS-0262 (the original H6 feature, status: resolved)
      and ISS-0266 (a different lint_handoffs-adjacent test,
      status: no_defect/superseded_by ISS-0264) both exist but neither
      describes this specific symptom (floor-commit dynamic resolution making
      the fixture itself go stale). No existing issue record found for this.
    disposition: "REPORT FOR FILING -- new finding, not folded into ISS-0262 or ISS-0266. ORCH to file via ISSUE_QUEUE.md; not fixed here (pre-existing, out of REQ-124's scope, and TEST-RUNNER does not own lib/mix/tasks/letflow.lint_handoffs.ex)."

