# ---------------------------------------------------------------------------
# The failed-then-clean scoped run -- deliberately kept in the record
# ---------------------------------------------------------------------------

failed_then_clean_scoped_run:
  why_recorded: >
    The first scoped-pair attempt FAILED. It is recorded here in full rather than being
    replaced by the clean re-run, because the failure mode is a property of this shared
    host that a later reader is more likely to need than the clean line itself.
  first_attempt_result: >
    Finished in 37.4 seconds (0.00s async, 37.4s sync)
    Result: 19/21 passed
    Failed: 2 tests
  first_attempt_exit_code: 2
  failing_tests:
    - "RT-7: a DB-free claim(0) is answered immediately while a provisioning is running (test/letflow/sandbox_pool_test.exs:1035, asserting at :892)"
    - "RT-3 (death path a): a caller that dies while parked in `waiting` leaks no slot and no schema"
  attribution: >
    NOT ISS-0227. Concurrent foreign `mix test` invocation on the shared 5472 database,
    which tripped the ISS-0110 TenantSchemaReaper deferral. Four independent pieces of
    evidence, checked rather than assumed:
  evidence:
    shape_of_the_assertion: >
      Both failures are the same assertion, `assert sandbox_schema_names() == baseline`
      -- a GLOBAL query over every sandbox_% schema in the database, not one scoped to
      the pool under test. Any third party creating or dropping a sandbox schema in the
      same database moves it.
    concurrent_invocation_observed: >
      pg_stat_activity at the time showed application_name letflow_mixtest_27924 holding
      32 connections, backend_start 2026-08-22T04:57:06Z; OS process erl.exe pid 27924,
      started 09:57 local, actively consuming CPU. A live foreign run, not an orphan.
    reaper_deferral_logged_verbatim: >
      "TenantSchemaReaper.sweep_orphans/2: deferring this sweep entirely -- another mix
      test invocation (application_name != letflow_mixtest_20168) is currently
      connected to this database, and this module tracks no per-row ownership, so an
      age-based reap right now could reclaim that invocation's still-live tenant schema
      (ISS-0110). Retrying on the next boundary sweep." The guard explicitly declined to
      clean up, which is exactly the designed ISS-0110 behaviour.
    mapset_diff: >
      I diffed the two MapSets in each failure rather than eyeballing them. RT-7:
      baseline 33 schemas, after-state 34 -- exactly one schema APPEARED
      (sandbox_4d824c6daca5473db6a3c4661cfc4d58) that the test never provisioned. RT-3:
      baseline 35, after-state 34 -- exactly one schema VANISHED
      (sandbox_3655711709bd451d848f44e1e30095db) that the test never released. Drift of
      +1 and -1 in OPPOSITE directions across two tests is the signature of a concurrent
      third party creating and dropping schemas mid-assertion; it is not the signature of
      a leak. Note also that the baselines are 33-35 rather than near-zero: the database
      was already carrying a backlog of un-reaped orphans precisely because the reaper had
      been deferring.
    shape_a_real_regression_would_have: >
      ISS-0227 removed only write-only in-memory bookkeeping (owner_pid from the provision
      op, schema_name from the in_flight record) plus the callerless op_schema_name/1. A
      genuine leak from that would show the pool's OWN schemas persisting after release --
      appearing and never vanishing -- and would be deterministic, not +/-1 noise in
      opposite directions.
  decisive_control: >
    I polled pg_stat_activity until it reported 0 'letflow_mixtest%' connections, then
    re-ran the IDENTICAL command alone: `Result: 21 passed`, exit 0. Reproducibly clean
    once the interference is removed. This matches TEST-DESIGN-VALIDATOR's prior finding
    on the same class of noise earlier in this run.
  corroborating: >
    Arguably stronger than the control re-run: the full-suite run above already exercised
    the whole of sandbox_pool_test.exs, RT-7 and RT-3 included, at 0 failures -- and it
    ran inside a window I had waited for in which no foreign mix test was connected.
  lesson_for_later_readers: >
    On this host, check pg_stat_activity for 'letflow_mixtest%' connections BEFORE
    trusting any sandbox_pool_test.exs leak-detection failure. The leak assertions are
    global-scope and are not isolated from a sibling agent's run on the same database.

