# Merge-gate checks (mix.exs letflow.check step 3; docs/agents/protocols/GIT_MERGE.md:166)
# ---------------------------------------------------------------------------

compile_check:
  command_1: "mix compile --warnings-as-errors"
  exit_code_1: 0
  command_2: "mix compile --force --warnings-as-errors"
  exit_code_2: 0
  output_2: >
    Compiling 104 files (.ex)
    Generated letflow app
  why_two_runs: >
    A plain `mix compile` on an already-built tree can be a silent no-op, in which case
    exit 0 would prove nothing about warnings. The --force run recompiled the entire
    lib/ tree (104 files) from scratch and still exited 0 with no warning output, so the
    zero-warning result is genuine rather than an up-to-date short-circuit. Both exit
    codes were read from $? on unpiped invocations, not inferred from absent output.

format_check:
  command: "mix format --check-formatted"
  exit_code: 0
  output: "(none)"
  exit_code_measured_directly: true

