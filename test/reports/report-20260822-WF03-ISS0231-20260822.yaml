  The change under test is correct and proven in the real alias. The new step runs at
  position 2, prints the expected "115 entries = 115 registered + 0 deferred + 0 neither
  + 0 unclassified", exits 0, and lets the alias continue -- identically across 3
  independent runs. Its 29-test suite passes. Run 2, with a quiet database, put the
