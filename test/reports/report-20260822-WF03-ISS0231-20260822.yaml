      - "test/letflow/engine/sub_process_test.exs:44:8 (Letflow.Engine.SubProcessTest) -- defp entry(name, opts \\\\ [])"
    attribution_evidence: >
      Both emitting files, and the detecting task lib/mix/tasks/letflow.check.test.ex,
      are byte-identical to base c84c27a -- `git diff --name-only c84c27a...HEAD --
      test/letflow/` returns empty, and letflow.check.test.ex is absent from the diff.
