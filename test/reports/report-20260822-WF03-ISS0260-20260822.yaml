summary: >
  Combined 16-way run: 1690 tests, 5 properties, 2 failures (1693/1695 passed),
  exit 1. One failure (RequirementStatusInvariantsTest A3 / ISS-0119) is
  pre-existing and structurally unrelated to this branch's diff. The other --
  the AC1 test itself, in the file this branch's diff most directly touches --
  is a real, reproduced regression caused by this branch's own new
  ac1_timing_multiplier/0 unit tests: their on_exit hook unconditionally deletes
  TEST_PARALLEL_GROUP, which under real seed-randomized ExUnit ordering can wipe
  out the partition-wide env var test_parallel.sh depends on before the real AC1
  test runs, silently downgrading it to the 30x fallback multiplier and
  reintroducing the exact flake ISS-0260 was supposed to fix. This branch is not
  safe to merge as-is. AC1 itself did NOT reliably run under the intended 60x
  parallel multiplier in this run -- it is confirmed to have run (and failed)
  under the 30x default multiplier despite TEST_PARALLEL_GROUP being genuinely
  set for the whole partition process.
