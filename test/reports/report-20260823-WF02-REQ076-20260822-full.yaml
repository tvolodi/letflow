failure_attribution:
  method: >
    Per core-directives.md "Failure Attribution Is Structural, Never By Count-Matching."
    Re-derived fresh per this dispatch's explicit instruction, not assumed to still
    hold from the prior (8-criteria) run two runs ago.
  route_1_structural: >
    Neither test/support/tenant_schema_reaper_test.exs nor
    test/letflow/engine_concurrency_test.exs appears in `git diff --name-only
    main...HEAD` for this branch (checked directly, empty grep match) -- this branch
    cannot have caused either file's failures by editing them, and neither test
    exercises identity/onboarding/auth-token code paths (the actual AC9/AC10 diff
    surface).
  route_3_measured_mechanism: >
    All 5 failures carry direct, quoted evidence of Postgres connection-pool
    exhaustion, not assertion-logic failures: two explicit `FATAL 53300
    (too_many_connections)` errors, two `DBConnection.ConnectionError ... connection
    not available and request was dropped from queue` timeouts, and one timing-ratio
    assertion (EngineConcurrencyTest AC1) whose own failure message names contention
    explicitly and had already been widened for exactly this scenario
    (TEST_PARALLEL_GROUP-aware multiplier) before being exceeded. This is a measured
    mechanism (actual Postgres/pool error text and timing numbers), not an assumption
    that one exists.
  conclusion: >
    All 5 failures are attributed pre-existing/environmental (connection-pool
    pressure under 4-partition concurrent load), not caused by this run's own
    AC9/AC10 implementation. None of the identity/onboarding/api-token/authorization
    test files (the actual new/changed test surface for this branch) failed --
    partitions 1 and 4, which carried the bulk of that new coverage, both passed
    clean (0 failures).
  new_finding_for_orch: >
    This is a DIFFERENT failure mode from ISS-0219 (which was start-of-run
    auto-derived-N crashing all partitions before any Result: line, resolved by
    documenting TEST_PARALLEL_N=4). This run used TEST_PARALLEL_N=4 as documented and
    still hit mid-run connection-pool exhaustion during two specific
    connection-heavy tests (TenantSchemaReaperTest's own reap logic, and
    EngineConcurrencyTest's 100-concurrent-instance load). Reporting this to ORCH as a
    new finding for registration (per ISSUE_QUEUE.md / "No Issue Left Local-Only") --
    not filed directly by this agent. Suggest ORCH register: "TEST_POOL_SIZE=22 x 4
    partitions can still exhaust Postgres max_connections=100 mid-run under
    connection-heavy tests (TenantSchemaReaperTest, EngineConcurrencyTest), even with
    the documented TEST_PARALLEL_N=4 remedy in place -- distinct mechanism from
    ISS-0219's start-of-run crash."

