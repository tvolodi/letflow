failures:
  - id: "requirement_status_invariants_test.exs:464 (partition 1)"
    test: >
      "A9: every indexed volume's declared entries: count equals what is
      actually on disk" (Letflow.Docs.RequirementStatusInvariantsTest)
    location: test/docs/requirement_status_invariants_test.exs:464
    error: >
      mismatches: [{"docs/status/requirement_status.v3.yaml", 33, 34}]
      (declared entries: 33 in docs/status/requirement_status.index.yaml,
      34 actual `- req:` entries on disk in
      docs/status/requirement_status.v3.yaml).
    diff_scope: >
      docs/status/requirement_status.v3.yaml IS in this branch's own working-
      tree diff (git diff --name-only main shows it modified) -- so per the
      task's instruction this could NOT be waved through as "not in the diff"
      (a) without checking further, and was not accepted on the prior
      "pre-existing" claim's say-so.
    root_cause_diagnosed: >
      `git diff main -- docs/status/requirement_status.v3.yaml` shows exactly
      one hunk: ORCH's own WF-02 Step 00 append of the REQ-076 `started` event
      (at: 2026-08-22T18:40:59Z), whose own note text says "34 on-disk
      `- req:` entries in requirement_status.v3.yaml after this append
      (recounted via grep -c ...)". docs/status/requirement_status.index.yaml
      (the file that declares the `entries:` count A9 checks against) is
      UNTOUCHED by this branch (`git status --short` shows no modification to
      it; it still declares `entries: 33` for volume 3, last recounted by a
      prior, unrelated run). So this branch's own Step 00 append is the
      direct cause of the 33-vs-34 drift: it added the 34th on-disk entry to
      v3.yaml without a companion increment to the index's declared count,
      which every prior entry in the index's own `note:` history shows is the
      required practice ("Incremented to N by <run>'s own ... append").
      verdict: BRANCH-CAUSED, real failure -- NOT pre-existing. The Step
      2a handoff's claim that this was a pre-existing drift "unrelated to
      this branch's own changes" does not hold up under the structural check:
      the file A9 flags as drifted was modified by this branch's own Step 00,
      and the modifying commit's own note text is the smoking gun (it reports
      the new count but the companion index file was never told).
    attribution_form: >
      in-diff (docs/status/requirement_status.v3.yaml is modified by this
      branch) AND root-caused directly via the diff hunk + the index file's
      own recount-history convention -- not (a), not count-matching.
    disposition: >
      REWORK -- route to ORCH (not ELIXIR-DEV/FRONTEND-DEV/TEST-DESIGNER;
      this is a docs/status bookkeeping omission from this run's own Step 00,
      not application or test code). Fix: append a note to
      docs/status/requirement_status.index.yaml's volume-3 entry
      incrementing `entries:` from 33 to 34 (recounted via
      `grep -c "^  - req:" docs/status/requirement_status.v3.yaml`), per the
      index's own documented recount-every-time rule, in the same commit/
      branch that already carries the REQ-076 started-event append.

  - id: "tenant_schema_reaper_test.exs x3 (partition 4)"
    test: >
      Letflow.TenantSchemaReaperTest -- "concurrent-invocation liveness guard
      (ISS-0110) spares an old row while another invocation's connection is
      open, reclaims it once that connection closes" (test/support/tenant_schema_reaper_test.exs:273),
      "schema_name format guard skips an old row with a malformed schema_name
      instead of attempting a drop" (:212), "reclaims an old, well-formed
      orphaned row drops the real schema and deletes both rows" (:124)
    error: >
      Test 1: DBConnection.ConnectionError, "connection not available and
      request was dropped from queue after 4000ms", at
      tenant_schema_reaper_test.exs:315 (Postgrex.query!). Tests 2 and 3:
      `assert skipped >= 1` / `assert reclaimed >= 1` both got `left: 0,
      right: 1`. Partition 4's log also shows, immediately around these
      failures: "TenantSchemaReaper.sweep_orphans/2: deferring this sweep
      entirely -- another mix test invocation (application_name !=
      ...) is currently connected to this database" (the ISS-0110 guard
      firing) and a direct Postgrex FATAL: "too_many_connections sorry, too
      many clients already".
    diff_scope: >
      Neither test/support/tenant_schema_reaper_test.exs nor
      test/support/tenant_schema_reaper.ex appears in
      `git diff --name-only main` for this branch. The reaper module's only
      dependency is `Letflow.Repo` (grep of its aliases/uses); it references
      `Letflow.TenantProvisioning` only in code comments, not as a runtime
      call -- so tenant_provisioning.ex being in this branch's diff does not
      make this module in-scope by dependency either.
    mechanism_measured: >
      This is exactly the class of interference test_parallel.sh's own header
      documents under ISS-0222 (transient too_many_connections from a
      launch-time connection-count spike) and ISS-0217/ISS-0110 (the reaper's
      own concurrent-invocation guard, designed to defer sweeps when it
      detects another live mix-test invocation's connection, correctly firing
      when 4 partitions run concurrently against the same Postgres). Direct
      measurement in this run's own log: the guard's deferral message fires
      immediately before test 2 and test 3's `reclaimed`/`skipped` counts come
      back 0 (deferred sweep = 0 reclaimed, by design), and test 1 hits a real
      Postgrex "too_many_connections" FATAL from the same concurrent-partition
      connection pressure. This is the four-partition run itself, not any
      code this branch touches, producing the interference.
    attribution_form: >
      not in diff (a) -- neither the failing module nor test.support file nor
      any module it actually depends on appears in the branch diff -- AND a
      measured external mechanism (c): the ISS-0110 guard's own deferral log
      lines and a real too_many_connections Postgrex FATAL are direct,
      in-this-run evidence of concurrent-partition connection pressure, not
      an assertion or a count-match against a prior run.
    disposition: >
      REPORT FOR FILING if no existing issue record covers this exact
      TenantSchemaReaperTest-vs-parallel-partitions interaction (searched
      docs/issues/ for tenant_schema_reaper/ISS-0110/ISS-0222 by name --
      ISS-0110 and ISS-0222 exist but describe the guard/pool-sizing
      mechanisms generally, not this specific test suite hitting them under
      N=4). Not fixed here -- pre-existing/environmental, out of REQ-076's
      scope, and TEST-RUNNER does not own test/support/tenant_schema_reaper*.

verdict: FAIL

