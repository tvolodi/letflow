root_cause_ac2_failure:
  file: test/letflow/integration/keycloak_auth_pipeline_test.exs
  line: 250
  classification: test-code bug, not an application regression
  detail: >
    lib/letflow/plugs/auth_pipeline.ex's private reject/4 (line 322-323, unchanged
    by REQ-134) always encodes `%{error: error, detail: detail}` -- both keys,
    every rejection path. This is pre-existing, already-established behavior: the
    sibling non-integration test test/letflow/plugs/auth_pipeline_test.exs:196 (and
    others in that file) correctly assert this with a partial pattern match
    (`assert %{"error" => "unauthorized"} = Jason.decode!(conn.resp_body)`), which
    tolerates the extra "detail" key. The new AC2 test instead asserts full map
    equality (`== %{"error" => "unauthorized"}`), which can never pass against
    reject/4's real, unchanged output shape. This was undetected until today
    because Keycloak was never reachable in this environment before this run (see
    step3/step3b handoffs: AC1-3 were validated by code review only, never
    executed) -- the design and every prior gate correctly deferred live-token
    verification, but nothing had actually run this assertion against a live
    401 response until now.
  fix_direction: >
    Change line 250 to a partial pattern match, matching the established sibling
    test's convention -- `assert %{"error" => "unauthorized"} = Jason.decode!(conn.resp_body)`
    -- or assert on the "error" key alone. Not applied by TEST-RUNNER: this is
    TEST-DESIGNER's owned file/step, and per this project's every-producing-step-
    has-a-validating-step rule, the fix needs to go back through TEST-DESIGN-VALIDATOR
    (step3b) before Step 4 re-runs, not be silently patched here to turn a real red
    result green.

