known_flake_classes_checked:
  - id: ISS-0219
    description: >
      scripts/test_parallel.sh auto-derived N (nproc) can exceed a host's
      Postgres/connection budget, crashing all partitions before any
      result. Mitigated proactively by running with an explicit
      TEST_PARALLEL_N=4 (the documented known-good value) rather than
      nproc auto-derivation. Not encountered -- all 4 partitions completed
      cleanly with real per-partition Result:/Failed: lines.
  - id: ISS-0352
    description: >
      wasmex native-thread-pool exhaustion from genuinely-hung WASM guest
      calls. Structurally contained since PR #691/#692's fix: all
      permanently-hanging tests are tagged :wasm_hang and excluded from
      the default mix test run (test/test_helper.exs), so
      scripts/test_parallel.sh's partitions -- which run the default,
      non-`--only wasm_hang` suite -- never touch a genuine hang. This
      run's own partition logs show "Excluding tags: [:keycloak,
      :wasm_hang]" is the standing exclusion in effect (confirmed on the
      standalone parallel_gateway_test.exs run above; the same
      test_helper.exs config applies to every partition). Not applicable
      to this run: TEST-RUNNER's own procedure invokes
      scripts/test_parallel.sh, not `mix letflow.check` (which is what
      additionally runs the isolated `--only wasm_hang` subprocess where
      ISS-0352's documented recurrence note manifested on 2026-09-01
      against a different branch/PR #780). No WASM files are anywhere in
      this branch's diff.
  - id: ISS-0380
    description: >
      Native-thread survival on a hung Wasmex.start_link/1 instantiation
      (ModuleRegistry). Unrelated code path -- module_registry.ex is not
      touched by this branch and this issue's fix was doc-only, no test
      behavior change. Not applicable.

