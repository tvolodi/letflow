triage:
  scope_check: >
    git show --stat on both branch commits (803e5514, 75d09428) confirms
    neither touches lib/mix/tasks/letflow.lint_handoffs.ex or its test file
    -- this branch's diff is entirely
    test/letflow/scheduler_req188_test.exs, test/specs/REQ-188.md,
    docs/anti-patterns.md, and two new lib/letflow/design/*.md files.
    LintHandoffsTest failing is unrelated to this branch by file scope
    alone.
  isolation_repro: >
    Ran `mix test test/mix/tasks/letflow.lint_handoffs_test.exs` standalone
    (same seed as the failing partition, 938614, and again with a fresh
    seed): both runs 22 passed, 0 failures. The test does not fail on its
    own.
  full_rerun_repro: >
    Re-ran scripts/test_parallel.sh a second time, identical N=16 setup:
    3054/3054 passed, 0 failures -- LintHandoffsTest passed cleanly in
    partition 14 this time. Confirms the failure is non-deterministic
    under this exact branch/environment, not a stable regression.
  root_cause_hypothesis: >
    Read lib/mix/tasks/letflow.lint_handoffs.ex:618-651.
    created_at_after_rule?/1 calls fetch_rule_commit_timestamp/0, which
    shells out via System.cmd("git", ["show", "-s", "--format=%cI", ...],
    stderr_to_stdout: true) and does
    `out |> String.trim() |> DateTime.from_iso8601() |> elem(1)` with NO
    error handling on the parse result -- if DateTime.from_iso8601/1
    returns {:error, :invalid_format} (e.g. because stderr noise got
    merged into stdout via stderr_to_stdout: true, or git returned
    something unexpected under heavy concurrent-process contention from
    16 simultaneous partitions each shelling out to git), elem(1) silently
    extracts the atom :invalid_format instead of a DateTime and passes it
    on as the comparison "floor", which then blows up in the later
    DateTime.compare/2 call at line 623. This is a pre-existing latent bug
    in lint_handoffs.ex (unrelated to ISS-0404's diff, confirmed via git
    log -- the function predates this branch and last changed under
    unrelated commits e39d57c7/4b51784e), that only manifests under
    parallel-partition contention, consistent with both the standalone-pass
    and full-rerun-pass evidence above.
  verdict: >
    Pre-existing, unrelated, non-deterministic flake -- not a regression
    introduced by ISS-0404's change. Not blocking this PASS. Flagged below
    for ORCH to file as a new issue rather than silently waved away.

