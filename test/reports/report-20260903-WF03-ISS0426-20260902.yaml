pre_run_host_contention_note: >
  Before running item 1, discovered a genuinely live `mix test` process (PID
  36004, started 2026-09-03T08:43:39 local, an `erl.exe` child of a git-bash
  `sh.exe`) still running on the host, contradicting the dispatch's host note
  that ORCH's background run had already been stopped. Per HANDOFF_PROTOCOL.md
  §1.1 ("a handoff's factual premises are checkable, and may be wrong"), did
  not trust the note at face value: verified via `Get-CimInstance Win32_Process`
  that the process was real, alive, and steadily consuming CPU (587s -> 806s
  over ~10 minutes of polling), i.e. genuinely progressing, not hung. Could not
  positively confirm ownership/working directory from Windows process
  inspection alone, so — rather than kill an unowned process or race it (which
  ISS-0219/ISS-0222 document produces spurious connection failures) — waited
  for it to exit naturally (confirmed ended ~2026-09-03T04:17Z) before starting
  item 1. This is reported as a MINOR issue below; it did not block or corrupt
  any of the four required runs, all of which were launched only after
  confirming via `Get-CimInstance Win32_Process -Filter "Name='erl.exe'"` that
  no test-related erl.exe process remained beyond the standing ElixirLS
  language-server ones (PIDs 39680/24620, present for the whole session).

self_inflicted_contention_note: >
  While running item 3 (`mix letflow.check.test`), an earlier throwaway
  `... > check_test.log 2>&1 &` attempt (intended only to probe whether
  backgrounding would persist across tool-call boundaries — it does not, per
  this environment's own documented behavior) was immediately followed by a
  second, foreground invocation of the same command without confirming the
  first had actually been reaped. Both ended up running concurrently against
  the same Postgres instance for their full ~1880-1890s duration, producing
  two interleaved Result: blocks in one log (20 failures in one block, 14 in
  the other) — the exact ISS-0219/ISS-0222 contention class the dispatch
  warned about, self-inflicted rather than encountered incidentally. Neither
  of those two results is reported as ISS-0426 evidence: both are discarded,
  the log was deleted, and item 3 was re-run once, alone, cleanly (verified via
  `Get-CimInstance Win32_Process -Filter "Name='erl.exe'"` immediately before
  launch that only the standing ElixirLS processes remained). The clean rerun
  is what is reported below. Reported as a MINOR issue (process-management
  error, not a suite or environment defect) rather than silently discarded.

