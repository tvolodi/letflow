wasm_hang_stage_verification:
  status: "not exercised by mix letflow.check.test itself this run -- independently verified below"
  reason: >
    lib/mix/tasks/letflow.check.test.ex's run/1 calls run_main_suite() then
    run_wasm_hang_tests() then run_lua_wallclock_race_tests() sequentially.
    run_main_suite() raised (Mix.raise, which halts the task) on the
    pre-existing rustc :enoent failures above, so run_wasm_hang_tests/0 --
    the actual discovery+isolation stage ISS-0524 fixed -- never executed
    as part of this `mix letflow.check.test` invocation. The task's own
    terminal output ends at "mix letflow.check.test: FAILED -- scripts/test_parallel.sh
    exited 1 (real test failure/error)" with no subsequent wasm_hang or
    lua_wallclock_race output, confirming the short-circuit.
  independent_verification: >
    To still confirm ISS-0524's actual fix works end-to-end, manually ran
    the two commands run_wasm_hang_tests/0 drives internally, outside the
    gated task:
      1. `mix test --only wasm_hang --dry-run` -- discovery succeeded on
         the first attempt (no retry needed), found 5 locations under the
         "Tests that would be executed:" header:
           test/letflow/engine/wasm/plugin_handler_test.exs:155
           test/letflow/engine/wasm/plugin_handler_test.exs:495
           test/letflow/engine/wasm/plugin_handler_test.exs:392
           test/letflow/engine/wasm/call_timeout_test.exs:79
           test/letflow/engine/wasm/host_api_write_test.exs:461
         Result: 0 tests, 3441 excluded (exit 1, expected/documented
         deviation per the module's own DEVIATION comment -- Mix always
         exits 1 on `--only` + `--dry-run` with 0 executed, independent of
         whether discovery itself succeeded).
      2. Ran each of the 5 discovered locations as its own fresh
         `mix test <file>:<line>` subprocess (matching run_single_wasm_hang_test/1
         exactly): all 5 exited 0, each reporting "1 passed" (plus that
         file's other excluded tests), no "default values for the optional
         arguments" substring in any output.
      3. `mix test --only lua_wallclock_race` (the third stage,
         run_lua_wallclock_race_tests/0): exited 0, "Result: 11 passed,
         3435 excluded", no target-substring warning.
    This confirms the wasm_hang discovery-and-isolation mechanism itself
    (ISS-0524's subject) is healthy and would have passed had
    run_main_suite not raised first -- but this is TEST-RUNNER manually
    replicating the stage's logic outside the gated task, not the gated
    task itself exercising it. RELEASE-VALIDATOR should be aware the real
    `mix letflow.check.test` invocation, as shipped, cannot reach this
    stage at all while the rustc-toolchain failures remain, and should
    decide whether that masking is acceptable for this merge.

