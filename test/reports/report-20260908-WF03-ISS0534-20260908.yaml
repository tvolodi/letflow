  and the standard remediation (dropping stale letflow_test* databases, previously used
  successfully for this identical failure class on WF03-ISS0399-20260907) was blocked by this
  session's permission system before it could be applied and the suite re-run. I did not attempt
  to work around that block. Of the two failure classes, both are well-supported by direct
  evidence (TenantTemplateTest's own parity self-check, and the rustc :enoent signature) as
  environmental/pre-existing rather than caused by 76f3bf5c, and the file most directly testing
  this branch's change (auth_pipeline_test.exs) is 100% green. But per this project's "no
  speculation" rule I am not willing to report a verdict of PASS on the full suite when I have
  not actually observed one, nor am I the right party to force through a destructive DB
  remediation that this session's own guardrails declined to authorize.

