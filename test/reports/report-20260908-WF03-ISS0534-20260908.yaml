failure_categorization:
  - class: "stale tenant_template schema in this workspace's persisted Postgres volume"
    count: 745 (of 749 total failure headers)
    signature: "LETFLOW_TENANT_FIXTURE phase=incomplete_schema ... versions_missing=[20260907020001]"
    affected_modules: 46 distinct test modules, including Letflow.Routers.IdentityTest (69),
      Letflow.Routers.TasksTest (53), Letflow.Routers.InstancesTest (50), Letflow.EngineTest (35),
      Letflow.Routers.DefinitionsWriteTest (33), Letflow.Routers.DefinitionsTest (31),
      Letflow.IdentityTest (29), Letflow.Routers.Req077PromotionPipelineTest (27),
      Letflow.Engine.ServiceTaskDispatcherTest (26), and 37 more -- essentially any test that
      provisions a tenant via Letflow.TenantFixture.provisioned_tenant!/1.
    direct_confirmation: >
      2 of the 745 are Letflow.Test.TenantTemplateTest's own parity self-checks
      (test/support/tenant_template_test.exs:93/96), which independently prove the shared
      "tenant_template" schema itself is stale: the reference schema (built fresh via
      Ecto.Migrator replay) has instance_attachments.scan_status; the cached candidate
      "tenant_template" schema does not. Verbatim diff line:
      "[dim #2] columns mismatch on table=instance_attachments: reference=[...,
      [\"scan_status\", \"character varying\", \"NO\", \"'pending'::character varying\", 11]]
      candidate=[...]" (candidate list has no scan_status column at all).
    root_cause: >
      test/support/tenant_template.ex's ensure_template!/0 caches "tenant_template" by BARE
      SCHEMA EXISTENCE only (template_built_in_db?/0: "SELECT 1 FROM information_schema.schemata
      WHERE schema_name = $1"), by explicit design (no detect-and-repair path, per that module's
      own comment). This workspace's docker-compose Postgres volume has 25 accumulated
      letflow_test* databases (letflow_test, letflow_test1..16, letflow_test42, letflow_test99,
      letflow_test165, letflow_test195, letflow_test226, letflow_test901, letflow_testRV1,
      letflow_testvalidator1) built by earlier runs, predating migration
      20260907020001_add_scan_status_to_instance_attachments.exs (which landed on main via a
      DIFFERENT, already-merged PR: d9aa2e55 / WF03-ISS0399, commit 76f3bf5c is not the source of
      this migration). Every one of those stale databases' tenant_template schema is missing that
      column, so every test that provisions a tenant against one of those 8 partition-assigned
      test DBs inherits the stale template and fails.
    identical_pattern_previously_seen_and_fixed: >
      This is the exact same failure class documented in
      test/reports/report-20260908-WF03-ISS0399-20260907.yaml's second attempt: that run
      root-caused it identically and remediated by dropping the stale letflow_test* databases
      (`docker exec ... psql -c "DROP DATABASE IF EXISTS <db>"`), then re-ran clean
      (3447/3449 passed, 2 pre-existing unrelated failures).
    remediation_attempted_this_run: >
      Attempted the same remediation (DROP DATABASE on the 25 stale letflow_test* databases,
