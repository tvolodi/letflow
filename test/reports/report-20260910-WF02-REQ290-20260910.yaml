           only `schema_migrations`; process_definitions (and the rest of the tenant
           schema's tables) were never created.
        3. `select * from tenant_schemas where schema_name =
           'tenant_template_build_fd4f501c2cd9764911181528a7f9a004'` -- one row,
           migrations_applied_at IS NULL, provisioned_at = 2026-09-10 05:19:21 --
           roughly 10.5 hours before this run's own test timestamps (~15:59), and an
           incomplete-migration marker (a completed build's migrations_applied_at is
           always set).
      This is a genuinely stale, incompletely-provisioned tenant-template-build schema
      left behind by some earlier, unrelated, interrupted mix test invocation on this
      shared test database -- byte-for-byte the same mechanism (a leftover
      migrations_applied_at-null / table-incomplete tenant schema row from an
