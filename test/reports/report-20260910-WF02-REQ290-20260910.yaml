      already-documented, already-resolved-as-a-class intermittency, not this
      branch's problem.
  conclusion: "PRE-EXISTING, both Route 1 and Route 3 independently satisfied with fresh evidence gathered this run (not copied from ELIXIR-DEV/TEST-DESIGNER/TEST-DESIGN-VALIDATOR's prior reports)."

