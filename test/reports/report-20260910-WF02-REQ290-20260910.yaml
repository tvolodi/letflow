    result: CONFIRMED, with direct measurement (not asserted)
    evidence: >
      Queried the live letflow_test2 database directly (docker exec psql, not
      inherited from any prior report):
        1. `select nspname from pg_namespace where nspname like 'tenant_template_build%'`
           -- the schema tenant_template_build_fd4f501c2cd9764911181528a7f9a004 exists.
