caveat_on_earlier_runs: >
  My first invocation of `mix letflow.check` exceeded this tool's 120s/600s
  foreground timeouts and was auto-backgrounded by the harness. Believing
  it was still safe to wait, I launched a second `mix letflow.check`
  concurrently while the first was still running its test partitions. Both
  ran the full 8-partition suite against the same Postgres container at
  the same time, doubling connection demand (2 x N=8 x pool_size=10 = 160
  against Postgres's max_connections=100), which produced a large batch of
  `DBConnection.ConnectionError` / `Postgrex.Error 53300 too_many_connections`
  failures (41 and 43 failures respectively across the two concurrent
  runs, spanning TenantConfigTest, EntitiesAggregateTest, DDLTest,
  TenantStatusTest, ServiceCatalogReaperTest, TenantSchemaReaperTest,
  ApiPipelineIntegrationTest, ApiPipelineIntegrationTest, and others).
  This was a self-inflicted environment artifact from running two full
  suites concurrently, NOT a code defect -- confirmed by re-running once,
  alone, after verifying no `mix test`/`beam.smp` process was still
  running (`ps aux`), which reproduced cleanly with 0 failures across all
  8 partitions. The first (solo, non-concurrent) backgrounded run had
  ALSO already completed cleanly with 4199/4199 passed before I made the
  concurrency mistake -- its only failure was the real ISS-0069 finding
  below. Reported here so this mistake is visible rather than silently
  dropped; it should not be read as evidence of test-suite flakiness.

