finding:
  severity: REAL -- blocking, not environmental
  location: "test/letflow/routers/exam_sessions_test.exs:97"
  detail: >
    `defp create_exam!(schema, attrs \\ %{})` declares a default value for
    `attrs`, but the file's only call site
    (`build_minimal_exam!/2` at line 153: `create_exam!(schema, exam_attrs)`)
    always passes `attrs` explicitly -- there is no arity-1 call anywhere
    in this file. Confirmed by grep: `create_exam!(` appears exactly twice
    in the file, once as the definition and once as this fully-applied
    call. The compiler is therefore correct that the default is dead code,
    and `mix letflow.check.test`'s ISS-0069 warning-class gate correctly
    fails the build on it (this is the same warning class ISS-0069 was
    filed to catch, recurring here in a new file).
  fix_owner: TEST-DESIGNER (this is test code, not application code -- REQ-332/REQ-333's lib/letflow/exam/ modules are unaffected)
  suggested_fix: >
    Either drop the default (`defp create_exam!(schema, attrs)`) since
    every call site already supplies attrs, or add a genuine arity-1 call
    site if an argument-less call was intended. The former is the minimal,
    correct fix given the current test file's usage pattern.

