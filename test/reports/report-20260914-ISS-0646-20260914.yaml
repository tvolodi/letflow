caveat_on_first_run_N16: >
  The first full-gate run used this host's auto-detected N=16 (nproc=16). It failed with
  8 test failures, all in Letflow.TenantSchemaReaperTest (3), Letflow.ServiceCatalogReaperTest
  (4), and Letflow.Engine.Lua.ExecutorTest's :lua_wallclock_race partition-integrity test (1),
  plus two partitions (3 and 14) that crashed outright during `ecto.create` ("The database for
  Letflow.Repo couldn't be created: killed"). None of the 8 failures were in
  Authorization/ExamSessions/CANDIDATE-role code or tests. Root cause confirmed in the captured
  log: repeated `Postgrex.Error 53300 too_many_connections` and DBConnection queue-timeout
  errors -- i.e. real Postgres connection exhaustion, not application logic. This matches
  scripts/test_parallel.sh's own documented, pre-existing caveat (lines ~111-176: at N=16 the
  computed/clamped TEST_POOL_SIZE budget against Postgres's default max_connections=100 is
  already razor-thin, and the script's own warning text says to reduce TEST_PARALLEL_N if
  "too_many_connections" is hit). Verified isolation first (`ps aux` showed no other
  mix/beam process before or during the run, ruling out a second concurrent invocation from
  another workspace/session sharing this Postgres container). Confirmed non-regression by
  re-running the same suite at TEST_PARALLEL_N=8 twice (once standalone via
  scripts/test_parallel.sh, once via the full `mix letflow.check` gate): both times 0
  failures. This is the same pre-existing environmental class of flake this project already
  tracks for tenant_provisioning/column_promotion_test.exs:172 (which did NOT occur in either
  run here) -- not a regression introduced by this diff.

