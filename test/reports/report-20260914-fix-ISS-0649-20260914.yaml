issue: >
  ISS-0649 (queue task 649, github_issue_number 1355) -- Letflow.TenantProvisioning's
  `column_promotions_in_flight/2` renamed to `column_promotions_for_table_write/2` and
  its status filter widened from ["ddl_applied", "backfilling", "backfilled"] to also
  include "active", so Letflow.Entities.Records.dual_write_promoted_columns/3 keeps
  writing to a promoted entity type's per-tenant physical table forever after cutover
  instead of silently stopping once the promotion reaches "active". This call site sits
  on every entity create/update write path when any column promotions exist for the
  tenant/entity type. Change is uncommitted in the current worktree (not yet
  committed/pushed to fix/ISS-0649-20260914). Both SECURITY-REVIEWER and REVIEWER
  already PASSed this change; REVIEWER specifically required a full-suite run (not a
  file-scoped one) because of the write-path breadth of the call site.

