    sanity_check_performed: >
      This matches the exact 1-passed/2-failed pattern TEST-DESIGN-VALIDATOR
      already reported and attributed to a pre-existing sandbox gap, not a
      regression -- but per the dispatch brief, that attribution was verified
      independently rather than assumed. Root cause traced concretely in this
      run: the web/ dev server's Vite proxy (web/vite.config.ts) targets
      `http://localhost:4000` literally; in this sandbox, Node resolves
      "localhost" to ::1 (IPv6) first, while the Letflow backend binds only
      0.0.0.0 (IPv4) -- confirmed directly:
        curl http://localhost:4000/health   -> {"status":"ok"}
        curl http://127.0.0.1:4000/health   -> {"status":"ok"}
        curl -6 http://[::1]:4000/health    -> connection refused (curl RC=7)
      The Playwright run's own [WebServer] log lines showed repeated
      "vite http proxy error: ... ECONNREFUSED ::1:4000" for every
      /api/v1/definitions, /api/v1/instances, /api/v1/tasks call the
      dashboard makes -- so the browser-rendered dashboard never receives
      tile data and the tile-definitions/instances/tasks testids never
      render, independent of anything this diff's spec asserts.
      Cross-checked for "is this specific to the new spec / this diff": ran
      two pre-existing specs unrelated to this branch's content --
      tests/e2e/pipelines/admin-user-lifecycle.pipeline.e2e.spec.ts and
      tests/e2e/tenant-dashboard.e2e.spec.ts (TC-TD-UI-01-04, an existing
      tile-assertion test) -- both failed too, on a related but distinct
      symptom of the same environmental gap (their own /health/ready
      precondition against 127.0.0.1:8080, the already-registered
      ISS-0706 defect). Conclusion: the 2 failures in the new spec are
      real, but they are an environmental/infra gap in this sandbox
      (backend only bound to IPv4, dashboard API calls silently failing
      through the Vite proxy) -- not a defect in the new spec's code, the
      scenario fixture, or the diff under test. Not a regression from this
      branch.

