test_2_pool_sizing_precedent_regression:
  command: "bash test/scripts/test_parallel_pool_sizing_test.sh"
  description: >
    ISS-0287 precedent test -- extracts scripts/test_parallel.sh's own Step 1.5
    connection-pool clamp arithmetic verbatim (via "# --- Step 1.5:" / "# --- Step 2:"
    comment markers) and evals it in a controlled subshell to check the formula
    hasn't regressed. Run to confirm ISS-0698's fix didn't disturb this.
  result: FAIL
  actual_output: |
    FAIL: extracted Step 1.5 block from .../scripts/test_parallel.sh is 193 lines
    (> 90) -- refusing to eval a suspiciously large capture; end marker may be
    misplaced/renamed
  root_cause_diagnosis: >
    TWO independent, pre-existing findings, NEITHER of which is a regression in
    the pool-sizing formula itself:

    (1) NEW side effect of the ISS-0698 fix (this branch): the fix inserted two
    new labelled sections, "# --- Step 1.6:" (seed per-partition build paths)
    and "# --- Step 1.7:" (capped-concurrency pre-create/migrate), between the
    pre-existing "# --- Step 1.5:" and "# --- Step 2:" markers that
    test_parallel_pool_sizing_test.sh's awk extraction relies on as start/end
    bounds. The extraction now captures Step 1.5 PLUS the new Step 1.6 and
    Step 1.7 (106 lines -> 298 lines in scripts/test_parallel.sh, i.e. the
    captured block grew from ~86 to ~193 lines), which trips the test's own
    90-line over-capture guard (added deliberately in the ISS-0287 rework to
    catch exactly this class of drift) before any arithmetic is even
    evaluated. Manually re-extracting Step 1.5 alone (bounding at the new
    "# --- Step 1.6:" marker instead of "# --- Step 2:") confirms Step 1.5's
    actual formula body is textually unchanged by ISS-0698's fix -- this is a
    stale end-marker assumption in the test, not a formula change.

    (2) PRE-EXISTING, unrelated to this branch: even with a corrected end
    marker, the test's own hardcoded expected values (e.g. "N=4 defaults ->
    pool=21") were written against TEST_NONPOOL_CONNECTION_RESERVE's OLD
    default of 2 (set by the ISS-0287 commit b7a5c052 that authored this test).
    That default was bumped from 2 to 5 by commit aa956b9a (ISS-0515, "fix
    reproducible CI tenant_template build-race", 2026-09-06 -- eleven days
    before this branch existed) without updating this test's hardcoded
    expectations. Manually evaluating the real, current Step 1.5 block gives
    TEST_POOL_SIZE=20 for N=4 (not the test's expected 21); N=16 still
    coincidentally gives 5 either way (82/16 and 85/16 both floor to 5), so
    only the N=4 default-values case would actually mismatch once (1) above is
    fixed. This drift predates ISS-0698 entirely and was not introduced or
    caught by this branch's work.

    Net effect on THIS run: the test fails at the extraction-guard stage
    (finding 1), so finding 2's stale-expectation mismatch was never reached
    in this execution -- documented here from manual verification, not from a
    second assertion failure in the tool's own output.
  not_fixed_here: >
    Per TEST-RUNNER's mandate (diagnose, don't silently loosen a test to make
    it pass, route to the owning role), this file was not edited. Both findings
    are test-script-only issues (test/scripts/test_parallel_pool_sizing_test.sh's
    marker bound and hardcoded expectations), not an application/formula bug --
    no ELIXIR-DEV routing needed. Recommend a follow-up issue for TEST-DESIGNER
    to (a) move the end marker to "# --- Step 1.6:" (or another marker
    immediately after Step 1.5) and (b) refresh the N=4-defaults expected pool
    value to match the current TEST_NONPOOL_CONNECTION_RESERVE default of 5.

manual_verification_of_step_1_5_formula:
  method: >
    Re-extracted Step 1.5 in isolation (bounded at the new "# --- Step 1.6:"
    marker) and eval'd it directly against the same three arithmetic cases the
    broken test encodes, to confirm no real regression in the pool-sizing logic.
  results:
    - "N=4, all defaults: TEST_POOL_SIZE=20 (test file's stale expectation: 21 -- see finding 2 above)"
    - "N=16, all defaults: TEST_POOL_SIZE=5 (matches test file's expectation)"
    - "N=4, TEST_SUPERUSER_RESERVED=0 TEST_NONPOOL_CONNECTION_RESERVE=0: TEST_POOL_SIZE=22 (matches test file's expectation for the pre-ISS-0287 reproduction case)"
  conclusion: >
    The clamp formula itself computes consistently with its own documented
    arithmetic at current defaults; the one mismatch (N=4 defaults) traces
    entirely to the test's stale hardcoded constant from before the Sep 6
    nonpool_reserve default bump, not to any change made on this branch.

