scope: |
  WF-03 Step 4 final test-run confirmation for ISS-0716 (flaky
  Letflow.TenantProvisioning.ColumnPromotionTest AC1 fix). Root cause diagnosed by
  ISSUE-FIXER: SandboxAutoMode's pool-wide :auto sandbox mode window lets
  concurrently-scheduled tenant-provisioning tests commit for real, so :all-scoped
  register_column_promotion/4 legitimately (production-correct) sees extra tenant
  ids beyond this test's own tenant_a/tenant_b. Fix (commit 6a849e17) is test-only:
  AC1's assertion relaxed to containment (tenant_a and tenant_b present among
  resolved ids, tolerating extras) plus scoping the downstream DDL-execution loop
  to only tenant_a/tenant_b's own rows. No lib/letflow/ change. Already passed
  REVIEWER (SECURITY-REVIEWER skip confirmed legitimate, matching ISS-0580
  precedent) and TEST-DESIGNER (mutation-tested both new assertions, no gap
  found, no new test needed).

