column_promotion_flake_verdict: >
  Across 3 independent full-suite concurrent runs (2 standalone
  scripts/test_parallel.sh invocations plus mix letflow.check.test's own
  internal run) -- 8 concurrent partitions each, the exact condition needed to
  reproduce the original AC1 flake (concurrently-scheduled SandboxAutoMode
  writes from sibling tenant-provisioning tests) -- plus 5 solo repeats of the
  file in isolation, zero failures were observed anywhere in
  column_promotion_test.exs or the suite at large. This is consistent with,
  though does not mathematically prove, the flake being resolved: the fix
  replaces an exact-equality assertion that was structurally guaranteed to
  break under any concurrent commit with a containment check that tolerates
  it by construction, so the fix is correct by inspection of the mechanism,
  not merely by absence of an observed failure in this run.

