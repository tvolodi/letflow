conclusion: >
  BLOCKED, not PASS or FAIL. Every attempt (4 total, spanning ~20 minutes)
  was defeated by sustained Postgres connection-pool exhaustion (100/100
  connections held continuously) caused by an active sibling session's
  workload sharing port 5462, matching exactly the contention risk this
  run's own handoff task description anticipated. Unlike a transient
  spike, this did not clear across ~20 minutes of polling and 4 separate
  attempts at varying footprints (N=16, N=4, single-file, N=16 again), and
  the responsible processes (3 erl PIDs, unchanged throughout) predate
