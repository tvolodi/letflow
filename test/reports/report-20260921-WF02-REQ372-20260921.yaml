pg_saturation_evidence: >
  Between attempts, polled `docker exec letflow-postgres-1 psql -U postgres
  -c "SELECT count(*) FROM pg_stat_activity"` roughly every 15-25s across a
  ~20 minute span (13:37-13:56 UTC). Every single poll failed with
  `FATAL 53300 sorry, too many clients already` -- even the superuser
  connection used purely to inspect activity could not get in, meaning
  Postgres was continuously at its connection ceiling for the entire
  investigation window, not intermittently contended.
  `docker logs letflow-postgres-1 --tail 50` during this window shows a
  steady stream of real application traffic against tenant_* schemas
  (timers, events, entity_receipt, entity_column_promotions) interleaved
  with the too_many_connections FATALs -- this is an actively running
  sibling test/app workload, not idle/leaked connections.
  `Get-Process | Where beam/erl` showed the same 3 erl PIDs (28488, 30060,
  46888) alive and unchanged, with start times (13:15:27, 13:15:47,
  13:31:28) that all PREDATE this run's own first attempt (13:37) --
  confirming these are sibling-session processes, not artifacts of this
  run's own (fully exited) test_parallel.sh invocations.

