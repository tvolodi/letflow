new_regression_caused_by_this_branch:
  - tests:
      - "IdentityMigration.copy_tenant/2 and copy_all_tenants/0 (REQ-063 §4) an orphaned tenant_role aborts that tenant's copy with {:error, {:orphaned_tenant_role, id}}, and no partial rows are committed for that tenant"
      - "DropLegacyPublicIdentityTables migration guard (REQ-063 §5) -- skip-on-uncopied-row once the copy is completed for every registered tenant, the guard PROCEEDS and drops all three public tables"
      - "ISS-0060: with_only_this_tenant_visible!/2 guard fix hides the racer tenant, flips guard SKIP into PROCEED"
      - "IdentityMigration.copy_tenant/2 and copy_all_tenants/0 (REQ-063 §4) copy_all_tenants/0 processes every registered tenant and aggregates counts"
      - "DropLegacyPublicIdentityTables migration guard (REQ-063 §5) -- skip-on-uncopied-row an uncopied row makes the guard SKIP the drop entirely"
      - "IdentityMigration.copy_tenant/2 and copy_all_tenants/0 (REQ-063 §4) copies groups/users/tenant_role from public into the tenant's own schema, preserving id, ordering tenant_role after groups"
      - "IdentityMigration.copy_tenant/2 and copy_all_tenants/0 (REQ-063 §4) copy_tenant/2 is idempotent"
    file: test/letflow/identity_migration_test.exs
    error: "(Postgrex.Error) ERROR 42703 (undefined_column) column u0.role_claims_synced_at does not exist"
    found_in: partition 5 of the full parallel run (all 7 failures, exit 2)
    root_cause_file: lib/letflow/identity_migration.ex
    root_cause_function: "copy_users/2 (around line 155)"
    root_cause_mechanism: >
      copy_users/2 does `from(u in User, where: ...)` with no `select:`
      restriction, so it selects every column of the Letflow.Identity.User
      Ecto schema -- including :role_claims_synced_at, newly added to that
      schema by this same commit (4d63a6a1) for REQ-378 §2.2. The query
      targets the legacy public.users table, which predates D1/D2, is
      frozen, and never gained that column. copy_groups/2 in the same
      module already carries an explicit comment documenting this exact
      hazard (from REQ-074's earlier display_name/description addition) and
      defends against it with a restricted `select: struct(g, [:id, :name,
      :inserted_at, :updated_at])`; copy_users/2 has no equivalent guard.
    attribution_form: >
      Form (a) + reproduction: `git log --oneline main..HEAD -- lib/letflow/
      identity/user.ex` shows exactly one commit on this branch,
      4d63a6a1 (this rework), touching that schema file --
      role_claims_synced_at is new on this branch. The failing query's
      undefined_column error names that exact field. Deterministic: same
      7 failures on a from-scratch DB with no prior state.
    verdict: CAUSED BY THIS BRANCH -- must be fixed by ELIXIR-DEV, not treated
      as environmental.

verdict: FAIL
verdict_reason: >
  All 3 previously-reported regressions (auth_pipeline_test.exs,
  api_pipeline_integration_test.exs, req077_promotion_pipeline_test.exs)
  are confirmed fixed. Both REQ-378 test files
  (iss0736_oidc_live_revocation_test.exs, identity.removeMembers.test.ts)
  show 0 failures. Frontend full suite is 728/728 clean. However, the
  §2.2 rework that added Letflow.Identity.User's :role_claims_synced_at
  field introduced a NEW, deterministic regression: 7 failures in
  test/letflow/identity_migration_test.exs, traced to
  lib/letflow/identity_migration.ex's copy_users/2 lacking the same
  select-restriction guard copy_groups/2 already has for exactly this
  class of hazard. Ruled the shared-DB/versions_missing mechanism OUT
  first (all test DBs dropped and rebuilt from scratch before this run;
  the failure is a column-does-not-exist error inside a live query, not a
  migration-state mismatch).

next_action: >
  Rework by ELIXIR-DEV: add a `select:` restriction to copy_users/2 in
  lib/letflow/identity_migration.ex mirroring copy_groups/2's existing
  pattern -- restrict the selected columns to the legacy public.users
  table's real, frozen shape (id, tenant_id, username, display_name,
  email, password_hash, status, auth_source, external_id, external_realm,
  inserted_at, updated_at), excluding :role_claims_synced_at (and any
  other column added to the User schema module after D1/D2 for the
  per-tenant destination table only). Consider adding a moduledoc/comment
  note on the User schema module itself warning that new fields need a
  matching copy_users/2 select update, since this is now the second time
  this exact hazard has fired (REQ-074 on copy_groups/2, REQ-378 on
  copy_users/2).
