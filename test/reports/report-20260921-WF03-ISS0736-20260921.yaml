verdict: FAIL
verdict_reason: >
  Three separate, deterministically-reproducing regressions traced with a
  concrete code-level mechanism to this branch's own change in
  lib/letflow/plugs/auth_pipeline.ex (REQ-378's new
  verify_local_account_state/2 step): JIT-provisioned users whose role
  comes from the OIDC token's claims but has no corresponding group_members
  row now get roles: [] instead of the claimed role, breaking
  auth_pipeline_test.exs AC1, api_pipeline_integration_test.exs REQ-071 AC2,
  and req077_promotion_pipeline_test.exs design §12.9. The new REQ-378 test
  file itself (test/letflow/plugs/iss0736_oidc_live_revocation_test.exs)
  and the new frontend test (identity.removeMembers.test.ts) both show 0
  failures, and the frontend full suite is 728/728 clean, but the backend
  regression blocks this run. Two other failure clusters (
  SecretsRuntimeConfigTest timeout, TenantSchemaReaperTest x3) are
  attributed pre-existing/environmental per the structural (a) test --
  unrelated files, not touched by this branch's diff -- and are not
  blockers on their own, but do not offset the auth-pipeline regression.

next_action: >
  Rework by ELIXIR-DEV: either (1) have the JIT-provisioning path
  (provision_user/3's OIDC branch) materialize the token's claimed
  role(s) into a group_members row atomically with user provisioning, so
  list_effective_role_names/2 finds them on the very same request, or (2)
  reconsider verify_local_account_state/2's role source so it does not
  silently drop a token-claimed role that has no DB-side group membership
  yet, while still satisfying REQ-378 AC1's live-revocation requirement.
  CODE-DESIGNER/REVIEWER should confirm which of these (or another option)
  is the intended shape before ELIXIR-DEV re-implements.
