regressions_caused_by_this_branch:
  - test: "Letflow.Plugs.AuthPipelineTest / acceptance criterion 1 — valid token flows through the full pipeline"
    file: test/letflow/plugs/auth_pipeline_test.exs:158
    assertion: "assert roles == [\"VIEWER\"]  =>  left: [], right: [\"VIEWER\"]"
    found_in: partition 11 of the full parallel run, reproduced in targeted serial re-run
  - test: "Letflow.Plugs.ApiPipelineIntegrationTest / REQ-071 AC2: valid token reaches the (stubbed) handler with auth_context populated"
    file: test/letflow/plugs/api_pipeline_integration_test.exs:105
    assertion: "assert conn.assigns.auth_context.roles == [\"VIEWER\"]  =>  left: [], right: [\"VIEWER\"]"
    found_in: partition 9 of the full parallel run, reproduced in targeted serial re-run
  - test: "Letflow.Routers.Req077PromotionPipelineTest / design §12.9: the :Unknown gate denies a real non-admin caller end-to-end"
    file: test/letflow/routers/req077_promotion_pipeline_test.exs:1034
    assertion: "assert conn.assigns.auth_context.roles == [\"VIEWER\"]  =>  left: [], right: [\"VIEWER\"]"
    found_in: partition 15 of the full parallel run (not independently re-run serially, same root cause and stack shape as the other two)
  root_cause_mechanism: >
    lib/letflow/plugs/auth_pipeline.ex's REQ-378 change replaces
    attach_auth_context's role source: it used to pass
    identity_context.roles straight through (the OIDC token's own claim-
    mapped roles, present the instant a JIT-provisioned user's token is
    verified, with no DB row required). The new verify_local_account_state/2
    step instead calls Identity.list_effective_role_names/2, which derives
    roles from a live group_members/tenant_role join in Postgres. None of
    these three tests' JIT-provisioning fixtures insert a group_members row
    for the "VIEWER" role -- they only carry the role in the token's claims,
    which is exactly the pre-378 contract. So every one of them now gets
    roles: [] instead of roles: ["VIEWER"].
  attribution_form: >
    Form (a) + reproduction: `git diff origin/main...HEAD --name-only`
    shows lib/letflow/plugs/auth_pipeline.ex and lib/letflow/identity.ex
    changed on this branch and none of these three test files did; the
    failing assertions are directly inside the exact code path this
    branch's diff modified (attach_auth_context's role argument); the
    failure reproduces deterministically on a fresh, non-partitioned,
    serial `mix test` run of the affected files (14/16 passed, 2 failed,
    same two tests, same left/right values). Not a flake, not
    count-matched against a prior run.
  verdict: CAUSED BY THIS BRANCH -- must be fixed by ELIXIR-DEV, not treated
    as environmental.

