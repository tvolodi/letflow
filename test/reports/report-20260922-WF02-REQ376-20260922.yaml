    - group: "Letflow.Test.TenantTemplateTest (1 failure)"
      route: "1 (branch caused it), corroborated by route 2 reasoning (cannot reproduce at merge-base)."
      evidence: >
        Failure: "clone-vs-template parity (design §3.4 use site 2) a real
        clone matches the template across all 13 dimensions"
        (test/support/tenant_template_test.exs:64). Actual diff output
        (read directly, partition-3.log lines 49596-49720): dim #1 (table
