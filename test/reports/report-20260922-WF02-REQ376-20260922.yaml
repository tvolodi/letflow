    - group: "Letflow.Scheduler.PollerTest (16 failures)"
      route: "1 (branch caused it) -- lib/letflow/scheduler/poller.ex and lib/letflow/scheduler.ex are both in the diff (REQ-376 §3.1's partition-maintenance sweep)."
      evidence: >
        `git diff origin/main...HEAD -- lib/letflow/scheduler/poller.ex` shows
        `state` widened from `%{last_retention_run_at, last_tick_started_at}`
        to also require `last_partition_maintenance_run_at`, and
        `handle_info(:tick, state)` now unconditionally calls the new
        `maybe_run_partition_maintenance/2` (poller.ex line ~270). Every
        failure's actual stack trace (directly read, not inferred):
        `** (KeyError) key :last_partition_maintenance_run_at not found in:
        %{last_retention_run_at: nil}` raised from
        `lib/letflow/scheduler/poller.ex:408:
        Letflow.Scheduler.Poller.maybe_run_partition_maintenance/2`, called
        from `poller.ex:270: handle_info/2`. `test/letflow/scheduler/poller_test.exs`
        is NOT in this branch's diff -- it is a pre-existing file (its
        failing tests carry REQ-188/REQ-218/ISS-0421/ISS-0444/ISS-0695
