        migrations create (`events_default`,
        `events_pre_partition_20260922`, `events_y2026m09/10/11`,
        `events_archive_default`, `events_archive_pre_partition_20260922`);
        dim #3 (constraints) missing exactly the corresponding 11 PK/FK
        constraints (including `event_payload_store`'s composite FK against
        each partition child). `lib/letflow/tenant_provisioning.ex` is in
        this branch's diff (registers REQ-376's 9 new migrations). Route 2
        check: this test file (test/support/tenant_template_test.exs) is
        NOT in the diff and exists unmodified on origin/main -- but on
        origin/main, `events`/`events_archive` are plain non-partitioned
        tables (no partition children, no per-partition FKs exist to be
        "missing"), so this specific failure mode cannot occur at the
        merge-base: there would be nothing for the clone-vs-template dims
        to disagree about. This failure is therefore newly introduced by
        this branch's own schema change (declarative partitioning of
        events/events_archive), not pre-existing, even though its root
        mechanism (Postgres `CREATE TABLE ... LIKE ... INCLUDING ALL`
        cannot replicate `PARTITION BY` structure or per-partition FKs --
