        demands. This is a real regression this branch introduced into a
        test file it did not touch: either poller.ex needs to tolerate a
        missing key defensively (mirroring how `get_last_tick_started_at/1`
        already handles a partial state map elsewhere in the same file), or
        poller_test.exs's raw state literals need the new field added.
      test_names_sample: >
        "AC5: the retention runner is disabled by default", "REQ-218 AC3
        (per-schema clause)", "ISS-0695 ... admission_decision telemetry
        emission" (x2), "REQ-218 AC5", "REQ-218 AC2", "AC6: enabling
