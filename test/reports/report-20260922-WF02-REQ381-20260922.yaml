backend_pool_contention: >
  First two full-suite attempts (nproc-derived N=8, then a second run at N=8 which
  itself only completed because leftover partition processes were still consuming
  connections from the first attempt) hit Postgrex "too_many_connections"/
  DBConnection.ConnectionError storms and left partitions 3-8 hung indefinitely
  (still running, still holding connections, 30-50% CPU each) rather than exiting --
  this is the documented ISS-0219/ISS-0222 class in scripts/test_parallel.sh's own
  header comments (this host's Postgres/CPU budget cannot sustain nproc-derived
  parallelism; TEST_PARALLEL_N=4 is the documented, previously-verified workaround).
  Killed the hung processes (`pkill -9 -f "mix test --partitions"`), confirmed
  pg_stat_activity drained back to baseline (~6 connections), and re-ran with
  TEST_PARALLEL_N=4 throughout for the remainder of this session. One later mid-run
  overlap (a `timeout 590` wrapper SIGTERM'd the outer mix task while
  test_parallel.sh's own background partition jobs kept running orphaned, then a
  fresh detached run was started before those orphans were confirmed dead) was
  caught and cleaned up the same way before the final accepted run. TEST-DESIGNER
  independently hit the same host's resource ceiling in its own audit (per a
  mid-session coordinator note: 8-way parallelism OOM'd this 15Gi-RAM host, exit=137)
  -- consistent with this being a host-capacity fact, not a REQ-381 code issue.

