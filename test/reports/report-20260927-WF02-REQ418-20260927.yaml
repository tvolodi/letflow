run_2_live_keycloak_ac3_ac4:
  command: "mix test --include keycloak test/letflow/integration/keycloak_mobile_client_auth_test.exs"
  attempt_1:
    result: "CompileError: internal error in pass core_to_ssa -- list_to_atom system
      limit reached, compiling the AC3c test's combined describe+test name."
    root_cause: >
      The AC3c test's `test` string, concatenated with its `describe` block's name
      (ExUnit derives the exported test function's atom from that combination), was
      long enough to exceed BEAM's atom-length limit, so the compiler's core_to_ssa
      pass crashed while generating a function-clause error message for it. This was
      a real defect in the test file (owned by TEST-RUNNER per role scope), not an
      application bug or a Keycloak/environment issue.
    fix_applied: >
      Shortened the AC3c test description in
      test/letflow/integration/keycloak_mobile_client_auth_test.exs from
      "no code_challenge/code_challenge_method -> not the login page; error names
      code_challenge(_method), either in body or as error=invalid_request in a
      Location redirect to the registered redirect_uri" to "no
      code_challenge/code_challenge_method is rejected, not the login page" (same
      assertions unchanged, only the description shortened). Ran `mix format` on the
      file afterward to keep it check-formatted (mix letflow.check's own gate caught
      one unrelated pre-existing formatting drift in the same file from an earlier
      commit, which mix format also fixed).
  attempt_2:
    result: >
      Compiled clean. Realm-mismatch failure: all 4 tests failed. Keycloak container
      had been running since before priv/keycloak/realms/bpm-default.json's
      letflow-mobile client was added, and Keycloak's realm import only runs on
      container creation when the named realm doesn't already exist -- the running
      bpm-default realm predated the client. AC3a/b/c got a generic
      "unauthorized_client"-shaped rejection page instead of the expected login/PKCE
      behavior; AC4's admin client search for letflow-mobile returned an empty list
      (`{:ok, []}`), confirming the client did not exist in the live realm.
    diagnosis_confirmed: >
      `docker inspect --format='{{json .State.Health}}' letflow-keycloak-1` showed
      healthy throughout -- this was a stale-realm-import issue, not a container
      health issue.
    resolution: "`docker compose up -d --force-recreate keycloak`, waited for
      health=healthy (8 polls, ~24s), confirmed letflow-mobile is now importable."
  attempt_3_final:
    result: "Result: 4 passed. Finished in 1.3 seconds."
    per_test:
      - {ac: "AC3a", test: "client_id=letflow-mobile, registered redirect_uri, response_type=code, S256 code_challenge -> HTTP 200", status: PASS}
      - {ac: "AC3b", test: "redirect_uri=https://evil.example/cb -> non-200 error naming redirect_uri, no redirect to evil.example", status: PASS}
      - {ac: "AC3c", test: "no code_challenge/code_challenge_method is rejected, not the login page", status: PASS}
