incident_during_run: >
  A first `TEST_PARALLEL_N=4 scripts/test_parallel.sh` attempt was launched
  via a manually-backgrounded `nohup ... &` shell job. That approach is
  unreliable on this host: the tool session believed the job had exited
  (immediate empty `ps aux` check after the call returned), but the actual
  Erlang/beam process tree (PID 41757 and its children 41759/41839/41842)
  was still alive and running its own full 4-partition `mix test` invocation
  in the background, invisibly. When the properly-backgrounded second
  attempt (via the Bash tool's own `run_in_background`, PID tree 42629) was
  launched shortly after, both attempts were connecting to the same
  letflow_dev Postgres instance simultaneously (8 total partitions x
  TEST_POOL_SIZE=20 against max_connections=100), which starved out
  partitions 1 and 4 of the second run with `FATAL 53300 too_many_connections`
  and aborted them before any Result: line (exit 1, 0 tests each). Diagnosed
  via `ps -ef` showing the stray PID 41757 tree still running an identical
  `mix test --partitions 4` invocation; killed it (`kill -9` on
  41757/41759/41839/41842), confirmed Postgres back to baseline (6
  connections via `pg_stat_activity`), and reran cleanly. The numbers below
  are from that clean rerun (PID tree 42629, TEST_PARALLEL_GROUP=tp42629),
  the only run with zero connection contention. Lesson for future runs on
  this host: a shell `&`-backgrounded job is not reliably killed just
  because a follow-up `ps aux` check in a new Bash tool call shows nothing --
  always verify with `ps -ef | grep erl` for stray beam processes before
  trusting a "not running" read, and prefer the Bash tool's own
  `run_in_background` over manual `nohup ... &`.
