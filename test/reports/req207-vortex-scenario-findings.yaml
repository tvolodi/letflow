      - "no lib/letflow/entities.ex or entity_query.ex context module exists -- re-verified live this run via File.exists?"
    notes: >
      All 3 signals concur, re-verified live inside the test (not inherited from the
      design session's own finding) -- BLOCKED_ON_DEPENDENCY. The scenario YAML is
      authored and ScenarioFixture.load!/1-parseable (6 via: gui steps,
      pipeline_test field) for record-keeping, but Runner.run/1 is never called on it.
