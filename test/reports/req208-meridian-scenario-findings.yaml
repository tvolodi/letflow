# Populated from a real `mix test test/letflow/simulation/req208_meridian_test.exs`
# run (3 tests, 0 failures, "Result: 3 passed") against real Postgres (Docker,
# letflow-1-postgres-1, port 5463) -- not placeholder values.
# mix compile --warnings-as-errors --force: "Compiling 180 files (.ex) / Generated
# letflow app" (0 warnings). mix letflow.check.test (full suite, 2997 tests + 6
# properties): "Result: 3000/3003 passed (6/6 properties, 2994/2997 tests), 10
# excluded" / "Failed: 3 tests" -- all 3 failures independently re-run in isolation
# and confirmed PRE-EXISTING, environmental, unrelated to REQ-208's own change set
# (test/support/simulation/*, test/fixtures/simulation/meridian/*,
# test/letflow/simulation/req208_meridian_test.exs): (1)
# test/letflow/engine/lua/executor_test.exs's REQ-156 timing-comparison test is
# flaky under full-suite system load -- re-run alone, 48/48 passed; (2/3)
# test/mix/tasks/letflow_check_toolchain_test.exs's 2 "rust pin" tests fail with
# System.cmd("rustc", ...) :enoent because this sandbox has no `rustc` binary on
# PATH at all (confirmed: `which rustc` -> not found) -- an environment-provisioning
# fact, not a REQ-208 regression; re-run alone, same 2/34 failures, same root cause.
# Same "verified not a real regression, reproduced identically outside this run's
# own change set" disposition ISS-0068 already established for this class of
# finding. See lib/letflow/design/req208-meridian-scenario-execution.md §6 for the
# report shape this file was originally meant to implement -- ACTUAL EXECUTION
# DIVERGED SUBSTANTIALLY from that shape for AC1/AC2, per the critical finding
# below. This report states that divergence explicitly rather than forcing the
# design's original placeholders to look green.

requirement: REQ-208

critical_finding: >
  Letflow.Engine.complete_task/3's real, per-call state-rebuild
  (lib/letflow/engine.ex's build_instance_state/3) hardcodes join_counters: %{} on
  EVERY call (confirmed by that function's own code comment: "join_counters is
  always %{} (design doc §6.5, §11 INV-EE48-7, MAJOR OQ-3): no table persists
  JoinCounter state across calls today"), and independently reproduced this
  session against a real running instance. A PARALLEL_GATEWAY join can therefore
  only ever fire within the SAME hop-chain call as its own split -- the instant a
  real, separate HTTP call (any HUMAN_TASK completion on any branch) tries to
  route through the join, it fails with a real HTTP 500
  ({:error, {:activation_failed, {:unknown_branch_id, _}}} internally, mapped to
  INV-4's no-detail 500 at the API boundary). REQ-054 (SnapshotWriter, status:
  done) DOES serialize join_counters correctly into instance_state_snapshots --
  but Engine.complete_task/3's own hot path never reads that table at all; it
  always rebuilds state fresh from tokens/tasks directly. This is a genuine,
  pre-existing platform BLOCKER affecting every process with a PARALLEL_GATEWAY
  split whose branches require separate task completions -- not introduced by,
  or fixable within, REQ-208's own scope. Reported via this run's handoff
  result.issues (new finding, not covered by ISS-0388..0393; ELIXIR-DEV does not
  self-assign an issue id per docs/agents/protocols/ISSUE_QUEUE.md).

req_199_status_at_execution: done   # AC4's own explicit statement, re-verified this
                                     # session from docs/requirements.yaml directly
req_199_caveat: >
  REQ-199 (status: done) protects out-of-band effect completions re-entering the
  engine in order (ORD-01..04). This is now MOOT for the parallel-fork/join shape
  specifically, not merely under-exercised: the critical_finding above means no
  scenario in this codebase can currently drive a PARALLEL_GATEWAY join to fire
  across two separate task-completion calls at all, so there is no in-flight
  concurrent-completion scenario for ORD-01/02/03 to protect on this path yet --
  a stronger statement than the design's own §0.5 anticipated (design assumed the
  join would fire correctly under sequential one-at-a-time completions, merely
  not proving it holds under genuinely concurrent completions; this run found the
  sequential case itself does not work end-to-end across calls). See design
  §0.5/§7 -- reported as a follow-up-issue-worthy finding.

