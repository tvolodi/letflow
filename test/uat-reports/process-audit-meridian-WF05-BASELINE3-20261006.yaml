checklist:
  - item: A1
    answer: YES
    evidence: >
      In the loan definition the eligibility-gate, l1-approval, l2-approval and committee-tally all have a
      branch to decline-application; in the compliance definition findings-sign-off and ceo-override both
      have a reject-and-reopen branch to reopen-review.
  - item: A2
    answer: NOT_APPLICABLE
    evidence: >
      No scenario step, scenario description or node name in the three meridian scenarios or two definitions
      speaks of the requester correcting and resubmitting, or of something being returned for correction
      (the reopen-review node ends the review, it does not send work back to a requester).
  - item: A3
    answer: YES
    evidence: >
      The checker output for both definitions lists no violation codes, and every decline or reopen branch
      found under A1 reaches end-declined, end-closed or end-reopened.
  - item: A4
    answer: NO
    evidence: >
      In the loan definition l1-approval, l2-approval and disburse-loan have neither an escalation timer and
      escalation person, nor a timeout route; in the compliance definition ceo-override has none either, and
      no description says waiting without limit is intended.
  - item: B1
    answer: YES
    evidence: >
      The scenarios start the loan with the two analysts (no approval duty) and the review with the
      compliance officer, who does not hold the risk, chief risk officer or chief executive approval duties
      in the roster; no approval task is left without a route.
  - item: B2
    answer: NO
    evidence: >
      In the loan definition credit-memo-review and l1-approval both go to the credit manager (the same
      person acts in steps 2 and 4 of the below-threshold scenario), and the three committee vote tasks all
      go to one shared committee role.
  - item: C1
    answer: NO
    evidence: >
      The checker lists no missing values, but reading the compliance definition shows that
      post-remediation-check decides on the remediation outcome while remediation-subprocess names no child
      process that could supply it.
  - item: D1
    answer: YES
    evidence: >
      Every person step in the three scenarios matches a human task (credit-memo-review, risk-assessment,
      committee votes, l1-approval, l2-approval, disburse-loan, evidence-collection) or a start, and both
      process ids resolve through the two meridian sidecar files.
  - item: D2
    answer: NO
    evidence: >
      No scenario completes kyc-manual-review in the loan definition, and no scenario completes
      risk-evaluation, findings-sign-off or ceo-override in the compliance definition.
  - item: D3
    answer: YES
    evidence: >
      Every role used by a meridian human task has a roster actor (credit manager Ben, risk manager Miriam,
      compliance officer Claudia, credit director Julia, committee Julia/Thomas/Eva, loan operations Marcus,
      chief risk officer Thomas, chief executive Eva), all nine scenario actors exist in the roster, and the
      checker raised no unbound-role warning.
  - item: D4
    answer: NO
    evidence: >
      The analysts Lars and Sophie, the compliance officer Claudia (starting a review) and the chief
      executive Eva (advancing the review timer) are listed with the ordinary worker role only, which the
      role charter says cannot start processes or advance timers; and seed_meridian_persona_actors.sh also
      provisions Oliver, who is not in the roster.
  - item: E1
    answer: NO
    evidence: >
      Meridian has approving and releasing money (l1-approval, l2-approval, committee votes, disburse-loan)
      and personal or sensitive data, yet none of the three scenario files has a step with expect_refusal;
      the roster's refusal_coverage_exempt entry does not change this answer.
  - item: E2
    answer: NOT_APPLICABLE
    evidence: >
      No meridian actor in the roster holds an administrator role (all nine hold the ordinary worker role
      only), so there is no administrator doing a business step.
  - item: E3
    answer: YES
    evidence: >
      The meridian actors' steps (starting, completing tasks, advancing a review timer) are all tenant-level
      abilities in the role charter; none needs a platform-only ability such as managing tenants.
  - item: F1
    answer: NO
    evidence: >
      Compared with swiftroute Shipment Approval and vortex Production Order Release, the meridian
      authority-routing default sends an unclear amount to decline, whereas the others send it to the
      senior approver, and meridian human-task timeouts only raise a flag and carry on, whereas the others
      escalate or auto-reject; the meridian description explains fail-closed only for the KYC check.

findings:
  - id: PA-MERIDIAN-001
    severity: MAJOR
    checklist_item: A4
    business_description: >
      The first-level and second-level loan approvals and the final loan payout step have no deadline and
      nobody is told if they are left waiting, so an applicant's loan can sit unanswered, or approved funds
      never be released, without anyone noticing.
    affected:
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: tasks l1-approval, l2-approval and disburse-loan (no escalation and no timeout route)
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-002
    severity: MAJOR
    checklist_item: A4
    business_description: >
      When the chief executive is asked to decide on a compliance review that the risk-sign-off chain could
      not close, nothing happens if the chief executive does not act, so a regulatory review could stay open
      indefinitely.
    affected:
      - path: test/fixtures/qa/meridian_regulatory_compliance_review_process_definition.json
        where: task ceo-override (no escalation and no timeout route)
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-003
    severity: MAJOR
    checklist_item: B2
    business_description: >
      The credit manager who writes the credit review for a loan is the same job that gives the first-level
      approval of that loan, so one person can review and then approve their own assessment with no second
      pair of eyes at that level.
    affected:
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: tasks credit-memo-review and l1-approval, both assigned to the credit manager
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-below-threshold.yaml
        where: steps 2 and 4, both performed by the same credit manager
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-004
    severity: MAJOR
    checklist_item: B2
    business_description: >
      The three committee votes on a large loan are all handed to the same pool of committee members, and
      nothing in the design says that three different people must cast them, so one member could cast more
      than one of the votes that make up the two-of-three decision.
    affected:
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: tasks committee-vote-cro, committee-vote-director and committee-vote-ceo, all assigned to the same committee role
    suggested_owner: SECURITY-REVIEWER

  - id: PA-MERIDIAN-005
    severity: MAJOR
    checklist_item: C1
    business_description: >
      When a compliance review has a critical finding it is passed to a remediation step that names no
      follow-up process, yet the next decision depends on that step reporting whether the problem was
      resolved; as designed it can only fall to the unresolved outcome, so every critical finding is
      reported to the regulator as unresolved.
    affected:
      - path: test/fixtures/qa/meridian_regulatory_compliance_review_process_definition.json
        where: remediation-subprocess (no child process named) feeding post-remediation-check
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-006
    severity: MAJOR
    checklist_item: D2
    business_description: >
      The manual compliance review of a suspected or unclear anti-money-laundering result is part of the loan
      process but no scenario ever walks through it, so the step that decides whether a flagged applicant may
      continue is never checked.
    affected:
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: task kyc-manual-review
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-above-threshold.yaml
        where: no step covers the manual review (both loan scenarios take the clear screening path)
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-007
    severity: MAJOR
    checklist_item: D2
    business_description: >
      The risk evaluation, the chief risk officer's sign-off and the chief executive's override in the
      compliance review are never carried out in any scenario, so the normal ways a review is closed or
      reopened are never checked, only the late-escalation path.
    affected:
      - path: test/fixtures/qa/meridian_regulatory_compliance_review_process_definition.json
        where: tasks risk-evaluation (completed), findings-sign-off and ceo-override
      - path: test/fixtures/uat/scenarios/meridian/regulatory-compliance-review-bafin.yaml
        where: steps 1 to 3 cover only evidence collection and the timer escalation
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-008
    severity: MAJOR
    checklist_item: D4
    business_description: >
      The people who submit a loan application or start a compliance review, and the chief executive who
      advances the review clock, are recorded with only the ordinary task-worker access, which does not allow
      starting a process or moving a timer, so their scenario steps cannot be done by the people as recorded.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actors actor-meridian-lars, actor-meridian-sophie, actor-meridian-claudia and actor-meridian-eva
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-above-threshold.yaml
        where: step 1 (analyst submits the application)
      - path: test/fixtures/uat/scenarios/meridian/regulatory-compliance-review-bafin.yaml
        where: step 1 (compliance officer starts the review) and step 3 (chief executive advances the timer)
    suggested_owner: SECURITY-REVIEWER

  - id: PA-MERIDIAN-009
    severity: MAJOR
    checklist_item: D4
    business_description: >
      The set-up script creates a company login for one more person, Oliver Krug, who is not listed in the
      list of approved test users, so an account exists that nobody has recorded or reviewed.
    affected:
      - path: scripts/seed_meridian_persona_actors.sh
        where: the persona line for actor-meridian-oliver
      - path: test/fixtures/uat/actors.yaml
        where: no entry for actor-meridian-oliver
    suggested_owner: ORCH

  - id: PA-MERIDIAN-010
    severity: MAJOR
    checklist_item: E1
    business_description: >
      Meridian approves and pays out loans and handles applicants' personal and financial data, but none of
      its scenarios checks that someone who is not allowed to approve, release money or see that data is
      turned away, so wrongly granted access would go unnoticed.
    affected:
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-above-threshold.yaml
        where: no refusal step for approving, releasing loan money or seeing applicant data
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-below-threshold.yaml
        where: no refusal step
      - path: test/fixtures/uat/scenarios/meridian/regulatory-compliance-review-bafin.yaml
        where: no refusal step
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-011
    severity: MAJOR
    checklist_item: F1
    business_description: >
      Meridian handles a missed deadline and an unclear approval amount differently from the other
      companies: a missed deadline only raises a flag and the case carries on, and an unclear amount is
      declined, whereas the others escalate or reject; the difference is not explained for the business.
    affected:
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: timeout routes of the human tasks and the default route of authority-routing
    suggested_owner: BA-MERIDIAN

verdict: PASS_WITH_FINDINGS
verdict_note: >
  Meridian's loan and compliance processes end properly and decline or reopen when they should, but they leave several
  approval and review steps without a deadline, without independent checking, or without any scenario that exercises them, so the design is usable but not yet fully safe.
