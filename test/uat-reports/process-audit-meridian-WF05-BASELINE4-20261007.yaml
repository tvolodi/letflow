checklist:
  - item: A1
    answer: YES
    evidence: >
      In the loan definition every decision has a branch that ends without approval: the eligibility
      gate, the authority routing and the committee tally all fall to decline-application, the first and
      second level approvals have a reject branch, and a rejected or lapsed KYC review declines. In the
      compliance definition the CRO sign-off and CEO override can reject and reopen, and an unresolved
      remediation ends in a regulatory notice instead of sign-off.
  - item: A2
    answer: YES
    evidence: >
      No scenario or node says a requester can correct and resubmit. The only return-like wording is
      the reopen-review node and the reject_and_reopen choice in the compliance definition, which reopens
      the review in the compliance system and ends on end-reopened; no in-process rework loop is described
      as needed.
  - item: A3
    answer: YES
    evidence: >
      The validator output for both definitions is OK with no unreachable_node, no_path_to_end or
      no_default_route. Every decline and reject branch I traced in the loan definition reaches
      end-declined, and in the compliance definition reaches end-closed or end-reopened.
  - item: A4
    answer: YES
    evidence: >
      Every human task in both definitions, including all escalation tasks, carries both
      escalation_timer_duration and escalation_role (for example l1-approval P2D, disburse-loan P1D,
      evidence-collection P7D, remediation-subprocess P30D), and each description states where a stalled
      task ends.
  - item: B1
    answer: NO
    evidence: >
      The loan definition has no route on its start, and the roster gives the first-level approval
      role to Lars while the above-threshold scenario names Lars as the analyst who submits the
      application; nothing in the design stops the person who submits a loan from also approving it at
      first level. The below-threshold scenario uses a different analyst (Sophie) and the credit memo
      reviewer (Ben) is now separate from the first-level approver.
  - item: B2
    answer: YES
    evidence: >
      The credit memo reviewer (credit-memo-review, role-credit-manager, Ben) and the first-level
      approver (l1-approval, role-credit-approver-l1, Lars) are now different roles held by different
      roster actors; in the compliance definition evidence collection, risk evaluation and CRO sign-off
      route to three different roles.
  - item: C1
    answer: YES
    evidence: >
      The validator lists no variable_never_collected for either definition. On reading, the decisions
      eligibility-gate, authority-routing, committee-tally, severity-routing and post-remediation-check
      may read values a timed-out path never collects, but each has a decline or reopen default that
      fails closed and the descriptions say so.
  - item: D1
    answer: NO
    evidence: >
      Both proc- process ids resolve through the sidecars in the aliases folder. However the BaFin
      scenario step 3 gives a CEO step that the compliance definition does not have on that path (the
      timer goes straight to regulatory-auto-escalation and end-closed), and the KYC manual review
      scenario step 2 records only review notes, not the cleared outcome that the kyc-manual-review form
      and eligibility-gate read.
  - item: D2
    answer: NO
    evidence: >
      No meridian scenario has a step for credit-memo-escalation-review, risk-assessment-escalation-review,
      escalate-l2-approval-to-ceo, escalate-disburse-loan-to-credit-director or remediation-subprocess;
      all other human tasks of both definitions appear in at least one scenario.
  - item: D3
    answer: YES
    evidence: >
      Every routed role (credit manager, first-level approver, risk manager, compliance officer,
      credit director, CRO, CEO, loan operations) has a meridian actor in actors.yaml, the validator
      shows no unbound-role warning, and every scenario actor (Ben, Miriam, Claudia, Julia, Thomas, Eva,
      Marcus, Lars, Sophie) exists under actors.
  - item: D4
    answer: NO
    evidence: >
      All meridian actors hold only the ordinary task-worker role. The charter says that role must not
      start instances, yet Sophie and Lars submit loan applications and Claudia initiates compliance
      reviews in the scenarios. The persona seed script grants nothing beyond the roster.
  - item: E1
    answer: NO
    evidence: >
      Meridian has approving (credit approvals and committee votes), paying or releasing (disbursement)
      and seeing sensitive data (KYC and credit files), but none of the six scenarios has a step with
      expect_refusal true. The refusal_coverage_exempt entry in actors.yaml does not change this answer.
  - item: E2
    answer: NOT_APPLICABLE
    evidence: >
      No meridian actor in actors.yaml holds an administrator role (all are ordinary task workers),
      so the condition "scope has no actor holding an administrator role" applies.
  - item: E3
    answer: YES
    evidence: >
      Every meridian step, including advancing a waiting timer, is a tenant-scope action in the role
      charter; no meridian actor depends on tenant management or another platform-only permission.
  - item: F1
    answer: YES
    evidence: >
      Compared with the shipment approval and the two vortex definitions, meridian uses the same
      escalation pattern (timer, then higher role, then fail closed), the same amount-threshold branch with
      a default route, and explains its longer financial durations and its fail-closed defaults in its own
      description.

findings:
  - id: PA-MERIDIAN-001
    severity: BLOCKER
    checklist_item: B1
    business_description: >
      The analyst who submits a loan application in the large-loan scenario is Lars, who is also the
      credit colleague the process sends first-level approvals to. The process does not say who may
      submit a loan, so nothing stops the same person from submitting a loan and then giving the first
      approval on it, which defeats the independent check on lending.
    affected:
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-above-threshold.yaml
        where: actors, the analyst is Lars, and step 1 submission
      - path: test/fixtures/uat/actors.yaml
        where: actor-meridian-lars, holds the first-level approval route
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: start node (no route) and l1-approval node
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-002
    severity: MAJOR
    checklist_item: D1
    business_description: >
      The BaFin scenario says the late risk evaluation is escalated to the CEO and gives the CEO a step,
      but the process only files the regulatory notice and closes; the CEO is never asked to do anything.
      A reader would believe a senior person is alerted when the review is late, and the process does
      not do that.
    affected:
      - path: test/fixtures/uat/scenarios/meridian/regulatory-compliance-review-bafin.yaml
        where: step 3 (CEO), and its description of escalating to the CEO
      - path: test/fixtures/qa/meridian_regulatory_compliance_review_process_definition.json
        where: risk-evaluation timeout route to regulatory-auto-escalation
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-003
    severity: MAJOR
    checklist_item: D1
    business_description: >
      In the KYC manual review scenario the compliance officer is described as clearing the applicant,
      but the step records only review notes, not the cleared result the process reads. Without that
      result the process declines the loan, so the scenario's expected disbursement would not happen and
      the test could fail or be misread.
    affected:
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-kyc-manual-review.yaml
        where: step 2 input, kyc_review_notes only
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: kyc-manual-review form and eligibility-gate
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-004
    severity: MAJOR
    checklist_item: D2
    business_description: >
      Five human steps are never exercised by any scenario: the credit memo and risk assessment
      escalation reviews, the CEO's second look at a late credit director decision, the credit director's
      handling of a late disbursement, and the remediation of critical compliance findings. The paths
      that matter most when people are slow, or when findings are critical, are untested.
    affected:
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: credit-memo-escalation-review, risk-assessment-escalation-review, escalate-l2-approval-to-ceo, escalate-disburse-loan-to-credit-director
      - path: test/fixtures/qa/meridian_regulatory_compliance_review_process_definition.json
        where: remediation-subprocess
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-005
    severity: MAJOR
    checklist_item: D4
    business_description: >
      The people who submit loan applications and start compliance reviews have only ordinary
      task-worker access, which the role charter says does not allow starting a process. As recorded, they
      either could not do the first step of their job, or would need more access than the roster shows.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actor-meridian-sophie, actor-meridian-lars and actor-meridian-claudia, built-in role
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-below-threshold.yaml
        where: step 1, analyst (Sophie) submits the application
      - path: test/fixtures/uat/scenarios/meridian/regulatory-compliance-review-bafin.yaml
        where: step 1, compliance officer (Claudia) initiates the review
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-006
    severity: MAJOR
    checklist_item: E1
    business_description: >
      None of the meridian scenarios checks that someone without the right job is refused when trying to
      approve a loan, release a disbursement or look at sensitive credit and KYC files. We do not know
      that an ordinary clerk cannot approve or pay out a loan.
    affected:
      - path: test/fixtures/uat/scenarios/meridian
        where: all six scenario files, no step marked as expected refusal
      - path: test/fixtures/uat/actors.yaml
        where: refusal_coverage_exempt lists meridian
    suggested_owner: BA-MERIDIAN

