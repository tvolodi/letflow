checklist:
  - item: A1
    answer: YES
    evidence: >
      In the loan definition every decision has a decline outcome: the eligibility gate and the authority
      routing default to decline-application, the first-level approval and second-level approval have a reject
      edge, and the committee tally declines on two rejections or by default. In the compliance definition the
      CRO's reject_and_reopen edge, the CEO's reject_and_reopen edge and the post-remediation check default all
      end the matter without sign-off.
  - item: A2
    answer: NOT_APPLICABLE
    evidence: >
      A search of all six meridian scenarios found no mention of correction, resubmission, rework or return for
      correction, and no node name in either definition suggests it; the only reversal is the compliance
      review being reopened, which ends on end-reopened without a loop back.
  - item: A3
    answer: YES
    evidence: >
      The validator output for both definitions lists no unreachable_node, no_path_to_end or no_default_route.
      Every rejection branch from A1 reaches an end node (decline-application to end-declined, reopen-review to
      end-reopened, remediation-unresolved-escalation to end-closed).
  - item: A4
    answer: YES
    evidence: >
      All 13 human tasks in the loan definition (including the four escalation review tasks) and all 5 in the
      compliance definition carry both an escalation timer duration and an escalation role, and each has a
      timeout edge that ends in a fail-closed or higher-authority step.
  - item: B1
    answer: YES
    evidence: >
      The loan is submitted by the analyst (actor-meridian-sophie), who holds no routing role, while the
      approvals route to the L1 approver, credit director, CRO and CEO roles held by other actors. The
      compliance review is started by actor-meridian-claudia, who holds only the compliance officer role, and
      its sign-offs route to the CRO and CEO roles; every approval task has a route.
  - item: B2
    answer: NO
    evidence: >
      On the escalated paths the person who records a value also takes the next decision on the same matter:
      credit-memo-escalation-review and l2-approval and committee-vote-director all route to the credit
      director role (actor-meridian-julia), and risk-assessment-escalation-review and committee-vote-cro both
      route to the CRO role (actor-meridian-thomas). The normal path (credit manager, independent L1 approver)
      is separated.
  - item: C1
    answer: YES
    evidence: >
      The validator lists no variable_never_collected for either definition. Values that some paths leave unset
      (kyc_outcome on a clear screening, credit_decision or risk_rating after a stalled escalation review,
      lapsed committee votes) are read only at gateways that carry an explicit default decline branch, and the
      definition descriptions state this on purpose.
  - item: D1
    answer: YES
    evidence: >
      Every step in the six scenarios maps to a start or to a human task (for example credit-memo-review,
      risk-assessment, l1-approval, l2-approval, the three committee votes, disburse-loan, kyc-manual-review,
      evidence-collection, risk-evaluation, findings-sign-off, ceo-override), and both process ids resolve
      through the sidecar files proc-meridian-loan-origination and proc-meridian-regulatory-compliance-review.
  - item: D2
    answer: NO
    evidence: >
      No scenario step exists for the loan tasks credit-memo-escalation-review, risk-assessment-escalation-review,
      escalate-l2-approval-to-ceo and escalate-disburse-loan-to-credit-director, nor for the compliance task
      remediation-subprocess; all other human tasks appear in at least one scenario.
  - item: D3
    answer: YES
    evidence: >
      Every role the human tasks route to (credit manager, L1 approver, credit director, risk manager, CRO,
      CEO, compliance officer, loan operations) is held by a meridian actor in the roster (ben, lars, julia,
      miriam, thomas, eva, claudia, marcus), the validator gave no unbound-role warning, and all nine scenario
      actors exist under actors in the roster; none is under unresolved.
  - item: D4
    answer: NO
    evidence: >
      actor-meridian-sophie (loan submission, step 1 of three loan scenarios) and actor-meridian-claudia
      (compliance review initiation, step 1 of three compliance scenarios) hold only the basic task-completion
      access in the roster, which the role charter says cannot start instances. The seed script grants nothing
      beyond the roster; the other actors only complete assigned tasks.
  - item: E1
    answer: NO
    evidence: >
      Meridian has approving (credit and committee decisions, CRO and CEO sign-off), paying or releasing
      (disburse-loan) and seeing personal or commercially sensitive data (borrower KYC and loan files), yet none
      of the six meridian scenarios contains a step with expect_refusal true; being listed as exempt in the
      roster does not change this.
  - item: E2
    answer: NOT_APPLICABLE
    evidence: >
      No actor used by the meridian scenarios or listed for meridian in the roster holds the platform
      administrator or tenant administrator role; all hold only the task-completion access.
  - item: E3
    answer: YES
    evidence: >
      Every meridian scenario step is a submission or a task completion inside the tenant; no step by a
      meridian actor needs a platform-scope permission (the timer advance in the compliance scenarios is
      performed by the test runner, not by the actor).
  - item: F1
    answer: YES
    evidence: >
      Compared with swiftroute's shipment approval and vortex's production order release: amount thresholds
      route to higher authority with a fail-closed default, timers escalate to a higher role and then fail
      closed, and the loan definition's own description documents its deviations (committee votes fail closed
      directly, repeated escalation role at the top of a chain, durations aligned to the financial default).
      The approach is consistent.

findings:
  - id: PA-MERIDIAN-001
    severity: MAJOR
    checklist_item: B2
    business_description: >
      When a credit memo or a risk assessment is not finished in time, the matter is escalated to the credit
      director or the Chief Risk Officer, who then records the credit decision or risk rating themselves. The
      same person can then also give the second-level approval or cast a committee vote on the same loan. For a
      large loan there is no independent first-level check in between, so one person can both supply the
      assessment and vote to approve the loan on it.
    affected:
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: credit-memo-escalation-review, l2-approval and committee-vote-director (all the credit director's work); risk-assessment-escalation-review and committee-vote-cro (both the CRO's work)
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-002
    severity: MAJOR
    checklist_item: D2
    business_description: >
      Four escalation steps in the loan process (the credit director reviewing a late credit memo, the CRO
      reviewing a late risk assessment, the CEO deciding a late second-level approval, and the credit director
      completing a late disbursement) are never exercised by any acceptance scenario. If one of these steps is
      mis-routed or does not produce the value the decline rule relies on, a loan could be stuck or wrongly
      declined or held without anyone having noticed before go-live.
    affected:
      - path: test/fixtures/qa/meridian_loan_origination_process_definition.json
        where: credit-memo-escalation-review, risk-assessment-escalation-review, escalate-l2-approval-to-ceo, escalate-disburse-loan-to-credit-director
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-below-threshold.yaml
        where: no escalation scenario exists for the loan process
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-003
    severity: MAJOR
    checklist_item: D2
    business_description: >
      The remediation of critical compliance findings, done by the compliance officer, is never exercised by any
      scenario. The critical-findings path is the one that decides whether a bank files an unresolved-remediation
      notice with the regulator or goes on to sign-off, and it has never been rehearsed end to end.
    affected:
      - path: test/fixtures/qa/meridian_regulatory_compliance_review_process_definition.json
        where: remediation-subprocess (and its resolved and unresolved outcomes)
      - path: test/fixtures/uat/scenarios/meridian/regulatory-compliance-review-cro-signoff.yaml
        where: only the medium-severity path is covered
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-004
    severity: MAJOR
    checklist_item: D4
    business_description: >
      The loan analyst who submits a loan application and the compliance officer who starts a compliance review
      are set up with the basic access of an ordinary task worker, which the role charter says does not allow
      starting a process. As written, the first step of three loan scenarios and three compliance scenarios
      cannot be done by the person the scenario names, so those scenarios would be blocked or would hide a
      wrong access setup.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actor-meridian-sophie and actor-meridian-claudia
      - path: scripts/seed_meridian_persona_actors.sh
        where: personas actor-meridian-sophie and actor-meridian-claudia
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-above-threshold.yaml
        where: step 1 (analyst submits the loan)
      - path: test/fixtures/uat/scenarios/meridian/regulatory-compliance-review-bafin.yaml
        where: step 1 (compliance officer initiates the review)
    suggested_owner: BA-MERIDIAN

  - id: PA-MERIDIAN-005
    severity: MAJOR
    checklist_item: E1
    business_description: >
      None of the Meridian scenarios checks that a person who must not approve a loan, release a disbursement
      or see a borrower's sensitive KYC details is actually turned away. The bank cannot show that, for example,
      the loan analyst cannot approve a loan or that a non-compliance colleague cannot open a KYC review.
    affected:
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-below-threshold.yaml
        where: no refusal step for approving or for releasing a disbursement
      - path: test/fixtures/uat/scenarios/meridian/loan-origination-kyc-manual-review.yaml
        where: no refusal step for seeing personal KYC data
    suggested_owner: BA-MERIDIAN

verdict: PASS_WITH_FINDINGS
verdict_note: >
  The Meridian process design ends every outcome and has no blocking gap, but it has five open weaknesses
  (independence on escalated paths, unexercised escalation and remediation steps, the starting actors' access,
  and no refusal checks), so it can run but should not be called fully verified.
