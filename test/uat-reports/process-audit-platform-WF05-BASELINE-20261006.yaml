findings:
  - id: PA-PLATFORM-001
    severity: BLOCKER
    checklist_item: B1
    business_description: >
      A process change reaches the live workspace only after a named person approves it, but nothing in the design
      says that person cannot be the one who wrote and submitted the change. The only human platform operator in
      the roster is shown both preparing a process for release and, in the promotion scenarios, approving the
      release. One person could therefore approve their own change to a live business process.
    affected:
      - path: test/fixtures/uat/scenarios/platform/definition-type-error-blocked.yaml
        where: step 5, the author submits the corrected process for release
      - path: test/fixtures/uat/scenarios/platform/definition-promotion-approved.yaml
        where: steps 3 and 5, the reviewer approves and releases
      - path: test/fixtures/uat/actors.yaml
        where: actor-platform-admin, the only human platform actor
    suggested_owner: REQ-ANALYST

  - id: PA-PLATFORM-002
    severity: MAJOR
    checklist_item: D4
    business_description: >
      Two company staff members are shown doing jobs that their recorded access does not allow. The dispatcher
      attaches a signed delivery note to a task, and the operations manager cancels a shipment request. In the
      roster both are ordinary task workers, who are not allowed to do either. A run of these scenarios would
      either be blocked on those steps or would only pass if the roster gives them more access than recorded.
    affected:
      - path: test/fixtures/uat/scenarios/platform/attachment-cross-tenant-probe.yaml
        where: step 1, actor swiftroute_dispatcher (actor-swiftroute-lena)
      - path: test/fixtures/uat/scenarios/platform/tenant-branding-applied.yaml
        where: step 6, actor business_user (actor-swiftroute-marco)
      - path: test/fixtures/uat/actors.yaml
        where: entries actor-swiftroute-lena and actor-swiftroute-marco
    suggested_owner: REQ-ANALYST

  - id: PA-PLATFORM-003
    severity: MAJOR
    checklist_item: E1
    business_description: >
      The platform scenarios cover approving and releasing process changes, one company seeing another's
      documents and data, and removing a person's access, yet not one step checks that a person who is not allowed
      to do these things is turned away. The design therefore never proves that an ordinary staff member cannot
      approve a release, open another company's information or change who has access.
    affected:
      - path: test/fixtures/uat/scenarios/platform/definition-promotion-approved.yaml
        where: approval and release steps, no refusal step
      - path: test/fixtures/uat/scenarios/platform/attachment-cross-tenant-probe.yaml
        where: steps 2 and 3, foreign user's attempts, not marked as expected refusals
      - path: test/fixtures/uat/scenarios/platform/renderer-permission-denied-surface.yaml
        where: steps 3 and 4, access removed, not marked as expected refusals
      - path: test/fixtures/uat/actors.yaml
        where: platform listed under the scopes exempt from refusal coverage
    suggested_owner: REQ-ANALYST

  - id: PA-PLATFORM-004
    severity: MAJOR
    checklist_item: E2
    business_description: >
      The SwiftRoute chief executive, a person at a customer company, is recorded as holding the platform operator's
      all-powerful access, and she is the company administrator in two platform scenarios. A customer's own person
      should not carry the platform operator's power, and the scenarios would pass even if she had only company-level
      rights. This is the one known legacy case and the roster dates it.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actor-swiftroute-alice, builtin roles and the legacy platform administrator list
      - path: test/fixtures/uat/scenarios/platform/renderer-permission-denied-surface.yaml
        where: step 2, actor tenant_admin
      - path: test/fixtures/uat/scenarios/platform/tenant-branding-applied.yaml
        where: steps 1, 4 and 5, actor tenant_admin
    suggested_owner: ORCH

  - id: PA-PLATFORM-005
    severity: MAJOR
    checklist_item: E2
    business_description: >
      The platform operator's login is used to do company-level work: browsing two customers' running processes and
      task forms, acting as a company's own administrator when reviewing a process pack update, and starting cases.
      The platform operator is meant to run the platform, not to look at or work inside a customer's business data.
      The tenant-switch scenario also assumes this one login is a member of two customer companies at the same time.
    affected:
      - path: test/fixtures/uat/scenarios/platform/tenant-switch-cache-isolation.yaml
        where: steps 1 to 5 and the second precondition, actor dual_company_user
      - path: test/fixtures/uat/scenarios/platform/template-update-conflict-resolution.yaml
        where: steps 2 to 5, actor tenant_admin
      - path: test/fixtures/uat/scenarios/platform/definition-promotion-rollback.yaml
        where: step 2 and step 4, the operator starts cases
      - path: test/fixtures/uat/scenarios/platform/instance-pin-survives-catalog-change.yaml
        where: steps 1 and 4, the operator starts cases
    suggested_owner: SECURITY-REVIEWER

verdict: FAIL
verdict_note: >
  This scope's design is not safe to run as it stands, because nothing stops the one human platform operator from approving their own release of a process change.
