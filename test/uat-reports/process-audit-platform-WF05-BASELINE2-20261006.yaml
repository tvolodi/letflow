findings:
  - id: PA-PLATFORM-001
    severity: MAJOR
    checklist_item: D4
    business_description: >
      Two SwiftRoute scenarios have an ordinary worker doing something the role charter does not let an
      ordinary worker do. The dispatcher is asked to attach the signed delivery note to a task, and the
      operations manager is asked to cancel a shipment request. As rostered, both would be turned away,
      so these steps could not pass, or the people would have to be given more access than their job
      description allows.
    affected:
      - path: test/fixtures/uat/scenarios/platform/attachment-cross-tenant-probe.yaml
        where: step 1, the SwiftRoute dispatcher (actor-swiftroute-lena) attaches the delivery note
      - path: test/fixtures/uat/scenarios/platform/tenant-branding-applied.yaml
        where: step 6, the operations manager (actor-swiftroute-marco) cancels a shipment request
      - path: test/fixtures/uat/actors.yaml
        where: entries for actor-swiftroute-lena and actor-swiftroute-marco
    suggested_owner: REQ-ANALYST
  - id: PA-PLATFORM-002
    severity: MAJOR
    checklist_item: D4
    business_description: >
      Where a company administrator is needed, the scenarios use either the platform operator's own
      login or a SwiftRoute person who is rostered with the all-powerful platform administrator role.
      The company-level steps (applying a supplied process pack update, removing someone's access,
      changing company colours) need only a company administrator, so these people hold more power
      than the steps need.
    affected:
      - path: test/fixtures/uat/scenarios/platform/template-update-conflict-resolution.yaml
        where: actor tenant_admin is the platform administrator login (actor-platform-admin), steps 2 to 5
      - path: test/fixtures/uat/scenarios/platform/renderer-permission-denied-surface.yaml
        where: actor tenant_admin is actor-swiftroute-alice, step 2
      - path: test/fixtures/uat/scenarios/platform/tenant-branding-applied.yaml
        where: actor tenant_admin is actor-swiftroute-alice, steps 1, 4 and 5
      - path: test/fixtures/uat/actors.yaml
        where: entry for actor-swiftroute-alice (platform administrator role plus legacy list)
    suggested_owner: REQ-ANALYST
  - id: PA-PLATFORM-003
    severity: MAJOR
    checklist_item: E1
    business_description: >
      The platform scenarios cover approving a change, releasing a change to the live workspace, one
      company trying to see another company's data, and changing who has access, but none of them has a
      step where a person who is not allowed to do these things tries and is refused. We would not
      know from a run that the wrong person is actually stopped.
    affected:
      - path: test/fixtures/uat/scenarios/platform/definition-promotion-approved.yaml
        where: steps 3 (approve) and 5 (release) have no refused counterpart
      - path: test/fixtures/uat/scenarios/platform/renderer-permission-denied-surface.yaml
        where: step 2 changes someone's access; the refused view in step 3 is not marked as an expected refusal
      - path: test/fixtures/uat/scenarios/platform/attachment-cross-tenant-probe.yaml
        where: step 2, the other company's user is refused, not marked as an expected refusal
    suggested_owner: REQ-ANALYST
  - id: PA-PLATFORM-004
    severity: MAJOR
    checklist_item: E2
    business_description: >
      The platform operator's login is used to work inside customer companies: it switches between
      SwiftRoute and Vortex and reads their running processes and a task form, and it acts as a company
      administrator on a supplied process pack. The charter says platform staff must not act inside a
      customer company or read its business data. Also, a SwiftRoute person (the company administrator)
      is rostered with the platform administrator role, which the roster records as a temporary legacy
      arrangement.
    affected:
      - path: test/fixtures/uat/scenarios/platform/tenant-switch-cache-isolation.yaml
        where: actor dual_company_user (actor-platform-admin), steps 1, 2, 4 and 5
      - path: test/fixtures/uat/scenarios/platform/template-update-conflict-resolution.yaml
        where: actor tenant_admin (actor-platform-admin), steps 2 to 5
      - path: test/fixtures/uat/actors.yaml
        where: actor-swiftroute-alice and the legacy platform administrator list
    suggested_owner: REQ-ANALYST

verdict: PASS_WITH_FINDINGS
verdict_note: >
  The platform scope has no process definition to run, but its scenarios give ordinary workers jobs they may not do, use all-powerful logins for company-level work, and never test that an unauthorised person is refused, so the design should be corrected before it is relied on.
