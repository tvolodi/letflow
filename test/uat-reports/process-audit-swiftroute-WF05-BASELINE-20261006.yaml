  - item: D4
    answer: NO
    evidence: >
      actor-swiftroute-lena holds only the ordinary task-worker role yet starts shipments (step 1 of all
      shipment scenarios) and attaches documents (steps 2 to 4 of shipment-attach-delivery-note.yaml), which that
