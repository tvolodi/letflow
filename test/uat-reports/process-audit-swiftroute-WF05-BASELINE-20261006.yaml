  - item: F1
    answer: YES
    evidence: >
      Compared with the Meridian loan and compliance definitions and the Vortex order release and quality
      deviation definitions in cross_scope_inputs, Shipment Approval models amount routing (a gateway whose
      default goes to the more senior approval), rejection (notify or auto-reject then an end node), CEO
      escalation and the unconditioned fallback branch in the same way as they do. The amount figure carries no
      currency in its name (declared_value, against requested_amount_eur and order_value_eur elsewhere), which
      I recorded here but did not count as a different modelling.

findings:
  - id: PA-SWIFTROUTE-001
    severity: BLOCKER
    checklist_item: A3
    business_description: >
      The shipment approval has no declared fall-back answer for the operations manager's review or for the
      CEO's approval. If the answer is anything other than a clear approve or reject, or the review times out,
      the shipment's next step depends on an unmarked catch-all branch, so a shipment can be sent on to the CEO,
      rejected, or left unfinished without anyone having decided that. The automatic check of this process
      reports exactly this gap.
    affected:
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: Operations review task, its branch to the CEO that has no condition and is not marked as the default
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: CEO approval task, its unconditioned branch to automatic rejection that is not marked as the default
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-002
    severity: MAJOR
    checklist_item: A4
    business_description: >
      If the CEO does not act on a high-value shipment, nothing happens: the shipment waits forever and the
      driver pool is never told. The same is true of the operations and finance assessments in the driver
      incident process, where the finance estimate has no time limit and no one to escalate to.
    affected:
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: CEO approval task has no escalation time or escalation owner
      - path: test/fixtures/simulation/swiftroute/process_shipment_dispatch.yaml
        where: Operations assessment task and finance estimate task have no escalation time or escalation owner
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-003
    severity: BLOCKER
    checklist_item: B1
    business_description: >
      The CEO can both raise a shipment request and approve it herself, because her account carries
      administrator powers that include starting shipments. Separately, when the operations manager is slow the
      review is escalated to the CEO, and for a high-value shipment the same CEO is then asked to give the
      second co-signature too, so one person can supply both approvals the company policy intends to come from
      two people before a shipment is released.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actor-swiftroute-alice, CEO route plus administrator role (legacy platform administrator list)
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: Operations review escalation to the CEO route and the CEO approval task that follows it
    suggested_owner: SECURITY-REVIEWER

  - id: PA-SWIFTROUTE-004
    severity: MAJOR
    checklist_item: C1
    business_description: >
      The shipment approval decides where a shipment goes from the answers "approve or reject" given by the
      operations manager and the CEO and from the declared value, but none of the review screens is defined to
      ask for those answers. In the escalation scenario the CEO is recorded as giving a differently named
      answer, which the process never looks at, so the shipment would take the unlabelled fall-back path
      instead of finishing on that single approval.
    affected:
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: Operations review and CEO approval tasks have no form that collects the decision
      - path: test/fixtures/uat/scenarios/swiftroute/shipment-ops-timeout-escalation.yaml
        where: Step 3, the CEO's answer is named differently from the answer the process reads
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-005
    severity: MAJOR
    checklist_item: D1
    business_description: >
      The escalation scenario promises that a four-hour timer fires and moves the shipment to the CEO, but the
      approval process escalates after two hours and has no timer step by the name the scenario uses, so the
      acceptance run cannot check what the business believes it is checking.
    affected:
      - path: test/fixtures/uat/scenarios/swiftroute/shipment-ops-timeout-escalation.yaml
        where: Step 2, the timer step, and the four-hour wording of the description
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: Operations review task, two-hour escalation
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-006
    severity: MAJOR
    checklist_item: D1
    business_description: >
      The onboarding scenario file contains two complete, different versions of the same scenario (a
      browser-driven one and an interface-driven one) merged into one file, so it is unclear which steps the
      tester is meant to perform and the later version may silently replace the earlier one.
    affected:
      - path: test/fixtures/uat/scenarios/swiftroute/tenant-onboarding-happy.yaml
        where: Two sets of actors, steps and expected outcomes in one file
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-007
    severity: MAJOR
    checklist_item: D2
    business_description: >
      The driver incident process has two human tasks, the operations assessment and the finance estimate, that
