checklist:
  - item: A1
    answer: YES
    evidence: >
      In test/fixtures/qa/swiftroute_process_definition.json the operations review task (ops-review) has a
      reject branch that notifies the requester and ends at end-rejected, and the CEO approval task
      (ceo-approval) has a reject branch through auto-reject to end-rejected. The value-routing gateway
      ceo-approval-gate only decides whether a CEO co-sign is needed and every path through it sits behind
      the operations review, so I treated it as routing, not as an approval. The Driver Incident Report
      definition (process_shipment_dispatch.yaml) contains no approval.
  - item: A2
    answer: YES
    evidence: >
      The only correction in the scenarios is step 4 of shipment-attach-delivery-note.yaml, where the dispatcher
      swaps a wrongly attached delivery note while the shipment is still waiting for review; nothing is
      returned to her for correction and no scenario or node name describes resubmission, so no rework loop is
      needed.
  - item: A3
    answer: NO
    evidence: >
      The definition check for Shipment Approval lists no_default_route. In
      test/fixtures/qa/swiftroute_process_definition.json both ops-review and ceo-approval have conditioned
      outgoing branches plus one unconditioned fallback branch (fallback-ops-review, timeout-ceo-approval)
      that is not marked as the default. Both rejection branches (e2 via notify-requester, e6 via auto-reject)
      do reach an end node.
  - item: A4
    answer: NO
    evidence: >
      ops-review carries a two-hour escalation to the CEO route, but ceo-approval in the Shipment Approval
      definition has no escalation timer, no timer node and no statement that waiting without limit is
      intended. In process_shipment_dispatch.yaml the tasks ops-assessment and finance-estimate also have
      no escalation setting; the file's own header says its timeout branch on a human task is only an
      annotation, and the only real timer node (ops-escalation-timer) belongs to the operations branch.
  - item: B1
    answer: NO
    evidence: >
      No task routes to the dispatchers (actor-swiftroute-lena has no routing role), and the operations manager
      (actor-swiftroute-marco) cannot start a shipment. However actor-swiftroute-alice holds both the CEO route
      for ceo-approval and an administrator role in the roster (listed under legacy_platform_admin) that
      allows starting instances, so she can request and approve the same shipment. Also ops-review escalates
      to the CEO route, so for a value above 500 the same CEO can complete both ops-review and ceo-approval.
  - item: B2
    answer: NOT_APPLICABLE
    evidence: >
      The scope has no verification step in the sense of a data-entry task followed by a separate check task:
      the shipment request is entered by the dispatcher at start and the only human tasks (ops-review,
      ceo-approval, ops-assessment, finance-estimate) are reviews, approvals or assessments, which B1 covers.
  - item: C1
    answer: NO
    evidence: >
      The validator reports no variable_never_collected for Shipment Approval. Reading the definition, the
      gateway ceo-approval-gate reads declared_value, and the tasks ops-review and ceo-approval are read through
      ops_decision and ceo_decision, but no HUMAN_TASK node in swiftroute_process_definition.json has a
      form_schema, so nothing in the process collects those answers. In shipment-ops-timeout-escalation.yaml
      step 3 the CEO supplies capacity_decision, a name no branch reads.
  - item: D1
    answer: NO
    evidence: >
      All three proc-swiftroute-shipment-approval scenarios resolve through the sidecar
      proc-swiftroute-shipment-approval.yaml, and the high-value steps map to start, ops-review and
      ceo-approval. In shipment-ops-timeout-escalation.yaml step 2 names a timer node called ops-review and a
      four-hour timer, while the definition has no timer node and escalates ops-review after two hours. The
      attach and refuse steps of shipment-attach-delivery-note.yaml are document actions rather than process
      steps, which I did not count as a gap. tenant-onboarding-happy.yaml repeats its own top-level keys
      (id/steps/actors) twice in one file.
  - item: D2
    answer: NO
    evidence: >
      ops-review and ceo-approval appear in shipment-high-value-happy.yaml (steps 2 and 3) and
      shipment-ops-timeout-escalation.yaml. The tasks ops-assessment and finance-estimate in
      test/fixtures/simulation/swiftroute/process_shipment_dispatch.yaml (Driver Incident Report) appear in
      no scenario of the scope.
  - item: D3
    answer: NO
    evidence: >
      The routes role-ops-manager (actor-swiftroute-marco) and role-ceo (actor-swiftroute-alice) have roster
      actors, but finance-estimate in process_shipment_dispatch.yaml routes to role-accountant, which no
