      the task-worker role although the shipment steps she performs need only the task-worker role. The
      persona seed script grants nothing beyond what the roster lists.
  - item: E1
    answer: NO
    evidence: >
      The scope has approving and releasing (ops-review, ceo-approval, release-shipment) and changing users
      (onboarding creates the company administrator), yet none of the four scenario files contains a step with
      expect_refusal: true. The scope's entry in refusal_coverage_exempt does not turn this into a YES.
  - item: E2
