findings:
  - id: PA-SWIFTROUTE-001
    severity: MAJOR
    checklist_item: A4
    business_description: >
      Once the operations manager has approved a shipment above the limit, the CEO's co-sign task can sit unanswered forever: nothing reminds
      anyone, nothing passes it to someone else, and nothing says that waiting without limit is intended, so a high-value shipment can be stuck with no one noticing.
      The same holds for the two incident-report tasks (operations assessment and finance estimate) in the driver incident process.
    affected:
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: CEO approval task (ceo-approval), no escalation timer or escalation route
      - path: test/fixtures/simulation/swiftroute/process_shipment_dispatch.yaml
        where: operations assessment and finance estimate tasks, no escalation timer or escalation route
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-002
    severity: MAJOR
    checklist_item: C1
    business_description: >
      The shipment approval decides where a request goes from the manager's and CEO's decision and from the declared value, but no form requires
      those to be filled in. A task finished without a decision silently sends the shipment to the CEO (after the manager) or to automatic rejection (after the CEO),
      so a request can be released or rejected without anyone actually having decided it.
    affected:
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: ops-review and ceo-approval tasks have no form; value gateway reads the declared value supplied only at submission
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-003
    severity: MAJOR
    checklist_item: D1
    business_description: >
      The timeout scenario describes a manager who has 4 hours to answer, a timer on the review step, and a CEO decision field that the process does not use;
      the deployed process gives the manager 2 hours and reads a different decision field. The scenario may therefore pass or fail for reasons unrelated to the business rule it is meant to test.
      The onboarding scenario file also contains two different versions of itself, so it is unclear which steps are meant.
    affected:
      - path: test/fixtures/uat/scenarios/swiftroute/shipment-ops-timeout-escalation.yaml
        where: description (4 hours), step 2 (timer node), step 3 (decision field)
      - path: test/fixtures/uat/scenarios/swiftroute/tenant-onboarding-happy.yaml
        where: file contains two sets of steps and outcomes
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-004
    severity: MAJOR
    checklist_item: D2
    business_description: >
      The driver incident process has two people-tasks (operations assessment and finance estimate) that no scenario ever walks through, so nobody
      has checked that an incident can actually be assessed and costed.
    affected:
      - path: test/fixtures/simulation/swiftroute/process_shipment_dispatch.yaml
        where: operations assessment and finance estimate tasks
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-005
    severity: MAJOR
    checklist_item: D3
    business_description: >
      The finance estimate task is sent to an accountant, but SwiftRoute has no accountant on its staff list, so the task would have no one to receive it.
      The timeout scenario also relies on a dispatcher (Tobias) whose access is not on record.
    affected:
      - path: test/fixtures/simulation/swiftroute/process_shipment_dispatch.yaml
        where: finance estimate task route
      - path: test/fixtures/uat/actors.yaml
        where: actor-swiftroute-tobias listed as unresolved
    suggested_owner: BA-SWIFTROUTE

  - id: PA-SWIFTROUTE-006
    severity: MAJOR
    checklist_item: D4
    business_description: >
      The dispatcher is on record as an ordinary worker who may not start shipment requests or attach documents, yet her whole job in the scenarios is to submit shipments and attach delivery notes,
      so the steps would be refused for the wrong reason.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actor-swiftroute-lena
      - path: test/fixtures/uat/scenarios/swiftroute/shipment-attach-delivery-note.yaml
        where: steps 1 to 4
    suggested_owner: REQ-ANALYST

  - id: PA-SWIFTROUTE-007
    severity: MAJOR
    checklist_item: D4
    business_description: >
      The CEO of SwiftRoute is recorded as holding the highest platform-wide administrator access, although signing off shipments and opening a company dashboard need only ordinary or company-administrator access.
      She could therefore do far more than her job requires.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actor-swiftroute-alice, built-in roles
    suggested_owner: SECURITY-REVIEWER

  - id: PA-SWIFTROUTE-008
    severity: MINOR
    checklist_item: D4
    business_description: >
      The access of the dispatcher used in the timeout scenario (Tobias) is not on record, so what he is allowed to do cannot be compared with what the scenario asks of him.
    affected:
