        where: dispatcher actor and step 1
    suggested_owner: REQ-ANALYST

  - id: PA-SWIFTROUTE-009
    severity: MAJOR
    checklist_item: E1
    business_description: >
      No scenario shows a person who is not allowed to approve or release a shipment, or to create a company administrator, being turned away,
