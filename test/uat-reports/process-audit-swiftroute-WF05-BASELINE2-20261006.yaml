verdict: PASS_WITH_FINDINGS
verdict_note: >
  The shipment approval has a clean approve-or-reject structure that ends properly, but several steps can wait forever, the scenarios do not match the process or
  the people in them, and no one is shown being refused, so the design should be tidied before it is relied on.
