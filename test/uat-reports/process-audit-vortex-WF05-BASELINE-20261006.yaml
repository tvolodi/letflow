findings:
  - id: PA-VORTEX-001
    severity: BLOCKER
    checklist_item: A1
    business_description: >
      When the production manager declines an order at the capacity review, the order is passed to the planner
      notification and then finishes in the same final state as an order that was released. A declined order is
      therefore recorded as released, so reports and the planner's own records cannot tell a refused order from an approved
      one, and the shop floor could act on an order that was turned down.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: capacity-review reject branch (edge e2) leading through notify-planner to end-released
      - path: test/fixtures/simulation/vortex/process_quality_check.yaml
        where: the same reject branch in the simulation copy of the definition
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-002
    severity: BLOCKER
    checklist_item: A3
    business_description: >
      The automatic check of the Production Order Release and Supplier Quality Deviation processes found a decision
      that has no route for a case nobody planned for. An order or a deviation that falls into that case would stop
      with no next step and no end, and nobody would be told. The audited files do declare default routes on the
      gateways, so the checked copy and the audited files may differ.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: the definition as checked by the automatic validator (decision without a default route)
      - path: test/fixtures/qa/vortex_supplier_quality_deviation_process_definition.json
        where: the definition as checked by the automatic validator (decision without a default route)
    suggested_owner: ORCH

  - id: PA-VORTEX-003
    severity: MAJOR
    checklist_item: A4
    business_description: >
      No task in the vortex processes says how long it may wait or who is told when it waits too long. The capacity
      review, the budget approval, the severity classification and the 8D corrective action can all sit forever with
      nobody notified, so a production order or a quality deviation could stall unnoticed. The processes describe
      an escalation to the CEO and a default to major severity, but no waiting time is set that would trigger them.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: tasks capacity-review, escalate-to-ceo and budget-approval (timeout routes without a duration)
      - path: test/fixtures/qa/vortex_supplier_quality_deviation_process_definition.json
        where: task severity-classification (timeout route without a duration)
      - path: test/fixtures/qa/vortex_8d_corrective_action_definition.json
        where: task corrective-action-8d (no escalation of any kind)
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-004
    severity: MAJOR
    checklist_item: C1
    business_description: >
      If the quality manager does not classify a deviation in time, the process is meant to treat it as a major
      deviation, but nothing in the process actually records "major". The decision that follows then finds no severity and
      takes its fallback, which sends the deviation to the full 8D corrective action meant for critical cases, so a late
      deviation could be treated as critical by accident.
    affected:
      - path: test/fixtures/qa/vortex_supplier_quality_deviation_process_definition.json
        where: step default-to-major followed by the severity-routing decision
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-005
    severity: MAJOR
    checklist_item: D1
    business_description: >
      The "quality manager filters the batch list" scenario is attached to the quality deviation process, but none of its six
      steps are steps of that process: it only browses and pages through batch records. Running it proves nothing about the
      deviation process, and the name suggests it does.
    affected:
      - path: test/fixtures/uat/scenarios/vortex/entity-list-filter-and-page.yaml
        where: process_id and all six steps
      - path: test/fixtures/uat/process-definition-aliases/proc-vortex-quality-deviation.yaml
        where: sidecar mapping to the Supplier Quality Deviation definition
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-006
    severity: MAJOR
    checklist_item: D2
    business_description: >
      The CEO escalation step of the production order process is never exercised by any scenario. If the production manager
      does not act, nobody has shown that the order really reaches the CEO or what the CEO can then do.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: task escalate-to-ceo
      - path: test/fixtures/uat/scenarios/vortex/production-order-above-threshold.yaml
        where: steps 1 to 3 (no escalation step, although the scenario is tagged timeout)
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-007
    severity: MAJOR
    checklist_item: D3
    business_description: >
      The production order process hands an order to the CEO when the production manager does not act, but no one in
      the Vortex roster holds the CEO job. The seed script gives it to a person who is not in the roster, so the escalated task
      would have nobody to do it in a test run.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: no vortex actor with the CEO routing job (actor-vortex-dirk is missing)
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: task escalate-to-ceo
      - path: scripts/seed_vortex_persona_actors.sh
        where: persona line for actor-vortex-dirk
    suggested_owner: ORCH

  - id: PA-VORTEX-008
    severity: MAJOR
    checklist_item: D4
    business_description: >
      The production planner and the quality engineer must start a production order and a quality deviation, but the roster
      gives them only the ordinary task-worker access, which is not meant to start processes. Their first steps could not be
      done as written, and whatever extra access is needed to make them work is not recorded. The seed script also grants the CEO
      job to a person who is not in the roster.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actors actor-vortex-anna and actor-vortex-nina
      - path: test/fixtures/uat/scenarios/vortex/production-order-above-threshold.yaml
        where: step 1 (planner starts the order)
      - path: test/fixtures/uat/scenarios/vortex/supplier-quality-deviation-critical.yaml
        where: step 1 (quality engineer logs the deviation)
      - path: test/fixtures/uat/scenarios/vortex/supplier-quality-deviation-false-positive.yaml
        where: step 1 (quality engineer logs the deviation)
      - path: scripts/seed_vortex_persona_actors.sh
        where: persona line for actor-vortex-dirk
    suggested_owner: SECURITY-REVIEWER

  - id: PA-VORTEX-009
    severity: MAJOR
    checklist_item: E1
    business_description: >
      None of the Vortex scenarios shows a person being refused. Nobody is shown being stopped when trying to approve a production
      budget they may not approve, release an order or a quarantined batch, or see supplier cost figures, so it is not known
      whether those protections work.
    affected:
      - path: test/fixtures/uat/scenarios/vortex/production-order-above-threshold.yaml
        where: approving and releasing (no refusal step)
      - path: test/fixtures/uat/scenarios/vortex/supplier-quality-deviation-false-positive.yaml
        where: releasing a batch from quarantine (no refusal step)
      - path: test/fixtures/uat/scenarios/vortex/entity-list-filter-and-page.yaml
        where: seeing cost figures (no refusal step)
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-010
    severity: MAJOR
    checklist_item: F1
    business_description: >
      The same business idea, a task that is escalated when it waits too long, is built differently in Vortex than in the shipment
      approval and compliance review processes of other companies: those state a waiting time and who is told, while Vortex only
      draws a timeout route with no time. No description explains the difference, so the same kind of delay behaves
      differently from one company to the next.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: escalation of capacity-review and budget-approval
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: task ops-review (comparison, states a waiting time and escalation person)
    suggested_owner: REQ-ANALYST

verdict: FAIL
verdict_note: >
  Vortex's process design is not yet complete or safe to run, because a declined production order is recorded as released
  and the automatic check found decisions with no route for unplanned cases.
