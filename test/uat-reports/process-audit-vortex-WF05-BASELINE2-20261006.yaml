findings:
  - id: PA-VORTEX-001
    severity: BLOCKER
    checklist_item: A1
    business_description: >
      When the production manager declines a production order at the capacity review, the order is not
      rejected: the planner is notified, the line-assignment and rejection instructions are not sent, and the order
      is closed in the same final state as an order that was approved and released. Reports and the shop floor
      would show a declined order as released, so a rejected order could be built.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: capacity-review decline branch (edge e2) goes to the planner notification and then to the released end state
      - path: test/fixtures/simulation/vortex/process_quality_check.yaml
        where: same decline branch in the simulation copy of the order release process
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-002
    severity: MAJOR
    checklist_item: A4
    business_description: >
      Nobody is chased when a vortex task is left unattended: the capacity review, the CEO escalation, the budget
      sign-off, the severity classification and the 8D corrective action have no time limit set, so a production
      order or a quality deviation can sit open for ever, and the CEO escalation and automatic rejection that the
      process description promises never start. A suspect batch could stay quarantined or an order could stall
      without anyone noticing.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: tasks capacity-review, escalate-to-ceo and budget-approval have no escalation timer duration or role
      - path: test/fixtures/qa/vortex_supplier_quality_deviation_process_definition.json
        where: task severity-classification has no escalation timer duration or role
      - path: test/fixtures/qa/vortex_8d_corrective_action_definition.json
        where: task corrective-action-8d has no escalation timer duration or role
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-003
    severity: MAJOR
    checklist_item: C1
    business_description: >
      If the quality manager does not classify a deviation in time, the process is meant to treat it as a major
      deviation, but nothing records a severity on that route, so it is sent to the full 8D corrective action meant
      for critical deviations. A late deviation would be handled as critical instead of as major, tying up
      procurement and the supplier.
    affected:
      - path: test/fixtures/qa/vortex_supplier_quality_deviation_process_definition.json
        where: route from the severity-classification timeout through default-to-major to severity-routing, which reads severity
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-004
    severity: MAJOR
    checklist_item: D1
    business_description: >
      The scenario about filtering and paging the quarantined batch list is labelled as belonging to the quality
      deviation process, but none of its steps is a step of that process; it only reads batch records. The
      process it is tied to is therefore never exercised by it, and a reader would assume coverage that is not there.
    affected:
      - path: test/fixtures/uat/scenarios/vortex/entity-list-filter-and-page.yaml
        where: process id and steps 1 to 6
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-005
    severity: MAJOR
    checklist_item: D2
    business_description: >
      The CEO escalation step of the production order release is never walked through by any scenario, so no one
      has checked what happens when the production manager does not act and the order moves to the CEO.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: task escalate-to-ceo
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-006
    severity: MAJOR
    checklist_item: D3
    business_description: >
      The production order release can be escalated to the CEO, but no vortex person who could receive that task
      exists in the list of test people, so an escalated order has nobody to pick it up and cannot be tested end
      to end.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: no vortex actor holds the CEO routing role (the CEO's person is absent from the roster)
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: task escalate-to-ceo
    suggested_owner: ORCH

  - id: PA-VORTEX-007
    severity: MAJOR
    checklist_item: D4
    business_description: >
      The planner and the quality engineer are meant to create a new production order and log a new quality
      deviation, but they are given only the access of an ordinary worker, who is not allowed to start new
      matters. Their first step would be refused, or, if it works, the access list does not describe what they
      really can do.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actor-vortex-anna and actor-vortex-nina access level
      - path: test/fixtures/uat/scenarios/vortex/production-order-above-threshold.yaml
        where: step 1 (planner creates the order)
      - path: test/fixtures/uat/scenarios/vortex/supplier-quality-deviation-critical.yaml
        where: step 1 (quality engineer logs the deviation)
    suggested_owner: SECURITY-REVIEWER

  - id: PA-VORTEX-008
    severity: MAJOR
    checklist_item: E1
    business_description: >
      None of the vortex scenarios checks that a person is refused when they try something outside their job, such
      as a quality manager approving an order budget, or a planner or the quality manager seeing the restricted cost
      figures or shipment records. Nobody would know if approval, release and cost-figure restrictions stopped
      working.
    affected:
      - path: test/fixtures/uat/scenarios/vortex/production-order-above-threshold.yaml
        where: approval steps 2 and 3, no refusal step
      - path: test/fixtures/uat/scenarios/vortex/entity-list-filter-and-page.yaml
        where: step 5 (restricted record type) not marked as a refusal step
      - path: test/fixtures/uat/actors.yaml
        where: vortex listed under scopes exempt from refusal coverage
    suggested_owner: BA-VORTEX

  - id: PA-VORTEX-009
    severity: MAJOR
    checklist_item: F1
    business_description: >
      The vortex production order release handles a declined approval and a stalled task differently from the
      shipment approval and loan origination processes: a decline ends as released rather than rejected, and the
      escalation is not set up with a time limit and a receiving role the way the shipment approval does it. Staff
      moving between companies would meet inconsistent rules with no explanation.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: capacity-review decline branch and escalation edges
      - path: test/fixtures/qa/swiftroute_process_definition.json
        where: comparison point, shipment ops-review escalation and rejected end
    suggested_owner: BA-VORTEX

verdict: FAIL
verdict_note: >
  The vortex process design is not safe to run yet because a declined production order is closed as released and
  a number of unattended tasks, missing escalation people and unchecked refusals remain.
