      declined order is closed as released and the reject step is never run; the budget-approval decline branch
      correctly reaches end-rejected, and the false-positive-check in the Supplier Quality Deviation definition ends at
      end-false-positive. The budget-gate and severity-routing gateways only route and carry no approve or decline
      decision of their own.
