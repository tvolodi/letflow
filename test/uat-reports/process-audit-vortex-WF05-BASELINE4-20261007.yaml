checklist:
  - item: A1
    answer: YES
    evidence: >
      In vortex_production_order_release_process_definition.json the capacity review, the budget approval and both
      CEO escalation steps each have a reject branch that ends in the rejected end; the false-positive check in
      vortex_supplier_quality_deviation_process_definition.json ends the matter without a corrective action. The
      budget gate and the severity routing gateway only route onward to steps that carry their own outcomes, so
      no approval is left without a way to say no.
  - item: A2
    answer: NOT_APPLICABLE
    evidence: >
      No vortex scenario step or description and no node name asks for correction, resubmission or return of a
      request to its requester (the 8D corrective action is remediation work at the supplier, not a rework loop
      for the submitted request), so no rework loop is needed.
  - item: A3
    answer: YES
    evidence: >
      The validator output for all three vortex definitions is OK with no unreachable, no-path-to-end or
      missing-default codes. Every reject branch (capacity review, budget approval, both CEO escalation steps) reaches
      the rejected end through the auto-reject or planner-notification step, and the fail-closed timeout edges do too.
  - item: A4
    answer: YES
    evidence: >
      Every human task in the production order and supplier deviation definitions (capacity-review,
      escalate-to-ceo, budget-approval, escalate-budget-approval-to-ceo, severity-classification,
      escalate-severity-classification-to-ceo) carries both an escalation duration and an escalation role. The one
      exception, corrective-action-8d in vortex_8d_corrective_action_definition.json, states in its own description
      and in the definition description that it intentionally stays open until Procurement completes it.
  - item: B1
    answer: YES
    evidence: >
      The people who start matters (the planner and the quality engineer, roster entries anna and nina) hold no
      routing role, while the approval and review steps route to the production manager, controller, quality
      manager, procurement manager and CEO roles, each held by a different roster person. Every approval step has a
      route.
  - item: B2
    answer: YES
    evidence: >
      In the supplier deviation process the quality engineer (nina, no routing role) logs the deviation and the
      quality manager role (karl) checks and classifies it; no roster actor holds both. No other data-entry and
      verification pair exists in the production order process.
  - item: C1
    answer: YES
    evidence: >
      The validator lists no never-collected variable for any vortex definition. Reading the decisions by hand,
      the budget gate, the false-positive check and the severity routing each have a default branch that fails
      toward more scrutiny (budget approval, or the critical corrective-action path) when a value was not collected,
      and the capacity and budget decisions are taken by the human tasks directly before them.
  - item: D1
    answer: YES
    evidence: >
      The five process scenarios map onto real steps: step 1 starts the process, the production manager, controller,
      CEO, quality manager and procurement manager steps match capacity-review, budget-approval, escalate-to-ceo,
      severity-classification and corrective-action-8d. The three proc-vortex process ids resolve through sidecars in
      the process-definition-aliases folder; the entity scenario uses n/a and claims no process step.
  - item: D2
    answer: NO
    evidence: >
      Two human tasks appear in no scenario step: escalate-budget-approval-to-ceo in the production order
      definition and escalate-severity-classification-to-ceo in the supplier deviation definition. The two CEO
      escalation scenarios use an 8,000 EUR order, which skips the budget approval, and no scenario lets the severity
      classification time out.
  - item: D3
    answer: YES
    evidence: >
      Every routed role (production manager, controller, quality manager, procurement manager, CEO) has a vortex
      roster actor (sabine, stefan, karl, felix, dirk) in test/fixtures/uat/actors.yaml, and every scenario actor
      (anna, sabine, stefan, karl, nina, felix, dirk) is listed under actors:. The validator reports no unbound role
      warning.
  - item: D4
    answer: NO
    evidence: >
      The roster gives anna and nina only the ordinary-worker role, and the seed script grants nothing more, yet step 1
      of the production order scenarios (anna creates the order) and of both supplier deviation scenarios (nina logs
      the deviation) starts a process instance, which an ordinary worker is not allowed to do under the role charter.
  - item: E1
    answer: NO
    evidence: >
      None of the six vortex scenarios has a step with expect_refusal: true, although the scope has approving
      (capacity, budget, CEO), releasing (production order release, quarantine release) and commercially sensitive
      data (batch cost figures in entity-list-filter-and-page.yaml, steps 1, 5 and 6). The refusal_coverage_exempt
      listing for vortex does not change this answer.
  - item: E2
    answer: NOT_APPLICABLE
    evidence: >
      No vortex roster actor holds an administrator role; all vortex actors hold only the ordinary-worker role.
  - item: E3
    answer: YES
    evidence: >
      The vortex steps (starting orders and deviations, completing review and approval tasks, advancing a timer by
      the system actor, reading batch lists) are all tenant-scope actions; no step needs a platform-scope permission
      such as managing tenants.
  - item: F1
    answer: YES
    evidence: >
      Compared with the meridian loan origination and swiftroute shipment approval definitions, vortex models
      approvals, an amount threshold (budget gate with a default toward the stricter approval, like swiftroute's
      CEO gate), timeout escalation to a higher role then fail-closed rejection, and rejection handling in the same
      way; the one deviation (no timer on the 8D corrective action) is explained in the definition description.

findings:
  - id: PA-VORTEX-001
    severity: MAJOR
    checklist_item: D2
    business_description: >
      Two escalation steps exist in the design but no scenario ever exercises them. If the controller does not sign
      off a large production order, it is meant to go to the CEO, and if the quality manager does not classify a
      supplier deviation in time, it is meant to go to the CEO. Neither handover is ever tried, so a broken handover
      would only be discovered by real production orders or real quarantined batches sitting unattended.
    affected:
      - path: test/fixtures/qa/vortex_production_order_release_process_definition.json
        where: the CEO escalation of the budget approval (escalate-budget-approval-to-ceo), reached only for orders above 10,000 EUR
      - path: test/fixtures/qa/vortex_supplier_quality_deviation_process_definition.json
        where: the CEO escalation of the severity classification (escalate-severity-classification-to-ceo)
      - path: test/fixtures/uat/scenarios/vortex/production-order-ceo-escalation-approved.yaml
        where: only escalation scenarios use an 8,000 EUR order, which never reaches the budget approval
    suggested_owner: BA-VORTEX
  - id: PA-VORTEX-002
    severity: MAJOR
    checklist_item: D4
    business_description: >
      The production planner who creates a production order and the quality engineer who logs a supplier deviation
      are recorded as ordinary workers, but both scenarios have them start a new matter, which an ordinary worker is
      not permitted to do. Either these people cannot do the core part of their job, or the access recorded for them
      does not match what they are really given.
    affected:
      - path: test/fixtures/uat/actors.yaml
        where: actors actor-vortex-anna (planner) and actor-vortex-nina (quality engineer)
      - path: test/fixtures/uat/scenarios/vortex/production-order-above-threshold.yaml
        where: step 1, the planner creates the production order
      - path: test/fixtures/uat/scenarios/vortex/supplier-quality-deviation-critical.yaml
        where: step 1, the quality engineer logs the deviation (same in the false-positive scenario)
      - path: scripts/seed_vortex_persona_actors.sh
        where: persona lines for anna and nina (no routing role, ordinary worker only)
    suggested_owner: BA-VORTEX
  - id: PA-VORTEX-003
    severity: MAJOR
    checklist_item: E1
    business_description: >
      No scenario checks that anyone is turned away. Nobody is shown trying to approve a production order they are
      not responsible for, to release an order or a quarantined batch without authority, or to look at the batch cost
      figures that the quality manager is not cleared to see. A person doing something outside their job would go
      unnoticed by the acceptance checks.
    affected:
      - path: test/fixtures/uat/scenarios/vortex/production-order-above-threshold.yaml
        where: approval and release steps, no refusal step
      - path: test/fixtures/uat/scenarios/vortex/supplier-quality-deviation-false-positive.yaml
        where: release of the quarantined batch, no refusal step
      - path: test/fixtures/uat/scenarios/vortex/entity-list-filter-and-page.yaml
        where: steps 1, 5 and 6 (cost figures and the restricted record type), no step marked as expected refusal
    suggested_owner: BA-VORTEX

verdict: PASS_WITH_FINDINGS
verdict_note: >
  The vortex process design is complete and fails closed in every rejection and timeout path, but two escalation
  steps are never exercised, the people who start orders and deviations are recorded with too little access to do
  so, and no scenario checks that anyone is turned away.
