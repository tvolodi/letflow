    verdict: PASS
    evidence: >
      TC-OIDCF-03 ("real Keycloak login succeeds and workspace is shown")
      PASS. Real browser: unauthenticated GET / redirects to
      http://localhost:8082/realms/bpm-default/protocol/openid-connect/auth
      with PKCE params (TC-OIDCF-02, also PASS); admin-user/admin-pass
      submitted on Keycloak's real login form; browser returns to / with
      the SPA's AppShell rendered (logout-button, user-display-name, Users
      nav link visible per the spec's own assertions).
  AC2_worker_narrower_nav:
    verdict: PASS
    evidence: >
      TASK_WORKER (worker-user/worker-pass) nav, observed via
      page.getByRole('link').allTextContents() after real login:
      ["My Tasks"] (1 item).
      PLATFORM_ADMIN (admin-user/admin-pass) nav, same method, same real
      login flow: ["Instances","My Tasks","Definitions","DLQ","Webhooks",
      "Users","Groups","Tokens","Audit","Health","Metrics",
      "Register Tenant","Tenants","Services"] (14 items).
      Worker nav is a strict subset containing only "My Tasks" --
      demonstrably narrower.
  AC3_authenticated_api_call:
    verdict: PASS
    evidence: |
      Request: GET http://localhost:4000/api/v1/identity/users
      Authorization: Bearer <admin-user JWT from Keycloak password grant>
      Response: HTTP 200
      {"items":[
        {"username":"operator-user","display_name":"Operator User","email":"operator@letflow.local","auth_source":"oidc","status":"active",...},
        {"username":"worker-user","display_name":"Worker User","email":"worker@letflow.local","auth_source":"oidc","status":"active",...},
        {"username":"admin-user","display_name":"Admin User","email":"admin@letflow.local","auth_source":"oidc","status":"active",...}
      ],"next_cursor":null,"count":3}
      Real seeded users returned, not a stub.
  AC4_forbidden_403:
    verdict: PASS
    evidence: |
      Request: GET http://localhost:4000/api/v1/identity/users
      Authorization: Bearer <worker-user JWT from Keycloak password grant>
      Response: HTTP 403
      {"status":403,"type":"https://bpm.example.com/problems/forbidden","title":"Forbidden","trace_id":"2df9b615-fd82-4beb-a8f6-d4949d0d681e","detail":"insufficient permissions"}
      Matches REQ-131's RFC-9457 problem-document shape (status/type/title
