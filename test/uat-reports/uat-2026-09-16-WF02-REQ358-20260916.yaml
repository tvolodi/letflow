        grant_type=password, client_id=letflow-web, username=admin-user
        -> HTTP 200, access_token issued. Decoded JWT payload:
        realm_access.roles=["PLATFORM_ADMIN"], preferred_username=
        "admin-user", iss="https://auth.qa.bizdala.com/realms/bpm-default".
      GET https://qa.bizdala.com/api/v1/tenants (Bearer admin token)
        -> HTTP 200, tenants list returned (admin-only capability granted).
      Branch actually taken: platform_admin_dashboard (role observed ==
      PLATFORM_ADMIN, first matching `when:`). EO-001 for this branch
      (frontend "platform-admin dashboard shown") remains BLOCKED per
      gui_leg above; the branch-selection fact itself is PASS.

    Branch tenant_user_dashboard (fact: role in [TENANT_ADMIN,
