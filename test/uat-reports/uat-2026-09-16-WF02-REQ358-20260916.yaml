    a non-platform-admin tenant-scoped role, to prove the branch
    discriminator is role-driven and not merely "admin vs not"):
      POST .../token grant_type=password, username=operator-user
        -> HTTP 200. Decoded JWT: realm_access.roles=["PROCESS_OPERATOR"].
      GET https://qa.bizdala.com/api/v1/tenants (Bearer operator token)
        -> HTTP 403 {"status":403,"type":"https://bpm.example.com/problems/forbidden","title":"Forbidden","detail":"insufficient permissions",...}
