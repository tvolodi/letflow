new_finding_for_orch_triage:
  title: "PLATFORM_ADMIN-scoped bearer tokens receive HTTP 500 (empty body) from qa.bizdala.com on multiple API endpoints where a non-admin token gets a well-formed 403/404"
  observed: >
    GET /api/v1/tenants, GET /api/v1/identity/users, GET /api/v1/health each
    returned HTTP 500 with an empty response body when called with a real,
    valid, freshly-issued admin-user (PLATFORM_ADMIN) bearer token, on
    2026-09-17 against https://qa.bizdala.com. Retried GET /api/v1/tenants
    two additional times with the same token; same 500 both times
    (reproducible, not a one-off blip). The identical GET /api/v1/tenants
    call one day earlier (REQ-358's QA run, 2026-09-16) with the same
    admin-user account returned HTTP 200 with a real tenant list -- so this
    is a regression on QA between 2026-09-16 and 2026-09-17, not
    long-standing behavior this run merely noticed for the first time.
    The same three endpoints called with a real operator-user
    (PROCESS_OPERATOR) token in this same run returned well-formed
    Problem+JSON 403/403/404 responses, so the 500 is specific to
    PLATFORM_ADMIN-scoped tokens, not a blanket outage.
  severity_suggestion: "Should be triaged before this scenario's branch 1 can be meaningfully re-attempted even once a browser tool exists -- if the backend errors for admin tokens, the GUI's platform-admin nav items (Users, Tenants, Health, Metrics) this scenario's EO-001 expects to see populated may themselves fail to load, independent of the routing question this scenario is actually testing."
  evidence_location: "This report, branch_platform_admin_lands_on_workspace_root.backend_role_evidence_real.api_probe_anomaly_found, above."
