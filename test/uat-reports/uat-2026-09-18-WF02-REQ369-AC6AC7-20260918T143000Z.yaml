new_finding_tenant_count_bug:
  title: "PlatformDashboardPage's tile-tenant-count always renders 0, never the real tenant count -- GET /api/v1/tenants has no 'total' field"
  severity_suggestion: "BLOCKER for AC6's specific 'real tenant count rendered' clause -- a real, reproducible product defect, not a test artifact."
  detail: >
    The screenshot captured above (real OIDC login, live QA) shows the
    TENANTS tile rendering "0". Independently queried the live backend for
    ground truth: obtained a real admin-user token via direct Keycloak
    password-grant, then `curl -H "Authorization: Bearer <token>"
    https://qa.bizdala.com/api/v1/tenants` ->
    `{"items":[{"display_name":"Default Tenant",...},{"display_name":"BilimBaga",...}],"next_cursor":null,"count":2}`
    -- the real, live tenant count is 2, not 0. Root-caused by reading
    source: web/src/pages/dashboard/PlatformDashboardPage.tsx line 61 renders
    `String(tenantsQuery.data?.total ?? 0)` -- it reads a `.total` field.
    web/src/api/tenants.ts line 19 declares `TenantListResponse.total:
    number` in its TypeScript type, but the REAL backend response (confirmed
    directly above, not inferred from the type) has no `total` key at all --
    only `items`, `next_cursor`, and `count`. `.total` is therefore always
    `undefined` and the `?? 0` fallback fires unconditionally, regardless of
    how many tenants actually exist. This directly contradicts the
    scenario's own EO-001 detail text ("tile...populated from the real GET
    /api/v1/tenants endpoint's 'total' field") and AC6's explicit "real
    tenant count rendered" wording -- the count shown is never real.
  disposition: >
    New, genuine defect discovered by this UAT run, distinct from the login-
    mechanism finding above (that one is a test-design gap; this one is a
    real frontend/backend contract mismatch). Flagging to ORCH: needs a
    CODE-DESIGNER/ELIXIR-DEV or FRONTEND-DEV pass to decide which side is
    wrong (either the backend should return a `total` field, or the frontend
    should read `count` instead) and fix the mismatch, then a re-run of this
    scenario to confirm the tile shows "2" (or whatever the live count is at
    that time) before AC6 can be marked fully satisfied.

