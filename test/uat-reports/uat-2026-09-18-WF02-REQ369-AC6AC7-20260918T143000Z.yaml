new_finding_login_mechanism_gap:
  title: "platform-login-routing-by-role pipeline_test's PLATFORM_ADMIN case cannot pass even with correct credentials -- its login helper bypasses the exact code path REQ-369's redirect logic lives in"
  severity_suggestion: "Should block AC7 from being marked satisfiable via the NAMED pipeline_test until fixed -- distinct from, and found only after, the two previously-resolved blockers (CD-deploy secrets, stale route assertion)."
  detail: >
    Running the pipeline_test with real, correct PLATFORM_ADMIN credentials
    (via the temporary env-var substitution above) produced a NEW, genuine
    failure, not a pass: `expect(page).toHaveURL('/platform-dashboard')`
    received "https://qa.bizdala.com/" instead. Root-caused by reading the
    actual source, not guessed: web/tests/e2e/helpers.ts's `loginWithToken`
    (used by every case in this pipeline_test) authenticates by writing a
    session object directly into sessionStorage via `addInitScript` and then
    navigating straight to `/` -- it deliberately bypasses Keycloak's real
    hosted-login-page redirect and the app's own `/auth/callback` route
    entirely (see helpers.ts's own module comment: "the token-based login
    page has been removed... tests authenticate by... injecting the
    session"). But REQ-369's role-conditional redirect
    (`navigate(payload.roles.includes('PLATFORM_ADMIN') ? '/platform-dashboard' : '/', ...)`)
    lives ONLY inside web/src/pages/OidcCallbackPage.tsx's one-time
    useEffect, which runs solely during the real `/auth/callback` OIDC
    exchange (confirmed by reading OidcCallbackPage.tsx directly, line 72;
    also confirmed no equivalent guard exists elsewhere by grepping
    router.tsx for PLATFORM_ADMIN, which only found the route registration,
    not a redirect guard). Session-injection login therefore structurally
    can never reach the code path this scenario's EO-001 needs to prove --
    it isn't a flaky test, it is testing the wrong mechanism by construction.
  disposition: >
    This is a TEST-DESIGN gap in the pipeline_test's shared login helper for
    this specific scenario, not a product defect -- see
    real_oidc_verification below, which proves the actual product behavior
    is correct when driven through the real login flow. Flagging to ORCH for
    routing to TEST-DESIGNER: the PLATFORM_ADMIN case of this pipeline_test
    needs its own real-redirect-based login (drive Keycloak's hosted login
    form directly, as this run's throwaway verification script did) rather
    than sharing helpers.ts's session-injection `loginWithToken`, or the
    scenario's EO-001 will never be provable by its own named pipeline_test
    regardless of credential correctness.
  secondary_finding: >
    helpers.ts's getKeycloakToken/loginWithToken hardcode 'admin-pass' /
    'worker-pass' as literal default arguments (not sourced from any secret
    store), which is what forced this run's temporary env-var edit above.
    Real QA passwords are never those literals (confirmed 401 against them
    in the prior run). Worth a TEST-DESIGNER pass to let these tests read
    real QA credentials from an env var when E2E_BASE_URL points at a
    non-local environment, without hardcoding any password in source.

