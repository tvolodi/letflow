deploy_verification_INDEPENDENT: >
  Before touching credentials, independently re-verified (not merely trusted
  the coordinator's claim) that ISS-0711's fix is genuinely live on QA.
  First check (before the coordinator's trigger-redeploy commit landed):
  fetched the live bundle at https://qa.bizdala.com/assets/index-DjB53d10.js
  and found the OLD, broken pattern still present:
  `String(((i=r.data)==null?void 0:i.total)??0)` -- confirming the fix was
  NOT yet deployed at that point (this matches the coordinator's own
  root-cause account: ISS-0711's commit, 124bcc5a, never had a successful
  CI run on its own diff, so CD's path-filter gate never fired for it).
  Second check, after the coordinator's trigger-redeploy commit: refetched
  https://qa.bizdala.com/ and found a NEW bundle hash,
  /assets/index-DAWxibro.js (different from the stale index-DjB53d10.js).
  Fetched that bundle directly and grepped it: the tenant-count tile's
  render now reads
  `String(((i=r.data)==null?void 0:i.count)??0)` -- `.count`, not `.total`.
  Also confirmed only 3 occurrences of the literal substring ".total" remain
  anywhere in the whole bundle (none of them near the tenant-count render),
  versus the tenant-count-specific `.total` read that was there before.
  CONCLUSION: ISS-0711's fix is genuinely live on QA as of this run,
  independently confirmed via direct bundle inspection, not by trusting any
  report or CD status alone.

