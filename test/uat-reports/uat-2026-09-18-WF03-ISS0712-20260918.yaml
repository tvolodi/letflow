overall_failure_detail: >
  The test still ends FAIL, but for a different, NEW reason unrelated to
  ISS-0712's login-mechanism fix -- surfaced only now because the fix let the
  test run far enough to reach it. Line 97's loop assertion
  `expect(page.getByRole('link', { name })).toBeVisible()` over
  ['Tenants','Services','Health','Metrics','Users'] is unscoped: it matches
  ANY link with that accessible name anywhere on the page, not just the
  `platform-quick-links` nav the comment above it says it's checking. The
  real PlatformDashboardPage renders the SAME link text twice -- once in the
  `platform-quick-links` nav (as intended) and once in the authenticated
  shell's own left sidebar (which EO-001's own scenario text says should
  render "alongside" -- "Tenants", "Services", "Health", "Metrics", "Users"
  are all real sidebar entries too, confirmed in the failure screenshot).
  Playwright's strict-mode locator resolution correctly refuses to pick one
  of two matches and throws:
    `strict mode violation: getByRole('link', { name: 'Tenants' }) resolved
    to 2 elements: 1) <a ... href="/admin/tenants"> aka
    getByRole('complementary').getByRole('link', {name:'Tenants'})  2) <a
    href="/admin/tenants">Tenants</a> aka
    getByTestId('platform-quick-links').getByRole('link', {name:'Tenants'})`
  Real command output (2 attempts, both failed identically):
    "1 failed
     [chromium] > ... EO-001: PLATFORM_ADMIN lands on the distinct platform dashboard"
  Screenshot evidence (test-results\pipelines-platform-login-r-759b6-distinct-platform-dashboard-chromium\test-failed-1.png,
  captured this run): shows the real, live state at failure --
  "Platform Overview" heading, TENANTS tile (showing "0" -- the pre-existing,
  already-filed tenant-count defect, see below, not new), "PLATFORM ADMIN
  LINKS" nav with Tenants/Services/Health/Metrics/Users all rendered, full
  PLATFORM_ADMIN sidebar nav alongside (Instances, My Tasks, Definitions,
  DLQ, Webhooks, Users, Groups, Tokens, Audit, Health, Metrics, Register
  Tenant, Tenants, Services, Question Bank), footer reading "Admin User" /
  "PLATFORM_ADMIN" -- all genuine, matching what EO-001's own detail text
  describes ("the authenticated shell's navigation also shows the
  PLATFORM_ADMIN-only entries alongside").

