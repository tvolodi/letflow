verdict_basis: >
  Everything reachable without live-QA credentials was independently re-verified
  for real: the fix is genuinely present in the code at the commit that was
  merged, that commit was genuinely deployed to QA via a green CD run, the QA
  instance is genuinely up and enforcing real auth, and the unit/integration
