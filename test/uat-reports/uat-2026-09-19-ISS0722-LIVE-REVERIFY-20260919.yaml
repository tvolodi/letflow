recommendation: >
  Unit/integration coverage (45 tests including the deterministic ordering
  discriminator) plus confirmed live deployment is reasonable interim evidence
  that ISS-0722 is fixed, and is sufficient to let the requirement/issue stay
  resolved for now -- but the live end-to-end manual-mode gap RELEASE-VALIDATOR
  flagged is still open, not closed by this run. Concrete next step: a future
  UAT-RUNNER session dispatched with real ai-dala-infra SSH access (or an
  equivalent credential path) should (1) obtain a candidate-user bilimbaga-realm
  token via qa-login.sh, (2) obtain (or use an existing) authoring/admin token to
  create a real exam_question_rule with mode "manual" plus exam_manual_question
  pins against a live BilimBaga exam (or confirm one already exists), (3) POST
  /exam-sessions against it, and (4) confirm the response's questions list
  matches the pinned set exactly (not empty, not the random pool). Do not mark
  this follow-up closed until that live exercise has actually happened.

