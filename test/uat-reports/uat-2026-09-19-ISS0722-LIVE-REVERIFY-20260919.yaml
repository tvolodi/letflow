      test/letflow/api/context_test.exs:103, independently classified as the
      pre-existing, already-tracked ISS-0340 flake, unrelated to
      lib/letflow/exam/session.ex or its test file. Confirmed
      test/letflow/exam/session_test.exs contains real manual-mode session
      materialization tests (added in commit 4462185b) plus a sort_order-reversed
      discriminator (commit 41018e39) that proves deterministic block ordering
      rather than coincidental pass.
    result: CONFIRMED -- this coverage claim was not fabricated by the earlier run.

  - check: Live QA instance is reachable and the API requires real auth
    method: "curl https://qa.bizdala.com/health -> HTTP 200 {\"status\":\"ok\"}; curl https://qa.bizdala.com/api/v1/health (no Authorization header) -> HTTP 401 {\"error\":\"unauthorized\"}"
    result: CONFIRMED reachable; confirms the exam-session endpoints cannot be
