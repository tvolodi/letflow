what_was_verified_for_real:
  - check: Fix present in the code this session actually built/inspected
    method: >
      Local git checkout was stale by one commit (main at 0e9f2fa3, origin/main at
      55f93b6b) -- fast-forwarded via `git fetch origin main && git pull --ff-only`.
      After the pull, `grep -n '"manual"' lib/letflow/exam/session.ex` shows a real
      clause at line 772 (`Enum.filter(&(fv(&1, "mode") == "manual"))`) and a comment
      at line 835 describing manual-mode materialization -- the fix is genuinely
      present in the code, not just claimed.
    result: CONFIRMED

  - check: Fix actually deployed to the live QA instance
    method: >
      `gh run view 35432542727` (GitHub CLI, authenticated as tvolodi, real API call,
      not assumed) -- workflow "main CD (QA)", job "Deploy to QA", conclusion success,
      duration 1m20s, run triggered ~10 minutes before this check.
    result: >
      CONFIRMED real and green. Could not additionally cross-check the deployed
      commit SHA against 55f93b6b directly (qa.bizdala.com exposes no public
      /version or /api/version route -- both 404; /health returns {"status":"ok"}
      but carries no build/commit identifier), so deployment is confirmed via the CD
      run's own success, not by independently reading back a running commit hash.
      This is a minor evidentiary gap, not a blocker: the CD workflow's job graph
      only runs "Deploy to QA" after the build/push step for that same commit
      succeeds.

  - check: Unit/integration coverage for manual-mode materialization is real and passing
    method: >
      Read test/reports/report-20260919-WF03-ISS0722-20260919.yaml (TEST-RUNNER's own
      gate report on PR #1564, commit 41018e39/branch
      feature/WF03-ISS0722-20260919). 3 full `mix letflow.check.test` runs: 2/3
