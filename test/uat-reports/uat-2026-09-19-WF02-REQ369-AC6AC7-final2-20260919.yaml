pipeline_test_execution:
  command: >
    cd web && E2E_BASE_URL=https://qa.bizdala.com
    BPM_IDP_BASE_URL=https://auth.qa.bizdala.com
    UAT_QA_ADMIN_PASSWORD=<fetched, not recorded> npx playwright test
    tests/e2e/pipelines/platform-login-routing-by-role.pipeline.e2e.spec.ts
    --project=chromium -g "PLATFORM_ADMIN"
  result: "1 failed (ran twice, --retries=0 on the second run to rule out flake -- same failure both times, not transient)"
  real_output: >
    Error: page.waitForURL: net::ERR_CONNECTION_REFUSED
    at helpers.ts:146 (inside loginViaRealOidcRedirect, waiting for the
    browser to navigate off-origin to the IdP after page.goto('/')).
  root_cause_INDEPENDENTLY_TRACED: >
    Extracted the Playwright trace.zip's network log (0-trace.network /
    1-trace.network) and found the actual URL the live QA app's browser
    redirect attempted was
    `http://localhost:8082/realms/bpm-default/protocol/openid-connect/auth?client_id=letflow-web&redirect_uri=https%3A%2F%2Fqa.bizdala.com%2Fauth%2Fcallback&...`
    -- NOT https://auth.qa.bizdala.com as the prior 2026-09-18 successful
    run observed. Confirmed this is not a test artifact by querying the
    live backend directly: `curl -s
    "https://qa.bizdala.com/api/tenant-config?host=qa.bizdala.com"` (run
    twice) both times returned
    `{"branding":{...},"client_id":"letflow-web","oidc_authority":"http://localhost:8082/realms/bpm-default"}`
    -- response headers show `cache-control: max-age=0, private,
    must-revalidate`, so this is not a stale cached value, it is the live
    backend's real current answer. Root-caused in source (not guessed):
    lib/letflow/routers/tenant_config.ex line 312-316's `idp_base_url/0`
    resolves `System.get_env("BPM_IDP_BASE_URL") ||
    System.get_env("KEYCLOAK_BASE_URL") || oidc_issuer_base() ||
    @default_idp_base_url` where `@default_idp_base_url` (line 167) is the
    literal `"http://localhost:8082"`. The live QA backend process is
    currently falling all the way through to that local-dev default --
    meaning none of BPM_IDP_BASE_URL, KEYCLOAK_BASE_URL, or the compiled
    :oidc issuer config resolve correctly in the QA deployment right now.
    Independently isolated that Keycloak itself is NOT the problem: a
    direct password-grant call against the REAL QA IdP
    (https://auth.qa.bizdala.com/realms/bpm-default/protocol/openid-connect/token)
    with the fetched admin-user credential succeeded (HTTP 200, valid
    PLATFORM_ADMIN token decoded) -- only the backend's *advertised*
    oidc_authority value returned to browsers via GET /api/tenant-config is
    wrong. This is very likely a side effect of the recent QA
    docker-compose/image-tag redeploy work referenced in this repo's recent
    commit history (69c430ad "add missing image: field to
    docker-compose.qa.yml app service", a3b8244f, 55ce601e closing
    ISS-0717) -- flagged as a hypothesis from the git log, not confirmed by
    inspecting the QA compose file/env directly, which is out of scope for
    UAT-RUNNER to fix.

new_finding_broken_oidc_authority:
  title: "Live QA backend's GET /api/tenant-config advertises oidc_authority=http://localhost:8082/realms/bpm-default instead of the real QA Keycloak -- breaks login for every real user on QA right now, not just PLATFORM_ADMIN"
  severity: BLOCKER
  scope_note: >
    Not a REQ-369-specific defect and not confined to PLATFORM_ADMIN --
    OidcCallbackPage/AuthProvider redirects EVERY unauthenticated visitor
    to whatever /api/tenant-config's oidc_authority says, so this currently
    breaks the entire real login flow on https://qa.bizdala.com for any
    real browser (any real user's machine has nothing listening on
    localhost:8082). Flagging with BLOCKER severity given that blast
    radius, distinct from and broader than REQ-369's own AC6/AC7 scope.
  evidence: >
    - Playwright trace network log: redirect target observed was
      http://localhost:8082/realms/bpm-default/protocol/openid-connect/auth?...
    - Direct curl (x2, cache-control: max-age=0 must-revalidate) of
      https://qa.bizdala.com/api/tenant-config?host=qa.bizdala.com:
      oidc_authority="http://localhost:8082/realms/bpm-default"
    - Direct password-grant against the REAL QA IdP
      (https://auth.qa.bizdala.com/realms/.../token) with the same
      credential succeeded (HTTP 200), proving Keycloak itself is healthy
      and the credential is valid -- isolating the defect to the backend's
      advertised authority value only.
    - lib/letflow/routers/tenant_config.ex:167,312-316 read directly:
      idp_base_url/0 falls through to the localhost:8082 default when none
      of BPM_IDP_BASE_URL/KEYCLOAK_BASE_URL/compiled :oidc issuer resolve.
  disposition: >
    New, genuine, live QA defect discovered by this run -- not the
    credential-access gap the prior two runs hit, not a stale-report replay.
    Blocks BOTH AC6 (no real end-to-end PLATFORM_ADMIN login is currently
    possible via a real browser against QA) and AC7 (the named
    pipeline_test's real-OIDC-redirect login step fails for the same
    reason, confirmed reproducible on two separate runs of the same
    command). Routing to ORCH for triage -- almost certainly an
    infra/deployment env-var gap on the QA app service (BPM_IDP_BASE_URL
    not set, or set incorrectly, after the recent QA redeploy), not an
    application code defect and not something UAT-RUNNER should attempt to
    fix by editing lib/ or infra config itself.

