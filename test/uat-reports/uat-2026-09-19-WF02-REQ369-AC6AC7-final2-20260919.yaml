ac7_disposition: >
  NOT SATISFIED. The named pipeline_test
  (web/tests/e2e/pipelines/platform-login-routing-by-role.pipeline.e2e.spec.ts)
  was run twice against live QA with real, valid PLATFORM_ADMIN credentials
