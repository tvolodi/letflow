  both runs produced a real FAIL:
  `Error: page.waitForURL: net::ERR_CONNECTION_REFUSED` at helpers.ts:146,
  because the app's real off-origin redirect target
  (http://localhost:8082/...) is unreachable from any real browser, exactly
  as it would be for a real end user. The scenario file's own
  PLATFORM_ADMIN branch assertion is correct and unchanged (verified by
  reading, see scenario_file_check). This is a new, previously-unreported
  blocker distinct from ISS-0711/0712/0713, all three of which remain
  correctly resolved -- the pipeline_test itself is fine; the live system
  under test currently is not.

overall_verdict: >
  REQ-369's application code (PlatformDashboardPage, the role-conditional
  OidcCallbackPage redirect, the ISS-0711 tenant-count fix) is not in
  question here -- nothing in this run contradicts any of that. What
  blocks AC6 and AC7 is a NEW, live, genuine QA-deployment defect
  (oidc_authority misconfigured to localhost:8082) that breaks the entire
  real login flow for QA, discovered only because this run had, for the
  first time, both real credential access AND ran the actual real-redirect
  login path all the way through instead of stopping at the credential
  step. REQ-369 should remain status: blocked. Recommend ORCH route
  new_finding_broken_oidc_authority to infra/deployment triage (likely
  BPM_IDP_BASE_URL missing or wrong on the QA app service after the recent
  docker-compose.qa.yml / image-tag redeploy work) as its own issue, with
  BLOCKER severity given it breaks all real QA logins, not just
  PLATFORM_ADMIN -- and only after that is fixed and confirmed live should
  UAT-RUNNER re-attempt this same AC6/AC7 re-verification.

