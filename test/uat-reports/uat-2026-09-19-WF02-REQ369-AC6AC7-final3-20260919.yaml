step1_cd_deploy_verification:
  claim_under_test: >
    REQ-370's close-out and ISS-0720/T-0138 both claim commit fc55e700
    "landed on QA's live deployment via the normal CD pipeline." This run
    independently checked that claim via `gh run list`/`gh api` rather than
    trusting it.
  finding_DEPLOY_DID_NOT_HAPPEN: >
    FALSE AS CLAIMED. fc55e700's own push-triggered CI run
    (35423462664) FAILED -- not on anything related to the tenant_config.ex
    fix, but on an unrelated `mix letflow.check_issue_refs` lint violation:
    `[R2] docs/issues/ISS-0721.yaml:93` and `docs/issues/ISS-0722.yaml:70`
    still use the superseded `github_issue_number:` field name instead of
    `github_ref:`. Because .github/workflows/cd.yml's "Deploy to QA" job
    is gated `if: github.event.workflow_run.conclusion == 'success'`, the
    CD run triggered for fc55e700 (databaseId 35423516755) was entirely
    SKIPPED -- confirmed via `gh api .../35423516755/jobs`: `"steps":[]`,
    the job never executed any step, including the actual SSH deploy.
    Independently confirmed fc55e700's own "Detect changed paths" step DID
    correctly compute backend=true (verified via
    `gh run view --job=105845218007 --log`, showing
    `echo "backend=true" >> path-filter-outputs.txt`), i.e. this commit
    WOULD have deployed had CI passed -- the skip is not a false negative
    on path detection, it is the CI failure gate doing exactly what it is
    designed to do.
    .
    The two commits merged after fc55e700 (36376897, docs/handoffs-only;
    705f70fe, docs/ISS-0723-only) both had their own CI pass and their own
    CD run execute the job -- but in both cases the "Deploy to QA
    (ubuntu-16gb-nbg1-1)" STEP itself shows `"conclusion":"skipped"` (per
    `gh api .../35423677501/jobs` and `.../35423835272/jobs`), because
    change-detection is computed per-push against that push's own diff
    only, and neither of those two docs-only commits touched
    backend/frontend paths. Neither commit "picked up" fc55e700's earlier,
    un-deployed backend change -- there is no catch-up mechanism in this
    CD design for a deploy that was skipped by an earlier CI failure.
    .
    The last CD run whose "Deploy to QA (ubuntu-16gb-nbg1-1)" step actually
    EXECUTED (not skipped) is run 35419958545 (commit 10ca7a48, "chore
    (router): re-trigger T-0134 QA redeploy verification"), which ran at
    2026-09-19T03:56:44Z, real duration 56s -- this PREDATES fc55e700's own
    push-triggered CI run (createdAt 2026-09-19T05:15:19Z, matching
    fc55e700's commit timestamp 2026-09-19T10:15:17+05:00 =
    2026-09-19T05:15:17Z). No CD run after 10ca7a48 has executed a real
    (non-skipped) "Deploy to QA" step as of this run's own check (`gh run
    list` covering every CD run through 705f70fe, the current main HEAD at
    dispatch time).
  conclusion: >
    QA's currently-running backend process almost certainly does NOT
    contain fc55e700's tenant_config.ex code fix. The correct
    oidc_authority observed in step 2 below is attributable to the
    infra-side mitigation (T-0137, BPM_IDP_BASE_URL set directly in QA's
    .env) alone -- the old, pre-fix code path already checks
    `System.get_env("BPM_IDP_BASE_URL")` first (per the prior
    final2-20260919 report's own source citation of
    lib/letflow/routers/tenant_config.ex:312-316), so setting that env var
    directly is independently sufficient to produce a correct
    oidc_authority even without fc55e700 deployed. This is a genuine,
    new, separately-actionable finding: ISS-0720/T-0138's own close-out
    text overstates what actually reached QA, and the CI gate is currently
    silently dropping deploys behind an unrelated docs-lint failure with
    no automatic re-drive. NOT filed as a new issue by this run per this
    agent's mandate ("does not fix, files back to ORCH") -- reported here
    for ORCH to route (recommend: either fix docs/issues/ISS-0721.yaml and
    ISS-0722.yaml's `github_issue_number:` -> `github_ref:` fields and
    push a trivial commit to re-trigger a real backend deploy, or manually
    re-run CD for a commit at/after fc55e700 once CI is green).

