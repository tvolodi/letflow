  EO-003), independently verified against live QA with real HTTP calls and
  a real, independently-read ground-truth grading check (not the API's own
  self-report taken on faith) -- no mocks, no absence-of-error treated as a
  pass. The GUI leg of every step remains BLOCKED/UNBUILT_FEATURE, per this
  scenario file's continued lack of a `pipeline_test:` key -- this run did
  NOT drive the actual web/ frontend and does not claim to have observed
  the rendered countdown widget or result screen with its own eyes; per
  this run's own dispatch instructions, that substitution is reported
  plainly here rather than silently made. A GUI-driving pass (adding a
  `pipeline_test:` entry to this scenario naming an actual Playwright spec,
  such as an adaptation of the existing web/tests/e2e/exam-taking.e2e.spec.ts
  family to this scenario's own id/flow) remains a real, separate gap for a
  future run, not something this run can close on its own.

  Real progress relative to the prior BLOCKED run
  (test/uat-reports/uat-2026-09-19-WF03-ISS0690-BILIMBAGA-20260919.yaml):
  both of that run's two identified blockers (AC2 seed-data gap; ISS-0718
