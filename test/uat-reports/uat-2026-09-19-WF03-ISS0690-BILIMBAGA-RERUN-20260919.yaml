new_findings: >
  Two new, real, independently-observed defects filed this run (neither a
  duplicate of any existing docs/issues/ entry -- checked first):
    1. ISS-0721 (MAJOR): a newly-provisioned tenant has no entity-record
       event types registered (Letflow.Entities.EventTypes.seed!/1, REQ-228,
       is never called by tenant provisioning or any HTTP route) -- every
       entity record write 500s with :unknown_event_type until an operator
       manually seeds it via a remote console. Worked around this run via
       exactly that manual ops step; not a durable fix. Same class of gap
       as ISS-0072 (already resolved for the engine's own event types) but
       for a separate, still-unwired seed function.
    2. ISS-0722 (MAJOR): Letflow.Exam.Session's fetch_question_pools/2
       (lib/letflow/exam/session.ex ~line 744) only handles
       exam_question_rule mode "random" -- mode "manual" (reading from the
       real, pack-installable exam_manual_question join entity) is silently
       ignored, producing a session with zero materialized questions and no
       error anywhere. Worked around this run by using mode "random"
       instead for the seeded exam; not a durable fix.
  Neither finding blocks this scenario's own PASS verdict (the scenario's
  own exam was seeded around mode "random", sidestepping ISS-0722, and the
  event-type gap was worked around during seeding before this run's actual
  candidate-flow verification began) -- both are reported as new,
  independently-discovered platform gaps per this role's standing duty to
  report what is found, not just what the dispatched scenario itself
  targets.

verdict: >
