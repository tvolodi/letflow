ground_truth_verification: >
  To independently confirm EO-003 ("the score shown matches a correct
  grading of the candidate's actual answers") rather than trusting the
  API's own self-reported score, the real `is_correct` value for all four
  answer options was read directly off the running instance -- not
  inferred, not assumed from option wording. Since CANDIDATE's own token
  cannot see this field (by design; confirmed live: POST /entities/query
  with the candidate token against entity_type "answer_option" returned a
  real 403 Forbidden, trace_id 5dfea85c-6f17-461b-a8e5-e058ba1f995f, and
  the newly-seeded bilimbaga-admin-user credential did not authenticate,
  per credential_acquisition above), ground truth was instead read via the
  production node's own remote console (real ops-level query against the
  live running system, not a mock, not a fixture, not a hypothetical):
    ssh ubuntu-16gb-nbg1-1
    sudo docker exec letflow-qa-app-1 /app/bin/letflow rpc \
      'Letflow.Entities.Record.Latest.get(<option_id>, "answer_option",
       "tenant_6ab093a1d19040639543d66b80d261a1")'
  Real, live results for all four options:
    088462ad-97bb-4b58-9eb8-4f471a871f4a "Evacuate via the nearest exit"
      -> is_correct = true
    24f0f881-ecfa-4844-ae11-74d2d65f9bb8 "Finish what you are doing first"
      -> is_correct = false
    c4be0c3e-580a-4d6d-891f-377f35cc819a "Red"
      -> is_correct = true
    40613d57-c2a8-4242-8136-c6c7f7c879b4 "Blue"
      -> is_correct = false
  The candidate's submitted answers (088462ad..., c4be0c3e...) are exactly
  the two options recorded as is_correct = true. A correct grading of two
  correct answers out of two questions is 100%, at or above the exam's own
  passing_score_pct (70.0) -> pass. The API's real, live response
  (percentage: 100.0, passed: true, total_score: 2.0/2.0) matches this
  ground truth exactly. This is a genuine, independently-derived
  confirmation, not a restatement of the API's own claim about itself.

