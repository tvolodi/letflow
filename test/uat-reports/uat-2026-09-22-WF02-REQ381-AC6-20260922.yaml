environment:
  kind: local (stood up by UAT-RUNNER for this run — no ORCH-supplied base_url/
    credential_source was in this dispatch; this was a direct handoff from another
    agent, not a WF-05 ORCH dispatch, so the "Environment target" section's
    required-field check does not apply to this run)
  postgres: docker compose (root docker-compose.yml), worktree-scoped port 5481
  keycloak: docker compose (root docker-compose.yml), worktree-scoped port 8092,
    realm bpm-default imported from priv/keycloak/realms, admin-user/admin-pass
    confirmed to carry role PLATFORM_ADMIN (decoded real JWT)
  backend: mix run --no-halt, port 4000, confirmed healthy via GET /health -> 200
