attempts:
  - attempt: 1
    verdict: FAIL
    failing_step: "01: onboard SwiftRoute and Vortex, each a genuinely separate tenant"
    observed_evidence: >
      POST /api/v1/onboarding (real HTTP, real backend) returned 500. Backend log:
      Postgrex.Error 42P01 undefined_table -- relation
      "tenant_c5d69db588ed4f34a433896911ba751a.users" does not exist, raised inside
      Letflow.Plugs.AuthPipeline.provision_user/3 while authenticating the bpm-default
      admin-user's own request.
    root_cause: >
      ENVIRONMENT gap, not a REQ-387 or spec defect. This worktree's Postgres container
      had been freshly re-created since the last session (its `tenants` table held zero
      rows before `mix ecto.migrate` ran a seed migration inserting the bpm-default
      tenant's row id c5d69db5-88ed-4f34-a433-896911ba751a) but the bpm-default tenant's
      actual per-tenant Postgres schema (tenant_c5d69db588ed4f34a433896911ba751a, with
      its `users` table) was never provisioned -- confirmed directly: `\dn` on the dev
      database showed only the `public` schema, and `SELECT * FROM tenant_schemas`
      returned 0 rows. `mix letflow.seed`'s own moduledoc (lib/mix/tasks/letflow.seed.ex)
      confirms this exact gap by name (ISS-0276: "No code path creates this row
      automatically on a fresh dev database") -- UAT-RUNNER had run `mix ecto.migrate`
      but not `mix letflow.seed` before the first attempt.
    fix_applied: >
      Stopped the running backend (port conflict), ran
      `LETFLOW_DEV_DB_CONFIRMED=1 mix letflow.seed` (idempotent, per its own moduledoc)
      -- output: "mix letflow.seed: OK -- bpm-default tenant already present,
      re-provisioned/re-verified (id c5d69db5-...), schema
      tenant_c5d69db588ed4f34a433896911ba751a migrated and role-seeded." Confirmed via
      direct SQL: `\dn` now lists tenant_c5d69db588ed4f34a433896911ba751a, and
      `SELECT count(*) FROM tenant_c5d69db588ed4f34a433896911ba751a.users` returns 0
      (table exists, empty). Restarted the backend, confirmed /health 200 again.

