    root_cause: >
      SPEC-AUTHORING BUG, not a REQ-387 implementation defect, and broader than the
      disclosed "second Keycloak user" risk the handoff flagged. Read
      lib/letflow/routers/onboarding.ex's handle_create/1 and provision_and_bind/3 (and
      the onboarding_map/1 response allowlist, lines 244-256) directly: the real,
      shipped POST /api/v1/onboarding response is exactly 5 keys -- id, tenant_id, slug,
      hostname, created_at -- there is no admin_user_id and never has been (unmodified
      by REQ-387's diff; `git diff --name-only main...HEAD` does not list
      onboarding.ex, tenant_onboarding.ex, or identity.ex). Further: the request body's
      admin_email/admin_username/admin_display_name fields are accepted by the create
      schema validator but then discarded -- handle_create/1's create_attrs is built via
      `Map.take(attrs, ["slug", "display_name"])`, dropping every admin_* field.
      TenantOnboarding.provision_and_migrate/1 (the function actually invoked) only
      provisions the tenant's Postgres schema, replays its migrations, and seeds
      platform roles -- grepped for admin_email/admin_username/admin_user anywhere in
      onboarding.ex, tenant_onboarding.ex, identity.ex: zero hits. The real onboarding
      endpoint, as shipped, creates NO Keycloak user at all -- not the dispatcher, not
      just the "second" ops user the handoff's disclosed risk was about. The spec's
      design (and its inherited assumption from REQ-384's own design doc, restated in
      this spec's own header comment: "REQ-384's onboarding path provisions exactly one
      admin user per tenant") does not match the real, currently-shipped behavior.

overall_verdict: FAIL -- spec-authoring bug, not a REQ-387 implementation defect
recommended_action: >
  Route back to TEST-DESIGNER/FRONTEND-DEV, not ELIXIR-DEV. The spec's
  onboardTenantWithAdminToken() (attachment-cross-tenant.pipeline.e2e.spec.ts lines
  102-157) needs to stop assuming onboarding returns admin_user_id or creates any
  Keycloak user. Two fixes needed together: (1) after a successful onboarding POST,
  create the FIRST/admin user directly via the Keycloak Admin API
  (POST /admin/realms/:realm/users), the same technique the file's own
  createSecondRealmUser() (lines 167-218) already uses and already disclosed as a
  deviation for the second user -- it needs applying to the first user too, since no
  HTTP route provisions any tenant user today; (2) drop the adminUserId-from-response
  path and the reset-password-by-id call that depends on it, replacing it with the
  create-then-set-password flow createSecondRealmUser() already established. This is a
  real, live-verified finding (not the previously-disclosed risk, which was specifically
  about the SECOND user -- the first user's assumption was independently wrong too, and
  this run is what surfaced it), not something to route around by re-guessing a field
  name. Once fixed, this same worktree's live stack (backend/Postgres/Keycloak all still
  up and correctly seeded, per this run's fix) is ready for an immediate re-run.
