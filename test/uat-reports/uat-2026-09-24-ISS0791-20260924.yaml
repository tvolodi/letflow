  - "ISS-0816's 50-row truncation was confirmed by direct source inspection (backend default_page_size=50 constant + frontend's un-paginated read) cross-checked against this run's own live envelope shape, not by actually populating a group with 51+ real members and observing a live truncated response -- doing so would have required creating 50+ additional real Keycloak-backed users, judged out of proportion to this run's scope."
  - "One scratch artifact, group ca9bde31-ff91-4243-b436-861b8f5c3da6 (uat-groups-pagination-probe, empty, created for a pagination probe that was not carried out), was cleaned up via a real DELETE before this run ended -- GET /api/v1/identity/groups afterward confirms the bpm-default tenant is back to its original 2 seeded role-groups. The backend process (LETFLOW_DEV_DB_CONFIRMED=1 mix run --no-halt) was left running in the background on port 4000 at the end of this run, since it is the shared dev instance for this workspace rather than something this run stood up in isolation."

