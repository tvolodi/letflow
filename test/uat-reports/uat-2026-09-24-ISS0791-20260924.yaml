  - id: AC-6-authz-enforcement
    check: "each of the six group routes enforces :GroupsManage -- a real token lacking it (operator-user, PROCESS_OPERATOR) is rejected"
    verdict: PASS
    evidence: >
      All six routes tested with operator-user's real bearer token, all
      returned 403 (one full body captured):
        GET  /api/v1/identity/groups                          -> 403
        POST /api/v1/identity/groups                          -> 403
        DELETE /api/v1/identity/groups/:id                    -> 403
        POST /api/v1/identity/groups/:id/members               -> 403
        DELETE /api/v1/identity/groups/:id/members/:user_id    -> 403
        GET  /api/v1/identity/groups/:id/members               -> 403
      Full body for the first: {"status":403,"type":"https://bpm.example.com/problems/forbidden","title":"Forbidden","trace_id":"17bf1327-6b38-407c-aeb0-7ef50547fa9d","detail":"insufficient permissions"} --
      a real RFC 9457 problem document, not a silent pass-through or a
      network-level failure.

diagnostic_findings:
  - id: ISS-0811-live-check
    summary: "ISS-0811's symptom (Members column always reads 0) IS reproducible on this live surface."
    evidence: >
      Live GET /api/v1/identity/groups response bodies (both before and
      after the create/delete probes) never include an is_system or
      member_count key at all -- confirmed from the raw JSON captured
      above. web/src/types/api.ts:450 still declares `is_system: boolean`
      (required, non-optional) on the Group interface even though the real
      backend (lib/letflow/identity.ex's group_map/1, unchanged by
      ISS-0765) never emits it; member_count is now typed optional
      (`member_count?: number`, api.ts:451) and GroupsPage.tsx:28-29's
      `groupMembers()` reads `group.member_count ?? 0`, so it silently and
      correctly falls back to 0 for every group -- which IS the reported
      "always 0" symptom, just no longer via a runtime type violation for
      that one field. is_system remains a live required-but-never-sent
      field mismatch. Not fixed this run per the dispatch's explicit
      "diagnostic evidence only, do not fix" instruction.

  - id: ISS-0816-live-check
    summary: "ISS-0816's symptom (members list truncates at 50) is real and reproducible by construction, confirmed from both ends live -- not independently reproduced with 51+ real members this run (see notes)."
    evidence: >
      Backend: lib/letflow/api/pagination.ex:51 `@default_page_size 50`,
      confirmed live by this run's own AC-2/AC-3/AC-4 GET .../members calls
      (issued with no page_size param) each returning next_cursor: null and
      a small count -- consistent with, but not by itself proof of, the
      50-row default (this group never held more than 1 member, so the
      cutoff itself was never hit). Frontend: GroupsPage.tsx:55-56 calls
      `groupsApi.members(activeGroupId)` with no page_size/cursor argument
      and GroupsPage.tsx:60 reads only `membersPage?.items` -- next_cursor
      is read nowhere in the file, so a group whose real membership exceeds
      the default page size of 50 will silently show only the first 50.
      This matches ISS-0816's own fix_direction note verbatim. Confirmed
      the paginated envelope itself carries no has_more field (only items/
      next_cursor/count, per AC-2's evidence), consistent with ISS-0816's
      description of Letflow.Api.Pagination.Page's real shape.

overall_verdict: PASS
summary: >
  All six group routes (list, create, delete, addMember, removeMember,
  members) work end-to-end against a real running instance: real HTTP
  requests to the real /api/v1/identity/groups/* prefix, real 2xx/204
  responses, real resulting Postgres state in the tenant schema
  (tenant_a06398cf42f34e08b98ccd14774448e3.groups /
  .group_members), and the old dead /api/v1/admin/groups/ prefix
  independently confirmed 404. The members envelope is the paginated
  {items, next_cursor, count} object ISS-0765 retyped GroupMemberPage to,
  not a bare array. Authorization enforcement was independently confirmed
  on all six routes with a real token that genuinely lacks GroupsManage
  (403, real problem+json body, not a silent allow). ISS-0765's fix has
  real end-to-end evidence for the first time. ISS-0811 and ISS-0816's
  symptoms were both confirmed live/by direct code+response inspection, as
  diagnostic evidence for those separate, still-open issue records --
  neither was fixed in this run.

