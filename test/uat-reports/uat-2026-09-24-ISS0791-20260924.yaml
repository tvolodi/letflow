  - id: AC-3-add-member
    check: "POST .../groups/:id/members adds a real member, visible both via API and in the real DB"
    verdict: PASS
    evidence: >
      POST .../groups/021dcc6f.../members {"user_id":"6aa5b401-bcb5-4482-9240-d3a5fdc50159"}
      -> 201 {"created":true,"group_id":"021dcc6f...","user_id":"6aa5b401..."}.
      Follow-up GET .../members -> {"items":[{"...worker-user...}],"next_cursor":null,"count":1}.
      Direct Postgres query against the real tenant schema
      (tenant_a06398cf42f34e08b98ccd14774448e3.group_members, via
      `sudo docker exec letflow-1-postgres-1 psql`) shows the real row:
      group_id=021dcc6f-d1e9-414f-b053-fcbb949b0f27,
      user_id=6aa5b401-bcb5-4482-9240-d3a5fdc50159, inserted_at=2026-09-24 20:23:36.

  - id: AC-4-remove-member
    check: "DELETE .../groups/:id/members/:user_id removes the real member, in both API and DB"
    verdict: PASS
    evidence: >
      DELETE .../groups/021dcc6f.../members/6aa5b401... -> 204 No Content.
      Follow-up GET .../members -> {"items":[],"next_cursor":null,"count":0}.
      Direct Postgres query on the same group_members table for that
      group_id -> 0 rows.

  - id: AC-5-delete-empty-group
    check: "DELETE .../groups/:id deletes an empty group, in both API and DB"
    verdict: PASS
    evidence: >
      DELETE .../groups/021dcc6f... -> 204 No Content. Follow-up GET
      /api/v1/identity/groups no longer lists it (back to the original 2
      seeded role-groups, total:2). Direct Postgres query against
      tenant_a06398cf42f34e08b98ccd14774448e3.groups for that id -> 0 rows.
      (A second scratch group, ca9bde31-ff91-4243-b436-861b8f5c3da6, was
      also created and left in place for follow-up members-pagination
