acceptance_criteria_checked:
  - id: AC-1-list
    check: "GET /api/v1/identity/groups hits the real route, not the dead /api/v1/admin/groups/ prefix"
    verdict: PASS
    evidence: >
      Real HTTP GET http://localhost:4000/api/v1/identity/groups with
      admin-user's real bearer token -> 200 OK,
      {"items":[{"...","display_name":"role-PLATFORM_ADMIN","id":"44e5ff63-7c23-49fd-8c54-dccb217aa480","name":"role-PLATFORM_ADMIN"},{"...","display_name":"role-TASK_WORKER","id":"fe1b8e49-47df-44e7-9e84-559a399c23c5","name":"role-TASK_WORKER"}],"total":2}.
      Same request against the old dead prefix,
      GET /api/v1/admin/groups/ -> 404 (confirms the old path is genuinely
      gone, not silently still working).

  - id: AC-2-manage-members-open
    check: "GET /api/v1/identity/groups/:id/members returns the paginated envelope {items, next_cursor, count}, not a bare array"
    verdict: PASS
    evidence: >
      GET http://localhost:4000/api/v1/identity/groups/021dcc6f-d1e9-414f-b053-fcbb949b0f27/members
      (freshly created, empty group) -> 200 OK,
