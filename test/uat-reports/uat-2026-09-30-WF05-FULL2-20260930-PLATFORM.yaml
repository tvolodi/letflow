method: >
  Pipeline specs driven with `npx playwright test <spec>` from web/ with
  E2E_BASE_URL=BPM_TEST_URL=https://qa.bizdala.com, BPM_IDP_BASE_URL=https://auth.qa.bizdala.com.
  Failures were re-checked with direct curl calls and, where useful, Playwright traces.
  No mocks, no interception. Scenarios with no pipeline_test were probed over HTTP.
  Preflight corrections applied per ORCH: swiftroute/vortex BAD_CRED entries and
  admin app_roles 403 GAPs treated as resolved. The preflight local_deps GAP for
  renderer-permission-denied-surface was checked and found a false positive (the string
  "docker compose" occurs only in a header comment; the spec imports no db-exec helper),
  so that scenario was run.

summary:
  total: 19
  pass: 2
  fail: 3
  env_blocked: 6      # tenant-switch-cache-isolation is counted here for EO-001; its EO-002/EO-003 PASS
  unbuilt_feature: 8
  result_overall: ENV_NOT_READY

cross_cutting_observation: >
  QA intermittently answers legitimate authenticated requests for tenant bpm-default with
  HTTP 503 {"detail":"tenant at capacity, retry shortly"} (Letflow.Plugs.Admission tenant
  pool, retry-after: 1). Reproduced with plain curl: 20 sequential GET /api/v1/definitions
  all 200; 8 rounds of 3 parallel requests gave 1 x 503 in 24; 3 rounds of 5 parallel
  mixed calls gave 3 x 503 in 15. A browser session (about 5 concurrent API calls on page
  load) hits it routinely: the Definitions page rendered "Something went wrong loading
  this content" and the header "Unknown workspace" (tenant lookup failed) during this run.
  This made several specs flaky early in the run (login-routing, template-update,
  rollback, branding); the results below are from clean re-runs and each states its own
  pass rate. Other UAT slices were likely running against the same tenant concurrently, so
  part of this may be load, but a cap that rejects at 3 parallel requests is itself a finding.

scenarios:

  - id: platform-login-routing-by-role
    verdict: PASS
    branches_run: [PLATFORM_ADMIN (PASS), TASK_WORKER (PASS), unauthenticated (PASS)]
    evidence: >
      Final two clean runs: 3 passed (12-13s). PLATFORM_ADMIN admin-user landed on the
      platform dashboard with tile-tenant-count; TASK_WORKER worker-user landed on the
      workspace root with tile-definitions/instances/tasks and narrower nav;
      unauthenticated visit redirected off-origin to Keycloak. Direct API check with the
      worker token: GET /definitions 200, /instances 200, /tasks/inbox 200,
      /tenants/bpm-default 403 (expected for TASK_WORKER). This resolves the 2026-09-29
      FAIL (TASK_WORKER 403 on all tenant APIs), consistent with the ISS-0886 backfill.
    note: >
      Flaky under load: earlier runs failed the TASK_WORKER or PLATFORM_ADMIN branch when
      the SPA's API calls got the 503 above (see cross_cutting_observation).

  - id: platform-tenant-branding-applied
    verdict: FAIL
    evidence: >
      Spec (3 tests): EO-001/AC1 live swatch passed in the last run; EO-003/AC2 and EO-005
      failed with --color-brand-600 = "#228be6" where "#1864ab" was expected (after the
      spec's seed PATCH). Independent check: PATCH /api/v1/tenant/settings
      {"settings":{"brand_colors":{"primary":"#1864ab"}}} as admin-user returned 200 with
      body {"settings":{},"tenant_id":"fa2c7dbb-..."} (colour dropped, not persisted);
      GET /api/v1/tenant/settings returns 404; GET /api/tenant-config?host=qa.bizdala.com
      still returns brand_colors.primary "#228be6".
    diagnosis_hint: >
      Tenant settings PATCH accepts brand_colors with 200 but persists nothing, and there
      is no GET for it, so the colour cannot survive a reload.
    maps_to_existing_issue: ISS-0887

  - id: platform-template-update-conflict-resolution
    verdict: PASS
    evidence: >
      Last 3 untraced runs and 1 traced run: 1 passed (5.8-9.5s). Trace network shows
      POST /solution-packs/<id>/update-review 200 (x3) and update-apply 200; the spec's
      in-test assertions confirm own adaptations survive a pack update, unresolved
      conflicts block apply, and resolutions are not re-flagged.
    note: >
      Failed 4 earlier runs at step 03 ("Failed to prepare the update review" shown in
      the UI, waitForURL timeout) during the load window described above.

  - id: platform-definition-promotion-rollback
    verdict: FAIL
    evidence: >
      Untraced runs: 5 of 6 failed at step 02 ("start an in-flight case on the released
      version"): after typing the process key into the Start Instance dialog, the
      read-only input start-definition-version stayed "" for 10s (24 polls) where "2.0.0"
      was expected. One traced (slower) run passed in full (10.8s). Direct API check:
      GET /api/v1/definitions/active/<key> returns 200 for the fixture keys, so the
      backend resolves the active version; the field is not populated in the SPA. Two
      further runs failed with "v1 create failed: 503 tenant at capacity".
    diagnosis_hint: >
      The race described in ISS-0891 (Start Instance dialog version field vs. active
      definition lookup, InstanceBoardPage.tsx) still reproduces on QA. ISS-0891 is marked
      resolved (fix 8c73f1df) but QA exposes no build SHA, so either the fix is not
      deployed or it does not cover this timing-sensitive path.
    maps_to_existing_issue: ISS-0891 (resolved, recurrence on QA)

  - id: platform-renderer-permission-denied-surface
    verdict: FAIL
    evidence: >
      renderer-states.pipeline.e2e.spec.ts (1 test, 3 attempts, 50s each) passed steps 1-4
      (operator-user's PROCESS_OPERATOR group membership revoked by admin-user; the very
      next request to /dlq was denied and rendered "You do not have access to this
      area. Contact your tenant administrator."; nav and direct-URL screens were
      identical). It failed at step 5: after following the "My Tasks" link, /tasks
      rendered the same PermissionDenied message instead of the operator's own task
      list, so getByTestId('task-inbox-list') was never attached (spec line 381).
      Membership was restored afterwards (operator-user: GET /dlq 200, /tasks/inbox 200).
    diagnosis_hint: >
      While operator-user's only group is revoked, GET /tasks/inbox is refused as well,
      so the "return to your own work" leg cannot succeed. Either the QA operator-user
      fixture lacks a second group granting task inbox access (spec assumes local-dev
      fixture parity) or the task inbox should be reachable by any authenticated user.
    maps_to_existing_issue: none (new; ISS-0899 authored the spec)

