new_defects:
  - id: D1
    severity: BLOCKER
    title: "Seeded meridian/vortex service-task endpoints fail with request_build_error, sending every instance to ERROR at its first service task"
    evidence: >
      Loan Origination kyc-aml-check ('POST /kyc/screen'), Supplier Quality Deviation quarantine-batch ('POST /mes/batches/{batch_ref}/quarantine'),
      Production Order Release assign-line ('POST /mes/orders/{order_id}/assign'): instance status ERROR within ~3s, error_detail.error_type service_task_retries_exhausted,
      details.last_failure_kind request_build_error, reason 'service task failed (request_build_error): not retriable' (5 of 6 instances). Endpoint attributes are method+relative path
      (and unresolved {placeholders}), no absolute URL / no stub target, so lib/letflow/engine/service_task.ex cannot build the request (see url_template handling ~line 193).
    impact: "No meridian/vortex scenario can reach completion; EOs on end nodes, service-task audit, routing after the first service task are all unverifiable."
    suggested_owner: "ELIXIR-DEV / whoever owns scripts/seed_{meridian,vortex}_definition.sh payloads (ISS-0897) -- give seeded service tasks a resolvable target (mock/stub service in QA or absolute endpoint)."
  - id: D2
    severity: MAJOR
    title: "Role groups referenced by seeded meridian/vortex HUMAN_TASKs do not exist; actors cannot see or claim their tasks"
    evidence: "GET /identity/roles and /identity/groups in both tenants list only the six platform roles. Tasks carry assignee_type ROLE / assignee_ref role-credit-manager etc.; actor-meridian-ben, -miriam, actor-vortex-sabine GET /tasks/inbox -> count 0; claim -> 409 'caller does not hold the assigned role'."
    impact: "Analogous to the swiftroute persona-actor Part B (scripts/seed_swiftroute_persona_actors.sh) but no equivalent exists for meridian/vortex. Scenario actors cannot do their steps as themselves."
  - id: D3
    severity: MAJOR
    title: "Regulatory Compliance Review seed does not implement the 21-day SLA -> BaFin regulatory-auto-escalation path"
    evidence: "risk-evaluation node attributes {role: role-risk-manager} only (no timer duration); advance-timer -> 404; timeout-risk-evaluation edge -> risk-evaluation-timeout -> severity-routing -> findings-sign-off; regulatory-auto-escalation only reachable from post-remediation-check unresolved."
  - id: D4
    severity: MINOR
    title: "POST /tasks/:id/complete returns 500 internal-error when the owning instance is in ERROR status (should be a 4xx/409)"
    evidence: "Loan Origination instance 3b4d6ca7 (ERROR): complete as actor-meridian-ben, actor-meridian-miriam and meridian-admin-user -> HTTP 500, traces d9064e20-f8ed-4814-bf67-759754b4d499, 6f6803e4-bc43-4f9d-8a5a-0af8b86b1856, 13b05c3f-7d3b-475d-8bb7-6828c2cc2a71."
  - id: D5
    severity: MAJOR (possible, security-adjacent; needs ORCH/SECURITY-REVIEWER triage -- may be by design)
    title: "Task claim enforces ROLE assignment but task complete does not"
    evidence: "actor-meridian-claudia, actor-vortex-sabine, actor-vortex-stefan (TASK_WORKER, not members of the assigned role) each completed a ROLE-assigned PENDING task with HTTP 200 without claiming; the same actors get 409 'caller does not hold the assigned role' on claim."
  - id: D6
    severity: MAJOR
    title: "Vortex entity types/batches not seeded; vortex-entity-list scenario has no data or matching pipeline_test"
    evidence: "GET /entities/definitions -> items:[] (admin and karl); POST /entities/query production_batch -> items:[]. Already flagged as ISS-0912's possible follow-up."
recommended_actions:
  - "Route D1 (BLOCKER) first: without a resolvable service-task target no meridian/vortex process can complete on QA."
  - "D2: add meridian/vortex persona-role seeding analogous to seed_swiftroute_persona_actors.sh (role groups + actor memberships)."
  - "D3: revise the Regulatory Compliance Review definition (timer on risk-evaluation, timeout edge to regulatory-auto-escalation) or the scenario."
  - "Re-run the 7 scenarios after D1/D2 (and D3 for bafin) land."
