    verdict: FAIL
    evidence: >
      renderer-states.pipeline.e2e.spec.ts, 1 test, failed at step 5 (spec line 381): after operator-user
      PROCESS_OPERATOR group membership was revoked, steps 1-4 behaved (very next /dlq request denied,
      PermissionDenied "You do not have access to this area..." rendered, nav and direct URL identical),
      but following "My Tasks" rendered the same PermissionDenied and getByTestId('task-inbox-list') was
      never attached. Identical to FULL2. After the run membership was restored: operator-user GET /dlq 200,
      GET /tasks/inbox 200 (verified).
    diagnosis_hint: >
      With only the PROCESS_OPERATOR group revoked, /tasks/inbox is refused, so operator-user holds no
      TASK_WORKER-granting membership on QA. ISS-0907 (closed_not_applicable) attributed this to the QA data
      gap ISS-0886/ISS-0910 (backfill never created group_members) and asked for a re-run to confirm; the
      re-run still fails, so that remediation is not in effect for operator-user (add TASK_WORKER group
      membership for operator-user on QA, or reopen ISS-0907). Could equally be classed ENV; kept FAIL
      because the scenario literal outcome is contradicted on the live instance.
    maps_to_existing_issue: ISS-0907 (closed_not_applicable; re-run did not confirm remediation), ISS-0910, ISS-0886

