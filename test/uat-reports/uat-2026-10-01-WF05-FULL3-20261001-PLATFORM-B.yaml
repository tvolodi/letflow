  - id: platform-tenant-branding-applied
    verdict: FAIL
    actor_note: "admin-user substituted for actor-platform-admin"
    evidence: >
      Spec: 2 passed (EO-001/AC1 live swatch; ISS-0887 contract test), 2 failed. EO-003/AC2 (line 122) and
      EO-005 (line 174): getComputedStyle --color-brand-600 in the browser is "#228be6" where "#1864ab" was
      expected right after the spec's flat seed PATCH {"brand_colors":{"primary":"#1864ab"}}.
      Independent API checks as admin-user: PATCH /api/v1/tenant/settings now persists (200, body echoes
      brand_colors) -- ISS-0887 write-side fix verified live; GET /api/tenant-config?realm=bpm-default
      returns the saved primary (#0a3d91 after the contract test). But GET /api/tenant-config?host=qa.bizdala.com
      and the no-param GET return the platform default #228be6 with the same saved settings in place; the SPA
      (web/src/auth/tenantConfig.ts fetchTenantConfig) uses ?host=<hostname> unless a realm override is in
      sessionStorage, so the browser never sees the tenant saved colour. GET /api/v1/tenant/settings is 404.
    diagnosis_hint: >
      Saved branding is stored and served by realm lookup, but the host-based tenant-config lookup for
      qa.bizdala.com resolves to a no-tenant/default config (same QA host->tenant mapping family as ISS-0727),
      so a normal SPA load shows default branding. Fix is QA host config (ai-dala-infra) or making the host
      lookup resolve bpm-default; the SPA cannot show saved branding until then.
    maps_to_existing_issue: "ISS-0727 (related, not identical); ISS-0887 (write side resolved)"
    cleanup: >
      Branding left as brand_colors {} via PATCH {"brand_colors":{}} (200). Pre-run stored state was
      empty/unset (FULL2 persisted nothing); tenant-config ?host still serves default #228be6.

